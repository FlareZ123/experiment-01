          node -e "const a=require('node:assert/strict');const r=require('./agent38-factorial-complete-census.json');a.equal(r.registeredNativeArms,64);a.equal(r.fullPhysicalMatches,16);a.equal(r.physicalMismatches,0);a.equal(r.unverifiableStarts,0);a.equal(r.competitiveQualifiedGames,0);console.log('AGENT38_SPECIAL_PLUMERIA_FACTORIAL',JSON.stringify({attempts:r.registeredNativeArms,matched:r.fullPhysicalMatches,energySourceAttackChange:r.sourceSpecialEnergyEffectOnAttackDeclarations,plumeriaWithEnergySettled:r.plumeriaConditionalPhysicalSettlementsWithSpecialEnergy,arms:r.table}));"
