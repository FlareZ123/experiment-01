name: Rank11 authentic same-target Energy selection replay

on:
  workflow_dispatch:
    inputs:
      canonical_v2_only:
        description: Run canonical bilateral v2 source-first both-seat policy using same-target repair
        type: boolean
        default: false
      agent38_plumeria_probe:
        description: 'Run four original source-first canonical Plumeria OFF/ON matched native arms'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-replay:
    if: ${{ !inputs.agent38_plumeria_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Validate same-target correction, seed and classification tests
        run: node --test tests/same-target-attach-energy-hook.test.cjs tests/rank11-exclusive-prospective-seeds.test.cjs tests/rank11-exclusive-trial-classification.test.cjs tests/native-accepted-target-sidecar.test.cjs tests/native-accepted-target-store-observer.test.cjs tests/accepted-energy-prompt-public-witness.test.cjs tests/aichi-open-time-adjudication.test.cjs tests/agent1-source-first-owned-affordances.test.cjs tests/aichi-rank11-direct-hand8.test.cjs
      - name: Install simulator pinned dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned simulator
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Native accepted AttachEnergyPrompt public recipient witness
        if: ${{ inputs.canonical_v2_only }}
        run: node simulation/twinleaf/agent1-rank11-energy-prompt-public-native.cjs > agent1-rank11-energy-prompt-native.json
      - name: Replay original failed seed with and without reversible bot selection fix
        if: ${{ !inputs.canonical_v2_only }}
        run: node simulation/twinleaf/rank11-sametarget-source-replay.cjs > rank11-sametarget-single-seed.json
      - name: Print original exception and actual corrected prompt
        if: ${{ !inputs.canonical_v2_only }}
        run: node -e "const s=require('./rank11-sametarget-single-seed.json'); console.log(JSON.stringify({seat:s.seat,repeat:s.repeat,seed:s.seed,legacyError:s.legacyException,repair:s.correction,actualFirst:s.correctedFirstTurnSlot},null,2))"
      - name: Replay entire originally registered 128-seed frame with explicit same-target bot correction
        if: ${{ !inputs.canonical_v2_only }}
        env:
          SAME_TARGET_ENERGY_CORRECTION: 'true'
        run: node simulation/twinleaf/rank11-exclusive-prospective.cjs > rank11-exclusive-prospective-v1-corrected.json
      - name: Reject incomplete or unverified starts in corrected run
        if: ${{ !inputs.canonical_v2_only }}
        run: node -e "const r=require('./rank11-exclusive-prospective-v1-corrected.json'); console.log(JSON.stringify({total:r.actualAttempted,first:r.sourceFirst,second:r.sourceSecond,verified:r.sourceStartVerified,exceptions:r.exceptions,classes:r.resultClassCounts,botRepairs:r.botSameTargetRepairs,competitiveQualifiedGames:0},null,2)); if(r.exceptions!==0||r.sourceStartVerified!==128||r.botSameTargetRepairs<1||!r.sameTargetCorrectionApplied)process.exitCode=1"
      - name: Run canonical bilateral v2 both-seat same-target correction
        if: ${{ inputs.canonical_v2_only }}
        env:
          AGENT12_SAME_TARGET_ATTACH_DEV: 'true'
          AGENT12_NATIVE_TARGET_SIDECAR_DEV: 'true'
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > canonical-v2-sametarget-sourcefirst.json
      - name: Same-checkout sidecar-disabled control for root invariance
        if: ${{ inputs.canonical_v2_only }}
        env:
          AGENT12_SAME_TARGET_ATTACH_DEV: 'true'
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > canonical-v2-sametarget-sourcefirst-control.json
      - name: Validate original accepted root hashes against unobserved control
        if: ${{ inputs.canonical_v2_only }}
        run: >-
          node -e "const a=require('node:assert/strict');const t=require('./canonical-v2-sametarget-sourcefirst.json'),c=require('./canonical-v2-sametarget-sourcefirst-control.json');
          a.equal(t.rows.length,4);a.equal(c.rows.length,4);
          for(let i=0;i<4;i++){const x=t.rows[i],y=c.rows[i];
          a.equal(x.trial.id,y.trial.id);a.equal(x.sourceDealFingerprint,y.sourceDealFingerprint);
          a.equal(x.rootActionLedgerSha256,y.rootActionLedgerSha256);
          a.equal(x.finished,y.finished);a.equal(x.winner,y.winner);
          if(!x.status){a.ok(x.nativeAcceptedTargetSidecar);
          a.equal(x.nativeAcceptedTargetSidecar.rootOrdinalLinked,true);
          a.equal(x.nativeAcceptedTargetSidecar.targetUnobserved,0);
          a.ok(x.nativeAcceptedTargetSidecar.observedTargetActions>0);}}
          console.log('PHYSICAL_SIDECAR_READONLY_VERIFIED',t.rows.map(x=>({id:x.trial.id,hash:x.nativeAcceptedTargetSidecar?.sha256??null,accepted:x.nativeAcceptedTargetSidecar?.observedTargetActions??null,linked:x.nativeAcceptedTargetSidecar?.rootOrdinalLinked??null})))"
      - name: Preserve every canonical native arm and correction count
        if: ${{ inputs.canonical_v2_only }}
        run: >-
          node -e "const a=require('node:assert/strict');const r=require('./canonical-v2-sametarget-sourcefirst.json');
          a.equal(r.attempted,4);a.equal(r.paperSameTargetAttachEnergyOptIn,true);
          for(const x of r.rows){a.equal(x.qualifiesForCompetitiveInference,false);
          if(!x.status){a.equal(x.paperSameTargetAttachEnergyOptIn,true);
          a.ok(x.paperSameTargetAttachEnergyAudit);}}
          console.log(JSON.stringify({schema:r.schema,attempted:r.attempted,
          errors:r.errors,qualified:r.competitiveQualifiedGames,
          rows:r.rows.map(x=>({id:x.trial.id,status:x.status||'native-complete',
          repaired:x.paperSameTargetAttachEnergyAudit?.repairedPromptCount??null,
          actions:x.actionCount??null,finished:x.finished??null,winner:x.winner??null}))},null,2))"
      - name: Preregistered exact-60 A/B/A native accepted Energy recipient test
        if: ${{ inputs.canonical_v2_only }}
        run: |
          node --test tests/agent41-native-recipient-aba.test.cjs
          node simulation/evaluation/agent41-native-recipient-aba.cjs > agent41-native-recipient-aba.json
          node -e "const a=require('node:assert/strict');const r=require('./agent41-native-recipient-aba.json');a.equal(r.attempts,12);a.equal(r.uniqueOriginalTrials,4);a.equal(r.pairs.length,4);a.equal(r.summary.competitiveQualifiedGames,0);a.equal(r.registration.treatmentProfile,'AGENT44_ACTOR_ENERGY_RECIPIENT_DEV=true');console.log(JSON.stringify({schema:r.schema,runOrder:['A','B','A-repeat'],counts:r.summary,pairs:r.pairs.map(p=>({trial:p.trialId,AB:p.physicalAB.status,root:p.physicalAB.root?.status,prompt:p.physicalAB.energyPrompt?.status,AA:p.physicalARepeat.status,repeatStatus:p.repeatStability.status,firstNativeRoot:p.firstABRootDivergence,firstOutcome:p.original.winner,treatmentOutcome:p.recipient.winner}))},null,2))"
      - name: Preregistered exact-60 paid retreat A/B/A physical root test
        if: ${{ inputs.canonical_v2_only }}
        run: |
          node simulation/evaluation/agent41-native-recipient-aba.cjs --paid-retreat > agent41-native-paid-retreat-aba.json
          node -e "const a=require('node:assert/strict');const r=require('./agent41-native-paid-retreat-aba.json');a.equal(r.schema,'agent41-same-60-native-paid-retreat-aba-v1');a.equal(r.attempts,12);a.equal(r.uniqueOriginalTrials,4);a.equal(r.summary.competitiveQualifiedGames,0);console.log(JSON.stringify({schema:r.schema,counts:r.summary,pairs:r.pairs.map(p=>({trial:p.trialId,AB:p.physicalAB.status,root:p.physicalAB.root?.status,repeatStatus:p.repeatStability.status,firstNativeRoot:p.firstABRootDivergence,paidRetreatEnabled:p.nominalPaidRetreatOptIn,firstOutcome:p.original.winner,treatmentOutcome:p.recipient.winner}))},null,2))"
      - name: Preregistered fresh 32-arm canonical source policy scout
        if: ${{ inputs.canonical_v2_only }}
        run: |
          node --test tests/agent41-prospective-canonical-scout.test.cjs
          node simulation/evaluation/agent41-prospective-canonical-scout.cjs > agent41-prospective-canonical-32.json
          node -e "const a=require('node:assert/strict'); const r=require('./agent41-prospective-canonical-32.json'); a.equal(r.summary.attempts,32); a.equal(r.summary.competitiveQualifiedGames,0); a.equal(r.summary.exceptions+r.summary.censored+r.summary.engineTerminals,32); console.log(JSON.stringify({schema:r.schema,attempts:r.summary.attempts,errors:r.summary.exceptions,censored:r.summary.censored,terminals:r.summary.engineTerminals,actualSourceFirst:r.summary.cells.map(c=>({rank:c.rank,slot:c.candidateSlot,candidate:c.candidateId,sourceFirst:c.actualSourceFirst,failed:c.exceptions,cap:c.capped,finished:c.terminals,sourceAttacks:c.sourceAttackDeclarations,candidateAttacks:c.candidateAttackDeclarations}))},null,2))"
      - name: Fresh paired rank11 source-only Supporter fallback study
        if: ${{ inputs.canonical_v2_only }}
        run: |
          node --test tests/agent41-rank11-source-pass-supporter.test.cjs
          node simulation/evaluation/agent41-rank11-source-supporter-paired-native.cjs > agent41-rank11-source-supporter-paired.json
          node -e "const a=require('node:assert/strict');const r=require('./agent41-rank11-source-supporter-paired.json');const s=r.audit.aggregate;a.equal(s.observedArms,32);a.equal(s.competitiveQualifiedGames,0);a.equal(s.controlTerminals+s.controlCaps+s.controlErrors,16);a.equal(s.treatmentTerminals+s.treatmentCaps+s.treatmentErrors,16);console.log(JSON.stringify(s,null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank11-exclusive-prospective-v1-sametarget-corrected-unqualified
          path: |
            rank11-sametarget-single-seed.json
            rank11-exclusive-prospective-v1-corrected.json
            canonical-v2-sametarget-sourcefirst.json
            canonical-v2-sametarget-sourcefirst-control.json
            agent1-rank11-energy-prompt-native.json
            agent41-native-recipient-aba.json
            agent41-native-paid-retreat-aba.json
            agent41-prospective-canonical-32.json
            agent41-rank11-source-supporter-paired.json
          if-no-files-found: warn
          retention-days: 14

  agent38-plumeria-paired:
    if: ${{ inputs.agent38_plumeria_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Validate canonical Plumeria precedence and paired census
        run: node --test tests/agent7-canonical-actor-composition.test.cjs tests/agent38-plumeria-paired-census.test.cjs tests/agent4-plumeria-after-pass.test.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify both native Plumeria physical seats on pinned Store
        run: node --test tests/agent4-plumeria-pinned-native.test.cjs
      - name: Execute four historical source-first original-60 OFF control arms
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT12_SAME_TARGET_ATTACH_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent38-plumeria-off.json
      - name: Execute same four historical source-first original-60 ON intervention arms
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT12_SAME_TARGET_ATTACH_DEV: 'true'
          AGENT38_CANONICAL_PLUMERIA_AFTERPASS_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent38-plumeria-on.json
      - name: Audit all eight observed or failed native arms without winner inference
        run: |
          node scripts/agent38-plumeria-paired-census.cjs agent38-plumeria-off.json agent38-plumeria-on.json > agent38-plumeria-census.json
          node -e "const x=require('./agent38-plumeria-census.json'); console.log('AGENT38_NATIVE_PLUMERIA',JSON.stringify({attempts:x.registeredAttempts,matched:x.matchedDealAndActualStarter,audits:x.treatedAudits,unobserved:x.treatedMissingAudits,proposed:x.totalProposals,accepted:x.totalAccepted,settled:x.totalSettled,bySeat:x.bySeat,competitiveGames:0}));"
      - name: Verify historic rank6 long-hand Plumeria handoff settled natively
        run: |
          node -e "const a=require('node:assert/strict');const r=require('./agent38-plumeria-census.json');a.equal(r.registeredAttempts,4);a.equal(r.totalAccepted,2);a.equal(r.totalSettled,2);a.equal(r.delegatedPrompts,1);a.equal(r.delegatedSettlements,0);a.equal(r.unresolved,0);a.equal(r.competitivelyQualifiedGames,0);console.log('PLUMERIA_GENUINE_DELEGATED_RECEIPTS',JSON.stringify({accepted:r.totalAccepted,settled:r.totalSettled,delegatedPrompts:r.delegatedPrompts,delegatedSettlements:r.delegatedSettlements}));"
      - name: Retain complete source-first paired Plumeria evidence and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent38-plumeria-canonical-sourcefirst-paired
          path: |
            agent38-plumeria-off.json
            agent38-plumeria-on.json
            agent38-plumeria-census.json
          if-no-files-found: warn
          retention-days: 30
