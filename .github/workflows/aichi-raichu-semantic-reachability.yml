name: Aichi Raichu semantic headless reachability
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aichi-raichu-semantic-reachability
  cancel-in-progress: false
jobs:
  paired-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Paired source ranks 4 and 17 correction reachability
        run: node simulation/twinleaf/raichu-corrected-headless-reachability.cjs
