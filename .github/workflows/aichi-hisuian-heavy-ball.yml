name: Aichi Hisuian Heavy Ball Prize-shuffle fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-prize-shuffle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Reproduce and test Prize-position correction
        run: node --test tests/hisuian-heavy-ball-prize-hook.test.cjs
