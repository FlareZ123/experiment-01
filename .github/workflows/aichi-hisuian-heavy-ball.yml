name: Aichi Hisuian Heavy Ball Prize-shuffle fidelity

on:
  workflow_dispatch:
    inputs:
      source_probe:
        description: Replay the rank-10 source deal with and without the opt-in correction
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  paper-prize-shuffle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Reproduce and test Prize-position correction
        run: node --test tests/hisuian-heavy-ball-prize-hook.test.cjs tests/hisuian-heavy-ball-real-store.test.cjs
      - name: Audit live rank-10 source-dealt Heavy Ball branches
        if: inputs.source_probe
        run: node simulation/twinleaf/hisuian-heavy-ball-source-audit.cjs > heavy-ball-rank10-source.json
      - name: Archive source-game diagnostic and digest
        if: inputs.source_probe
        uses: actions/upload-artifact@v4
        with:
          name: heavy-ball-rank10-source
          path: heavy-ball-rank10-source.json
          retention-days: 14
