name: Twinleaf source decision history rollback research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify exact mutation-only rollback and observer hooks
        run: node --test tests/decision-damage-history-rollback.test.cjs
      - name: Compare source ranked real bot decisions after history rollback
        run: node simulation/twinleaf/decision-damage-history-experiment.cjs
      - name: Verify one-decision corrected clone profile scope
        run: node --test tests/agent49-single-policy-decision.test.cjs
      - name: Localize first source-ranked action difference and one-shot fork
        run: node simulation/twinleaf/single-decision-clone-source-contrast.cjs
      - name: Verify source-zone predecision observer contract
        run: node --test tests/agent49-zones.test.cjs
      - name: Find first source-zone predecision divergence between clone profiles
        run: node simulation/twinleaf/source-predecision-zone-contrast.cjs
