name: Agent4 original v3 two-context UNKNOWN_POWER typed native readout

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Typed replay, post-rejection power, or 24-attempt owner guard'
        type: choice
        options:
          - typed-replay
          - post-rejection-power
          - guarded-veto-pair
          - guarded-public-postabort-root
        default: typed-replay

permissions:
  contents: read

jobs:
  typed-source-abort:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact readout, frozen contexts and independent pure tests
        run: |
          node --check simulation/evaluation/agent4-v3-two-unknown-power-readout.cjs
          node --check simulation/evaluation/agent4-rejected-underworld-public-power-v1.cjs
          node --check simulation/twinleaf/agent4-underworld-door-public-lock-witness.cjs
          node --check simulation/twinleaf/agent4-underworld-visible-thorns-veto.cjs
          node --check simulation/evaluation/agent4-rank6-owner-underworld-veto-paired-24.cjs
          node --check simulation/evaluation/agent4-rank6-underworld-guard-postabort-root-audit.cjs
          node --test tests/agent4-v3-two-unknown-power-readout.test.cjs tests/agent4-underworld-door-public-lock-witness.test.cjs tests/agent4-rejected-underworld-public-power-v1.test.cjs tests/agent4-underworld-visible-thorns-veto.test.cjs tests/agent4-rank6-owner-underworld-veto-paired-24.test.cjs tests/agent4-rank6-underworld-guard-postabort-root-audit.test.cjs
      - name: Initialize pinned native Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Verify actual pinned native engine revision
        run: node -e "const a=require('node:assert/strict'),c=require('node:child_process');a.equal(c.execFileSync('git',['rev-parse','HEAD'],{cwd:'vendor/twinleaf',encoding:'utf8'}).trim(),'a9905a76a6c4103ba4b6cb9a49e86bad795c5c05')"
      - name: Install native server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute twelve registered native attempts and capture typed Store failures
        if: ${{ inputs.experiment == 'typed-replay' }}
        env:
          AGENT4_V3_UNKNOWN_POWER_OUTPUT: agent4-v3-two-unknown-power-native.json
        run: node simulation/evaluation/agent4-v3-two-unknown-power-readout.cjs
      - name: Execute twelve native attempts with post-rejection public PowerEffect witness
        if: ${{ inputs.experiment == 'post-rejection-power' }}
        env:
          AGENT4_UNDERWORLD_POWER_OUTPUT: agent4-underworld-door-rejected-public-power-12.json
        run: node simulation/evaluation/agent4-rejected-underworld-public-power-v1.cjs
      - name: Execute twenty-four physically paired source/candidate guarded owner roots
        if: ${{ inputs.experiment == 'guarded-veto-pair' }}
        env:
          AGENT4_UNDERWORLD_VETO_OUTPUT: agent4-rank6-owner-underworld-veto-paired-24.json
        run: node simulation/evaluation/agent4-rank6-owner-underworld-veto-paired-24.cjs
      - name: Execute twelve fixed-seed owner-guarded games and audit public postabort root actions
        if: ${{ inputs.experiment == 'guarded-public-postabort-root' }}
        env:
          AGENT4_POSTABORT_ROOT_OUTPUT: agent4-underworld-guard-postabort-roots-12.json
        run: node simulation/evaluation/agent4-rank6-underworld-guard-postabort-root-audit.cjs
      - name: Preserve native public postabort action and opponent followthrough receipts
        if: ${{ always() && inputs.experiment == 'guarded-public-postabort-root' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-underworld-guard-postabort-native-public-root-12
          path: |
            agent4-underworld-guard-postabort-roots-12.json
            agent4-underworld-guard-postabort-roots-12.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve typed-error observations including negative results
        if: ${{ always() && inputs.experiment == 'typed-replay' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-v3-two-unknown-power-native-and-checksum
          path: |
            agent4-v3-two-unknown-power-native.json
            agent4-v3-two-unknown-power-native.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve public PowerEffect diagnostics and exact native failures
        if: ${{ always() && inputs.experiment == 'post-rejection-power' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-underworld-rejected-public-power-native
          path: |
            agent4-underworld-door-rejected-public-power-12.json
            agent4-underworld-door-rejected-public-power-12.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve paired guard-versus-original outcomes and native receipts
        if: ${{ always() && inputs.experiment == 'guarded-veto-pair' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-rank6-underworld-veto-paired-24-native
          path: |
            agent4-rank6-owner-underworld-veto-paired-24.json
            agent4-rank6-owner-underworld-veto-paired-24.json.sha256
          if-no-files-found: warn
          retention-days: 21
