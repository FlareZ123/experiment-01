name: Agent4 original v3 two-context UNKNOWN_POWER typed native readout

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Typed replay, post-rejection power, or 24-attempt owner guard'
        type: choice
        options:
          - typed-replay
          - post-rejection-power
          - guarded-veto-pair
          - guarded-public-postabort-root
          - rank6-independent-holdout-16
          - postguard-physical-energy-target-12
          - pure-v2-thorns
          - neutral-v2-native-16
          - neutral-v2-staged-native
          - neutral-v3-staged-native
          - neutral-v3-original16
          - neutral-v3-manual-fallback
          - hood-owner-underworld-native
          - hood-owner-rank6-fresh32
          - neutral-v3-new-natural32
        default: typed-replay

permissions:
  contents: read

jobs:
  paper-neutral-pure:
    if: ${{ inputs.experiment == 'pure-v2-thorns' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run closed-set source-card guard tests without native build
        run: |
          node --check simulation/twinleaf/2026-11/agent4-thorns-lock-neutral-stadium-tool-v2.cjs
          node --test tests/2026-11/agent4-thorns-lock-neutral-stadium-tool-v2.test.cjs
  typed-source-abort:
    if: ${{ inputs.experiment != 'pure-v2-thorns' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact readout, frozen contexts and independent pure tests
        run: |
          node --check simulation/evaluation/agent4-v3-two-unknown-power-readout.cjs
          node --check simulation/evaluation/agent4-rejected-underworld-public-power-v1.cjs
          node --check simulation/twinleaf/agent4-underworld-door-public-lock-witness.cjs
          node --check simulation/twinleaf/agent4-underworld-visible-thorns-veto.cjs
          node --check simulation/evaluation/agent4-rank6-owner-underworld-veto-paired-24.cjs
          node --check simulation/evaluation/agent4-rank6-underworld-guard-postabort-root-audit.cjs
          node --check simulation/evaluation/agent4-rank6-underworld-visible-guard-holdout-16.cjs
          node --check simulation/evaluation/agent4-rank6-psychic-physical-target-12.cjs
          node --test tests/agent4-v3-two-unknown-power-readout.test.cjs tests/agent4-underworld-door-public-lock-witness.test.cjs tests/agent4-rejected-underworld-public-power-v1.test.cjs tests/agent4-underworld-visible-thorns-veto.test.cjs tests/agent4-rank6-owner-underworld-veto-paired-24.test.cjs tests/agent4-rank6-underworld-guard-postabort-root-audit.test.cjs tests/agent4-rank6-underworld-visible-guard-holdout-16.test.cjs tests/agent4-rank6-psychic-physical-target-12.test.cjs
      - name: Initialize pinned native Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Verify actual pinned native engine revision
        run: node -e "const a=require('node:assert/strict'),c=require('node:child_process');a.equal(c.execFileSync('git',['rev-parse','HEAD'],{cwd:'vendor/twinleaf',encoding:'utf8'}).trim(),'a9905a76a6c4103ba4b6cb9a49e86bad795c5c05')"
      - name: Install native server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute sixteen newly preregistered source-deal groups and 32 original-rank6 native attempts
        if: ${{ inputs.experiment == 'neutral-v3-new-natural32' }}
        env:
          AGENT4_NEW_NATURAL_V3_OUTPUT: agent4-rank6-new-natural-v3-thirtytwo.json
        run: |
          node --check simulation/evaluation/2026-11/agent4-thorns-field-v3-new-natural32.cjs
          node --test tests/2026-11/agent4-thorns-lock-field-neutral-v3.test.cjs
          node simulation/evaluation/2026-11/agent4-thorns-field-v3-new-natural32.cjs
      - name: Upload all original-deal fresh-seed v3 native exposures
        if: ${{ always() && inputs.experiment == 'neutral-v3-new-natural32' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-rank6-new-natural-v3-thirtytwo
          path: |
            agent4-rank6-new-natural-v3-thirtytwo.json
            agent4-rank6-new-natural-v3-thirtytwo.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Execute post-veto alternative manual Energy settlement in genuine Store
        if: ${{ inputs.experiment == 'neutral-v3-manual-fallback' }}
        run: |
          node --test tests/2026-11/agent4-thorns-field-neutral-v3-native-manual-fallback.test.cjs
      - name: Confirm Hood-restored owner-only Underworld source and genuine Store settlement
        if: ${{ inputs.experiment == 'hood-owner-underworld-native' }}
        run: |
          node --check simulation/twinleaf/2026-11/agent4-hood-protected-underworld-owner-exception.cjs
          node --test tests/2026-11/agent4-hood-protected-underworld-owner.test.cjs tests/2026-11/agent4-hood-protected-underworld-owner.native.test.cjs
      - name: Execute prospectively registered 32 genuine Hood Shield versus Iron Thorns owner policy attempts
        if: ${{ inputs.experiment == 'hood-owner-rank6-fresh32' }}
        env:
          AGENT4_HOOD_OWNER_FRESH_OUTPUT: agent4-hood-shield-rank6-owner-fresh32.json
        run: |
          node --check simulation/evaluation/2026-11/agent4-hood-owner-rank6-prospective-32.cjs
          node --test tests/2026-11/agent4-hood-protected-underworld-owner.test.cjs
          node simulation/evaluation/2026-11/agent4-hood-owner-rank6-prospective-32.cjs
      - name: Preserve physical-deal and real opponent follow-through of all Hood Shield rank6 groups
        if: ${{ always() && inputs.experiment == 'hood-owner-rank6-fresh32' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-hood-shield-rank6-owner-fresh32
          path: |
            agent4-hood-shield-rank6-owner-fresh32.json
            agent4-hood-shield-rank6-owner-fresh32.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Replay exact original-rank6 v2 versus broader v3 with printed physical deal parity
        if: ${{ inputs.experiment == 'neutral-v3-original16' }}
        env:
          AGENT4_FIELD_V3_ORIGINAL16_OUTPUT: agent4-original-rank6-field-neutral-v2-v3-sixteen.json
        run: |
          node --check simulation/evaluation/2026-11/agent4-thorns-neutral-v2-v3-original16.cjs
          node --test tests/2026-11/agent4-thorns-lock-field-neutral-v3.native.test.cjs
          node --test tests/2026-11/agent4-thorns-lock-field-neutral-v3.test.cjs
          node --test tests/2026-11/agent4-thorns-lock-neutral-stadium-tool-v2.test.cjs
          node simulation/evaluation/2026-11/agent4-thorns-neutral-v2-v3-original16.cjs
      - name: Upload exact original-rank6 two-arm v2-v3 native comparison
        if: ${{ always() && inputs.experiment == 'neutral-v3-original16' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-original-rank6-field-neutral-v2-v3-sixteen
          path: |
            agent4-original-rank6-field-neutral-v2-v3-sixteen.json
            agent4-original-rank6-field-neutral-v2-v3-sixteen.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Native full original-field Stadium Tool v3 and v2 compatibility
        if: ${{ inputs.experiment == 'neutral-v3-staged-native' }}
        run: |
          node --test tests/2026-11/agent4-thorns-lock-field-neutral-v3.native.test.cjs
          node --test tests/2026-11/agent4-thorns-lock-field-neutral-v3.test.cjs
          node --test tests/2026-11/agent4-thorns-lock-neutral-stadium-tool-v2.test.cjs
      - name: Native exact-print ability-lock joint neutral Stadium Tool and Hood matrix
        if: ${{ inputs.experiment == 'neutral-v2-staged-native' }}
        run: |
          node --test tests/2026-11/agent4-thorns-lock-neutral-staged-native.test.cjs
          node --test tests/2026-11/agent4-thorns-lock-neutral-stadium-tool-v2.test.cjs
      - name: Execute registered rank6 16-run v2 native integration
        if: ${{ inputs.experiment == 'neutral-v2-native-16' }}
        env:
          AGENT4_NEUTRAL_V2_NATIVE_OUTPUT: agent4-neutral-thorns-v2-native-16.json
        run: |
          node --check simulation/evaluation/2026-11/agent4-thorns-neutral-v2-holdout-16.cjs
          node --test tests/2026-11/agent4-thorns-lock-neutral-stadium-tool-v2.test.cjs
          node simulation/evaluation/2026-11/agent4-thorns-neutral-v2-holdout-16.cjs
      - name: Preserve guarded rank6 native v2 original-physical-deal receipts
        if: ${{ always() && inputs.experiment == 'neutral-v2-native-16' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-neutral-thorns-v2-native-sixteen
          path: |
            agent4-neutral-thorns-v2-native-16.json
            agent4-neutral-thorns-v2-native-16.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Execute twelve registered native attempts and capture typed Store failures
        if: ${{ inputs.experiment == 'typed-replay' }}
        env:
          AGENT4_V3_UNKNOWN_POWER_OUTPUT: agent4-v3-two-unknown-power-native.json
        run: node simulation/evaluation/agent4-v3-two-unknown-power-readout.cjs
      - name: Execute twelve native attempts with post-rejection public PowerEffect witness
        if: ${{ inputs.experiment == 'post-rejection-power' }}
        env:
          AGENT4_UNDERWORLD_POWER_OUTPUT: agent4-underworld-door-rejected-public-power-12.json
        run: node simulation/evaluation/agent4-rejected-underworld-public-power-v1.cjs
      - name: Execute twenty-four physically paired source/candidate guarded owner roots
        if: ${{ inputs.experiment == 'guarded-veto-pair' }}
        env:
          AGENT4_UNDERWORLD_VETO_OUTPUT: agent4-rank6-owner-underworld-veto-paired-24.json
        run: node simulation/evaluation/agent4-rank6-owner-underworld-veto-paired-24.cjs
      - name: Execute twelve fixed-seed owner-guarded games and audit public postabort root actions
        if: ${{ inputs.experiment == 'guarded-public-postabort-root' }}
        env:
          AGENT4_POSTABORT_ROOT_OUTPUT: agent4-underworld-guard-postabort-roots-12.json
        run: node simulation/evaluation/agent4-rank6-underworld-guard-postabort-root-audit.cjs
      - name: Preserve native public postabort action and opponent followthrough receipts
        if: ${{ always() && inputs.experiment == 'guarded-public-postabort-root' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-underworld-guard-postabort-native-public-root-12
          path: |
            agent4-underworld-guard-postabort-roots-12.json
            agent4-underworld-guard-postabort-roots-12.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Execute sixteen independent new-seed original-rank6 source matched native attempts
        if: ${{ inputs.experiment == 'rank6-independent-holdout-16' }}
        env:
          AGENT4_UNDERWORLD_HOLDOUT_OUTPUT: agent4-rank6-underworld-guard-holdout-16.json
        run: node simulation/evaluation/agent4-rank6-underworld-visible-guard-holdout-16.cjs
      - name: Preserve all original-rank6 randomized holdout source/game receipts
        if: ${{ always() && inputs.experiment == 'rank6-independent-holdout-16' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-rank6-independent-holdout-16-native
          path: |
            agent4-rank6-underworld-guard-holdout-16.json
            agent4-rank6-underworld-guard-holdout-16.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Execute original twelve source matches and capture physical Psychic Energy target custody
        if: ${{ inputs.experiment == 'postguard-physical-energy-target-12' }}
        env:
          AGENT4_FIRST_ENERGY_TARGET_OUTPUT: agent4-rank6-psychic-native-physical-target-12.json
        run: node simulation/evaluation/agent4-rank6-psychic-physical-target-12.cjs
      - name: Preserve actual linked native physical Energy targets and after-Store public boards
        if: ${{ always() && inputs.experiment == 'postguard-physical-energy-target-12' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-rank6-postguard-first-physical-energy-target-12
          path: |
            agent4-rank6-psychic-native-physical-target-12.json
            agent4-rank6-psychic-native-physical-target-12.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve typed-error observations including negative results
        if: ${{ always() && inputs.experiment == 'typed-replay' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-v3-two-unknown-power-native-and-checksum
          path: |
            agent4-v3-two-unknown-power-native.json
            agent4-v3-two-unknown-power-native.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve public PowerEffect diagnostics and exact native failures
        if: ${{ always() && inputs.experiment == 'post-rejection-power' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-underworld-rejected-public-power-native
          path: |
            agent4-underworld-door-rejected-public-power-12.json
            agent4-underworld-door-rejected-public-power-12.json.sha256
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve paired guard-versus-original outcomes and native receipts
        if: ${{ always() && inputs.experiment == 'guarded-veto-pair' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-rank6-underworld-veto-paired-24-native
          path: |
            agent4-rank6-owner-underworld-veto-paired-24.json
            agent4-rank6-owner-underworld-veto-paired-24.json.sha256
          if-no-files-found: warn
          retention-days: 21
