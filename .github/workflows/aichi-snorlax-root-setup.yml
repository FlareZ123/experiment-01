name: Aichi Snorlax authentic setup root probe

on:
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Read retained previous source cohort artifact without new games'
        type: boolean
        default: false
      artifact_run_id:
        description: 'Original successful source cohort run id'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  focused-mew:
    if: ${{ !inputs.report_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify printed rank-5 dual-Mew source and owner-only selector
        run: node --test tests/agent19-mew-max-miracle-owner-choice.test.cjs tests/agent19-mew-mirror-actor-optin.test.cjs
      - name: Test genuine Store same-board copied attack choices
        run: node simulation/twinleaf/agent19-mew-mimikyu-native.cjs > agent19-mew-mirror-native.json
      - name: Test live public observer and exact registered source cohort
        run: node --test tests/agent19-dual-mew-source-observer.test.cjs tests/agent19-dual-mew-original-opportunity.test.cjs
      - name: Run frozen source-dealt rank5 versus Snorlax cohort
        run: node simulation/evaluation/agent19-dual-mew-original-opportunity.cjs
      - name: Archive exact native copies and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent19-rank5-max-miracle-safeguard
          path: |
            agent19-mew-mirror-native.json
            agent19-dualmew-original-opportunity.json
          if-no-files-found: warn
  report-registered-source-cohort:
    if: ${{ inputs.report_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent19-rank5-max-miracle-safeguard
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Show all sixteen frozen ranks, statuses, actual public opportunities
        run: node -e "const x=require('./downloaded/agent19-dualmew-original-opportunity.json'); console.log(JSON.stringify({summary:x.summary,rows:x.rows.map(r=>({case:r.caseInfo,status:r.status,seen:r.monitor?{dual:r.monitor.dualBoard,dce:r.monitor.dualWithDce,pal:r.monitor.dualVsPal,all:r.monitor.fullPublicBoard,offered:r.monitor.actualOfferedMirror}:null,evolutions:r.evolutionRoots?.length??null,error:r.error??null}))},null,2));"
