name: Aichi Snorlax authentic setup root probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-mew:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify printed rank-5 dual-Mew source and owner-only selector
        run: node --test tests/agent19-mew-max-miracle-owner-choice.test.cjs
      - name: Test genuine Store same-board copied attack choices
        run: node simulation/twinleaf/agent19-mew-mimikyu-native.cjs > agent19-mew-mirror-native.json
      - name: Archive exact native copies and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent19-rank5-max-miracle-safeguard
          path: agent19-mew-mirror-native.json
          if-no-files-found: warn
