name: Aichi Snorlax authentic setup root probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rooted-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Check setup adapter regressions
        run: node --test tests/snorlax-solo-opening-policy.test.cjs tests/snorlax-solo-optional-bench.test.cjs
      - name: Observe authentic root Store setup selections
        run: node simulation/twinleaf/snorlax-root-setup-probe.cjs | tee aichi-snorlax-root-setup.json
      - name: Test historical second setup prompt with optional empty Bench
        run: node simulation/twinleaf/snorlax-optional-bench-source-witness.cjs
      - name: Validate registered source Bench preservation protocol
        run: node --test tests/snorlax-bench-preservation-prospective.test.cjs
      - name: Execute preregistered two-arm source-dealt Bench policy probe
        run: node simulation/twinleaf/snorlax-bench-preservation-prospective.cjs > aichi-snorlax-bench-prospective.json
      - name: Verify source-visible Energy Bench policy
        run: node --test tests/snorlax-threat-aware-bench.test.cjs tests/snorlax-threat-aware-prospective.test.cjs
      - name: Run fresh preregistered source-policy treatment cohort
        run: node simulation/twinleaf/snorlax-threat-aware-prospective.cjs > aichi-snorlax-threat-aware-prospective.json
      - name: Assert latent zero-Energy attacking threat in pinned Store
        run: node --test tests/snorlax-zero-energy-arceus-counterexample.test.cjs
      - name: Record native single-attachment attack and sole-Pokemon board
        run: node simulation/twinleaf/snorlax-zero-energy-arceus-counterexample.cjs > aichi-snorlax-zero-energy-threat.json
      - name: Archive actual setup selection roots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-snorlax-root-setup
          path: |
            aichi-snorlax-root-setup.json
            aichi-snorlax-bench-prospective.json
            aichi-snorlax-threat-aware-prospective.json
            aichi-snorlax-zero-energy-threat.json
          if-no-files-found: warn
