name: Agent30 printed Future Sight effect owner-knowledge and Store ordering

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-sight-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-scoped opaque choices and fail-closed both-seat ownership
        run: node --test tests/agent26-origin-bound-attack-choices.test.cjs
      - name: Verify exact rank19 ADP DDE source and frozen Ranger challenger counts
        run: node --test tests/agent30-rank19-adp-ranger-source.test.cjs
      - name: Verify opt-in owner-only Ranger public GX proposal gates and hidden-zone isolation
        run: node --test tests/agent30-ranger-public-gx-frontier.test.cjs
      - name: Check out existing pinned Twinleaf dependency
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Assert research-pinned engine revision
        run: node -e "const a=require('node:assert/strict');const c=require('node:child_process');a.equal(c.execFileSync('git',['rev-parse','HEAD'],{cwd:'vendor/twinleaf',encoding:'utf8'}).trim(),'a9905a76a6c4103ba4b6cb9a49e86bad795c5c05')"
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile unchanged native game Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Prove real Ranger support and subsequent Item native response under Budew
        run: node --test tests/agent30-ranger-budew-item-native.test.cjs
      - name: Test native both-seat Ranger clearing printed Altered Creation-GX payoff while preserving GX quota
        run: node --test tests/agent30-ranger-altered-creation-native.test.cjs
      - name: Verify source rank19 Temple suppressed Double Dragon GX and genuine Sky Field reply
        run: node --test tests/agent30-rank19-temple-dde-native.test.cjs
      - name: Verify actual Future Sight both-seat, both-target, top-four physical ordering
        run: node --test tests/agent30-duskull-viv-futuresight.native.test.cjs
      - name: Replay the original four Issue25 source/deals with exact printed Future Sight owner-stamped choice
        run: node --test tests/agent30-issue25-futuresight-48root-origin.native.test.cjs
      - name: Attribute both remaining original ATTACK choice prompts to exact source printings without hidden reads
        run: node --test tests/agent30-issue25-remaining-printed-prompt-origins.native.test.cjs
      - name: Run original four-arm Night Watch and Get Lost source-bound selection canary
        run: node --test tests/agent26-issue25-two-source-attack-choices.native.test.cjs
