name: Agent7 same-root original Store read-only parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-root-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dispatch and existing workflow contracts
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python -m unittest discover -s tests -p test_workflow_dispatch_preflight.py
          python scripts/workflow_dispatch_preflight.py
      - name: Test independent owner-root offer accounting
        run: node --test tests/agent7-same-root-independent-opportunity.test.cjs
      - name: Verify exact owner-public variable Rondo offer gates
        run: node --test tests/agent7-rondo-public-offer.test.cjs
      - name: Guard same-view shadow/selection physical membership (pure tests)
        run: node --test tests/agent27-shadow-choice-reconciliation.test.cjs
      - name: Verify paired source repair receipt summarizer (pure tests)
        run: node --test tests/agent27-native-attach-summary.test.cjs
      - name: Check out pinned original Twinleaf revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Native detached owner-root dual-pass shadow/choice preflight
        run: node --test tests/agent27-shadow-choice-native-same-root.test.cjs
      - name: Original Store four-arm baseline without proposer observer
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT12_NATIVE_TARGET_SIDECAR_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent7-same-root-off.json
      - name: Original Store four-arm all-proposer read-only observation
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT12_NATIVE_TARGET_SIDECAR_DEV: 'true'
          AGENT41_SAME_ROOT_PROPOSALS_DEV: 'true'
          AGENT41_SAME_ROOT_ALL_PROBES_DEV: 'true'
          AGENT41_SAME_ROOT_SELECT_DEV: 'false'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent7-same-root-on.json
      - name: Demand physical-deal, action, prompt and target identity
        run: node scripts/agent7-same-root-native-parity.cjs agent7-same-root-off.json agent7-same-root-on.json > agent7-same-root-pair.json
      - name: Retrospective four-arm authentic rank30 Rondo read-only census
        run: node simulation/evaluation/agent7-rank30-rondo-native-observe.cjs > agent7-rank30-rondo-observe.json
      - name: Source-dealt registered two-seat same-kind final Bench development
        run: node simulation/evaluation/agent27-natural-lastbench-development.cjs > agent27-natural-lastbench-source.json
      - name: Same original-deal selected late final Bench native fork
        run: node simulation/evaluation/agent27-source-dealt-finalbench-bothseat-fork.cjs > agent27-finalbench-sourcefork.json
      - name: Prospective bounded early owner last Bench source-deal census
        run: node simulation/evaluation/agent27-early-finalbench-field-scan.cjs > agent27-early-finalbench-source.json
      - name: Original Regidrago source min-attachment invalid prompt paired replay
        run: node simulation/evaluation/agent27-native-minimum-attachment-source-replay.cjs > agent27-native-minimum-attach-paired.json
      - name: Audit completed native Regidrago Energy transfer receipts
        run: node scripts/agent27-native-attach-summary.cjs agent27-native-minimum-attach-paired.json
      - name: Preserve controls, observed game evidence and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent7-same-root-native-readonly
          path: |
            agent7-same-root-off.json
            agent7-same-root-on.json
            agent7-same-root-pair.json
            agent7-rank30-rondo-observe.json
            agent27-natural-lastbench-source.json
            agent27-finalbench-sourcefork.json
            agent27-early-finalbench-source.json
            agent27-native-minimum-attach-paired.json
          if-no-files-found: warn
          retention-days: 10
