name: Rank11 Hood sequential access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify nested exact probabilities and shuffled deals
        run: python3 -m unittest discover -s tests -p 'test_rank11_hood_shadowrider_pair_exact.py'
      - name: Generate exact resource frontier
        run: python3 scripts/rank11_hood_shadowrider_pair_exact.py
