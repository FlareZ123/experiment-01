name: Radiant Eternatus Gate model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct Gate exact and independent-shuffle tests
        run: node tests/radiant-eternatus-opening.test.cjs
      - name: Forest Seal Stone exact and independent-shuffle tests
        run: node tests/radiant-fss-extension.test.cjs
      - name: Verify published Iron Thorns field locks the Gate Ability
        run: node --test tests/aichi_iron_thorns_gate_lock.test.cjs
      - name: Audit champion Ability coverage under Initialization
        run: node scripts/aichi_champion_ability_suppression.cjs
      - name: Verify hypothetical Cologne anti-Thorns opening route
        run: node tests/aichi_cologne_gate_model.test.cjs
      - name: Produce machine-readable exact audit
        run: |
          node scripts/radiant-eternatus-opening.cjs > radiant-direct.json
          node scripts/radiant-fss-extension.cjs > radiant-vstar-extension.json
      - uses: actions/upload-artifact@v4
        with:
          name: radiant-gate-opening
          path: |
            radiant-direct.json
            radiant-vstar-extension.json
