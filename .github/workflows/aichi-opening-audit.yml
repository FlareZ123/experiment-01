name: Aichi opening-hand audit

on:
  workflow_dispatch:
    inputs:
      agent44_source_witness_run:
        description: 'Optional existing original-rank8 K0 Store artifact run ID for compact witness inspection'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve prior native source K0 witnesses without rerunning expensive games
        if: inputs.agent44_source_witness_run != ''
        uses: actions/download-artifact@v4
        with:
          name: agent44-rank8-original-k0-source-census
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.agent44_source_witness_run }}
      - name: Print source positive seed witnesses and three actual owner-only hands
        if: inputs.agent44_source_witness_run != ''
        run: >-
          node -e "const r=require('./agent44-rank8-original-k0-source.json');const xs=r.trials.filter(t=>t.sourceK0?.offeredWindow.anyK0Window);console.log(JSON.stringify({sourceSchema:r.schema,sourceStart:r.startIndex,total:r.trialCount,windows:r.exposed,positiveSeeds:xs.map(t=>({seed:t.seed,trial:t.trial,sourceSeat:t.sourceSeat,sourceActualFirst:t.sourceActualFirst,firstOwnerTurn:t.sourceK0.turn,BoxFetch:t.sourceK0.offeredWindow.boxFetchShake,BoxShake:t.sourceK0.offeredWindow.boxHeldShake,direct:t.sourceK0.offeredWindow.directShake})),firstThreeOwners:xs.slice(0,3).map(t=>({seed:t.seed,hand:t.sourceK0.ownerHandPrintings,active:t.sourceK0.visibleActive,bench:t.sourceK0.visibleBench,flags:t.sourceK0.offeredWindow}))}));"
      - name: Unit tests
        run: node --test tests/aichi_opening_audit.test.cjs
      - name: Verify exact printed Basic stage and unconditional opener distribution
        run: |
          node --test tests/aichi-opening-basics.test.cjs
          node scripts/aichi-opening-basics.cjs > aichi-printed-opening-basics.json
          node -e "const a=require('./aichi-printed-opening-basics.json'); if(a.published!==29||a.printedPokemonValidated<100||a.rows.filter(r=>r.basicCount===4).map(r=>r.rank).join(',')!=='6,24,29')throw Error('Opening Basic source field changed');"
      - name: Source rank11 actor-visible direct-KO Energy frontier
        run: node --test tests/agent9-actor-immediate-ko-energy.test.cjs
      - name: Actor-visible Special Energy payability regression
        run: node --test tests/actor-energy-payability.test.cjs
      - name: Actor-only native option prompt regression
        run: node --test tests/agent13-actor-only-select-option.test.cjs
      - name: Optional bonus draw exact-model tests
        run: node --test tests/aichi_bonus_draws.test.cjs
      - name: Rank26 Ticket and joint opponent mulligan source-backed regression
        run: node --test tests/agent27-rank26-mulligan-ticket-access.test.cjs
      - name: Rank1 source final-Bench owner Basic-choice contention regression
        run: node --test tests/agent27-owner-lastbench-basic-conflict.test.cjs
      - name: Optional owner-held evolution last-Bench choice and privacy tests
        run: node --test tests/agent43-held-evolution-bench-admission.test.cjs
      - name: Bilateral bonus offers and 29-source-rank sensitivity
        run: node --test tests/aichi_bilateral_bonus.test.cjs
      - name: Independent full-shuffle bonus-draw validation
        run: node --test tests/aichi_bonus_draws_montecarlo.test.cjs
      - name: Iron Thorns direct-line tests
        run: node --test tests/iron_thorns_direct_line.test.cjs
      - name: Meloetta lone-Active model tests
        run: node --test tests/aichi_solo_start.test.cjs
      - name: Meloetta direct Cologne opening access and independent deals
        run: node --test tests/aichi-meloetta-cologne-window.test.cjs
      - name: Meloetta Order Pad Cologne exact and shuffled bridge tests
        run: node --test tests/aichi-meloetta-order-pad-bridge.test.cjs
      - name: Meloetta Stone plus Crobat rescue access tests
        run: node --test tests/aichi-meloetta-stone-pad-bridge.test.cjs
      - name: New Moon solo defense regression
        run: node --test tests/new-moon-meloetta-solo-stress.test.cjs
      - name: Coupled Klefki and Cologne opening exact model
        run: node --test tests/new-moon-meloetta-joint-resource.test.cjs
      - name: Meloetta-in-seven joint Klefki resource model and physical shuffle
        run: node --test tests/new-moon-meloetta-joint-lock-window.test.cjs
      - name: Conditional rank-26 loss-budget tests
        run: node --test tests/aichi-rank26-loss-budget.test.cjs tests/aichi-rank26-exposure-frontier.test.cjs
      - name: Printed first-turn defense tests
        run: node --test tests/aichi_donk_resilience.test.cjs
      - name: Validate Stadium and Tool opener calculation
        run: node --test tests/aichi_stadium_lock_response.test.cjs
      - name: Ranger direct and Wonder Tag source-backed tests
        run: node --test tests/aichi-ranger-early-access.test.cjs
      - name: Joint Ranger Wonder Tag and Star Alchemy exhaustive tests
        run: node --test tests/aichi-ranger-stone-access.test.cjs
      - name: Source-ranked Raichu and Mew Ranger Stone tests
        run: node --test tests/aichi-ranger-stone-field.test.cjs
      - name: Absol and Garbotoxin direct-window exact source regressions
        run: node --test tests/aichi-absol-garbotoxin-window.test.cjs
      - name: Source rank-2 Gladion and Grand Tree direct-Prize opportunity
        run: node --test tests/aichi-gladion-grandtree-opening.test.cjs
      - name: First turn Boost Shake direct Garbotoxin tests
        run: node --test tests/aichi-absol-boost-shake-direct.test.cjs
      - name: Source-specific Wally and Boost Shake direct route tests
        run: node --test tests/absol-garbotoxin-direct-lock.test.cjs
      - name: Muscle Band compatible Garbotoxin Tool test
        run: node --test tests/aichi-absol-any-tool-first-turn.test.cjs
      - name: First-turn Forest Seal Stone and Field Blower rank11 response
        run: node --test tests/aichi-rank11-field-blower-early-route.test.cjs
      - name: First turn Boost Shake source audit
        run: node scripts/aichi-absol-boost-shake-direct.cjs > aichi-absol-boost-shake-direct.json
      - name: First turn Wally and Boost Shake route model
        run: node scripts/absol-garbotoxin-direct-lock.cjs > absol-garbotoxin-direct-lock.json
      - name: First turn Garbotoxin any-compatible-Tool extension
        run: node scripts/aichi-absol-any-tool-first-turn.cjs > aichi-absol-any-tool-first-turn.json
      - name: Three ranks direct Boost Shake with optional Forest Seal Stone
        run: node scripts/aichi-direct-garbotoxin-opening.cjs > aichi-three-rank-garbotoxin-direct.json
      - name: Rank-11 Oranguru Tool/Stone opening exact tests
        run: python3 -m unittest discover -s tests -p 'test_rank11_oranguru_tool_lock_exact.py'
      - name: Rank-11 Oranguru Tool/Stone opening exact audit
        run: python3 scripts/rank11_oranguru_tool_lock_exact.py > rank11-oranguru-tool-lock-exact.txt
      - name: Reconcile disjoint rank-11 Oranguru Star-Alchemy VIP branch with earlier exact model
        run: node tests/agent32-rank11-oranguru-boost-shake-window.test.cjs
      - name: Check owner-visible two-seat Star-VIP plan and hold blockers
        run: node tests/agent32-owner-oranguru-starvip-plan-offer.test.cjs
      - name: Validate original rank-11 K0 archive hand-only source-ownership classifier
        run: python3 -m unittest discover -s tests -p 'test_agent32_rank11_k0_archive_audit.py'
      - name: New Moon Secret Box direct and search-response opportunity
        run: node --test tests/new-moon-secret-box-blower-access.test.cjs
      - name: Preserve New Moon Secret Box and Field Blower exact response
        run: node scripts/new-moon-secret-box-blower-access.cjs > newmoon-secret-box-blower-access.json
      - name: Independent Secret Box three-discard sensitivity tests
        run: node --test tests/new-moon-secret-box-discard-sensitivity.test.cjs
      - name: Record frozen New Moon designated-discard frontier
        run: node scripts/new-moon-secret-box-discard-sensitivity.cjs > newmoon-secret-box-discard-sensitivity.json
      - name: Exact first-eight Secret Box payload and Energy conjunction
        run: node --test tests/new-moon-secretbox-payload-energy-window.test.cjs
      - name: Preserve strict New Moon source resource co-visibility
        run: node scripts/new-moon-secretbox-payload-energy-window.cjs > newmoon-secretbox-payload-energy-window.json
      - name: Rank-11 Field Blower and Arven response exact tests
        run: python3 -m unittest discover -s tests -p 'test_rank11_garbotoxin_field_blower_response.py'
      - name: Rank-11 Field Blower and Arven response exact output
        run: python3 scripts/rank11_garbotoxin_field_blower_response.py > rank11-arven-blower-response.txt
      - name: Rank-8 held Secret Box Boost Shake Float Stone early gate
        run: python3 -m unittest discover -s tests -p 'test_rank8_hood_core_early_exact.py'
      - name: Preserve rank-8 core policy first-eight exact source probability
        run: python3 scripts/rank8_hood_core_early_exact.py > rank8-hood-core-early.txt
      - name: Rank-8 Secret Box Item-to-Boost-Shake Prize-aware exact tests
        run: python3 -m unittest discover -s tests -p 'test_rank8_secretbox_item_allocation.py'
      - name: Preserve ranked Secret Box Item allocation access fractions
        run: python3 scripts/rank8_secretbox_item_allocation.py > rank8-secretbox-item-allocation.txt
      - name: Rank-8 held Shake and Secret Box expanded Basic-search connector union
        run: python3 -m unittest discover -s tests -p 'test_rank8_secretbox_firstturn_connectivity.py'
      - name: Preserve expanded rank8 exact Basic-search connector fractions
        run: python3 scripts/rank8_secretbox_firstturn_connectivity.py > rank8-secretbox-firstturn-connectivity.txt
      - name: Rank-11 Hood and Blower joint-source response exact tests
        run: python3 -m unittest discover -s tests -p 'test_rank11_hood_persistence_exact.py'
      - name: Rank-11 Hood and Blower response frontier output
        run: python3 scripts/rank11_hood_persistence_exact.py > rank11-hood-protection-frontier.txt
      - name: Absol and Garbotoxin source audit
        run: node scripts/aichi-absol-garbotoxin-window.cjs > aichi-absol-garbotoxin-window.json
      - name: Audit published Aichi lists
        run: node scripts/aichi_opening_audit.cjs > aichi-opening-audit.md
      - name: Bonus draw access by Aichi opponent
        run: node scripts/aichi_bonus_draws.cjs > aichi-bonus-draws.md
      - name: Iron Thorns direct-line exact model
        run: node scripts/iron_thorns_direct_line.cjs > iron-thorns-direct-line.json
      - name: Meloetta lone-Active setup exposure
        run: node scripts/aichi_solo_start.cjs > meloetta-lone-active.md
      - name: Meloetta direct Cologne opening report
        run: node scripts/aichi-meloetta-cologne-window.cjs > meloetta-cologne-opening.json
      - name: Meloetta Order Pad Cologne bridge report
        run: node scripts/aichi-meloetta-order-pad-bridge.cjs > meloetta-order-pad-bridge.json
      - name: Meloetta Stone and Pad access report
        run: node scripts/aichi-meloetta-stone-pad-bridge.cjs > meloetta-stone-pad-bridge.json
      - name: Meloetta-in-seven joint resource opening report
        run: node scripts/new-moon-meloetta-joint-lock-window.cjs > newmoon-meloetta-initial-joint.json
      - name: Print 99.5% conditional Meloetta-donk loss budget
        run: node scripts/aichi_rank26_loss_budget.cjs
      - name: Print source-based hypothetical Basic-count exposure frontier
        run: node scripts/aichi_rank26_exposure_frontier.cjs
      - name: Print-grounded Meloetta defense audit
        run: node scripts/aichi_donk_resilience.cjs > meloetta-printed-defense.md
      - name: Ranger source-resource report
        run: node scripts/aichi-ranger-early-access.cjs > aichi-ranger-early-access.json
      - name: Ranger Forest Seal Stone joint-access report
        run: node scripts/aichi-ranger-stone-access.cjs > aichi-ranger-stone-access.json
      - name: Published ranks 4 and 5 Ranger Stone report
        run: node scripts/aichi-ranger-stone-field.cjs > aichi-ranger-stone-field.json
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-opening-audit
          path: |
            aichi-opening-audit.md
            aichi-printed-opening-basics.json
            aichi-absol-garbotoxin-window.json
            aichi-absol-boost-shake-direct.json
            absol-garbotoxin-direct-lock.json
            aichi-absol-any-tool-first-turn.json
            aichi-three-rank-garbotoxin-direct.json
            aichi-bonus-draws.md
            iron-thorns-direct-line.json
            meloetta-lone-active.md
            meloetta-cologne-opening.json
            meloetta-order-pad-bridge.json
            meloetta-stone-pad-bridge.json
            newmoon-meloetta-initial-joint.json
            meloetta-printed-defense.md
            aichi-ranger-early-access.json
            aichi-ranger-stone-access.json
            aichi-ranger-stone-field.json
            rank11-oranguru-tool-lock-exact.txt
            rank11-arven-blower-response.txt
            rank11-hood-protection-frontier.txt
            rank8-hood-core-early.txt
            rank8-secretbox-item-allocation.txt
            rank8-secretbox-firstturn-connectivity.txt
            newmoon-secret-box-blower-access.json
            newmoon-secret-box-discard-sensitivity.json
            newmoon-secretbox-payload-energy-window.json
