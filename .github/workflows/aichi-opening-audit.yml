name: Aichi opening-hand audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/aichi_opening_audit.test.cjs
      - name: Optional bonus draw exact-model tests
        run: node --test tests/aichi_bonus_draws.test.cjs
      - name: Independent full-shuffle bonus-draw validation
        run: node --test tests/aichi_bonus_draws_montecarlo.test.cjs
      - name: Iron Thorns direct-line tests
        run: node --test tests/iron_thorns_direct_line.test.cjs
      - name: Meloetta lone-Active model tests
        run: node --test tests/aichi_solo_start.test.cjs
      - name: Conditional rank-26 loss-budget tests
        run: node --test tests/aichi-rank26-loss-budget.test.cjs
      - name: Printed first-turn defense tests
        run: node --test tests/aichi_donk_resilience.test.cjs
      - name: Validate Stadium and Tool opener calculation
        run: node --test tests/aichi_stadium_lock_response.test.cjs
      - name: Ranger direct and Wonder Tag source-backed tests
        run: node --test tests/aichi-ranger-early-access.test.cjs
      - name: Audit published Aichi lists
        run: node scripts/aichi_opening_audit.cjs > aichi-opening-audit.md
      - name: Bonus draw access by Aichi opponent
        run: node scripts/aichi_bonus_draws.cjs > aichi-bonus-draws.md
      - name: Iron Thorns direct-line exact model
        run: node scripts/iron_thorns_direct_line.cjs > iron-thorns-direct-line.json
      - name: Meloetta lone-Active setup exposure
        run: node scripts/aichi_solo_start.cjs > meloetta-lone-active.md
      - name: Print 99.5% conditional Meloetta-donk loss budget
        run: node scripts/aichi_rank26_loss_budget.cjs
      - name: Print-grounded Meloetta defense audit
        run: node scripts/aichi_donk_resilience.cjs > meloetta-printed-defense.md
      - name: Ranger source-resource report
        run: node scripts/aichi-ranger-early-access.cjs > aichi-ranger-early-access.json
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-opening-audit
          path: |
            aichi-opening-audit.md
            aichi-bonus-draws.md
            iron-thorns-direct-line.json
            meloetta-lone-active.md
            meloetta-printed-defense.md
            aichi-ranger-early-access.json
