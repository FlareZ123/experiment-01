name: Pinned Night Watch random-hand fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  night-watch-random:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research workspace
        uses: actions/checkout@v4
      - name: Initialize only pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Configure pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Characterize upstream hand-choice defect and scoped correction
        run: node --test tests/night-watch-random-hook.test.cjs tests/new-moon-horror-house-powerglass.test.cjs tests/new-moon-cursed-blast-ace-trainer.test.cjs tests/new-moon-second-turn-source.test.cjs
