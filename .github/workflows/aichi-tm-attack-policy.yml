name: Aichi Technical Machine attack-policy regression

on:
  workflow_dispatch:
    inputs:
      expanded_source_pair:
        description: Run bounded source-matched rank2 Expanded policy contrast
        type: boolean
        required: false
        default: false
      rank2_gh_search_gameplay:
        description: Run preregistered source-rank2 two-seat complete G&H search-policy contrast
        type: boolean
        required: false
        default: false
      rank2_turn5_observer:
        description: Capture exact owner-visible turn5 Supporter decision fork
        type: boolean
        required: false
        default: false
      rank2_gh_ablation:
        description: Isolate source K0, Stage target, and GH mode1 effects on root Supporter choice
        type: boolean
        required: false
        default: false
      rank2_root_score_probe:
        description: Inspect root candidate scores for the frozen source GH fork
        type: boolean
        required: false
        default: false
      rank2_score_components:
        description: Attribute rank2 GH root score difference to nine StateScore components
        type: boolean
        required: false
        default: false
      rank2_hypothetical_prompts:
        description: Audit genuine hypothetical GH option and discard prompt returns
        type: boolean
        required: false
        default: false
      rank2_gladion_turn5_context:
        description: Read-only owner-board audit of existing turn5 Gladion replay
        type: boolean
        required: false
        default: false
      rank2_grandtree_turn5_fork:
        description: Retrospective owner-visible real Store Grand Tree evolution fork
        type: boolean
        required: false
        default: false
      rank2_grandtree_active_stoutland:
        description: Retrospective original-source paid Retreat into Stoutland Sentinel
        type: boolean
        required: false
        default: false
      rank2_grandtree_owner_opponent:
        description: Observe authentic opposing turn6 owner hand and Stoutland without interfering
        type: boolean
        required: false
        default: false
      rank2_natural_stoutland_owner_item:
        description: Probe actual owner-held Mysterious Treasure native Item under natural Stoutland
        type: boolean
        required: false
        default: false
      rank2_natural_sentinel_owner_carmine:
        description: Verify exact naturally Active rank2 Stoutland turn7 opponent Carmine native denial
        type: boolean
        required: false
        default: false
      rank2_independent_stoutland_source:
        description: Eight predeclared unmodified rank2 source seat and seed Stoutland reachability diagnostics
        type: boolean
        required: false
        default: false
      rank2_sentinel_vsseeker_legal_reply:
        description: Source-locked Stoutland real VS Seeker then ordinary owner and source continuations
        type: boolean
        required: false
        default: false
      rank2_sentinel_vsseeker_native:
        description: Source-authentic active Stoutland versus Bench native VS Seeker root control
        type: boolean
        required: false
        default: false
      rank2_gladion_source_exposure:
        description: Frozen 8-game authentic rank2 Gladion root opportunity census
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tm-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Probe pinned Archie and Kyogre paper-rule native discrepancies
        run: node --test tests/agent40-archie-kyogre-paper-native-fidelity.native.test.cjs
      - name: Characterize K0 Prize partition information boundary
        run: node --test tests/bunnelby-k0-deck-target-leak.test.cjs tests/bunnelby-k0-source-inventory.test.cjs
      - name: Verify observed K0 to K1 owner-deck search policy
        run: node --test tests/bunnelby-k1-observation.test.cjs
      - name: Verify root-only hidden Prize epoch invalidation
        run: node --test tests/root-prize-knowledge-observer.test.cjs tests/bunnelby-k1-ticket-epoch.test.cjs tests/bunnelby-k1-nonredeal-root.test.cjs tests/bunnelby-k1-redeal-policy.test.cjs tests/root-prize-heavy-ball-knowledge.test.cjs
      - name: Validate authentic Gladion Prize inspection and root-scoped choice
        run: node --test tests/gladion-visible-prize-choice.test.cjs tests/gladion-visible-prize-root.test.cjs tests/gladion-root-prize-choice-evidence.test.cjs
      - name: Verify optional Gladion owner board is visible and noninterfering
        run: node --test tests/agent24-gladion-owner-context.test.cjs
      - name: Replay genuine rank2 turn5 Gladion with and without read-only board observation
        if: ${{ inputs.rank2_gladion_turn5_context }}
        run: node simulation/twinleaf/agent24-rank2-gladion-turn5-context.cjs > agent24-gladion-turn5-context.json
      - name: Archive rank2 Gladion owner context and unchanged-game check
        if: ${{ always() && inputs.rank2_gladion_turn5_context }}
        uses: actions/upload-artifact@v4
        with:
          name: agent24-rank2-gladion-turn5-context
          path: agent24-gladion-turn5-context.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate bounded Grand Tree own-deck search guard
        if: ${{ inputs.rank2_grandtree_turn5_fork }}
        run: node --test tests/agent40-rank2-grandtree-root-fork.test.cjs
      - name: Replay authentic turn5 rank2 Grand Tree staged evolution and actual opponent reply
        if: ${{ inputs.rank2_grandtree_turn5_fork }}
        run: node simulation/twinleaf/agent40-rank2-grandtree-root-fork.cjs > agent40-rank2-grandtree-fork.json
      - name: Archive fixed-source Grand Tree counterfactual including failure
        if: ${{ always() && inputs.rank2_grandtree_turn5_fork }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-rank2-grandtree-source-fork
          path: agent40-rank2-grandtree-fork.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate source Grand Tree paid Retreat follow-up interface
        if: ${{ inputs.rank2_grandtree_active_stoutland }}
        run: node --test tests/agent40-rank2-grandtree-root-fork.test.cjs
      - name: Execute original-source actual paid Retreat into Stoutland
        if: ${{ inputs.rank2_grandtree_active_stoutland }}
        run: node simulation/twinleaf/agent40-rank2-grandtree-root-fork.cjs --promote-stoutland > agent40-rank2-grandtree-active.json
      - name: Archive Grand Tree Active Stoutland fork with full failure provenance
        if: ${{ always() && inputs.rank2_grandtree_active_stoutland }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-rank2-grandtree-stoutland-active-fork
          path: agent40-rank2-grandtree-active.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe exact original-source first opponent owner decision under Active Stoutland
        if: ${{ inputs.rank2_grandtree_owner_opponent }}
        run: node simulation/twinleaf/agent40-rank2-grandtree-root-fork.cjs --promote-stoutland --observe-opponent > agent40-stoutland-first-opponent.json
      - name: Preserve observed opponent own-hand and full-deal root-equality proof
        if: ${{ always() && inputs.rank2_grandtree_owner_opponent }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-stoutland-opponent-first-owner-root
          path: agent40-stoutland-first-opponent.json
          if-no-files-found: warn
          retention-days: 14
      - name: Probe authentic opponent VS Seeker to Supporter under Active versus Benched Stoutland
        if: ${{ inputs.rank2_sentinel_vsseeker_native }}
        run: node simulation/twinleaf/agent40-sentinel-vs-seeker-root-probe.cjs > agent40-sentinel-vsseeker-native.json
      - name: Archive both matched native root attempts, including failures
        if: ${{ always() && inputs.rank2_sentinel_vsseeker_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-sentinel-vsseeker-native-source-probe
          path: agent40-sentinel-vsseeker-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Continue ordinary bot after owner-visible real VS Seeker with and without Sentinel
        if: ${{ inputs.rank2_sentinel_vsseeker_legal_reply }}
        run: node simulation/twinleaf/agent40-sentinel-vs-seeker-legal-continuation.cjs > agent40-sentinel-seeker-legal-reply.json
      - name: Preserve real owner follow-up and next source turn, including failure
        if: ${{ always() && inputs.rank2_sentinel_vsseeker_legal_reply }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-sentinel-seeker-legal-owner-and-source-reply
          path: agent40-sentinel-seeker-legal-reply.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate natural owner-held Item root contract
        if: ${{ inputs.rank2_natural_stoutland_owner_item }}
        run: node --test tests/agent40-natural-stoutland-owner-item.test.cjs tests/agent40-natural-stoutland-owner-item-prompt.test.cjs
      - name: Replay actual owner-held Mysterious Treasure first native Item root
        if: ${{ inputs.rank2_natural_stoutland_owner_item }}
        run: node simulation/twinleaf/agent40-natural-stoutland-owner-item.cjs > agent40-natural-stoutland-owner-item.json
      - name: Archive Item native accepted or rejected root and all failures
        if: ${{ always() && inputs.rank2_natural_stoutland_owner_item }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-natural-stoutland-owner-item-native
          path: agent40-natural-stoutland-owner-item.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate natural rank2 Stoutland opponent Carmine owner-view contract
        if: ${{ inputs.rank2_natural_sentinel_owner_carmine }}
        run: node --test tests/agent40-natural-sentinel-owner-carmine.test.cjs
      - name: Replay authentic unmodified rank2 source followed by natural owner-held Carmine native submission
        if: ${{ inputs.rank2_natural_sentinel_owner_carmine }}
        run: node simulation/twinleaf/agent40-natural-sentinel-owner-carmine.cjs > agent40-natural-sentinel-owner-carmine.json
      - name: Archive natural owner Carmine direct native evidence including abort
        if: ${{ always() && inputs.rank2_natural_sentinel_owner_carmine }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-natural-stoutland-owner-carmine-native
          path: agent40-natural-sentinel-owner-carmine.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify natural Stoutland opponent-owner resource snapshot is read-only
        if: ${{ inputs.rank2_independent_stoutland_source }}
        run: node --test tests/agent40-natural-stoutland-owner-opportunity.test.cjs
      - name: Audit source rank2 native Stoutland exposure across eight independent physical deals
        if: ${{ inputs.rank2_independent_stoutland_source }}
        run: node simulation/twinleaf/agent40-rank2-natural-stoutland-exposure.cjs > agent40-rank2-natural-stoutland-exposure.json
      - name: Preserve each original policy source deal and all censored observations
        if: ${{ always() && inputs.rank2_independent_stoutland_source }}
        uses: actions/upload-artifact@v4
        with:
          name: agent40-rank2-unmodified-stoutland-eight-original-deals
          path: agent40-rank2-natural-stoutland-exposure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate source-root Gladion event extraction and frozen cohort
        run: node --test tests/rank2-gladion-source-exposure.test.cjs
      - name: Run frozen source rank2 Gladion opportunity census
        if: ${{ inputs.rank2_gladion_source_exposure }}
        run: node simulation/twinleaf/rank2-gladion-source-exposure.cjs > rank2-gladion-source-exposure.json
      - name: Preserve source-dealt Gladion complete and negative observations
        if: ${{ always() && inputs.rank2_gladion_source_exposure }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gladion-root-exposure
          path: rank2-gladion-source-exposure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Contrast generic and source-aware TM Evolution targets
        run: node --test tests/bunnelby-tm-target-selection.test.cjs
      - name: Verify exact source Bench-priority displacement and independent toy oracle
        run: node --test tests/aichi-bunnelby-bench-priority.test.cjs
      - name: Test actual Guzma & Hala mode1 source-60 search prompts
        run: node --test tests/bunnelby-guzma-hala-mode.test.cjs
      - name: Smoke-test live-root K1 opt-in with both rank-2 source seats
        run: node --test tests/bunnelby-k1-headless-smoke.test.cjs
      - name: Test opt-in headless Tool attack policy and Bunnelby composition
        run: node --test tests/twinleaf-tool-attack-headless.test.cjs tests/aichi-campaign-execute.test.cjs
      - name: Test source-backed Tool attack decision
        run: node --test tests/tm_attack_policy.test.cjs tests/pass-attack-announcement-probe.test.cjs tests/pass-attack-source-board-regression.test.cjs
      - name: Audit rank2 printed-singleton GH discard frontier
        run: |
          node --test tests/aichi-vileplume-gh-discard-frontier.test.cjs tests/aichi-vileplume-gh-discard-physical.test.cjs
          node scripts/aichi-vileplume-gh-discard-frontier.cjs > rank2-gh-discard-frontier.json
      - name: Archive exact and physical source-count sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gh-discard-frontier-resource-only
          path: rank2-gh-discard-frontier.json
          if-no-files-found: error
      - name: Print real-engine policy contrast
        run: node simulation/twinleaf/tm-attack-policy-characterization.cjs
      - name: Probe late-game Bunnelby Evolution with one remaining source Stage 2
        run: node simulation/twinleaf/aichi-bunnelby-turn56-legality.cjs
      - name: Compare one exact rank-2 Bunnelby Pass with Evolution intervention
        run: node simulation/twinleaf/rank2-pass-evolution-counterfactual.cjs > aichi-rank2-pass-counterfactual.json
      - name: Print bounded rank-2 action evidence
        run: node -e "const x=require('./aichi-rank2-pass-counterfactual.json');console.log(JSON.stringify({trial:x.sourceTrial,seed:x.seed,baseline:x.baseline,forcedEvolution:x.forcedEvolution},null,2))"
      - name: Preserve conditioned rank-2 counterfactual
        uses: actions/upload-artifact@v4
        with:
          name: aichi-rank2-pass-counterfactual
          path: aichi-rank2-pass-counterfactual.json
          if-no-files-found: error

      - name: Check bounded source-paired decision readout
        run: node --test tests/aichi-rank2-gh-visibility.test.cjs tests/expanded-source-profile-pair.test.cjs
      - name: Run two-seat source-matched Expanded policy comparison
        if: ${{ inputs.expanded_source_pair }}
        run: node simulation/twinleaf/expanded-source-profile-pair.cjs > expanded-source-policy-pair.json
      - name: Archive the earliest observed policy divergences
        if: ${{ always() && inputs.expanded_source_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-expanded-source-policy-pair
          path: expanded-source-policy-pair.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify source rank2 G&H search profile contracts
        if: ${{ inputs.rank2_gh_search_gameplay }}
        run: node --test tests/expanded-gh-search-pair.test.cjs tests/bunnelby-gh-search-policy.test.cjs
      - name: Compare both printed source seats with G&H resource selection v2 versus v3
        if: ${{ inputs.rank2_gh_search_gameplay }}
        run: node simulation/twinleaf/expanded-gh-search-pair.cjs > rank2-gh-search-gameplay.json
      - name: Preserve both exposed and unexposed genuine source-game decisions
        if: ${{ always() && inputs.rank2_gh_search_gameplay }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gh-search-gameplay
          path: rank2-gh-search-gameplay.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify closed source Bunnelby Evolution and next-root extraction
        if: ${{ inputs.rank2_gh_search_gameplay }}
        run: node --test tests/rank2-gh-search-attack-response.test.cjs
      - name: Retrospectively reobserve real source Evolution effect and opposing first action
        if: ${{ inputs.rank2_gh_search_gameplay }}
        run: node simulation/twinleaf/rank2-gh-search-attack-response.cjs > rank2-gh-attack-response.json
      - name: Preserve same-origin attack and public next-root packet
        if: ${{ always() && inputs.rank2_gh_search_gameplay }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gh-attack-response
          path: rank2-gh-attack-response.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate first source rank2 turn5 root Supporter fork
        if: ${{ inputs.rank2_turn5_observer }}
        run: node --test tests/rank2-turn5-source-fork-observer.test.cjs
      - name: Record original-source fork owner-visible states
        if: ${{ inputs.rank2_turn5_observer }}
        run: node simulation/twinleaf/rank2-turn5-source-fork-observer.cjs > rank2-turn5-source-fork.json
      - name: Summarize observed source predecision equivalence
        if: ${{ inputs.rank2_turn5_observer }}
        run: node -e "const r=require('./rank2-turn5-source-fork.json');console.log(JSON.stringify({sameVisible:r.samePredecisionVisibleSnapshot,firstDifference:r.firstRecordedMeaningfulDifference,arms:r.arms.map(a=>({profile:a.profile,fork:a.fork,context:a.capture[0]?.before,deckSearches:a.ownDeckSearchesBeforeFork}))},null,2))"
      - name: Archive owner-visible source fork contexts
        if: ${{ always() && inputs.rank2_turn5_observer }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-turn5-owner-visible-fork
          path: rank2-turn5-source-fork.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate original rank2 GH-component source ablation
        if: ${{ inputs.rank2_gh_ablation }}
        run: node --test tests/rank2-gh-mode1-ablation.test.cjs
      - name: Record source matched root Supporter component effects
        if: ${{ inputs.rank2_gh_ablation }}
        run: node simulation/twinleaf/rank2-gh-mode1-ablation.cjs > rank2-gh-mode1-ablation.json
      - name: Print bounded ablation decision outcomes
        if: ${{ inputs.rank2_gh_ablation }}
        run: node -e "const r=require('./rank2-gh-mode1-ablation.json');console.log(JSON.stringify({seed:r.seed,sameSource:r.sameSourceHashes,sameStart:r.sameFirstTurn,sameVisible:r.sameVisibleContext,arms:r.results.map(a=>({flags:a.flags,fork:a.fork,captured:a.captureCount,firstDiff:a.firstRecordedDifferenceFromV1}))},null,2))"
      - name: Preserve source rank2 component ablation
        if: ${{ always() && inputs.rank2_gh_ablation }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-source-GH-mode1-ablation
          path: rank2-gh-mode1-ablation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate bounded source rank2 root Supporter score observer
        if: ${{ inputs.rank2_root_score_probe }}
        run: node --test tests/rank2-gh-root-score-probe.test.cjs
      - name: Record source-ranked Supporter evaluation scores
        if: ${{ inputs.rank2_root_score_probe }}
        run: node simulation/twinleaf/rank2-gh-root-score-probe.cjs > rank2-gh-root-score.json
      - name: Archive reproducible GH root scores
        if: ${{ always() && inputs.rank2_root_score_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gh-root-score-probe
          path: rank2-gh-root-score.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate passive rank2 GH nine-component score decomposition
        if: ${{ inputs.rank2_score_components }}
        run: node --test tests/rank2-gh-score-components.test.cjs
      - name: Observe original-source GH score components
        if: ${{ inputs.rank2_score_components }}
        run: node simulation/twinleaf/rank2-gh-score-components.cjs > rank2-gh-score-components.json
      - name: Archive original-source GH component attribution
        if: ${{ always() && inputs.rank2_score_components }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gh-score-components
          path: rank2-gh-score-components.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate genuine rank2 hypothetical GH option prompts
        if: ${{ inputs.rank2_hypothetical_prompts }}
        run: node --test tests/rank2-gh-hypothetical-prompts.test.cjs
      - name: Record source-locked hypothetical GH prompt choices
        if: ${{ inputs.rank2_hypothetical_prompts }}
        run: node simulation/twinleaf/rank2-gh-hypothetical-prompts.cjs > rank2-gh-hypothetical-prompts.json
      - name: Archive speculative source GH prompt selections
        if: ${{ always() && inputs.rank2_hypothetical_prompts }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gh-hypothetical-prompts
          path: rank2-gh-hypothetical-prompts.json
          if-no-files-found: warn
          retention-days: 14
