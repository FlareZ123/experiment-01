name: Aichi Technical Machine attack-policy regression

on:
  workflow_dispatch:
    inputs:
      expanded_source_pair:
        description: Run bounded source-matched rank2 Expanded policy contrast
        type: boolean
        required: false
        default: false
      rank2_turn5_observer:
        description: Capture exact owner-visible turn5 Supporter decision fork
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tm-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Characterize K0 Prize partition information boundary
        run: node --test tests/bunnelby-k0-deck-target-leak.test.cjs tests/bunnelby-k0-source-inventory.test.cjs
      - name: Verify observed K0 to K1 owner-deck search policy
        run: node --test tests/bunnelby-k1-observation.test.cjs
      - name: Verify root-only hidden Prize epoch invalidation
        run: node --test tests/root-prize-knowledge-observer.test.cjs tests/bunnelby-k1-ticket-epoch.test.cjs tests/bunnelby-k1-nonredeal-root.test.cjs tests/bunnelby-k1-redeal-policy.test.cjs tests/root-prize-heavy-ball-knowledge.test.cjs
      - name: Contrast generic and source-aware TM Evolution targets
        run: node --test tests/bunnelby-tm-target-selection.test.cjs
      - name: Verify exact source Bench-priority displacement and independent toy oracle
        run: node --test tests/aichi-bunnelby-bench-priority.test.cjs
      - name: Test actual Guzma & Hala mode1 source-60 search prompts
        run: node --test tests/bunnelby-guzma-hala-mode.test.cjs
      - name: Smoke-test live-root K1 opt-in with both rank-2 source seats
        run: node --test tests/bunnelby-k1-headless-smoke.test.cjs
      - name: Test source-backed Tool attack decision
        run: node --test tests/tm_attack_policy.test.cjs tests/pass-attack-announcement-probe.test.cjs tests/pass-attack-source-board-regression.test.cjs
      - name: Print real-engine policy contrast
        run: node simulation/twinleaf/tm-attack-policy-characterization.cjs
      - name: Probe late-game Bunnelby Evolution with one remaining source Stage 2
        run: node simulation/twinleaf/aichi-bunnelby-turn56-legality.cjs
      - name: Compare one exact rank-2 Bunnelby Pass with Evolution intervention
        run: node simulation/twinleaf/rank2-pass-evolution-counterfactual.cjs > aichi-rank2-pass-counterfactual.json
      - name: Print bounded rank-2 action evidence
        run: node -e "const x=require('./aichi-rank2-pass-counterfactual.json');console.log(JSON.stringify({trial:x.sourceTrial,seed:x.seed,baseline:x.baseline,forcedEvolution:x.forcedEvolution},null,2))"
      - name: Preserve conditioned rank-2 counterfactual
        uses: actions/upload-artifact@v4
        with:
          name: aichi-rank2-pass-counterfactual
          path: aichi-rank2-pass-counterfactual.json
          if-no-files-found: error

      - name: Check bounded source-paired decision readout
        run: node --test tests/aichi-rank2-gh-visibility.test.cjs tests/expanded-source-profile-pair.test.cjs
      - name: Run two-seat source-matched Expanded policy comparison
        if: ${{ inputs.expanded_source_pair }}
        run: node simulation/twinleaf/expanded-source-profile-pair.cjs > expanded-source-policy-pair.json
      - name: Archive the earliest observed policy divergences
        if: ${{ always() && inputs.expanded_source_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-expanded-source-policy-pair
          path: expanded-source-policy-pair.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate first source rank2 turn5 root Supporter fork
        if: ${{ inputs.rank2_turn5_observer }}
        run: node --test tests/rank2-turn5-source-fork-observer.test.cjs
      - name: Record original-source fork owner-visible states
        if: ${{ inputs.rank2_turn5_observer }}
        run: node simulation/twinleaf/rank2-turn5-source-fork-observer.cjs > rank2-turn5-source-fork.json
      - name: Summarize observed source predecision equivalence
        if: ${{ inputs.rank2_turn5_observer }}
        run: node -e "const r=require('./rank2-turn5-source-fork.json');console.log(JSON.stringify({sameVisible:r.samePredecisionVisibleSnapshot,firstDifference:r.firstRecordedMeaningfulDifference,arms:r.arms.map(a=>({profile:a.profile,fork:a.fork,context:a.capture[0]?.before,deckSearches:a.ownDeckSearchesBeforeFork}))},null,2))"
      - name: Archive owner-visible source fork contexts
        if: ${{ always() && inputs.rank2_turn5_observer }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-turn5-owner-visible-fork
          path: rank2-turn5-source-fork.json
          if-no-files-found: warn
          retention-days: 14
