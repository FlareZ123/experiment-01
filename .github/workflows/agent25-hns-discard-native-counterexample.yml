name: Agent25 pinned Dhelmise discard Ability lock counterexample

on:
  workflow_dispatch:
    inputs:
      agent25_ball_compressor_staged:
        description: 'Opt into four staged native Ball-plus-Compressor donor-payment arms'
        type: boolean
        default: false
      agent25_natural_ball_six_arm:
        description: 'Opt into preregistered six original 60-card Quick Ball donor-payment replay'
        type: boolean
        default: false
      agent25_staged_ball_v2_six_arm:
        description: 'Opt into frozen v2 source-staged Quick Ball native owner payment and original-60 replay'
        type: boolean
        default: false
      agent25_owner_ball_root_frontier_v3:
        description: 'Opt into six frozen original-60 owner-held Quick Ball root-choice diagnostic runs'
        type: boolean
        default: false
      agent25_three_donor_ball_root_cost_v4:
        description: 'Opt into preregistered owner-paid three-HNS donor Quick Ball root policy six original 60 games'
        type: boolean
        default: false
      agent25_pair_v3_v4_root_ledgers:
        description: 'Compare retrospective exact full physical initial deal and native action ledgers for v3/v4 rank10/rank11'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent25-hns-discard-native-paper-fidelity
  cancel-in-progress: false

jobs:
  genuine-store:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pure reversible HNS hook under named Abilities and exceptions
        run: node --test tests/agent25-hns-discard-ability-lock-hook.test.cjs
      - name: Test owner-only staged Quick Ball prompt in both seat controls
        if: inputs.agent25_staged_ball_v2_six_arm
        run: node --test tests/agent25-owner-quickball-hns-cost-v2.test.cjs
      - name: Test read-only owner Quick Ball root frontier on both candidate seats
        if: inputs.agent25_owner_ball_root_frontier_v3
        run: node --test tests/agent25-owner-quickball-hns-cost-v3-frontier.test.cjs
      - name: Test v4 owner-only exact three-HNS Quick Ball root trigger and actual fee
        if: inputs.agent25_three_donor_ball_root_cost_v4
        run: node --test tests/agent25-quickball-three-donor-root-v4.test.cjs tests/agent25-owner-quickball-hns-cost-v4-threshold.test.cjs
      - name: Checkout exactly pinned original Store
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify staged paid HNS hand discard plus one Compressor physical donor chain
        if: inputs.agent25_ball_compressor_staged
        run: node simulation/twinleaf/agent25-ball-compressor-staged-native.cjs > agent25-ball-compressor-staged-native.json
      - name: Report every new staged owner-payment arm, including failures
        if: always() && inputs.agent25_ball_compressor_staged
        run: |
          node -e "const fs=require('node:fs');const p='agent25-ball-compressor-staged-native.json';if(!fs.existsSync(p)){console.log('STAGED_BALL_NATIVE_NO_OUTPUT');process.exitCode=1}else{const r=JSON.parse(fs.readFileSync(p));console.log(JSON.stringify({version:r.version,pin:r.nativePin,passed:r.allPassed,arms:r.arms.map(a=>({seat:a.seat,payment:a.paymentName,status:a.status,damage:a.actualDamage,error:a.error??null,traceLength:a.trace.length}))},null,2))}"
      - name: Archive all four staged native Ball plus Compressor arms
        if: always() && inputs.agent25_ball_compressor_staged
        uses: actions/upload-artifact@v4
        with:
          name: agent25-ball-compressor-staged-native
          path: agent25-ball-compressor-staged-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run registered six natural complete-60 owner Quick Ball payment trials
        if: inputs.agent25_natural_ball_six_arm
        run: node simulation/evaluation/agent25-dhelmise-v2-ball-payment-natural-six-arm.cjs > agent25-natural-ball-six-arm.json
      - name: Report all natural Quick Ball payment trials, including native failures
        if: always() && inputs.agent25_natural_ball_six_arm
        run: |
          node -e "const fs=require('node:fs');const p='agent25-natural-ball-six-arm.json';if(!fs.existsSync(p)){console.log('NATURAL_BALL_SIX_ARM_NO_OUTPUT');process.exitCode=1}else{const r=JSON.parse(fs.readFileSync(p));console.log(JSON.stringify({registration:r.newPolicyRegistration,qualified:r.competitivelyQualifiedGames,attempts:r.attempts.map(a=>({key:a.key,status:a.status,roots:a.nativeRootActions??null,eligible:a.ownerBallDonorAudit?.eligible??null,selected:a.ownerBallDonorAudit?.selected??null,accepted:a.ownerBallDonorAudit?.accepted??null,moved:a.ownerBallDonorAudit?.physicallyMoved??null,invalidated:a.ownerBallDonorAudit?.invalidated??null,error:a.errorCode??a.error??null}))},null,2))}"
      - name: Archive every preregistered natural full-60 Quick Ball owner-payment attempt
        if: always() && inputs.agent25_natural_ball_six_arm
        uses: actions/upload-artifact@v4
        with:
          name: agent25-natural-full60-quickball-hns-six-arm
          path: agent25-natural-ball-six-arm.json
          if-no-files-found: warn
          retention-days: 14
      - name: Assert real pinned Quick Ball staged owner prompt identity both physical seats
        if: inputs.agent25_staged_ball_v2_six_arm
        run: node simulation/twinleaf/agent25-quickball-source-staging-v2-native.cjs > agent25-native-quickball-staged-v2-probe.json
      - name: Archive four staged Quick Ball v2 physical owner-payment controls
        if: always() && inputs.agent25_staged_ball_v2_six_arm
        uses: actions/upload-artifact@v4
        with:
          name: agent25-native-quickball-staged-v2-probe
          path: agent25-native-quickball-staged-v2-probe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run newly registered corrected staged-source Quick Ball six original 60 attempts
        if: inputs.agent25_staged_ball_v2_six_arm
        run: node simulation/evaluation/agent25-dhelmise-v2-ball-prompt-staging-six-arm.cjs > agent25-native-ball-staged-v2-six-arm.json
      - name: Report complete corrected v2 natural Quick Ball experiment
        if: always() && inputs.agent25_staged_ball_v2_six_arm
        run: |
          node -e "const fs=require('node:fs');const p='agent25-native-ball-staged-v2-six-arm.json';if(!fs.existsSync(p)){console.log('STAGED_V2_NATIVE_NO_OUTPUT');process.exitCode=1}else{const r=JSON.parse(fs.readFileSync(p));console.log(JSON.stringify({registration:r.stagedSourceRegistration,qualified:r.competitivelyQualifiedGames,attempts:r.attempts.map(a=>({key:a.key,status:a.status,roots:a.nativeRootActions??null,stagedPrompts:a.ownerBallDonorAudit?.stagedQuickBallDiscardPrompts??null,eligible:a.ownerBallDonorAudit?.eligible??null,selected:a.ownerBallDonorAudit?.selected??null,accepted:a.ownerBallDonorAudit?.accepted??null,moved:a.ownerBallDonorAudit?.physicallyMoved??null,invalidated:a.ownerBallDonorAudit?.invalidated??null,error:a.errorCode??a.error??null}))},null,2))}"
      - name: Preserve every corrected v2 Quick Ball natural attempt and physical owner cost
        if: always() && inputs.agent25_staged_ball_v2_six_arm
        uses: actions/upload-artifact@v4
        with:
          name: agent25-native-ball-staged-v2-six-arm
          path: agent25-native-ball-staged-v2-six-arm.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run preregistered owner-held Quick Ball original-60 native six-arm frontier
        if: inputs.agent25_owner_ball_root_frontier_v3
        run: node simulation/evaluation/agent25-dhelmise-quickball-root-frontier-v3-six-arm.cjs > agent25-quickball-root-frontier-v3.json
      - name: Report each candidate-owner Quick Ball hold and native root choice
        if: always() && inputs.agent25_owner_ball_root_frontier_v3
        run: |
          node -e "const fs=require('node:fs');const p='agent25-quickball-root-frontier-v3.json';if(!fs.existsSync(p)){console.log('OWNER_BALL_ROOT_FRONTIER_V3_NO_OUTPUT');process.exitCode=1}else{const r=JSON.parse(fs.readFileSync(p));console.log(JSON.stringify({registration:r.rootFrontierRegistration,qualified:r.competitivelyQualifiedGames,attempts:r.attempts.map(a=>({key:a.key,status:a.status,roots:a.nativeRootActions??null,ownerRootDecisions:a.ownerBallDonorAudit?.ownerRootDecisions??null,heldBall:a.ownerBallDonorAudit?.rootsHeldQuickBall??null,heldReady:a.ownerBallDonorAudit?.rootsHeldBallCompressorDonor??null,selectedBallRoots:a.ownerBallDonorAudit?.botChosenQuickBallRoots??null,stagedPrompts:a.ownerBallDonorAudit?.stagedQuickBallDiscardPrompts??null,paid:a.ownerBallDonorAudit?.physicallyMoved??null,error:a.errorCode??null}))},null,2))}"
      - name: Archive entire six-arm original-60 owner Quick Ball root frontier
        if: always() && inputs.agent25_owner_ball_root_frontier_v3
        uses: actions/upload-artifact@v4
        with:
          name: agent25-quickball-root-frontier-v3
          path: agent25-quickball-root-frontier-v3.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run preregistered exact-three-donor Quick Ball paid root original six games
        if: inputs.agent25_three_donor_ball_root_cost_v4
        run: node simulation/evaluation/agent25-dhelmise-quickball-three-donor-root-v4-six-arm.cjs > agent25-quickball-three-donor-v4-six-arm.json
      - name: Report native v4 root decisions, actual physical payments, all dispositions
        if: always() && inputs.agent25_three_donor_ball_root_cost_v4
        run: |
          node -e "const fs=require('node:fs');const p='agent25-quickball-three-donor-v4-six-arm.json';if(!fs.existsSync(p)){console.log('THREE_DONOR_V4_NO_OUTPUT');process.exitCode=1}else{const r=JSON.parse(fs.readFileSync(p));console.log(JSON.stringify({registration:r.v4ThreeDonorRegistration,qualified:r.competitivelyQualifiedGames,attempts:r.attempts.map(a=>({key:a.key,status:a.status,roots:a.nativeRootActions??null,ready:a.ownerBallDonorAudit?.rootsThreeDonorQuickBallReady??null,selectedBallRoots:a.ownerBallDonorAudit?.botChosenQuickBallRoots??null,prompts:a.ownerBallDonorAudit?.stagedQuickBallDiscardPrompts??null,eligible:a.ownerBallDonorAudit?.eligible??null,paid:a.ownerBallDonorAudit?.physicallyMoved??null,hnsThreshold:a.hnsHookAudit?.thresholdFourChecks??null,error:a.errorCode??null}))},null,2))}"
      - name: Preserve all six original source v4 Quick Ball root-and-fee outcomes
        if: always() && inputs.agent25_three_donor_ball_root_cost_v4
        uses: actions/upload-artifact@v4
        with:
          name: agent25-quickball-three-donor-root-v4
          path: agent25-quickball-three-donor-v4-six-arm.json
          if-no-files-found: warn
          retention-days: 14
      - name: Replay pairwise v3/v4 original-60 full-deal SHA and genuine Store roots
        if: inputs.agent25_pair_v3_v4_root_ledgers
        run: node simulation/evaluation/agent25-v3-v4-original60-root-ledger-pair.cjs > agent25-v3-v4-native-root-ledger-pair.json
      - name: Print paired full-deal fingerprints and physical decision divergence
        if: always() && inputs.agent25_pair_v3_v4_root_ledgers
        run: |
          node -e "const fs=require('node:fs');const p='agent25-v3-v4-native-root-ledger-pair.json';if(!fs.existsSync(p)){console.log('NO_PAIRED_ROOT_LEDGER');process.exitCode=1}else{const r=JSON.parse(fs.readFileSync(p));console.log(JSON.stringify({registration:r.registration,pairs:r.pairs.map(p=>({rank:p.rank,seat:p.candidateSeat,exactInitialPhysicalDealPaired:p.completeOriginalPhysicalDealPaired,hashes:p.initialPhysicalDealSha256,attempts:Object.fromEntries(Object.entries(p.attempts).map(([k,a])=>[k,{status:a.status,roots:a.nativeRootActions??null,attacks:a.attackDeclarationsBySeat??null,decisionEvents:a.decisionTrace?.length??null,paid:a.ownerBallDonorAudit?.decisions??null,error:a.errorCode??a.error??null}]))}))},null,2))}"
      - name: Archive exact original source v3-v4 complete genuine native action lineage
        if: always() && inputs.agent25_pair_v3_v4_root_ledgers
        uses: actions/upload-artifact@v4
        with:
          name: agent25-v3-v4-native-original-root-ledger-pair
          path: agent25-v3-v4-native-root-ledger-pair.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe native PokéStop on clean and intentionally rejected-action source boards
        run: node simulation/twinleaf/agent25-vileplume-pokestop-native-stadium.cjs > agent25-vileplume-pokestop-native-stadium.json
      - name: Print all staged clean and rejected-action control outcomes
        run: node -e "const x=require('./agent25-vileplume-pokestop-native-stadium.json'); console.log(JSON.stringify(x.rows.map(r=>({rank:r.sourceRank,seat:r.candidateSeat,preReject:r.probeBlockedActions,stadium:r.genuineStoreStadiumSettled,itemDenied:r.genuineStoreItemDenied,supporterDenied:r.genuineStoreSupporterDenied,shuppetRestored:r.abilityRestoredOnSilentLabReplacement}))))"
      - name: Archive ten staged Stadium-action controls including four negative arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-vileplume-pokestop-native-stadium
          path: agent25-vileplume-pokestop-native-stadium.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compare original and reversible paper HNS attack resolution on both physical seats
        run: node simulation/twinleaf/agent25-hns-discard-native-counterexample.cjs > agent25-hns-original-store-counterexample.json
      - name: Archive native action and after-attack prompts, all arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-hns-pinned-discard-lock-native
          path: agent25-hns-original-store-counterexample.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run frozen exact-print Dhelmise v2 six-arm native feasibility screen
        run: node simulation/evaluation/agent25-dhelmise-v2-native-three-lock-smoke.cjs > agent25-dhelmise-v2-six-arm-native-smoke.json
      - name: Print exact-resolution outcome and six registered native statuses
        run: |
          node -e "const r=require('./agent25-dhelmise-v2-six-arm-native-smoke.json'); console.log(JSON.stringify({printing:r.printing,attempts:r.attempts.map(a=>({key:a.key,status:a.status,sourceStatus:a.sourceStatus||null,actions:a.nativeRootActions||null,turns:a.turns||null,error:a.error||null,hook:a.hnsHookAudit?{countChecks:a.hnsHookAudit.countChecks,suppressedDonors:a.hnsHookAudit.suppressedDonors}:null}))},null,2));"
      - name: Archive original 60 resolution and all native source smoke attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-dhelmise-v2-native-three-lock-smoke
          path: agent25-dhelmise-v2-six-arm-native-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run pre-registered owner Compressor policy on matching six original source arms
        run: node simulation/evaluation/agent25-dhelmise-v2-compressor-policy-six-arm.cjs > agent25-dhelmise-v2-compressor-policy-six-arm.json
      - name: Print paired candidate-only donor policy outcome and any physical failure
        run: |
          node -e "const r=require('./agent25-dhelmise-v2-compressor-policy-six-arm.json');console.log(JSON.stringify({policy:r.policy,printing:r.printing,attempts:r.attempts.map(a=>({key:a.key,status:a.status,actions:a.nativeRootActions||null,turns:a.turns||null,prizesRemaining:a.prizesRemaining||null,hook:a.hnsHookAudit?{countChecks:a.hnsHookAudit.countChecks,rawNamedDonors:a.hnsHookAudit.rawNamedDonors,effectiveDonors:a.hnsHookAudit.effectiveDonors,suppressedDonors:a.hnsHookAudit.suppressedDonors}:null,physicalFailure:a.physicalConservationWitness||null,error:a.errorCode||null}))},null,2));"
      - name: Archive paired owner-only native policy six original sixty-card attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-dhelmise-v2-owner-compressor-six-arm
          path: agent25-dhelmise-v2-compressor-policy-six-arm.json
          if-no-files-found: warn
          retention-days: 14
      - name: Reproduce first rank10 settled physical-card disappearance with unguarded diagnostic continuation
        run: node simulation/evaluation/agent25-rank10-native-physical60-custody-fork.cjs > agent25-rank10-physical-custody-fork.json
      - name: Print rank10 original 60 custody counterexample root timeline
        run: |
          node -e "const r=require('./agent25-rank10-physical-custody-fork.json'); console.log(JSON.stringify({enginePin:r.enginePin,records:r.records.map(x=>({name:x.name,status:x.status,first:x.firstConservationViolation,rootTimeline:x.rootTimelineAroundFirstSettledAnomaly,exception:x.code||null}))},null,2));"
      - name: Archive rank10 native original-card custody root evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-rank10-physical-custody-fork
          path: agent25-rank10-physical-custody-fork.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prove native Regidrago V Celestial Roar physical 60-card leak on both seats
        run: node simulation/twinleaf/agent25-regidrago-v-celestial-roar-native-card-custody.cjs > agent25-regidrago-celestial-roar-native-controls.json
      - name: Print native original-versus-fixed Celestial Roar control counts
        run: |
          node -e "const r=require('./agent25-regidrago-celestial-roar-native-controls.json');console.log(JSON.stringify({passed:r.passed,results:r.results.map(x=>({seat:x.attackingSeat,mode:x.mode,repaired:x.repaired,accounted:x.accounted,attached:x.attachedBasicEnergy,discarded:x.discardedNonEnergyNames,correction:x.correctedAudit?{prompts:x.correctedAudit.attachmentPrompts,remaining:x.correctedAudit.remainingDiscarded}:null}))},null,2));"
      - name: Archive native 12-arm Regidrago V precise source-card custody counterexample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-regidrago-celestial-roar-native-controls
          path: agent25-regidrago-celestial-roar-native-controls.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test paper-corrected Celestial Roar source rank10 unchanged original 60s
        run: node simulation/evaluation/agent25-rank10-regidrago-celestial-roar-source-physical60-pair.cjs > agent25-rank10-celestial-roar-physical60-pair.json
      - name: Print original rank10 physical gate and correction source outcomes
        run: |
          node -e "const r=require('./agent25-rank10-celestial-roar-physical60-pair.json'); console.log(JSON.stringify({seed:r.seed,records:r.records.map(x=>({mode:x.mode,status:x.status,code:x.code||null,actions:x.nativeActions||null,turns:x.turns||null,integrity:x.physicalZoneIntegrity?{settled:x.physicalZoneIntegrity.settledRootsChecked,invalid:x.physicalZoneIntegrity.settledRootsWithAnomaly}:null,corrected:x.correctionAudit?{attacks:x.correctionAudit.attacks,prompts:x.correctionAudit.attachmentPrompts,discarded:x.correctionAudit.remainingDiscarded,leftovers:x.correctionAudit.tempRemainderLengths}:null}))},null,2));"
      - name: Archive rank10 exact original source60 and optional Celestial Roar hook fork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-rank10-regidrago-celestial-roar-original60-pair
          path: agent25-rank10-celestial-roar-physical60-pair.json
          if-no-files-found: warn
          retention-days: 14
      - name: Reuse Agent47 fully paper-corrected Celestial Roar on original rank10 both candidate policies
        run: node simulation/evaluation/agent25-agent47-celestial-roar-natural-rank10-source-pair.cjs > agent25-agent47-celestial-roar-natural-rank10-source-pair.json
      - name: Print original rank10 with existing Agent47 full-paper Celestial Roar hook
        run: |
          node -e "const r=require('./agent25-agent47-celestial-roar-natural-rank10-source-pair.json');console.log(JSON.stringify({pin:r.pin,records:r.records.map(x=>({policy:x.policy,status:x.status,code:x.code||null,roots:x.nativeActions||null,physical:x.physicalZoneIntegrity?{checked:x.physicalZoneIntegrity.settledRootsChecked,anomalies:x.physicalZoneIntegrity.settledRootsWithAnomaly}:null,celestial:x.agent47PaperCelestialRoarAudit?{replaced:x.agent47PaperCelestialRoarAudit.replacedAttackResolutions,selected:x.agent47PaperCelestialRoarAudit.nativeSelectedTransfers,settled:x.agent47PaperCelestialRoarAudit.nativeEffectSettlements}:null,actualSourceAttacks:x.sourceCelestialRoarActualRoots||null}))},null,2));"
      - name: Archive Agent47 existing paper hook applied to naturally dealt rank10 original 60
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent25-agent47-celestial-roar-natural-rank10-source-pair
          path: agent25-agent47-celestial-roar-natural-rank10-source-pair.json
          if-no-files-found: warn
          retention-days: 14
