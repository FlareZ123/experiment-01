name: Twinleaf Apex Dragon regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apex-dragon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Check Regidrago VSTAR discard-attack copying
        run: node simulation/twinleaf/apex-copy-contract.cjs
      - name: Check Regidrago VSTAR Phantom Dive copying
        run: node simulation/twinleaf/apex-phantom-dive.cjs
      - name: Check upstream copied-attack selection policy
        run: node simulation/twinleaf/apex-policy-choice.cjs
      - name: Test optional Regidrago Bench Prize resolver
        run: node simulation/twinleaf/regidrago-prize-window-test.cjs
      - name: Test paid Apex Dragon AttackAction and copied damage
        run: node simulation/twinleaf/apex-attack-action.cjs
      - name: Check Double Dragon Energy and Temple of Sinnoh Apex cost
        run: node simulation/twinleaf/apex-double-dragon-temple.cjs
      - name: Compare copied attack choices on Safeguard and Budew board
        run: node simulation/twinleaf/regidrago-prize-window-interaction.cjs
      - name: Verify copied Timeless-GX cannot be reused and ordinary retry works
        run: node simulation/twinleaf/apex-gx-reuse.cjs
      - name: Check rejected borrowed GX history after retry cancellation
        run: node simulation/twinleaf/apex-gx-denial-history.cjs
      - name: Compare generic and spent-GX-aware copied-attack decisions
        run: node simulation/twinleaf/spent-gx-copy-policy-test.cjs
      - name: Replay denied GX selection against opponent Copycat next turn
        run: node simulation/twinleaf/spent-gx-to-mimikyu-copycat.cjs
      - name: Characterize copied-attack session isolation across independent Stores
        run: node simulation/twinleaf/copy-session-cross-store-leak.cjs
      - name: Validate opt-in State-scoped copied-session loader
        run: node simulation/twinleaf/copied-session-state-scope-test.cjs
      - name: Verify explicit copied-session inheritance into pinned Simulator
        run: node simulation/twinleaf/copy-session-aware-simulator-test.cjs
      - name: Probe speculative Simulator copied-session lifetime
        run: node simulation/twinleaf/copy-session-speculative-simulator.cjs
