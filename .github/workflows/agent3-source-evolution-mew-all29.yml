name: Agent3 fresh all29 source natural evolution and Mew competence A/B

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Choose the frozen prospective study
        type: choice
        options:
          - source-mew
          - hood-v2
          - hood-retreat
          - skyliner-smoke
          - skyliner-field
          - skyliner-v1-field
          - skyliner-repair
        default: source-mew

permissions:
  contents: read

jobs:
  frozen-source-opponent-competence:
    if: inputs.experiment == 'source-mew'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research code
        uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Use pinned Node runtime and dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify frozen 58 physical deals and isolated owner flags
        run: |
          node --check simulation/evaluation/agent3/prospective-all29-source-evolution-mew.cjs
          node --test tests/2026-11/agent3-source-evolution-mew-full29.test.cjs
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf source
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute every authenticated original source in both physical seats
        env:
          AGENT3_SOURCE_COMPETENCE_OUTPUT: artifacts/agent3-source-evolution-mew-full29.json
        run: node simulation/evaluation/agent3/prospective-all29-source-evolution-mew.cjs
      - name: Preserve full native action ledgers and all failed or capped attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-source-evolution-mew-full29
          path: artifacts/agent3-source-evolution-mew-full29.json
          retention-days: 14
          if-no-files-found: warn

  targeted-fixed-sixty-hood-consistency:
    if: inputs.experiment == 'hood-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research code
        uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Use pinned Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Pure frozen 60 and sharp-bound regression
        run: |
          node --check simulation/evaluation/agent3/hood-consistency-v2-targeted-native.cjs
          node --test tests/2026-11/agent3-hood-consistency-v2-targeted.test.cjs
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf source
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute 88 frozen original-source matches, both unchanged 60s
        env:
          AGENT3_HOOD_CONSISTENCY_OUTPUT: artifacts/agent3-hood-consistency-v2-targeted.json
        run: node simulation/evaluation/agent3/hood-consistency-v2-targeted-native.cjs
      - name: Archive all action ledgers, caps, errors and source-deal mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-hood-consistency-v2-targeted
          path: artifacts/agent3-hood-consistency-v2-targeted.json
          retention-days: 14
          if-no-files-found: warn

  hood-v2-flexible-paid-retreat:
    if: inputs.experiment == 'hood-retreat'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact registered research code
        uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Use pinned Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Test frozen same-deck mobility treatment and paired bounds
        run: |
          node --check simulation/evaluation/agent3/hood-v2-flexible-paid-retreat-native.cjs
          node --test tests/2026-11/agent3-hood-v2-flexible-paid-retreat.test.cjs
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run all 18 same-sixty registered source games
        env:
          AGENT3_FLEXIBLE_RETREAT_OUTPUT: artifacts/agent3-hood-v2-flexible-retreat.json
        run: node simulation/evaluation/agent3/hood-v2-flexible-paid-retreat-native.cjs
      - name: Preserve every game, full roots, disposition and physical deals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-hood-v2-flexible-retreat
          path: artifacts/agent3-hood-v2-flexible-retreat.json
          retention-days: 14
          if-no-files-found: warn

  skyliner-owner-policy-pure:
    if: inputs.experiment == 'skyliner-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout shared actor and adapter source
        uses: actions/checkout@v4
      - name: Node 20 for pure owner-only actor decisions
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Verify live actor Skyliner recipient choice, lock guard and native wiring
        run: |
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/2026-11/agent3-skyliner-shared-owner-mobility.test.cjs

  skyliner-public-prospective-32:
    if: inputs.experiment == 'skyliner-field'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preregistered public actor study
        uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Node 20 and pinned dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify fresh fixed-sixty registration, actor and sharp-censor logic
        run: |
          node --check simulation/evaluation/agent3/skyliner-public-free-native-prospective.cjs
          node --test tests/2026-11/agent3-skyliner-public-native-prospective.test.cjs tests/2026-11/agent3-skyliner-shared-owner-mobility.test.cjs
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf native code
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all 32 fresh original source pairs without changing either sixty
        env:
          AGENT3_SKYLINER_PROSPECTIVE_OUTPUT: artifacts/agent3-skyliner-public-free-prospective.json
        run: node simulation/evaluation/agent3/skyliner-public-free-native-prospective.cjs
      - name: Archive all 16 physical pairs with full Store roots and accepted attacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-skyliner-public-prospective-32
          path: artifacts/agent3-skyliner-public-free-prospective.json
          retention-days: 14
          if-no-files-found: warn

  skyliner-best-nominated-60-original-all29:
    if: inputs.experiment == 'skyliner-v1-field'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen all29 candidate policy research
        uses: actions/checkout@v4
      - name: Initialize pinned native submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Node runtime and pinned cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Test all 58 paired authentic ranks, candidate sixty and frozen hashes
        run: |
          node --check simulation/evaluation/agent3/skyliner-hood-v1-authenticated29-native.cjs
          node --test tests/2026-11/agent3-skyliner-hood-v1-authenticated29-native.test.cjs
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run 116 exact-sixty A/B native games, each original source rank in both seats
        env:
          AGENT3_SKYLINER_HOOD_V1_ALL29_OUTPUT: artifacts/agent3-skyliner-hood-v1-all29-prospective.json
        run: node simulation/evaluation/agent3/skyliner-hood-v1-authenticated29-native.cjs
      - name: Preserve all rank, physical, policy and termination ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-skyliner-hood-v1-all29-116
          path: artifacts/agent3-skyliner-hood-v1-all29-prospective.json
          retention-days: 14
          if-no-files-found: warn

  skyliner-native-witness-three-repair:
    if: inputs.experiment == 'skyliner-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fixed public-action witness
        uses: actions/checkout@v4
      - name: Initialize pinned native engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Pinned Node 20 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify the corrected physical-action contract and repair runner
        run: |
          node --check simulation/evaluation/agent3/skyliner-native-witness-repair-three.cjs
          node --test tests/2026-11/agent3-skyliner-shared-owner-mobility.test.cjs
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Reproduce three previously aborted source deals with corrected witness
        env:
          AGENT3_SKYLINER_REPAIR_OUTPUT: artifacts/agent3-skyliner-witness-repair-three.json
        run: node simulation/evaluation/agent3/skyliner-native-witness-repair-three.cjs
      - name: Archive all three action traces including any actual abort
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-skyliner-witness-repair-three
          path: artifacts/agent3-skyliner-witness-repair-three.json
          retention-days: 14
          if-no-files-found: warn
