name: Aichi evolution Ability source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-evolution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Verify printing-aware source scan tests
        run: node --test tests/aichi-evolution-ability-static-audit.test.cjs
      - name: Scan pinned source implementations against published field
        run: node scripts/aichi-evolution-ability-static-audit.cjs > evolution-static-leads.json
      - name: Print scope without implying proven bugs
        run: >-
          node -e "const r=require('./evolution-static-leads.json');
          console.log(JSON.stringify({schema:r.schema,field:r.sourceFieldTotal,
          pokemonPrintings:r.pokemonPrintings,matched:r.matchedSourcePrintings,
          evolutionAbilityCandidates:r.directEvolveAbility,
          staticLeads:r.suspectedMissingDirectBlockCheck,
          unmatched:r.unmatchedPrintings.length,
          verdict:'unverified-static-leads-only'}));"
      - name: Preserve all positive and unmatched printing leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-evolution-static-leads
          path: evolution-static-leads.json
          if-no-files-found: warn
          retention-days: 30
