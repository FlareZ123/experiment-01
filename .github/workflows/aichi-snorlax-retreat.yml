name: Aichi Snorlax retreat action characterization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snorlax-retreat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Characterize interactive and direct retreat actions
        run: node simulation/twinleaf/snorlax-retreat-action-characterization.cjs > aichi-snorlax-retreat.json
      - name: Preserve source-backed action characterization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-snorlax-retreat
          path: aichi-snorlax-retreat.json
          if-no-files-found: warn
