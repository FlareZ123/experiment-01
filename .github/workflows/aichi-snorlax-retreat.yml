name: Aichi Snorlax retreat action characterization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snorlax-retreat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test original rank-7 turn-ending overlap exact probability
        run: node --test tests/agent20-turn-ending-contention.test.cjs
      - name: Capture rank-7 Steven zero-choice and one-card native controls
        run: node simulation/twinleaf/agent20-steven-zero-search-native.cjs > agent20-steven-native.json
      - name: Test rank-7 Steven printed search minimum
        run: node --test tests/agent20-steven-zero-search-native.test.cjs
      - name: Capture original Japanese Palace Book turn-ending Item behavior
        run: node simulation/twinleaf/agent20-palace-book-turnend-native.cjs > agent20-palace-native.json
      - name: Test original Japanese Palace Book physical action
        run: node --test tests/agent20-palace-book-turnend-native.test.cjs
      - name: Check restricted original rank7 Nest Ball zero-selection negative control
        run: node --test tests/agent20-steven-paper-guard-nest-negative.test.cjs
      - name: Run identical-original-60 Palace versus Steven action counterfactuals
        run: node simulation/twinleaf/agent20-rank7-turnend-original60-pair.cjs > agent20-original60-turnend.json
      - name: Test identical physical source60 turn-ending action comparison
        run: node --test tests/agent20-rank7-turnend-original60-pair.test.cjs
      - name: Replay original rank7 real-deal source roots with and without Steven paper guard
        run: node simulation/twinleaf/agent20-rank7-steven-guard-natural-pair.cjs > agent20-steven-original-deal-guard.json
      - name: Characterize interactive and direct retreat actions
        run: node simulation/twinleaf/snorlax-retreat-action-characterization.cjs | tee aichi-snorlax-retreat.json
      - name: Verify Snorlax Block interaction and reversible hook
        run: node --test tests/snorlax-retreat-start-hook.test.cjs
      - name: Test proposed singleton Supporter combinatorics
        run: node --test tests/aichi-snorlax-scoop-access.test.cjs
      - name: Characterize printed Cassius and AZ Block escape alternatives
        run: node simulation/twinleaf/snorlax-scoop-supporter.cjs > aichi-snorlax-scoop-supporter.json
      - name: Test source-independent Supporter action diagnostics
        run: node --test tests/snorlax-scoop-supporter.test.cjs
      - name: Trace Max Geist attack conversion after five Block-escape Trainers
        run: node simulation/twinleaf/snorlax-max-geist-continuation.cjs > aichi-snorlax-max-geist-continuation.json
      - name: Assert real Max Geist attack conversion and Prize differences
        run: node --test tests/snorlax-max-geist-continuation.test.cjs
      - name: Characterize Switch and Guzma solo-Block escapes
        run: node simulation/twinleaf/snorlax-switch-vs-guzma.cjs | tee aichi-snorlax-switch-guzma.json
      - name: Validate Switch and Guzma counterlines and reversible guard
        run: node --test tests/snorlax-switch-vs-guzma.test.cjs
      - name: Test source-only solo Snorlax starting selection
        run: node --test tests/snorlax-solo-opening-policy.test.cjs tests/snorlax-solo-source-prospective.test.cjs
      - name: Execute frozen rank3/rank7 original-source opening comparison
        run: node simulation/twinleaf/snorlax-solo-source-prospective.cjs > aichi-snorlax-solo-source.json
      - name: Validate rank5 Night Stretcher owner-only Pass observer
        run: node --test tests/agent20-rank5-night-stretcher-native.test.cjs
      - name: Reobserve rank5 original source Pass with held Night Stretcher and discard Basic
        run: node simulation/twinleaf/agent20-rank5-night-stretcher-native.cjs > agent20-rank5-night-stretcher-native.json
      - name: Preserve source-backed action characterization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-snorlax-retreat
          path: |
            aichi-snorlax-retreat.json
            aichi-snorlax-switch-guzma.json
            aichi-snorlax-scoop-supporter.json
            aichi-snorlax-max-geist-continuation.json
            aichi-snorlax-solo-source.json
            agent20-steven-native.json
            agent20-palace-native.json
            agent20-original60-turnend.json
            agent20-steven-original-deal-guard.json
            agent20-rank5-night-stretcher-native.json
          if-no-files-found: warn
