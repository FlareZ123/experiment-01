name: Aichi Regidrago Temple response audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-direct-counters:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact counter-access unit and source tests
        run: node --test tests/regidrago-temple-answers.test.cjs tests/regidrago-temple-search.test.cjs tests/regidrago-temple-discard-sensitivity.test.cjs
      - name: Print source-derived rank table
        run: node scripts/regidrago-temple-answers.cjs
      - name: Print idealized source-card search results
        run: node scripts/regidrago-temple-search.cjs
      - name: Print discard-sensitive search access scenarios
        run: node scripts/regidrago-temple-discard-sensitivity.cjs
