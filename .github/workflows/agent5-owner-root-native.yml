name: Actor-only root slice native development

on:
  workflow_dispatch:
    inputs:
      native_search_only:
        description: Run bounded native rank-7 owner-search gate without full-game replay
        required: false
        type: boolean
        default: false
      rank6_powerglass_paired:
        description: Frozen source-first rank6 Battle Compressor Powerglass owner-legal fork
        required: false
        type: boolean
        default: false
      rank6_directline_paired:
        description: Compare frozen original source-first arms with the Iron Thorns direct-line root off versus on
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retrospective-rank11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure actor-root intent tests
        run: node --test tests/agent5-owner-root-slice.test.cjs tests/agent5-articuno-powerglass-native.test.cjs tests/agent5-rank6-native-t34-registered-receipt.test.cjs tests/agent5-owner-root-wrapper.test.cjs tests/agent34-actor-only-root-policy.test.cjs tests/agent5-rank6-directline-paired-census.test.cjs tests/agent22-sparse-owner-bundles.test.cjs tests/agent22-sparse-owner-search-adapter.test.cjs tests/agent22-numeric-shuffle-validation-hook.test.cjs
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Native staged Iron Thorns Stadium root in both seats
        run: node simulation/twinleaf/agent5-thunder-mountain-native-gate.cjs > agent5-thunder-mountain-native-gate.json
      - name: Native staged rank-7 Steven three-card owner search both seats
        run: node simulation/twinleaf/agent22-steven-native-store-gate.cjs > agent22-steven-native-store-result.json
      - name: Native bilateral historical and source-first development
        if: ${{ ! inputs.native_search_only }}
        run: node simulation/evaluation/agent5-owner-root-bilateral-native.cjs > agent5-owner-root-result.json
      - name: Fixed source-first development baseline without Thorns direct-line
        if: ${{ inputs.rank6_directline_paired }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT1_THORNS_DIRECT_ROOT_DEV: 'false'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-thorns-baseline-sourcefirst.json
      - name: Fixed source-first development treatment with Thorns direct-line
        if: ${{ inputs.rank6_directline_paired }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT1_THORNS_DIRECT_ROOT_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-thorns-treatment-sourcefirst.json
      - name: Preserve all matched, censored and aborting direct-line contrast arms
        if: ${{ inputs.rank6_directline_paired }}
        run: node scripts/agent5-rank6-directline-paired-census.cjs agent5-thorns-baseline-sourcefirst.json agent5-thorns-treatment-sourcefirst.json > agent5-thorns-directline-contrast.json
      - name: Rank6 fixed source-first Powerglass control
        if: ${{ inputs.rank6_powerglass_paired }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_ACTOR_SINGLE_SEARCH_DEV: 'true'
          AGENT47_ACTOR_HAND_DISCARD_DEV: 'true'
          AGENT8_ACTOR_CHOOSE_POKEMON_DEV: 'true'
          AGENT7_NATIVE_GENERIC_FALLBACK_DEV: 'true'
          AGENT5_COMPR_OPPORTUNITY_AUDIT: 'true'
          AGENT10_BASIC_ENERGY_FRONTIER_DEV: 'true'
          AGENT44_ACTOR_ENERGY_RECIPIENT_DEV: 'true'
          AGENT8_NEAR_TERM_DAMAGE_RECIPIENT_DEV: 'true'
          AGENT8_ACE_TRAINER_EMERGENCY_DEV: 'true'
          AGENT3_SPECIAL_ENERGY_ROOT_DEV: 'true'
          AGENT8_ACTOR_QUICK_BALL_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT5_ARTICUNO_POWERGLASS_DEV: 'false'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-powerglass-control.json
      - name: Rank6 fixed source-first Powerglass treatment
        if: ${{ inputs.rank6_powerglass_paired }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_ACTOR_SINGLE_SEARCH_DEV: 'true'
          AGENT47_ACTOR_HAND_DISCARD_DEV: 'true'
          AGENT8_ACTOR_CHOOSE_POKEMON_DEV: 'true'
          AGENT7_NATIVE_GENERIC_FALLBACK_DEV: 'true'
          AGENT5_COMPR_OPPORTUNITY_AUDIT: 'true'
          AGENT10_BASIC_ENERGY_FRONTIER_DEV: 'true'
          AGENT44_ACTOR_ENERGY_RECIPIENT_DEV: 'true'
          AGENT8_NEAR_TERM_DAMAGE_RECIPIENT_DEV: 'true'
          AGENT8_ACE_TRAINER_EMERGENCY_DEV: 'true'
          AGENT3_SPECIAL_ENERGY_ROOT_DEV: 'true'
          AGENT8_ACTOR_QUICK_BALL_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT5_ARTICUNO_POWERGLASS_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-powerglass-treatment.json
      - name: Preserve all four paired Powerglass arms, rejections and source replies
        if: ${{ inputs.rank6_powerglass_paired }}
        run: node scripts/agent5-articuno-powerglass-native-audit.cjs agent5-powerglass-control.json agent5-powerglass-treatment.json > agent5-powerglass-paired-audit.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: actor-only-root-native-retrospective-rank11
          path: |
            agent5-thunder-mountain-native-gate.json
            agent5-owner-root-result.json
            agent22-steven-native-store-result.json
            agent5-thorns-baseline-sourcefirst.json
            agent5-thorns-treatment-sourcefirst.json
            agent5-thorns-directline-contrast.json
            agent5-powerglass-control.json
            agent5-powerglass-treatment.json
            agent5-powerglass-paired-audit.json
          if-no-files-found: warn
          retention-days: 30
