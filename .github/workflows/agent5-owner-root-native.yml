name: Actor-only root slice native development

on:
  workflow_dispatch:
    inputs:
      native_search_only:
        description: Run bounded native rank-7 owner-search gate without full-game replay
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retrospective-rank11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure actor-root intent tests
        run: node --test tests/agent5-owner-root-slice.test.cjs tests/agent5-owner-root-wrapper.test.cjs tests/agent34-actor-only-root-policy.test.cjs tests/agent22-sparse-owner-bundles.test.cjs tests/agent22-sparse-owner-search-adapter.test.cjs tests/agent22-numeric-shuffle-validation-hook.test.cjs
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Native staged rank-7 Steven three-card owner search both seats
        run: node simulation/twinleaf/agent22-steven-native-store-gate.cjs > agent22-steven-native-store-result.json
      - name: Native bilateral historical and source-first development
        if: ${{ ! inputs.native_search_only }}
        run: node simulation/evaluation/agent5-owner-root-bilateral-native.cjs > agent5-owner-root-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: actor-only-root-native-retrospective-rank11
          path: |
            agent5-owner-root-result.json
            agent22-steven-native-store-result.json
          retention-days: 30
