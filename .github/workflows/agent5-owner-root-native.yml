name: Actor-only root slice native development

on:
  workflow_dispatch:
    inputs:
      native_search_only:
        description: Run bounded native rank-7 owner-search gate without full-game replay
        required: false
        type: boolean
        default: false
      three_prize_tagteam_native:
        description: Preregistered synthetic TAG TEAM three-Prize native both-seat test
        required: false
        type: boolean
        default: false
      rank7_steven_followthrough:
        description: Retrospective read-only root use after previously observed exact source Steven searches
        required: false
        type: boolean
        default: false
      rank7_dealt_steven_pair:
        description: Preregistered eight original Store source rank7 Steven choices, developer only
        required: false
        type: boolean
        default: false
      rank6_directline_paired:
        description: Compare frozen original source-first arms with the Iron Thorns direct-line root off versus on
        required: false
        type: boolean
        default: false
      owner_terminal_arbitration_aba:
        description: Bounded 12-arm historical A/B/A original Store common owner-action arbiter, all outcomes unqualified
        required: false
        type: boolean
        default: false
      agent12_campinggear_rank6_native:
        description: 'Retrospective exact rank6 printed Camping Gear owner-Pass native trial, development only'
        required: false
        type: boolean
        default: false
      owner_terminal_arbitration_rank3:
        description: Fixed two-seed rank3 original 60 vs rank1 both-seat A/B/A original Store development only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retrospective-rank11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure actor-root intent tests
        run: node --test tests/agent5-owner-root-slice.test.cjs tests/agent5-special-energy-bench-witness.test.cjs tests/agent5-owner-root-wrapper.test.cjs tests/agent34-actor-only-root-policy.test.cjs tests/agent41-owner-root-arbitration.test.cjs tests/agent5-public-attachment-reaction.test.cjs tests/agent35-potential-two-prize-attack-veto.test.cjs tests/agent10-original-printing-energy-flags.test.cjs tests/agent42-prospective-source-root-audit.test.cjs tests/agent42-visible-printed-prize-finisher.test.cjs tests/agent41-arbitration-version-composition.test.cjs tests/agent5-rank6-directline-paired-census.test.cjs tests/agent22-sparse-owner-bundles.test.cjs tests/agent22-sparse-owner-search-adapter.test.cjs tests/agent22-actor-marginal-search-value.test.cjs tests/agent22-k0-search-bundle-value.test.cjs tests/agent22-steven-followthrough.test.cjs tests/agent22-live-owner-turn-observer.test.cjs tests/agent22-numeric-shuffle-validation-hook.test.cjs tests/agent12-native-campinggear-after-pass.test.cjs
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Native staged Iron Thorns Stadium root in both seats
        run: node simulation/twinleaf/agent5-thunder-mountain-native-gate.cjs > agent5-thunder-mountain-native-gate.json
      - name: Retrospective original rank6 first-turn Camping Gear Pass owner native fork
        if: ${{ inputs.agent12_campinggear_rank6_native }}
        run: node simulation/twinleaf/agent12-campinggear-rank6-native.cjs > agent12-campinggear-rank6-native.json
      - name: Native staged rank-7 Steven three-card owner search both seats
        run: node simulation/twinleaf/agent22-steven-native-store-gate.cjs > agent22-steven-native-store-result.json
      - name: Preregistered exact rank7 source-dealt Steven prompt-choice pair
        if: ${{ inputs.rank7_dealt_steven_pair }}
        run: node simulation/twinleaf/agent22-rank7-dealt-steven-pair.cjs > agent22-rank7-dealt-steven-pair.json
      - name: Read-only registered source Steven search-to-play root followthrough
        if: ${{ inputs.rank7_steven_followthrough }}
        run: node simulation/twinleaf/agent22-steven-followthrough.cjs > agent22-steven-followthrough.json
      - name: Native staged Bench Special Energy root in both seats
        run: node simulation/twinleaf/agent5-special-energy-bench-native-gate.cjs > agent5-special-energy-bench-native-result.json
      - name: Native matched first-return attack versus Bench Special fork in both seats
        run: node simulation/twinleaf/agent5-attack-special-arbitration-native.cjs > agent5-attack-special-arbitration-native.json
      - name: Native original Store two-seat bounded owner-root arbitration positive and hold
        run: node simulation/twinleaf/agent41-owner-arbitration-native.cjs > agent41-owner-arbitration-native.json
      - name: Native non-finishing attack versus immediate Buddy Pulse self-loss
        run: node simulation/twinleaf/agent5-buddy-pulse-nonfinishing-native.cjs > agent5-buddy-pulse-nonfinishing-native.json
      - name: Check non-finishing attack counterexample in both physical seats
        run: node -e "const a=require('node:assert/strict');const x=require('./agent5-buddy-pulse-nonfinishing-native.json');a.equal(x.nativeErrors,0);a.equal(x.attemptedSeats,2);a.equal(x.allNativeReversals,true);console.log(JSON.stringify({schema:x.schema,rows:x.rows.map(r=>({seat:r.seat,attackWinner:r.attackFirst.winner,attachWinner:r.attachFirst.winner,reason:r.exposure.reason}))}))"
      - name: Native two-Prize Buddy Pulse action-order falsification on both seats
        run: node simulation/twinleaf/agent42-buddy-pulse-two-prize-native.cjs > agent42-buddy-pulse-two-prize-native.json
      - name: Validate complete two-seat native winner reversal and reactive KO
        run: node -e "const a=require('node:assert/strict');const r=require('./agent42-buddy-pulse-two-prize-native.json');a.equal(r.nativeErrors,0);a.equal(r.allNativeWinnerReversed,true);a.ok(r.rows.every(x=>x.guardPreservedPotentialAttack&&x.nativeAttachmentConsumed&&x.nativeAttachmentConfirmed&&x.attackFirstPrizeWin&&x.attachFirstOpponentPrizeWin));console.log(JSON.stringify({schema:r.schema,enginePin:r.enginePin,rows:r.rows.map(x=>({seat:x.seat,attackWinner:x.attackFirst.winner,attachWinner:x.attachFirst.winner,guard:x.guarded.reason,ownerAfterAttack:x.attackFirst.ownerPrizes,opponentAfterAttach:x.attachFirst.opponentPrizes}))},null,2))"
      - name: Native original Store TAG TEAM three-Prize both-seat counterfactual
        if: ${{ inputs.three_prize_tagteam_native }}
        run: node simulation/twinleaf/agent42-tagteam-three-prize-native.cjs > agent42-tagteam-three-prize-native.json
      - name: Assert all original-Store three-Prize winner and opposite-seat reversals
        if: ${{ inputs.three_prize_tagteam_native }}
        run: node -e "const a=require('node:assert/strict');const x=require('./agent42-tagteam-three-prize-native.json');a.equal(x.nativeErrors,0);a.equal(x.bothSeatWinnerReversal,true);a.ok(x.rows.every(r=>r.attackFirstWins&&r.attachmentFirstLoses));console.log(JSON.stringify({schema:x.schema,pin:x.pin,rows:x.rows.map(r=>({seat:r.seat,attackWinner:r.attackingFirst.winner,attachmentWinner:r.attachingFirst.winner,oldVeto:r.oldPotential.reason}))},null,2))"
      - name: Native registered rank1 final Bench-slot Basic conflict
        run: node simulation/twinleaf/agent27-source-lastbench-two-basic-native.cjs > agent27-lastbench-native.json
      - name: Native registered source final Bench Wonder Tag search prompt closure
        run: node simulation/twinleaf/agent27-lastbench-wondertag-followthrough.cjs > agent27-lastbench-wondertag-native.json
      - name: Native source rank6 Initialization blocks the alternative Wonder Tag
        run: node simulation/twinleaf/agent27-lastbench-thorns-lock-native.cjs > agent27-lastbench-thorns-lock.json
      - name: Verify both-seat Store outcomes retained without strength inference
        run: node -e "const a=require('node:assert/strict');const r=require('./agent41-owner-arbitration-native.json');a.equal(r.rows.length,2);a.ok(r.rows.every(x=>x.nativeAttachmentConfirmed&&x.nativeSameAttackSettled&&x.nativeHoldAttackSettled));a.equal(r.competitiveQualifiedGames,0);console.log(JSON.stringify({schema:r.schema,version:r.policyVersion,rows:r.rows.map(x=>({seat:x.seat,selected:x.arbitratedRoot.kind,held:x.conservativeHold.reason}))}))"
      - name: Historical action arbiter A/B/A pure registration regression
        if: ${{ inputs.owner_terminal_arbitration_aba }}
        run: node --test tests/agent41-owner-arbitration-aba-development.test.cjs
      - name: Historical same-deal original Store baseline, opt-in arbiter and repeat
        if: ${{ inputs.owner_terminal_arbitration_aba }}
        run: node simulation/evaluation/agent41-owner-arbitration-aba-development.cjs > agent41-owner-arbitration-historical-aba.json
      - name: Verify every original registered historical physical deal is retained
        if: ${{ inputs.owner_terminal_arbitration_aba }}
        run: node -e "const a=require('node:assert/strict');const r=require('./agent41-owner-arbitration-historical-aba.json');a.equal(r.attempted,12);a.equal(r.pairs.length,4);a.equal(r.outcomeSummary.competitiveQualifiedGames,0);console.log(JSON.stringify({schema:r.schema,attempted:r.attempted,summary:r.outcomeSummary,pairs:r.pairs.map(p=>({id:p.trialId,comparison:p.physicalAB.status,repeat:p.repeatStability.status,firstActions:[p.original.actions,p.recipient.actions],winner:[p.original.winner,p.recipient.winner]}))},null,2))"
      - name: Rank3 original exact-60 fixed two-seat original Store A/B/A
        if: ${{ inputs.owner_terminal_arbitration_rank3 }}
        run: node simulation/evaluation/agent41-rank3-arbitration-original-store.cjs > agent41-rank3-arbitration-original-store.json
      - name: Preserve all rank3 native starts and outcomes without rating winners
        if: ${{ inputs.owner_terminal_arbitration_rank3 }}
        run: node -e "const a=require('node:assert/strict');const r=require('./agent41-rank3-arbitration-original-store.json');a.equal(r.attempted,12);a.equal(r.pairs.length,4);a.equal(r.summary.competitiveQualifiedGames,0);console.log(JSON.stringify({schema:r.schema,summary:r.summary,pairs:r.pairs.map(p=>({seat:p.candidateSeat,seed:p.seed,first:p.sourceFirst,initial:p.status,repeat:p.repeatStatus,changed:p.treatmentChangedRoots,steps:[p.baselineActions,p.treatmentActions],statuses:p.results}))},null,2))"
      - name: Native bilateral historical and source-first development
        if: ${{ ! inputs.native_search_only && ! inputs.owner_terminal_arbitration_aba && ! inputs.owner_terminal_arbitration_rank3 && ! inputs.agent12_campinggear_rank6_native }}
        run: node simulation/evaluation/agent5-owner-root-bilateral-native.cjs > agent5-owner-root-result.json
      - name: Fixed source-first development baseline without Thorns direct-line
        if: ${{ inputs.rank6_directline_paired }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT1_THORNS_DIRECT_ROOT_DEV: 'false'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-thorns-baseline-sourcefirst.json
      - name: Fixed source-first development treatment with Thorns direct-line
        if: ${{ inputs.rank6_directline_paired }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT1_THORNS_DIRECT_ROOT_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-thorns-treatment-sourcefirst.json
      - name: Preserve all matched, censored and aborting direct-line contrast arms
        if: ${{ inputs.rank6_directline_paired }}
        run: node scripts/agent5-rank6-directline-paired-census.cjs agent5-thorns-baseline-sourcefirst.json agent5-thorns-treatment-sourcefirst.json > agent5-thorns-directline-contrast.json
      - uses: actions/upload-artifact@v4
        with:
          name: actor-only-root-native-retrospective-rank11
          path: |
            agent5-thunder-mountain-native-gate.json
            agent5-special-energy-bench-native-result.json
            agent5-attack-special-arbitration-native.json
            agent41-owner-arbitration-native.json
            agent5-buddy-pulse-nonfinishing-native.json
            agent42-buddy-pulse-two-prize-native.json
            agent42-tagteam-three-prize-native.json
            agent27-lastbench-native.json
            agent27-lastbench-wondertag-native.json
            agent27-lastbench-thorns-lock.json
            agent41-owner-arbitration-historical-aba.json
            agent41-rank3-arbitration-original-store.json
            agent5-owner-root-result.json
            agent22-steven-native-store-result.json
            agent22-rank7-dealt-steven-pair.json
            agent22-steven-followthrough.json
            agent12-campinggear-rank6-native.json
            agent5-thorns-baseline-sourcefirst.json
            agent5-thorns-treatment-sourcefirst.json
            agent5-thorns-directline-contrast.json
          retention-days: 30
