name: Agent12 Capture Energy owner-search native regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-owner-native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize the pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile the pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run the native Capture Energy owner-search regression
        run: node --test tests/agent41-issue25-capture-owner.native.test.cjs
