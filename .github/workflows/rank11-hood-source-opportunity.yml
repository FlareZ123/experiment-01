name: Hood source audit (rank11/rank6/reply)
on:
  workflow_dispatch:
    inputs:
      study:
        description: 'Frozen manual source study'
        required: true
        type: choice
        default: rank11
        options:
          - rank11
          - rank6
          - rank6-reply
          - rank6-faba
          - common-vip
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Rank11 historical and policy tests
        if: ${{ inputs.study == 'rank11' }}
        run: node --test tests/early-shadow-rider-hood.test.cjs tests/protected-underworld-door.test.cjs tests/rank11-hood-opening-active-pivot.test.cjs
      - name: Rank6 frozen policy unit tests
        if: ${{ inputs.study == 'rank6' }}
        run: node --test tests/early-shadow-rider-hood.test.cjs tests/protected-underworld-door.test.cjs tests/hood-initialization-policy.test.cjs tests/rank6-hood-prospective-exposure.test.cjs
      - name: Rank6 source Hood-remover protocol tests
        if: ${{ inputs.study == 'rank6-reply' || inputs.study == 'rank6-faba' }}
        run: node --test tests/early-shadow-rider-hood.test.cjs tests/protected-underworld-door.test.cjs tests/hood-initialization-policy.test.cjs tests/rank6-hood-removal-policy.test.cjs tests/rank6-hood-removal-replay.test.cjs tests/rank6-faba-hood-target.test.cjs
      - name: Test reversible common VIP root policy with mock native interfaces
        if: ${{ inputs.study == 'common-vip' }}
        run: node --test tests/agent7-common-vip-pass-bridge.test.cjs
      - run: npm ci --no-audit --no-fund
        working-directory: vendor/twinleaf/ptcg-server
      - run: npm run compile
        working-directory: vendor/twinleaf/ptcg-server
      - name: Historical rank11 source observation
        if: ${{ inputs.study == 'rank11' }}
        run: node simulation/twinleaf/rank11-hood-source-opportunity.cjs > hood-source.json
      - name: Historical rank11 response
        if: ${{ inputs.study == 'rank11' }}
        run: node simulation/twinleaf/rank11-hood-target-counterfactual.cjs > hood-target-counterfactual.json
      - name: Historical rank11 starting Active
        if: ${{ inputs.study == 'rank11' }}
        run: node simulation/twinleaf/rank11-hood-opening-active-pivot.cjs > hood-opening-active-pivot.json
      - name: Frozen rank6 Hood and champion physical-deal comparison
        if: ${{ inputs.study == 'rank6' }}
        run: node simulation/twinleaf/rank6-hood-prospective-exposure.cjs > rank6-hood-prospective.json
      - name: Frozen original-source rank6 Hood removal replay
        if: ${{ inputs.study == 'rank6-reply' }}
        run: node simulation/twinleaf/rank6-hood-removal-replay.cjs > rank6-hood-removal-replay.json
      - name: Retrospective rank6 Faba target reply
        if: ${{ inputs.study == 'rank6-faba' }}
        run: node simulation/twinleaf/rank6-faba-hood-replay.cjs > rank6-faba-hood-replay.json
      - name: Two authentic source-first seats, shared held VIP root fallback
        if: ${{ inputs.study == 'common-vip' }}
        run: node simulation/twinleaf/agent7-common-vip-native-replay.cjs > agent7-common-vip-native.json
      - name: Archive common VIP historical paired native Store evidence
        if: ${{ always() && inputs.study == 'common-vip' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent7-common-vip-two-seat-native-v1
          path: agent7-common-vip-native.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.study == 'rank11' }}
        with:
          name: source-rank11-hood-trace
          path: |
            hood-source.json
            hood-target-counterfactual.json
            hood-opening-active-pivot.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.study == 'rank6' }}
        with:
          name: source-rank6-hood-paired-32
          path: rank6-hood-prospective.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.study == 'rank6-reply' }}
        with:
          name: source-rank6-hood-removal-replay
          path: rank6-hood-removal-replay.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.study == 'rank6-faba' }}
        with:
          name: source-rank6-faba-hood-target-replay
          path: rank6-faba-hood-replay.json
          if-no-files-found: error
