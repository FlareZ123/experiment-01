name: Rank11 Hood source audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - run: node --test tests/early-shadow-rider-hood.test.cjs tests/protected-underworld-door.test.cjs
      - run: npm ci --no-audit --no-fund
        working-directory: vendor/twinleaf/ptcg-server
      - run: npm run compile
        working-directory: vendor/twinleaf/ptcg-server
      - run: node simulation/twinleaf/rank11-hood-source-opportunity.cjs > hood-source.json
      - run: node simulation/twinleaf/rank11-hood-target-counterfactual.cjs > hood-target-counterfactual.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-rank11-hood-trace
          path: |
            hood-source.json
            hood-target-counterfactual.json
          if-no-files-found: error
