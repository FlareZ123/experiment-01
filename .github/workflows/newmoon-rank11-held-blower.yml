name: New Moon authentic held-Blower response

on:
  workflow_dispatch:
    inputs:
      gengar2_structural_probe:
        description: 'Bounded source-dealt two-Gengar-versus-Cologne fixed-60 pilot (6/11/26, both seats)'
        type: boolean
        required: false
        default: false
      handburn_counterfactual:
        description: 'Opt-in source-conserved rank11 turn49 Quick Ball defensive branch on archived seed'
        type: boolean
        required: false
        default: false
      lillie_factorial_probe:
        description: 'Opt-in preregistered six-seed plus one selected positive control, 4-arm low-hand Lillie policy exposure'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  field-blower-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned simulator dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned simulator
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run source-rank11 automatic policy with one real-hand candidate answer
        run: node simulation/twinleaf/newmoon-rank11-real-hand-blower-response.cjs > newmoon-rank11-held-blower.json
      - name: Source-printed Garbotoxin and pinned Field Blower target policy tests
        run: node --test tests/newmoon-garbotoxin-blower-autonomy.test.cjs tests/newmoon-garbotoxin-blower-pinned-prompt.test.cjs tests/newmoon-garbotoxin-blower-stadium-store.test.cjs tests/agent2-bilateral-composed-garbotoxin-store.test.cjs
      - name: Source-dealt automatic candidate response against the same autonomous Garbodor opener
        run: node simulation/twinleaf/newmoon-rank11-autonomous-blower-probe.cjs > newmoon-rank11-autonomous-blower.json
      - name: Pure owner-information proactive low-hand Lillie opportunity tests
        if: inputs.lillie_factorial_probe
        run: node --test tests/newmoon-proactive-lowhand-lillie-opportunity.test.cjs tests/newmoon-garbotoxin-blower-autonomy.test.cjs
      - name: Run predeclared rank11 four-arm small-horizon Lillie policy factorial
        if: inputs.lillie_factorial_probe
        run: node simulation/twinleaf/newmoon-rank11-proactive-lillie-factorial.cjs > newmoon-rank11-lillie-factorial.json
      - name: Preserve all prospective Lillie policy arms including errors
        if: inputs.lillie_factorial_probe && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-proactive-lowhand-lillie-factorial-unqualified
          path: newmoon-rank11-lillie-factorial.json
          if-no-files-found: warn
      - name: Check two-Gengar candidate print count and opener policy contracts
        if: inputs.gengar2_structural_probe
        run: node --test tests/newmoon-gengar2-structural-prospective.test.cjs tests/new-moon-compressor-payload-policy.test.cjs tests/rank6-broad-thorns-policy.test.cjs
      - name: Run frozen-versus-two-Gengar source-dealt 24-arm pilot
        if: inputs.gengar2_structural_probe
        run: node simulation/twinleaf/newmoon-gengar2-structural-prospective.cjs > newmoon-gengar2-pilot.json
      - name: Preserve complete candidate-variant pilot including errors
        if: inputs.gengar2_structural_probe && always()
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-gengar2-structural-pilot-unqualified
          path: newmoon-gengar2-pilot.json
          if-no-files-found: warn
      - name: Validate source turn49 Trainer discard priorities
        if: inputs.handburn_counterfactual
        run: node --test tests/rank11-turn49-handburn-counterfactual.test.cjs
      - name: Compare real-Store source turn49 Quick Ball hand burn and baseline reply
        if: inputs.handburn_counterfactual
        run: node simulation/twinleaf/rank11-turn49-handburn-source-probe.cjs > rank11-turn49-handburn-source.json
      - name: Preserve both real source turn49 policy arms and negative evidence
        if: inputs.handburn_counterfactual && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-turn49-handburn-counterfactual-unqualified
          path: rank11-turn49-handburn-source.json
          if-no-files-found: warn
      - name: Preserve source-first and selected legal Item counterfactual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-rank11-held-blower-unqualified
          path: |
            newmoon-rank11-held-blower.json
            newmoon-rank11-autonomous-blower.json
          if-no-files-found: warn
