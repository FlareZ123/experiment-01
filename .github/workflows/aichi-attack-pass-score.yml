name: Aichi Koraidon AttackTactic passive score audit

on:
  workflow_dispatch:
    inputs:
      apex_source_pair:
        description: Run frozen rank10 Apex resolver source-game contrast
        type: boolean
        required: false
        default: false
      apex_rank15_screen:
        description: Run bounded authentic rank10 versus rank15 Phantom Dive exposure screen
        type: boolean
        required: false
        default: false
      mega_energy_probe:
        description: Test printed two-Energy discard against Double Dragon
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  source-rank-score-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Test authentic Store pass-score observer and source action fork
        run: node --test tests/koraidon-pass-score-horizon.test.cjs tests/rank10-koraidon-source-attack-fork.test.cjs tests/pending-end-turn-switch-cleanup.test.cjs tests/pending-end-turn-switch-installer.test.cjs tests/pending-end-turn-headless-option.test.cjs tests/apex-prize-headless-policy.test.cjs tests/apex-coupled-paid-store.test.cjs tests/rank10-apex-prize-source-pair.test.cjs tests/attack-pass-horizon-policy.test.cjs tests/decision-scoped-detached-simulator.test.cjs tests/graph-difference-witness.test.cjs tests/wobbuffet-vileplume-stoutland-matrix.test.cjs
      - name: Optional Apex Dragon Mega Dragonite energy-discard Store probe
        if: inputs.mega_energy_probe == true
        run: node simulation/twinleaf/apex-mega-dragonite-energy-discard.cjs > mega-dragonite-energy-discard.json
      - uses: actions/upload-artifact@v4
        if: inputs.mega_energy_probe == true
        with:
          name: mega-dragonite-energy-discard
          path: mega-dragonite-energy-discard.json
          if-no-files-found: error
      - name: Optional exact rank10 source-Apex paired policy audit
        if: inputs.apex_source_pair == true
        run: node simulation/twinleaf/rank10-apex-prize-source-pair.cjs > rank10-apex-prize-source-pair.json
      - name: Summarize exact rank10 Apex policy source-game comparison
        if: inputs.apex_source_pair == true
        run: node -e "const x=require('./rank10-apex-prize-source-pair.json');console.log(JSON.stringify({schema:x.schema,firstDifference:x.firstRootActionDifference,controlRepeatExact:x.controlRepeatExact,control:x.control,experimental:x.experimental,qualified:x.qualifiedForCompetitiveInference}));"
      - uses: actions/upload-artifact@v4
        if: inputs.apex_source_pair == true
        with:
          name: rank10-apex-prize-source-pair
          path: rank10-apex-prize-source-pair.json
          if-no-files-found: error
      - name: Optional source-60 rank15 Regidrago Phantom Dive exposure screen
        if: inputs.apex_rank15_screen == true
        run: node simulation/twinleaf/rank15-regidrago-spread-exposure.cjs > rank15-spread-exposure.json
      - uses: actions/upload-artifact@v4
        if: inputs.apex_rank15_screen == true
        with:
          name: rank15-regidrago-spread-exposure
          path: rank15-spread-exposure.json
          if-no-files-found: error
      - name: Compare instrumented and uninstrumented source games
        run: node simulation/twinleaf/attack-pass-score-diagnostic.cjs
      - name: Exact v3 candidate-seat rank-10 score replay
        run: node simulation/twinleaf/aichi-rank10-koraidon-score.cjs
      - name: Explain source Koraidon score components
        run: node simulation/twinleaf/aichi-rank10-score-components.cjs
      - name: Check original turn-five Pass against Pale Moon delayed knockout
        run: node simulation/twinleaf/aichi-rank10-pale-moon-pass.cjs
      - name: Compare source Koraidon end-turn Pass against printed attack horizon
        run: node simulation/twinleaf/aichi-rank10-pass-horizon.cjs
      - name: Compare same-horizon printed Attack and Pass on source turn five
        run: node simulation/twinleaf/aichi-rank10-aligned-attack-probe.cjs > rank10-aligned-attack.json
      - name: Summarize first equal-source Koraidon decisions and repaired clone calls
        run: node -e "const x=require('./rank10-aligned-attack.json');for(const p of x.findings){const recap=z=>z.map(y=>({action:y.action,attack:y.attack,mutated:y.policyTimeRootGraphChanged,firstDiff:y.policyTimeRootGraphFirstDifference?{canonical:y.policyTimeRootGraphFirstDifference.canonicalPath,owner:y.policyTimeRootGraphFirstDifference.gamePath,klass:y.policyTimeRootGraphFirstDifference.className,field:y.policyTimeRootGraphFirstDifference.property,before:y.policyTimeRootGraphFirstDifference.before,after:y.policyTimeRootGraphFirstDifference.after}:null}));console.log(JSON.stringify({candidate:p.candidate,original:recap(p.sourceControlDecision),aligned:recap(p.sourceAlignedDecision),detachedControl:recap(p.sourceDetachedControlDecision),detachedAligned:recap(p.sourceDetachedAlignedDecision),firstSourceSame:p.beforeFirstTurn5DecisionIdentical,winners:[p.control.winner,p.aligned.winner,p.detachedControl.winner,p.detachedAligned.winner],qualified:false}));}"
      - uses: actions/upload-artifact@v4
        with:
          name: rank10-aligned-attack
          path: rank10-aligned-attack.json
          if-no-files-found: error
      - name: Resolve source-ranked Koraidon Pass, attack and retreat in genuine games
        run: node simulation/twinleaf/aichi-rank10-koraidon-source-fork.cjs > rank10-turn5-source-fork.json
      - name: Summarize matched three-arm source-game counterfactual
        run: node -e "const x=require('./rank10-turn5-source-fork.json'); for(const p of x.pairs) console.log(JSON.stringify({candidate:p.candidate,sourceSame:p.sameSourcePredecisionState,first:p.actualCandidateFirstTurnSlot,control:p.control.winner,attack:p.alternate.winner,retreat:p.retreat.winner,retreatEvents:p.retreat.actionsAtTurn5,prizes:[p.control.prizesRemaining,p.alternate.prizesRemaining,p.retreat.prizesRemaining]}))"
      - uses: actions/upload-artifact@v4
        with:
          name: rank10-turn5-source-game-fork
          path: rank10-turn5-source-fork.json
          if-no-files-found: error
      - name: Analyze source policy effects
        run: node simulation/twinleaf/aichi-rank10-policy-effect-matrix.cjs > rank10-policy-effect-matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: rank10-policy-effect-matrix
          path: rank10-policy-effect-matrix.json
          if-no-files-found: error
      - name: Compare original and corrected pending Pale Moon after source retreat
        run: node simulation/twinleaf/aichi-rank10-delayed-ko-switch.cjs > rank10-delayed-ko-switch.json
      - name: Summarize authentic delayed KO switch correction
        run: node -e "const x=require('./rank10-delayed-ko-switch.json'); for(const p of x.findings) console.log(JSON.stringify({candidate:p.candidate,source:p.predecisionSourceDigest,originalWinner:p.original.winner,correctedWinner:p.corrected.winner,originalPrizes:p.original.prizes,correctedPrizes:p.corrected.prizes,removedRoot:p.corrected.removedRootPending,originalWindow:p.original.window,correctedWindow:p.corrected.window}))"
      - uses: actions/upload-artifact@v4
        with:
          name: rank10-delayed-ko-switch
          path: rank10-delayed-ko-switch.json
          if-no-files-found: error
