name: Aichi Koraidon AttackTactic passive score audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-rank-score-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Test authentic Store pass-score observer and source action fork
        run: node --test tests/koraidon-pass-score-horizon.test.cjs tests/rank10-koraidon-source-attack-fork.test.cjs tests/pending-end-turn-switch-cleanup.test.cjs tests/attack-pass-horizon-policy.test.cjs
      - name: Compare instrumented and uninstrumented source games
        run: node simulation/twinleaf/attack-pass-score-diagnostic.cjs
      - name: Exact v3 candidate-seat rank-10 score replay
        run: node simulation/twinleaf/aichi-rank10-koraidon-score.cjs
      - name: Explain source Koraidon score components
        run: node simulation/twinleaf/aichi-rank10-score-components.cjs
      - name: Check original turn-five Pass against Pale Moon delayed knockout
        run: node simulation/twinleaf/aichi-rank10-pale-moon-pass.cjs
      - name: Compare source Koraidon end-turn Pass against printed attack horizon
        run: node simulation/twinleaf/aichi-rank10-pass-horizon.cjs
      - name: Compare same-horizon printed Attack and Pass on source turn five
        run: node simulation/twinleaf/aichi-rank10-aligned-attack-probe.cjs > rank10-aligned-attack.json
      - name: Summarize first equal-source Koraidon decisions
        run: node -e "const x=require('./rank10-aligned-attack.json');for(const p of x.findings)console.log(JSON.stringify({candidate:p.candidate,original:p.sourceControlDecision.map(z=>({action:z.action,attack:z.attack,mutated:z.policyTimeRootGraphChanged})),aligned:p.sourceAlignedDecision.map(z=>({action:z.action,attack:z.attack,mutated:z.policyTimeRootGraphChanged})),firstSourceSame:p.beforeFirstTurn5DecisionIdentical,control:p.control.winner,alignedWinner:p.aligned.winner,qualified:false}))"
      - uses: actions/upload-artifact@v4
        with:
          name: rank10-aligned-attack
          path: rank10-aligned-attack.json
          if-no-files-found: error
      - name: Resolve source-ranked Koraidon Pass, attack and retreat in genuine games
        run: node simulation/twinleaf/aichi-rank10-koraidon-source-fork.cjs > rank10-turn5-source-fork.json
      - name: Summarize matched three-arm source-game counterfactual
        run: node -e "const x=require('./rank10-turn5-source-fork.json'); for(const p of x.pairs) console.log(JSON.stringify({candidate:p.candidate,sourceSame:p.sameSourcePredecisionState,first:p.actualCandidateFirstTurnSlot,control:p.control.winner,attack:p.alternate.winner,retreat:p.retreat.winner,retreatEvents:p.retreat.actionsAtTurn5,prizes:[p.control.prizesRemaining,p.alternate.prizesRemaining,p.retreat.prizesRemaining]}))"
      - uses: actions/upload-artifact@v4
        with:
          name: rank10-turn5-source-game-fork
          path: rank10-turn5-source-fork.json
          if-no-files-found: error
      - name: Compare original and corrected pending Pale Moon after source retreat
        run: node simulation/twinleaf/aichi-rank10-delayed-ko-switch.cjs > rank10-delayed-ko-switch.json
      - name: Summarize authentic delayed KO switch correction
        run: node -e "const x=require('./rank10-delayed-ko-switch.json'); for(const p of x.findings) console.log(JSON.stringify({candidate:p.candidate,source:p.predecisionSourceDigest,originalWinner:p.original.winner,correctedWinner:p.corrected.winner,originalPrizes:p.original.prizes,correctedPrizes:p.corrected.prizes,removedRoot:p.corrected.removedRootPending,originalWindow:p.original.window,correctedWindow:p.corrected.window}))"
      - uses: actions/upload-artifact@v4
        with:
          name: rank10-delayed-ko-switch
          path: rank10-delayed-ko-switch.json
          if-no-files-found: error
