name: Wobbuffet discard-lock research diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Characterize hand and discard Wobbuffet effect
        run: node simulation/twinleaf/wobbuffet-discard-diagnostic.cjs
      - name: Stage original Temple Wobbuffet and Latias actual retreat versus Thorns both seats
        run: node simulation/twinleaf/agent15-wobbuffet-latias-thorns-retreat-native.cjs > agent15-wobbuffet-latias-retreat.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent15-wobbuffet-latias-retreat-stage
          path: agent15-wobbuffet-latias-retreat.json
          if-no-files-found: warn
          retention-days: 14
