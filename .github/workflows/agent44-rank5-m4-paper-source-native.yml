name: Agent44 original rank5 native paper audit and first independent release intake

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execute frozen original native games or inspect archived public M4 roots without replay
        type: choice
        default: inspect
        required: true
        options:
          - inspect
          - run
          - release-case
          - release-inspect
          - gengar-tempo
          - gengar-hand6
          - gengar-factorial
          - gengar-fresh-eight
          - gengar-flexible-v2
          - gengar-resource-v3
          - gengar-resource-v3-regression
          - gengar-forest-stone-posthoc

permissions:
  contents: read

jobs:
  original-rank5-paper-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Build exact nine-object trust-gate intake from archived single case
        if: ${{ inputs.mode == 'release-inspect' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check simulation/evaluation/2026-11/agent44-first-release-independent-bundle.cjs
          gh run download 42625296261 -R FlareZ123/experiment-01 -n agent44-first-independent-rank5-newmoon-native-case-v1 -D prior-release
          node simulation/evaluation/2026-11/agent44-first-release-independent-bundle.cjs prior-release/agent44-first-independent-rank5-newmoon-case-v1.json artifacts/agent44-first-release-nine-object-intake-v1.json
      - name: Preserve original trial-independent nine-object admission packet
        if: ${{ always() && inputs.mode == 'release-inspect' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-first-release-nine-object-bundle-v1
          path: artifacts/agent44-first-release-nine-object-intake-v1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Inspect completed native artifact without replaying any games
        if: ${{ inputs.mode == 'inspect' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42610256883 -R FlareZ123/experiment-01 -n agent44-rank5-m4-paper-source-four-native-v1 -D prior-m4
          node simulation/evaluation/2026-11/agent44-m4-source-archive-intake.cjs prior-m4/agent44-rank5-m4-paper-source-native-v1.json
      - name: Validate frozen source program
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' || inputs.mode == 'gengar-fresh-eight' || inputs.mode == 'gengar-flexible-v2' || inputs.mode == 'gengar-resource-v3' || inputs.mode == 'gengar-resource-v3-regression' || inputs.mode == 'gengar-forest-stone-posthoc' }}
        run: |
          node --check simulation/evaluation/2026-11/agent44-rank5-m4-paper-source-native.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/2026-11/agent44-rank5-ranger-source-alias.test.cjs
          node simulation/evaluation/2026-11/agent44-rank5-m4-paper-source-native.cjs --inspect-only
      - name: Validate fresh preregistered single review case
        if: ${{ inputs.mode == 'release-case' }}
        run: |
          node --check simulation/evaluation/2026-11/agent44-first-original-rank5-newmoon-case.cjs
          node --check simulation/twinleaf/agent36-live-paper-root-receipts.cjs
          node --test tests/2026-11/agent44-rank5-ranger-source-alias.test.cjs tests/2026-11/agent36-live-paper-root-receipts.test.cjs
          node simulation/evaluation/2026-11/agent44-first-original-rank5-newmoon-case.cjs --inspect-only
      - name: Fetch pinned vendor revision
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' || inputs.mode == 'gengar-fresh-eight' || inputs.mode == 'gengar-flexible-v2' || inputs.mode == 'gengar-resource-v3' || inputs.mode == 'gengar-resource-v3-regression' || inputs.mode == 'gengar-forest-stone-posthoc' }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' || inputs.mode == 'gengar-fresh-eight' || inputs.mode == 'gengar-flexible-v2' || inputs.mode == 'gengar-resource-v3' || inputs.mode == 'gengar-resource-v3-regression' || inputs.mode == 'gengar-forest-stone-posthoc' }}
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native simulator
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' || inputs.mode == 'gengar-fresh-eight' || inputs.mode == 'gengar-flexible-v2' || inputs.mode == 'gengar-resource-v3' || inputs.mode == 'gengar-resource-v3-regression' || inputs.mode == 'gengar-forest-stone-posthoc' }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native simulator
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' || inputs.mode == 'gengar-fresh-eight' || inputs.mode == 'gengar-flexible-v2' || inputs.mode == 'gengar-resource-v3' || inputs.mode == 'gengar-resource-v3-regression' || inputs.mode == 'gengar-forest-stone-posthoc' }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay same four frozen original-source games under exact Ranger link repair
        if: ${{ inputs.mode == 'run' }}
        env:
          AGENT44_RANGER_LINK_REPLAY: 'true'
        run: node simulation/evaluation/2026-11/agent44-rank5-m4-paper-source-native.cjs
      - name: Execute one fresh original-rank5 New Moon release intake
        if: ${{ inputs.mode == 'release-case' }}
        run: node simulation/evaluation/2026-11/agent44-first-original-rank5-newmoon-case.cjs
      - name: Validate owner-visible Gengar branch and frozen A/B/A registration
        if: ${{ inputs.mode == 'gengar-tempo' }}
        run: |
          node --check simulation/twinleaf/2026-11/agent20-gengar-horror-house-tempo.cjs
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Run original-rank5 exact-deal Gengar owner tempo A/B/A
        if: ${{ inputs.mode == 'gengar-tempo' }}
        run: node simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
      - name: Preserve all Gengar A/B/A Store and physical custody evidence
        if: ${{ always() && inputs.mode == 'gengar-tempo' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-gengar-horror-house-tempo-posthoc-aba
          path: artifacts/agent20-rank5-gengar-tempo-posthoc-aba.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate owner-only public hand timing and replay script
        if: ${{ inputs.mode == 'gengar-hand6' }}
        run: |
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-hand6-aba.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Execute public opponent hand-size-gated GX same deal A/B/A
        if: ${{ inputs.mode == 'gengar-hand6' }}
        run: node simulation/evaluation/2026-11/agent20-rank5-gengar-hand6-aba.cjs
      - name: Preserve timed GX root, physical and opponent response evidence
        if: ${{ always() && inputs.mode == 'gengar-hand6' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-gengar-hand6-timing-posthoc-aba
          path: artifacts/agent20-rank5-gengar-hand6-posthoc-aba.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate owner-Lillie and Gengar 2x2 frozen experiment
        if: ${{ inputs.mode == 'gengar-factorial' }}
        run: |
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-lillie-factorial.cjs
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Run exact-deal owner Lillie and Gengar two-factor native experiment
        if: ${{ inputs.mode == 'gengar-factorial' }}
        run: node simulation/evaluation/2026-11/agent20-rank5-gengar-lillie-factorial.cjs
      - name: Preserve complete independent four-policy and control-repeat evidence
        if: ${{ always() && inputs.mode == 'gengar-factorial' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-rank5-lillie-gengar-factorial-v1
          path: artifacts/agent20-rank5-gengar-lillie-factorial.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate independent preregistered fresh both-seat Gengar holdout
        if: ${{ inputs.mode == 'gengar-fresh-eight' }}
        run: |
          node --check simulation/evaluation/2026-11/agent50-rank5-lillie-gengar-fresh-eight.cjs
          node --test tests/2026-11/agent50-rank5-lillie-gengar-fresh-eight.test.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Execute eight fresh physically matched both-seat Gengar pairs
        if: ${{ inputs.mode == 'gengar-fresh-eight' }}
        run: node simulation/evaluation/2026-11/agent50-rank5-lillie-gengar-fresh-eight.cjs
      - name: Archive every registered fresh Gengar attempt and native physical tape
        if: ${{ always() && inputs.mode == 'gengar-fresh-eight' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-rank5-lillie-gengar-fresh-eight-v1
          path: artifacts/agent50-rank5-lillie-gengar-fresh-eight.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate flexible v2 Gengar Telepath funding and frozen fresh comparison
        if: ${{ inputs.mode == 'gengar-flexible-v2' }}
        run: |
          node --check simulation/twinleaf/2026-11/agent50-gengar-flexible-telepath-v2.cjs
          node --check simulation/evaluation/2026-11/agent50-rank5-gengar-flexible-v2-fresh-eight.cjs
          node --test tests/2026-11/agent50-gengar-flexible-telepath-v2.test.cjs
          node --test tests/2026-11/agent50-rank5-gengar-flexible-v2-fresh-eight.test.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Execute eight prospective physically matched flexible Gengar v1-v2 pairs
        if: ${{ inputs.mode == 'gengar-flexible-v2' }}
        run: node simulation/evaluation/2026-11/agent50-rank5-gengar-flexible-v2-fresh-eight.cjs
      - name: Archive flexible Gengar v1-v2 prospective native root and physical tapes
        if: ${{ always() && inputs.mode == 'gengar-flexible-v2' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-rank5-gengar-flexible-v2-fresh-eight-v1
          path: artifacts/agent50-rank5-gengar-flexible-v2-fresh-eight.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate prospective resource-preserving Gengar v3 and frozen cohorts
        if: ${{ inputs.mode == 'gengar-resource-v3' }}
        run: |
          node --check simulation/twinleaf/2026-11/agent50-gengar-perfection-resource-guard-v3.cjs
          node --check simulation/evaluation/2026-11/agent50-rank5-gengar-resource-v3-fresh-eight.cjs
          node --test tests/2026-11/agent50-gengar-perfection-resource-guard-v3.test.cjs tests/2026-11/agent50-rank5-gengar-resource-v3-fresh-eight.test.cjs
      - name: Execute eight frozen fresh two-seat v2 versus v3 native pairs
        if: ${{ inputs.mode == 'gengar-resource-v3' }}
        run: node simulation/evaluation/2026-11/agent50-rank5-gengar-resource-v3-fresh-eight.cjs
      - name: Archive all v2 versus v3 native results including rejected or censored pairs
        if: ${{ always() && inputs.mode == 'gengar-resource-v3' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-rank5-gengar-resource-v3-fresh-eight-v1
          path: artifacts/agent50-rank5-gengar-resource-v3-fresh-eight.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate original known-negative Gengar resource-v3 native A-B-A replay
        if: ${{ inputs.mode == 'gengar-resource-v3-regression' }}
        run: |
          node --check simulation/evaluation/2026-11/agent36-gengar-v3-original-regression-native.cjs
          node --test tests/2026-11/agent50-gengar-perfection-resource-guard-v3.test.cjs
      - name: Replay one original physically identical v2-v3-v2 negative regression
        if: ${{ inputs.mode == 'gengar-resource-v3-regression' }}
        run: node simulation/evaluation/2026-11/agent36-gengar-v3-original-regression-native.cjs
      - name: Archive complete posthoc Gengar resource decision Store tapes
        if: ${{ always() && inputs.mode == 'gengar-resource-v3-regression' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent36-gengar-v3-original-negative-50703-aba-native
          path: artifacts/agent36-gengar-v3-original-regression-native.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate printed owner Stone and posthoc frozen rank5 historical trial
        if: ${{ inputs.mode == 'gengar-forest-stone-posthoc' }}
        run: |
          node --check simulation/evaluation/2026-11/agent36-rank5-held-forest-stone-50801-aba.cjs
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
          node --check simulation/evaluation/2026-11/agent43-native-attack-damage-carryover.cjs
          node --check simulation/twinleaf/agent36-live-paper-root-receipts.cjs
          node --test tests/2026-11/agent17-early-forest-seal-root.test.cjs tests/2026-11/agent36-perfection-prize-receipts.test.cjs tests/2026-11/agent36-rank5-candidate-seat-summary.test.cjs tests/2026-11/agent36-rank5-held-forest-stone-50801-aba.test.cjs tests/2026-11/agent36-live-paper-root-receipts.test.cjs tests/2026-11/agent43-native-attack-damage-carryover.test.cjs
      - name: Replay held original-rank5 Stone native A-B-A with both-seat owner policy
        if: ${{ inputs.mode == 'gengar-forest-stone-posthoc' }}
        run: node simulation/evaluation/2026-11/agent36-rank5-held-forest-stone-50801-aba.cjs
      - name: Archive actual Stone Tool and Star Alchemy accepted native physical receipts
        if: ${{ always() && inputs.mode == 'gengar-forest-stone-posthoc' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent36-rank5-held-forest-stone-50801-posthoc-aba
          path: artifacts/agent36-rank5-held-forest-stone-50801-aba.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive single-case review packet and exact missing-evidence manifest
        if: ${{ always() && inputs.mode == 'release-case' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-first-independent-rank5-newmoon-native-case-v2
          path: artifacts/agent44-first-independent-rank5-newmoon-case-v2.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive complete root ledgers and original physical opening receipts
        if: ${{ always() && inputs.mode == 'run' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-rank5-m4-paper-source-four-native-v1
          path: artifacts/agent44-rank5-m4-paper-source-native-v1.json
          if-no-files-found: warn
          retention-days: 30
