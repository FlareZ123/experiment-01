name: Agent44 original rank5 native paper audit and first independent release intake

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execute frozen original native games or inspect archived public M4 roots without replay
        type: choice
        default: inspect
        required: true
        options:
          - inspect
          - run
          - release-case
          - release-inspect
          - gengar-tempo
          - gengar-hand6
          - gengar-factorial

permissions:
  contents: read

jobs:
  original-rank5-paper-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Build exact nine-object trust-gate intake from archived single case
        if: ${{ inputs.mode == 'release-inspect' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check simulation/evaluation/2026-11/agent44-first-release-independent-bundle.cjs
          gh run download 42625296261 -R FlareZ123/experiment-01 -n agent44-first-independent-rank5-newmoon-native-case-v1 -D prior-release
          node simulation/evaluation/2026-11/agent44-first-release-independent-bundle.cjs prior-release/agent44-first-independent-rank5-newmoon-case-v1.json artifacts/agent44-first-release-nine-object-intake-v1.json
      - name: Preserve original trial-independent nine-object admission packet
        if: ${{ always() && inputs.mode == 'release-inspect' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-first-release-nine-object-bundle-v1
          path: artifacts/agent44-first-release-nine-object-intake-v1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Inspect completed native artifact without replaying any games
        if: ${{ inputs.mode == 'inspect' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42610256883 -R FlareZ123/experiment-01 -n agent44-rank5-m4-paper-source-four-native-v1 -D prior-m4
          node simulation/evaluation/2026-11/agent44-m4-source-archive-intake.cjs prior-m4/agent44-rank5-m4-paper-source-native-v1.json
      - name: Validate frozen source program
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' }}
        run: |
          node --check simulation/evaluation/2026-11/agent44-rank5-m4-paper-source-native.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/2026-11/agent44-rank5-ranger-source-alias.test.cjs
          node simulation/evaluation/2026-11/agent44-rank5-m4-paper-source-native.cjs --inspect-only
      - name: Validate fresh preregistered single review case
        if: ${{ inputs.mode == 'release-case' }}
        run: |
          node --check simulation/evaluation/2026-11/agent44-first-original-rank5-newmoon-case.cjs
          node --test tests/2026-11/agent44-rank5-ranger-source-alias.test.cjs
          node simulation/evaluation/2026-11/agent44-first-original-rank5-newmoon-case.cjs --inspect-only
      - name: Fetch pinned vendor revision
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' }}
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native simulator
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native simulator
        if: ${{ inputs.mode == 'run' || inputs.mode == 'release-case' || inputs.mode == 'gengar-tempo' || inputs.mode == 'gengar-hand6' || inputs.mode == 'gengar-factorial' }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay same four frozen original-source games under exact Ranger link repair
        if: ${{ inputs.mode == 'run' }}
        env:
          AGENT44_RANGER_LINK_REPLAY: 'true'
        run: node simulation/evaluation/2026-11/agent44-rank5-m4-paper-source-native.cjs
      - name: Execute one fresh original-rank5 New Moon release intake
        if: ${{ inputs.mode == 'release-case' }}
        run: node simulation/evaluation/2026-11/agent44-first-original-rank5-newmoon-case.cjs
      - name: Validate owner-visible Gengar branch and frozen A/B/A registration
        if: ${{ inputs.mode == 'gengar-tempo' }}
        run: |
          node --check simulation/twinleaf/2026-11/agent20-gengar-horror-house-tempo.cjs
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Run original-rank5 exact-deal Gengar owner tempo A/B/A
        if: ${{ inputs.mode == 'gengar-tempo' }}
        run: node simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
      - name: Preserve all Gengar A/B/A Store and physical custody evidence
        if: ${{ always() && inputs.mode == 'gengar-tempo' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-gengar-horror-house-tempo-posthoc-aba
          path: artifacts/agent20-rank5-gengar-tempo-posthoc-aba.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate owner-only public hand timing and replay script
        if: ${{ inputs.mode == 'gengar-hand6' }}
        run: |
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-hand6-aba.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Execute public opponent hand-size-gated GX same deal A/B/A
        if: ${{ inputs.mode == 'gengar-hand6' }}
        run: node simulation/evaluation/2026-11/agent20-rank5-gengar-hand6-aba.cjs
      - name: Preserve timed GX root, physical and opponent response evidence
        if: ${{ always() && inputs.mode == 'gengar-hand6' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-gengar-hand6-timing-posthoc-aba
          path: artifacts/agent20-rank5-gengar-hand6-posthoc-aba.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate owner-Lillie and Gengar 2x2 frozen experiment
        if: ${{ inputs.mode == 'gengar-factorial' }}
        run: |
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-lillie-factorial.cjs
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
          node --test tests/2026-11/agent20-gengar-horror-house-tempo.test.cjs
      - name: Run exact-deal owner Lillie and Gengar two-factor native experiment
        if: ${{ inputs.mode == 'gengar-factorial' }}
        run: node simulation/evaluation/2026-11/agent20-rank5-gengar-lillie-factorial.cjs
      - name: Preserve complete independent four-policy and control-repeat evidence
        if: ${{ always() && inputs.mode == 'gengar-factorial' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-rank5-lillie-gengar-factorial-v1
          path: artifacts/agent20-rank5-gengar-lillie-factorial.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive single-case review packet and exact missing-evidence manifest
        if: ${{ always() && inputs.mode == 'release-case' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-first-independent-rank5-newmoon-native-case-v1
          path: artifacts/agent44-first-independent-rank5-newmoon-case-v1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive complete root ledgers and original physical opening receipts
        if: ${{ always() && inputs.mode == 'run' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-rank5-m4-paper-source-four-native-v1
          path: artifacts/agent44-rank5-m4-paper-source-native-v1.json
          if-no-files-found: warn
          retention-days: 30
