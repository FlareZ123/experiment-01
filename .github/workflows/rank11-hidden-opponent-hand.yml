name: Rank-11 opponent hidden-hand policy audit

on:
  workflow_dispatch:
    inputs:
      agent23_live_bilateral:
        description: 'Run four canonical historical rank6/rank11 postgame owner-hand counterfactuals (never competitive games)'
        required: false
        type: boolean
        default: false
      agent23_bounded_hidden_worlds:
        description: 'When live bilateral is enabled, compare bounded detached original-root hidden worlds (still unqualified)'
        required: false
        type: boolean
        default: false
      agent11_ghetsis_scoring:
        description: 'Pinned rank11 60 v Ghetsis Supporter native-versus-blinded hidden-hand score parity'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  poltergeist-audit:
    if: ${{ !inputs.agent23_live_bilateral && !inputs.agent11_ghetsis_scoring }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify observational-equivalence controls and hidden-hand forecast
        run: node --test tests/rank11-hidden-opponent-hand-poltergeist.test.cjs
      - name: Print source-inventory-locked score differential
        run: node simulation/twinleaf/rank11-hidden-opponent-hand-poltergeist.cjs
      - name: Verify detached opponent-hidden-pool attack score invariance
        run: node --test tests/rank11-blind-poltergeist-forecast.test.cjs
      - name: Print source-60 score equivalence after blinded sampling
        run: node simulation/twinleaf/rank11-blind-poltergeist-forecast.cjs
      - name: Source-inventory hidden-hand choice contrast
        run: node --test tests/rank11-hidden-hand-action-choice.test.cjs
      - name: Print contrasting attack choices
        run: node simulation/twinleaf/rank11-hidden-hand-action-choice.cjs
      - name: Verify opt-in delegated Perfection blindness
        run: node --test tests/perfection-hidden-pool-ability-audit.test.cjs
      - name: Print Perfection score differential with and without sampling
        run: node simulation/twinleaf/perfection-hidden-pool-ability-audit.cjs
      - name: Test staged delegated Perfection chosen-action parity
        run: node --test tests/perfection-hidden-choice-decision.test.cjs
      - name: Print staged Perfection action-choice thresholds
        run: node simulation/twinleaf/perfection-hidden-choice-decision.cjs
      - name: Complete-bot actor-observation paired hidden-hand regression
        run: node --test tests/rank11-full-bot-hidden-hand-pair.test.cjs
      - name: Print complete-bot action choices under both hidden partitions
        run: node simulation/twinleaf/rank11-full-bot-hidden-hand-pair.cjs
      - name: Pure postgame hidden-opponent comparator controls
        run: node --test tests/opponent-hidden-live-root-probe.test.cjs tests/agent23-bounded-hidden-world-scan.test.cjs tests/agent23-bilateral-opponent-hand-postgame.test.cjs

  agent23-live-bilateral:
    if: ${{ inputs.agent23_live_bilateral }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned Twinleaf revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify fail-closed source-root and postgame decision controls
        run: node --test tests/opponent-hidden-live-root-probe.test.cjs tests/agent23-bounded-hidden-world-scan.test.cjs tests/agent23-bilateral-opponent-hand-postgame.test.cjs
      - name: Replay canonical four historical arms and archive all attempts
        env:
          AGENT23_RESULT_OUTPUT: agent23-opponent-hidden-postgame.json
          AGENT23_BOUNDED_HIDDEN_SCAN_DEV: ${{ inputs.agent23_bounded_hidden_worlds }}
        run: node simulation/evaluation/agent23-bilateral-opponent-hand-postgame.cjs
      - name: Read complete historical comparison census
        run: >-
          node -e "const a=require('./agent23-opponent-hidden-postgame.json');
          console.log(JSON.stringify({schema:a.schema,attempts:a.attempts,
          noninterferingReplays:a.noninterferingReplays,
          rootOwnerActionsReproduced:a.rootOwnerActionsReproduced,
          conditionalActionReversals:a.conditionalActionReversals,
          outcomes:a.rows.map(x=>({trial:x.trialId,
          classification:x.classification,
          retained:true})),
          qualifiedCompetitiveGames:0},null,2));"
      - name: Retain all genuine Store and postgame counterfactual attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent23-live-opponent-hidden-historical
          path: agent23-opponent-hidden-postgame.json
          if-no-files-found: warn

  agent11-ghetsis-scoring:
    if: ${{ inputs.agent11_ghetsis_scoring && !inputs.agent23_live_bilateral }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify live-root action cloning and source-rank11 counterworld scores
        run: |
          node --check simulation/twinleaf/agent11-opponent-hidden-pool-all-tactic-scores.cjs
          node --test tests/agent11-ghetsis-scores.test.cjs tests/rank11-full-bot-hidden-hand-pair.test.cjs
      - name: Archive all raw, partial and proposed card-game score outcomes
        run: node simulation/twinleaf/agent11-ghetsis-scores.cjs > agent11-ghetsis-score-parity.json
      - name: Upload failed and successful score diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent11-rank11-ghetsis-source-print-scoring
          path: agent11-ghetsis-score-parity.json
          if-no-files-found: warn
