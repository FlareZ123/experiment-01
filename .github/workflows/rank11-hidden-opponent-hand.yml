name: Rank-11 opponent hidden-hand policy audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poltergeist-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify observational-equivalence controls and hidden-hand forecast
        run: node --test tests/rank11-hidden-opponent-hand-poltergeist.test.cjs
      - name: Print source-inventory-locked score differential
        run: node simulation/twinleaf/rank11-hidden-opponent-hand-poltergeist.cjs
      - name: Verify detached opponent-hidden-pool attack score invariance
        run: node --test tests/rank11-blind-poltergeist-forecast.test.cjs
      - name: Print source-60 score equivalence after blinded sampling
        run: node simulation/twinleaf/rank11-blind-poltergeist-forecast.cjs
      - name: Source-inventory hidden-hand choice contrast
        run: node --test tests/rank11-hidden-hand-action-choice.test.cjs
      - name: Print contrasting attack choices
        run: node simulation/twinleaf/rank11-hidden-hand-action-choice.cjs
      - name: Verify opt-in delegated Perfection blindness
        run: node --test tests/perfection-hidden-pool-ability-audit.test.cjs
      - name: Print Perfection score differential with and without sampling
        run: node simulation/twinleaf/perfection-hidden-pool-ability-audit.cjs
