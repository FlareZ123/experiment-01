name: Agent47 active-position retreat veto contracts

on:
  workflow_dispatch:
    inputs:
      native_handoff:
        description: 'Run four controlled native Store Iron Thorns lock handoff tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out research sources
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify four mobility frontiers and protected Active Ability contracts
        run: >-
          node --test
          tests/2026-11/agent47-active-position-retreat-veto.test.cjs
          tests/agent1-owner-float-stone-mobility.test.cjs
          tests/agent31-zero-energy-strand-floatstone.test.cjs
          tests/agent42-public-two-unit-paid-retreat-proposal.test.cjs
          tests/2026-11/agent47-guzma-active-lock-mobility.test.cjs
          tests/agent2-held-guzma-mobility-frontier.test.cjs
          tests/agent2-owner-guzma-mobility-frontier.test.cjs
          tests/agent14-generic-funded-floatstone-frontier.test.cjs
          tests/agent10-flexible-paid-retreat-frontier.test.cjs
          tests/agent2-actor-multi-basic-paid-retreat-frontier.test.cjs
          tests/2026-11/agent47-general-retreat-lock-retention.test.cjs
          tests/agent47-actor-hand-discard.test.cjs
          tests/2026-11/agent47/attack-fuel-discard.test.cjs

  native-handoff:
    if: ${{ inputs.native_handoff }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research sources
        uses: actions/checkout@v4
      - name: Check out exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned native server
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Native Store lock handoff on both physical seats
        run: >-
          node --test
          tests/2026-11/agent47-iron-thorns-active-lock-handoff.native.test.cjs
          tests/2026-11/agent47/attack-fuel-discard.native.test.cjs
