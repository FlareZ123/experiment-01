name: Aichi rank24 prospective owner-policy comparison
on:
  workflow_dispatch:
    inputs:
      k1_probe_only:
        description: Run three-source-deal actor-owned search regression
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-rank24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Check own-hand source policy and cohort integrity
        run: |
          node --check simulation/twinleaf/rank24-thorns-three-arm-prospective.cjs
          node --check simulation/twinleaf/rank24-k1-search-regression.cjs
          node --check simulation/twinleaf/owner-deck-search-witness.cjs
          node --test tests/aichi-thorns-crossrank-opening.test.cjs tests/rank6-broad-thorns-policy.test.cjs tests/owner-deck-search-witness.test.cjs tests/owner-k1-deck-membership.test.cjs tests/owner-k0-observable-inventory.test.cjs tests/native-supporter-turn-audit.test.cjs tests/paper-supporter-quota-guard.test.cjs tests/supporter-proposal-paper-quota.test.cjs
      - name: Install pinned engine packages
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all twenty-four prespecified source-dealt three-arm seeds
        if: ${{ !inputs.k1_probe_only }}
        run: node simulation/twinleaf/rank24-thorns-three-arm-prospective.cjs > rank24-three-arm-source.json
      - name: Print diagnostic status and preserved non-exposures
        if: ${{ !inputs.k1_probe_only }}
        run: node -e "const r=require('./rank24-three-arm-source.json'); console.log(JSON.stringify({schema:r.schema,seeds:r.precommittedSeeds.length,summary:r.summary,qualified:r.competitiveQualifiedGames,head:r.researchRevision},null,2));"
      - name: Archive every fixed seed and arm, including failures
        if: ${{ always() && !inputs.k1_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: rank24-three-arm-prospective-source
          path: rank24-three-arm-source.json
          if-no-files-found: warn
          retention-days: 14
      - name: Execute rank24 original source owner-deck K0-to-K1 regression
        if: ${{ inputs.k1_probe_only }}
        run: |
          node simulation/twinleaf/rank24-k1-search-regression.cjs > rank24-k1-search-regression.json
          node simulation/twinleaf/rank24-paper-supporter-proposal-native.cjs > rank24-paper-supporter-proposal-native.json
      - name: Archive three native K1 search cases with unchanged policy control
        if: ${{ always() && inputs.k1_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: rank24-k1-owner-search-regression
          path: |
            rank24-k1-search-regression.json
            rank24-paper-supporter-proposal-native.json
          if-no-files-found: warn
          retention-days: 14
