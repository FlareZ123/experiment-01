name: Aichi rank24 prospective owner-policy comparison
on:
  workflow_dispatch:
    inputs:
      agent9_paid_search_only:
        description: Replay actor-owned Mysterious Treasure discard and K1 search on canonical arms
        required: false
        type: boolean
        default: false
      agent9_fog_prompt_only:
        description: Real canonical four-arm actor-owned Fog Crystal Item to K1 prompt gate
        required: false
        type: boolean
        default: false
      agent9_fog_prompt_only:
        description: Real canonical four-arm actor-owned Fog Crystal Item to K1 prompt gate
        required: false
        type: boolean
        default: false
      agent9_actor_setup_only:
        description: Run three frozen development roots through actor-owned setup adapter
        required: false
        type: boolean
        default: false
      k1_probe_only:
        description: Run three-source-deal actor-owned search regression
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-rank24:
    if: ${{ !inputs.agent9_fog_prompt_only && !inputs.agent9_paid_search_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Check own-hand source policy and cohort integrity
        run: |
          node --check simulation/twinleaf/rank24-thorns-three-arm-prospective.cjs
          node --check simulation/twinleaf/rank24-k1-search-regression.cjs
          node --check simulation/twinleaf/agent41-paper-supporter-discipline.cjs
          node --check simulation/twinleaf/agent41-rank24-paper-supporter-canonical-native.cjs
          node --check simulation/twinleaf/agent41-rank24-paper-supporter-opposite-seat-native.cjs
          node --check simulation/twinleaf/owner-deck-search-witness.cjs
          node --test tests/aichi-thorns-crossrank-opening.test.cjs tests/rank6-broad-thorns-policy.test.cjs tests/owner-deck-search-witness.test.cjs tests/owner-k1-deck-membership.test.cjs tests/owner-k0-observable-inventory.test.cjs tests/native-supporter-turn-audit.test.cjs tests/paper-supporter-quota-guard.test.cjs tests/supporter-proposal-paper-quota.test.cjs tests/agent41-paper-supporter-discipline.test.cjs
      - name: Install pinned engine packages
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all twenty-four prespecified source-dealt three-arm seeds
        if: ${{ !inputs.k1_probe_only }}
        run: node simulation/twinleaf/rank24-thorns-three-arm-prospective.cjs > rank24-three-arm-source.json
      - name: Print diagnostic status and preserved non-exposures
        if: ${{ !inputs.k1_probe_only }}
        run: node -e "const r=require('./rank24-three-arm-source.json'); console.log(JSON.stringify({schema:r.schema,seeds:r.precommittedSeeds.length,summary:r.summary,qualified:r.competitiveQualifiedGames,head:r.researchRevision},null,2));"
      - name: Archive every fixed seed and arm, including failures
        if: ${{ always() && !inputs.k1_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: rank24-three-arm-prospective-source
          path: rank24-three-arm-source.json
          if-no-files-found: warn
          retention-days: 14
      - name: Execute rank24 original source owner-deck K0-to-K1 regression
        if: ${{ inputs.k1_probe_only }}
        run: |
          node simulation/twinleaf/rank24-k1-search-regression.cjs > rank24-k1-search-regression.json
          node simulation/twinleaf/rank24-paper-supporter-proposal-native.cjs > rank24-paper-supporter-proposal-native.json
          node simulation/twinleaf/agent41-rank24-paper-supporter-canonical-native.cjs > agent41-rank24-paper-supporter-canonical-native.json
          node simulation/twinleaf/agent41-rank24-paper-supporter-opposite-seat-native.cjs > agent41-rank24-paper-supporter-opposite-seat-native.json
          node -e "const x=require('./agent41-rank24-paper-supporter-opposite-seat-native.json');for(const r of x.rows)console.log('RANK24_REAL_SOURCE_SEAT_A',JSON.stringify({seed:r.seed,first:r.actualSourceFirst,actions:r.actions,sourceSupporterPlays:r.actualSourceSupporterEvents?.length,ownerSuppressions:r.sourceSuppressionCountWithinCappedExamples,quotaQualified:r.nativeSupporterQuotaQualified,error:r.error?.slice(0,180)||null}));console.log('COMPETITIVE_QUALIFIED',x.competitiveQualifiedGames)"
          node -e "const x=require('./agent41-rank24-paper-supporter-canonical-native.json');console.log('AGENT41_RANK24_CANONICAL_SUPPORTER_NEGATIVE',JSON.stringify({first:x.guarded.firstSourceSupporter?.name,turn:x.guarded.firstSourceSupporter?.turn,sourceDeal:x.guarded.sourcePhysicalDeal?.digestSha256,actions:x.guarded.totalActions,suppressed:x.guarded.suppressionCount,quotaQualified:x.guarded.nativeSupporterQuotaQualified,invalidRoots:x.guarded.rejectedDirectRoots.length,competitive:x.competitiveQualifiedGames}))"
      - name: Archive three native K1 search cases with unchanged policy control
        if: ${{ always() && inputs.k1_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: rank24-k1-owner-search-regression
          path: |
            rank24-k1-search-regression.json
            rank24-paper-supporter-proposal-native.json
            agent41-rank24-paper-supporter-canonical-native.json
            agent41-rank24-paper-supporter-opposite-seat-native.json
          if-no-files-found: warn
          retention-days: 14

  agent9-fog-prompt-canonical:
    if: ${{ inputs.agent9_fog_prompt_only && !inputs.agent9_paid_search_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Test actor-visible Fog prompt and typed action acceptance
        run: node --test tests/agent9-fog-actor-prompt.test.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay authentic owner prompt in canonical four registered arms
        run: node simulation/twinleaf/agent9-fog-actor-canonical-development.cjs > agent9-fog-canonical.json
      - name: Log every authentic Fog root, prompt and fallback
        if: always()
        run: node -e "const fs=require('node:fs');if(fs.existsSync('agent9-fog-canonical.json')){const a=require('./agent9-fog-canonical.json');console.log(JSON.stringify({itemProposals:a.fogAudit.fogItemRootProposals,itemNative:a.fogAudit.fogItemRootNativeAccepted,promptProposals:a.fogAudit.fogPromptProposals,promptNative:a.fogAudit.fogPromptNativeAccepted,physicalFollowthrough:a.fogAudit.postSearchPhysicalCardPlays,followthroughEvents:a.fogAudit.postSearchPhysicalEvents,rejects:a.fogAudit.rejectedNativeChoices,rows:a.rows.map(x=>({id:x.trialId,error:x.error||null}))}));}"
      - name: Archive four-arm native Fog channel and all censored outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent9-fog-actor-canonical-dev
          path: agent9-fog-canonical.json
          if-no-files-found: warn
          retention-days: 14

  agent9-paid-search-canonical:
    if: ${{ inputs.agent9_paid_search_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Check native owner-hand discard and owner K1 search logic
        run: node --test tests/agent9-mysterious-actor-chain.test.cjs tests/agent9-fog-actor-prompt.test.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay source-locked canonical actor-only paid Item search
        run: node simulation/twinleaf/agent9-treasure-fog-canonical-development.cjs > agent9-paid-search-native.json
      - name: Print all native paid Item, discard, search acceptances
        if: always()
        run: node -e "const fs=require('node:fs');if(fs.existsSync('agent9-paid-search-native.json')){const r=require('./agent9-paid-search-native.json');console.log(JSON.stringify({treasure:r.treasure,fog:r.fog,root:r.root,rows:r.rows.map(x=>({id:x.id,status:x.status,error:x.error}))}));}"
      - name: Archive all four original arms and discarded-card evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent9-paid-actor-native-development
          path: agent9-paid-search-native.json
          if-no-files-found: warn
          retention-days: 14
