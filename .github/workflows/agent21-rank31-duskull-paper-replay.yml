name: Agent21 Duskull PRE native paper correction and rank31 retrospective replay
on:
  workflow_dispatch:
    inputs:
      root_cap:
        description: 'Maximum genuine Store roots per arm (260 to 640; retrospective only)'
        type: choice
        options: ['260', '400', '640']
        default: '260'

permissions:
  contents: read

jobs:
  native-duskull-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Twinleaf without changing vendor revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Real Store Duskull full Bench, source discard and both-seat regression
        run: node --test tests/2026-11/agent21-duskull-come-and-get-you-native.test.cjs
      - name: Replay posthoc exact original rank31 source deal with and without correction
        env:
          AGENT21_RANK31_ROOT_CAP: ${{ inputs.root_cap }}
        run: node simulation/evaluation/2026-11/agent21-rank31-duskull-native-replay.cjs
      - name: Archive full original and corrected native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-rank31-duskull-paper-override-retrospective
          path: agent21-rank31-duskull-native-replay.json
          retention-days: 21
          if-no-files-found: warn

      - name: Retrospective original rank5 first-ineffective-pass Lillie policy fork
        run: node simulation/evaluation/2026-11/agent21-rank5-lillie-pass-counterfactual.cjs
      - name: Archive first native rank5 candidate-response fork and full physical receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-first-native-rank5-lillie-pass-fork
          path: artifacts/agent21-rank5-lillie-pass-counterfactual.json
          retention-days: 21
          if-no-files-found: warn

      - name: Retrospective original rank5 candidate Fog search basic Psychic energy choice
        run: node simulation/evaluation/2026-11/agent21-rank5-fog-energy-choice-counterfactual.cjs
      - name: Archive exact native rank5 Fog owner-search physical receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-first-native-rank5-fog-psychic-search-fork
          path: artifacts/agent21-rank5-fog-energy-counterfactual.json
          retention-days: 21
          if-no-files-found: warn
