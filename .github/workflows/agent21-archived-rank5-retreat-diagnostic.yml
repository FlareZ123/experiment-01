name: Agent 21 historical rank5 stranded Mew source native diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-seed-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bounded owner-only root and prototype-restoration contract
        run: node --test tests/agent21-owner-stranded-mew-native-pass-retreat.test.cjs
      - name: Restore pinned original vendor Store
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay known historical eight seeds with source Pass-retreat diagnostics
        run: node simulation/evaluation/agent21-stranded-mew-pinned-archive-replay.cjs > agent21-stranded-mew-historical-native-replay.json
      - name: Show bounded genuine source geometry and native custody outcome
        if: always()
        run: |
          node -e "const fs=require('node:fs');if(!fs.existsSync('agent21-stranded-mew-historical-native-replay.json')){console.log('DIAGNOSTIC_NO_OUTPUT');process.exit(0)}const x=JSON.parse(fs.readFileSync('agent21-stranded-mew-historical-native-replay.json','utf8'));const a=x.hookAudit;console.log(JSON.stringify({schema:x.schema,seedsIndependent:x.independentlyProspective,rows:x.trialCount,nativePass:a.nativePassActionsSeen,ownerPass:a.ownerMatchedPassActions,offers:a.eligibleOwnerOffers,dispatches:a.dispatchedRetreatActions,settlements:a.nativeSettledPromotions,nearMisses:a.geometryNearMisses,samples:a.geometryNearMissSamples,sourceTrials:x.summary},null,2));"
      - name: Preserve every original Store native replay row and owner-only root receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-historical-rank5-stranded-mew-diagnostic
          path: agent21-stranded-mew-historical-native-replay.json
          if-no-files-found: warn
          retention-days: 30
