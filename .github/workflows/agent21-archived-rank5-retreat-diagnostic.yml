name: Agent 21 historical rank5 stranded Mew source native diagnostic
on:
  workflow_dispatch:
    inputs:
      policy_variant:
        description: 'Known-seed replay policy, old v1 or root-anchored exact-fee v2'
        type: choice
        required: true
        default: historical-v1
        options:
          - historical-v1
          - root-anchored-v2
          - first-owner-quarantine
          - first-owner-with-setup-confirm
          - first-owner-with-setup-basics
          - first-owner-with-setup-phase-wait
          - first-owner-with-showcards
          - first-owner-with-attack-visual-wait
          - first-owner-with-prize-choice
          - first-owner-with-prizes-and-shuffle

permissions:
  contents: read

jobs:
  archived-seed-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bounded owner-only root and prototype-restoration contract
        run: node --test tests/agent21-owner-stranded-mew-native-pass-retreat.test.cjs tests/agent21-retreat-receipt-provenance-counterexample.test.cjs tests/agent21-root-anchored-fusion-retreat-v2.test.cjs tests/agent21-root-alias-action-join.test.cjs tests/agent21-first-owner-native-quarantine-panel.test.cjs tests/agent21-owner-setup-go-first-confirm.test.cjs tests/agent21-owner-setup-starting-basics.test.cjs tests/agent21-owner-nonvisual-phase-wait.test.cjs tests/agent21-owner-showcards-acknowledgment.test.cjs tests/agent21-owner-first-prize-reveal.test.cjs tests/agent4-raw-state-native-fallback-quarantine.test.cjs
      - name: Restore pinned original vendor Store
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay one selected retrospective policy against the same historical eight seeds
        run: |
          if [ "${{ inputs.policy_variant }}" = 'first-owner-with-prizes-and-shuffle' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs --owner-setup-confirm --owner-setup-basics --owner-phase-wait --owner-showcards-ack --owner-attack-visual-wait --owner-prize-choice --owner-deck-shuffle-wait > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'first-owner-with-prize-choice' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs --owner-setup-confirm --owner-setup-basics --owner-phase-wait --owner-showcards-ack --owner-attack-visual-wait --owner-prize-choice > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'first-owner-with-attack-visual-wait' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs --owner-setup-confirm --owner-setup-basics --owner-phase-wait --owner-showcards-ack --owner-attack-visual-wait > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'first-owner-with-showcards' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs --owner-setup-confirm --owner-setup-basics --owner-phase-wait --owner-showcards-ack > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'first-owner-with-setup-phase-wait' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs --owner-setup-confirm --owner-setup-basics --owner-phase-wait > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'first-owner-with-setup-basics' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs --owner-setup-confirm --owner-setup-basics > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'first-owner-with-setup-confirm' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs --owner-setup-confirm > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'first-owner-quarantine' ]; then
            node simulation/evaluation/agent21-first-owner-native-quarantine-panel.cjs > agent21-first-owner-native-quarantine.json
          elif [ "${{ inputs.policy_variant }}" = 'root-anchored-v2' ]; then
            node simulation/evaluation/agent21-root-anchored-mew-historical-diagnostic.cjs > agent21-stranded-mew-historical-native-replay.json
          else
            node simulation/evaluation/agent21-stranded-mew-pinned-archive-replay.cjs > agent21-stranded-mew-historical-native-replay.json
          fi
      - name: Show bounded genuine source geometry and native custody outcome
        if: ${{ inputs.policy_variant == 'historical-v1' }}
        run: |
          node -e "const fs=require('node:fs');if(!fs.existsSync('agent21-stranded-mew-historical-native-replay.json')){console.log('DIAGNOSTIC_NO_OUTPUT');process.exit(0)}const x=JSON.parse(fs.readFileSync('agent21-stranded-mew-historical-native-replay.json','utf8'));const a=x.hookAudit;console.log(JSON.stringify({schema:x.schema,seedsIndependent:x.independentlyProspective,rows:x.trialCount,nativePass:a.nativePassActionsSeen,ownerPass:a.ownerMatchedPassActions,offers:a.eligibleOwnerOffers,dispatches:a.dispatchedRetreatActions,settlements:a.nativeSettledPromotions,nearMisses:a.geometryNearMisses,samples:a.geometryNearMissSamples,sourceTrials:x.summary},null,2));"
      - name: Show v2 root and physical fee disposition if selected
        if: ${{ inputs.policy_variant == 'root-anchored-v2' }}
        run: |
          node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('agent21-stranded-mew-historical-native-replay.json','utf8')); const a=x.hookAudit;console.log(JSON.stringify({schema:x.schema,trialCount:x.trialCount,anchoredStores:a?.anchoredStores??null,auxiliaryPassesUnchanged:a?.auxiliaryPassesUnchanged??null,anchoredPassesSeen:a?.anchoredPassesSeen??null,eligibleOffers:a?.eligibleOffers??null,exactPhysicalFeeAndPromotion:a?.exactPhysicalFeeAndPromotion??null,unverifiedPhysicalFees:a?.unverifiedPhysicalFees??null,nativeRejectedReplacements:a?.nativeRejectedReplacements??null,pendingAtEnd:a?.pendingAtEnd??null,rootJoinVerified:a?.verifiedSelectedRootLedgerJoin??false,strictRootJoins:x.botPassToStoreRetreatJoin?.exactBotPassToStoreRetreatJoins,strictRootUnverified:x.botPassToStoreRetreatJoin?.unsettledOrUnverified,strictJoinDetails:x.botPassToStoreRetreatJoin?.joins,codeDrift:x.codeProvenance?.changedCodeCells, batchError:x.batchError,competitivelyQualifiedGames:x.competitivelyQualifiedGames},null,2));"
      - name: Show first real native owner-decoder quarantine boundary
        if: ${{ inputs.policy_variant == 'first-owner-quarantine' || inputs.policy_variant == 'first-owner-with-setup-confirm' || inputs.policy_variant == 'first-owner-with-setup-basics' || inputs.policy_variant == 'first-owner-with-setup-phase-wait' || inputs.policy_variant == 'first-owner-with-showcards' || inputs.policy_variant == 'first-owner-with-attack-visual-wait' || inputs.policy_variant == 'first-owner-with-prize-choice' || inputs.policy_variant == 'first-owner-with-prizes-and-shuffle' }}
        run: |
          node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('agent21-first-owner-native-quarantine.json','utf8'));console.log(JSON.stringify({schema:x.schema,attempts:x.attempts.map(a=>({trialId:a.trialId,sourceSeat:a.sourceSeat,status:a.status,calls:a.rawStateFallbackCalls,ownerGoFirstHandled:a.ownerGoFirstHandled,ownerStartingBasicSelections:a.ownerStartingBasicSelections,ownerWaits:a.ownerNonvisualWaitsHandled,ownerShowCards:a.ownerShowCardsAcknowledged,attackVisualWaits:a.ownerAttackVisualWaits,ownerPrizeChoices:a.ownerPrizeChoices,deckShuffleWaits:a.ownerDeckShuffleWaits,first:a.firstBlockedDecision})),competitiveGames:x.competitivelyQualifiedGames},null,2))"
      - name: Preserve every original Store native replay row and owner-only root receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-historical-rank5-stranded-mew-diagnostic
          path: |
            agent21-stranded-mew-historical-native-replay.json
            agent21-first-owner-native-quarantine.json
          if-no-files-found: warn
          retention-days: 30
