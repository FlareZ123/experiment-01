name: Aichi New Moon public image source probe

on:
  workflow_dispatch:
    inputs:
      row:
        description: 'Card-grid row for visual verification, 0 through 3'
        required: true
        default: '2'
        type: choice
        options: ['0', '1', '2', '3']
      probe_deck_code:
        description: 'Fetch original official Japanese deck-code HTML instead of image inspection'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  public-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve linked public tournament deck image
        if: ${{ !inputs.probe_deck_code }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            --user-agent 'Mozilla/5.0 (compatible; ExpandedResearch/1.0)' \
            'https://cdn-ak.f.st-hatena.com/images/fotolife/o/ottopoke/20260511/20260511230136.png' \
            --output "$RUNNER_TEMP/newmoon-deck-source.png"
          file "$RUNNER_TEMP/newmoon-deck-source.png"
      - name: Visually inspect three source-grid segments in selected row
        if: ${{ !inputs.probe_deck_code }}
        shell: bash
        env:
          ROW_NUMBER: ${{ inputs.row }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import base64
          import io
          import os
          from PIL import Image

          image = Image.open(os.path.join(os.environ["RUNNER_TEMP"], "newmoon-deck-source.png")).convert("RGB")
          assert image.size == (1024, 512), image.size
          row = int(os.environ["ROW_NUMBER"])
          assert row in (0, 1, 2, 3)
          for group in range(3):
              x0 = 50 + 309 * group
              cropped = image.crop((x0, 128 * row, x0 + 309, 128 * (row + 1)))
              enlarged = cropped.resize((1236, 512), Image.Resampling.NEAREST)
              buffer = io.BytesIO()
              enlarged.save(buffer, format="JPEG", quality=91)
              encoded = base64.b64encode(buffer.getvalue()).decode("ascii")
              for i in range(0, len(encoded), 4000):
                  print(f"NMROW{row}GROUP{group}CHUNK{i//4000:04d}:" + encoded[i:i+4000])
              print(f"NMROW{row}GROUP{group}TOTAL:{len(buffer.getvalue())}")
          PY
      - uses: actions/checkout@v4
        if: ${{ inputs.probe_deck_code }}
      - name: Retrieve official Japanese source deck code
        if: ${{ inputs.probe_deck_code }}
        shell: bash
        run: |
          curl --silent --show-error --location --max-time 45 --retry 1 \
            --user-agent 'Mozilla/5.0 (compatible; ExpandedResearch/1.0)' \
            --dump-header newmoon-official-headers.txt \
            --output newmoon-official-deck.html \
            --write-out 'Official viewer HTTP status %{http_code}; downloaded %{size_download} bytes\n' \
            'https://www.pokemon-card.com/deck/confirm.html/deckID/GxxDYx-a4rD4W-a8xYxc'
          python3 -c "from pathlib import Path; h=Path('newmoon-official-deck.html').read_text(encoding='utf-8',errors='replace'); print('Viewer bytes:', len(h), 'source_code_present:', 'GxxDYx-a4rD4W-a8xYxc' in h, 'Mewtwo Japanese name present:', 'ミュウツー' in h); print('Head:',repr(h[:600]))"
      - name: Verify archived Japanese 60
        if: ${{ inputs.probe_deck_code }}
        run: python3 scripts/newmoon_official_print_replay.py newmoon-official-deck.html
      - name: Preserve official deck viewer evidence
        if: ${{ inputs.probe_deck_code }}
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-official-deck-viewer
          path: |
            newmoon-official-headers.txt
            newmoon-official-deck.html
          if-no-files-found: error
