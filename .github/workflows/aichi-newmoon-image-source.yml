name: Aichi New Moon public image source probe

on:
  workflow_dispatch:
    inputs:
      row:
        description: 'Card-grid row for visual verification, 0 through 3'
        required: true
        default: '2'
        type: choice
        options: ['0', '1', '2', '3']
      probe_deck_code:
        description: 'Fetch original official Japanese deck-code HTML instead of image inspection'
        required: false
        default: false
        type: boolean
      public_deck_code:
        description: 'Optional other public 6-6-6 Japanese deck code; archived separately, unverified event printings'
        required: false
        default: ''
        type: string
      probe_primarina_may:
        description: 'Inspect publicly accessible 2026 Aichi 48th Primarina first-person note image URLs'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  public-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve linked public tournament deck image
        if: ${{ !inputs.probe_deck_code && !inputs.probe_primarina_may }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            --user-agent 'Mozilla/5.0 (compatible; ExpandedResearch/1.0)' \
            'https://cdn-ak.f.st-hatena.com/images/fotolife/o/ottopoke/20260511/20260511230136.png' \
            --output "$RUNNER_TEMP/newmoon-deck-source.png"
          file "$RUNNER_TEMP/newmoon-deck-source.png"
      - name: Visually inspect three source-grid segments in selected row
        if: ${{ !inputs.probe_deck_code && !inputs.probe_primarina_may }}
        shell: bash
        env:
          ROW_NUMBER: ${{ inputs.row }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import base64
          import io
          import os
          from PIL import Image

          image = Image.open(os.path.join(os.environ["RUNNER_TEMP"], "newmoon-deck-source.png")).convert("RGB")
          assert image.size == (1024, 512), image.size
          row = int(os.environ["ROW_NUMBER"])
          assert row in (0, 1, 2, 3)
          for group in range(3):
              x0 = 50 + 309 * group
              cropped = image.crop((x0, 128 * row, x0 + 309, 128 * (row + 1)))
              enlarged = cropped.resize((1236, 512), Image.Resampling.NEAREST)
              buffer = io.BytesIO()
              enlarged.save(buffer, format="JPEG", quality=91)
              encoded = base64.b64encode(buffer.getvalue()).decode("ascii")
              for i in range(0, len(encoded), 4000):
                  print(f"NMROW{row}GROUP{group}CHUNK{i//4000:04d}:" + encoded[i:i+4000])
              print(f"NMROW{row}GROUP{group}TOTAL:{len(buffer.getvalue())}")
          PY
      - name: Retrieve public May Aichi48 author note for image provenance
        if: ${{ inputs.probe_primarina_may }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 40 --retry 1 \
            --user-agent 'Mozilla/5.0 (compatible; ExpandedResearch/1.0)' \
            --dump-header primarina-may-public-note-headers.txt \
            --output primarina-may-public-note.html \
            'https://note.com/primarina_2002/n/n70b7e01cd474'
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path
          raw=Path('primarina-may-public-note.html').read_text(encoding='utf-8',errors='replace')
          normalized=html.unescape(raw.replace('\\\\/','/').replace('\\\\u0026','&'))
          images=sorted(set(re.findall(r'https://assets\\.st-note\\.com/img/[A-Za-z0-9._?=&%/-]+', normalized)))
          digest=__import__('hashlib').sha256(raw.encode()).hexdigest()
          Path('primarina-may-public-image-leads.json').write_text(json.dumps({'firstPersonNote':'https://note.com/primarina_2002/n/n70b7e01cd474','sha256':digest,'viewerCodeReferenced':'4xYGc4-dWhjRd-G8c8GD' in raw,'imageUrls':images,'unverifiedCardImages':True},indent=2)+'\\n')
          print('PUBLIC_AUTHOR_NOTE',json.dumps({'bytes':len(raw),'sha256':digest,'mayCodePresent':'4xYGc4-dWhjRd-G8c8GD' in raw,'imageCount':len(images),'imageUrls':images[:40]}))
          PY
      - name: Preserve original public author note source imagery leads
        if: ${{ inputs.probe_primarina_may }}
        uses: actions/upload-artifact@v4
        with:
          name: aichi48-primarina-public-note-image-leads
          path: |
            primarina-may-public-note.html
            primarina-may-public-note-headers.txt
            primarina-may-public-image-leads.json
          if-no-files-found: warn
          retention-days: 10
      - uses: actions/checkout@v4
        if: ${{ inputs.probe_deck_code }}
      - name: Test public Japanese deck snapshot parser
        if: ${{ inputs.probe_deck_code && inputs.public_deck_code != '' }}
        run: |
          python3 -m pip install --quiet filelock
          python3 -m unittest discover -s tests -p 'test_official_jp_public_deck_snapshot.py' -v
      - name: Retrieve official Japanese source deck code
        if: ${{ inputs.probe_deck_code }}
        shell: bash
        env:
          PUBLIC_DECK_CODE: ${{ inputs.public_deck_code }}
        run: |
          code="${PUBLIC_DECK_CODE:-GxxDYx-a4rD4W-a8xYxc}"
          if [[ ! "$code" =~ ^[A-Za-z0-9]{6}-[A-Za-z0-9]{6}-[A-Za-z0-9]{6}$ ]]; then
            echo 'Invalid public deck code format' >&2
            exit 2
          fi
          printf '%s\\n' "$code" > newmoon-official-code.txt
          curl --fail --silent --show-error --location --max-time 45 --retry 1 \
            --user-agent 'Mozilla/5.0 (compatible; ExpandedResearch/1.0)' \
            --dump-header newmoon-official-headers.txt \
            --output newmoon-official-deck.html \
            --write-out 'Official viewer HTTP status %{http_code}; downloaded %{size_download} bytes\\n' \
            "https://www.pokemon-card.com/deck/confirm.html/deckID/$code"
          python3 -c "from pathlib import Path; h=Path('newmoon-official-deck.html').read_text(encoding='utf-8',errors='replace'); print('Viewer bytes:', len(h), 'source_code_present:', Path('newmoon-official-code.txt').read_text().strip() in h)"
      - name: Verify archived Japanese 60
        if: ${{ inputs.probe_deck_code && inputs.public_deck_code == '' }}
        run: python3 scripts/newmoon_official_print_replay.py newmoon-official-deck.html
      - name: Extract alternate public code as non-promoted snapshot
        if: ${{ inputs.probe_deck_code && inputs.public_deck_code != '' }}
        env:
          PUBLIC_DECK_CODE: ${{ inputs.public_deck_code }}
        run: |
          python3 -m pip install --quiet filelock
          python3 scripts/official_jp_public_deck_snapshot.py newmoon-official-deck.html "$PUBLIC_DECK_CODE" public-jp-deck-snapshot.json
      - name: Preserve official deck viewer evidence
        if: ${{ inputs.probe_deck_code }}
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-official-deck-viewer
          path: |
            newmoon-official-headers.txt
            newmoon-official-deck.html
            newmoon-official-code.txt
            public-jp-deck-snapshot.json
          if-no-files-found: error
