name: Aichi Telepath origin pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Validate pure root-only source observer and source census
        run: node --test tests/attachment-origin-observer.test.cjs tests/aichi-telepath-source-inventory.test.cjs
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: One root-Store source-origin probe per rank and physical seat
        run: node simulation/twinleaf/aichi-telepath-natural-origin-pilot.cjs > aichi-telepath-natural-origin-pilot.json
      - name: Preserve unqualified source-print diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: aichi-telepath-natural-origin-pilot
          path: aichi-telepath-natural-origin-pilot.json
          if-no-files-found: error
