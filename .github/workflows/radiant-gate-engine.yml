name: Radiant Gate upstream reducer characterization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-effect-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf submodule only
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact upstream server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned upstream without vendor modifications
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Characterize Gate and Star Alchemy prompts and turn endings
        run: node --test tests/radiant-vstar-upstream-characterization.test.cjs

      - name: Check opt-in Forest Seal Stone one-card search correction
        run: node --test tests/forest-seal-search-hook.test.cjs

      - name: Resolve actual Store Star Alchemy search and reject empty answers
        run: node --test tests/forest-seal-real-store.test.cjs

      - name: Probe Temple Wobbuffet Active suppression of Radiant Gate
        run: node simulation/twinleaf/radiant-wobbuffet-active-probe.cjs
