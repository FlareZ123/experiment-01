name: Agent1 original rank17 Ditto Prism Stage1 prospective native

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Select the original-source paired native experiment'
        required: true
        type: choice
        default: ditto
        options:
          - ditto
          - compressor
          - compressor-census
          - compressor-bridge
          - bridge-archive
          - postprompt-custody
          - generic-special-energy
          - generic-energy-effects
          - electrode-opportunity
          - electrode-composed
          - electrode-mechanism

permissions:
  contents: read

concurrency:
  group: agent1-rank17-ditto-original-prospective
  cancel-in-progress: false

jobs:
  source-native:
    if: ${{ github.event.inputs.experiment != 'bridge-archive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Confirm source manifest and preregistered original source identities
        if: ${{ github.event.inputs.experiment == 'ditto' }}
        run: node -e "const a=require('node:assert/strict');const p=require('./simulation/evaluation/agent1-rank17-ditto-prism-prospective.cjs').preflight();a.equal(p.registered.expectedNativeArms,32);a.equal(p.sourceOriginal.cards.length,60);console.log('RANK17_SOURCE_FROZEN',p.registered.sourcePrinted60Sha256)"
      - name: Run all registered two-seat source-original control and Ditto root arms
        if: ${{ github.event.inputs.experiment == 'ditto' }}
        run: node simulation/evaluation/agent1-rank17-ditto-prism-prospective.cjs > agent1-rank17-ditto-original-pairs.json
      - name: Verify registered identity, paired physical openings and labelled coverage
        if: ${{ github.event.inputs.experiment == 'ditto' }}
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-rank17-ditto-original-pairs.json');a.equal(r.attemptedNativeArms,32);a.equal(r.pairs.length,16);a.ok(r.completePairs>0,'No native pair completed; inspect archived failures');a.equal(r.identicalPhysicalOpeningPairs,r.completePairs);a.equal(r.competitiveQualifiedGames,0);console.log('RANK17_DITTO_NATIVE',JSON.stringify({attempted:r.attemptedNativeArms,completePairs:r.completePairs,nativeErrorArms:r.nativeErrorArms,sameOpening:r.identicalPhysicalOpeningPairs,selected:r.treatmentDittoSelected,accepted:r.treatmentDittoNativeAccepted,confirmed:r.treatmentDittoPhysicallyConfirmed,rows:r.pairs.map(p=>({seed:p.seed,seat:p.sourceSeat,matched:p.samePhysicalOpening,ditto:p.difference?.treatmentAcceptedDittoStage1??null,sourceEvolutionDelta:p.difference?.sourceNativeEvolutions??null,error:p.control.nativeError?.slice(0,100)??p.treatment.nativeError?.slice(0,100)??null}))}))"
      - name: Archive every preregistered original 60 outcome and exception
        if: ${{ always() && github.event.inputs.experiment == 'ditto' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-original-ditto-prospective
          path: agent1-rank17-ditto-original-pairs.json
          if-no-files-found: warn

      - name: Validate frozen rank17 Compressor original-sixty source and native plan
        if: ${{ github.event.inputs.experiment == 'compressor' }}
        run: node -e "const x=require('./simulation/evaluation/agent1-rank17-compressor-printing-transport.cjs').preflight();console.log('COMPRESSOR_FROZEN',JSON.stringify({seeds:x.reg.seedGroups,sourceSeats:x.reg.sourceSeats,sourceCards:x.source.cards.length}))"
      - name: Pure registered matching, original source classification and failure-veto tests
        if: ${{ github.event.inputs.experiment == 'compressor' }}
        run: node --test tests/agent1-rank17-compressor-printing-transport.test.cjs tests/agent1-rank17-raichu-printed-openers.test.cjs
      - name: Original rank17 printed Compressor real native matched pairs
        if: ${{ github.event.inputs.experiment == 'compressor' }}
        run: node simulation/evaluation/agent1-rank17-compressor-printing-transport.cjs
      - name: Retain complete native Compressor root ledgers and every registered error
        if: ${{ always() && github.event.inputs.experiment == 'compressor' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-printed-compressor-transport
          path: agent1-rank17-compressor-printing-transport.json
          if-no-files-found: warn

      - name: Verify repeated source-original Compressor census registration
        if: ${{ github.event.inputs.experiment == 'compressor-census' }}
        run: node -e "const p=require('./simulation/evaluation/agent1-rank17-compressor-opening-census.cjs').preflight();console.log('CENSUS',JSON.stringify({seeds:p.audit.seeds,seats:p.audit.seats}))"
      - name: Run read-only owner-visible source opener pure regressions
        if: ${{ github.event.inputs.experiment == 'compressor-census' }}
        run: node --test tests/agent1-rank17-compressor-opportunity-census.test.cjs tests/agent1-rank17-compressor-printing-transport.test.cjs

      - name: Reobserve identical rank17 native original source opportunities
        if: ${{ github.event.inputs.experiment == 'compressor-census' }}
        run: node simulation/evaluation/agent1-rank17-compressor-opening-census.cjs
      - name: Preserve complete original source early-turn native root census
        if: ${{ always() && github.event.inputs.experiment == 'compressor-census' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-early-compressor-owner-census
          path: agent1-rank17-compressor-opening-census.json
          if-no-files-found: warn

      - name: Verify prospective and known-positive original rank17 physical source registration
        if: ${{ github.event.inputs.experiment == 'compressor-bridge' }}
        run: node -e "const x=require('./simulation/evaluation/agent1-rank17-actor-compressor-bridge-prospective.cjs').preflight();console.log('BRIDGE_FROZEN',JSON.stringify({seeds:x.reg.prospectiveSeedGroups,retrospective:x.reg.retrospectivePositiveControl.length}))"
      - name: Regress actor-only early native Battle Compressor bridge and native comparator
        if: ${{ github.event.inputs.experiment == 'compressor-bridge' }}
        run: node --test tests/agent1-raichu-actor-compressor-bridge.test.cjs tests/agent1-rank17-actor-compressor-bridge-prospective.test.cjs

      - name: Run all registered native original rank17 actor-bridge matched physical deals
        if: ${{ github.event.inputs.experiment == 'compressor-bridge' }}
        run: node simulation/evaluation/agent1-rank17-actor-compressor-bridge-prospective.cjs
      - name: Preserve all positive-control and prospective source native roots
        if: ${{ always() && github.event.inputs.experiment == 'compressor-bridge' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-original-actor-compressor-bridge
          path: agent1-rank17-actor-compressor-bridge-prospective.json
          if-no-files-found: warn


      - name: Preflight frozen retrospective post-prompt rank17 owner-source study
        if: ${{ github.event.inputs.experiment == 'postprompt-custody' }}
        run: node -e "const r=require('./simulation/evaluation/agent1-rank17-compressor-postprompt-native.cjs').preflight();console.log('SOURCE_CUSTODY_FROZEN',JSON.stringify(r.registered.sourcePhysicalSeeds))"
      - name: Test original source-prompt card identity and matched native pair accounting
        if: ${{ github.event.inputs.experiment == 'postprompt-custody' }}
        run: node --test tests/agent1-compressor-prompt-custody.test.cjs tests/agent1-rank17-compressor-postprompt-native.test.cjs
      - name: Replay two disclosed native rank17 Compressor source physical openings with read-only custody
        if: ${{ github.event.inputs.experiment == 'postprompt-custody' }}
        run: node simulation/evaluation/agent1-rank17-compressor-postprompt-native.cjs
      - name: Preserve all four original Store paths and physical-selection audit evidence
        if: ${{ always() && github.event.inputs.experiment == 'postprompt-custody' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-original-compressor-postprompt-native
          path: agent1-rank17-compressor-postprompt-native.json
          if-no-files-found: warn

      - name: Verify prospectively frozen four source seed groups and both real seats
        if: ${{ github.event.inputs.experiment == 'generic-special-energy' }}
        run: node -e "const x=require('./simulation/evaluation/agent1-rank17-generic-special-energy-prospective.cjs').preflight();console.log('GENERIC_ENERGY_FROZEN',JSON.stringify({seeds:x.reg.seeds,seats:x.reg.sourceSeats}))"
      - name: Regress eight actual source physical pair accounting and generic default-off behavior
        if: ${{ github.event.inputs.experiment == 'generic-special-energy' }}
        run: node --test tests/agent1-rank17-generic-special-energy-prospective.test.cjs
      - name: Run prospectively selected original rank17 both-seat symmetric public-context Energy ablation
        if: ${{ github.event.inputs.experiment == 'generic-special-energy' }}
        run: node simulation/evaluation/agent1-rank17-generic-special-energy-prospective.cjs
      - name: Preserve all 16 original Store arms, matched physical starters and native source Energy and attack roots
        if: ${{ always() && github.event.inputs.experiment == 'generic-special-energy' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-symmetric-generic-special-energy-native
          path: agent1-rank17-generic-special-energy-prospective.json
          if-no-files-found: warn

      - name: Preflight disclosed original rank17 positive Electro Rain native physical source
        if: ${{ github.event.inputs.experiment == 'generic-energy-effects' }}
        run: node -e "const r=require('./simulation/evaluation/agent1-rank17-electro-rain-settlement-retrospective.cjs').preflight();console.log('RETRO_RAIN_FROZEN',r.registered.previousSourceElectroRainEvent.seed)"
      - name: Regress documented original positive selection and native error visibility
        if: ${{ github.event.inputs.experiment == 'generic-energy-effects' }}
        run: node --test tests/agent1-rank17-electro-rain-settlement-retrospective.test.cjs
      - name: Reobserve one prior source Electro Rain with original Store public-board effect telemetry
        if: ${{ github.event.inputs.experiment == 'generic-energy-effects' }}
        run: node simulation/evaluation/agent1-rank17-electro-rain-settlement-retrospective.cjs
      - name: Preserve both native physical arms and original Electro Rain public before/after effect trace
        if: ${{ always() && github.event.inputs.experiment == 'generic-energy-effects' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-original-electro-rain-public-effect
          path: agent1-rank17-electro-rain-settlement-retrospective.json
          if-no-files-found: warn

      - name: Freeze exact rank17 Electrode owner-root native A/B/A before dispatch
        if: ${{ github.event.inputs.experiment == 'electrode-opportunity' }}
        run: node --test tests/agent1-rank17-electrode-native-registration.test.cjs tests/agent1-rank17-electrode-owner-necessity.test.cjs tests/agent1-rank17-electrode-census.test.cjs tests/agent1-rank17-electrode-actor-integration.test.cjs
      - name: Execute all twelve preregistered identical-control native owner-turn census arms
        if: ${{ github.event.inputs.experiment == 'electrode-opportunity' }}
        run: node simulation/evaluation/agent1-rank17-electrode-owner-native-aba.cjs
      - name: Archive every original rank17 owner census native attempt and error
        if: ${{ always() && github.event.inputs.experiment == 'electrode-opportunity' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-electrode-owner-census-aba-native
          path: agent1-rank17-electrode-owner-aba-native.json
          if-no-files-found: warn

      - name: Verify exact 48-arm prospective rank17 composed ability opportunity cohort
        if: ${{ github.event.inputs.experiment == 'electrode-composed' }}
        run: node --test tests/agent1-rank17-electrode-composed-registration.test.cjs tests/agent1-rank17-electrode-owner-necessity.test.cjs tests/agent1-rank17-electrode-census.test.cjs tests/agent1-rank17-electrode-actor-integration.test.cjs
      - name: Run all 48 original-source composed owner controls and read-only A/B/A observations
        if: ${{ github.event.inputs.experiment == 'electrode-composed' }}
        run: node simulation/evaluation/agent1-rank17-electrode-composed-owner-aba.cjs
      - name: Preserve all original rank17 composed native owner attempts and failure details
        if: ${{ always() && github.event.inputs.experiment == 'electrode-composed' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-electrode-composed-owner-aba
          path: agent1-rank17-electrode-composed-owner-aba.json
          if-no-files-found: warn

      - name: Verify disclosed source-positive rank17 one-deal Bomb ability native probe registration
        if: ${{ github.event.inputs.experiment == 'electrode-mechanism' }}
        run: node --test tests/agent1-rank17-bomb-native-positive-retrospective.test.cjs tests/agent1-rank17-electrode-owner-necessity.test.cjs
      - name: Run original-source native Bomb after-Pass ability and physical self-KO counterfactual
        if: ${{ github.event.inputs.experiment == 'electrode-mechanism' }}
        run: node simulation/evaluation/agent1-rank17-bomb-native-positive-retrospective.cjs
      - name: Archive original-source Bomb native mechanism control and experimental action
        if: ${{ always() && github.event.inputs.experiment == 'electrode-mechanism' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank17-bomb-native-mechanism-positive-retrospective
          path: agent1-rank17-bomb-native-positive-retrospective.json
          if-no-files-found: warn

  source-archived-bridge-audit:
    if: ${{ github.event.inputs.experiment == 'bridge-archive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress native-only source receipt accounting and rejection cases
        run: node --test tests/agent1-archived-compressor-receipt-gate.test.cjs tests/agent1-compressor-prompt-custody.test.cjs tests/aichi-open-official-clock.test.cjs tests/agent1-rank17-archived-action-census.test.cjs tests/agent1-actor-dead-first-attack-frontier.test.cjs tests/agent1-gholdengo-thirty-hand-zone-witness.test.cjs tests/agent1-prize-failure-budget.test.cjs
      - name: Fetch previously archived 38 original native Store attempts without replaying
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13209864119'
          run-id: '41591371975'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: immutable-archive
      - name: Verify exact historical raw SHA256, all original physical pairs and source prompt roots
        run: node scripts/agent1-audit-archived-compressor-bridge.cjs immutable-archive/agent1-rank17-original-actor-compressor-bridge/agent1-rank17-actor-compressor-bridge-prospective.json
