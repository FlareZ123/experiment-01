name: Agent5 original rank6 post-DCE Thunder Mountain Volt source native

on:
  workflow_dispatch:
    inputs:
      agent9_baton_audit:
        description: Passive owner-only Guzma/DCE baton feasibility readout, same frozen original v10
        required: false
        default: false
        type: boolean
      agent9_palace_book_audit:
        description: Exact original rank6 champion turn4 held Palace Book native A/B/A
        required: false
        default: false
        type: boolean
      agent5_v7_followup_owner_audit:
        description: Passive native source post-Volt owner-hand observation on frozen v7
        required: false
        default: false
        type: boolean
      agent5_v7_teamflare_aba:
        description: Retrospective exact-source owner Team Flare v7 A/B/A
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  original-rank6-thunder-volt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned research repo
        uses: actions/checkout@v4
      - name: Initialize only pinned Twinleaf upstream
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Node environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Compile original pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Verify paper source-only Thunder and Volt physical prompt decision hooks
        run: |
          node --check simulation/twinleaf/agent5-source-paid-dce-thunder-volt.cjs
          node --check simulation/evaluation/agent5-rank6-paid-dce-thunder-volt-v10.cjs
          node --test tests/agent5-source-paid-dce-thunder-volt.test.cjs
      - name: Verify Agent9 passive physical owner observation tests
        if: ${{ inputs.agent9_baton_audit }}
        run: |
          node --check simulation/twinleaf/agent9-v10-dce-baton-observer.cjs
          node --check simulation/evaluation/agent9-v10-owner-baton-native.cjs
          node --test tests/agent9-v10-dce-baton-observer.test.cjs
      - name: Verify Agent9 physical source Palace Book alternative tests
        if: ${{ inputs.agent9_palace_book_audit }}
        run: |
          node --check simulation/twinleaf/agent9-rank6-turn4-palace-book-hook.cjs
          node --check simulation/evaluation/agent9-rank6-palace-book-native-aba.cjs
          node --test tests/agent9-rank6-turn4-palace-book.test.cjs
      - name: Verify passive Agent5 owner follow-up witness and original v7 caller
        if: ${{ inputs.agent5_v7_followup_owner_audit && !inputs.agent5_v7_teamflare_aba }}
        run: |
          node --check simulation/twinleaf/agent5-v7-source-followup-owner-witness.cjs
          node --check simulation/evaluation/agent5-v7-owner-followup-census.cjs
          node --test tests/agent5-v7-source-followup-owner-witness.test.cjs
      - name: Execute frozen v7 with read-only source owner-hand witness
        if: ${{ inputs.agent5_v7_followup_owner_audit && !inputs.agent5_v7_teamflare_aba }}
        env:
          AGENT5_V7_OWNER_FOLLOWUP_DIR: agent5-v7-source-owner-followup
        run: node simulation/evaluation/agent5-v7-owner-followup-census.cjs
      - name: Verify native owner Team Flare physical-payment witness
        if: ${{ inputs.agent5_v7_teamflare_aba }}
        run: |
          node --check simulation/twinleaf/agent5-v7-teamflare-physical-witness.cjs
          node --check simulation/evaluation/agent5-v7-postvolt-teamflare-aba.cjs
          node --test tests/agent5-v7-teamflare-physical-witness.test.cjs
      - name: Execute full original v7 matched A/B/A with exact source Team Flare fork
        if: ${{ inputs.agent5_v7_teamflare_aba }}
        env:
          AGENT5_V7_TEAMFLARE_ABA_DIR: agent5-v7-teamflare-aba
        run: node simulation/evaluation/agent5-v7-postvolt-teamflare-aba.cjs
      - name: Execute exact original eight matched native source branches once
        if: ${{ !inputs.agent9_baton_audit && !inputs.agent9_palace_book_audit && !inputs.agent5_v7_followup_owner_audit && !inputs.agent5_v7_teamflare_aba }}
        env:
          AGENT5_THUNDER_VOLT_V10_DIR: agent5-rank6-thunder-volt-v10
        run: node simulation/evaluation/agent5-rank6-paid-dce-thunder-volt-v10.cjs
      - name: Execute exact original v10 with additional passive owner DCE baton readout
        if: ${{ inputs.agent9_baton_audit && !inputs.agent9_palace_book_audit && !inputs.agent5_v7_followup_owner_audit && !inputs.agent5_v7_teamflare_aba }}
        env:
          AGENT9_BATON_DIR: agent9-v10-baton-native
        run: node simulation/evaluation/agent9-v10-owner-baton-native.cjs
      - name: Execute genuine original rank6 source held Palace Book v10 A/B/A
        if: ${{ inputs.agent9_palace_book_audit && !inputs.agent5_v7_followup_owner_audit && !inputs.agent5_v7_teamflare_aba }}
        env:
          AGENT9_PALACE_BOOK_DIR: agent9-rank6-palace-book-native
        run: node simulation/evaluation/agent9-rank6-palace-book-native-aba.cjs
      - name: Preserve full original and alternate root tapes and physical outcome receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-rank6-original-post-dce-thunder-volt-v10
          path: agent5-rank6-thunder-volt-v10/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve passive owner turn4 and turn6 native opportunity receipts
        if: always() && inputs.agent9_baton_audit
        uses: actions/upload-artifact@v4
        with:
          name: agent9-original-rank6-dce-baton-owner-passive
          path: agent9-v10-baton-native/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve original source Palace Book A/B/A physical receipts
        if: always() && inputs.agent9_palace_book_audit
        uses: actions/upload-artifact@v4
        with:
          name: agent9-rank6-original-palace-book-aba-native
          path: agent9-rank6-palace-book-native/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve read-only source owner-hand v7 post-Volt audit
        if: always() && inputs.agent5_v7_followup_owner_audit
        uses: actions/upload-artifact@v4
        with:
          name: agent5-v7-source-followup-owner-hand
          path: agent5-v7-source-owner-followup/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve original source Team Flare root A/B/A physical receipt
        if: always() && inputs.agent5_v7_teamflare_aba
        uses: actions/upload-artifact@v4
        with:
          name: agent5-v7-source-teamflare-retrospective-aba
          path: agent5-v7-teamflare-aba/
          if-no-files-found: warn
          retention-days: 14
