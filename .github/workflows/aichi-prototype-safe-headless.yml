name: Aichi prototype-safe Simulator headless diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Check source-graph cloning contracts
        run: node --test tests/detached-simulator-hook.test.cjs tests/prototype-safe-simulator-hook.test.cjs
      - name: Check headless wrapper restoration and source-match noninterference
        run: node simulation/twinleaf/headless-prototype-safe-smoke.cjs
