name: Agent7 original rank30 Psychic Bench staging native A-B-A

on:
  workflow_dispatch:
    inputs:
      agent6_rank30_rondo:
        description: 'Optional previously selected native funded Clefairy Pass to Retreat and Rondo fork'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  rank30-psychic-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
      AGENT41_PAPER_SUPPORTER_DEV: 'true'
      AGENT41_MANDATORY_OPTION_DEV: 'true'
      AGENT41_NATIVE_PRESSURE_DEV: 'true'
      AGENT12_NATIVE_TARGET_SIDECAR_DEV: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing workflow dispatch isolation
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python scripts/workflow_dispatch_preflight.py
      - name: Test exact actor-owner Psychic recipient choice and default-off gate
        run: node --test tests/agent7-rondo-psychic-bench-stage.test.cjs
      - name: Test owner-only natural Clefairy root retreat and negative cases
        if: inputs.agent6_rank30_rondo
        run: node --test tests/agent6-rank30-actor-rondo-retreat.test.cjs
      - name: Test canonical owner-public Skyliner Rondo option and default-off behavior
        if: inputs.agent6_rank30_rondo
        run: node --test tests/agent6-owner-public-skyliner-rondo-frontier.test.cjs
      - name: Test Skyliner lock veto
        if: inputs.agent6_rank30_rondo
        run: node --test tests/agent6-skyliner-public-ability-suppression.test.cjs
      - name: Run lock source census
        if: inputs.agent6_rank30_rondo
        run: node --test tests/agent6-public-skyliner-lock-field-census.test.cjs
      - name: Check Float Stone owner-public alternative and Tool Jammer veto
        if: inputs.agent6_rank30_rondo
        run: node --test tests/agent6-skyliner-or-floatstone-mobility.test.cjs
      - name: Verify prospective rank30 source deck candidate and fresh seed registration
        if: inputs.agent6_rank30_rondo
        run: node --test tests/agent6-rank30-skyliner-prospective.test.cjs
      - name: Check out pinned original Twinleaf revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Stage original owner Skyliner against public Ability suppressors in pinned Store
        if: inputs.agent6_rank30_rondo
        run: node simulation/twinleaf/agent6-skyliner-public-suppression-native.cjs > agent6-skyliner-public-suppression-native.json
      - name: Archive both-seat original Store effective Skyliner and retreat checks
        if: always() && inputs.agent6_rank30_rondo
        uses: actions/upload-artifact@v4
        with:
          name: agent6-skyliner-public-suppression-native
          path: agent6-skyliner-public-suppression-native.json
          if-no-files-found: warn
          retention-days: 15
      - name: Retrospective original rank30 owner-seat-only A-B-A native target contrast
        if: '!inputs.agent6_rank30_rondo'
        run: node simulation/evaluation/agent7-rank30-psychic-bench-stage-aba.cjs > agent7-rank30-source-psychic-stage-aba.json
      - name: Retro original rank30 paid Clefairy actual source retreat and Rondo native fork
        if: inputs.agent6_rank30_rondo
        run: node simulation/evaluation/agent6-rank30-funded-clefairy-retreat-native.cjs > agent6-rank30-funded-clefairy-retreat-native.json
      - name: Original rank30 actor-chosen retreat and Rondo native counterfactual
        if: inputs.agent6_rank30_rondo
        run: node simulation/evaluation/agent6-rank30-actor-rondo-native.cjs > agent6-rank30-actor-rondo-native.json
      - name: Archive native rank30 actor-root choice, accepted Store action and reply
        if: always() && inputs.agent6_rank30_rondo
        uses: actions/upload-artifact@v4
        with:
          name: agent6-rank30-actor-rondo-native
          path: agent6-rank30-actor-rondo-native.json
          if-no-files-found: warn
          retention-days: 15
      - name: Exact original rank30 canonical owner-root Skyliner Rondo native contrast
        if: inputs.agent6_rank30_rondo
        run: node simulation/evaluation/agent6-rank30-canonical-skyliner-rondo-native.cjs > agent6-rank30-canonical-skyliner-rondo-native.json
      - name: Archive canonical root accepted retreat and full source attack reply
        if: always() && inputs.agent6_rank30_rondo
        uses: actions/upload-artifact@v4
        with:
          name: agent6-rank30-canonical-skyliner-rondo-native
          path: agent6-rank30-canonical-skyliner-rondo-native.json
          if-no-files-found: warn
          retention-days: 15
      - name: Exact original rank30 Benched Skyliner Filch versus funded Rondo native counterfactual
        if: inputs.agent6_rank30_rondo
        run: node simulation/evaluation/agent6-rank30-filch-vs-rondo-native.cjs > agent6-rank30-filch-vs-rondo-native.json
      - name: Archive actual rank30 source Filch replacement, accepted retreat and Rondo settlement
        if: always() && inputs.agent6_rank30_rondo
        uses: actions/upload-artifact@v4
        with:
          name: agent6-rank30-filch-vs-rondo-native
          path: agent6-rank30-filch-vs-rondo-native.json
          if-no-files-found: warn
          retention-days: 15
      - name: Preregistered four new rank30 source seat seed groups with natural canonical Rondo option
        if: inputs.agent6_rank30_rondo
        run: node simulation/evaluation/agent6-rank30-skyliner-prospective-native.cjs > agent6-rank30-skyliner-prospective-native.json
      - name: Archive all fresh rank30 owner-root attempts, errors and source Rondo responses
        if: always() && inputs.agent6_rank30_rondo
        uses: actions/upload-artifact@v4
        with:
          name: agent6-rank30-skyliner-prospective-native
          path: agent6-rank30-skyliner-prospective-native.json
          if-no-files-found: warn
          retention-days: 15
      - name: Archive all native original rank30 funded Rondo fork outcomes and errors
        if: always() && inputs.agent6_rank30_rondo
        uses: actions/upload-artifact@v4
        with:
          name: agent6-rank30-funded-clefairy-retreat-native
          path: agent6-rank30-funded-clefairy-retreat-native.json
          if-no-files-found: warn
          retention-days: 15
      - name: Preserve every control, experimental arm, prompt and failure
        if: always() && !inputs.agent6_rank30_rondo
        uses: actions/upload-artifact@v4
        with:
          name: agent7-rank30-source-psychic-stage-aba
          path: agent7-rank30-source-psychic-stage-aba.json
          if-no-files-found: warn
          retention-days: 10
