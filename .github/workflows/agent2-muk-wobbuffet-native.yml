name: Agent 2 Muk versus Wobbuffet official paper priority (staged native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-official-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Capture full staged official-effect four-case diagnostics
        run: node simulation/twinleaf/agent2-muk-wobbuffet-native-order.cjs > agent2-muk-wobbuffet-native.json
      - name: Test real hand evolution and Wobbuffet disable cascade on both seats
        run: node --test tests/agent2-muk-wobbuffet-official.native.test.cjs
      - name: Archive explicit raw native outcomes including mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-muk-wobbuffet-pinned-native-staged
          path: agent2-muk-wobbuffet-native.json
          if-no-files-found: warn
          retention-days: 14
