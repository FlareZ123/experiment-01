name: Registered Aichi original Special Energy both-seat development

on:
  workflow_dispatch:
    inputs:
      mew_reset_pure_only:
        description: 'Default-off pure owner Mew reset root and two-prompt test; no native game'
        type: boolean
        required: false
        default: false
      mew_reset_native_only:
        description: 'Staged two-seat real pinned-Store Mew Techno Guzma return, not a match'
        type: boolean
        required: false
        default: false
      cohort:
        description: 'Frozen published original source cohort'
        type: choice
        required: true
        default: original-four
        options:
          - original-four
          - nonreg-mixed
      study:
        description: 'Baseline public-context Special or registered exact-color contest, unqualified'
        type: choice
        required: true
        default: public-context
        options:
          - public-context
          - contest
      nine_archetype_readiness:
        description: 'Precommitted 36-arm nine-missing-archetype original-60 Store readiness screen'
        type: boolean
        required: false
        default: false
      rank19_source_alias_replay:
        description: 'Retrospective four original rank19 arms after exact source display-alias patch'
        type: boolean
        required: false
        default: false

      rank31_paper_duskull_replay:
        description: 'Two same-seed rank31 Duskull print-fidelity correction arms, retrospective'
        type: boolean
        required: false
        default: false
      rank5_v3_release:
        description: 'Fresh preregistered rank5 original Mew integrated symmetric v3 versus unchanged v2, developmental'
        type: boolean
        required: false
        default: false
      rank9_farewell_replay:
        description: 'Retrospective exact original rank9 two-seat Unown Ability Store comparison'
        type: boolean
        required: false
        default: false
      unown_multirank_replay:
        description: 'Retrospective original-source Unown native settlement ranks 26 30 and 31'
        type: boolean
        required: false
        default: false
      rank17_farewell_replay:
        description: 'Preregistered rank17 original source Ability replay'
        type: boolean
        required: false
        default: false


permissions:
  contents: read

jobs:
  native-paired-flexible-special:
    if: ${{ !inputs.mew_reset_pure_only && !inputs.mew_reset_native_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned, unchanged original Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify sealed source identities, metadata comparisons and failure retention
        run: node --test tests/agent41-flexible-special-four-rank-paired.test.cjs tests/agent41-public-flexible-energy-contest.test.cjs tests/agent41-mysterious-treasure-root-witness.test.cjs tests/agent41-flexible-special-compact-evidence.test.cjs
      - name: Verify registered nine-archetype read-only seed and source membership
        if: ${{ inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay }}
        run: |
          node --check simulation/evaluation/agent25-nine-omitted-archetypes-source-readiness.cjs
          node simulation/evaluation/agent25-nine-omitted-archetypes-source-readiness.cjs --inspect-only
      - name: Preflight strict rank19 source-alias compatibility and original seed identity
        if: ${{ inputs.rank19_source_alias_replay }}
        run: |
          node --test tests/native-accepted-target-store-observer.test.cjs
          node simulation/evaluation/agent25-rank19-source-alias-retrospective.cjs --inspect-only
      - name: Native rank10 Regidrago V Basic versus Double Dragon two-seat settlement
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay && inputs.study == 'contest' }}
        run: node --test tests/agent41-public-flexible-contest-native.test.cjs
      - name: Execute the preregistered 16 actual native Store developmental attempts
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay }}
        env:
          AGENT41_FLEXIBLE_SPECIAL_STUDY: ${{ inputs.study }}
          AGENT41_FLEXIBLE_SPECIAL_COHORT: ${{ inputs.cohort }}
        run: node simulation/evaluation/agent41-flexible-special-four-rank-paired.cjs > agent41-original-flexible-special-16arm.json
      - name: Assert denominator, preserve censored trials, and print bounded receipts
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay }}
        run: |
          node -e "const a=require('node:assert/strict');const p=require('./agent41-original-flexible-special-16arm.json');a.equal(p.attempts,16);a.equal(p.expectedAttempts,16);a.equal(p.rows.length,8);a.equal(p.competitiveQualifiedGames,0);a.equal(p.winRateCertified,false);console.log('FLEXIBLE_SPECIAL_REGISTERED',JSON.stringify({cohort:p.cohort,mode:p.comparisonMode,attempts:p.attempts,pairs:p.pairedPhysicalStarts,errors:p.nativeErrors,selected:p.treatmentSpecialSelections,acceptedSample:p.treatmentSpecialSampleAcceptedLowerBound,sourceAttacks:[p.sourceAttackControl,p.sourceAttackTreatment],pairsByRank:p.rows.map(x=>({id:x.trial.id,control:x.comparison.controlStatus,treatment:x.comparison.treatmentStatus,fullDeal:x.comparison.fullDealMatch,specialSelected:[x.comparison.controlSpecialSelected,x.comparison.treatmentSpecialSelected],nativeWinner:[x.comparison.controlNativeWinner,x.comparison.treatmentNativeWinner]}))}));"
      - name: Print bounded native error and accepted physical Energy-target receipts
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay }}
        run: node simulation/evaluation/agent41-flexible-special-compact-evidence.cjs agent41-original-flexible-special-16arm.json
      - name: Archive every native status, original fingerprint and physical target evidence
        if: ${{ always() && !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent41-original-flexible-special-16arm
          path: agent41-original-flexible-special-16arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Run preregistered missing-nine original printed-source cohort, two physical seats
        if: ${{ inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay }}
        run: node simulation/evaluation/agent25-nine-omitted-archetypes-source-readiness.cjs > agent25-nine-omitted-source-readiness-36arm.json
      - name: Archive every readiness result including print failures and action caps
        if: ${{ always() && inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && !inputs.rank5_v3_release && !inputs.rank9_farewell_replay && !inputs.unown_multirank_replay && !inputs.rank17_farewell_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-nine-omitted-source-readiness-36arm
          path: agent25-nine-omitted-source-readiness-36arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Retrospective same registered physical seed original rank19 root-label replay
        if: ${{ inputs.rank19_source_alias_replay }}
        run: node simulation/evaluation/agent25-rank19-source-alias-retrospective.cjs > agent25-rank19-source-alias-replay-4arm.json
      - name: Preserve original rank19 replay and all failure sidecars
        if: ${{ always() && inputs.rank19_source_alias_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-rank19-source-alias-replay-4arm
          path: agent25-rank19-source-alias-replay-4arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Pure tests and source preflight for rank31 printed Duskull
        if: ${{ inputs.rank31_paper_duskull_replay }}
        run: |
          node --test tests/agent25-rank31-paper-duskull-discard-hook.test.cjs
          node simulation/evaluation/agent25-rank31-paper-duskull-retrospective.cjs --inspect-only
      - name: Run two original rank31 printed Duskull correction trials
        if: ${{ inputs.rank31_paper_duskull_replay }}
        run: node simulation/evaluation/agent25-rank31-paper-duskull-retrospective.cjs > agent25-rank31-paper-duskull-replay-2arm.json
      - name: Archive rank31 native corrected trial evidence
        if: ${{ always() && inputs.rank31_paper_duskull_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-rank31-paper-duskull-replay-2arm
          path: agent25-rank31-paper-duskull-replay-2arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Preflight externally pinned original rank5 two-seat v3 release and owner-only copy choice
        if: ${{ inputs.rank5_v3_release }}
        run: |
          node --check simulation/evaluation/agent13-v3-rank5-original-release.cjs
          node --test tests/agent13-v3-rank5-integration.test.cjs tests/agent13-v3-rank5-release.test.cjs tests/agent48-mew-original-copy-option-order.test.cjs tests/agent13-native-bot-decoder-frame-audit.test.cjs
          node simulation/evaluation/agent13-v3-rank5-original-release.cjs --inspect-only > agent13-rank5-v3-preflight.json
      - name: Run the eight preregistered original rank5 native v2 versus integrated v3 attempts
        if: ${{ inputs.rank5_v3_release }}
        run: node simulation/evaluation/agent13-v3-rank5-original-release.cjs > agent13-rank5-v3-native-8arm.json
      - name: Summarize retained native statuses and owner copied-attack selections
        if: ${{ inputs.rank5_v3_release }}
        run: |
          node -e "const a=require('node:assert/strict');const x=require('./agent13-rank5-v3-native-8arm.json');a.equal(x.attempted,8);a.equal(x.comparisons.length,4);a.equal(x.competitiveQualifiedGames,0);console.log('RANK5_V3_RELEASE',JSON.stringify({profile:x.profileGitBlobSha,registration:x.registrationGitBlobSha,comparisons:x.comparisons.map(r=>({trial:r.trial.id,sameSource:r.controlledSameSourceDeal,baseline:r.baseline.status,v3:r.integratedV3.status,attackDelta:r.observedAttackDelta,sourceEvolution:r.integratedV3.sourceMewVMAXPlayRoots?.length??0,sourceTechnoBlast:r.integratedV3.ownerSourceGenesectCopiedSelections?.length??0}))}));"
      - name: Archive all original rank5 both-seat v3 attempts and source fingerprints
        if: ${{ always() && inputs.rank5_v3_release }}
        uses: actions/upload-artifact@v4
        with:
          name: agent13-rank5-v3-native-8arm
          path: |
            agent13-rank5-v3-native-8arm.json
            agent13-rank5-v3-preflight.json
          if-no-files-found: warn
          retention-days: 20
      - name: Validate owner-only Unown Ability decisions and frozen rank9 source registrations
        if: ${{ inputs.rank9_farewell_replay }}
        run: |
          node --test tests/agent14-owner-farewell-letter.test.cjs tests/agent14-farewell-physical-witness.test.cjs tests/agent14-unown-original-registration.test.cjs tests/agent14-basic-ability-locks.test.cjs
          node simulation/evaluation/agent14-rank9-farewell-native-replay.cjs --inspect-only > agent14-rank9-preflight.json
      - name: Run same-source rank9 Farewell Letter root comparison, both physical seats
        if: ${{ inputs.rank9_farewell_replay }}
        run: node simulation/evaluation/agent14-rank9-farewell-native-replay.cjs > agent14-rank9-farewell-native-8arm.json
      - name: Rank9 brief native ability summary
        if: ${{ inputs.rank9_farewell_replay }}
        run: node simulation/evaluation/agent14-rank9-farewell-compact.cjs agent14-rank9-farewell-native-8arm.json
      - name: Verify frozen rank9 original-source deferred Ability settlement
        if: ${{ inputs.rank9_farewell_replay }}
        run: node simulation/evaluation/agent14-rank9-farewell-gate.cjs agent14-rank9-farewell-native-8arm.json
      - name: Retain every original rank9 native attempt, censor and Store failure
        if: ${{ always() && inputs.rank9_farewell_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent14-rank9-unown-source-replay
          path: |
            agent14-rank9-preflight.json
            agent14-rank9-farewell-native-8arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Validate authentic original ranks 26 30 31 Unown replay inputs
        if: ${{ inputs.unown_multirank_replay }}
        run: |
          node --test tests/agent14-owner-farewell-letter.test.cjs tests/agent14-farewell-physical-witness.test.cjs tests/agent14-unown-original-registration.test.cjs tests/agent14-basic-ability-locks.test.cjs
          node simulation/evaluation/agent14-multirank-unown-original-replay.cjs --inspect-only > agent14-other-unown-preflight.json
      - name: Run 24 actual native off-on original-source Unown development trials
        if: ${{ inputs.unown_multirank_replay }}
        run: node simulation/evaluation/agent14-multirank-unown-original-replay.cjs > agent14-other-unown-24arm.json
      - name: Summarize owner-native settlement by rank and censored source trials
        if: ${{ inputs.unown_multirank_replay }}
        run: node simulation/evaluation/agent14-multirank-unown-compact.cjs agent14-other-unown-24arm.json
      - name: Archive complete additional original Unown rank evidence
        if: ${{ always() && inputs.unown_multirank_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent14-original-unown-other-ranks
          path: |
            agent14-other-unown-preflight.json
            agent14-other-unown-24arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Validate preregistered original rank17 source and pure Unown decision tests
        if: ${{ inputs.rank17_farewell_replay }}
        run: |
          node --test tests/agent14-owner-farewell-letter.test.cjs tests/agent14-farewell-physical-witness.test.cjs tests/agent14-unown-original-registration.test.cjs tests/agent14-basic-ability-locks.test.cjs
          node simulation/evaluation/agent14-rank17-farewell-original-replay.cjs --inspect-only > agent14-rank17-preflight.json
      - name: Run preregistered original rank17 two-seat native Unown replay
        if: ${{ inputs.rank17_farewell_replay }}
        run: node simulation/evaluation/agent14-rank17-farewell-original-replay.cjs > agent14-rank17-original-8arm.json
      - name: Print rank17 original native Abilities and complete failure status
        if: ${{ inputs.rank17_farewell_replay }}
        run: node simulation/evaluation/agent14-rank17-farewell-compact.cjs agent14-rank17-original-8arm.json
      - name: Archive rank17 exact original source native off-on data
        if: ${{ always() && inputs.rank17_farewell_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent14-rank17-original-farewell
          path: |
            agent14-rank17-preflight.json
            agent14-rank17-original-8arm.json
          if-no-files-found: warn
          retention-days: 20

  mew-reset-owner-pure:
    if: ${{ inputs.mew_reset_pure_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rank5 Mew reset actor root, native action mapping and two prompt continuations
        run: |
          node --check simulation/twinleaf/agent41-mew-techno-reset-frontier.cjs
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/twinleaf/agent43-guzma-prompt-continuation.cjs
          node --test tests/agent41-mew-techno-reset-frontier.test.cjs tests/agent41-mew-techno-reset-native-root.test.cjs tests/agent43-guzma-prompt-continuation.test.cjs tests/agent41-mew-reset-physical-receipt.test.cjs

  mew-reset-native-staged:
    if: ${{ inputs.mew_reset_native_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Build unchanged pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Verify two physical-seat Mew VMAX copied Techno into Guzma and free-retreat recopy
        run: node --test tests/agent41-mew-techno-reset.native.test.cjs
