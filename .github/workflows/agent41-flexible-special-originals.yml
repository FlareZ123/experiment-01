name: Registered Aichi original Special Energy both-seat development

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: 'Frozen published original source cohort'
        type: choice
        required: true
        default: original-four
        options:
          - original-four
          - nonreg-mixed
      study:
        description: 'Baseline public-context Special or registered exact-color contest, unqualified'
        type: choice
        required: true
        default: public-context
        options:
          - public-context
          - contest
      nine_archetype_readiness:
        description: 'Precommitted 36-arm nine-missing-archetype original-60 Store readiness screen'
        type: boolean
        required: false
        default: false
      rank19_source_alias_replay:
        description: 'Retrospective four original rank19 arms after exact source display-alias patch'
        type: boolean
        required: false
        default: false

      rank31_paper_duskull_replay:
        description: 'Two same-seed rank31 Duskull print-fidelity correction arms, retrospective'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  native-paired-flexible-special:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned, unchanged original Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify sealed source identities, metadata comparisons and failure retention
        run: node --test tests/agent41-flexible-special-four-rank-paired.test.cjs tests/agent41-public-flexible-energy-contest.test.cjs tests/agent41-mysterious-treasure-root-witness.test.cjs tests/agent41-flexible-special-compact-evidence.test.cjs
      - name: Verify registered nine-archetype read-only seed and source membership
        if: ${{ inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay }}
        run: |
          node --check simulation/evaluation/agent25-nine-omitted-archetypes-source-readiness.cjs
          node simulation/evaluation/agent25-nine-omitted-archetypes-source-readiness.cjs --inspect-only
      - name: Preflight strict rank19 source-alias compatibility and original seed identity
        if: ${{ inputs.rank19_source_alias_replay }}
        run: |
          node --test tests/native-accepted-target-store-observer.test.cjs
          node simulation/evaluation/agent25-rank19-source-alias-retrospective.cjs --inspect-only
      - name: Native rank10 Regidrago V Basic versus Double Dragon two-seat settlement
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay && inputs.study == 'contest' }}
        run: node --test tests/agent41-public-flexible-contest-native.test.cjs
      - name: Execute the preregistered 16 actual native Store developmental attempts
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay }}
        env:
          AGENT41_FLEXIBLE_SPECIAL_STUDY: ${{ inputs.study }}
          AGENT41_FLEXIBLE_SPECIAL_COHORT: ${{ inputs.cohort }}
        run: node simulation/evaluation/agent41-flexible-special-four-rank-paired.cjs > agent41-original-flexible-special-16arm.json
      - name: Assert denominator, preserve censored trials, and print bounded receipts
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay }}
        run: |
          node -e "const a=require('node:assert/strict');const p=require('./agent41-original-flexible-special-16arm.json');a.equal(p.attempts,16);a.equal(p.expectedAttempts,16);a.equal(p.rows.length,8);a.equal(p.competitiveQualifiedGames,0);a.equal(p.winRateCertified,false);console.log('FLEXIBLE_SPECIAL_REGISTERED',JSON.stringify({cohort:p.cohort,mode:p.comparisonMode,attempts:p.attempts,pairs:p.pairedPhysicalStarts,errors:p.nativeErrors,selected:p.treatmentSpecialSelections,acceptedSample:p.treatmentSpecialSampleAcceptedLowerBound,sourceAttacks:[p.sourceAttackControl,p.sourceAttackTreatment],pairsByRank:p.rows.map(x=>({id:x.trial.id,control:x.comparison.controlStatus,treatment:x.comparison.treatmentStatus,fullDeal:x.comparison.fullDealMatch,specialSelected:[x.comparison.controlSpecialSelected,x.comparison.treatmentSpecialSelected],nativeWinner:[x.comparison.controlNativeWinner,x.comparison.treatmentNativeWinner]}))}));"
      - name: Print bounded native error and accepted physical Energy-target receipts
        if: ${{ !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay }}
        run: node simulation/evaluation/agent41-flexible-special-compact-evidence.cjs agent41-original-flexible-special-16arm.json
      - name: Archive every native status, original fingerprint and physical target evidence
        if: ${{ always() && !inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent41-original-flexible-special-16arm
          path: agent41-original-flexible-special-16arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Run preregistered missing-nine original printed-source cohort, two physical seats
        if: ${{ inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay }}
        run: node simulation/evaluation/agent25-nine-omitted-archetypes-source-readiness.cjs > agent25-nine-omitted-source-readiness-36arm.json
      - name: Archive every readiness result including print failures and action caps
        if: ${{ always() && inputs.nine_archetype_readiness && !inputs.rank19_source_alias_replay && !inputs.rank31_paper_duskull_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-nine-omitted-source-readiness-36arm
          path: agent25-nine-omitted-source-readiness-36arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Retrospective same registered physical seed original rank19 root-label replay
        if: ${{ inputs.rank19_source_alias_replay }}
        run: node simulation/evaluation/agent25-rank19-source-alias-retrospective.cjs > agent25-rank19-source-alias-replay-4arm.json
      - name: Preserve original rank19 replay and all failure sidecars
        if: ${{ always() && inputs.rank19_source_alias_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-rank19-source-alias-replay-4arm
          path: agent25-rank19-source-alias-replay-4arm.json
          if-no-files-found: warn
          retention-days: 20
      - name: Pure tests and source preflight for rank31 printed Duskull
        if: ${{ inputs.rank31_paper_duskull_replay }}
        run: |
          node --test tests/agent25-rank31-paper-duskull-discard-hook.test.cjs
          node simulation/evaluation/agent25-rank31-paper-duskull-retrospective.cjs --inspect-only
      - name: Run two original rank31 printed Duskull correction trials
        if: ${{ inputs.rank31_paper_duskull_replay }}
        run: node simulation/evaluation/agent25-rank31-paper-duskull-retrospective.cjs > agent25-rank31-paper-duskull-replay-2arm.json
      - name: Archive rank31 native corrected trial evidence
        if: ${{ always() && inputs.rank31_paper_duskull_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-rank31-paper-duskull-replay-2arm
          path: agent25-rank31-paper-duskull-replay-2arm.json
          if-no-files-found: warn
          retention-days: 20
