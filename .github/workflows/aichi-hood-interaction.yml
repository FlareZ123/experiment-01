name: Aichi Stealthy Hood versus Initialization
on:
  workflow_dispatch:
    inputs:
      hood_rank8_second:
        description: 'Optional source ranked Hood game starting second'
        type: boolean
        default: false
      hood_rank8_board_audit:
        description: 'Optional source-locked three-replay opponent attack-resource audit'
        type: boolean
        default: false
      hood_rank8_boostshake_fork:
        description: 'Authentic rank8 turn7 Secret Box + Boost Shake counterfactual'
        type: boolean
        default: false
      hood_rank8_stone_policy:
        description: 'Matched source rank8 Hood Forest Seal Tool Power policy contrast'
        type: boolean
        default: false
      hood_rank8_spent_supporter_replay:
        description: 'Agent31 retrospective rank8 Stone unrestricted search ranking contrast'
        type: boolean
        default: false
      hood_rank8_pressure_prospective:
        description: 'Agent15 frozen 16-seed source rank8 Hood pressure pairs'
        type: boolean
        default: false
      agent1_evolution_stage_native:
        description: 'Run compiled printed evolution fidelity probe'
        type: boolean
        default: false
      agent1_source_dealt_pairs:
        description: 'Run bounded rank1 versus rank10 natural evolution root pairs'
        type: boolean
        default: false
      agent44_rank8_box_k0_source_census:
        description: 'Opt-in 48 preregistered original rank8 both-seat source first-turn read-only K0 hand screens, no game strength'
        type: boolean
        default: false
      agent44_rank8_box_k0_extension:
        description: 'Opt-in disjoint 208-seed original rank8 K0 extension after the first 48 cohort returned zero strict windows'
        type: boolean
        default: false
      agent44_rank8_box_fetch_shake_native:
        description: 'Opt-in synthetic original-rank8 hand/deck swap and genuine Secret Box Item->Shake native effect test; no original deal'
        type: boolean
        default: false
      hood_rank8_crispin_native:
        description: 'Source turn7 Secret Box Crispin native Energy choice and attack audit'
        type: boolean
        default: false
      hood_guard_temple_native:
        description: 'Optional pinned Guard Energy versus Temple and equipped Garbotoxin stats matrix'
        type: boolean
        default: false
      mega_darkrai_60_probe:
        description: 'Optional post-event Mega Darkrai exploratory printing and exact opening census'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hood-position:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf commit
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Probe ordinary from-hand evolution
        if: inputs.agent1_evolution_stage_native
        run: node simulation/twinleaf/agent1-native-evolution-stage-probe.cjs
      - name: Test actor-only guarded natural evolution frontier
        if: inputs.agent1_evolution_stage_native
        run: |
          node --check simulation/twinleaf/agent1-actor-evolution-frontier.cjs
          node --test tests/agent1-actor-evolution-frontier.test.cjs
      - name: Run source-dealt natural evolution actor policy pairs
        if: inputs.agent1_source_dealt_pairs
        run: node simulation/evaluation/agent1-natural-evolution-source-pairs.cjs > agent1-evolution-source-pairs.json
      - name: Archive evolution source-dealt paired development evidence
        if: always() && inputs.agent1_source_dealt_pairs
        uses: actions/upload-artifact@v4
        with:
          name: agent1-natural-evolution-rank1-rank10-development
          path: agent1-evolution-source-pairs.json
          if-no-files-found: warn
          retention-days: 21
      - name: Test Hood position with Iron Thorns and Tool Jammer
        run: node simulation/twinleaf/hood-vs-thorns.cjs
      - name: Test Megaton Blower Tool removal and compatibility hook
        run: node simulation/twinleaf/megaton-blower-fixture.cjs
      - name: Test protected Underworld Door attachment and draw
        run: node simulation/twinleaf/underworld-door-action.cjs
      - name: Test Canceling Cologne restores Climactic Gate prompt
        run: node simulation/twinleaf/cologne-gate-fixture.cjs
      - name: Test real Store actions through Climactic Gate and Cologne
        run: node simulation/twinleaf/cologne-gate-store-action.cjs
      - name: Test Benched Dedenne and Crobat draw Abilities under Initialization
        run: node simulation/twinleaf/entry-draw-lock-action.cjs
      - name: Smoke headless opt-in entry draw lock flag and hook restoration
        run: node simulation/twinleaf/entry-draw-runner-smoke.cjs
      - name: Verify Path versus Silent Lab entry draw lock timing
        run: node simulation/twinleaf/entry-draw-stadium-lock-action.cjs
      - name: Verify Tool-gated Garbotoxin hand-zone entry draw suppression
        run: node simulation/twinleaf/entry-draw-garbotoxin-action.cjs
      - name: Verify live-only board observer source isolation
        run: node --test tests/hood-rank8-source-board-observer.test.cjs
      - name: Validate pure rank8 lock and printed-attack gate
        run: node --test tests/rank8-hood-lock-attack-gate.test.cjs
      - name: Verify source Tool Power comparison accounting
        run: node --test tests/hood-rank8-stone-policy-contrast.test.cjs
      - name: Check restricted spent-Supporter Stone source chronology
        run: node --test tests/spent-supporter-search-policy.test.cjs tests/rank8-spent-supporter-stone-source.test.cjs
      - name: Validate authentic pinned rescoring of a spent-turn Star Alchemy search
        run: node --test tests/spent-supporter-search-pinned.test.cjs
      - name: Replay original rank8 Stone search with optional spent-Supporter correction
        if: inputs.hood_rank8_spent_supporter_replay
        run: node simulation/twinleaf/rank8-spent-supporter-stone-source.cjs
      - name: Archive rank8 spent-Supporter Stone prompt source contrast
        if: always() && inputs.hood_rank8_spent_supporter_replay
        uses: actions/upload-artifact@v4
        with:
          name: rank8-spent-supporter-stone-source-comparison
          path: rank8-spent-supporter-search-pair.json
          if-no-files-found: error
          retention-days: 14
      - name: Execute pre-registered Hood rank8 Tool Power contrast
        if: inputs.hood_rank8_stone_policy
        run: node simulation/twinleaf/hood-rank8-stone-policy-contrast.cjs
      - name: Archive Hood rank8 matched Tool Power actions
        if: always() && inputs.hood_rank8_stone_policy
        uses: actions/upload-artifact@v4
        with:
          name: rank8-hood-matched-stone-policy
          path: rank8-hood-stone-policy-contrast.json
          if-no-files-found: warn
      - name: Replay authentic rank8 opponent attack choices three times
        if: inputs.hood_rank8_board_audit
        run: node simulation/twinleaf/hood-rank8-source-board-audit.cjs > rank8-hood-board-audit.json
      - name: Print bounded opponent attack resource ledger
        if: inputs.hood_rank8_board_audit
        run: node -e "const x=require('./rank8-hood-board-audit.json'); const brief=a=>a.map(y=>({turn:y.turn,seat:y.actingSeat,action:y.action,card:y.card,name:y.declaredName,attacker:y.attackBefore,target:y.targetBefore,exact60:y.opponentActiveExactly60,hand:y.visibleBefore.actor.hand})); console.log(JSON.stringify({seed:x.seed,qualified:x.qualifiedForCompetitiveInference,streamIdentical:x.exactFullActionStreamNoninterference,control:x.originalControlOutcome,outcome:x.observedOutcome,attacks:x.attackCounts,hood:brief(x.keyEvents.hood),garbo:brief(x.keyEvents.garbodor),terminal:brief(x.keyEvents.terminalPeriod),darkness:brief(x.keyEvents.darknessEnergyAndPatch),door:brief(x.keyEvents.underworldDoor)},null,2));"
      - name: Show Garbodor Tool activation and Hood destination
        if: inputs.hood_rank8_board_audit
        run: node -e "const x=require('./rank8-hood-board-audit.json'); const slim=e=>({turn:e.turn,action:e.action,card:e.card,actorBefore:e.visibleBefore.actor,actorAfter:e.after.actor,otherBefore:e.visibleBefore.other,otherAfter:e.after.other,discardDark:e.opponentDarknessDiscardBefore}); const chosen=x.chronologicalBoardEvents.filter(e=>e.card==='Float Stone'||e.card==='Stealthy Hood'||e.card==='Garbodor'||e.card==='Trubbish'||e.action==='AttackAction'); console.log(JSON.stringify(chosen.map(slim),null,2));"
      - name: Print source-ranked full public Tool attachment destinations
        if: inputs.hood_rank8_board_audit
        run: node -e "const x=require('./rank8-hood-board-audit.json'); console.log(JSON.stringify(x.fullPublicToolPlays,null,2));"
      - name: Print full source turn seven action and hand chronology
        if: inputs.hood_rank8_board_audit
        run: node -e "const x=require('./rank8-hood-board-audit.json'); console.log(JSON.stringify(x.sourceTurnSevenTimeline.map(e=>({ordinal:e.ordinal,action:e.action,card:e.card,declaredName:e.declaredName,beforeHand:e.beforeHand,afterHand:e.afterHand,benchAfter:e.afterBoard.bench.map(p=>p.name+' ['+p.tools.join(',')+']')})),null,2));"
      - name: Audit source-ranked Hood attacks and Garbotoxin exposure
        if: inputs.hood_rank8_board_audit
        run: node simulation/twinleaf/rank8-hood-lock-attack-gate.cjs rank8-hood-board-audit.json > rank8-hood-action-gate.json
      - name: Print source-ranked attack and lock gate
        if: inputs.hood_rank8_board_audit
        run: node -e "const x=require('./rank8-hood-action-gate.json'); console.log(JSON.stringify({terminal:x.terminalPeriod,doors:x.underworldDoor,equippedGarbodorTurns:x.equippedGarbodorObservedTurns,qualified:x.qualifiedForCompetitiveInference},null,2));"
      - name: Archive source-ranked Hood board-level opponent evidence
        if: always() && inputs.hood_rank8_board_audit
        uses: actions/upload-artifact@v4
        with:
          name: rank8-hood-live-board-action-audit
          path: |
            rank8-hood-board-audit.json
            rank8-hood-action-gate.json
          if-no-files-found: warn
      - name: Check rank8 actual second seed selection
        run: node --test tests/hood-rank8-second-source.test.cjs
      - name: Play source-ranked rank8 Hood actual-second game
        if: inputs.hood_rank8_second
        run: node simulation/twinleaf/hood-rank8-second-source.cjs > rank8-hood-second.json
      - name: Print compact Hood rank8 source outcome
        if: inputs.hood_rank8_second
        run: node -e "const x=require('./rank8-hood-second.json'); console.log(JSON.stringify({seed:x.seedSelection.seed,actualCandidateTurn:x.actualCandidateTurn,game:x.game,qualified:x.qualifiedForWinRateInference},null,2));"
      - name: Archive source-ranked rank8 Hood game
        if: always() && inputs.hood_rank8_second
        uses: actions/upload-artifact@v4
        with:
          name: rank8-hood-source-actual-second
          path: rank8-hood-second.json
          if-no-files-found: warn

      - name: Regress Hood under equipped Garbotoxin and parse source replies
        if: inputs.hood_rank8_boostshake_fork
        run: |
          node --check simulation/twinleaf/rank8-psychic-recovery-source-reply.cjs
          node --check simulation/twinleaf/rank8-hooded-door-source-reply.cjs
          node --check simulation/twinleaf/hood-garbotoxin-recovery-autonomy.cjs
          node --test tests/rank8-hooded-door-source-reply.test.cjs
      - name: Test rank8 K0 Secret Box physical discard and read-only owner-root observation
        if: inputs.agent44_rank8_box_k0_source_census
        run: node --test tests/agent44-rank8-box-k0-window.test.cjs tests/agent44-rank8-box-k0-source-census.test.cjs
      - name: Screen 48 baseline or disjoint 208-extension original rank8 source K0 hands
        if: inputs.agent44_rank8_box_k0_source_census
        env:
          AGENT44_RANK8_K0_EXTENSION: ${{ inputs.agent44_rank8_box_k0_extension }}
        run: node simulation/twinleaf/agent44-rank8-box-k0-source-census.cjs > agent44-rank8-original-k0-source.json
      - name: Summarize registered rank8 owner K0 opportunities without outcome claims
        if: inputs.agent44_rank8_box_k0_source_census
        run: >-
          node -e "const r=require('./agent44-rank8-original-k0-source.json'); console.log(JSON.stringify({schema:r.schema,startIndex:r.startIndex,trials:r.trialCount,observed:r.observedOwnerK0,sourceStarts:r.actualSourceStarts,cardFunnel:r.observedCardFunnel,windows:r.exposed,noOpControls:r.noOpControlsPassed,failed:r.failedTrials,qualified:r.competitiveQualifiedGames}));"
      - name: Archive rank8 source first-owner-root K0 observation of all physical deals
        if: always() && inputs.agent44_rank8_box_k0_source_census
        uses: actions/upload-artifact@v4
        with:
          name: agent44-rank8-original-k0-source-census
          path: agent44-rank8-original-k0-source.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test authenticated Secret Box owner-K1 category prompt selector
        if: inputs.agent44_rank8_box_fetch_shake_native
        run: node --test tests/agent44-secretbox-owner-prompt.test.cjs
      - name: Check synthetic rank8 Box-fetches-Shake native semantics fixture
        if: inputs.agent44_rank8_box_fetch_shake_native
        run: node --check simulation/twinleaf/agent44-rank8-box-fetch-shake-native.cjs
      - name: Exercise genuine Store Secret Box Item-to-Shake under declared synthetic rank8 deal
        if: inputs.agent44_rank8_box_fetch_shake_native
        run: node simulation/twinleaf/agent44-rank8-box-fetch-shake-native.cjs > agent44-rank8-box-fetch-shake-native.json
      - name: Archive synthetic Box-fetches-Shake native witness with explicit noncompetitive status
        if: always() && inputs.agent44_rank8_box_fetch_shake_native
        uses: actions/upload-artifact@v4
        with:
          name: agent44-box-fetches-shake-native-development
          path: agent44-rank8-box-fetch-shake-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Execute source-dealt rank8 early Garbotoxin source fork
        if: inputs.hood_rank8_boostshake_fork
        run: node simulation/twinleaf/rank8-boostshake-source-run.cjs > rank8-boostshake-fork.json
      - name: Summarize source-dealt rank8 Boost Shake counterfactual
        if: inputs.hood_rank8_boostshake_fork
        run: node -e "const x=require('./rank8-boostshake-fork.json'); console.log(JSON.stringify({seed:x.seed,choices:x.choices,board:x.boardAtResponse,turn8:x.candidateTurn8Actions,postDoorPassProbe:x.hoodedLiveLock?.postDoorPassProbe,liveLock:x.hoodedLiveLock?.liveLockAbilityProbes,toolRemoved:x.psychicRecovery?.unlockedBenchAbilityProbe,qualified:x.qualifiedForCompetitiveInference},null,2));"
      - name: Archive source-dealt Boost Shake fork
        if: always() && inputs.hood_rank8_boostshake_fork
        uses: actions/upload-artifact@v4
        with:
          name: rank8-boostshake-source-fork
          path: rank8-boostshake-fork.json
          if-no-files-found: warn

      - name: Validate genuine Secret Box search category selection
        if: inputs.hood_rank8_boostshake_fork
        run: |
          node --check simulation/twinleaf/rank8-secretbox-owner-category-audit.cjs
          node --test tests/rank8-secretbox-owner-category-audit.test.cjs
      - name: Replay actual owner Secret Box prompt and retained options
        if: inputs.hood_rank8_boostshake_fork
        run: node simulation/twinleaf/rank8-secretbox-owner-category-audit.cjs > rank8-secretbox-owner-category-audit.json
      - name: Archive Secret Box owner-prompt search comparison
        if: always() && inputs.hood_rank8_boostshake_fork
        uses: actions/upload-artifact@v4
        with:
          name: rank8-secretbox-owner-search-comparison
          path: rank8-secretbox-owner-category-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate source rank8 conditional opponent lock policy
        if: inputs.hood_rank8_boostshake_fork
        run: |
          node --check simulation/twinleaf/rank8-boostshake-autonomous-policy.cjs
          node --check simulation/twinleaf/rank8-boostshake-autonomous-source-run.cjs
          node --test tests/rank8-boostshake-autonomous-policy.test.cjs
      - name: Audit source rank8 autonomous opponent and protected Hood reply
        if: inputs.hood_rank8_boostshake_fork
        run: node simulation/twinleaf/rank8-boostshake-autonomous-source-run.cjs > rank8-autonomous-boostshake.json
      - name: Archive source rank8 autonomous opponent trace
        if: always() && inputs.hood_rank8_boostshake_fork
        uses: actions/upload-artifact@v4
        with:
          name: rank8-autonomous-opponent-source-pair
          path: rank8-autonomous-boostshake.json
          if-no-files-found: warn

      - name: Validate frozen rank8 prospective seeds and deterministic audit
        if: inputs.hood_rank8_pressure_prospective
        run: node --test tests/rank8-hood-pressure-registered-v1.test.cjs tests/rank8-boostshake-duplicate-discard.test.cjs
      - name: Run exact pre-registered 16 rank8 baseline/conditional pairs
        if: inputs.hood_rank8_pressure_prospective
        run: node simulation/twinleaf/rank8-hood-pressure-registered-v1.cjs > rank8-hood-pressure-prospective.json
      - name: Print bounded rank8 source/candidate prospective events
        if: inputs.hood_rank8_pressure_prospective
        run: node -e "const x=require('./rank8-hood-pressure-prospective.json'); console.log(JSON.stringify({schema:x.schema,attempted:x.attempted,observed:x.observed,exceptions:x.exceptions,trueSourceFirst:x.trueSourceFirst,sourcePolicyAttempts:x.sourcePolicyAttempts,sourcePolicyCompletions:x.sourcePolicyCompletions,sourceEquippedGarbodor:x.sourceEquippedGarbodor,candidateReplyAttempts:x.candidateReplyAttempts,candidateVerifiedEffects:x.candidateVerifiedEffects,noOpParityViolations:x.noOpParityViolations,startOrDeckViolations:x.startOrDeckViolations,qualifiedCompetitiveGames:x.qualifiedCompetitiveGames},null,2)); if(x.attempted!==16||x.noOpParityViolations||x.startOrDeckViolations)process.exitCode=1"
      - name: Archive frozen rank8 Hood prospective source panel
        if: always() && inputs.hood_rank8_pressure_prospective
        uses: actions/upload-artifact@v4
        with:
          name: rank8-hood-pressure-16-paired-unqualified
          path: rank8-hood-pressure-prospective.json
          if-no-files-found: warn
          retention-days: 21

      - name: Validate owner-side Crispin native Energy proposal
        if: inputs.hood_rank8_crispin_native
        run: |
          node --check simulation/twinleaf/rank8-secretbox-crispin-native-line.cjs
          node --test tests/rank8-secretbox-crispin-native-line.test.cjs
      - name: Execute authentic source Crispin four-category continuation
        if: inputs.hood_rank8_crispin_native
        run: node simulation/twinleaf/rank8-secretbox-crispin-native-line.cjs > rank8-secretbox-crispin-native.json
      - name: Archive source Crispin prompt and opponent reply
        if: always() && inputs.hood_rank8_crispin_native
        uses: actions/upload-artifact@v4
        with:
          name: rank8-secretbox-crispin-native-line
          path: rank8-secretbox-crispin-native.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check Guard Temple card texts and exact source sighting regression
        if: inputs.hood_guard_temple_native
        run: |
          node --check simulation/twinleaf/hood-guard-temple-native-stats.cjs
          node --test tests/hood-guard-window-exact.test.cjs
      - name: Execute pinned Guard Temple Hood native stats matrix
        if: inputs.hood_guard_temple_native
        run: node simulation/twinleaf/hood-guard-temple-native-stats.cjs > hood-guard-temple-native-stats.json
      - name: Archive Guard Temple printed-effect compatibility packet
        if: always() && inputs.hood_guard_temple_native
        uses: actions/upload-artifact@v4
        with:
          name: hood-guard-temple-native-stats
          path: hood-guard-temple-native-stats.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test post-event Mega Darkrai exact opening claims
        if: inputs.mega_darkrai_60_probe
        run: |
          node --check scripts/mega-darkrai-opening-direct.cjs
          node --check simulation/twinleaf/mega-darkrai-printing-admission.cjs
          node --test tests/mega-darkrai-opening-direct.test.cjs
      - name: Validate experimental full 60 against pinned engine
        if: inputs.mega_darkrai_60_probe
        run: node simulation/twinleaf/mega-darkrai-printing-admission.cjs > mega-darkrai-deck-60-admission.json
      - name: Execute staged genuine Dark Bell to Abyss Eye attack controls
        if: inputs.mega_darkrai_60_probe
        run: node simulation/twinleaf/mega-darkrai-bell-abyss-native.cjs > mega-darkrai-bell-abyss-native.json
      - name: Archive exploratory printability and exact early-resource gate
        if: always() && inputs.mega_darkrai_60_probe
        uses: actions/upload-artifact@v4
        with:
          name: mega-darkrai-deck-60-admission
          path: |
            mega-darkrai-deck-60-admission.json
            mega-darkrai-bell-abyss-native.json
          if-no-files-found: warn
          retention-days: 14
