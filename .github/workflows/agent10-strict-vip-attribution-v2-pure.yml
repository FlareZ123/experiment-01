name: Agent10 strict VIP attribution v2 pure tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-vip-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Run strict VIP attribution contract tests
        run: node --test tests/2026-11/agent10-strict-vip-treatment-attribution-v2.test.cjs tests/2026-11/agent10-strict-vip-treatment-attribution-v3.test.cjs tests/agent9-battle-vip-owner-after-pass-v4.test.cjs
      - name: Run rank2 Vileplume Control source-policy contract tests
        run: node --check simulation/evaluation/2026-11/agent10-rank2-vileplume-control-opponent-policy.cjs && node --test tests/2026-11/agent10-rank2-vileplume-control-opponent-policy.test.cjs
