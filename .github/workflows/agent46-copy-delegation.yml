name: Agent 46 native copied-attack effect isolation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Exact legal-opening Prize blocker with source-checked rank1 singletons
        run: |
          node --test tests/agent46-champion-copycat-prize-frontier.test.cjs
          node scripts/agent46-champion-copycat-prize-frontier.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate native ChooseAttackPrompt object-versus-serialized response contract
        run: node --test tests/native-choose-attack-answer.test.cjs
      - name: Direct printed Overclock versus copied Apex Overclock controls
        run: node simulation/twinleaf/agent46-regidrago-apex-overclock-payload-native.cjs
      - name: Native original Dragon source-handler and effect trace
        run: node simulation/twinleaf/agent46-apex-source-delegation-trace.cjs
      - name: Mimikyu Copycat non-GX Apex paper gate with no nested choice
        run: node simulation/twinleaf/agent46-mimikyu-apex-copycat-native.cjs
      - name: Stadium-aware Mimikyu Copycat payment and funding-policy regressions
        run: |
          node --test tests/2026-11/agent50-mimikyu-dimension-valley-copycat-cost.native.test.cjs
          node --test tests/2026-11/agent46-underworld-mimikyu-energy-focus.native.test.cjs
          node --test tests/2026-11/agent46-mimikyu-fund-and-promote.native.test.cjs
      - name: Genuine prior Apex turn then original Mimikyu Copycat
        run: node simulation/twinleaf/agent46-mimikyu-apex-consecutive-native.cjs
      - name: Both-seat genuine prior Apex with opt-in declared history and printed Mimikyu Copycat
        run: node simulation/twinleaf/agent46-apex-history-copycat-two-seat-native.cjs
      - name: Genuine prior Apex then two Regidrago knockouts with native GX and four Prizes
        run: node simulation/twinleaf/agent46-real-apex-champion-two-ko-native.cjs
      - name: Exact original rank1 and rank10 60-card physical custody through real Apex and four Prizes
        run: node simulation/twinleaf/agent46-original60-real-apex-two-ko-native.cjs
      - name: Original source60 both-seat A/B native unpatched copied attack versus printed paper corrections
        run: node simulation/twinleaf/agent46-original60-unpatched-vs-paper-copycat-native.cjs
      - name: Both-seat GX-spent replay of real Apex then Mimikyu nested Timeless choice
        run: node simulation/twinleaf/agent46-copycat-spent-gx-native.cjs
      - name: Corrected nested Dragon choice under reversible Mimikyu source hook
        run: node simulation/twinleaf/agent46-mimikyu-apex-timeless-native.cjs
      - name: Corrected flattened Dragon choice in both physical source seats
        run: node simulation/twinleaf/agent46-mimikyu-apex-flattened-native.cjs
      - name: Real preceding Apex with flattened Dragon choice both seats
        run: node simulation/twinleaf/agent46-mimikyu-apex-flattened-consecutive-native.cjs
      - name: Compare synchronous preselected diagnostic as negative methodological control
        run: node simulation/twinleaf/agent46-mimikyu-apex-synchronous-native.cjs
      - name: Mimikyu Eon Blade lock blocks Copycat and Filch across full headless hook set
        run: node simulation/twinleaf/agent46-mimikyu-copycat-eonblade-lock-native.cjs
      - name: Agent3 direct-injection Eon Blade lock contract using native CardType costs
        run: node --test tests/agent3-mimikyu-copycat-eonblade-lock-native.test.cjs
      - name: Native SimpleTacticsAi rejects underfunded and attack-locked Mimikyu Copycat; funded positive control
        run: node simulation/twinleaf/agent46-mimikyu-policy-underfunded-native.cjs
