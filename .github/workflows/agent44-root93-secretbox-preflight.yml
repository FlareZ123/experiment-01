name: Agent44 retrospective root93 Secret Box paid Store probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-root93:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax before installing native engine
        run: node --check simulation/evaluation/agent44-root93-secretbox-paid-store-retro.cjs
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Configure pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install native engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf without editing vendor
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Reproduce original first candidate Pass and settle alternate paid Secret Box root
        run: node simulation/evaluation/agent44-root93-secretbox-paid-store-retro.cjs
      - name: Preserve accepted Store evidence even when a strict assertion fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-root93-secretbox-paid-store
          path: artifacts/agent44-root93-secretbox-paid-store-retro.json
          if-no-files-found: warn
          retention-days: 30
