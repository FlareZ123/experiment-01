name: Aichi Twinleaf exact-printing feasibility

on:
  workflow_dispatch:
    inputs:
      battle_compressor_source_exposure:
        description: Run bounded rank1 vs rank10 Battle Compressor source selection audit
        required: false
        type: boolean
        default: false
      absol_hardmatchup_probe:
        description: Run exact-source four-rank unqualified Absol matchup diagnostic
        required: false
        type: boolean
        default: false
      absol_rank8_wally_fork:
        description: One authentic rank-8 source turn2 Wally-versus-Pass branch
        required: false
        type: boolean
        default: false
      absol_rank11_firstturn_audit:
        description: Source rank 11 first-turn opponent own-hand observer pair
        required: false
        type: boolean
        default: false
      rank11_turn50_perfection_reply_fork:
        description: Owner-visible Perfection replay after live source Quick Ball line
        required: false
        type: boolean
        default: false
      rank11_turn49_quick_ball_fork:
        description: Retrospective live-Store Quick Ball source-pressure counterfactual, unqualified
        required: false
        type: boolean
        default: false
      rank9_horror_house_causal_fork:
        description: Two selected authentic Horror House attacks with explicitly illegal no-hand-lock matched source fork
        required: false
        type: boolean
        default: false
      rank9_horror_house_reply_probe:
        description: Single authentic rank9 native Horror House root, opponent next-turn and observer-parity test
        required: false
        type: boolean
        default: false
      rank9_horror_house_root_probe:
        description: Bounded exact-source rank9 real-root Horror House audit, no win inference
        required: false
        type: boolean
        default: false
      agent24_cynthia_same_state_fork:
        description: Four fixed authentic source first C&C null-vs-mode0 single-action forks
        required: false
        type: boolean
        default: false
      agent24_cynthia_source_exposure:
        description: Fixed 4 authentic rank6/rank24 source first and opposite-seat C&C mode census
        required: false
        type: boolean
        default: false
      rank2_live_gh_same_state_fork:
        description: Fork first real source G&H mode on the exact same native preprompt root
        required: false
        type: boolean
        default: false
      rank2_mandatory_option_pair:
        description: Genuine exact-source rank2 both-seat null-vs-mode0 native choice exposure
        required: false
        type: boolean
        default: false
      absol_rank11_shopping_observer:
        description: Read-only source rank 11 Shopping Center and Crobat opportunity audit
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  printing-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install upstream dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile upstream engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate actor-only native Supporter opportunity observer (pure)
        run: node --test tests/agent2-native-owner-supporter-opportunity.test.cjs
      - name: Verify canonical original-Store Supporter observation is noninterfering
        run: node simulation/twinleaf/agent2-native-owner-supporter-noninterference-smoke.cjs > agent2-owner-supporter-historical-native.json
      - name: Archive bounded real-Store owner Supporter affordances and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-owner-supporter-historical-native
          path: agent2-owner-supporter-historical-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate native Supporter score disposition instrumentation (pure)
        run: node --test tests/agent2-native-supporter-score-disposition.test.cjs
      - name: Compare pinned native Supporter evaluation before live same-deal Passes
        run: node simulation/twinleaf/agent2-native-supporter-score-samedeal-smoke.cjs > agent2-supporter-score-samedeal.json
      - name: Archive actual owner-pass score dispositions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-supporter-score-samedeal-native
          path: agent2-supporter-score-samedeal.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify actor-visible shuffle draw Supporter chooser and native root hooks
        run: node --test tests/agent2-conservative-shuffle-supporter.test.cjs tests/agent2-actor-only-shuffle-supporter-after-pass.test.cjs tests/agent2-native-shuffle-emptydeck-gate.test.cjs tests/agent2-sole-shuffle-deckzero-hook.test.cjs tests/agent2-sole-shuffle-deckzero-native-store.test.cjs tests/agent2-sole-shuffle-deckzero-native-root.test.cjs
      - name: Validate all 29 exact original source shuffle Supporter family counts
        run: node --test tests/agent2-source-shuffle-supporter-census.test.cjs
      - name: Run bounded historic both-seat shuffle draw root and native Lillie effect probe
        run: node simulation/twinleaf/agent2-shuffle-supporter-samedeal-native.cjs > agent2-shuffle-supporter-samedeal-native.json
      - name: Archive all accepted and rejected draw Supporter choice receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-shuffle-supporter-samedeal-native
          path: agent2-shuffle-supporter-samedeal-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate actor-only preattack shuffle Supporter printed intent and public receipt
        run: node --test tests/agent2-actor-conservative-shuffle-pre-attack.test.cjs tests/agent2-preattack-supporter-followthrough.test.cjs
      - name: Compare 18 historical both-seat preattack shuffle Supporter decisions
        run: node simulation/twinleaf/agent2-shuffle-supporter-pre-attack-native.cjs > agent2-shuffle-supporter-preattack-native.json
      - name: Archive owner-root preattack Supporter and native prompt outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-shuffle-supporter-preattack-native
          path: agent2-shuffle-supporter-preattack-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify read-only source-root Horror House declaration filter
        run: node --test tests/horror-house-root-audit.test.cjs tests/rank9-horror-house-nextturn-source-reply.test.cjs
      - name: Check Aichi exact card-resolution blockers
        run: node simulation/evaluation/aichi-pilot.cjs

      - name: Test native mandatory-option fallback and symmetric headless opt-in
        run: node --test tests/mandatory-option-policy.test.cjs

      - name: Verify native Field Blower mandatory mode and physical Stadium effect
        run: node --test tests/agent24-field-blower-native-choice.test.cjs

      - name: Verify native Lost Vacuum required cost and legal physical removal
        run: node --test tests/agent24-lost-vacuum-native-choice.test.cjs

      - name: Probe pinned optional C&C modal versus printed mandatory recovery
        run: node --test tests/agent24-cynthia-caitlin-native-choice.test.cjs

      - name: Verify authentic C&C source-play native-choice attribution
        run: node --test tests/agent24-cynthia-source-exposure.test.cjs
      - name: Census fixed source-rank6/rank24 C&C option and root outcomes
        if: ${{ inputs.agent24_cynthia_source_exposure }}
        run: node simulation/twinleaf/agent24-cynthia-source-exposure.cjs > agent24-cynthia-source-exposure.json
      - name: Archive every source C&C option arm and explicit absent opportunities
        if: ${{ always() && inputs.agent24_cynthia_source_exposure }}
        uses: actions/upload-artifact@v4
        with:
          name: agent24-cynthia-source-exposure
          path: agent24-cynthia-source-exposure.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify first native source C&C option fork and restoration
        run: node --test tests/agent24-cynthia-same-state-fork.test.cjs
      - name: Compare first genuine source-owned C&C null versus legal recovery on identical real prefixes
        if: ${{ inputs.agent24_cynthia_same_state_fork }}
        run: node simulation/twinleaf/agent24-cynthia-native-same-state-fork.cjs > agent24-cynthia-same-state-fork.json
      - name: Archive authentic C&C same-root causal modes and no-op controls
        if: ${{ always() && inputs.agent24_cynthia_same_state_fork }}
        uses: actions/upload-artifact@v4
        with:
          name: agent24-cynthia-same-state-fork
          path: agent24-cynthia-same-state-fork.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify native source G&H choice attribution
        run: node --test tests/agent24-mandatory-source-exposure.test.cjs
      - name: Compare real rank2 source modal null versus legal default on both physical seats
        if: ${{ inputs.rank2_mandatory_option_pair }}
        run: node simulation/twinleaf/agent24-mandatory-source-exposure.cjs > rank2-mandatory-option-source-pair.json
      - name: Archive source-dealt modal outcomes, including absent opportunities and caps
        if: ${{ always() && inputs.rank2_mandatory_option_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-mandatory-option-source-pair
          path: rank2-mandatory-option-source-pair.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify first real source G&H option-only fork restores native decoder
        run: node --test tests/agent24-live-source-gh-modal-fork.test.cjs
      - name: Compare the same authentic source-prefork roots and first corrected G&H mode
        if: ${{ inputs.rank2_live_gh_same_state_fork }}
        run: node simulation/twinleaf/agent24-live-source-gh-modal-fork.cjs > rank2-gh-native-same-state-fork.json
      - name: Archive genuine matched native G&H option forks and all negative outcomes
        if: ${{ always() && inputs.rank2_live_gh_same_state_fork }}
        uses: actions/upload-artifact@v4
        with:
          name: rank2-gh-native-same-state-fork
          path: rank2-gh-native-same-state-fork.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test optional prompt-integrity helper (pure CJS)
        run: node --test tests/prompt-integrity.test.cjs

      - name: Probe strict prompt validation during a seeded Aichi fixture
        run: node simulation/twinleaf/strict-prompt-smoke.cjs

      - name: Verify strict prompt mode is opt-in and forwarded to matchup runner
        run: node --test tests/test-aichi-field-benchmark.cjs

      - name: Check Forest Seal Stone printing census for published Aichi lists
        run: node --test tests/aichi-forest-seal-census.test.cjs

      - name: Reproduce and correct compiled 60-card ShuffleDeckPrompt validation
        run: node --test tests/prompt-integrity-pinned-shuffle.test.cjs

      - name: Probe strict prompts plus Forest Seal Stone opt-in and cleanup
        run: node simulation/twinleaf/forest-seal-opt-in-smoke.cjs

      - name: Reproduce ChooseCardsPrompt repeated-card source identity acceptance
        run: node --test tests/prompt-integrity-pinned-selection.test.cjs

      - name: Check opt-in ordering, Prize shuffle and hand-shuffle permutations
        run: node --test tests/prompt-integrity-pinned-permutations.test.cjs

      - name: Verify Prize selection has real Prize-zone ownership
        run: node --test tests/prompt-integrity-pinned-prizes.test.cjs

      - name: Verify Pokémon target-side, slot, and duplicate restrictions
        run: node --test tests/prompt-integrity-pinned-pokemon.test.cjs

      - name: Verify Energy transfers have physical source, targets and limits
        run: node --test tests/prompt-integrity-pinned-move-energy.test.cjs

      - name: Verify Energy selection catalog identity and physical uniqueness
        run: node --test tests/prompt-integrity-pinned-choose-energy.test.cjs

      - name: Print Battle Compressor post-selection lifecycle state
        run: node -e "const {probe}=require('./simulation/twinleaf/battle-compressor-zero-prompt.cjs'); console.log(JSON.stringify({pinned:probe(false,true),corrected:probe(true,true)},null,2));"

      - name: Verify Battle Compressor prompt fidelity after strict-prompt integration
        run: node --test tests/battle-compressor-minimum.test.cjs

      - name: Verify reversible paper minimum in actual headless match options
        run: node --test tests/battle-compressor-headless-opt-in.test.cjs

      - name: Verify source Battle Compressor observer isolates genuine Store dispatches
        run: node --test tests/battle-compressor-source-exposure.test.cjs

      - name: Verify read-only Battle Compressor Item valuation observation
        run: node --test tests/battle-compressor-item-tactic-score.test.cjs

      - name: Audit live Battle Compressor selections in paired Aichi source games
        if: ${{ inputs.battle_compressor_source_exposure }}
        run: node simulation/twinleaf/battle-compressor-source-exposure.cjs

      - name: Verify own-hand-only rank-8 Wally source decision predicate
        run: node --test tests/absol-rank8-wally-source-fork.test.cjs
      - name: Contrast source-dealt rank8 opponent turn2 Pass and Wally
        if: ${{ inputs.absol_rank8_wally_fork }}
        run: node simulation/twinleaf/absol-rank8-wally-source-fork.cjs > absol-rank8-wally-fork.json
      - name: Archive exact rank8 source Wally outcome
        if: ${{ always() && inputs.absol_rank8_wally_fork }}
        uses: actions/upload-artifact@v4
        with:
          name: absol-rank8-source-wally-fork
          path: absol-rank8-wally-fork.json
          if-no-files-found: warn

      - name: Four exact-source Absol/Garbodor diagnostic games in both physical seats
        if: ${{ inputs.absol_hardmatchup_probe }}
        run: node simulation/twinleaf/absol-hardmatchup-source-pilot.cjs > absol-hardmatchup-source-pilot.json
      - name: Archive hard-matchup source evidence
        if: ${{ inputs.absol_hardmatchup_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: absol-hardmatchup-source-pilot
          path: absol-hardmatchup-source-pilot.json
          retention-days: 14

      - name: Isolate authentic rank 11 first-turn resource and prompt decisions
        if: ${{ inputs.absol_rank11_firstturn_audit }}
        run: node simulation/twinleaf/absol-rank11-k1-source-audit.cjs > absol-rank11-firstturn-k1.json
      - name: Agent3 rank11 same-deal native VIP target comparison
        if: ${{ inputs.absol_rank11_firstturn_audit }}
        run: node simulation/evaluation/agent3-source-vip-k1-native-pair.cjs > agent3-source-vip-k1-native-pair.json
      - name: Archive Agent3 rank11 VIP policy pair including errors
        if: ${{ always() && inputs.absol_rank11_firstturn_audit }}
        uses: actions/upload-artifact@v4
        with:
          name: agent3-source-vip-k1-native-pair
          path: agent3-source-vip-k1-native-pair.json
          if-no-files-found: warn
          retention-days: 15
      - name: Archive actual first-turn rank 11 source choices
        if: ${{ inputs.absol_rank11_firstturn_audit }}
        uses: actions/upload-artifact@v4
        with:
          name: absol-rank11-firstturn-k1
          path: absol-rank11-firstturn-k1.json
          retention-days: 14

      - name: Probe real owner-hand Quick Ball pressure after selected New Moon copied attack
        if: ${{ inputs.rank11_turn49_quick_ball_fork }}
        run: node simulation/twinleaf/rank11-turn49-quick-ball-counterfactual.cjs > rank11-turn49-quick-ball-counterfactual.json
      - name: Record unchanged candidate own-hand and public board at late passes
        if: ${{ inputs.rank11_turn49_quick_ball_fork }}
        run: node simulation/twinleaf/rank11-turn50-pass-owner-audit.cjs > rank11-turn50-pass-owner-audit.json
      - name: Archive baseline replay and counterfactual source Store actions
        if: ${{ always() && inputs.rank11_turn49_quick_ball_fork }}
        uses: actions/upload-artifact@v4
        with:
          name: rank11-turn49-quick-ball-source-counterfactual
          path: |
            rank11-turn49-quick-ball-counterfactual.json
            rank11-turn50-pass-owner-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Execute one real candidate Perfection choice after source Quick Ball line
        if: ${{ inputs.rank11_turn50_perfection_reply_fork }}
        run: node simulation/twinleaf/rank11-turn50-perfection-reply-fork.cjs > rank11-turn50-perfection-reply-fork.json
      - name: Archive the single selected-seed candidate response
        if: ${{ always() && inputs.rank11_turn50_perfection_reply_fork }}
        uses: actions/upload-artifact@v4
        with:
          name: rank11-turn50-perfection-reply-counterfactual
          path: rank11-turn50-perfection-reply-fork.json
          retention-days: 14

      - name: Prove reversible illegal no-hand-lock intervention preserves GX and paper prototype
        if: ${{ inputs.rank9_horror_house_causal_fork }}
        run: node simulation/twinleaf/gengar-horror-house-no-lock-fork-contract.cjs > gengar-horror-house-no-lock-fork-contract.json
      - name: Contrast two selected native Horror House source roots against no-hand-lock counterfactual
        if: ${{ inputs.rank9_horror_house_causal_fork }}
        run: node simulation/twinleaf/rank9-horror-house-lock-causal-fork.cjs > rank9-horror-house-lock-causal-fork.json
      - name: Archive explicit rule-broken causal fork and staged mechanical contract
        if: ${{ always() && inputs.rank9_horror_house_causal_fork }}
        uses: actions/upload-artifact@v4
        with:
          name: rank9-horror-house-lock-causal-fork
          path: |
            gengar-horror-house-no-lock-fork-contract.json
            rank9-horror-house-lock-causal-fork.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe actual rank9 Horror House effect and next-turn opponent decisions
        if: ${{ inputs.rank9_horror_house_reply_probe }}
        run: node simulation/twinleaf/rank9-horror-house-nextturn-source-reply.cjs > rank9-horror-house-nextturn-source-reply.json
      - name: Archive fixed root-response and observational parity proof
        if: ${{ always() && inputs.rank9_horror_house_reply_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: rank9-horror-house-nextturn-source-reply
          path: rank9-horror-house-nextturn-source-reply.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe authentic rank9 Horror House root attack and printed-Energy zones
        if: ${{ inputs.rank9_horror_house_root_probe }}
        run: node simulation/twinleaf/rank9-horror-house-source-root-exposure.cjs > rank9-horror-house-source-root-exposure.json
      - name: Preserve all 16 prospectively registered source exposures and positive gate
        if: ${{ always() && inputs.rank9_horror_house_root_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: rank9-horror-house-root-source-exposure
          path: rank9-horror-house-source-root-exposure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe rank 11 own-hand Shopping Center opportunities in matched source games
        if: ${{ inputs.absol_rank11_shopping_observer }}
        run: node simulation/twinleaf/rank11-shopping-center-source-observer.cjs > rank11-shopping-source-observer.json
      - name: Archive matched rank 11 Shopping Center source states
        if: ${{ inputs.absol_rank11_shopping_observer }}
        uses: actions/upload-artifact@v4
        with:
          name: rank11-shopping-source-observer
          path: rank11-shopping-source-observer.json
          retention-days: 14
