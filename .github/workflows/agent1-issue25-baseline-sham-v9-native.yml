name: Agent1 issue25 baseline sham A-A native replay

on:
  workflow_dispatch:
    inputs:
      shuffle_only_aba:
        description: Run the numeric-shuffle-only Issue25 native A/B/A
        type: boolean
        required: false
        default: false
      wondertag_shuffle_held_aba:
        description: Run owner Wonder Tag yes versus decline with identical numeric shuffle in every A/B/A arm
        type: boolean
        required: false
        default: false
      common_v7_wondertag_v11:
        description: Run preregistered common-v7 owner Wonder Tag on same original eight
        type: boolean
        required: false
        default: false
      common_v7_wondertag_v12:
        description: Run innermost native owner Wonder Tag for same original eight
        type: boolean
        required: false
        default: false
      common_v7_radiant_v13:
        description: Run common-v12 with printed native Radiant optional decline
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  native-same-baseline-sham:
    if: ${{ inputs.shuffle_only_aba != true && inputs.wondertag_shuffle_held_aba != true && inputs.common_v7_wondertag_v11 != true && inputs.common_v7_wondertag_v12 != true && inputs.common_v7_radiant_v13 != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Probe Wonder Tag and Iron Thorns before-versus-after-Bench Ability lock
        run: node --test tests/agent1-wondertag-iron-thorns-entry-timing.native.test.cjs
      - name: Check existing Lele entry guard and owner handler compose in both seats
        run: node --test tests/agent1-wondertag-entry-hook-owner-policy-composition.native.test.cjs
      - name: Two exact registered same-opening baseline campaigns
        env:
          ISSUE25_SHAM_RECEIPT_DIR: artifacts/agent1-issue25-sham-v9
        run: node --test tests/agent1-issue25-baseline-sham-v9.native.test.cjs
      - name: Archive sanitized A-A outcome diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-issue25-sham-v9-${{ github.run_id }}
          path: artifacts/agent1-issue25-sham-v9/
          if-no-files-found: warn
          retention-days: 30

  issue25-shuffle-only-aba:
    if: ${{ inputs.shuffle_only_aba == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test shuffle-only intervention and common owner policy
        run: node --test tests/agent1-issue25-shuffle-validator-only-aba.test.cjs
      - name: Run matched native eight-deal A/B/A shuffle-only negative control
        env:
          AGENT1_SHUFFLE_ABA_DIR: artifacts/agent1-issue25-shuffle-only-aba
        run: node --test tests/agent1-issue25-shuffle-validator-only-aba.native.test.cjs
      - name: Preserve complete sanitized statuses and aborted/capped arms
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-issue25-shuffle-only-aba-${{ github.run_id }}
          path: artifacts/agent1-issue25-shuffle-only-aba/
          if-no-files-found: warn
          retention-days: 30

  issue25-wondertag-shuffle-held-aba:
    if: ${{ inputs.wondertag_shuffle_held_aba == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf gitlink
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify source-invariant shim and Wonder Tag policy selection
        run: node --test tests/agent1-issue25-wondertag-shuffle-held-aba.test.cjs tests/agent1-native-public-supporter-reveal-witness.test.cjs
      - name: Execute actual Store 24-attempt source-ranked A/B/A
        env:
          AGENT1_WONDERTAG_HELD_DIR: artifacts/agent1-issue25-wondertag-held-aba
        run: node --test tests/agent1-issue25-wondertag-shuffle-held-aba.native.test.cjs
      - name: Archive exact native receipt and all error/capped arms
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-issue25-wondertag-shuffle-held-${{ github.run_id }}
          path: artifacts/agent1-issue25-wondertag-held-aba/
          if-no-files-found: warn
          retention-days: 30

  issue25-common-v7-wondertag-v11:
    if: ${{ inputs.common_v7_wondertag_v11 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exactly pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile exact Twinleaf revision
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Pure common owner Wonder Tag composition, actor and fail-closed callback tests
        run: node --test tests/agent1-issue25-common-v7-wondertag-v11.test.cjs tests/agent1-wondertag-native-shuffle-completion.test.cjs tests/agent1-wondertag-registered-actor-witness.test.cjs
      - name: Run all 8 original same v7 printed sixties with generic Wonder Tag treatment
        env:
          AGENT1_ISSUE25_V11_OUTPUT_DIR: artifacts/agent1-issue25-v11-common-wondertag
        run: node --test tests/agent1-issue25-common-v7-wondertag-v11.native.test.cjs
      - name: Preserve complete source labels, every error or cap and full sanitized native roots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-v7-common-wondertag-v11-${{ github.run_id }}
          path: artifacts/agent1-issue25-v11-common-wondertag/
          if-no-files-found: warn
          retention-days: 30

  issue25-common-v7-wondertag-v12:
    if: ${{ inputs.common_v7_wondertag_v12 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact native engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Pure per-match owner prompt composition, provenance and failure gates
        run: node --test tests/agent1-issue25-common-v7-wondertag-v12.test.cjs tests/agent1-issue25-common-v7-wondertag-v11.test.cjs tests/agent1-wondertag-native-shuffle-completion.test.cjs
      - name: Eight genuine original v7 physical deals with newly innermost owner Wonder Tag
        env:
          AGENT1_ISSUE25_V12_OUTPUT_DIR: artifacts/agent1-issue25-v12-common-wondertag
        run: node --test tests/agent1-issue25-common-v7-wondertag-v12.native.test.cjs
      - name: Preserve all registered original roots, errors and owner audits
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-inner-owner-wondertag-v12-${{ github.run_id }}
          path: artifacts/agent1-issue25-v12-common-wondertag/
          if-no-files-found: warn
          retention-days: 30

  issue25-common-v12-radiant-v13:
    if: ${{ inputs.common_v7_radiant_v13 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Unit-test actual printed Radiant owner decision and native runner restoration
        run: node --test tests/agent1-issue25-common-v13-radiant-decline.test.cjs tests/agent1-issue25-common-v7-wondertag-v12.test.cjs tests/agent1-wondertag-native-shuffle-completion.test.cjs
      - name: Eight original native physical deals with both generic owner prompt handlers
        env:
          AGENT1_V13_OUTPUT_DIR: artifacts/agent1-v13-original-radiant
        run: node --test tests/agent1-issue25-common-v13-radiant-decline.native.test.cjs
      - name: Preserve every native trial, public root and optional-prompt settlement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-v13-original-radiant-${{ github.run_id }}
          path: artifacts/agent1-v13-original-radiant/
          if-no-files-found: warn
          retention-days: 30
