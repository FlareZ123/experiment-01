name: Agent1 issue25 baseline sham A-A native replay

on:
  workflow_dispatch:
    inputs:
      shuffle_only_aba:
        description: Run the numeric-shuffle-only Issue25 native A/B/A
        type: boolean
        required: false
        default: false
      wondertag_shuffle_held_aba:
        description: Run owner Wonder Tag yes versus decline with identical numeric shuffle in every A/B/A arm
        type: boolean
        required: false
        default: false
      common_v7_wondertag_v11:
        description: Run preregistered common-v7 owner Wonder Tag on same original eight
        type: boolean
        required: false
        default: false
      common_v7_wondertag_v12:
        description: Run innermost native owner Wonder Tag for same original eight
        type: boolean
        required: false
        default: false
      common_v7_radiant_v13:
        description: Run common-v12 with printed native Radiant optional decline
        type: boolean
        required: false
        default: false
      common_v13_horizon260_v14:
        description: Measure all original eight common-v13 native games to 260 action roots
        type: boolean
        required: false
        default: false
      common_v14_filch_v15:
        description: Run registered original-eight bilateral cautious Filch A/B/A at 260 roots
        type: boolean
        required: false
        default: false
      rank3_owner_deck_cause_audit:
        description: Audit frozen rank3/rank1 owner-deck cause and Mimikyu Copycat/Burrow A/B/A
        type: boolean
        required: false
        default: false
      forced_active_opening_screen:
        description: Run exact source-deck Basic and forced-low-HP opener analysis only
        type: boolean
        required: false
        default: false
      terminal_tiebreaker_native_admission:
        description: Read real pinned sudden-death Store terminal snapshot through paper admission gate
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  rank3-owner-deck-cause-audit:
    if: ${{ inputs.rank3_owner_deck_cause_audit == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf gitlink
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test read-only owner deck cause observer
        run: node --test tests/agent1-rank3-owner-deck-cause-audit.test.cjs
      - name: Replay frozen original rank3 versus rank1 physical deal
        env:
          AGENT1_RANK3_OWNER_DECK_CAUSE_DIR: artifacts/agent1-rank3-owner-deck-cause
        run: node --test tests/agent1-rank3-owner-deck-cause-audit.native.test.cjs
      - name: Preserve complete read-only deck dispatch receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank3-owner-deck-cause-${{ github.run_id }}
          path: artifacts/agent1-rank3-owner-deck-cause/
          if-no-files-found: warn
          retention-days: 30
      - name: Test Mimikyu Burrow Copycat tactic and headless opt-in
        run: node --test tests/mimikyu-burrow-copycat-policy.test.cjs
      - name: Replay frozen rank3 versus rank1 Copycat/Burrow A/B/A
        env:
          AGENT1_RANK3_COPYCAT_OUTPUT: artifacts/agent1-rank3-copycat-burrow
        run: node --test tests/agent1-rank3-copycat-burrow-aba.native.test.cjs
      - name: Preserve Copycat/Burrow A/B/A receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-rank3-copycat-burrow-${{ github.run_id }}
          path: artifacts/agent1-rank3-copycat-burrow/
          if-no-files-found: warn
          retention-days: 30

  aichi-forced-active-screen:
    if: ${{ inputs.forced_active_opening_screen == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact 29-source and six-candidate forced-Active opening screen
        run: node --test tests/agent1-aichi-forced-active-opener.test.cjs tests/agent1-rank26-six-candidate-root.test.cjs tests/agent1-rank26-active-denial-opening.test.cjs

  original-native-tiebreaker-terminal-admission:
    if: ${{ inputs.terminal_tiebreaker_native_admission == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf gitlink
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify actual native replay Store sudden-death epoch and fail-closed classifier
        run: node --test tests/agent1-terminal-tiebreaker-native-admission.test.cjs tests/agent1-terminal-ordinary-double-ko-admission.native.test.cjs

  native-same-baseline-sham:
    if: ${{ inputs.shuffle_only_aba != true && inputs.wondertag_shuffle_held_aba != true && inputs.common_v7_wondertag_v11 != true && inputs.common_v7_wondertag_v12 != true && inputs.common_v7_radiant_v13 != true && inputs.common_v13_horizon260_v14 != true && inputs.common_v14_filch_v15 != true && inputs.forced_active_opening_screen != true && inputs.terminal_tiebreaker_native_admission != true && inputs.rank3_owner_deck_cause_audit != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Probe Wonder Tag and Iron Thorns before-versus-after-Bench Ability lock
        run: node --test tests/agent1-wondertag-iron-thorns-entry-timing.native.test.cjs
      - name: Check existing Lele entry guard and owner handler compose in both seats
        run: node --test tests/agent1-wondertag-entry-hook-owner-policy-composition.native.test.cjs
      - name: Two exact registered same-opening baseline campaigns
        env:
          ISSUE25_SHAM_RECEIPT_DIR: artifacts/agent1-issue25-sham-v9
        run: node --test tests/agent1-issue25-baseline-sham-v9.native.test.cjs
      - name: Archive sanitized A-A outcome diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-issue25-sham-v9-${{ github.run_id }}
          path: artifacts/agent1-issue25-sham-v9/
          if-no-files-found: warn
          retention-days: 30

  issue25-shuffle-only-aba:
    if: ${{ inputs.shuffle_only_aba == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test shuffle-only intervention and common owner policy
        run: node --test tests/agent1-issue25-shuffle-validator-only-aba.test.cjs
      - name: Run matched native eight-deal A/B/A shuffle-only negative control
        env:
          AGENT1_SHUFFLE_ABA_DIR: artifacts/agent1-issue25-shuffle-only-aba
        run: node --test tests/agent1-issue25-shuffle-validator-only-aba.native.test.cjs
      - name: Preserve complete sanitized statuses and aborted/capped arms
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-issue25-shuffle-only-aba-${{ github.run_id }}
          path: artifacts/agent1-issue25-shuffle-only-aba/
          if-no-files-found: warn
          retention-days: 30

  issue25-wondertag-shuffle-held-aba:
    if: ${{ inputs.wondertag_shuffle_held_aba == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf gitlink
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify source-invariant shim and Wonder Tag policy selection
        run: node --test tests/agent1-issue25-wondertag-shuffle-held-aba.test.cjs tests/agent1-native-public-supporter-reveal-witness.test.cjs
      - name: Execute actual Store 24-attempt source-ranked A/B/A
        env:
          AGENT1_WONDERTAG_HELD_DIR: artifacts/agent1-issue25-wondertag-held-aba
        run: node --test tests/agent1-issue25-wondertag-shuffle-held-aba.native.test.cjs
      - name: Archive exact native receipt and all error/capped arms
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-issue25-wondertag-shuffle-held-${{ github.run_id }}
          path: artifacts/agent1-issue25-wondertag-held-aba/
          if-no-files-found: warn
          retention-days: 30

  issue25-common-v7-wondertag-v11:
    if: ${{ inputs.common_v7_wondertag_v11 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exactly pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile exact Twinleaf revision
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Pure common owner Wonder Tag composition, actor and fail-closed callback tests
        run: node --test tests/agent1-issue25-common-v7-wondertag-v11.test.cjs tests/agent1-wondertag-native-shuffle-completion.test.cjs tests/agent1-wondertag-registered-actor-witness.test.cjs
      - name: Run all 8 original same v7 printed sixties with generic Wonder Tag treatment
        env:
          AGENT1_ISSUE25_V11_OUTPUT_DIR: artifacts/agent1-issue25-v11-common-wondertag
        run: node --test tests/agent1-issue25-common-v7-wondertag-v11.native.test.cjs
      - name: Preserve complete source labels, every error or cap and full sanitized native roots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-v7-common-wondertag-v11-${{ github.run_id }}
          path: artifacts/agent1-issue25-v11-common-wondertag/
          if-no-files-found: warn
          retention-days: 30

  issue25-common-v7-wondertag-v12:
    if: ${{ inputs.common_v7_wondertag_v12 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact native engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Pure per-match owner prompt composition, provenance and failure gates
        run: node --test tests/agent1-issue25-common-v7-wondertag-v12.test.cjs tests/agent1-issue25-common-v7-wondertag-v11.test.cjs tests/agent1-wondertag-native-shuffle-completion.test.cjs tests/agent1-issue25-protected-wondertag-v10.test.cjs
      - name: Eight genuine original v7 physical deals with newly innermost owner Wonder Tag
        env:
          AGENT1_ISSUE25_V12_OUTPUT_DIR: artifacts/agent1-issue25-v12-common-wondertag
        run: node --test tests/agent1-issue25-common-v7-wondertag-v12.native.test.cjs
      - name: Preserve all registered original roots, errors and owner audits
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-inner-owner-wondertag-v12-${{ github.run_id }}
          path: artifacts/agent1-issue25-v12-common-wondertag/
          if-no-files-found: warn
          retention-days: 30

  issue25-common-v12-radiant-v13:
    if: ${{ inputs.common_v7_radiant_v13 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Unit-test actual printed Radiant owner decision and native runner restoration
        run: node --test tests/agent1-issue25-common-v13-radiant-decline.test.cjs tests/agent1-issue25-common-v7-wondertag-v12.test.cjs tests/agent1-wondertag-native-shuffle-completion.test.cjs
      - name: Eight original native physical deals with both generic owner prompt handlers
        env:
          AGENT1_V13_OUTPUT_DIR: artifacts/agent1-v13-original-radiant
        run: node --test tests/agent1-issue25-common-v13-radiant-decline.native.test.cjs
      - name: Preserve every native trial, public root and optional-prompt settlement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-v13-original-radiant-${{ github.run_id }}
          path: artifacts/agent1-v13-original-radiant/
          if-no-files-found: warn
          retention-days: 30

  issue25-v14-horizon260:
    if: ${{ inputs.common_v13_horizon260_v14 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Check only root-horizon override and frozen registered cohort
        run: node --test tests/agent1-issue25-common-v14-horizon260.test.cjs tests/agent1-issue25-common-v13-radiant-decline.test.cjs tests/agent1-v14-public-endstate-observer.test.cjs
      - name: Execute all original eight native games with unchanged common v13 policy at 260 roots
        env:
          AGENT1_V14_OUTPUT_DIR: artifacts/agent1-v14-native-horizon260
        run: node --test tests/agent1-issue25-common-v14-horizon260.native.test.cjs
      - name: Archive all accepted native roots and every original error and censor
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-v14-native-horizon260-${{ github.run_id }}
          path: artifacts/agent1-v14-native-horizon260/
          if-no-files-found: warn
          retention-days: 30

  issue25-v15-bilateral-filch-native:
    if: ${{ inputs.common_v14_filch_v15 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Check bilateral Filch owner action and exact native A/B/A provenance
        run: node --test tests/agent1-conservative-owner-filch.test.cjs tests/agent1-v15-bilateral-filch-conservation-aba.test.cjs tests/terminal-cause-evidence.test.cjs tests/agent1-terminal-paper-result-conflicts.test.cjs tests/agent1-terminal-tiebreaker-epoch.test.cjs
      - name: Execute 24 native original-eight A/B/A with single owner Filch difference
        env:
          AGENT1_V15_FILCH_ABA_DIR: artifacts/agent1-v15-bilateral-filch-aba
        run: node --test tests/agent1-v15-bilateral-filch-conservation-aba.native.test.cjs
      - name: Archive all registered 24 native original roots and outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent1-v15-bilateral-filch-aba-${{ github.run_id }}
          path: artifacts/agent1-v15-bilateral-filch-aba/
          if-no-files-found: warn
          retention-days: 30
