name: Agent41 rank6 original source grouped denial 24-seed census

on:
  workflow_dispatch:
    inputs:
      focused_native_eligibility:
        description: 'Run only the two frozen original source coheld canPlay arms'
        type: boolean
        required: false
        default: false
      focused_native_plumeria_choice:
        description: 'Native common chooser Plumeria fork for the exact original source physical deal'
        type: boolean
        required: false
        default: false
      focused_native_cost_threeway:
        description: 'Native same-deal control versus Plumeria versus free Team Flare coheld comparison'
        type: boolean
        required: false
        default: false
      frozen_profile_inspect:
        description: 'Inspect source closure of the proposed fixed-policy development profile without compiling Twinleaf'
        type: boolean
        required: false
        default: false
      frozen_profile_v2_inspect:
        description: 'Inspect single public-context Energy treatment profile before native execution'
        type: boolean
        required: false
        default: false
      frozen_profile_v2_run:
        description: 'Run 32 same-seed native policy treatment arms with symmetric public-context Energy'
        type: boolean
        required: false
        default: false
      frozen_profile_prompt_portfolio_run:
        description: 'Run full frozen original 32-physical-deal v2 baseline with a separate versioned paper prompt dispatch boundary'
        type: boolean
        required: false
        default: false
      frozen_profile_run:
        description: 'Run the frozen rank6/11 original-source two-seat 32-arm development comparison'
        type: boolean
        required: false
        default: false
      nine_ranks_native_scout:
        description: 'Run 36 unscreened original nine-rank source Store development arms'
        type: boolean
        required: false
        default: false
      nine_ranks_inspect:
        description: 'Preflight immutable 18-seed nine-rank registration without native compilation'
        type: boolean
        required: false
        default: false
      focused_native_rank21_tool:
        description: 'Run original rank21 Tool target source Store comparison, retrospective, unqualified'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  original-rank6-denial-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen physical source-deal registration and failure accounting
        run: node --test tests/agent41-nine-ready-ranks-native-scout.test.cjs tests/agent41-frozen-bilateral-development-v2.test.cjs tests/agent41-frozen-bilateral-evidence-matrix.test.cjs tests/agent41-runtime-research-module-attestation.test.cjs tests/agent41-frozen-bilateral-development-v1.test.cjs tests/agent41-coheld-positive-witness-retention.test.cjs tests/agent41-native-coheld-denial-canplay.test.cjs tests/agent41-plumeria-root-physical-witness.test.cjs tests/agent41-plumeria-public-ledger-causal-prefix.test.cjs tests/agent41-coheld-supporter-zero-payment-arbiter.test.cjs tests/agent41-native-flare-same-root-prompt.test.cjs tests/agent41-rank6-grouped-denial-source-panel.test.cjs tests/agent7-same-root-independent-opportunity.test.cjs tests/agent41-bilateral-v2-development.test.cjs tests/agent41-paper-prompt-contract-portfolio.test.cjs tests/agent5-owner-root-slice.test.cjs tests/agent34-actor-only-root-policy.test.cjs
      - name: Inspect one transitive source profile before native execution
        if: ${{ inputs.frozen_profile_inspect || inputs.frozen_profile_run }}
        run: node simulation/evaluation/agent41-frozen-bilateral-development-v1.cjs --inspect-only
      - name: Inspect single v2 public-context Energy profile without native execution
        if: ${{ inputs.frozen_profile_v2_inspect || inputs.frozen_profile_v2_run }}
        run: node simulation/evaluation/agent41-frozen-bilateral-development-v2.cjs --inspect-only
      - name: Inspect nine original-ready ranks with 18 unscreened registered seeds
        if: ${{ inputs.nine_ranks_inspect || inputs.nine_ranks_native_scout }}
        run: node simulation/evaluation/agent41-nine-ready-ranks-native-scout.cjs --inspect-only
      - name: Checkout exactly pinned original Store
        if: ${{ !inputs.frozen_profile_inspect && !inputs.frozen_profile_v2_inspect && !inputs.nine_ranks_inspect }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native server
        if: ${{ !inputs.frozen_profile_inspect && !inputs.frozen_profile_v2_inspect && !inputs.nine_ranks_inspect }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        if: ${{ !inputs.frozen_profile_inspect && !inputs.frozen_profile_v2_inspect && !inputs.nine_ranks_inspect }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all 48 preregistered source 60 game-development arms without selection
        if: ${{ !inputs.focused_native_eligibility && !inputs.focused_native_rank21_tool && !inputs.focused_native_plumeria_choice && !inputs.focused_native_cost_threeway && !inputs.frozen_profile_inspect && !inputs.frozen_profile_run && !inputs.frozen_profile_v2_inspect && !inputs.frozen_profile_v2_run && !inputs.frozen_profile_prompt_portfolio_run && !inputs.nine_ranks_inspect && !inputs.nine_ranks_native_scout }}
        run: node simulation/evaluation/agent41-rank6-grouped-denial-source-panel.cjs > agent41-rank6-denial-source-raw.json
      - name: Preserve compact true-root and distinct-seed counts
        if: ${{ !inputs.focused_native_eligibility && !inputs.focused_native_rank21_tool && !inputs.focused_native_plumeria_choice && !inputs.focused_native_cost_threeway && !inputs.frozen_profile_inspect && !inputs.frozen_profile_run && !inputs.frozen_profile_v2_inspect && !inputs.frozen_profile_v2_run && !inputs.nine_ranks_inspect && !inputs.nine_ranks_native_scout }}
        run: node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('agent41-rank6-denial-source-raw.json','utf8'));fs.writeFileSync('agent41-rank6-denial-source-summary.json',JSON.stringify(x.summary,null,2)+'\\n');console.log(JSON.stringify({scheduled:x.summary.scheduled,uniqueSourceSeedGroups:x.summary.uniqueSourceSeedGroups,resultsWithNativeActorAudit:x.summary.resultsWithNativeActorAudit,ownerRoots:x.summary.ownerRoots,plumeriaOwnerRoots:x.summary.plumeriaOwnerRoots,coheldFlareOwnerRoots:x.summary.coheldFlareOwnerRoots,bothSupporterOffersRoots:x.summary.bothSupporterOffersRoots,distinctSeedGroupsWithCoheldFlare:x.summary.distinctSeedGroupsWithCoheldFlare,competitiveQualifiedGames:x.summary.competitiveQualifiedGames}));"
      - name: Exact early source-owned coheld native canPlay, original Store read-only
        if: ${{ inputs.focused_native_eligibility }}
        run: node simulation/evaluation/agent41-native-source-rank6-coheld-canplay.cjs > agent41-focused-source-native-canplay.json
      - name: Summarize focused original-source native canPlay without inventing settled effects
        if: ${{ always() && inputs.focused_native_eligibility }}
        run: node -e "const fs=require('node:fs');const p='agent41-focused-source-native-canplay.json';if(!fs.existsSync(p)){console.log('FOCUSED_NATIVE_REPORT_MISSING');process.exitCode=1;}else{const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log('FOCUSED_NATIVE_COHELD',JSON.stringify({schema:r.schema,validation:r.validation,competitiveQualifiedGames:r.competitiveQualifiedGames,rows:r.rows.map(x=>({trial:x.trial,sourceSeat:x.sourceSeat,status:x.nativeStatus,nativeCoheldOwnerRoots:x.naturalCoheldRootCount,bothNativePlayableRoots:x.bothNativeCardCanPlayRoots,first:x.firstAuthenticCoheldRoot?{turn:x.firstAuthenticCoheldRoot.globalTurn,rootOrdinal:x.firstAuthenticCoheldRoot.rootOrdinal,plumeria:x.firstAuthenticCoheldRoot.plumeria,teamFlare:x.firstAuthenticCoheldRoot.teamFlare,bothNativePlayable:x.firstAuthenticCoheldRoot.bothHaveNativePlayablePhysicalCopy}:null}))}));if(r.validation?.passed!==true)process.exitCode=1;}"
      - name: Run frozen original rank6 common-owner same-root native Plumeria development fork
        if: ${{ inputs.focused_native_plumeria_choice }}
        env:
          AGENT4_NATIVE_PAYMENT_RECEIPT_DEV: 'true'
        run: node simulation/evaluation/agent41-rank6-native-plumeria-common-choice-pair.cjs > agent41-rank6-same-root-native-plumeria.json
      - name: Summarize original native same-root choice and physically settled prompts
        if: ${{ always() && inputs.focused_native_plumeria_choice }}
        run: node -e "const fs=require('node:fs');const p='agent41-rank6-same-root-native-plumeria.json';if(!fs.existsSync(p)){console.log('NATIVE_PLUMERIA_REPORT_MISSING');process.exitCode=1;}else{const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log('ORIGINAL_SAME_ROOT_PLUMERIA',JSON.stringify({validation:r.validation,attempts:r.actualNativeAttempts,pairs:r.paired.map(x=>({id:x.id,physicalMatched:x.sameInitialSourceAndFullPhysicalDeal,firstPublicDeviation:x.publicFirstDeviation,control:x.control?{status:x.control.status,changed:x.control.changedSameRootDecisions}:null,treatment:x.treatment?{status:x.treatment.status,error:x.treatment.error,nativeStoreCauseStack:x.treatment.nativeStoreCauseStack,nativeAbortEvidence:x.treatment.nativeAbortEvidence,selected:x.treatment.selectedPlumeriaOwnerRoots,accepted:x.treatment.acceptedPlumeria,adopted:x.treatment.adoptedActorRootActions,physicalOwnerPayments:x.treatment.physicalOwnerPayments,settled:x.treatment.settledPhysicalEnergyDiscards,unresolved:x.treatment.unresolvedNativeChains,settlementSamples:x.treatment.boundedSettlementSamples}:null})),competitiveQualifiedGames:r.competitiveQualifiedGames}));if(r.validation?.passed!==true)process.exitCode=1;}"
      - name: Run original same-deal three-way native Supporter cost-aware fork
        if: ${{ inputs.focused_native_cost_threeway }}
        env:
          AGENT4_NATIVE_PAYMENT_RECEIPT_DEV: 'true'
        run: node simulation/evaluation/agent41-rank6-native-coheld-supporter-cost-threeway.cjs > agent41-native-coheld-supporter-cost-threeway.json
      - name: Log exact original physical three-way active-energy settlement and followthrough
        if: ${{ always() && inputs.focused_native_cost_threeway }}
        run: node -e "const fs=require('node:fs');const p='agent41-native-coheld-supporter-cost-threeway.json';if(!fs.existsSync(p)){console.log('COHELD_COST_REPORT_MISSING');process.exitCode=1;}else{const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log('ORIGINAL_SAME_ROOT_COST_THREEWAY',JSON.stringify({validation:r.validation,attempts:r.attemptedOriginalStoreArms,pairs:r.pairRows.map(x=>({id:x.id,physicalMatched:x.sameFullNativeDeal,controlStatus:x.control?.status,paidStatus:x.plumeria?.status,freeStatus:x.costAware?.status,freeError:x.costAware?.error,freeNativeStack:x.costAware?.nativeStoreCauseStack,controlToPaid:x.controlToPlumeria?.firstTreatmentDeviation,controlToFree:x.controlToFreeFlare?.firstTreatmentDeviation,paidToFree:x.paidToFreeFlare?.firstTreatmentDeviation,paidPromptSettlements:x.plumeria?.settledPhysicalEnergyDiscards,paidCosts:x.plumeria?.physicalOwnerPayments,freeChosen:x.costAware?.selectedFlareOwnerRoots,freeAccepted:x.costAware?.acceptedFlare,freeSettled:x.costAware?.physicallySettledFlareEnergy,freePrompts:x.costAware?.nativeFlareReceipts,freeOpponentReply:x.controlToFreeFlare?.firstOpposingCandidateContinuation,freeLaterPlumeria:x.costAware?.selectedPlumeriaOwnerRoots})),qualified:r.competitivelyQualifiedGames}));if(r.validation?.passed!==true)process.exitCode=1;}"
      - name: Execute a single pinned two-seat rank6/rank11 source development policy
        if: ${{ inputs.frozen_profile_run }}
        run: node simulation/evaluation/agent41-frozen-bilateral-development-v1.cjs > agent41-frozen-bilateral-development-v1-native.json
      - name: Preserve failure-inclusive 32-arm matchup and physical-gate matrix
        if: ${{ inputs.frozen_profile_run }}
        run: node simulation/evaluation/agent41-frozen-bilateral-evidence-matrix.cjs agent41-frozen-bilateral-development-v1-native.json > agent41-frozen-bilateral-matrix-v1.json
      - name: Classify complete native frozen-profile attempts without game-win promotion
        if: ${{ always() && inputs.frozen_profile_run }}
        run: node -e "const fs=require('node:fs');const p='agent41-frozen-bilateral-development-v1-native.json';if(!fs.existsSync(p)){console.log('FROZEN_PROFILE_NATIVE_REPORT_MISSING');process.exitCode=1;}else{const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log('FROZEN_BILATERAL_DEVELOPMENT',JSON.stringify({version:r.version,profileHash:r.provenance.profileGitBlobSha,closure:r.provenance.sourceClosureSha256,attempted:r.attempted,complete:r.attemptedComplete,statuses:r.statuses,nativeSetupCoin:r.nativeSetupCoinAndFirstDrawEvidence?.byStatus,runtimeModules:r.runtimeResearchAttestation?.byStatus,competitiveQualifiedGames:r.competitiveQualifiedGames}));if(!r.attemptedComplete)process.exitCode=1;}"
      - name: Run symmetric public-context Energy development treatment on original 32 seeds
        if: ${{ inputs.frozen_profile_v2_run }}
        run: node simulation/evaluation/agent41-frozen-bilateral-development-v2.cjs > agent41-frozen-bilateral-development-v2-native.json
      - name: Preserve all 32 treatment attempts in independent development matrix
        if: ${{ inputs.frozen_profile_v2_run }}
        run: node simulation/evaluation/agent41-frozen-bilateral-evidence-matrix.cjs agent41-frozen-bilateral-development-v2-native.json > agent41-frozen-bilateral-matrix-v2.json
      - name: Report native source pressure and failure-inclusive v2 outcome
        if: ${{ always() && inputs.frozen_profile_v2_run }}
        run: node -e "const fs=require('node:fs');const p='agent41-frozen-bilateral-matrix-v2.json';if(!fs.existsSync(p)){console.log('FROZEN_V2_MATRIX_MISSING');process.exitCode=1;}else{const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log('FROZEN_V2_POLICY_TREATMENT',JSON.stringify({attempts:r.preservedAttemptRows,complete:r.allAttemptRowsPresent,rank6SourceAttacks:r.byArm.filter(x=>x.rank===6).reduce((n,x)=>n+x.sourceAttackDeclarations,0),rank11SourceAttacks:r.byArm.filter(x=>x.rank===11).reduce((n,x)=>n+x.sourceAttackDeclarations,0),statuses:r.nativeOutcomes,physical:r.physicalIntegrityOutcomes,coin:r.nativeCoinEvidence,competitiveQualifiedGames:r.competitiveQualifiedGames}));if(!r.allAttemptRowsPresent)process.exitCode=1;}"
      - name: Execute frozen original v2 same-deal paper prompt contract portfolio
        if: ${{ inputs.frozen_profile_prompt_portfolio_run }}
        run: node simulation/evaluation/agent41-frozen-v2-paper-contract-portfolio.cjs > agent41-frozen-v2-paper-contract-portfolio-native.json
      - name: Preserve paper prompt family denominators, preflight and every original native attempt
        if: ${{ always() && inputs.frozen_profile_prompt_portfolio_run }}
        run: node -e "const fs=require('node:fs');const p='agent41-frozen-v2-paper-contract-portfolio-native.json';if(!fs.existsSync(p)){console.log('PAPER_CONTRACT_PORTFOLIO_MISSING');process.exitCode=1;}else{const x=JSON.parse(fs.readFileSync(p,'utf8'));console.log('PAPER_CONTRACT_PORTFOLIO',JSON.stringify({attempts:x.native.attempted,physical:x.native.statuses,trialBinding:x.nativeTrialPromptCountBinding.allCountsMatched,guard:x.paperPromptPortfolio.statusCounts,families:x.paperPromptPortfolio.byFamily,competitiveQualifiedGames:x.competitiveQualifiedGames}));if(x.native.attempted!==32||!x.nativeTrialPromptCountBinding.allCountsMatched)process.exitCode=1;}"
      - name: Run all 36 exact original nine-rank unscreened native development arms
        if: ${{ inputs.nine_ranks_native_scout }}
        run: node simulation/evaluation/agent41-nine-ready-ranks-native-scout.cjs > agent41-nine-ready-ranks-native-scout.json
      - name: Preserve compact complete 36-arm nine-rank development matrix
        if: ${{ inputs.nine_ranks_native_scout }}
        run: node simulation/evaluation/agent41-frozen-bilateral-evidence-matrix.cjs agent41-nine-ready-ranks-native-scout.json > agent41-nine-ready-ranks-matrix.json
      - name: Log failure-inclusive nine-rank source coverage
        if: ${{ always() && inputs.nine_ranks_native_scout }}
        run: node -e "const fs=require('node:fs');const p='agent41-nine-ready-ranks-matrix.json';if(!fs.existsSync(p)){console.log('NINE_RANK_MATRIX_MISSING');process.exitCode=1;}else{const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log('NINE_RANK_NATIVE',JSON.stringify({attempts:r.preservedAttemptRows,complete:r.allAttemptRowsPresent,statuses:r.nativeOutcomes,physical:r.physicalIntegrityOutcomes,coins:r.nativeCoinEvidence,byRank:r.byArm.reduce((a,x)=>(a[x.rank]??={arms:0,attacks:0}),a[x.rank].arms++,a[x.rank].attacks+=x.sourceAttackDeclarations,a),{}),competitiveQualifiedGames:r.competitiveQualifiedGames}));if(!r.allAttemptRowsPresent)process.exitCode=1;}"
      - name: Run exact original rank21 native Tool action recipient comparison
        if: ${{ inputs.focused_native_rank21_tool }}
        run: node simulation/evaluation/agent41-rank21-native-tool-target-pair.cjs > agent41-rank21-tool-target-raw.json
      - name: Retain truthful original-source paired Tool settlement status
        if: ${{ inputs.focused_native_rank21_tool }}
        run: node -e "const x=require('./agent41-rank21-tool-target-raw.json');console.log(JSON.stringify({sourceRank:x.summary.sourceRank,seed:x.summary.sourceSeed,measuredArms:x.summary.measuredArms,byCandidate:x.summary.byCandidate,nativeToolAcceptedTotal:x.summary.nativeToolAcceptedTotal,competitiveQualifiedGames:x.summary.competitiveQualifiedGames},null,2))"
      - name: Archive every attempted source seed including native failure and censor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent41-rank6-grouped-denial-48-native-arm-census
          path: |
            agent41-rank6-denial-source-raw.json
            agent41-rank6-denial-source-summary.json
            agent41-focused-source-native-canplay.json
            agent41-rank6-same-root-native-plumeria.json
            agent41-native-coheld-supporter-cost-threeway.json
            agent41-rank21-tool-target-raw.json
            agent41-frozen-bilateral-development-v1-native.json
            agent41-frozen-bilateral-matrix-v1.json
            agent41-frozen-bilateral-development-v2-native.json
            agent41-frozen-bilateral-matrix-v2.json
            agent41-frozen-v2-paper-contract-portfolio-native.json
            agent41-nine-ready-ranks-native-scout.json
            agent41-nine-ready-ranks-matrix.json
          if-no-files-found: warn
          retention-days: 14
