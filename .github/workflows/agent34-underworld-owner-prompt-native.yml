name: Agent 34 pinned native Underworld owner Energy-prompt regression

on:
  workflow_dispatch:
    inputs:
      agent42_v3_reply_extension_v2:
        description: Registered v2 intact two-candidate original rank1 A-seat 240-root A/B/A source reply
        type: boolean
        default: false
      agent42_v3_reply_extension:
        description: Frozen historical rank1 source paid Max Geist original physical opponent first reply under 240-root A/B/A
        type: boolean
        default: false
      agent42_v3_transport:
        description: Historical rank1 already-positive Float Stone seed in frozen selected-v3 combined policy, four contexts x A/B/A
        type: boolean
        default: false
      crossrank_floatstone:
        description: Preregistered rank5+11 source original versus fixed candidate Float Stone A/B
        type: boolean
        default: false
      heldout_floatstone:
        description: Pre-registered eight new both-seat original rank1 Float Stone seed groups
        type: boolean
        default: false
      posthoc_floatstone:
        description: Two previously observed rank1 source B-seat Float Stone rescue pairs
        type: boolean
        default: false
      posthoc_rank1:
        description: Retrospective owner typed prompt rank1 development
        type: boolean
        default: false
      posthoc_active_funding:
        description: Retrospective Active Psychic priority on the same 16 historical pairs
        type: boolean
        default: false
      heldout_active_funding:
        description: Preregistered 16 unseen two-seat rank1 seed groups, 64 native attempts
        type: boolean
        default: false
      heldout_bench_recipient:
        description: Preregistered 16 unseen rank1 groups, 64 native prompt-recipient attempts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-stamped-owner-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify pure source evidence integrity and owner-typed prompt
        run: node --test tests/agent34-fresh-underworld-abort-pair-audit.test.cjs tests/agent34-actor-typed-energy-prompt.test.cjs tests/agent31-shadow-rider-funded-bench-floatstone.test.cjs tests/agent31-retreat-same-printing-physical-witness.test.cjs
      - name: Independent conversion accounting pure unit regressions
        run: node --test tests/agent34-underworld-native-attack-conversion-audit.test.cjs tests/agent34-underworld-active-funding-priority.test.cjs tests/agent34-owner-psychic-bench-recipient.test.cjs tests/agent34-rank1-fog-crystal-recovery-gap.test.cjs
      - name: Install exact pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile exact pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify actual Store both-seat paper-paid Underworld recipient and draw
        run: node --test tests/agent34-actor-typed-energy-prompt.native.test.cjs tests/agent31-shadow-rider-funded-bench-floatstone.native.test.cjs
      - name: Validate historical natural original rank1 selected-v3 transport registration
        if: ${{ inputs.agent42_v3_transport }}
        run: |
          node --test tests/agent42-selected-v3-known-witness-transport.test.cjs
          node simulation/evaluation/agent42-selected-v3-known-witness-transport.cjs --preflight
      - name: Execute four original rank1 both-seat fixed60 contexts under selected-v3 A/B/A
        if: ${{ inputs.agent42_v3_transport }}
        run: node simulation/evaluation/agent42-selected-v3-known-witness-transport.cjs
      - name: Preserve 12 genuine original-source attempted traces including aborts and unchanged roots
        if: ${{ always() && inputs.agent42_v3_transport }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-selected-v3-known-witness-retrospective-12
          path: agent42-selected-v3-known-witness-transport-native-12.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate 240-root historical source-paid opponent reply preregistration and false-positive tests
        if: ${{ inputs.agent42_v3_reply_extension }}
        run: |
          node --test tests/agent42-v3-witness-opponent-reply-extension.test.cjs
          node simulation/evaluation/agent42-selected-v3-known-witness-opponent-reply-extension.cjs --preflight
      - name: Continue physical source witness through first actual opponent reply with identical both-seat decision policy
        if: ${{ inputs.agent42_v3_reply_extension }}
        run: node simulation/evaluation/agent42-selected-v3-known-witness-opponent-reply-extension.cjs
      - name: Preserve three 240-root A/B/A native attempts, physical source and real opponent action
        if: ${{ always() && inputs.agent42_v3_reply_extension }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-selected-v3-240root-source-opponent-reply-3
          path: agent42-selected-v3-known-witness-opponent-reply-240root-3attempts.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate frozen v2 two-candidate source reply action-cap extension
        if: ${{ inputs.agent42_v3_reply_extension_v2 }}
        run: |
          node --test tests/agent42-v3-known-witness-reply-v2.test.cjs
          node simulation/evaluation/agent42-v3-known-witness-reply-v2.cjs --preflight
      - name: Execute complete v2 original rank1 two-candidate source with 240-root A/B/A after genuine paid Max Geist
        if: ${{ inputs.agent42_v3_reply_extension_v2 }}
        run: node simulation/evaluation/agent42-v3-known-witness-reply-v2.cjs
      - name: Retain complete v2 two-candidate A/B/A 240-root source and opponent native traces
        if: ${{ always() && inputs.agent42_v3_reply_extension_v2 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-selected-v3-native-240root-reply-v2-six
          path: agent42-v3-known-witness-240root-reply-six-native.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preregistered rank5 and11 same-deal Float Stone portability A/B
        if: ${{ inputs.crossrank_floatstone }}
        env:
          AGENT31_CROSSRANK_FLOATSTONE_OUTPUT: agent31-crossrank-floatstone.json
        run: node simulation/evaluation/agent31-crossrank5-11-floatstone-transfer.cjs
      - name: Archive rank5 and11 source policy transfer raw evidence
        if: ${{ always() && inputs.crossrank_floatstone }}
        uses: actions/upload-artifact@v4
        with:
          name: agent31-rank5-rank11-crossrank-floatstone
          path: agent31-crossrank-floatstone.json
          if-no-files-found: warn
          retention-days: 30
      - name: Held-out rank1 Float Stone preregistration and paired native A/B
        if: ${{ inputs.heldout_floatstone }}
        env:
          AGENT31_HELDOUT_FLOATSTONE_OUTPUT: agent31-rank1-heldout-floatstone.json
        run: node simulation/evaluation/agent31-rank1-heldout-floatstone-native-pair.cjs
      - name: Archive raw held-out rank1 Float Stone pairs even on native failure
        if: ${{ always() && inputs.heldout_floatstone }}
        uses: actions/upload-artifact@v4
        with:
          name: agent31-heldout-rank1-floatstone-pairs
          path: agent31-rank1-heldout-floatstone.json
          if-no-files-found: warn
          retention-days: 30
      - name: Original rank1 Float Stone rescue source B-seat retrospective
        if: ${{ inputs.posthoc_floatstone }}
        env:
          AGENT31_FLOAT_STONE_PAIR_OUTPUT: agent31-rank1-floatstone-retro.json
        run: node simulation/evaluation/agent31-underworld-floatstone-original-pair.cjs
      - name: Preserve original rank1 Float Stone pair raw evidence even on failure
        if: ${{ always() && inputs.posthoc_floatstone }}
        uses: actions/upload-artifact@v4
        with:
          name: agent31-original-rank1-floatstone-retrospective
          path: agent31-rank1-floatstone-retro.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retrospective rank1 source prompt paired native replay
        if: ${{ inputs.posthoc_rank1 }}
        env:
          AGENT34_OWNER_UNDERWORLD_POSTHOC_OUTPUT: agent34-underworld-owner-posthoc.json
        run: node simulation/evaluation/agent34-rank1-underworld-owner-prompt-posthoc-development.cjs
      - name: Audit real native source attack conversion
        if: ${{ inputs.posthoc_rank1 }}
        run: node simulation/evaluation/agent34-underworld-native-attack-conversion-report.cjs
      - name: Retrospective original-source Active Psychic contention pair
        if: ${{ inputs.posthoc_active_funding }}
        env:
          AGENT34_ACTIVE_PRIORITY_OUTPUT: agent34-underworld-active-funding-posthoc.json
        run: node simulation/evaluation/agent34-rank1-active-funding-posthoc-development.cjs
      - name: Preserve Active funding retrospective native raw records
        if: ${{ inputs.posthoc_active_funding }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-underworld-active-funding-posthoc-rank1
          path: agent34-underworld-active-funding-posthoc.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate immutable held-out source trial registration
        if: ${{ inputs.heldout_active_funding }}
        run: node simulation/evaluation/agent34-rank1-heldout-active-funding-native-pair.cjs --preflight
      - name: Run 16 fresh registered seed groups across both native seats
        if: ${{ inputs.heldout_active_funding }}
        env:
          AGENT34_HELDOUT_PRIORITY_OUTPUT: agent34-rank1-heldout-active-funding-native.json
        run: node simulation/evaluation/agent34-rank1-heldout-active-funding-native-pair.cjs
      - name: Preserve every held-out native attempt and complete source trial
        if: ${{ inputs.heldout_active_funding }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-rank1-heldout-active-funding-v1
          path: agent34-rank1-heldout-active-funding-native.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify untouched preregistered owner Psychic Bench recipient schedule
        if: ${{ inputs.heldout_bench_recipient }}
        run: node simulation/evaluation/agent34-rank1-heldout-psychic-recipient-native-pair.cjs --preflight
      - name: Compare public printed-attack-gap Bench recipient native results
        if: ${{ inputs.heldout_bench_recipient }}
        env:
          AGENT34_HELDOUT_RECIPIENT_OUTPUT: agent34-rank1-heldout-psychic-recipient-native.json
        run: node simulation/evaluation/agent34-rank1-heldout-psychic-recipient-native-pair.cjs
      - name: Preserve all held-out printed-recipient native attempts
        if: ${{ inputs.heldout_bench_recipient }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-rank1-heldout-bench-recipient-v1
          path: agent34-rank1-heldout-psychic-recipient-native.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve matched historical native raw records
        if: ${{ inputs.posthoc_rank1 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-underworld-owner-posthoc-rank1
          path: agent34-underworld-owner-posthoc.json
          if-no-files-found: warn
          retention-days: 30
