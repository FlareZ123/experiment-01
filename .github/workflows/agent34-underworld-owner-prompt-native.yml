name: Agent 34 pinned native Underworld owner Energy-prompt regression

on:
  workflow_dispatch:
    inputs:
      posthoc_rank1:
        description: Retrospective owner typed prompt rank1 development
        type: boolean
        default: false
      posthoc_active_funding:
        description: Retrospective Active Psychic priority on the same 16 historical pairs
        type: boolean
        default: false
      heldout_active_funding:
        description: Preregistered 16 unseen two-seat rank1 seed groups, 64 native attempts
        type: boolean
        default: false
      heldout_bench_recipient:
        description: Preregistered 16 unseen rank1 groups, 64 native prompt-recipient attempts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-stamped-owner-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify pure source evidence integrity and owner-typed prompt
        run: node --test tests/agent34-fresh-underworld-abort-pair-audit.test.cjs tests/agent34-actor-typed-energy-prompt.test.cjs tests/agent31-shadow-rider-funded-bench-floatstone.test.cjs
      - name: Independent conversion accounting pure unit regressions
        run: node --test tests/agent34-underworld-native-attack-conversion-audit.test.cjs tests/agent34-underworld-active-funding-priority.test.cjs tests/agent34-owner-psychic-bench-recipient.test.cjs tests/agent34-rank1-fog-crystal-recovery-gap.test.cjs
      - name: Install exact pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile exact pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify actual Store both-seat paper-paid Underworld recipient and draw
        run: node --test tests/agent34-actor-typed-energy-prompt.native.test.cjs
      - name: Retrospective rank1 source prompt paired native replay
        if: ${{ inputs.posthoc_rank1 }}
        env:
          AGENT34_OWNER_UNDERWORLD_POSTHOC_OUTPUT: agent34-underworld-owner-posthoc.json
        run: node simulation/evaluation/agent34-rank1-underworld-owner-prompt-posthoc-development.cjs
      - name: Audit real native source attack conversion
        if: ${{ inputs.posthoc_rank1 }}
        run: node simulation/evaluation/agent34-underworld-native-attack-conversion-report.cjs
      - name: Retrospective original-source Active Psychic contention pair
        if: ${{ inputs.posthoc_active_funding }}
        env:
          AGENT34_ACTIVE_PRIORITY_OUTPUT: agent34-underworld-active-funding-posthoc.json
        run: node simulation/evaluation/agent34-rank1-active-funding-posthoc-development.cjs
      - name: Preserve Active funding retrospective native raw records
        if: ${{ inputs.posthoc_active_funding }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-underworld-active-funding-posthoc-rank1
          path: agent34-underworld-active-funding-posthoc.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate immutable held-out source trial registration
        if: ${{ inputs.heldout_active_funding }}
        run: node simulation/evaluation/agent34-rank1-heldout-active-funding-native-pair.cjs --preflight
      - name: Run 16 fresh registered seed groups across both native seats
        if: ${{ inputs.heldout_active_funding }}
        env:
          AGENT34_HELDOUT_PRIORITY_OUTPUT: agent34-rank1-heldout-active-funding-native.json
        run: node simulation/evaluation/agent34-rank1-heldout-active-funding-native-pair.cjs
      - name: Preserve every held-out native attempt and complete source trial
        if: ${{ inputs.heldout_active_funding }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-rank1-heldout-active-funding-v1
          path: agent34-rank1-heldout-active-funding-native.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify untouched preregistered owner Psychic Bench recipient schedule
        if: ${{ inputs.heldout_bench_recipient }}
        run: node simulation/evaluation/agent34-rank1-heldout-psychic-recipient-native-pair.cjs --preflight
      - name: Compare public printed-attack-gap Bench recipient native results
        if: ${{ inputs.heldout_bench_recipient }}
        env:
          AGENT34_HELDOUT_RECIPIENT_OUTPUT: agent34-rank1-heldout-psychic-recipient-native.json
        run: node simulation/evaluation/agent34-rank1-heldout-psychic-recipient-native-pair.cjs
      - name: Preserve all held-out printed-recipient native attempts
        if: ${{ inputs.heldout_bench_recipient }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-rank1-heldout-bench-recipient-v1
          path: agent34-rank1-heldout-psychic-recipient-native.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve matched historical native raw records
        if: ${{ inputs.posthoc_rank1 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent34-underworld-owner-posthoc-rank1
          path: agent34-underworld-owner-posthoc.json
          if-no-files-found: warn
          retention-days: 30
