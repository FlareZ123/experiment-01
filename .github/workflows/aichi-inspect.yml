name: Validate and import Aichi opponent decks

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit validated opponent JSON to main
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: aichi-opponent-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install beautifulsoup4 filelock
      - name: Fetch and validate 29 published decks
        run: python scripts/aichi_import.py
      - name: Publish validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: aichi-2026-full-decklists
          path: results/aichi-2026/full-decklists.json
          retention-days: 30
      - name: Commit validated field when requested
        if: inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/aichi-2026/full-decklists.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 1: Preserve validated Aichi Top 32 decklist data"
            git push origin HEAD:main
          fi
