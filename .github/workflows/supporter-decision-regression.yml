name: Twinleaf Supporter decision state regression

on:
  workflow_dispatch:
    inputs:
      run_aichi_fixture:
        description: 'Run two additional Aichi weak-bot policy feasibility games'
        required: false
        type: boolean
        default: false
      run_expanded_fixture:
        description: 'Run a two-archetype source-deck composite-policy smoke'
        required: false
        type: boolean
        default: false
      agent22_native_proposal_state:
        description: 'Run canonical both-seat pre-dispatch Supporter State-purity audit and control'
        required: false
        type: boolean
        default: false

      agent25_lowhand_lillie_pair:
        description: Four-arm both-seat original Store Lillie pre-attack policy paired comparison
        required: false
        type: boolean
        default: false
      agent25_owner_scout_census:
        description: Read-only owner-held Lillie census over all 32 previously registered scout arms
        required: false
        type: boolean
        default: false
      agent25_owner_scout_lillie_treatment:
        description: Original 32-arm Lillie response and physical draw settlement
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  supporter-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate Supporter proposal and field provenance
        run: node --test tests/supporter-decision-hook.test.cjs tests/test-aichi-field-benchmark.cjs tests/aichi-supporter-census.test.cjs tests/mandatory-option-policy.test.cjs tests/expanded-policy-profile.test.cjs tests/lost-vacuum-modal-choice.test.cjs tests/bunnelby-guzma-hala-mode.test.cjs tests/bunnelby-tm-target-selection.test.cjs tests/bunnelby-k0-source-inventory.test.cjs tests/expanded-source-profile-pair.test.cjs tests/bunnelby-gh-discard-policy-probe.test.cjs tests/bunnelby-gh-search-policy.test.cjs tests/expanded-gh-search-pair.test.cjs tests/newmoon-proactive-lowhand-lillie-opportunity.test.cjs tests/agent25-lowhand-lillie-root.test.cjs tests/agent25-lowhand-lillie-paired-audit.test.cjs tests/agent25-registered-scout-owner-census.test.cjs tests/agent50-stranded-marnie-frontier.test.cjs
      - name: Original four-arm native Store with Lillie selector disabled
        if: ${{ inputs.agent25_lowhand_lillie_pair }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT25_LOWHAND_LILLIE_DEV: 'false'
          AGENT25_LOWHAND_LILLIE_CENSUS_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent25-lillie-control-fourarm.json
      - name: Same four-arm native Store with both-seat low-hand Lillie enabled
        if: ${{ inputs.agent25_lowhand_lillie_pair }}
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT25_LOWHAND_LILLIE_DEV: 'true'
          AGENT25_LOWHAND_LILLIE_CENSUS_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent25-lillie-treated-fourarm.json
      - name: Verify paired Lillie Store roots and all original trial identities
        if: ${{ inputs.agent25_lowhand_lillie_pair }}
        run: |
          node simulation/evaluation/agent25-lowhand-lillie-paired-audit.cjs agent25-lillie-control-fourarm.json agent25-lillie-treated-fourarm.json > agent25-lillie-native-pair-audit.json
          node -e "const assert=require('node:assert/strict');const a=require('./agent25-lillie-native-pair-audit.json');assert.equal(a.pairs,4);assert.equal(a.matchingSourceDeals,4);assert.equal(a.matchingFirstPlayers,4);assert.equal(a.competitiveQualifiedGames,0);console.log('LILLIE_NATIVE_PAIR',JSON.stringify({heldControl:a.controlHeldLillieRootReads,heldTreatment:a.treatmentHeldLillieRootReads,eligibleControl:a.controlOpportunityRootReads,eligibleTreatment:a.treatmentOpportunityRootReads,proposed:a.proposed,physicallyConfirmed:a.physicallyConfirmed,nativeSettled:a.nativeSettled,rows:a.rows.map(x=>({id:x.id,control:x.controlStatus,treatment:x.treatmentStatus}))}))"
      - name: Archive both original Store treatments and any native errors
        if: ${{ always() && inputs.agent25_lowhand_lillie_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-lowhand-lillie-original-store-pair
          path: |
            agent25-lillie-control-fourarm.json
            agent25-lillie-treated-fourarm.json
            agent25-lillie-native-pair-audit.json
          if-no-files-found: warn
          retention-days: 10
      - name: Execute all 32 original prespecified native scout arms with observer only
        if: ${{ inputs.agent25_owner_scout_census }}
        env:
          AGENT25_LOWHAND_LILLIE_DEV: 'false'
          AGENT25_LOWHAND_LILLIE_CENSUS_DEV: 'true'
        run: node simulation/evaluation/agent41-prospective-canonical-scout.cjs > agent25-registered-32-owner-census-raw.json
      - name: Preserve the 32-arm owner root census without dropping aborted or capped games
        if: ${{ inputs.agent25_owner_scout_census }}
        run: |
          node simulation/evaluation/agent25-registered-scout-owner-census.cjs agent25-registered-32-owner-census-raw.json > agent25-registered-32-owner-census.json
          node -e "const a=require('node:assert/strict');const c=require('./agent25-registered-32-owner-census.json');a.equal(c.attempted,32);a.equal(c.observedArms+c.exceptionArms,32);a.equal(c.competitiveQualifiedGames,0);console.log('AGENT25_32_OWNER_CENSUS',JSON.stringify({observed:c.observedArms,rootReads:c.ownerRootReads,heldReads:c.heldRootReads,eligibleReads:c.eligibleRootReads,byRank:c.byRank,byCandidate:c.byCandidate}))"
      - name: Archive complete frozen source campaign including native errors
        if: ${{ always() && inputs.agent25_owner_scout_census }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-frozen-32-actor-owned-lillie-census
          path: |
            agent25-registered-32-owner-census-raw.json
            agent25-registered-32-owner-census.json
          if-no-files-found: warn
          retention-days: 12
      - name: Original 32-arm Store replay with low-hand Lillie treatment
        if: ${{ inputs.agent25_owner_scout_lillie_treatment }}
        env:
          AGENT25_LOWHAND_LILLIE_DEV: 'true'
          AGENT25_LOWHAND_LILLIE_CENSUS_DEV: 'true'
        run: node simulation/evaluation/agent25-original-32-lillie-treatment.cjs > agent25-registered-32-lillie-treated-raw.json
      - name: Compile full observed low-hand Lillie treatment census
        if: ${{ inputs.agent25_owner_scout_lillie_treatment }}
        run: node simulation/evaluation/agent25-registered-scout-owner-census.cjs agent25-registered-32-lillie-treated-raw.json > agent25-registered-32-lillie-treated-owner-census.json
      - name: Require printed shuffle draw settlement for all native Lillie plays
        if: ${{ inputs.agent25_owner_scout_lillie_treatment }}
        run: >-
          node -e "const a=require('node:assert/strict');
          const r=require('./agent25-registered-32-lillie-treated-raw.json');
          const c=require('./agent25-registered-32-lillie-treated-owner-census.json');
          const d=r.agent25NativeLillieDrawSettlement;
          a.equal(c.attempted,32);a.equal(c.competitiveQualifiedGames,0);
          a.equal(d.readOnly,true);a.equal(d.unresolved,0);
          a.equal(d.printedDrawConfirmed,d.supportRoots);
          console.log('AGENT25_NATIVE_LILLIE_32',JSON.stringify({accepted:d.supportRoots,drawConfirmed:d.printedDrawConfirmed,eligibleRootReads:c.eligibleRootReads,sourceCapped:c.cappedArms,exceptions:c.exceptionArms,qualified:0}));"
      - name: Preserve raw 32-arm Lillie treatment even when failed
        if: ${{ always() && inputs.agent25_owner_scout_lillie_treatment }}
        uses: actions/upload-artifact@v4
        with:
          name: agent25-original-32-same-deal-lillie-treatment
          path: |
            agent25-registered-32-lillie-treated-raw.json
            agent25-registered-32-lillie-treated-owner-census.json
          if-no-files-found: warn
          retention-days: 12
      - name: Optional published-list policy feasibility probe
        if: ${{ inputs.run_aichi_fixture }}
        run: node simulation/twinleaf/supporter-aichi-smoke.cjs
      - name: Optional composite source-deck policy fixture
        if: ${{ inputs.run_expanded_fixture }}
        run: node simulation/twinleaf/expanded-policy-aichi-fixture.cjs
      - name: Optional paired source-K0 Expanded policy diagnostic
        if: ${{ inputs.run_expanded_fixture }}
        run: node simulation/twinleaf/expanded-source-profile-pair.cjs
      - name: Optional v2-v3 GH paired diagnostic
        if: ${{ inputs.run_expanded_fixture }}
        run: node simulation/twinleaf/expanded-gh-search-pair.cjs
      - name: Verify authentic proposal observer, K0 epoch prerequisites and cleanup
        if: ${{ inputs.agent22_native_proposal_state }}
        run: node --test tests/agent22-supporter-proposal-state-audit.test.cjs tests/owner-k0-draw-belief.test.cjs
      - name: Uninstrumented native paper Supporter control, four canonical historical arms
        if: ${{ inputs.agent22_native_proposal_state }}
        env:
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent22-proposal-control.json
      - name: Read-only native proposal instrumentation, same four historical arms
        if: ${{ inputs.agent22_native_proposal_state }}
        env:
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT22_PROPOSAL_STATE_AUDIT: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent22-proposal-observed.json
      - name: Fail closed on baseline action drift or incomplete native proposal packets
        if: ${{ inputs.agent22_native_proposal_state }}
        run: >-
          node -e "const assert=require('node:assert/strict');
          const a=require('./agent22-proposal-control.json'),b=require('./agent22-proposal-observed.json');
          assert.equal(a.attempted,4);assert.equal(b.attempted,4);
          assert.equal(a.competitiveQualifiedGames,0);assert.equal(b.competitiveQualifiedGames,0);
          for(let i=0;i<4;i++){const x=a.rows[i],y=b.rows[i];
          assert.equal(x.trial.id,y.trial.id);
          assert.equal(x.rootActionLedgerSha256,y.rootActionLedgerSha256,'Native Store root drift');
          assert.equal(x.sourceDealFingerprint,y.sourceDealFingerprint,'Physical source-deal drift');
          const q=y.supporterProposalIntegrity;
          assert.equal(q?.nativeRootIdentified,true);
          assert.equal(q.truncatedRecords,0,'Do not silently truncate native proposal evidence');
          assert.equal(q.proposalMarkerPersistedToBotExit,0,'Temporary marker survived bot exit');
          assert.equal(q.physicalRootStatePreservedToDispatch,q.nativeDispatchedSelected,
          'Native root State identity drifted before dispatch');
          assert.equal(q.physicalRootOwnerPreservedToDispatch,q.nativeDispatchedSelected,
          'Native owner object identity drifted before dispatch');
          assert.equal(q.mutatedRootProposals,q.nativeDispatchedSelected,
          'Expected every observed native marker write to be a selected and dispatched Supporter');
          for(const entry of q.records.filter(e=>e.mutatedQuotaDuringProposal)){
          assert.equal(entry.rootStateAliasAtBotExit,true);
          assert.equal(entry.rootOwnerAliasAtBotExit,true);
          assert.equal(entry.quotaAfterBotDecision,entry.quotaBeforeProposal,
          'Existing Supporter correction did not restore real quota');
          assert.equal(entry.quotaAtNativeDispatch,entry.quotaBeforeProposal,
          'Native dispatch inherited premature Supporter marker');
          assert.equal(entry.quotaAfterNativeDispatch,entry.quotaBeforeProposal+1,
          'Native Supporter Store quota failed exact one-play postcondition');}
          console.log('NATIVE_PROPOSAL_AUDIT',JSON.stringify({id:y.trial.id,
          stateAlias:q.realRootStateAliasProposals,
          temporaryMutations:q.mutatedRootProposals,
          survivedBotExit:q.proposalMarkerPersistedToBotExit,
          restoredAtDispatch:q.nativeDispatchedSelected,
          nativeStateObjectRetained:q.physicalRootStatePreservedToDispatch,
          rejectedMutation:q.rejectedAndMutatedRootProposals}));}"
      - name: Preserve authentic root observations, including negative results
        if: ${{ inputs.agent22_native_proposal_state && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent22-native-supporter-proposal-state-observer
          path: |
            agent22-proposal-control.json
            agent22-proposal-observed.json
          if-no-files-found: warn
          retention-days: 10
