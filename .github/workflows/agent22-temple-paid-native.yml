name: Agent22 owner-paid Temple source Store settlement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-temple-source-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test actor-only positive and negative printing ownership and genuine paid effect
        run: |
          node --test tests/2026-11/agent22-temple-dde-owner-policy.test.cjs
          node --test tests/2026-11/agent22-temple-paid-native-fixture.test.cjs
