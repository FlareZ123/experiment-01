name: Agent 2 original 29 first Tool collision exact census

on:
  workflow_dispatch:
    inputs:
      native_root_identity_canary:
        description: 'Run one pinned Store/root registered-bot identity canary'
        type: boolean
        default: false
      native_research_seeker_canary:
        description: 'Run registered original rank13-rank3 VS Seeker Research A/B/A'
        type: boolean
        default: false
      native_owner_fallback_diagnostic:
        description: 'Read-only first quarantined actual owner root on two original seats'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent2-first-tool-pure-census
  cancel-in-progress: false

jobs:
  pure-original-source-census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original printed-card and combinatorial regression
        run: node --test tests/agent2-original29-fss-first-tool-collision.test.cjs tests/agent2-first-tool-structural-counterexample.test.cjs tests/agent2-fss-held-try-float-owner.test.cjs
      - name: Audit exact 29 original printed Pokémon and all retreat-denial literal hits
        run: |
          node --test tests/agent2-aichi-exact-retreat-prohibition-census.test.cjs
          node simulation/evaluation/agent2-aichi-exact-retreat-prohibition-census.cjs > agent2-aichi-retreat-prohibition.json
          sha256sum agent2-aichi-retreat-prohibition.json > agent2-aichi-retreat-prohibition.json.sha256
      - name: Fail closed on missing v1 and v2 live paid-retreat wrapper activation
        run: node --test tests/agent2-paid-retreat-root-wrapper-activation.test.cjs
      - name: Assert actual Store, bot identity and successful native action receipt
        run: node --test tests/agent2-root-identity-guard.test.cjs tests/agent2-paid-retreat-accepted-root-receipt.test.cjs
      - name: Audit Basic-only paid retreat physical identity and exact discard
        run: node --test tests/agent2-retreat-basic-physical-witness.test.cjs
      - name: Verify exact physical Research draw and native Store observer fixtures
        run: node --test tests/agent2-professor-research-physical-draw-witness.test.cjs tests/agent2-professor-research-native-settlement.test.cjs
      - name: Verify first quarantined owner root and GO_FIRST abort receipts
        run: node --test tests/agent2-first-unsupported-owner-root-observer.test.cjs tests/agent2-first-unsupported-owner-root-bridge.test.cjs tests/agent6-go-first-choice.test.cjs
      - name: Verify original rank13 VS Seeker Research A/B/A source and controls
        run: node --test tests/agent2-vs-seeker-research-original-rank13-aba.test.cjs
      - name: Verify owner-only VS Seeker Professor multi-action Store fixture
        run: node --test tests/agent2-owner-vs-seeker-research-store-sequence.test.cjs
      - name: Validate default-off owner-only VS Seeker Professor draw roots and physical prompt
        run: node --test tests/agent2-owner-vs-seeker-research-root.test.cjs
      - name: Count exact original 29 Trainer demand and verify 60-card census
        run: |
          node --test tests/agent2-original29-trainer-demand-census.test.cjs
          node simulation/evaluation/agent2-original29-trainer-demand-census.cjs > agent2-original29-trainer-demand.json
      - name: Check conservative owner public Block and Bench-attack mobility gates
        run: node --test tests/agent2-actor-multi-basic-paid-retreat-frontier.test.cjs
      - name: Preserve exact machine-readable 29-rank analysis and SHA-256
        run: |
          node simulation/evaluation/agent2-original29-fss-first-tool-collision.cjs > agent2-fss-collision.json
          sha256sum agent2-fss-collision.json > agent2-fss-collision.json.sha256
      - name: Upload pure-analysis receipt even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-original29-fss-first-tool-pure-census
          path: |
            agent2-fss-collision.json
            agent2-fss-collision.json.sha256
            agent2-aichi-retreat-prohibition.json
            agent2-aichi-retreat-prohibition.json.sha256
            agent2-original29-trainer-demand.json
          if-no-files-found: warn

  native-root-identity:
    if: inputs.native_root_identity_canary || inputs.native_research_seeker_canary || inputs.native_owner_fallback_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Native both-seat Active Block excludes nominal paid RetreatAction
        run: node --test tests/agent2-multi-basic-active-block.native.test.cjs
      - name: Single authentic original 60 versus 60 actual root identity receipt
        if: inputs.native_root_identity_canary
        run: node simulation/evaluation/agent2-root-bound-paid-retreat-native-canary.cjs > agent2-root-bound-native-canary.json
      - name: Prospective rank13 original VS Seeker Research A/B/A
        if: inputs.native_research_seeker_canary
        run: node simulation/evaluation/agent2-vs-seeker-research-original-rank13-aba.cjs > agent2-original-rank13-seeker-research-native.json
      - name: Record actual original two-seat first owner-visible quarantined root
        if: inputs.native_owner_fallback_diagnostic
        run: node simulation/evaluation/agent2-first-unsupported-owner-root-native-canary.cjs > agent2-original-first-quarantined-owner-root.json
      - name: Preserve native root-identity receipt including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-root-bound-native-canary
          path: |
            agent2-root-bound-native-canary.json
            agent2-original-rank13-seeker-research-native.json
            agent2-original-first-quarantined-owner-root.json
          if-no-files-found: warn
