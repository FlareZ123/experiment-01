name: Agent12 fixed-sixty Iron Thorns architecture screen

on:
  workflow_dispatch:
    inputs:
      panel:
        description: 'Frozen developmental fixed-60 experiment, original screen or Mimikyu pivot'
        type: choice
        options: ['baseline', 'safeguard', 'temple']
        default: 'baseline'

permissions:
  contents: read

jobs:
  eight-rank-original-field:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test original screen sharp paired bounds
        if: ${{ inputs.panel == 'baseline' }}
        run: |
          node --test tests/2026-11/agent12-thorns-fixed60-screen.test.cjs
          node simulation/evaluation/2026-11/agent12-thorns-fixed60-eight-rank-native.cjs --inspect-only
      - name: Run original eight-rank 32-game fixed 60 screen
        if: ${{ inputs.panel == 'baseline' }}
        run: node simulation/evaluation/2026-11/agent12-thorns-fixed60-eight-rank-native.cjs
      - name: Test fixed Safeguard-Pivot 60 and source-censor accounting
        if: ${{ inputs.panel == 'safeguard' }}
        run: |
          node --test tests/2026-11/agent12-safeguard-pivot-native.test.cjs
          node simulation/evaluation/2026-11/agent12-safeguard-pivot-original-field-native.cjs --inspect-only
      - name: Run 48 preregistered native Safeguard vs original comparisons
        if: ${{ inputs.panel == 'safeguard' }}
        run: node simulation/evaluation/2026-11/agent12-safeguard-pivot-original-field-native.cjs
      - name: Test frozen Temple v2 against Safeguard v1 and native censor accounting
        if: ${{ inputs.panel == 'temple' }}
        run: |
          node --test tests/2026-11/agent12-temple-vs-safeguard-native.test.cjs
          node simulation/evaluation/2026-11/agent12-temple-vs-safeguard-native.cjs --inspect-only
      - name: Run 48 preregistered original-source Temple comparison games
        if: ${{ inputs.panel == 'temple' }}
        run: node simulation/evaluation/2026-11/agent12-temple-vs-safeguard-native.cjs
      - name: Archive original 32-game baseline
        if: ${{ always() && inputs.panel == 'baseline' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent12-thorns-fixed60-eight-rank-native
          path: agent12-thorns-fixed60-eight-rank-native.json
          if-no-files-found: warn
          retention-days: 21
      - name: Archive Safeguard-Pivot full 48-game native roots
        if: ${{ always() && inputs.panel == 'safeguard' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent12-thorns-safeguard-pivot-native
          path: agent12-thorns-safeguard-native.json
          if-no-files-found: warn
          retention-days: 21

      - name: Archive Temple v2 complete 48-game root ledgers
        if: ${{ always() && inputs.panel == 'temple' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent12-temple-mimikyu-v2-native
          path: agent12-temple-mimikyu-native.json
          if-no-files-found: warn
          retention-days: 21
