name: Agent12 fixed-sixty Iron Thorns architecture screen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eight-rank-original-field:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test sharp paired censor bounds and preflight frozen 60s
        run: |
          node --test tests/2026-11/agent12-thorns-fixed60-screen.test.cjs
          node simulation/evaluation/2026-11/agent12-thorns-fixed60-eight-rank-native.cjs --inspect-only
      - name: Run all 32 preregistered actual Store attempts
        run: node simulation/evaluation/2026-11/agent12-thorns-fixed60-eight-rank-native.cjs
      - name: Preserve every native game, abort, and censor disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent12-thorns-fixed60-eight-rank-native
          path: agent12-thorns-fixed60-eight-rank-native.json
          if-no-files-found: warn
          retention-days: 21
