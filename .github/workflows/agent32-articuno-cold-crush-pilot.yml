name: Agent32 original source native matched experiments

on:
  workflow_dispatch:
    inputs:
      run_panel:
        description: Run the preregistered 48-match A/B/A panel after validation
        required: true
        type: boolean
        default: true
      run_fresh_perfection:
        description: 'Run precommitted 16-deal eight-rank paired Perfection whole-game native panel'
        required: false
        type: boolean
        default: false
      run_early_vip_perfection:
        description: 'Run second frozen 16-deal original-field early Battle VIP Mewtwo donor plus paid Perfection comparison'
        required: false
        type: boolean
        default: false
      run_vip_only_diagnostic:
        description: 'Run only the third retrospective native VIP recipient arm, without Energy-funding hooks'
        required: false
        type: boolean
        default: false
      run_perfection_pivot_diagnostic:
        description: 'Run fourth retrospective original 16-deal VIP plus native paid Mewtwo pivot arm'
        required: false
        type: boolean
        default: false
      run_prospective_perfection_pivot:
        description: 'Run frozen new 16-physical-deal 32-game VIP-only vs VIP+funded pivot prospective causal test'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cold-crush-aba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate runner syntax
        run: node --check simulation/evaluation/agent32-rank3-articuno-cold-crush-aba.cjs
      - name: Test A-B-A runner acceptance contract
        run: node --test tests/agent32-rank3-articuno-cold-crush-aba.test.cjs
      - name: Run staged Articuno choice and native policy tests
        run: node --test tests/agent32-articuno-cold-crush-choice.test.cjs tests/agent32-articuno-cold-crush-native.test.cjs tests/agent32-articuno-cold-crush-policy.native.test.cjs
      - name: Run preregistered rank3 Articuno A-B-A panel
        if: ${{ inputs.run_panel && !inputs.run_fresh_perfection && !inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: node simulation/evaluation/agent32-rank3-articuno-cold-crush-aba.cjs > agent32-rank3-articuno-cold-crush-aba.json
      - name: Upload raw A-B-A evidence
        if: ${{ always() && inputs.run_panel && !inputs.run_fresh_perfection && !inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        uses: actions/upload-artifact@v4
        with:
          name: agent32-rank3-articuno-cold-crush-aba
          path: agent32-rank3-articuno-cold-crush-aba.json
          if-no-files-found: warn

      - name: Validate prospective same-deal whole-game Perfection registration and comparison
        if: ${{ inputs.run_fresh_perfection && !inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: |
          node --check simulation/evaluation/agent32-fresh-perfection-field.cjs
          node --test tests/agent32-fresh-perfection-field.test.cjs
      - name: Run 16 unseen original physical deals under paired native common policies
        if: ${{ inputs.run_fresh_perfection && !inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: node simulation/evaluation/agent32-fresh-perfection-field.cjs > agent32-fresh-perfection-32-native.json
      - name: Archive both native policy outcomes and all thirty-two actual roots
        if: ${{ always() && inputs.run_fresh_perfection && !inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        uses: actions/upload-artifact@v4
        with:
          name: agent32-fresh-perfection-32game-field
          path: agent32-fresh-perfection-32-native.json
          retention-days: 21
          if-no-files-found: warn

      - name: Validate real native VIP recipient and second frozen field composition
        if: ${{ inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: |
          node --check simulation/twinleaf/agent9-battle-vip-owner-after-pass.cjs
          node --check simulation/evaluation/agent32-fresh-early-vip-perfection.cjs
          node --test tests/agent32-perfection-vip-recipient.test.cjs tests/agent32-fresh-early-vip-perfection.test.cjs
      - name: Run early VIP to Mewtwo/Gengar and Psychic funding paired original field
        if: ${{ inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: node simulation/evaluation/agent32-fresh-early-vip-perfection.cjs > agent32-fresh-early-vip-perfection-32-native.json
      - name: Archive original physical setup, native owner VIP transfers, Perfection, and terminations
        if: ${{ always() && inputs.run_early_vip_perfection && !inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        uses: actions/upload-artifact@v4
        with:
          name: agent32-early-vip-perfection-native32
          path: agent32-fresh-early-vip-perfection-32-native.json
          retention-days: 21
          if-no-files-found: warn

      - name: Validate versioned third-arm diagnostic syntax
        if: ${{ inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: node --check simulation/evaluation/agent32-vip-only-retro-third-arm.cjs
      - name: Run exact frozen original physical cohort with VIP donor but no Energy funding hooks
        if: ${{ inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: node simulation/evaluation/agent32-vip-only-retro-third-arm.cjs > agent32-vip-only-retro-third-arm-native.json
      - name: Archive real third arm native roots and VIP source-owned search
        if: ${{ always() && inputs.run_vip_only_diagnostic && !inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        uses: actions/upload-artifact@v4
        with:
          name: agent32-vip-only-retro-third-arm
          path: agent32-vip-only-retro-third-arm-native.json
          retention-days: 21
          if-no-files-found: warn

      - name: Validate bilateral native Mewtwo pivot integration and registered fourth-arm syntax
        if: ${{ inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: |
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/evaluation/agent32-vip-perfection-pivot-retro-fourth-arm.cjs
          node --test tests/agent35-perfection-transition-frontier.test.cjs tests/agent32-perfection-vip-recipient.test.cjs
      - name: Run original same-deal native VIP plus established Perfection funded-pivot arm
        if: ${{ inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        run: node simulation/evaluation/agent32-vip-perfection-pivot-retro-fourth-arm.cjs > agent32-perfection-pivot-native.json
      - name: Archive actual native paid pivots, original physical deals and copied attacks
        if: ${{ always() && inputs.run_perfection_pivot_diagnostic && !inputs.run_prospective_perfection_pivot }}
        uses: actions/upload-artifact@v4
        with:
          name: agent32-perfection-pivot-native-fourth-arm
          path: agent32-perfection-pivot-native.json
          retention-days: 21
          if-no-files-found: warn

      - name: Validate new precommitted pivot causality and published native path
        if: ${{ inputs.run_prospective_perfection_pivot }}
        run: |
          node --check simulation/evaluation/agent32-prospective-vip-perfection-transition.cjs
          node --test tests/agent32-prospective-vip-perfection-transition.test.cjs tests/agent35-perfection-transition-frontier.test.cjs tests/agent32-perfection-vip-recipient.test.cjs
      - name: Run sixteen unseen physically paired original source games with VIP plus Perfection pivot
        if: ${{ inputs.run_prospective_perfection_pivot }}
        run: node simulation/evaluation/agent32-prospective-vip-perfection-transition.cjs > agent32-prospective-vip-perfection-pivot32.json
      - name: Retain full 32-game native paired outcome and real paid attack ledger
        if: ${{ always() && inputs.run_prospective_perfection_pivot }}
        uses: actions/upload-artifact@v4
        with:
          name: agent32-prospective-vip-funded-perfection-32
          path: agent32-prospective-vip-perfection-pivot32.json
          retention-days: 21
          if-no-files-found: warn
