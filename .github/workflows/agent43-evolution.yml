name: Agent 43 Shadow Rider evolution action contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned upstream
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Pure decision and reversible wrapper tests
        run: node --test tests/shadow-rider-evolution-priority.test.cjs tests/shadow-rider-evolution-runner.test.cjs tests/first-evolution-natural.test.cjs tests/first-evolution-field.test.cjs tests/first-evolution-contention.test.cjs
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Two legal pinned Store evolution dispatches
        run: node simulation/twinleaf/shadow-rider-evolution-board.cjs
      - name: Verify rank31 Roxie/Koffing optional confirmation
        run: node simulation/twinleaf/agent43-roxie-koffing-confirmation.cjs
      - name: Observe real source-dealt rank31 Roxie decisions
        run: node simulation/twinleaf/agent43-roxie-source-exposure.cjs > agent43-roxie-source-exposure.json
      - name: Print bounded rank31 Roxie exposure
        run: node -e "const r=require('./agent43-roxie-source-exposure.json');for(const t of r.trials){const c=t.rank31Confirmations||[];const k=t.koffingHandDiscards||[];console.log(JSON.stringify({slot:t.slot,status:t.status,reason:t.reason,roxie:t.rank31RoxiePlays,koffing:k,confirmationCount:c.length,atKoffingTurns:c.filter(q=>k.some(d=>d.turn===q.turn)),turns:t.turns}))}"
      - name: Observe bounded rank1-vs-rank10 source policy alternatives
        run: node simulation/evaluation/agent43-evolution-contrast.cjs > agent43-evolution-contrast.json
      - name: Print sample policy divergence and blocked states
        run: node -e "const r=require('./agent43-evolution-contrast.json');for(const t of r.trials)console.log(JSON.stringify({seed:t.seed,seat:t.candidateSeat,status:t.status,error:t.reason,proposals:t.experimental?.proposals?.length,baselineAttacks:t.baseline?.shadowAttacks,experimentalAttacks:t.experimental?.shadowAttacks}))"
      - name: Preserve bounded source-mapped observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent43-evolution-contrast
          path: |
            agent43-evolution-contrast.json
            agent43-roxie-source-exposure.json
          if-no-files-found: warn
