name: Twinleaf headless smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out exactly the pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up upstream Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned upstream server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile upstream server without modifying vendor
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Audit original-Store Tinkaton ex Press versus Double Turbo in both seats
        run: |
          node simulation/twinleaf/agent7-tinkaton-press-dte-native.cjs
          node simulation/twinleaf/agent7-tinkaton-safeguard-native.cjs
      - name: Attest all 29 original printed source ranks against genuine pinned native deck IDs
        run: node simulation/evaluation/agent13-native-plan-attestation-smoke.cjs
      - name: Test both-seat native legal-but-unproductive Special Energy hold
        run: node simulation/twinleaf/agent13-staged-energy-hold-native.cjs
      - name: Verify guarded source-print last-Bench Dedenne versus Regidrago native forks in both seats
        run: node simulation/twinleaf/agent11-native-last-bench-locked-dedenne.cjs
      - name: Settle printed Iron Thorns Volt Cyclone reply after two-seat last-Bench forks
        run: node simulation/twinleaf/agent11-last-bench-volt-cyclone-reply.cjs
      - name: Enforce native Energy recipient legality under printed type filters
        run: node --test tests/agent11-pinned-attach-energy-geometry.test.cjs tests/agent11-attach-energy-geometry.test.cjs
      - name: Regress optional actor-only typed Energy frontier and unchanged root
        run: node --test tests/agent10-basic-energy-frontier.test.cjs tests/agent10-energy-frontier-root-integration.test.cjs
      - name: Regress full-Bench FST Trubbish paper attack correction
        run: node --test tests/agent10-trubbish-fst-full-bench-paper-hook.test.cjs tests/agent10-pinned-trubbish-fst-full-bench-paper-hook.test.cjs
      - name: Verify real Store two-Psychic attachment counterfactual
        run: node --test tests/agent10-pinned-basic-energy-frontier-store.test.cjs
      - name: Verify pinned Telepath Psychic owner-deck search versus Basic attachment
        run: node --test tests/agent10-pinned-telepath-psychic-energy.test.cjs
      - name: Reject unsimulatable New Moon Horror House and Perfection opening roots
        run: node --test tests/new-moon-opening-horror-house-preflight.test.cjs
      - name: Prove both Horror House channels against real printed Psychic Energy in Store
        run: node --test tests/new-moon-opening-horror-house-store-preflight.test.cjs
      - name: Probe source Regidrago printed-copy discard and Double Dragon Energy
        run: node simulation/twinleaf/regidrago-dragon-energy-probe.cjs
      - name: Diagnose native Canceling Cologne sudden-death epoch without altering its hook
        run: node simulation/twinleaf/agent13-cologne-epoch-diagnostic.cjs
      - name: Regress official Japanese same-turn Canceling Cologne duplicate ruling
        run: node simulation/twinleaf/canceling-cologne-repeat-paper-gate.cjs
      - name: Verify Forest Seal Stone Power bypasses Ability lock
        run: node simulation/twinleaf/forest-seal-ability-check.cjs
      - name: Check Forest Seal Stone on board
        run: node simulation/twinleaf/forest-seal-board-check.cjs
      - name: Verify first-turn attribution contracts
        run: node --test tests/turn_order_evidence.test.cjs
      - name: Regress Ranger/Channeler versus attack-origin and Ability-origin Item lock
        run: node --test tests/ranger_lock_engine.test.cjs
      - name: Verify Japanese Player's Ceremony reducer effect
        run: node --test tests/players_ceremony_effect.test.cjs
      - name: Verify Meloetta donk component attack and Stadium effects
        run: node --test tests/meloetta_donk_reducer.test.cjs
      - name: Verify a staged self-KO awards opponent's final Prize
        run: node --test tests/meloetta_self_ko.test.cjs
      - name: Verify recurring Exeggcute Propagation reducer
        run: node --test tests/exeggcute_propagation.test.cjs
      - name: Verify Wobbuffet lock across play, Bench, and discard
        run: node --test tests/wobbuffet_donk_lock.test.cjs
      - name: Verify independent policy and game RNG streams
        run: node --test tests/twinleaf-policy-rng-isolation.test.cjs
      - name: Execute bounded deterministic smoke game
        run: node simulation/twinleaf/smoke-test.cjs
      - name: Audit all published Aichi printings against Twinleaf card implementations
        run: node simulation/twinleaf/card-coverage.cjs
      - name: Resolve Aichi opponent decks with explicit, tracked substitutions
        run: node simulation/twinleaf/resolve-field.cjs
      - name: Regress copied-attack selection and declaration root boundaries
        run: node simulation/twinleaf/perfection-attack-ordinal-boundary.cjs
      - name: Reproduce duplicate-name copied attack source-printing mismatch
        run: node simulation/twinleaf/copy-attack-name-collision-source.cjs
      - name: Verify corrected copied-donor selection in Store
        run: node simulation/twinleaf/copy-attack-name-collision-corrected.cjs
