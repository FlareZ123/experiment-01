name: Agent 2 Crispin to VS Seeker Mysterious Treasure native sequence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent2-crispin-vs-seeker-treasure-native
  cancel-in-progress: false

jobs:
  native-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run native Crispin payment and VS Seeker recovery sequence
        run: node simulation/twinleaf/agent2-mysterious-treasure-crispin-vs-seeker-native.cjs > agent2-crispin-vs-seeker-treasure-native.json
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-crispin-vs-seeker-treasure-native
          path: agent2-crispin-vs-seeker-treasure-native.json
          if-no-files-found: warn
