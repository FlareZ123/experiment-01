name: Aichi source-locked Iron Thorns policy diagnostic

on:
  workflow_dispatch:
    inputs:
      agent41_crossrank_trial:
        description: 'Execute prespecified rank 6 and rank 11 two-candidate owner-policy screen'
        required: false
        type: boolean
        default: false
      agent25_rank6_farewell_live:
        description: 'One retrospectively selected rank6 actual-game owner Farewell-over-Pass continuation'
        required: false
        type: boolean
        default: false
      agent25_rank6_newmoon_pass:
        description: 'Replay one archived New Moon first reply with read-only post-pass attack probe'
        required: false
        type: boolean
        default: false
      agent6_rejected_arm:
        description: 'Audit just the archived rank6 rejected PlayCardAction at fixed source seed'
        required: false
        type: boolean
        default: false
      agent6_shadow_mist_supporter:
        description: 'Retrospective one-deal held Supporter instead of Shadow Mist-blocked Stadium'
        type: boolean
        required: false
        default: false
      agent41_crossrank_partition:
        description: 'Preregistered three-repeat partition, 0 or 1'
        required: false
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      trial_ids:
        description: 'Pilot trial IDs (up to six); agent17-four-trigger-forensic with agent41=true selects retrospective replay'
        required: false
        type: string
        default: ''
      policy_profile:
        description: Research bot decision profile
        required: true
        default: expanded-action-fidelity-probe-v1
        type: choice
        options:
          - simple-default-v0
          - simple-supporter-guard-v1
          - expanded-action-fidelity-probe-v1
          - rank11-autonomous-boostshake-v1
          - rank11-autonomous-first-own-turn-v2
          - rank11-autonomous-boostshake-supporter-v2
          - rank26-autonomous-cologne-v1
          - rank26-autonomous-cologne-pump-v2
          - rank26-autonomous-cologne-pump-propagation-v3
      newmoon_vip_probe:
        description: Precommitted 16 source deals, two hard ranks, both real starts, candidate-first VIP policy
        required: false
        type: boolean
        default: false
      newmoon_pass_probe:
        description: 'Observe cloned legal attack options after New Moon Bot Pass, no gameplay intervention'
        required: false
        type: boolean
        default: false
      rank11_autonomous_probe:
        description: Execute one source-rank11 automatic lock policy diagnostic (unqualified)
        required: false
        type: boolean
        default: false
      rank11_first_screen:
        description: Validate reversible genuine Store rank11 first-turn K0 screening (unqualified)
        required: false
        type: boolean
        default: false
      rank11_k0_continuation:
        description: Execute five preregistered K0-selected authentic source-policy continuations, no win estimate
        required: false
        type: boolean
        default: false
      rank11_conditional_k0_screen:
        description: Screen precommitted 32 source-dealt rank11 K0 seeds, no matches
        required: false
        type: boolean
        default: false
      rank11_k0_partition:
        description: Fixed K0 screening partition 0 to 15, or all 512 in one job
        required: false
        type: string
        default: '0'
      rank11_exposure_probe:
        description: Test a precommitted 16-trial actual-first-turn rank11 partition (unqualified)
        required: false
        type: boolean
        default: false
      rank11_exposure_partition:
        description: Fixed registered repeat partition 0, 1, 2 or 3
        required: false
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
        default: '0'
      post_super_clone:
        description: 'Experimental v2 speculative Simulator repair; does not qualify game strength'
        required: false
        type: boolean
        default: false
      attached_tool_power:
        description: 'Equal-seat Tool-granted Ability candidate policy; unqualified'
        required: false
        type: boolean
        default: false
      setup_multiseed_audit:
        description: 'Run bounded multi-rank, multi-seed first-turn captures only; unqualified'
        required: false
        type: boolean
        default: false
      hood_source_turn_audit:
        description: 'Source rank6 two-start Hood/Arven decisions under unchanged generic bots; unqualified'
        required: false
        type: boolean
        default: false
      setup_observer_audit:
        description: 'With setup_order_probe, run a three-arm observer noninterference audit instead'
        required: false
        type: boolean
        default: false
      setup_order_probe:
        description: 'Run matched source-deal setup experiment instead of full games (unqualified)'
        required: false
        type: boolean
        default: false
      input_order_protocol:
        description: 'Preserve historical source order or opt in to aligned candidate input'
        required: false
        type: choice
        options:
          - source-row-order-v1
          - reference-aligned-v1
        default: source-row-order-v1
      seat_seed_protocol:
        description: 'v3 default; explicitly choose v2 only to replay historical diagnostics'
        required: false
        type: choice
        options:
          - independent-slots-v2
          - decorrelated-slots-v3
        default: decorrelated-slots-v3

permissions:
  contents: read

jobs:
  source-locked-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned simulator revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install simulator dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned simulator
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test the identical bilateral candidate policy wrapper (development only)
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-common-policy-dev' }}
        run: node --test tests/agent41-bilateral-common-policy.test.cjs tests/agent41-bilateral-v2-fingerprints.test.cjs
      - name: Verify common v2 candidate policy and historical-only development identities
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' }}
        run: node --test tests/agent41-bilateral-common-policy.test.cjs tests/agent41-bilateral-v2-development.test.cjs
      - name: Run four existing v1 deals with one new common candidate policy
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' }}
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent41-bilateral-v2-development.json
      - name: Summarize all development failures and attempted arms, without competitive outcomes
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' }}
        run: node -e "const d=require('./agent41-bilateral-v2-development.json');for(const r of d.rows)console.log('DEVELOPMENT',JSON.stringify({id:r.trial?.id,errors:r.error?.slice(0,350)||null,actualSourceFirst:r.sourceActuallyFirst,actions:r.actionCount,attacks:r.attackDeclarations,closed:r.settledPublicAttackCount,prizes:r.finalPrizes,finished:r.finished,policy:r.policyVersion}));console.log('SOURCE_PAIRS',JSON.stringify(d.sourcePairs.map(p=>({id:p.pairId,sameSourceDeal:p.sameSourcePhysicalDeal,sameStarter:p.sameActualStarter,followups:p.candidateFollowupStatuses}))));console.log('UNQUALIFIED',d.competitiveQualifiedGames,'of',d.attempted)"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' }}
        with:
          name: agent41-bilateral-v2-historical-development
          path: agent41-bilateral-v2-development.json
          retention-days: 10
      - name: Print exact 60-card and shared decision-policy digests, without running games
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-common-policy-dev' }}
        run: node -e "const a=require('./simulation/evaluation/agent41-bilateral-v2-fingerprints.cjs').buildDraftFingerprints();console.log('DRAFT_ONLY',JSON.stringify({field:a.sourceField,champion:a.fixedCandidates['champion-reference'].englishDisplayPrinting.sha256,newMoonProxy:a.fixedCandidates['new-moon-lockbreaker-v1'].englishSimulationProxy.sha256,newMoonJapanese:a.fixedCandidates['new-moon-lockbreaker-v1'].proposedJapanesePhysicalPrinting.sha256,opponent6:a.fixedSourceOpponents[6].englishDisplayPrinting.sha256,opponent11:a.fixedSourceOpponents[11].englishDisplayPrinting.sha256,candidatePolicy:a.policies.sharedCandidate.sha256,sourcePolicy:a.policies.sourceOpponent.sha256,runner:a.policies.runnerAndEngineGlue.sha256,qualified:a.competitiveQualifiedGames}))"
      - name: Verify retrospective Store packet and frozen trigger identities
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: node --test tests/aichi-bilateral-reply-packet.test.cjs tests/agent17-crossrank-trigger-replay.test.cjs
      - name: Reexecute four original source-triggered game arms for accepted-action and reply witnesses
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: node simulation/evaluation/agent17-crossrank-trigger-replay.cjs > agent17-crossrank-trigger-evidence.json
      - name: Show bounded bilateral observations without competitive inference
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: node -e "const x=require('./agent17-crossrank-trigger-evidence.json');for(const r of x.rows)console.log('FORENSIC',JSON.stringify({id:r.id,status:r.status,source:r.sourceReplyPacket?.executedSourceRoot,sourceAttackAccepted:r.sourceReplyPacket?.matchingSourceAttackDeclared,candidateFirst:r.sourceReplyPacket?.firstCandidateNextTurnRoot,candidateAttackNames:r.sourceReplyPacket?.candidateSameTurnAttackDeclarations,nextSource:r.sourceReplyPacket?.nextSourceTurnRoot,error:r.error?.slice(0,250)}))"
      - name: Show captured public board changes beside source and candidate Store attack declarations
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: node -e "const x=require('./agent17-crossrank-trigger-evidence.json');const view=a=>a?.map((p,i)=>({slot:i,active:p.active?{name:p.active.name,damage:p.active.damage}:null,bench:p.bench?.map(y=>({name:y.name,damage:y.damage})),stadium:p.stadium}));for(const r of x.rows){const p=r.sourceReplyPacket;const t=p?.sourceImmediatePublicAttackTransition;console.log('PUBLIC_ATTACK',JSON.stringify({id:r.id,source:t?{before:view(t.before),after:view(t.after),pending:t.promptPendingAfter,settled:t.settled?{ordinal:t.settled.completionRootActionOrdinal,after:view(t.settled.after),prizes:t.settled.prizesRemaining}:null}:null,candidate:(p?.candidateImmediatePublicAttackTransitions??[]).map(y=>({attacks:y.declarations.map(z=>z.attackName),before:view(y.before),after:view(y.after),pending:y.promptPendingAfter,settled:y.settled?{ordinal:y.settled.completionRootActionOrdinal,after:view(y.settled.after),prizes:y.settled.prizesRemaining}:null}))}))}"
      - name: Require observed printed-base damage, prompt completion and identical archived root history
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: |
          node --test tests/agent17-crossrank-resolved-audit.test.cjs
          node scripts/agent17-crossrank-resolved-audit.cjs agent17-crossrank-trigger-evidence.json > agent17-crossrank-resolved-audit.json
      - name: Print qualified retrospective mechanics, keeping game results excluded
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: node -e "const r=require('./agent17-crossrank-resolved-audit.json');console.log('RESOLVED_AUDIT',JSON.stringify(r))"
      - name: Verify ten exact historical caps selected without new denominator
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-crossrank-cap-tail' }}
        run: node --test tests/agent17-crossrank-censor-tail.test.cjs
      - name: Replay ten original action-limit censored roots without changing the game policies
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-crossrank-cap-tail' }}
        run: node simulation/evaluation/agent17-crossrank-censor-tail.cjs > agent17-crossrank-censor-tail.json
      - name: Print complete ten-arm censor disposition and bounded last action samples
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-crossrank-cap-tail' }}
        run: node -e "const x=require('./agent17-crossrank-censor-tail.json');for(const r of x.rows)console.log('CAP_TAIL',JSON.stringify({id:r.id,status:r.status,rootActions:r.actions,turn:r.turns,archiveCountsMatch:r.originalOutcomeCountsMatched,pending:r.finalCapEvidence?.pendingPromptTypes,tail:r.finalCapEvidence?.rootTail?.slice(-6),lastAttacks:r.finalCapEvidence?.lastAttacks?.slice(-2),error:r.error?.slice(0,250)}))"
      - name: Verify registered Agent41 two-rank schedule and corpus hashes
        if: ${{ inputs.agent41_crossrank_trial && !inputs.agent6_rejected_arm && !inputs.agent6_shadow_mist_supporter && !inputs.agent25_rank6_newmoon_pass && !inputs.agent25_rank6_farewell_live && inputs.trial_ids != 'agent17-four-trigger-forensic' && inputs.trial_ids != 'agent17-crossrank-cap-tail' && inputs.trial_ids != 'agent2-stone-recipient' && inputs.trial_ids != 'agent2-stone-star' && inputs.trial_ids != 'agent8-player-lock-veto' && inputs.trial_ids != 'agent41-common-policy-dev' && inputs.trial_ids != 'agent41-bilateral-v2-dev' }}
        run: node --test tests/agent41-crossrank-actual-decisions.test.cjs
      - name: Execute frozen candidate-paired Iron Thorns and Garbodor screen
        if: ${{ inputs.agent41_crossrank_trial && !inputs.agent6_rejected_arm && !inputs.agent6_shadow_mist_supporter && !inputs.agent25_rank6_newmoon_pass && !inputs.agent25_rank6_farewell_live && inputs.trial_ids != 'agent17-four-trigger-forensic' && inputs.trial_ids != 'agent17-crossrank-cap-tail' && inputs.trial_ids != 'agent2-stone-recipient' && inputs.trial_ids != 'agent2-stone-star' && inputs.trial_ids != 'agent8-player-lock-veto' && inputs.trial_ids != 'agent41-common-policy-dev' && inputs.trial_ids != 'agent41-bilateral-v2-dev' }}
        env:
          AGENT41_PARTITION: ${{ inputs.agent41_crossrank_partition || '0' }}
        run: node simulation/evaluation/agent41-crossrank-actual-decisions.cjs > agent41-crossrank-observed.json
      - name: Print bounded failures, decisions and source opportunity counts
        if: ${{ inputs.agent41_crossrank_trial && !inputs.agent6_rejected_arm && !inputs.agent6_shadow_mist_supporter && !inputs.agent25_rank6_newmoon_pass && !inputs.agent25_rank6_farewell_live && inputs.trial_ids != 'agent17-four-trigger-forensic' && inputs.trial_ids != 'agent17-crossrank-cap-tail' && inputs.trial_ids != 'agent2-stone-recipient' && inputs.trial_ids != 'agent2-stone-star' && inputs.trial_ids != 'agent8-player-lock-veto' && inputs.trial_ids != 'agent41-common-policy-dev' && inputs.trial_ids != 'agent41-bilateral-v2-dev' }}
        run: node -e "const a=require('./agent41-crossrank-observed.json');console.log(JSON.stringify({partition:a.partition,recorded:a.partitionRecorded,status:a.statusCounts,opportunities:a.sourceOpportunityCounts,sourceFirst:a.actualSourceFirstCount,attackDeclarations:a.observedAttackDeclarations,matchedSourceHands:a.pairedSourceHandAgreement,paired:a.pairedTotal,errors:a.rows.filter(x=>x.status==='engine-error').map(x=>({id:x.id,error:x.error?.slice(0,250)}))},null,2))"
      - name: Replay original Agent41 rank6 rejected root and capture legal owner information
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent6_rejected_arm }}
        run: node simulation/evaluation/agent6-crossrank-rejected-root.cjs > agent6-crossrank-rejected-root.json
      - name: Verify actor-visible rank6 opener restrictions and held Supporter decisions
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent6_shadow_mist_supporter }}
        run: node --test tests/rank6-broad-thorns-policy.test.cjs tests/visible-lock-supporter-response.test.cjs tests/player-play-lock-veto.test.cjs
      - name: Replay held Supporter response to real Shadow Mist restriction
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent6_shadow_mist_supporter }}
        run: node simulation/evaluation/agent6-shadow-mist-source-supporter.cjs > agent6-shadow-mist-supporter.json
      - name: Print bounded owner-visible reply and post-reply status
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent6_shadow_mist_supporter }}
        run: node -e "const x=require('./agent6-shadow-mist-supporter.json');console.log(JSON.stringify({trial:x.frozenTrialId,choices:x.decisions,error:x.error?.slice(0,700)||null,sourcePolicy:x.result?.sourcePolicyAudit,actions:x.result?.actions,status:x.result?.status,attacks:x.result?.sourceAttackDeclarations,prizes:x.result?.prizesRemaining},null,2))"
      - name: Test retrospective first-response probe isolation and own-hand evidence
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent25_rank6_newmoon_pass }}
        run: node --test tests/agent25-rank6-newmoon-first-pass-audit.test.cjs tests/newmoon-rank6-pass-farewell-observer.test.cjs
      - name: Replay one true-source New Moon turn-three first response with after-Pass legality probe
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent25_rank6_newmoon_pass }}
        run: node simulation/evaluation/agent25-rank6-newmoon-first-pass-audit.cjs > agent25-rank6-newmoon-first-pass.json
      - name: Print bounded candidate Pass and probe result
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent25_rank6_newmoon_pass }}
        run: node -e "const a=require('./agent25-rank6-newmoon-first-pass.json');console.log(JSON.stringify({trial:a.trialId,rootStable:a.sourceRootLedgerMatchesArchived,pass:a.firstCandidateTurn3?.passOrdinal,ownHand:a.firstCandidateTurn3?.ownerHandAtPass,attackCandidates:a.firstCandidateTurn3?.alreadyChosenPassAttackProbe?.tested,qualified:a.competitiveQualifiedGames},null,2))"
      - name: Test selected owner-visible Farewell counterfactual gate
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent25_rank6_farewell_live }}
        run: node --test tests/agent25-rank6-farewell-continue.test.cjs
      - name: Continue the exact source-dealt turn-three owner Pass with one live Farewell
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent25_rank6_farewell_live }}
        run: node simulation/evaluation/agent25-rank6-farewell-continue.cjs > agent25-rank6-farewell-live.json
      - name: Print actual Ability effect and post-choice continuation without strength inference
        if: ${{ inputs.agent41_crossrank_trial && inputs.agent25_rank6_farewell_live }}
        run: node -e "const x=require('./agent25-rank6-farewell-live.json');console.log(JSON.stringify({trial:x.trialId,selected:x.policyAudit.submitted,actualAbility:x.firstRealFarewellAbilityCount,turn3:x.turn3To5CandidateDecisions,game:x.outcome,error:x.error?.slice(0,600),qualified:x.competitiveQualifiedGames},null,2))"
      - name: Verify candidate Forest Seal Stone owner-only policy
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent2-stone-recipient' }}
        run: node --test tests/forest-stone-v-recipient-policy.test.cjs
      - name: Replay archived rank6 seed with conservative Forest Seal Stone recipient
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent2-stone-recipient' }}
        run: node simulation/evaluation/agent2-rank6-stone-v-recipient-pair.cjs > agent2-rank6-stone-recipient.json
      - name: Print frozen source and candidate reply differences without strength inference
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent2-stone-recipient' }}
        run: node -e "const x=require('./agent2-rank6-stone-recipient.json');console.log(JSON.stringify({source:x.trialId,seed:x.seed,baselineStable:x.baselineOriginalLedgerVerified,sameFirstHand:x.sameSourceFirstHand,baseline:x.baseline,treated:x.treated,stone:x.stonePolicyEvents,qualified:x.competitiveQualifiedGames},null,2))"
      - name: Verify candidate-only V-family holder and Stone placement policy
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent2-stone-star' }}
        run: node --test tests/candidate-stone-star-alchemy-policy.test.cjs tests/forest-stone-v-recipient-policy.test.cjs
      - name: Replay source-locked rank6 with Stone recipient and Star Alchemy proposal
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent2-stone-star' }}
        run: node simulation/evaluation/agent2-rank6-stone-star-composition.cjs > agent2-rank6-stone-star.json
      - name: Print actual source-dealt Stone and Star Alchemy decision evidence
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent2-stone-star' }}
        run: node -e "const x=require('./agent2-rank6-stone-star.json');console.log(JSON.stringify({trial:x.trialId,seed:x.seed,sourceTurn2:x.sourceTurn2Complete,stone:x.stoneAllocationEvents,starProposals:x.starAlchemyProposalEvents,accepted:x.acceptedStarAlchemy,firstDecisions:x.candidateActionsToTurn9,attacks:x.candidateAttackDeclarations,sourceAttacks:x.sourceAttackDeclarations,cap:x.status,prizes:x.prizesRemaining,qualified:x.competitiveQualifiedGames},null,2))"
      - name: Verify actor-visible attack-sourced Stadium and Special Energy lock guard
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent8-player-lock-veto' }}
        run: node --test tests/player-play-lock-veto.test.cjs
      - name: Reproduce and veto the original rank-6 Shadow Mist error on an unchanged source deal
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent8-player-lock-veto' }}
        run: node simulation/evaluation/agent8-player-play-lock-replay.cjs > agent8-player-play-lock.json
      - name: Report policy veto and subsequent Store behavior as unqualified
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent8-player-lock-veto' }}
        run: node -e "const r=require('./agent8-player-play-lock.json');console.log(JSON.stringify({source:r.frozenTrialId,prior:r.originalFailureRoot,originalPlayLocks:r.originalPlayLocks,blocked:r.policyAudit.rejections,considered:r.policyAudit.considered,vetoObserved:r.vetoObserved,originalRejectionPrevented:r.originalRejectionPrevented,guardedError:r.guardedError?.slice(0,450),guarded:r.guardedGame,qualified:r.competitivelyQualifiedGames}))"
      - name: Verify source-locked trial adapter and guards
        run: node --test tests/aichi-campaign-runner.test.cjs tests/aichi-setup-zone-capture.test.cjs tests/aichi-comparison-campaign.test.cjs tests/aichi-new-moon-admission.test.cjs tests/rank11-autonomous-opener.test.cjs tests/rank11-autonomous-campaign-seat.test.cjs tests/rank11-first-turn-screen.test.cjs tests/rank11-conditional-k0-screen-run.test.cjs tests/rank11-conditional-k0-complete.test.cjs tests/rank11-k0-selected-continuations-run.test.cjs tests/aichi-campaign-attack-observer-screen.test.cjs tests/rank26-autonomous-cologne.test.cjs tests/rank26-exeggcute-pump-policy.test.cjs tests/rank26-propagation-loop.test.cjs tests/rank11-autonomous-supporter-profile.test.cjs
      - name: Verify precommitted rank11 exposure reporter and fail-closed source identity
        if: ${{ inputs.rank11_exposure_probe }}
        run: node --test tests/rank11-prospective-exposure.test.cjs tests/rank11-prospective-exposure-run.test.cjs
      - name: Validate first-own-turn VIP owner-visible policy semantics
        if: ${{ inputs.newmoon_vip_probe }}
        run: node --test tests/newmoon-first-own-vip.test.cjs
      - name: Run precommitted two-rank paired New Moon owner-VIP mechanic probes
        if: ${{ inputs.newmoon_vip_probe }}
        run: node simulation/evaluation/newmoon-first-own-vip-prospective.cjs > newmoon-vip-prospective.json
      - name: Print complete source-deal VIP intervention tally without winners
        if: ${{ inputs.newmoon_vip_probe }}
        run: node -e "const x=require('./newmoon-vip-prospective.json');console.log(JSON.stringify({registration:x.registration,attempted:x.observedAttempts,starts:x.verifiedActualStartingOrders,legalVIP:x.legalVIPDispatches,promptChosen:x.ownerPromptValidSelections,exceptions:x.falseOrFailedAttempts,records:x.observations.map(o=>({id:o.trialId,seed:o.seed,actualFirst:o.firstTurnSlot,vip:o.policyAudit?.selectedLegalVip??false,chosen:o.policyAudit?.validatedSearchSelection??false,status:o.status,error:o.error?.split('\\n')[0]}))},null,2))"
      - name: Authenticate ranked source K0 screen before the first real bot action
        if: ${{ inputs.rank11_first_screen }}
        run: node simulation/twinleaf/rank11-first-turn-source-screen.cjs > rank11-first-turn-source-screen.json
      - name: Screen a bounded precommitted rank11 conditional K0 partition
        if: ${{ inputs.rank11_conditional_k0_screen }}
        env:
          RANK11_K0_PARTITION: ${{ inputs.rank11_k0_partition || '0' }}
        run: node simulation/evaluation/rank11-conditional-k0-dispatch.cjs > rank11-conditional-K0-screen.json
      - name: Summarize complete K0 partition denominator without winner scores
        if: ${{ inputs.rank11_conditional_k0_screen }}
        run: node -e "const r=require('./rank11-conditional-K0-screen.json');console.log(JSON.stringify({registration:r.registrationSha256,partition:r.partition??'all',attempted:r.attempted??r.attempts,actualSourceFirst:r.actualSourceFirst??r.records.filter(x=>x.sourceFirst===true).length,selectedK0:r.selectedK0,verifiedNonK0:r.verifiedNonK0,unverified:r.unverifiedDraw,exceptions:r.screenExceptions,selectedSeeds:r.records.filter(x=>x.status==='selected-K0').map(x=>x.seed),qualified:r.qualifiedCompetitiveGames}));"
      - name: Replay five K0-selected source openings under autonomous rank11 policy
        if: ${{ inputs.rank11_k0_continuation }}
        run: node simulation/evaluation/rank11-k0-selected-continuations-run.cjs > rank11-K0-continuations.json
      - name: Summarize source-replay and lock witnesses without game win claims
        if: ${{ inputs.rank11_k0_continuation }}
        run: node -e "const r=require('./rank11-K0-continuations.json');console.log(JSON.stringify({registered:r.registrationSha256,attempted:r.attempted,lockWitnesses:r.completeLockWitnesses,incomplete:r.incompleteBranches,replayMismatch:r.replayMismatches,exceptions:r.exceptions,details:r.records.map(x=>({index:x.index,seed:x.seed,status:x.status,actions:x.policyAudit?.attemptedActions,aborted:x.policyAudit?.aborted,opponentResponse:x.firstCandidateResponse})),qualified:r.qualifiedCompetitiveGames}));"
      - name: Execute one fixed 16-trial rank11 true-turn exposure partition
        if: ${{ inputs.rank11_exposure_probe }}
        env:
          RANK11_EXPOSURE_PARTITION: ${{ inputs.rank11_exposure_partition || '0' }}
        run: node simulation/evaluation/rank11-prospective-exposure-run.cjs > rank11-prospective-exposure-observed.json
      - name: Replay one genuine rank11 opening under the automatic policy
        if: ${{ inputs.rank11_autonomous_probe }}
        run: node simulation/twinleaf/rank11-autonomous-source-regression.cjs > rank11-autonomous-source-regression.json
      - name: Compare two frozen candidate inventories against the identical rank11 automatic policy
        if: ${{ inputs.rank11_autonomous_probe }}
        env:
          CAMPAIGN_SEED_PROTOCOL: decorrelated-slots-v3
        run: node simulation/evaluation/aichi-rank11-autonomous-comparison.cjs > rank11-autonomous-comparison.json
      - name: Pair New Moon and champion with source-first rank11 policy
        if: ${{ inputs.rank11_autonomous_probe }}
        run: node simulation/evaluation/rank11-newmoon-autonomous-pair.cjs > aichi-rank11-newmoon-autonomous-pair.json
      - name: Resolve one genuine New Moon Field Blower hand against autonomous rank11 Garbotoxin
        if: ${{ inputs.rank11_autonomous_probe }}
        run: node simulation/twinleaf/newmoon-rank11-real-hand-blower-response.cjs > newmoon-rank11-real-blower-response.json
      - name: Audit source New Moon attack passes without policy intervention
        if: ${{ inputs.newmoon_pass_probe }}
        run: node simulation/evaluation/newmoon-rank11-pass-observer.cjs > newmoon-rank11-pass-observer.json
      - name: Run up to six source-locked pilot trials
        if: ${{ !inputs.setup_order_probe && !inputs.setup_multiseed_audit && !inputs.hood_source_turn_audit && !inputs.rank11_autonomous_probe && !inputs.rank11_exposure_probe && !inputs.rank11_first_screen && !inputs.rank11_conditional_k0_screen && !inputs.rank11_k0_continuation && !inputs.newmoon_pass_probe && !inputs.newmoon_vip_probe && !inputs.agent41_crossrank_trial }}
        env:
          CAMPAIGN_INPUT_ORDER_PROTOCOL: ${{ inputs.input_order_protocol || 'source-row-order-v1' }}
          CAMPAIGN_SEED_PROTOCOL: ${{ inputs.seat_seed_protocol || 'decorrelated-slots-v3' }}
          CAMPAIGN_POLICY_PROFILE: ${{ inputs.policy_profile }}
          CAMPAIGN_CAPTURE_DECISIONS: 'true'
          CAMPAIGN_POST_SUPER_ALIAS_REPAIR: ${{ inputs.post_super_clone }}
          CAMPAIGN_ATTACHED_TOOL_POWER: ${{ inputs.attached_tool_power }}
          CAMPAIGN_PHASE: pilot
          CAMPAIGN_MAX_TRIALS: '6'
          CAMPAIGN_TRIAL_IDS: ${{ inputs.trial_ids || 'pilot:6:0:champion-reference:A,pilot:6:0:champion-reference:B,pilot:6:0:hood-shield-v1:A,pilot:6:0:hood-shield-v1:B,pilot:6:0:temple-v1:A,pilot:6:0:temple-v1:B' }}
          CAMPAIGN_MAX_ACTIONS: '800'
        run: node simulation/evaluation/aichi-campaign-runner.cjs > aichi-campaign-report.json
      - name: Print recorded source-seat actions and attack declarations
        if: ${{ !inputs.setup_order_probe && !inputs.setup_multiseed_audit && !inputs.hood_source_turn_audit && !inputs.rank11_autonomous_probe && !inputs.rank11_exposure_probe && !inputs.rank11_first_screen && !inputs.rank11_conditional_k0_screen && !inputs.rank11_k0_continuation && !inputs.newmoon_pass_probe && !inputs.newmoon_vip_probe && !inputs.agent41_crossrank_trial }}
        env:
          CAMPAIGN_TRIAL_IDS: ${{ inputs.trial_ids || 'pilot:6:0:champion-reference:A,pilot:6:0:champion-reference:B,pilot:6:0:hood-shield-v1:A,pilot:6:0:hood-shield-v1:B,pilot:6:0:temple-v1:A,pilot:6:0:temple-v1:B' }}
        run: |
          node --test tests/aichi-source-action-brief.test.cjs
          node scripts/aichi-source-action-brief.cjs aichi-campaign-report.json
      - name: Reconcile source rank26 v3 proposed tactics and actual Store dispatch
        if: ${{ inputs.policy_profile == 'rank26-autonomous-cologne-pump-propagation-v3' && !inputs.setup_order_probe && !inputs.setup_multiseed_audit && !inputs.hood_source_turn_audit && !inputs.rank11_autonomous_probe && !inputs.rank11_exposure_probe && !inputs.rank11_first_screen && !inputs.rank11_conditional_k0_screen && !inputs.rank11_k0_continuation && !inputs.newmoon_pass_probe && !inputs.newmoon_vip_probe && !inputs.agent41_crossrank_trial }}
        run: |
          node --test tests/aichi-rank26-v3-action-brief.test.cjs
          node scripts/aichi-rank26-v3-action-brief.cjs aichi-campaign-report.json
      - name: Cross-check sourced games and fingerprint evidence envelope
        if: ${{ !inputs.setup_order_probe && !inputs.setup_multiseed_audit && !inputs.hood_source_turn_audit && !inputs.rank11_autonomous_probe && !inputs.rank11_exposure_probe && !inputs.rank11_first_screen && !inputs.rank11_conditional_k0_screen && !inputs.rank11_k0_continuation && !inputs.newmoon_pass_probe && !inputs.newmoon_vip_probe && !inputs.agent41_crossrank_trial }}
        env:
          CAMPAIGN_SEED_PROTOCOL: ${{ inputs.seat_seed_protocol || 'decorrelated-slots-v3' }}
        run: node simulation/evaluation/aichi-campaign-envelope-runner.cjs aichi-campaign-report.json aichi-campaign-envelope.json
      - name: Probe true post-setup zones under same v3 seed
        if: ${{ inputs.setup_order_probe && !inputs.setup_observer_audit && !inputs.setup_multiseed_audit }}
        run: node simulation/evaluation/aichi-input-order-deal-probe.cjs > aichi-setup-order-probe.json
      - name: Audit root Store setup observer noninterference
        if: ${{ inputs.setup_order_probe && inputs.setup_observer_audit && !inputs.setup_multiseed_audit }}
        run: node simulation/evaluation/aichi-setup-observer-noninterference.cjs > aichi-setup-observer-audit.json
      - name: Audit source-dealt Hood and reference decisions in both actual starts
        if: ${{ inputs.hood_source_turn_audit }}
        run: node simulation/evaluation/aichi-hood-source-turn-comparison.cjs > aichi-hood-source-turn-comparison.json
      - name: Sample true source setups across ranks and independent seeds
        if: ${{ inputs.setup_multiseed_audit }}
        run: node simulation/evaluation/aichi-multiseed-setup-coupling.cjs > aichi-multiseed-setup-coupling.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aichi-rank6-${{ inputs.policy_profile }}-decisions
          path: |
            aichi-campaign-report.json
            aichi-campaign-envelope.json
            aichi-setup-order-probe.json
            aichi-setup-observer-audit.json
            aichi-multiseed-setup-coupling.json
            aichi-hood-source-turn-comparison.json
            rank11-autonomous-source-regression.json
            rank11-first-turn-source-screen.json
            rank11-conditional-K0-screen.json
            rank11-K0-continuations.json
            rank11-prospective-exposure-observed.json
            agent41-crossrank-observed.json
            agent17-crossrank-trigger-evidence.json
            agent17-crossrank-resolved-audit.json
            agent17-crossrank-censor-tail.json
            agent6-crossrank-rejected-root.json
            agent6-shadow-mist-supporter.json
            agent25-rank6-newmoon-first-pass.json
            agent2-rank6-stone-recipient.json
            agent2-rank6-stone-star.json
            agent8-player-play-lock.json
            agent25-rank6-farewell-live.json
            newmoon-vip-prospective.json
            aichi-rank11-newmoon-autonomous-pair.json
            newmoon-rank11-pass-observer.json
            rank11-autonomous-comparison.json
            newmoon-rank11-real-blower-response.json
          retention-days: 14
