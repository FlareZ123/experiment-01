name: Aichi source-locked Iron Thorns policy diagnostic

on:
  workflow_dispatch:
    inputs:
      agent41_crossrank_trial:
        description: 'Execute prespecified rank 6 and rank 11 two-candidate owner-policy screen'
        required: false
        type: boolean
        default: false
      agent41_dev_options:
        description: 'Comma-separated: mandatory-options,native-pressure,sourcefirst-retro,late-compressor,hidden-read,partition1,actor-policy,choose-pokemon,charged-promotion (omit for defaults)'
        required: false
        type: string
        default: ''
      agent25_rank6_farewell_live:
        description: 'One retrospectively selected rank6 actual-game owner Farewell-over-Pass continuation'
        required: false
        type: boolean
        default: false
      agent25_rank6_newmoon_pass:
        description: 'Replay one archived New Moon first reply with read-only post-pass attack probe'
        required: false
        type: boolean
        default: false
      agent6_rejected_arm:
        description: 'Audit just the archived rank6 rejected PlayCardAction at fixed source seed'
        required: false
        type: boolean
        default: false
      agent6_shadow_mist_supporter:
        description: 'Retrospective one-deal held Supporter instead of Shadow Mist-blocked Stadium'
        type: boolean
        required: false
        default: false
      trial_ids:
        description: 'Pilot trial IDs (up to six); agent17-four-trigger-forensic with agent41=true selects retrospective replay'
        required: false
        type: string
        default: ''
      policy_profile:
        description: Research bot decision profile
        required: true
        default: expanded-action-fidelity-probe-v1
        type: choice
        options:
          - simple-default-v0
          - simple-supporter-guard-v1
          - expanded-action-fidelity-probe-v1
          - rank11-autonomous-boostshake-v1
          - rank11-autonomous-first-own-turn-v2
          - rank11-autonomous-boostshake-supporter-v2
          - rank26-autonomous-cologne-v1
          - rank26-autonomous-cologne-pump-v2
          - rank26-autonomous-cologne-pump-propagation-v3
      newmoon_vip_probe:
        description: Precommitted 16 source deals, two hard ranks, both real starts, candidate-first VIP policy
        required: false
        type: boolean
        default: false
      newmoon_pass_probe:
        description: 'Observe cloned legal attack options after New Moon Bot Pass, no gameplay intervention'
        required: false
        type: boolean
        default: false
      rank11_autonomous_probe:
        description: Execute one source-rank11 automatic lock policy diagnostic (unqualified)
        required: false
        type: boolean
        default: false
      rank11_first_screen:
        description: Validate reversible genuine Store rank11 first-turn K0 screening (unqualified)
        required: false
        type: boolean
        default: false
      rank11_k0_continuation:
        description: Execute five preregistered K0-selected authentic source-policy continuations, no win estimate
        required: false
        type: boolean
        default: false
      rank11_conditional_k0_screen:
        description: Screen precommitted 32 source-dealt rank11 K0 seeds, no matches
        required: false
        type: boolean
        default: false
      rank11_k0_partition:
        description: Fixed K0 screening partition 0 to 15, or all 512 in one job
        required: false
        type: string
        default: '0'
      rank11_exposure_probe:
        description: Test a precommitted 16-trial actual-first-turn rank11 partition (unqualified)
        required: false
        type: boolean
        default: false
      rank11_exposure_partition:
        description: Fixed registered repeat partition 0, 1, 2 or 3
        required: false
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
        default: '0'
      post_super_clone:
        description: 'Experimental v2 speculative Simulator repair; does not qualify game strength'
        required: false
        type: boolean
        default: false
      attached_tool_power:
        description: 'Equal-seat Tool-granted Ability candidate policy; unqualified'
        required: false
        type: boolean
        default: false
      setup_multiseed_audit:
        description: 'Run bounded multi-rank, multi-seed first-turn captures only; unqualified'
        required: false
        type: boolean
        default: false
      hood_source_turn_audit:
        description: 'Source rank6 two-start Hood/Arven decisions under unchanged generic bots; unqualified'
        required: false
        type: boolean
        default: false
      setup_observer_audit:
        description: 'With setup_order_probe: observer noninterference; with setup_multiseed_audit: ordered source-deal fingerprint'
        required: false
        type: boolean
        default: false
      setup_order_probe:
        description: 'Run matched source-deal setup experiment instead of full games (unqualified)'
        required: false
        type: boolean
        default: false
      input_order_protocol:
        description: 'Preserve historical source order or opt in to aligned candidate input'
        required: false
        type: choice
        options:
          - source-row-order-v1
          - reference-aligned-v1
        default: source-row-order-v1
      seat_seed_protocol:
        description: 'v3 default; explicitly choose v2 only to replay historical diagnostics'
        required: false
        type: choice
        options:
          - independent-slots-v2
          - decorrelated-slots-v3
        default: decorrelated-slots-v3

permissions:
  contents: read

jobs:
  source-locked-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned simulator revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install simulator dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned simulator
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate registered both-seat original rank6 Volt donor replay runner
        if: ${{ inputs.trial_ids == 'agent45-volt-donor-retro-pair-v1' }}
        run: |
          node --check simulation/evaluation/agent45-retrospective-volt-donor-native-pair.cjs
          node --test tests/agent45-volt-donor-printed-cost-hook.test.cjs tests/agent45-volt-cyclone-donor-debt.test.cjs
      - name: Replay original physical rank6 source-deal control and alternative native donor
        if: ${{ inputs.trial_ids == 'agent45-volt-donor-retro-pair-v1' }}
        run: node simulation/evaluation/agent45-retrospective-volt-donor-native-pair.cjs > agent45-donor-fork-summary.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.trial_ids == 'agent45-volt-donor-retro-pair-v1' }}
        with:
          name: agent45-rank6-retrospective-both-seat-native-donor-pair
          path: |
            agent45-retrospective-volt-donor-native-pair.json
            agent45-donor-fork-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test pure optional source Volt physical donor preference
        if: ${{ inputs.trial_ids == 'agent45-volt-donor-native-v1' }}
        run: |
          node --check simulation/twinleaf/agent45-volt-donor-printed-cost-hook.cjs
          node --check simulation/twinleaf/agent45-volt-donor-native-staged.cjs
          node --test tests/agent45-volt-donor-printed-cost-hook.test.cjs tests/agent45-volt-cyclone-donor-debt.test.cjs
      - name: Verify paper-guarded native source Volt donation in both physical seats
        if: ${{ inputs.trial_ids == 'agent45-volt-donor-native-v1' }}
        run: node simulation/twinleaf/agent45-volt-donor-native-staged.cjs > agent45-volt-donor-native-staged.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.trial_ids == 'agent45-volt-donor-native-v1' }}
        with:
          name: agent45-two-seat-paper-guarded-volt-donor
          path: agent45-volt-donor-native-staged.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify prepared rank29 Peonia source-print optional 1/2/3 Prize native prompts on both physical seats
        if: ${{ inputs.trial_ids == 'agent39-peonia-native-v1' }}
        run: |
          node --check simulation/twinleaf/agent39-rank29-peonia-original-print-native.cjs
          node simulation/twinleaf/agent39-rank29-peonia-original-print-native.cjs > agent39-rank29-peonia-native.json
          node -e "const assert=require('node:assert/strict');const r=require('./agent39-rank29-peonia-native.json');assert.equal(r.records.length,6);assert.ok(r.records.every(x=>x.fullPromptChainClosed&&x.physicalCoreRetrieved&&x.competitiveQualifiedGames===0));assert.equal(r.revisitCases.length,2);assert.ok(r.revisitCases.every(x=>x.firstActualPeoniaSettled&&x.fixedFirstThreeCanRecoverCritical===false&&x.laterSecondPeoniaActuallyPlayed===false));console.log(JSON.stringify({schema:r.schema,records:r.records,competitiveQualifiedGames:0},null,2))"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.trial_ids == 'agent39-peonia-native-v1' }}
        with:
          name: agent39-rank29-peonia-original-print-native
          path: agent39-rank29-peonia-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Execute two physical seats with real Peonia Lusamine Peonia separated by native turns
        if: ${{ inputs.trial_ids == 'agent39-peonia-real-turns-v1' }}
        run: |
          node --check simulation/twinleaf/agent39-rank29-peonia-turnseparated-native.cjs
          node simulation/twinleaf/agent39-rank29-peonia-turnseparated-native.cjs > agent39-rank29-peonia-real-turns.json
          node -e "const assert=require('node:assert/strict');const r=require('./agent39-rank29-peonia-real-turns.json');assert.equal(r.cases.length,4);for(const x of r.cases){assert.equal(x.transitions.length,4);assert.equal(x.competitivelyQualifiedGames,0);assert.equal(x.physicallyRecoveredCriticalHandiwork,x.treatment==='complement')}console.log(JSON.stringify(r,null,2))"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.trial_ids == 'agent39-peonia-real-turns-v1' }}
        with:
          name: agent39-rank29-peonia-actual-turn-fork
          path: agent39-rank29-peonia-real-turns.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify source-only Float Stone actor-root mobility selection
        if: ${{ inputs.trial_ids == 'agent1-floatstone-native-pair' }}
        run: node --test tests/agent1-owner-float-stone-mobility.test.cjs tests/agent34-actor-only-root-policy.test.cjs
      - name: Reuse exact historical source-first Store deals with and without owner Float Stone roots
        if: ${{ inputs.trial_ids == 'agent1-floatstone-native-pair' }}
        run: node scripts/agent1-floatstone-native-pair.cjs > agent1-floatstone-native-pair.json
      - name: Classify accepted genuine source mobility and game limitations
        if: ${{ inputs.trial_ids == 'agent1-floatstone-native-pair' }}
        run: node -e "const r=require('./agent1-floatstone-native-pair.json');console.log('DEALS_MATCH',r.sameFourPhysicalSourceDeals,'STARTS_MATCH',r.sameFourActualStarters,'SOURCE_FIRST',r.actualSourceFirstAll);for(const p of r.pairs)console.log('FLOAT_PAIR',JSON.stringify({id:p.id,actionEqual:p.identicalRootLedger,controlRoots:p.baselineRoots,treatmentRoots:p.treatmentRoots,firstChange:p.firstDifferingTreatmentRoot,selected:p.sourceMobilitySelectedRootCounts,accepted:p.acceptedMobilityRoots,controlWinner:p.baselineWinner,treatmentWinner:p.treatmentWinner,controlPrizes:p.baselinePrizes,treatmentPrizes:p.treatmentPrizes}));console.log('COMPETITIVE_GAMES',r.competitiveQualifiedGames)"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.trial_ids == 'agent1-floatstone-native-pair' }}
        with:
          name: agent1-source-floatstone-original-store-pair
          path: agent1-floatstone-native-pair.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test generic own-Bench charged promotion selector
        if: ${{ inputs.trial_ids == 'agent1-charged-promotion-pair' }}
        run: node --test tests/agent1-charged-promotion-choice.test.cjs tests/agent8-actor-only-choose-pokemon.test.cjs tests/agent41-bilateral-v2-development.test.cjs
      - name: Execute full historical same-deal baseline versus charged promotion
        if: ${{ inputs.trial_ids == 'agent1-charged-promotion-pair' }}
        run: node scripts/agent1-charged-promotion-native-pair.cjs > agent1-charged-promotion-native-pair.json
      - name: Summarize physical deals, genuine prompt selection and result limitations
        if: ${{ inputs.trial_ids == 'agent1-charged-promotion-pair' }}
        run: node -e "const r=require('./agent1-charged-promotion-native-pair.json');console.log('UNCHANGED_DEALS',r.allFourSameSourceDeals,'UNCHANGED_STARTS',r.allFourSameActualStarters);for(const p of r.pairs)console.log('HISTORICAL_PAIR',JSON.stringify({id:p.id,status:[p.baselineStatus,p.treatmentStatus],sameDeal:p.sameSourceDeal,sameStarter:p.sameActualStarter,firstDifference:p.commonPrefixRootCount,rootEqual:p.identicalRootLedger,win:[p.baselineWinner,p.treatmentWinner],prizes:[p.baselinePrizes,p.treatmentPrizes]}));console.log('COMPETITIVE_GAMES',r.competitiveQualifiedGames)"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.trial_ids == 'agent1-charged-promotion-pair' }}
        with:
          name: agent1-charged-promotion-historical-native-pair
          path: agent1-charged-promotion-native-pair.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify both-seat actor-only root and authenticated Fog decision seams
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-actor-sourcefirst-v1' }}
        run: |
          node --check simulation/twinleaf/agent17-actor-fog-sourcefirst-development.cjs
          node --test tests/agent34-actor-only-root-policy.test.cjs tests/agent9-fog-actor-prompt.test.cjs
      - name: Run retrospective source-first rank6 and rank11 under the identical actor policy
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-actor-sourcefirst-v1' }}
        run: node simulation/twinleaf/agent17-actor-fog-sourcefirst-development.cjs > agent17-actor-sourcefirst.json
      - name: Summarize source pressure opportunities and real Store acceptances
        if: ${{ always() && inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-actor-sourcefirst-v1' }}
        run: node -e "const fs=require('node:fs');if(fs.existsSync('agent17-actor-sourcefirst.json')){const r=require('./agent17-actor-sourcefirst.json');console.log(JSON.stringify({roots:r.nativeRootAudit,fog:r.fogAudit,errors:r.errorCount,rows:r.rows.map(x=>({trial:x.trial,status:x.status,actualSourceFirst:x.actualSourceFirst,sourceLine:x.sourceLine,candidateReplyStatus:x.candidateReplyStatus,error:x.error?.slice(0,350)||null}))},null,2));}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-actor-sourcefirst-v1' }}
        with:
          name: agent17-actor-sourcefirst-hardrank-development
          path: agent17-actor-sourcefirst.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test the identical bilateral candidate policy wrapper (development only)
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-common-policy-dev' }}
        run: node --test tests/agent41-bilateral-common-policy.test.cjs tests/agent41-bilateral-v2-fingerprints.test.cjs
      - name: Reproduce pinned Store Iron Thorns ex paper prompt bypass on both seats
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' && contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-portfolio,') }}
        run: node simulation/twinleaf/agent39-volt-cyclone-paper-native.cjs
      - name: Test pinned Store duplicate physical-card search selection and pre-dispatch veto
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' && contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-portfolio,') }}
        run: node simulation/twinleaf/agent39-duplicate-card-native.cjs
      - name: Verify common v2 candidate policy and historical-only development identities
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' }}
        run: node --test tests/agent41-bilateral-common-policy.test.cjs tests/agent41-bilateral-v2-development.test.cjs tests/agent39-paper-prompt-portfolio.test.cjs tests/agent39-paper-prompt-root-reconciliation.test.cjs tests/agent39-paper-distinct-selection.test.cjs tests/perfection-post-pass-probe.test.cjs tests/aichi-bilateral-pass-evidence-summary.test.cjs tests/agent41-bilateral-mandatory-option-wiring.test.cjs tests/agent41-bilateral-native-pressure-wiring.test.cjs tests/agent41-native-opponent-hidden-read-observer.test.cjs tests/agent1-charged-promotion-choice.test.cjs
      - name: Exact same-head original four-arm Store prompt guard noninterference A/B
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' && contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-pair,') }}
        run: node scripts/agent39-paper-prompt-native-noninterference-pair.cjs
      - name: Run four existing v1 deals with an explicit opt-in bilateral policy variant
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' && !contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-pair,') }}
        env:
          AGENT41_MANDATORY_OPTION_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',mandatory-options,') && 'true' || 'false' }}
          AGENT41_NATIVE_PRESSURE_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',native-pressure,') && 'true' || 'false' }}
          AGENT41_SOURCEFIRST_RETRO_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',sourcefirst-retro,') && 'true' || 'false' }}
          AGENT5_COMPR_LATE14_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',late-compressor,') && 'true' || 'false' }}
          AGENT41_NATIVE_HIDDEN_READ_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',hidden-read,') && 'true' || 'false' }}
          AGENT39_PAPER_PROMPT_PORTFOLIO_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-portfolio,') && 'true' || 'false' }}
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',actor-policy,') && 'true' || 'false' }}
          AGENT8_ACTOR_CHOOSE_POKEMON_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',choose-pokemon,') && 'true' || 'false' }}
          AGENT1_CHARGED_PROMOTION_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',charged-promotion,') && 'true' || 'false' }}
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent41-bilateral-v2-development.json
      - name: Summarize all development failures and attempted arms, without competitive outcomes
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' && !contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-pair,') }}
        run: node -e "const d=require('./agent41-bilateral-v2-development.json');for(const r of d.rows)console.log('DEVELOPMENT',JSON.stringify({id:r.trial?.id,errors:r.error?.slice(0,350)||null,actualSourceFirst:r.sourceActuallyFirst,actions:r.actionCount,attacks:r.attackDeclarations,closed:r.settledPublicAttackCount,prizes:r.finalPrizes,finished:r.finished,policy:r.policyVersion}));console.log('SOURCE_PAIRS',JSON.stringify(d.sourcePairs.map(p=>({id:p.pairId,sameSourceDeal:p.sameSourcePhysicalDeal,sameStarter:p.sameActualStarter,followups:p.candidateFollowupStatuses}))));console.log('UNQUALIFIED',d.competitiveQualifiedGames,'of',d.attempted)"
      - name: Extract candidate Pass opportunities from historical development evidence only
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' && !contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-pair,') }}
        run: |
          node --test tests/aichi-bilateral-pass-evidence-summary.test.cjs
          node scripts/aichi-bilateral-pass-evidence-summary.cjs agent41-bilateral-v2-development.json
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-bilateral-v2-dev' && !contains(format(',{0},', inputs.agent41_dev_options), ',paper-prompt-pair,') }}
        with:
          name: agent41-bilateral-v2-historical-development
          path: agent41-bilateral-v2-development.json
          retention-days: 10
      - name: Verify fail-closed same-native-world read pair contract
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-hidden-read-native-pair' }}
        run: node --test tests/agent41-hidden-read-pair-attestation.test.cjs tests/agent41-native-opponent-hidden-read-observer.test.cjs tests/agent41-bilateral-v2-development.test.cjs tests/agent41-native-opponent-score-public-count-invariance.test.cjs
      - name: Replay exact four historical original Stores with native read probe off and on
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-hidden-read-native-pair' }}
        env:
          AGENT41_MANDATORY_OPTION_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',mandatory-options,') && 'true' || 'false' }}
          AGENT41_PAPER_SUPPORTER_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',paper-supporter,') && 'true' || 'false' }}
          AGENT41_NATIVE_PRESSURE_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',native-pressure,') && 'true' || 'false' }}
          AGENT41_SOURCEFIRST_RETRO_DEV: ${{ contains(format(',{0},', inputs.agent41_dev_options), ',sourcefirst-retro,') && 'true' || 'false' }}
        run: node scripts/agent41-native-hidden-read-paired.cjs > agent41-native-hidden-read-pair.json
      - name: Classify unchanged native roots and read counters, with no game win inference
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-hidden-read-native-pair' }}
        run: node -e "const p=require('./agent41-native-hidden-read-pair.json');const a=p.attestation;for(const x of a.pairs)console.log('PAIR',JSON.stringify({trial:x.trialId,status:x.status,sourceDealMatched:x.sourceDealMatched,rootMatched:x.sourceRootMatched,proposalReads:x.proposalReads,validationReads:x.validationReads,mutatedMarkers:x.changedVisibleScalarMarkers,nativeDecisionObserved:x.observedNativeRoot}));console.log('QUALIFIED_READ_CENSUS',a.fullyNoninterferingNativeReadCensuses,'of',a.attempted,'COMPETITIVE_GAMES',a.competitiveQualifiedGames);if(!a.completeNativeReadCensusQualified)process.exitCode=1"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-hidden-read-native-pair' }}
        with:
          name: agent41-native-hidden-read-paired-historical
          path: agent41-native-hidden-read-pair.json
          if-no-files-found: warn
          retention-days: 14
      - name: Print exact 60-card and shared decision-policy digests, without running games
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent41-common-policy-dev' }}
        run: node -e "const a=require('./simulation/evaluation/agent41-bilateral-v2-fingerprints.cjs').buildDraftFingerprints();console.log('DRAFT_ONLY',JSON.stringify({field:a.sourceField,champion:a.fixedCandidates['champion-reference'].englishDisplayPrinting.sha256,newMoonProxy:a.fixedCandidates['new-moon-lockbreaker-v1'].englishSimulationProxy.sha256,newMoonJapanese:a.fixedCandidates['new-moon-lockbreaker-v1'].proposedJapanesePhysicalPrinting.sha256,opponent6:a.fixedSourceOpponents[6].englishDisplayPrinting.sha256,opponent11:a.fixedSourceOpponents[11].englishDisplayPrinting.sha256,candidatePolicy:a.policies.sharedCandidate.sha256,sourcePolicy:a.policies.sourceOpponent.sha256,runner:a.policies.runnerAndEngineGlue.sha256,qualified:a.competitiveQualifiedGames}))"
      - name: Verify retrospective Store packet and frozen trigger identities
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: node --test tests/aichi-bilateral-reply-packet.test.cjs tests/agent17-crossrank-trigger-replay.test.cjs
      - name: Reexecute four original source-triggered game arms for accepted-action and reply witnesses
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
        run: node simulation/evaluation/agent17-crossrank-trigger-replay.cjs > agent17-crossrank-trigger-evidence.json
      - name: Show bounded bilateral observations without competitive inference
        if: ${{ inputs.agent41_crossrank_trial && inputs.trial_ids == 'agent17-four-trigger-forensic' }}
