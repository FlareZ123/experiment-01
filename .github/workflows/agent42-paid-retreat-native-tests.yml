name: Agent42 paid-retreat native regression suite

on:
  workflow_dispatch:
    inputs:
      run_rank5_path_fork:
        description: 'Run the one-deal Lillie then Path counterfactual'
        type: boolean
        required: false
        default: false
      run_rank5_fresh_gengar_panel:
        description: 'Fresh-seed both-seat rank5 Lillie plus Gengar ABA panel'
        type: boolean
        required: false
        default: false

      run_rank5_genesect_pressure_panel:
        description: 'Fresh rank5 Genesect native Fusion draw plus Gengar ABA'
        type: boolean
        required: false
        default: false

      run_rank5_newmoon_fog_energy_fresh_16:
        description: '48 preregistered native trials: first Fog Energy vs ordinary with VIP v2 unchanged'
        type: boolean
        required: false
        default: false

      run_rank5_newmoon_triad_v2_posthoc:
        description: 'Replay known missing-Mewtwo root8204B under v2 without prospective inference'
        type: boolean
        required: false
        default: false

      run_rank5_newmoon_triad_v2_vip:
        description: 'Prospective eight-context New Moon printed Mewtwo-first VIP v2 A-B-A'
        type: boolean
        required: false
        default: false

      run_rank5_newmoon_triad_vip:
        description: 'Prospective eight-context New Moon native owner VIP triad target A-B-A'
        type: boolean
        required: false
        default: false

      run_rank5_gengar_flexible_v2:
        description: 'Run preregistered 4-context Gengar flexible v2 versus v1'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  paid-retreat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Record pinned Twinleaf revision
        run: git -C vendor/twinleaf rev-parse HEAD
      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run paid-retreat public proposal, custody, join and native tests
        if: ${{ !inputs.run_rank5_path_fork && !inputs.run_rank5_fresh_gengar_panel && !inputs.run_rank5_genesect_pressure_panel && !inputs.run_rank5_gengar_flexible_v2 && !inputs.run_rank5_newmoon_triad_vip && !inputs.run_rank5_newmoon_triad_v2_vip && !inputs.run_rank5_newmoon_triad_v2_posthoc && !inputs.run_rank5_newmoon_fog_energy_fresh_16 }}
        run: >-
          node --test
          tests/agent42-general-paid-retreat-root-audit.test.cjs
          tests/agent42-public-two-unit-paid-retreat-proposal-v2.test.cjs
          tests/agent42-two-psychic-retreat-physical-custody-v2.test.cjs
          tests/agent42-realstore-paid-retreat-join-v2.test.cjs
          tests/agent42-two-unit-retreat-v2-actor-integration.test.cjs
          tests/agent42-two-unit-paid-retreat-native.test.cjs

      - name: Execute owner-visible Path proposal and native same-deal fork
        if: ${{ inputs.run_rank5_path_fork }}
        run: |
          node --test tests/2026-11/agent42-owner-path-to-peak-pass.test.cjs
          node simulation/evaluation/2026-11/agent42-rank5-lillie-path-counterfactual.cjs
      - name: Preserve the native Path fork and full physical tape
        if: ${{ inputs.run_rank5_path_fork && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-rank5-lillie-path-native-fork
          path: artifacts/agent42-rank5-lillie-path-counterfactual.json
          retention-days: 14

      - name: Run preregistered new-seed rank5 Gengar Lillie both-seat panel
        if: ${{ inputs.run_rank5_fresh_gengar_panel }}
        run: |
          node simulation/evaluation/2026-11/agent42-rank5-fresh-gengar-lillie-aba.cjs --preflight
          node simulation/evaluation/2026-11/agent42-rank5-fresh-gengar-lillie-aba.cjs
      - name: Archive complete original-source physical paired evidence
        if: ${{ inputs.run_rank5_fresh_gengar_panel && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-rank5-fresh-gengar-lillie-aba-8context
          path: artifacts/agent42-rank5-fresh-gengar-lillie-aba.json
          retention-days: 14

      - name: Run fresh original-source Genesect Fusion draw Gengar pressure panel
        if: ${{ inputs.run_rank5_genesect_pressure_panel }}
        run: |
          node simulation/evaluation/2026-11/agent42-rank5-genesect-pressure-gengar-aba.cjs --preflight
          node simulation/evaluation/2026-11/agent42-rank5-genesect-pressure-gengar-aba.cjs
      - name: Archive complete fresh Genesect pressure native source/response
        if: ${{ inputs.run_rank5_genesect_pressure_panel && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-rank5-genesect-gengar-fresh-8context-aba
          path: artifacts/agent42-rank5-genesect-pressure-gengar-aba.json
          retention-days: 14

      - name: Run preregistered Gengar flexible v2 versus v1 real-Store A/B/A
        if: ${{ inputs.run_rank5_gengar_flexible_v2 }}
        run: |
          node simulation/evaluation/2026-11/agent42-gengar-flexible-v2-vs-v1-aba.cjs --preflight
          node simulation/evaluation/2026-11/agent42-gengar-flexible-v2-vs-v1-aba.cjs
      - name: Archive all fresh Gengar v2 and v1 paired physical Store evidence
        if: ${{ inputs.run_rank5_gengar_flexible_v2 && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-gengar-flexible-v2-v1-fresh-4context-aba
          path: artifacts/agent42-gengar-flexible-v2-vs-v1-aba.json
          retention-days: 14

      - name: Validate owner-only New Moon triad VIP search targets against native contract
        if: ${{ inputs.run_rank5_newmoon_triad_vip }}
        run: |
          node --check simulation/twinleaf/agent9-battle-vip-owner-after-pass.cjs
          node --check simulation/evaluation/2026-11/agent20-newmoon-triad-vip-fresh-eight.cjs
          node --test tests/2026-11/agent20-newmoon-triad-vip.test.cjs tests/agent9-battle-vip-owner-after-pass.test.cjs
          node simulation/evaluation/2026-11/agent20-newmoon-triad-vip-fresh-eight.cjs --preflight
      - name: Compare preregistered original-rank5 New Moon VIP triad targets in genuine Store
        if: ${{ inputs.run_rank5_newmoon_triad_vip }}
        run: node simulation/evaluation/2026-11/agent20-newmoon-triad-vip-fresh-eight.cjs
      - name: Preserve every original-source physical and root native outcome
        if: ${{ always() && inputs.run_rank5_newmoon_triad_vip }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-newmoon-triad-vip-fresh-eight-full-physical-aba
          path: artifacts/agent20-newmoon-triad-vip-fresh-eight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify New Moon Mewtwo-first native VIP v2 owner prompt choices
        if: ${{ inputs.run_rank5_newmoon_triad_v2_vip }}
        run: |
          node --check simulation/twinleaf/agent9-battle-vip-owner-after-pass.cjs
          node --check simulation/evaluation/2026-11/agent20-newmoon-triad-v2-vip-fresh-eight.cjs
          node --test tests/2026-11/agent20-newmoon-triad-vip-v2.test.cjs tests/2026-11/agent20-newmoon-triad-vip.test.cjs tests/agent9-battle-vip-owner-after-pass.test.cjs
          node simulation/evaluation/2026-11/agent20-newmoon-triad-v2-vip-fresh-eight.cjs --preflight
      - name: Play preregistered original-rank5 real Store Mewtwo-first VIP v2 A-B-A
        if: ${{ inputs.run_rank5_newmoon_triad_v2_vip }}
        run: node simulation/evaluation/2026-11/agent20-newmoon-triad-v2-vip-fresh-eight.cjs
      - name: Archive full physical and action tape for New Moon VIP v2 A-B-A
        if: ${{ always() && inputs.run_rank5_newmoon_triad_v2_vip }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-newmoon-triad-v2-vip-fresh-eight-full-physical-aba
          path: artifacts/agent20-newmoon-triad-v2-vip-fresh-eight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify original physical Mewtwo-missing owner VIP historical preflight
        if: ${{ inputs.run_rank5_newmoon_triad_v2_posthoc }}
        run: |
          node --check simulation/evaluation/2026-11/agent20-newmoon-triad-v2-posthoc-8204B.cjs
          node --test tests/2026-11/agent20-newmoon-triad-vip-v2.test.cjs
          node simulation/evaluation/2026-11/agent20-newmoon-triad-v2-posthoc-8204B.cjs --preflight
      - name: Run posthoc genuine native original-rank5 missing-Mewtwo A-B-A
        if: ${{ inputs.run_rank5_newmoon_triad_v2_posthoc }}
        run: node simulation/evaluation/2026-11/agent20-newmoon-triad-v2-posthoc-8204B.cjs
      - name: Archive historical original-source same-seed native physical response
        if: ${{ always() && inputs.run_rank5_newmoon_triad_v2_posthoc }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-newmoon-triad-v2-posthoc-8204B-physical-aba
          path: artifacts/agent20-newmoon-triad-v2-posthoc-8204B.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify native owner Gengar Fog Psychic Energy prioritization and frozen 16 contexts
        if: ${{ inputs.run_rank5_newmoon_fog_energy_fresh_16 }}
        run: |
          node --check simulation/twinleaf/2026-11/agent20-fog-psychic-energy-priority.cjs
          node --check simulation/evaluation/2026-11/agent20-newmoon-fog-gengar-energy-fresh-16.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/2026-11/agent20-fog-psychic-energy-priority.test.cjs tests/agent9-fog-actor-prompt.test.cjs
          node simulation/evaluation/2026-11/agent20-newmoon-fog-gengar-energy-fresh-16.cjs --preflight
      - name: Execute 48 original-rank5 native Fog target A-B-A registered trials
        if: ${{ inputs.run_rank5_newmoon_fog_energy_fresh_16 }}
        run: node simulation/evaluation/2026-11/agent20-newmoon-fog-gengar-energy-fresh-16.cjs
      - name: Archive original printed sixties and complete native Fog physical action joins
        if: ${{ always() && inputs.run_rank5_newmoon_fog_energy_fresh_16 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-newmoon-fog-gengar-energy-fresh-16-physical-aba
          path: artifacts/agent20-newmoon-fog-gengar-energy-fresh-16.json
          if-no-files-found: warn
          retention-days: 30
