name: Agent33 Stadium owner-root pinned native developmental checks

on:
  workflow_dispatch:
    inputs:
      study:
        description: 'Choose one precommitted native rules or physical-deal development study'
        required: true
        type: choice
        default: tropical-beach-stage
        options:
          - tropical-beach-stage
          - tropical-beach-original-paired
          - players-ceremony-stage
          - sky-field-stage
          - path-to-the-peak-stage
          - rank29-camping-pure
          - rank29-camping-native
          - rank29-tagcall-second-paired
          - agent32-actor-source-print-bridge
          - agent6-hood-underworld-native

permissions:
  contents: read

jobs:
  native-stadium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Node for rank29 mathematical and policy checks
        if: inputs.study == 'rank29-camping-pure'
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Test exact rank29 opening, fallback, and owner prompt choices
        if: inputs.study == 'rank29-camping-pure'
        run: node --test tests/agent33-rank29-beach-camping-prize-access.test.cjs tests/agent33-rank29-camping-attackpair-target.test.cjs tests/agent33-rank29-gear-fixed-fallback-incidence.test.cjs tests/agent33-rank29-guzma-hala-prize-reachability.test.cjs tests/agent33-rank29-firstturn-tagcall-ghala-envelope.test.cjs tests/agent33-shuffle-prompt-numeric-validation.test.cjs
      - run: git submodule update --init --depth=1 vendor/twinleaf
        if: inputs.study != 'rank29-camping-pure'
      - uses: actions/setup-node@v4
        if: inputs.study != 'rank29-camping-pure'
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        if: inputs.study != 'rank29-camping-pure'
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        if: inputs.study != 'rank29-camping-pure'
        run: npm run compile
      # A single opt-in two-seat SOURCE->native actor/prompt witness. It stages
      # original exact physical 60s and a legal root/continuation, but never
      # starts a match, fixture driver, or any full-game loop.
      - name: Agent32 source-certified actor and Penny native no-game witness
        if: inputs.study == 'agent32-actor-source-print-bridge'
        run: |
          node --test \
            tests/2026-11/agent19-pinned-native-actor-contract.test.cjs \
            tests/2026-11/agent32-source-printing-bridge.test.cjs \
            tests/2026-11/agent32-rank3-penny-continuation-policy.test.cjs \
            tests/2026-11/agent32-real-pinned-actor-pr86-bridge.test.cjs
      # Separate second-stage candidate witness; review/dispatch only AFTER
      # first Agent32 source bridge native witness passes and Agent31/46 review.
      # A dry pinned-Store root/prompt effect, no match driver or V3 fixture.
      - name: Agent6 original Hood60 Underworld no-game source/worker native Store slice
        if: inputs.study == 'agent6-hood-underworld-native'
        run: node --test tests/2026-11/agent6-candidate-underworld-source-bridge.native.test.cjs
      - name: Native both-seat Tropical Beach held-card and draw-to-seven
        if: inputs.study == 'tropical-beach-stage'
        run: node --test tests/agent33-tropical-beach-pinned-native.test.cjs
      - name: Native original ranks 3 6 29 same-physical-deal Beach comparison
        if: inputs.study == 'tropical-beach-original-paired'
        run: node simulation/evaluation/agent33-tropical-beach-original-paired.cjs > agent33-beach-original-paired.json
      - name: Archive all original same-deal Beach paired trial attempts
        if: inputs.study == 'tropical-beach-original-paired' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent33-original-three-rank-beach-paired
          path: agent33-beach-original-paired.json
          if-no-files-found: warn
      - name: Native both-seat Japanese SP127 Player Ceremony from held card
        if: inputs.study == 'players-ceremony-stage'
        run: node --test tests/agent33-players-ceremony-full-action-pinned.test.cjs
      - name: Native both-seat Sky Field and sixth Basic Bench promotion
        if: inputs.study == 'sky-field-stage'
        run: node --test tests/agent33-sky-field-bench-expansion-pinned.test.cjs
      - name: Native both-seat Path to Peak suppression of Genesect Ability
        if: inputs.study == 'path-to-the-peak-stage'
        run: node --test tests/agent33-path-to-peak-full-lock-pinned.test.cjs
      - name: Pinned both-seat Camping Gear own-search target-choice fork
        if: inputs.study == 'rank29-camping-native'
        run: node --test tests/agent33-rank29-camping-prompt-pinned-native.test.cjs

      - name: Original rank29 source-second paired owner Tag Call v1
        if: inputs.study == 'rank29-tagcall-second-paired'
        run: node simulation/evaluation/agent33-rank29-tagcall-source-second-paired.cjs > rank29-tagcall-source-second.json
      - name: Archive all registered rank29 original source-second trials
        if: inputs.study == 'rank29-tagcall-second-paired' && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank29-source-second-tagcall-16-native-arms
          path: rank29-tagcall-source-second.json
          if-no-files-found: warn
