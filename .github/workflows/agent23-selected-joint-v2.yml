name: Agent23 frozen symmetric joint v2 rank5 rank11 rank6 native release

on:
  workflow_dispatch:
    inputs:
      pure_only:
        description: 'Run source owner pure regressions without native engine'
        type: boolean
        default: false
      rank11_native:
        description: 'Run only four retrospective original rank11 source Quick Ball/attack forks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  selected-original-source-52:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enforce mutually exclusive manual scope
        if: ${{ inputs.pure_only && inputs.rank11_native }}
        run: exit 1
      - name: Validate independent preregistration, symmetric policy and denominator
        if: ${{ ! inputs.pure_only && ! inputs.rank11_native }}
        run: node --test tests/agent23-selected-joint-v2-release.test.cjs tests/agent22-source-copy-choice-audit.test.cjs
      - name: Regress physical owner Volt donor selection on both source seats
        if: ${{ inputs.pure_only }}
        run: node --test tests/agent23-volt-transfer-readiness.test.cjs tests/agent4-allturn-owner-volt-attach-energy.test.cjs tests/agent23-quickball-payable-attack-arbitration.test.cjs tests/agent23-rank11-source-quickball-attack-native-contract.test.cjs
      - name: Initialize pinned Twinleaf submodule only
        if: ${{ ! inputs.pure_only }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Pin exact submodule revision
        if: ${{ ! inputs.pure_only }}
        run: node -e "const assert=require('node:assert/strict');const cp=require('node:child_process');const commit=cp.execFileSync('git',['rev-parse','HEAD'],{cwd:'vendor/twinleaf',encoding:'utf8'}).trim();assert.equal(commit,'a9905a76a6c4103ba4b6cb9a49e86bad795c5c05');console.log('PINNED_TWINLEAF',commit)"
      - uses: actions/setup-node@v4
        if: ${{ ! inputs.pure_only }}
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        if: ${{ ! inputs.pure_only }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        if: ${{ ! inputs.pure_only }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate targeted original rank11 source-only attack arbitration
        if: ${{ inputs.rank11_native }}
        run: node --test tests/agent23-quickball-payable-attack-arbitration.test.cjs tests/agent23-rank11-source-quickball-attack-native-contract.test.cjs
      - name: Execute frozen four-branch rank11 source Quick Ball versus attack fork
        if: ${{ inputs.rank11_native }}
        env:
          AGENT23_SOURCE_QB_ATTACK_NATIVE_OUTPUT: artifacts/agent23-rank11-source-quickball-attack-native.json
        run: node simulation/evaluation/2026-11/agent23-rank11-source-quickball-vs-attack-native.cjs
      - name: Preserve raw rank11 forks and the original source physical deal
        if: ${{ always() && inputs.rank11_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent23-rank11-original-source-payable-attack-vs-quickball
          path: artifacts/agent23-rank11-source-quickball-attack-native.json
          if-no-files-found: warn
          retention-days: 21
      - name: Execute frozen 52 native attempts, both symmetric policies and source printings
        if: ${{ ! inputs.pure_only && ! inputs.rank11_native }}
        run: node simulation/evaluation/agent23-selected-joint-v2-release.cjs
      - name: Fail closed on source deal or context fidelity
        if: ${{ ! inputs.pure_only && ! inputs.rank11_native }}
        run: node -e "const assert=require('node:assert/strict');const r=require('./agent23-selected-joint-v2-native-52arm.json');assert.equal(r.attemptCount,52);assert.equal(r.candidateContexts,26);assert.equal(r.matchedSourcePhysicalDeals,26);assert.equal(r.allControlsMatched,true);assert.equal(r.competitivelyQualifiedGames,0);for(const m of r.modes)assert.equal(m.rows.length,26);console.log('SELECTED_JOINT_V2_GATE',JSON.stringify({attemptCount:r.attemptCount,matchedPhysical:r.matchedSourcePhysicalDeals,vip:r.modes.map(m=>m.rows.reduce((n,x)=>n+x.sourceVipCount,0)),nativeErrors:r.modes.map(m=>m.rows.filter(x=>x.nativeError).length),nativeStatus:r.modes.map(m=>m.rows.reduce((a,x)=>(a[x.nativeStatus??'null']=(a[x.nativeStatus??'null']??0)+1,a),{})),techno:r.modes.map(m=>m.rows.filter(x=>x.trialId.startsWith('5:')).reduce((n,x)=>n+(x.sourceCopiedAttackChoices?.selectedGenesectTechnoBlast??0),0)),competitiveGames:0}))"
      - name: Preserve all native controls, failures and censored caps
        if: ${{ always() && ! inputs.pure_only && ! inputs.rank11_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent23-frozen-symmetric-joint-v2-52-native
          path: agent23-selected-joint-v2-native-52arm.json
          if-no-files-found: warn
          retention-days: 21
