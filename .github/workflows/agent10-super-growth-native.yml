name: Agent10 Super Growth real Store both-seat fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  super-growth-native:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout research and pinned upstream commit
        uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned native server
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Physically paid first-turn line on both native seats
        run: node --test tests/agent10-supergrowth-hybrid-native.test.cjs
