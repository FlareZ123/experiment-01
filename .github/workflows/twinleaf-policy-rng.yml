name: Twinleaf policy RNG isolation audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  random-stream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Verify policy/game stream isolation without Twinleaf
        run: node --test tests/twinleaf-policy-rng-isolation.test.cjs
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up upstream Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Compare reproducible shared- and isolated-stream smoke games
        run: node simulation/twinleaf/smoke-test.cjs
