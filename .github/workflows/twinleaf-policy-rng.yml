name: Twinleaf policy RNG isolation audit

on:
  workflow_dispatch:
    inputs:
      agent13_actor_option_canonical_dev:
        description: 'Unqualified SelectOption native Store canonical development (four historical arms)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  random-stream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Verify policy/game stream isolation without Twinleaf
        run: node --test tests/twinleaf-policy-rng-isolation.test.cjs
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up upstream Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test actor-only native option prompt choices
        if: inputs.agent13_actor_option_canonical_dev
        run: node --test tests/agent13-actor-only-select-option.test.cjs
      - name: Exercise native option prompt in canonical four-arm developer cohort
        if: inputs.agent13_actor_option_canonical_dev
        run: node simulation/twinleaf/agent13-actor-option-canonical-dev.cjs > agent13-actor-option-development.json
      - name: Preserve true Store option decisions and every censored arm
        if: inputs.agent13_actor_option_canonical_dev && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-actor-option-canonical-development
          path: agent13-actor-option-development.json
          if-no-files-found: warn
      - name: Compare reproducible shared- and isolated-stream smoke games
        run: node simulation/twinleaf/smoke-test.cjs
