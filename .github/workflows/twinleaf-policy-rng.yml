name: Twinleaf policy RNG isolation audit

on:
  workflow_dispatch:
    inputs:
      agent23_canonical_native_input_pair:
        description: 'Compare unchanged four canonical actor-only historical games with exact typed input witness off/on'
        required: false
        type: boolean
        default: false
      agent13_actor_attack_source_positive:
        description: 'One historical rank11 real Store printed copied Attack response, unqualified'
        required: false
        type: boolean
        default: false
      agent13_actor_attack_priority_pair:
        description: 'Matched historical rank11 copied-attack donor-choice A/B (unqualified)'
        required: false
        type: boolean
        default: false
      agent13_actor_both_prompts_dev:
        description: 'Unqualified actor-owned SelectOption and copied Attack prompt native Store smoke'
        required: false
        type: boolean
        default: false
      agent13_actor_option_canonical_dev:
        description: 'Unqualified SelectOption native Store canonical development (four historical arms)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  random-stream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Verify policy/game stream isolation without Twinleaf
        run: node --test tests/twinleaf-policy-rng-isolation.test.cjs
      - name: Verify native decision-to-Store input identity negative controls
        run: node --test tests/agent23-native-decision-dispatch-witness.test.cjs
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up upstream Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test actor-only native option prompt choices
        if: inputs.agent13_actor_option_canonical_dev
        run: node --test tests/agent13-actor-only-select-option.test.cjs
      - name: Exercise native option prompt in canonical four-arm developer cohort
        if: inputs.agent13_actor_option_canonical_dev
        run: node simulation/twinleaf/agent13-actor-option-canonical-dev.cjs > agent13-actor-option-development.json
      - name: Preserve true Store option decisions and every censored arm
        if: inputs.agent13_actor_option_canonical_dev && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-actor-option-canonical-development
          path: agent13-actor-option-development.json
          if-no-files-found: warn
      - name: Confirm actor-only prompt Store acceptance counts
        if: inputs.agent13_actor_option_canonical_dev
        run: >-
          node -e "const r=require('./agent13-actor-option-development.json');console.log(JSON.stringify({selected:r.selectedNativeOptions,accepted:r.acceptedNativeOptions,Stores:r.actorOptionAudit.actualStoreInstances,cases:r.rows.length,qualified:0}));"
      - name: Test owner-only copied Attack prompt source identity
        if: inputs.agent13_actor_both_prompts_dev
        run: node --test tests/agent13-actor-only-choose-attack.test.cjs tests/agent13-actor-only-select-option.test.cjs
      - name: Execute both actor-only native prompt adapters in four historical arms
        if: inputs.agent13_actor_both_prompts_dev
        run: node simulation/twinleaf/agent13-actor-prompts-canonical-dev.cjs > agent13-actor-prompts-development.json
      - name: Show accepted copied Attack and option counts without win inference
        if: inputs.agent13_actor_both_prompts_dev
        run: >-
          node -e "const r=require('./agent13-actor-prompts-development.json');console.log(JSON.stringify({options:r.optionAudit.acceptedPromptActions,attacks:r.chooseAttackAudit.accepted,cases:r.rows.length,errors:r.rows.filter(x=>x.error).length,qualified:0}));"
      - name: Archive source-original native prompt outcomes
        if: inputs.agent13_actor_both_prompts_dev && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-actor-both-prompts-canonical-development
          path: agent13-actor-prompts-development.json
          if-no-files-found: warn
      - name: Native copied Attack from authentic rank11 source
        if: inputs.agent13_actor_attack_source_positive
        run: node simulation/twinleaf/agent13-copied-attack-source-smoke.cjs > agent13-source-copied-attack.json
      - name: Summarize actual Store accepted copied attacks and next source reply
        if: inputs.agent13_actor_attack_source_positive
        run: >-
          node -e "const r=require('./agent13-source-copied-attack.json');console.log(JSON.stringify({accepted:r.decisions.accepted,prompts:r.decisions.menus,copies:r.candidateChoices.length,nextSource:r.sourceRank11ActionsAfterFirstCopy.length,qualified:0}));"
      - name: Preserve source-dealt copied attack print identity and next source action
        if: inputs.agent13_actor_attack_source_positive && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-source-copied-attack-positive
          path: agent13-source-copied-attack.json
          if-no-files-found: warn
      - name: Test alternate owner-only copied attack donor priority
        if: inputs.agent13_actor_attack_priority_pair
        run: node --test tests/agent13-actor-only-choose-attack.test.cjs
      - name: Run original rank11 physical deal with unchanged first-eligible actor choice
        if: inputs.agent13_actor_attack_priority_pair
        run: node simulation/twinleaf/agent13-copied-attack-source-smoke.cjs > agent13-first-eligible-original.json
      - name: Run same source/candidate 60 and deal with owner-only printed Poltergeist priority
        if: inputs.agent13_actor_attack_priority_pair
        env:
          AGENT13_COPY_POLTERGEIST_PRIORITY: 'true'
        run: node simulation/twinleaf/agent13-copied-attack-source-smoke.cjs > agent13-poltergeist-priority.json
      - name: Replay same Poltergeist branch with three live source Quick Ball owner actions on turn49
        if: inputs.agent13_actor_attack_priority_pair
        env:
          AGENT13_COPY_POLTERGEIST_PRIORITY: 'true'
          AGENT13_SOURCE_TURN49_QUICK_BALL: 'true'
        run: node simulation/twinleaf/agent13-copied-attack-source-smoke.cjs > agent13-poltergeist-source-quickball.json
      - name: Check original-deal source-turn49 same-root prefix and successful owner counterplay
        if: inputs.agent13_actor_attack_priority_pair
        run: >-
          node -e "const a=require('./agent13-poltergeist-priority.json'),b=require('./agent13-poltergeist-source-quickball.json');
          const count=b.sourceQuickBallAudit?.successfulSearchPromptCycles;
          if(!b.sourceQuickBallAudit?.activated||count!==3)throw Error('Source counterplay never executed');
          if(JSON.stringify(a.deckHashes)!==JSON.stringify(b.deckHashes))throw Error('Deck identity changed');
          if(a.firstCopyPrecedingRootSha256!==b.firstCopyPrecedingRootSha256)throw Error('Pre-copy root actions changed');
          console.log(JSON.stringify({originalSeed:a.sourceSeed,sourceTurn49:49,
          quickBallCount:count,sourceCounterplay:b.sourceQuickBallAudit,
          originalOutcome:{winner:a.winnerSeat,prizes:a.prizesRemaining,actions:a.nativeActionCount},
          sourceCounterplayOutcome:{winner:b.winnerSeat,prizes:b.prizesRemaining,actions:b.nativeActionCount},
          exactSourceDeck:a.deckHashes[0]===b.deckHashes[0],qualified:0}));"
      - name: Print original-deal first-choice divergence and full outcomes without win inference
        if: inputs.agent13_actor_attack_priority_pair
        run: >-
          node -e "const a=require('./agent13-first-eligible-original.json'),b=require('./agent13-poltergeist-priority.json');
          const first=x=>x.candidateChoices[0];
          console.log(JSON.stringify({sameDecks:a.candidateAndSourceDecksUnchanged&&b.candidateAndSourceDecksUnchanged,
          sameActualStart:a.firstTurnSlot===b.firstTurnSlot,sameSeed:a.sourceSeed===b.sourceSeed,
          baselineFirst:first(a),alternativeFirst:first(b),baselineAccepted:a.decisions.accepted,
          alternativeAccepted:b.decisions.accepted,baselineActions:a.nativeActionCount,
          alternativeActions:b.nativeActionCount,baselineEnd:a.endReason,alternativeEnd:b.endReason,
          baselineSourceReplies:a.sourceRank11ActionsAfterFirstCopy.length,
          alternativeSourceReplies:b.sourceRank11ActionsAfterFirstCopy.length,qualified:0}));"
      - name: Preserve both full authentic source-deal arms including censored outcomes
        if: inputs.agent13_actor_attack_priority_pair && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-copied-attack-priority-pair
          path: |
            agent13-first-eligible-original.json
            agent13-poltergeist-priority.json
            agent13-poltergeist-source-quickball.json
          if-no-files-found: warn
      - name: Compare reproducible shared- and isolated-stream smoke games
        run: node simulation/twinleaf/smoke-test.cjs
      - name: Verify native action proposal-to-Store original-game noninterference
        run: node simulation/twinleaf/agent23-native-witness-smoke.cjs
      - name: Paired canonical four-arm actual Store native input identity regression
        if: inputs.agent23_canonical_native_input_pair
        run: node simulation/evaluation/agent23-canonical-native-input-pair.cjs > agent23-native-input-canonical-fourarm.json
      - name: Print bounded four-arm same-world witness and failure classification
        if: inputs.agent23_canonical_native_input_pair
        run: >-
          node -e "const a=require('./agent23-native-input-canonical-fourarm.json');
          console.log('CANONICAL_NATIVE_INPUT',JSON.stringify({schema:a.schema,
          same:a.exactSameReportedNativeDevelopmentGameData,
          control:a.controlCases,observed:a.observedCases,
          rows:a.rows,qualified:a.competitiveQualifiedGames}));"
      - name: Archive original-policy matched and unmatched native input evidence
        if: inputs.agent23_canonical_native_input_pair && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent23-native-input-canonical-historical-fourarm
          path: agent23-native-input-canonical-fourarm.json
          if-no-files-found: warn
          retention-days: 10
