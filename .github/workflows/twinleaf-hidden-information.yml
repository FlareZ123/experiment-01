name: Twinleaf hidden-information policy diagnostic

on:
  workflow_dispatch:
    inputs:
      agent34_actor_root_execution:
        description: Execute actor-only typed native roots across canonical historical four arms (prompts unqualified)
        type: boolean
        default: false
      agent12_lillie_fallback:
        description: Compare actor-only Lillie draw after Pass against same historical four-arm baseline (requires agent34 flag)
        type: boolean
        default: false
      agent24_rank6_candidate_lillie:
        description: Original rank6 historical source-first candidate Lillie (requires actor root)
        type: boolean
        default: false
      archival_prefix_only:
        description: Run only compiled archival rank-10 prefix falsification
        type: boolean
        default: false
      actor_observation_live_only:
        description: Test actor-only real-Store views against the canonical historical four arms
        type: boolean
        default: false
      agent50_live_deck_order:
        description: Audit owner unseen-deck-order sensitivity on canonical historical four arms
        type: boolean
        default: false
      agent50_first_finite_root:
        description: First authentic scored candidate root in canonical historical four arms
        type: boolean
        default: false
      agent50_common_policy_replay:
        description: Restore live common policy wrappers for detached scored-root comparisons
        type: boolean
        default: false
      agent50_isolated_policy_worlds:
        description: Recreate independent common policy closure for each hypothetical world
        type: boolean
        default: false
      agent50_native_same_world_tape:
        description: Replay authentic owner decision tape on same physical root (diagnostic, not a hidden-state claim)
        type: boolean
        default: false
      agent50_native_tape_hidden_deck_order:
        description: Only after authentic same-root parity, probe an unqualified unseen-deck permutation
        type: boolean
        default: false
      agent50_native_first_finite_tape:
        description: Replay full authentic owner RNG tape from first finite-scored decision entry
        type: boolean
        default: false
      agent23_native_opponent_hand_tape:
        description: Conditional opponent hidden-hand exchange after authentic owner same-world tape parity
        type: boolean
        default: false
      agent23_native_bounded_opponent_hand_tape:
        description: With agent23_native_opponent_hand_tape, scan bounded owner-equivalent concealed worlds
        type: boolean
        default: false
      agent23_native_bounded_double_swap:
        description: With both agent23 flags, use two disjoint concealed exchanges per world
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hidden-draw-forecast:
    if: ${{ !inputs.agent34_actor_root_execution && !inputs.archival_prefix_only && !inputs.actor_observation_live_only && !inputs.agent50_live_deck_order && !inputs.agent50_first_finite_root && !inputs.agent50_common_policy_replay && !inputs.agent50_isolated_policy_worlds && !inputs.agent50_native_same_world_tape && !inputs.agent50_native_tape_hidden_deck_order && !inputs.agent50_native_first_finite_tape && !inputs.agent23_native_opponent_hand_tape }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify exact reveal values after known-bottom Prize redeal
        run: node --test tests/redeal-window-value.test.cjs
      - name: Verify exact K0/K1 search-window reward under exhaustive small deals
        run: node --test tests/observation-search-value.test.cjs
      - name: Verify clone-only speculative deck sampling against pinned engine
        run: node --test tests/twinleaf-speculative-deck-sampling.test.cjs
      - name: Detect speculative score dependence on hidden deck order
        run: node --test tests/twinleaf-hidden-draw-forecast.test.cjs
      - name: Preserve diagnostic values in job log
        run: node simulation/twinleaf/hidden-draw-forecast.cjs
      - name: Reproduce hidden-order leakage with full ranked source-list inventory
        run: node --test tests/twinleaf-hidden-source-deck.test.cjs
      - name: Preserve source-inventory contrast
        run: node simulation/twinleaf/hidden-source-deck-policy.cjs
      - name: Evaluate opt-in own-deck hidden-order sampling on the ranked inventory
        run: node --test tests/twinleaf-own-deck-sampling.test.cjs
      - name: Preserve sampled invariance experiment
        run: node simulation/twinleaf/own-deck-determinization-audit.cjs
      - name: Verify pinned clone prototype-link repair
        run: node --test tests/twinleaf-normalize-deep-clone.test.cjs
      - name: Verify seeded clone graph topology
        run: node --test tests/twinleaf-clone-graph-topology.test.cjs
      - name: Verify detached sample isolation with synthetic Card-alias controls
        run: node --test tests/twinleaf-detached-deck-sampling.test.cjs
      - name: Verify partial positional Prize observations under hidden-state sampling
        run: node --test tests/twinleaf-partial-prize-slots.test.cjs
      - name: Verify unlocated observed Prize identity posterior with exact counting
        run: node --test tests/unlocated-prize-posterior.test.cjs
      - name: Verify detached full-state sampling on the pinned source-ranked deck
        run: node --test tests/twinleaf-detached-own-deck-audit.test.cjs
      - name: Verify joint K0 deck-and-Prize samples in a pinned Bunnelby Store State
        run: node --test tests/twinleaf-k0-detached-bunnelby-audit.test.cjs
      - name: Verify full source-printed rank-2 deck versus hidden Prize K0 posterior
        run: node --test tests/twinleaf-rank2-full-source-k0.test.cjs
      - name: Preserve printed rank-2 conditional sample results in job log
        run: node simulation/twinleaf/rank2-full-source-k0-sampler.cjs
      - name: Preserve detached scoring contrast in job log
        run: node simulation/twinleaf/detached-own-deck-audit.cjs
      - name: Verify hidden Prize membership source-contrast helper
        run: node --test tests/rank10-prize-membership-live-probe.test.cjs
      - name: Verify root source policy profile
        run: node --test tests/rank10-hidden-order-policy-profile.test.cjs
      - name: Verify tactic-score trace observer and failure restoration
        run: node --test tests/twinleaf-tactic-score-trace.test.cjs
      - name: Verify real-source hidden-order probe controls
        run: node --test tests/rank10-hidden-order-live-probe.test.cjs
      - name: Verify archived root-prefix hashing and rejection controls
        run: node --test tests/source-prefix-digest.test.cjs
      - name: Verify root-only score census observer
        run: node --test tests/rank10-source-score-opportunity-scout.test.cjs
      - name: Observe genuine rank-10 tactic-score opportunities
        run: node simulation/twinleaf/rank10-source-score-opportunity-scout.cjs
      - name: Compare source-selected turn1 root12 Supporter tactic scores
        run: node simulation/twinleaf/rank10-hidden-order-live-probe.cjs score12
      - name: Compare source-selected turn5 root57 hidden-order tactic scores
        run: node simulation/twinleaf/rank10-hidden-order-live-probe.cjs score57
      - name: Compare source-selected turn15 root157 hidden-order tactic scores
        run: node simulation/twinleaf/rank10-hidden-order-live-probe.cjs score157
      - name: Explore frozen rank-10 root decision across detached hidden deck orders
        run: node simulation/twinleaf/rank10-hidden-order-live-probe.cjs
      - name: Explore genuine rank-10 decisive ordinal 215 under detached deck orders
        run: node simulation/twinleaf/rank10-hidden-order-live-probe.cjs ordinal215

  rank10-archival-prefix:
    if: ${{ !inputs.agent34_actor_root_execution && inputs.archival_prefix_only && !inputs.actor_observation_live_only && !inputs.agent50_live_deck_order && !inputs.agent50_first_finite_root && !inputs.agent50_common_policy_replay && !inputs.agent50_isolated_policy_worlds && !inputs.agent50_native_same_world_tape && !inputs.agent50_native_tape_hidden_deck_order && !inputs.agent50_native_first_finite_tape && !inputs.agent23_native_opponent_hand_tape }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify original three-list source schedule and trial provenance
        run: node --test tests/rank10-historical-schedule-provenance.test.cjs
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify versioned archived match-outcome projection
        run: node --test tests/rank10-result-projection.test.cjs tests/rank10-replay-acceptance.test.cjs
      - name: Check selective prefix digest negative controls
        run: node --test tests/source-prefix-digest.test.cjs tests/rank10-hidden-order-live-probe.test.cjs
      - name: Compare all 235 authentic v3 Timeless source inputs and State projections
        run: node simulation/twinleaf/rank10-hidden-order-live-probe.cjs ordinal215
      - name: Retrieve frozen 17 October source Store archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38995733010 -R ${{ github.repository }} -n rank10-source-branch-live-dispatch -D archived-rank10
      - name: Verify archived source JSON bytes match the original immutable artifact
        run: |
          node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); const b=fs.readFileSync('archived-rank10/rank10-source-branch-live-dispatch.json'); const actual=crypto.createHash('sha256').update(b).digest('hex'); const expected='bd7853c3e1692fb8c554a28e83bd2b2b808d0056104a7ae109c4d94aabee4599'; if(actual!==expected)throw Error('Historical source bytes mismatch: '+actual); console.log('Historical JSON byte SHA256 verified:',actual)"
      - name: Independently replay archived original 350 and alternate 235 inputs in fresh process
        run: node simulation/twinleaf/rank10-replay-from-archive.cjs archived-rank10/rank10-source-branch-live-dispatch.json > rank10-historical-replay-now.json
      - name: Fail closed on incomplete full two-arm fresh-process replay
        run: node simulation/twinleaf/rank10-replay-acceptance.cjs rank10-historical-replay-now.json
      - name: Archive full historical source replay verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-historical-current-head-replay
          path: rank10-historical-replay-now.json
          if-no-files-found: warn

  actor-observation-live:
    if: ${{ !inputs.agent34_actor_root_execution && inputs.actor_observation_live_only && !inputs.agent50_live_deck_order && !inputs.agent50_first_finite_root && !inputs.agent50_common_policy_replay && !inputs.agent50_isolated_policy_worlds && !inputs.agent50_native_same_world_tape && !inputs.agent50_native_tape_hidden_deck_order && !inputs.agent50_native_first_finite_tape && !inputs.agent23_native_opponent_hand_tape }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify independent actor-only boundary and read-only Store observer
        run: |
          node --test tests/actor-observation-contract.test.cjs tests/actor-observation-live-audit.test.cjs tests/actor-k1-search-selection-audit.test.cjs
          node --check simulation/evaluation/agent21-actor-observation-compiled.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Compare canonical four original Store games against read-only actor observation
        run: node simulation/evaluation/agent21-actor-observation-compiled.cjs > actor-view-live.json
      - name: Print source-deal and actor-boundary observation status
        run: >-
          node -e "const r=require('./actor-view-live.json');
          console.log('ACTOR_ONLY_NATIVE_BOUNDARY',JSON.stringify({
          games:r.actorProjectionAudit.games,
          rootDispatches:r.actorProjectionAudit.actualRootDispatches,
          ownerDecisions:r.actorProjectionAudit.observedActorDecisions,
          ownerPrompts:r.actorProjectionAudit.ownerPrompts,
          unchangedCanonicalRows:r.sameCompleteCanonicalRows,
          firstOwnK1Searches:r.nativeFirstOwnerK1.length,
          rank6NewMoonFirstK1:r.rank6NewMoonFirstOwnerK1,
          gameWinsQualified:r.competitiveQualifiedGames}));"
      - name: Preserve verified native Store parity and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-actor-view-native-fourarm
          path: actor-view-live.json
          if-no-files-found: warn
          retention-days: 10

  agent50-live-deck-order:
    if: ${{ !inputs.agent34_actor_root_execution && (inputs.agent50_live_deck_order || inputs.agent50_first_finite_root || inputs.agent50_common_policy_replay || inputs.agent50_isolated_policy_worlds || inputs.agent50_native_same_world_tape || inputs.agent50_native_tape_hidden_deck_order || inputs.agent50_native_first_finite_tape || inputs.agent23_native_opponent_hand_tape) && !inputs.archival_prefix_only && !inputs.actor_observation_live_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify retrospective source-deal and detached observer controls
        run: node --test tests/agent50-bilateral-hidden-order-audit.test.cjs tests/agent50-bilateral-postgame-root-observer.test.cjs tests/rank10-hidden-order-live-probe.test.cjs tests/native-clone-structure-diff.test.cjs tests/native-tape-hidden-order-contrast.test.cjs tests/agent50-native-first-finite-tape.test.cjs tests/native-policy-tactic-sequence.test.cjs tests/agent50-native-control-gate.test.cjs tests/agent50-zero-hand-poltergeist-choice.test.cjs
      - name: Verify native tape opponent concealed-world contrasts and bounded controls
        run: node --test tests/native-tape-opponent-hidden-hand-contrast.test.cjs tests/agent23-native-tape-bounded-opponent-hand.test.cjs tests/agent23-native-speculative-zone-trace.test.cjs tests/agent23-unseen-trainer-hypergeometric.test.cjs
      - name: Replay authentic historical common-policy decisions and detached order contrasts
        env:
          AGENT50_FIRST_FINITE_ROOT: ${{ inputs.agent50_first_finite_root || inputs.agent50_common_policy_replay || inputs.agent50_isolated_policy_worlds || inputs.agent50_native_first_finite_tape }}
          AGENT50_COMMON_POLICY_REPLAY: ${{ inputs.agent50_common_policy_replay || inputs.agent50_isolated_policy_worlds }}
          AGENT50_ISOLATED_POLICY_WORLDS: ${{ inputs.agent50_isolated_policy_worlds }}
          AGENT50_NATIVE_TAPE_SAME_WORLD: ${{ inputs.agent50_native_same_world_tape || inputs.agent50_native_tape_hidden_deck_order || inputs.agent50_native_first_finite_tape || inputs.agent23_native_opponent_hand_tape }}
          AGENT50_NATIVE_TAPE_HIDDEN_DECK_ORDER: ${{ inputs.agent50_native_tape_hidden_deck_order }}
          AGENT50_NATIVE_TAPE_FIRST_FINITE_SCORE: ${{ inputs.agent50_native_first_finite_tape }}
          AGENT23_NATIVE_OPPONENT_HAND_TAPE: ${{ inputs.agent23_native_opponent_hand_tape }}
          AGENT23_NATIVE_BOUNDED_OPPONENT_HAND_TAPE: ${{ inputs.agent23_native_bounded_opponent_hand_tape }}
          AGENT23_NATIVE_BOUNDED_DOUBLE_SWAP_DEV: ${{ inputs.agent23_native_bounded_double_swap }}
        run: node simulation/evaluation/agent50-bilateral-hidden-order-audit.cjs > agent50-live-deck-order-fourarm.json
      - name: Reject aborted or unauthenticated native historical controls
        run: node simulation/evaluation/agent50-native-control-gate.cjs agent50-live-deck-order-fourarm.json
      - name: Enumerate every observed and vetoed historical arm
        run: >-
          node -e "const a=require('./agent50-live-deck-order-fourarm.json');
          if(a.attempts!==4||a.rows.length!==4||a.independentlyQualifiedCompetitiveGames!==0)
          throw Error('Incomplete or wrongly qualified retrospective protocol');
          for(const r of a.rows)console.log('OWNER_ORDER_DIAGNOSTIC',JSON.stringify({
          id:r.trialId,status:r.classification,samePlayback:r.samePlayback,
          noninterference:r.noninterferenceVerified,
          baseline:r.diagnostic?.baselineActionMatchedActual,
          actionFlip:r.diagnostic?.actionSensitiveToHiddenDeckOrder,
          opponentHandFlip:r.diagnostic?.nativeOpponentHiddenHandContrast?.selectedActionChanged??null,
          opponentHandContrastExecutable:r.conditionalOpponentHandContrastExecutable??false,
          boundedEligible:r.diagnostic?.nativeOpponentHiddenHandContrast?.eligibleSingleExchanges??null,
          boundedAttempted:r.diagnostic?.nativeOpponentHiddenHandContrast?.attemptedSingleExchanges??null,
          boundedSuccessful:r.diagnostic?.nativeOpponentHiddenHandContrast?.successfulSingleExchanges??null,
          boundedFailed:r.diagnostic?.nativeOpponentHiddenHandContrast?.failedSingleExchanges??null,
          boundedActionReversals:r.diagnostic?.nativeOpponentHiddenHandContrast?.actionReversals??null,
          swapSize:r.diagnostic?.nativeOpponentHiddenHandContrast?.swapSize??null,
          eligiblePaths:r.diagnostic?.nativeOpponentHiddenHandContrast?.eligibleExchangePaths??null,
          attemptedPaths:r.diagnostic?.nativeOpponentHiddenHandContrast?.attemptedExchangePaths??null,
          successfulPaths:r.diagnostic?.nativeOpponentHiddenHandContrast?.successfulExchangePaths??null,
          failedPaths:r.diagnostic?.nativeOpponentHiddenHandContrast?.failedExchangePaths??null,
          auditError:r.diagnostic?.auditError||r.error||null,
          chosenTurn:r.diagnostic?.chosenRootTurn||null,
          scorerAttempts:r.diagnostic?.actualScorerAttempts||null,
          actualFiniteScores:r.diagnostic?.actualFiniteScores||null,
          bothWorldsFinite:r.diagnostic?.bothWorldsFiniteScoring||false}));"
      - name: Archive complete control, probe and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent50-live-deck-order-historical-fourarm
          path: agent50-live-deck-order-fourarm.json
          if-no-files-found: warn
          retention-days: 10

  agent34-actor-only-root-development:
    if: ${{ inputs.agent34_actor_root_execution }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test actor-only intent, native typed translation and prompt-fallback qualification
        run: node --test tests/agent34-actor-only-root-policy.test.cjs
      - name: Dispatch actor-only roots on canonical frozen four-arm development cohort
        run: node simulation/twinleaf/agent34-actor-only-canonical-development.cjs > agent34-actor-root-native.json
      - name: Print bounded original Store actor-only execution summary
        run: >-
          node -e "const r=require('./agent34-actor-root-native.json');
          console.log('AGENT34_ACTOR_NATIVE_ROOTS',JSON.stringify({
          accepted:r.audit.acceptedActorRoots,rejected:r.audit.rejectedActorRoots,
          selected:r.audit.selectedRootDecisions,actualGamesSeen:r.audit.actualGamesSeen,
          intents:r.audit.typedIntentCounts,
          promptFallbacks:r.audit.unsupportedPromptFallbacks,
          promptTypes:r.audit.unsupportedPromptTypes,
          nativeEvents:r.audit.nativeRootAcceptances.slice(0,12),
          rows:r.rows.map(x=>({trial:x.trialId,status:x.status,
          actions:x.actionCount,attacks:x.attackDeclarations,
          supporterGate:x.nativeSupporterQuotaQualified})),
          qualified:r.competitiveQualifiedGames}));"
      - name: Preserve native Store acceptance, failed roots and prompt fallback counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent34-actor-root-canonical-fourarm
          path: agent34-actor-root-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify native Lillie prompt-complete hand/deck draw receipt
        if: ${{ inputs.agent12_lillie_fallback }}
        run: node --test tests/agent24-native-lillie-settlement-audit.test.cjs
      - name: Test exact actor-only Lillie decision and native typed Store dispatch
        if: ${{ inputs.agent12_lillie_fallback }}
        run: node --test tests/agent12-actor-only-lillie-after-pass.test.cjs
      - name: Replay identical frozen four arms with actor-only Lillie after Pass
        if: ${{ inputs.agent12_lillie_fallback }}
        run: node simulation/twinleaf/agent12-actor-only-lillie-canonical-development.cjs > agent12-actor-lillie-native.json
      - name: Compare same historical arm Lillie and native actor-root outcomes
        if: ${{ inputs.agent12_lillie_fallback }}
        run: >-
          node -e "const a=require('./agent12-actor-lillie-native.json');
          const b=require('./agent34-actor-root-native.json');
          console.log('AGENT12_LILLIE_NATIVE_COMPARISON',JSON.stringify({
          baseline:{accepted:b.audit.acceptedActorRoots,
          intents:b.audit.typedIntentCounts,rows:b.rows.map(x=>({
          id:x.trialId,actions:x.actionCount,attacks:x.attackDeclarations}))},
          addon:{accepted:a.addon.acceptedLillieRoots,rejected:a.addon.rejectedLillieRoots,
          events:a.addon.rootEvents.slice(0,12),baseIntents:a.actorRootBase.typedIntentCounts,
          rows:a.rows.map(x=>({id:x.trialId,actions:x.actionCount,
          attacks:x.attackDeclarations,supporterGate:x.nativeSupporterQuotaQualified}))},
          competitiveQualifiedGames:0}));"
      - name: Preserve bounded Lillie after Pass native development data
        if: ${{ always() && inputs.agent12_lillie_fallback }}
        uses: actions/upload-artifact@v4
        with:
          name: agent12-actor-lillie-fourarm
          path: agent12-actor-lillie-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Posthoc candidate-only Lillie on original rank6 source-first deal
        if: ${{ inputs.agent24_rank6_candidate_lillie }}
        run: node simulation/twinleaf/agent24-rank6-original-candidate-lillie-pair.cjs > agent24-rank6-lillie-native.json
      - name: Save rank6 candidate Lillie trial including assertion failures
        if: ${{ always() && inputs.agent24_rank6_candidate_lillie }}
        uses: actions/upload-artifact@v4
        with:
          name: agent24-rank6-candidate-lillie-pair
          path: agent24-rank6-lillie-native.json
          if-no-files-found: warn
          retention-days: 14

