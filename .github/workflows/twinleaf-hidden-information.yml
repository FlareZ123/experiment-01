name: Twinleaf hidden-information policy diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hidden-draw-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Detect speculative score dependence on hidden deck order
        run: node --test tests/twinleaf-hidden-draw-forecast.test.cjs
      - name: Preserve diagnostic values in job log
        run: node simulation/twinleaf/hidden-draw-forecast.cjs
