name: Twinleaf Apex GX characterization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gx-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research and pinned Twinleaf
        uses: actions/checkout@v4
      - name: Check out pinned submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Check direct Apex Dragon copying Timeless-GX marker and extra turn
        run: node simulation/twinleaf/apex-timeless-gx.cjs
