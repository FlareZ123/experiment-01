name: Aichi Double Dragon policy integration

on:
  workflow_dispatch:
    inputs:
      targeted_only:
        description: 'Run only the source DDE attachment and one-action fork checks'
        required: false
        type: boolean
        default: false
      dragon_discard_audit:
        description: 'Also run three fixed source Dragon discard-hand telemetry deals'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Replay pinned Double Dragon technical fixture and bounded source-deck matches
        if: ${{ !inputs.targeted_only }}
        run: node simulation/twinleaf/dde-runtime-regression.cjs
      - name: Test effective Energy matcher
        if: ${{ !inputs.targeted_only }}
        run: node --test tests/dde-attach-priority.test.cjs
      - name: Diagnose source-first DDE v4 no-Apex passes and probe noninterference
        if: ${{ !inputs.targeted_only }}
        run: node --test tests/dde-v4-first-seat-policy-audit.test.cjs
      - name: Verify real-source DDE attachment observer with fake Store
        run: node --test tests/dde-v4-first-seat-source-root-target.test.cjs
      - name: Capture actual source DDE targets and immediate Energy movement
        run: node simulation/twinleaf/dde-v4-first-seat-source-root-target.cjs > rank10-dde-root-target.json
      - name: Archive actual root DDE attachment trace
        uses: actions/upload-artifact@v4
        with:
          name: rank10-dde-source-root-target
          path: rank10-dde-root-target.json
          retention-days: 90
      - name: Validate the exact source root 133 alternative guard
        run: node --test tests/dde-v4-first-seat-apex-bench-fork.test.cjs
      - name: Compare source-root 133 DDE Active versus prepared Bench recipient
        run: node simulation/twinleaf/dde-v4-first-seat-apex-bench-fork.cjs > rank10-apex-bench-dde-fork.json
      - name: Archive physical DDE retarget fork
        uses: actions/upload-artifact@v4
        with:
          name: rank10-apex-bench-dde-retarget
          path: rank10-apex-bench-dde-fork.json
          retention-days: 90
      - name: Test exact source Guzma pivot availability guards
        run: node --test tests/dde-root133-guzma-pivot.test.cjs
      - name: Evaluate one source-root DDE then Guzma pivot
        run: node simulation/twinleaf/dde-root133-guzma-pivot.cjs > rank10-root133-guzma-pivot.json
      - name: Summarize source-root Guzma opportunity and outcome
        run: node -e "const x=require('./rank10-root133-guzma-pivot.json'); console.log('ROOT133_GUZMA_WINDOW',JSON.stringify({window:x.window,guzmaProposed:x.guzmaProposed,promotion:x.ownPromotionPromptOverridden,opponentActiveAfterGust:x.opponentActiveAfterGust,control:x.control,counterfactual:x.counterfactual}));"
      - name: Archive source-root Guzma pivot
        uses: actions/upload-artifact@v4
        with:
          name: rank10-root133-guzma-pivot
          path: rank10-root133-guzma-pivot.json
          retention-days: 90
      - name: Test source-only Apex copy observer actor and prompt reference
        run: node --test tests/dde-root133-apex-copy-audit.test.cjs
      - name: Observe copied Dragon attack choices in source game
        run: node simulation/twinleaf/dde-root133-apex-copy-audit.cjs > rank10-root133-apex-copy.json
      - name: Archive copied Dragon attack source trace
        uses: actions/upload-artifact@v4
        with:
          name: rank10-root133-apex-copy-audit
          path: rank10-root133-apex-copy.json
          retention-days: 90
      - name: Test rank10 Dragon discard owner-hand accounting
        if: inputs.dragon_discard_audit
        run: node --test tests/regidrago-dragon-discard-access-audit.test.cjs
      - name: Observe three fixed source Dragon discard-option deals
        if: inputs.dragon_discard_audit
        run: node simulation/twinleaf/regidrago-dragon-discard-source-run.cjs > rank10-discard-window.json
      - name: Summarize source discard resource windows
        if: inputs.dragon_discard_audit
        run: node -e "const x=require('./rank10-discard-window.json'); console.log(JSON.stringify(x.map(r=>({seed:r.seed,first:r.firstTurnSlot,finished:r.finished,items:r.coPresentItemTurns,supporters:r.coPresentSupporterTurns,windows:r.windows.length}))))"
      - name: Archive rank10 source discard windows
        if: inputs.dragon_discard_audit
        uses: actions/upload-artifact@v4
        with:
          name: rank10-owner-discard-windows
          path: rank10-discard-window.json
          retention-days: 90
      - name: Verify pinned Apex-aware attachment priority
        if: ${{ !inputs.targeted_only }}
        run: node simulation/twinleaf/dde-target-priority.cjs
      - name: Test real Temple search and Marshadow recovery
        if: ${{ !inputs.targeted_only }}
        run: node simulation/twinleaf/temple-search-action-chain.cjs
      - name: Check separate hidden-order policy invariant
        if: ${{ !inputs.targeted_only }}
        run: node simulation/twinleaf/hidden-deck-order-policy.cjs
      - name: Source-deck Double Dragon decision audit
        if: ${{ !inputs.targeted_only }}
        run: node simulation/twinleaf/regidrago-dde-opportunities.cjs
      - name: Check field-evaluator policy provenance
        if: ${{ !inputs.targeted_only }}
        run: node --test tests/test-aichi-field-benchmark.cjs
