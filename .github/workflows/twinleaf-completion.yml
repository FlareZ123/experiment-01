name: Twinleaf bounded full-match probe

on:
  workflow_dispatch:
    inputs:
      abort_provenance_only:
        description: 'Verify Agent18 native abort physical-deal, seat, and root custody only'
        required: false
        type: boolean
        default: false
      include_mirrored_v6_source_funnel:
        description: 'Additionally audit verified original-source owner roots on precommitted symmetric v6 eight arms'
        required: false
        type: boolean
        default: false
      include_v6_bilateral_special_energy_aba:
        description: 'Additionally compare same registered v6 eight arms with shared both-seat Special Energy attachments'
        required: false
        type: boolean
        default: false
      include_agent36_prize_v5:
        description: 'Retrospective frozen original eight-arm v4/v5 same-deal innermost owner Prize and Pokémon comparison'
        required: false
        type: boolean
        default: false
      include_agent45_ghala_v9:
        description: 'Original eight same physical deal relaxed G&H two-card native payment feasibility stress'
        required: false
        type: boolean
        default: false
      include_agent45_ghala_v8:
        description: 'Registered same-eight actual Tag Call fetched Guzma Hala paid owner Supporter/Prompt follow-up'
        required: false
        type: boolean
        default: false
      include_agent45_tagcall_v7:
        description: 'Original eight exact-deal retrospective v5 versus actual owner Tag Call to Guzma and Hala, 48 roots, development only'
        required: false
        type: boolean
        default: false
      include_agent45_native_vip_v6:
        description: 'Retrospective v5 versus original-eight native-selected VIP owner search: physical 48-root developmental diagnostic'
        required: false
        type: boolean
        default: false
      include_agent8_telepath_v5:
        description: 'Retrospective original-eight v5 plus owner Telepathic Psychic Bench search, developmental only'
        required: false
        type: boolean
        default: false
      include_agent8_shadowmist_source_lock:
        description: 'Historical rank6 source-owner Shadow Mist lock flags before actual 96-root Passes, developmental only'
        required: false
        type: boolean
        default: false
      include_agent7_shadowmist_source_hammer_opportunity:
        description: 'Audit genuine owner-held Crushing Hammer and native preliminary canPlay at original rank6 Shadow Mist Pass; selected 48-root only'
        required: false
        type: boolean
        default: false
      include_agent7_shadowmist_original48_hammer_AB:
        description: 'Original eight same-deal 48-root pure Pass versus source-visible Hammer after-Pass A/B, developmental only'
        required: false
        type: boolean
        default: false
      include_agent7_shadowmist_original48_plumeria_AB:
        description: 'Original eight exact-deal 48-root owner Plumeria after-Pass counterfactual; genuine prompts, developmental only'
        required: false
        type: boolean
        default: false
      include_agent20_all33_pass_tools:
        description: 'Read-only original v5 archive 33-source-Pass Tool structural census pure regression (no match win count)'
        required: false
        type: boolean
        default: false
      include_agent20_tool_counterfactual:
        description: 'Exact-state original-v5 source owner Tool attachments and real opponent reply, development only'
        required: false
        type: boolean
        default: false
      include_agent20_source_pass_opportunity:
        description: 'Original v5 eight-arm same-deal owner-visible source Pass and negative paper-prerequisite audit'
        required: false
        type: boolean
        default: false
      include_agent36_selected_v4:
        description: 'Run steward-selected 48-root eight-arm bilateral Special Energy and Capture prompt developmental closure'
        required: false
        type: boolean
        default: false
      include_agent9_telepath_v6:
        description: 'Compare frozen v5 versus exact Telepath owner-deck v6 treatment on the same original eight physical deals'
        required: false
        type: boolean
        default: false
      include_agent4_capture_retrospective_96:
        description: 'Retrospective original rank6/rank11 same-deal Capture prompt followthrough with 96 actual native roots, separate from frozen 48 cap'
        required: false
        type: boolean
        default: false
      include_agent35_rank11_letter_fork:
        description: 'Single original rank11 source Pass37 real Professor Letter native Store fork, developmental only'
        required: false
        type: boolean
        default: false
      include_agent4_bilateral_mail_aba:
        description: 'Prospective original eight A/B/A, native owner-only Trainers Mail Pass and top-four search on both seats'
        required: false
        type: boolean
        default: false
      include_agent4_rank6_mail_prompt_v2:
        description: 'Original rank6 same Mail Store fork plus exact owner-only native top-four prompt receipt'
        required: false
        type: boolean
        default: false
      include_agent4_rank6_mail_fork:
        description: 'Retrospective original rank6 first-owner-turn Pass14 to held Trainers Mail native one-Item fork'
        required: false
        type: boolean
        default: false
      include_agent3_rank11_letter_owner_search:
        description: 'Source-locked rank11 Letter37 native owner Energy search: exact physical-card settlement only, zero qualified games'
        required: false
        type: boolean
        default: false
      include_agent35_v5_owner_pass_replay:
        description: 'Frozen eight-arm source-owner Pass physical hand and board observation, no deck wins'
        required: false
        type: boolean
        default: false
      include_agent42_rank1_paid_retreat_aba:
        description: 'Retrospective original rank1 exact-deal two-Psychic paid Retreat A/B/A, 0 qualified games'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bounded-match:
    if: ${{ !inputs.abort_provenance_only && !inputs.include_agent35_v5_owner_pass_replay && !inputs.include_agent35_rank11_letter_fork && !inputs.include_agent3_rank11_letter_owner_search && !inputs.include_agent4_rank6_mail_prompt_v2 && !inputs.include_agent4_rank6_mail_fork && !inputs.include_agent4_bilateral_mail_aba }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf commit
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile server
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Validate both-seat PLS Dowsing paper payment and Prism Star replacement
        run: node --test tests/agent36-dowsing-payment-guard.test.cjs tests/agent36-dowsing-payment-guard.native.test.cjs
      - name: Diagnose default bot response to unseen owner-deck order on both seats
        run: node simulation/evaluation/agent36-raw-bot-own-deck-order-native.cjs
      - name: Check pinned Girafarig Get Lost paper choices in real Store
        run: node --test tests/agent29-girafarig-getlost-paper-hook.native.test.cjs
      - name: Probe one complete game with a firm 1200-action limit
        run: node simulation/twinleaf/completion-fixture.cjs
      - name: Probe real Aichi decks from both seats
        run: node simulation/twinleaf/aichi-fixture.cjs
  abort-custody:
    if: ${{ inputs.abort_provenance_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up pinned upstream Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify independent Camping Gear paper choice and generic silent native prompt settlement
        run: node --test tests/agent12-campinggear-prompt-paper-hook.test.cjs tests/agent12-paper-prompt-disposition-observer.test.cjs tests/agent41-paper-prompt-contract-portfolio.test.cjs tests/agent39-paper-prompt-portfolio.test.cjs
      - name: Reject silent no-op and disappearing setup Confirm prompts on both seats
        run: node --test tests/agent4-owner-setup-confirm.test.cjs tests/agent4-owner-setup-starting-pokemon.test.cjs
      - name: Validate protected entry multi-Basic owner prompt settlement and zones
        run: node --test tests/agent4-protected-multibasic-settlement.test.cjs
      - name: Reject native silent-no-op Night Watch and Get Lost source prompts on both seats
        run: node --test tests/agent36-source-stamped-nightwatch-owner.test.cjs tests/agent36-source-stamped-getlost-owner.test.cjs
      - name: Audit paper Tool payment, physical custody and next-turn opponent reply
        run: node --test tests/agent42-root-gap-floatstone-custody.test.cjs tests/agent42-public-two-unit-paid-retreat-proposal.test.cjs tests/agent42-two-psychic-retreat-physical-custody.test.cjs tests/agent42-two-unit-retreat-actor-integration.test.cjs
      - name: Install upstream server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned upstream Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify owner Telepathic Psychic Bench search, physical settlement and v5 nesting pure controls
        run: node --test tests/agent8-owner-telepathic-bench-search.test.cjs tests/agent8-owner-telepathic-bench-search.native.test.cjs tests/agent8-issue25-v5-telepath-development.test.cjs
      - name: Verify source action census and all-Special Energy source matrix plus read-only lock audit pure controls
        run: node --test tests/agent8-issue25-source-action-census.test.cjs tests/agent8-shadowmist-all-special-source-matrix.test.cjs tests/agent8-rank6-shadowmist-source-pass-audit.test.cjs
      - name: Audit true native original rank6 Shadow Mist flags at 96-root owner Passes
        if: ${{ inputs.include_agent8_shadowmist_source_lock }}
        run: node --test tests/agent8-rank6-shadowmist-source-pass-audit.native.test.cjs
      - name: Retrospectively compare the same eight v5 arms with actual owner Telepathic search
        if: ${{ inputs.include_agent8_telepath_v5 }}
        env:
          ISSUE25_AGENT8_TELEPATH_DIR: issue25-agent8-telepath
        run: node --test tests/agent8-issue25-v5-telepath-development.native.test.cjs
      - name: Preserve original v5 and Telepath treatment ledgers with atomic digests
        if: ${{ always() && inputs.include_agent8_telepath_v5 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent8-issue25-telepath-v5-same-eight-native
          path: issue25-agent8-telepath/
          retention-days: 21
          if-no-files-found: warn
      - name: Audit source-held Hammer counterplay at genuine Shadow Mist Pass in original eight
        if: ${{ inputs.include_agent7_shadowmist_source_hammer_opportunity }}
        run: node --test tests/agent7-shadowmist-owner-lock-witness.test.cjs tests/agent7-shadowmist-owner-lock-witness.native.test.cjs
      - name: Retrospective original eight-arm pure Pass versus native Hammer after-Pass A/B
        if: ${{ inputs.include_agent7_shadowmist_original48_hammer_AB }}
        run: node --test tests/agent7-shadowmist-original48-hammer-aba.test.cjs tests/agent7-shadowmist-original48-hammer-aba.native.test.cjs
      - name: Retrospective original eight-arm source owner Plumeria after-Pass A/B
        if: ${{ inputs.include_agent7_shadowmist_original48_plumeria_AB }}
        run: node --test tests/agent7-shadowmist-original48-plumeria-aba.test.cjs tests/agent7-shadowmist-original48-plumeria-aba.native.test.cjs
      - name: Retrospective identical Plumeria source root with alternative fully paid owner-hand two-card costs
        if: ${{ inputs.include_agent7_shadowmist_original48_plumeria_AB }}
        run: node --test tests/agent7-plumeria-preserve-mail-payment.test.cjs tests/agent7-plumeria-payment-original48-pair.native.test.cjs
      - name: Execute Agent36 steward-selected bilateral v4 and retain all eight native outcomes
        if: ${{ inputs.include_agent36_selected_v4 }}
        env:
          ISSUE25_STEWARD_V4_DIR: issue25-steward-v4
        run: node --test tests/agent36-issue25-steward-selected-v4.test.cjs tests/agent36-issue25-steward-selected-v4.native.test.cjs
      - name: Validate Telepath authentic owner-deck search invariants
        if: ${{ inputs.include_agent9_telepath_v6 }}
        run: node --test tests/agent9-telepath-owner-choice.test.cjs
      - name: Validate Agent20 original 33-Pass Tool structural census with synthetic negative receipts
        if: ${{ inputs.include_agent20_all33_pass_tools }}
        run: node --test tests/agent20-owner-pass-tool-structural-audit.test.cjs
      - name: Native original v5 source Pass to owned Tool physical counterfactual
        if: ${{ inputs.include_agent20_tool_counterfactual }}
        env:
          AGENT20_TOOL_TREATMENT_DIR: issue25-agent20-tool-treatment
        run: node --test tests/agent20-issue25-v5-source-tool-counterfactual.test.cjs tests/agent20-issue25-v5-source-tool-counterfactual.native.test.cjs
      - name: Archive native original v5 Tool action/receipt and first opposing root
        if: ${{ always() && inputs.include_agent20_tool_counterfactual }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-issue25-original-v5-source-tool-counterfactual
          path: issue25-agent20-tool-treatment/
          retention-days: 21
          if-no-files-found: warn
      - name: Replay original v5 source Pass anchors with owner-only paper prerequisite audit
        if: ${{ inputs.include_agent20_source_pass_opportunity }}
        env:
          AGENT20_SOURCE_PASS_DIR: issue25-agent20-source-pass
        run: node --test tests/agent20-issue25-v5-source-pass-opportunity.test.cjs tests/agent20-issue25-v5-source-pass-opportunity.native.test.cjs
      - name: Archive all eight native outcomes and two exact owner Pass snapshots
        if: ${{ always() && inputs.include_agent20_source_pass_opportunity }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-issue25-original-v5-source-pass-opportunity
          path: issue25-agent20-source-pass/
          retention-days: 21
          if-no-files-found: warn
      - name: Run retrospective Agent36 owner Prize and promotion same-deal v4 versus v5
        if: ${{ inputs.include_agent36_prize_v5 }}
        env:
          ISSUE25_STEWARD_V5_DIR: issue25-steward-v5
        run: node --test tests/agent36-issue25-steward-innermost-prize-v5.test.cjs tests/agent36-issue25-steward-innermost-prize-v5.native.test.cjs
      - name: Retrospective Agent45 actual paid G&H two-other-card owner native feasibility versus conservative baseline
        if: ${{ inputs.include_agent45_ghala_v9 }}
        env:
          ISSUE25_AGENT45_GHALA_V9_DIR: issue25-agent45-ghala-v9
        run: node --test tests/agent45-owner-ghala-relaxed-cost.test.cjs tests/agent45-issue25-ghala-relaxed-v9.native.test.cjs
      - name: Retrospective Agent45 genuine fetched G&H Supporter and paid native owner search after Tag Call
        if: ${{ inputs.include_agent45_ghala_v8 }}
        env:
          ISSUE25_AGENT45_GHALA_V8_DIR: issue25-agent45-ghala-v8
        run: node --test tests/agent45-owner-ghala-after-tagcall.test.cjs tests/agent45-issue25-ghala-followup-v8.test.cjs tests/agent45-issue25-ghala-followup-v8.native.test.cjs
      - name: Retrospective Agent45 Tag Call native Item and authentic Guzma Hala own-deck search, eight original 48-root deals
        if: ${{ inputs.include_agent45_tagcall_v7 }}
        env:
          ISSUE25_AGENT45_TAGCALL_V7_DIR: issue25-agent45-tagcall-v7
        run: node --test tests/agent45-issue25-owner-tagcall-v7.test.cjs tests/agent45-owner-tagcall-public-difference.test.cjs tests/agent45-issue25-owner-tagcall-v7.native.test.cjs
      - name: Retrospective Agent45 native-selected VIP prompt after genuine Item root, identical v5 initial source deals
        if: ${{ inputs.include_agent45_native_vip_v6 }}
        env:
          ISSUE25_AGENT45_NATIVE_VIP_V6_DIR: issue25-agent45-native-vip-v6
        run: node --test tests/agent45-native-selected-vip-owner-search.test.cjs tests/agent45-issue25-native-vip-v6.test.cjs tests/agent45-issue25-native-vip-v6.native.test.cjs
      - name: Compare registered v5 versus Telepath owner-deck v6 on the original native eight
        if: ${{ inputs.include_agent9_telepath_v6 }}
        env:
          AGENT9_TELEPATH_V6_DIR: agent9-telepath-v6
        run: node --test tests/agent9-issue25-telepath-v6.native.test.cjs
      - name: Archive original eight matched relaxed G&H true two-card payment receipts and SHA digests
        if: ${{ always() && inputs.include_agent45_ghala_v9 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent45-issue25-native-ghala-v9
          path: issue25-agent45-ghala-v9/
          retention-days: 21
          if-no-files-found: warn
      - name: Archive eight registered Tag Call then native G&H paid source experiments
        if: ${{ always() && inputs.include_agent45_ghala_v8 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent45-issue25-native-ghala-v8
          path: issue25-agent45-ghala-v8/
          retention-days: 21
          if-no-files-found: warn
      - name: Archive exact original eight Tag Call v5-v7 native receipts and SHA256 sidecars
        if: ${{ always() && inputs.include_agent45_tagcall_v7 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent45-issue25-owner-tagcall-v7
          path: issue25-agent45-tagcall-v7/
          retention-days: 21
          if-no-files-found: warn
      - name: Archive all original eight native-selected VIP v5-v6 results, including errors and censored arms
        if: ${{ always() && inputs.include_agent45_native_vip_v6 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent45-issue25-native-selected-vip-v6
          path: issue25-agent45-native-vip-v6/
          retention-days: 21
          if-no-files-found: warn
      - name: Archive source-preserving Telepath v5-v6 retrospective native ledgers
        if: ${{ always() && inputs.include_agent9_telepath_v6 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent9-issue25-telepath-v5-v6-native
          path: agent9-telepath-v6/
          retention-days: 21
          if-no-files-found: warn
      - name: Archive both complete original eight-arm v4-v5 ledgers and SHA256 sidecars
        if: ${{ always() && inputs.include_agent36_prize_v5 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent36-issue25-steward-innermost-prize-v5-native
          path: issue25-steward-v5/
          retention-days: 21
          if-no-files-found: warn
      - name: Archive original eight-arm steward v4 receipt and SHA256
        if: ${{ always() && inputs.include_agent36_selected_v4 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent36-issue25-steward-selected-v4-native
          path: issue25-steward-v4/
          retention-days: 21
          if-no-files-found: warn
      - name: Verify real original rank5 setup Confirm settlements on both seats
        run: node --test tests/agent4-owner-setup-confirm-native.test.cjs tests/agent4-owner-setup-starting-pokemon-native.test.cjs
      - name: Validate original rank4 protected entry multi-Basic physical setup on both seats
        run: node --test tests/agent50-owner-protected-multibasic-store.native.test.cjs
      - name: Verify original Volt Cyclone paper prompt physical settlement and stale native no-op
        run: node simulation/twinleaf/agent39-volt-cyclone-paper-native.cjs
      - name: Verify printed Night Watch selected v3 native prompt settlement
        run: node --test tests/agent36-issue25-nightwatch-futuresight-v3.native.test.cjs
      - name: Verify staged nonempty source Get Lost physical Lost Zone custody on both seats
        run: node --test tests/agent27-getlost-owner-settled-native.test.cjs
      - name: Verify joined three-attack source-independent native Get Lost closure
        run: node --test tests/agent1-issue25-joined-three-attacks-v5.native.test.cjs
      - name: Stage actual two-Basic-Energy VMAX retreat and native payment on both seats
        run: node --test tests/agent42-two-unit-paid-retreat-native.test.cjs
      - name: Retrospective original rank1 three-arm paid two-Psychic native fork
        if: ${{ inputs.include_agent42_rank1_paid_retreat_aba }}
        run: node simulation/evaluation/agent42-rank1-two-psychic-original-aba.cjs
      - name: Archive exact original rank1 paid Retreat native A/B/A
        if: ${{ inputs.include_agent42_rank1_paid_retreat_aba }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-rank1-two-psychic-original-aba
          path: agent42-rank1-two-psychic-paid-retreat-original-aba-native.json
          retention-days: 7
      - name: Retrospective eight original source Capture Energy 96-root followthrough
        if: ${{ inputs.include_agent4_capture_retrospective_96 }}
        env:
          AGENT4_CAPTURE_RETRO96_DIR: capture-retro96
        run: node --test tests/agent4-issue25-capture-retrospective-96.native.test.cjs
      - name: Preserve all same-deal original source 96-root public ledgers, caps and errors
        if: ${{ always() && inputs.include_agent4_capture_retrospective_96 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent4-issue25-capture-retrospective-96-full-public-roots
          path: capture-retro96/
          retention-days: 21
          if-no-files-found: warn
      - name: Check owner-only Capture Energy search prompt negative controls
        run: node --test tests/agent41-owner-capture-energy-search.test.cjs
      - name: Verify redacted abort provenance and physical fingerprint validators
        run: node --test tests/agent18-aborted-native-provenance.test.cjs tests/native-dispatch-abort-evidence.test.cjs tests/agent18-issue25-source-root-custody.test.cjs tests/agent18-source-energy-physical-custody.test.cjs
      - name: Reproduce three native failure stages with complete deal custody
        run: node --test tests/native-dispatch-abort-archive.pinned.test.cjs
      - name: Validate four-arm accepted owner-root custody and error provenance
        run: |
          set -o pipefail
          node --test tests/agent50-issue25-owner-48root-quarantine.native.test.cjs | tee agent18-issue25-owner-roots-native.tap
      - name: Preserve full native owner-root audit including errors and censored attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-native-source-roots
          path: agent18-issue25-owner-roots-native.tap
          if-no-files-found: warn
          retention-days: 21
      - name: Audit same registered eight v6 arms under source-independent policy
        if: ${{ inputs.include_mirrored_v6_source_funnel }}
        run: |
          set -o pipefail
          node --test tests/agent18-issue25-mirrored-v6-source-roots.native.test.cjs | tee agent18-v6-source-roots-native.tap
      - name: Preserve eight-arm independent source-actor audit including aborted arm
        if: ${{ always() && inputs.include_mirrored_v6_source_funnel }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-v6-symmetric-source-roots
          path: agent18-v6-source-roots-native.tap
          if-no-files-found: warn
          retention-days: 21
      - name: Audit one bilateral Special Energy option against the unchanged registered v6
        if: ${{ inputs.include_v6_bilateral_special_energy_aba }}
        run: |
          set -o pipefail
          node --test tests/agent18-issue25-v6-bilateral-special-energy-aba.native.test.cjs | tee agent18-v6-special-energy-aba.tap
      - name: Preserve paired v6 Special Energy native evidence including failed arms
        if: ${{ always() && inputs.include_v6_bilateral_special_energy_aba }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-v6-bilateral-special-energy-aba
          path: agent18-v6-special-energy-aba.tap
          if-no-files-found: warn
          retention-days: 21
      - name: Observe original-source native Special Energy targets and public board changes
        if: ${{ inputs.include_v6_bilateral_special_energy_aba }}
        run: |
          set -o pipefail
          node --test tests/agent18-issue25-v6-energy-target-custody.native.test.cjs | tee agent18-v6-special-energy-targets.tap
      - name: Compare bounded v6 Capture Energy owner search continuation with source-owned Store evidence
        if: ${{ inputs.include_v6_bilateral_special_energy_aba }}
        run: |
          set -o pipefail
          node --test tests/agent41-issue25-capture-owner.native.test.cjs | tee agent41-v6-capture-owner-native.tap
      - name: Preserve native Capture Energy source prompt continuation including failures
        if: ${{ always() && inputs.include_v6_bilateral_special_energy_aba }}
        uses: actions/upload-artifact@v4
        with:
          name: agent41-issue25-v6-capture-owner-native
          path: agent41-v6-capture-owner-native.tap
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve source-owned physical Special Energy native targets including aborts
        if: ${{ always() && inputs.include_v6_bilateral_special_energy_aba }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-v6-special-energy-targets
          path: agent18-v6-special-energy-targets.tap
          if-no-files-found: warn
          retention-days: 21
  original-v5-owner-pass-observation:
