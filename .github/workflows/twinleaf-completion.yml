name: Twinleaf bounded full-match probe

on:
  workflow_dispatch:
    inputs:
      abort_provenance_only:
        description: 'Verify Agent18 native abort physical-deal, seat, and root custody only'
        required: false
        type: boolean
        default: false
      include_mirrored_v6_source_funnel:
        description: 'Additionally audit verified original-source owner roots on precommitted symmetric v6 eight arms'
        required: false
        type: boolean
        default: false
      include_v6_bilateral_special_energy_aba:
        description: 'Additionally compare same registered v6 eight arms with shared both-seat Special Energy attachments'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bounded-match:
    if: ${{ !inputs.abort_provenance_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf commit
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile server
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Validate both-seat PLS Dowsing paper payment and Prism Star replacement
        run: node --test tests/agent36-dowsing-payment-guard.test.cjs tests/agent36-dowsing-payment-guard.native.test.cjs
      - name: Diagnose default bot response to unseen owner-deck order on both seats
        run: node simulation/evaluation/agent36-raw-bot-own-deck-order-native.cjs
      - name: Check pinned Girafarig Get Lost paper choices in real Store
        run: node --test tests/agent29-girafarig-getlost-paper-hook.native.test.cjs
      - name: Probe one complete game with a firm 1200-action limit
        run: node simulation/twinleaf/completion-fixture.cjs
      - name: Probe real Aichi decks from both seats
        run: node simulation/twinleaf/aichi-fixture.cjs
  abort-custody:
    if: ${{ inputs.abort_provenance_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf revision
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up pinned upstream Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Audit paper Tool payment, physical custody and next-turn opponent reply
        run: node --test tests/agent42-root-gap-floatstone-custody.test.cjs tests/agent42-public-two-unit-paid-retreat-proposal.test.cjs
      - name: Install upstream server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned upstream Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Stage actual two-Basic-Energy VMAX retreat and native payment on both seats
        run: node --test tests/agent42-two-unit-paid-retreat-native.test.cjs
      - name: Verify redacted abort provenance and physical fingerprint validators
        run: node --test tests/agent18-aborted-native-provenance.test.cjs tests/native-dispatch-abort-evidence.test.cjs tests/agent18-issue25-source-root-custody.test.cjs tests/agent18-source-energy-physical-custody.test.cjs
      - name: Reproduce three native failure stages with complete deal custody
        run: node --test tests/native-dispatch-abort-archive.pinned.test.cjs
      - name: Validate four-arm accepted owner-root custody and error provenance
        run: |
          set -o pipefail
          node --test tests/agent50-issue25-owner-48root-quarantine.native.test.cjs | tee agent18-issue25-owner-roots-native.tap
      - name: Preserve full native owner-root audit including errors and censored attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-native-source-roots
          path: agent18-issue25-owner-roots-native.tap
          if-no-files-found: warn
          retention-days: 21
      - name: Audit same registered eight v6 arms under source-independent policy
        if: ${{ inputs.include_mirrored_v6_source_funnel }}
        run: |
          set -o pipefail
          node --test tests/agent18-issue25-mirrored-v6-source-roots.native.test.cjs | tee agent18-v6-source-roots-native.tap
      - name: Preserve eight-arm independent source-actor audit including aborted arm
        if: ${{ always() && inputs.include_mirrored_v6_source_funnel }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-v6-symmetric-source-roots
          path: agent18-v6-source-roots-native.tap
          if-no-files-found: warn
          retention-days: 21
      - name: Audit one bilateral Special Energy option against the unchanged registered v6
        if: ${{ inputs.include_v6_bilateral_special_energy_aba }}
        run: |
          set -o pipefail
          node --test tests/agent18-issue25-v6-bilateral-special-energy-aba.native.test.cjs | tee agent18-v6-special-energy-aba.tap
      - name: Preserve paired v6 Special Energy native evidence including failed arms
        if: ${{ always() && inputs.include_v6_bilateral_special_energy_aba }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-v6-bilateral-special-energy-aba
          path: agent18-v6-special-energy-aba.tap
          if-no-files-found: warn
          retention-days: 21
      - name: Observe original-source native Special Energy targets and public board changes
        if: ${{ inputs.include_v6_bilateral_special_energy_aba }}
        run: |
          set -o pipefail
          node --test tests/agent18-issue25-v6-energy-target-custody.native.test.cjs | tee agent18-v6-special-energy-targets.tap
      - name: Preserve source-owned physical Special Energy native targets including aborts
        if: ${{ always() && inputs.include_v6_bilateral_special_energy_aba }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-issue25-v6-special-energy-targets
          path: agent18-v6-special-energy-targets.tap
          if-no-files-found: warn
          retention-days: 21
