name: Aichi public image provenance audit

on:
  workflow_dispatch:
    inputs:
      rank28_original_variants:
        description: 'Compare original rank28 image resolutions and QR payload'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-source parsing dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'filelock>=3.13,<4'
      - name: Verify fail-closed gallery grouping against fixtures
        run: python -m unittest discover -s tests -p test_aichi_note_gallery_probe.py -v
      - name: Fetch original article and extract unassigned gallery URLs
        run: python scripts/aichi_note_gallery_probe.py
      - name: Verify bounded public image origin restrictions
        run: python -m unittest discover -s tests -p test_aichi_gallery_image_capture.py -v
      - name: Capture the unassigned original gallery images
        run: python scripts/aichi_gallery_image_capture.py
      - name: Verify offline rank28 variant and provenance cases
        run: python -m unittest discover -s tests -p test_aichi_rank28_image_variants.py -v
      - name: Install optional public QR reader
        if: inputs.rank28_original_variants
        run: python -m pip install 'opencv-python-headless>=4.8,<5'
      - name: Probe official host rank28 resolution variants and QR
        if: inputs.rank28_original_variants
        run: python scripts/aichi_rank28_image_variants.py
      - name: Archive optional original resolution comparisons
        if: inputs.rank28_original_variants && always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-rank28-original-variant-comparison
          path: results/aichi-2026/rank28-image-variants/
          if-no-files-found: warn
          retention-days: 14
      - name: Archive inspectable original images and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-gallery-original-images
          path: results/aichi-2026/gallery-images/
          if-no-files-found: warn
          retention-days: 14
      - name: Archive source URL evidence without guessing player attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-gallery-provenance
          path: results/aichi-2026/gallery-provenance-probe.json
          if-no-files-found: warn
          retention-days: 14
