name: Aichi published field threat audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aichi-published-threat-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate field presence and co-occurrence
        run: node --test tests/field_threat_audit.test.cjs
      - name: Audit printed counterplay incidence against canonical lock matrix
        run: node --test tests/aichi-printing-lock-surface.test.cjs
      - name: Verify source-print threats across five omitted archetypes
        run: node --test tests/aichi-unrepresented-mechanics.test.cjs
      - name: Check exact Iron Thorns three-family denial-card access
        run: node --test tests/agent25-thorns-triple-denial-access.test.cjs
      - name: Regress original source-root bounded-example and paired-deal fidelity
        run: node --test tests/agent25-source32-contest-example-fidelity.test.cjs
      - name: Verify post-Aichi Dhelmise exact one-Prize development 60 and direct Prize-aware route
        run: node --test tests/agent25-dhelmise-t1-physical-opportunity.test.cjs
      - name: Verify original-source discard Ability locks and two Dhelmise donor variants
        run: node --test tests/agent25-dhelmise-hns-discard-lock.test.cjs
      - name: Verify opt-in HNS discard lock helper with independent reduced-case tests
        run: node --test tests/agent25-hns-discard-ability-lock-hook.test.cjs
      - name: Verify alternative 8, 10, 12 donor locks versus card-location bottleneck
        run: node --test tests/agent25-dhelmise-donor-count-frontier.test.cjs
      - name: Verify exact first-turn Dhelmise conditional Wobbuffet and Silent Lab donor loss
        run: node --test tests/agent25-dhelmise-lock-conditioned-opening.test.cjs
      - name: Verify owner-visible Dhelmise Compressor donor priority and refusal cases
        run: node --test tests/agent25-dhelmise-compressor-donors.test.cjs
      - name: Verify exact ordinary Basic plus Telepathic Psychic HNS opener versus narrow Clefairy line
        run: node --test tests/agent25-dhelmise-any-psychic-attack-opening.test.cjs
      - name: Regress original Thorns first-turn Tag Call access and fragile New Moon conjunction
        run: |
          node --test tests/agent11-thorns-tagcall-first-attack.test.cjs tests/agent11-newmoon-thorns-firstturn-exposure.test.cjs
          node scripts/agent11-thorns-tagcall-first-attack.cjs
          node scripts/agent11-newmoon-thorns-firstturn-exposure.cjs
      - name: Emit auditable JSON report
        run: node scripts/field_threat_audit.cjs
