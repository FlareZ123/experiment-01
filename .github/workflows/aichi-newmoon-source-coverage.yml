name: Aichi New Moon printing coverage

on:
  workflow_dispatch:
    inputs:
      rank15_source_census:
        description: 'Run eight frozen source-dealt rank15 dual-lock exposure diagnostics'
        type: boolean
        required: false
        default: false
      rank15_policy_pair:
        description: 'Run matched original-source rank15 Bunnelby Evolution policy comparison'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  newmoon:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Inspect real Store Secret Box cost and search prompt on staged Garbodor board
        run: node simulation/twinleaf/newmoon-secretbox-store-prompt-probe.cjs > newmoon-secretbox-store-prompt.json
      - name: Preserve staged Secret Box diagnostic even if later tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-secretbox-store-prompt
          path: newmoon-secretbox-store-prompt.json
          if-no-files-found: warn
      - name: Exercise staged Secret Box four-category search into Field Blower
        run: node simulation/twinleaf/newmoon-secretbox-fieldblower-live-line.cjs > newmoon-secretbox-fieldblower-chain.json
      - name: Display staged Secret Box completion audit
        run: node -e "const x=require('./newmoon-secretbox-fieldblower-chain.json'); console.log(JSON.stringify({trace:x.trace,afterSearch:x.afterSearch,afterBlower:x.afterBlower,qualifiedForCompetitiveInference:x.qualifiedForCompetitiveInference},null,2))"
      - name: Archive staged Box-to-Blower real Store action chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-secretbox-fieldblower-chain
          path: newmoon-secretbox-fieldblower-chain.json
          if-no-files-found: warn
      - name: Resolve paid-Gengar Secret Box into copied Horror House and delayed Powerglass
        run: node -e "process.stdout.write(JSON.stringify(require('./simulation/twinleaf/newmoon-secretbox-fieldblower-live-line.cjs').run({bridgeToHorrorHouse:true}),null,2)+'\\n')" > newmoon-secretbox-horrorhouse-chain.json
      - name: Show copied-GX and late Energy witness
        run: node -e "const x=require('./newmoon-secretbox-horrorhouse-chain.json'); console.log(JSON.stringify({attackBridge:x.attackBridge,trace:x.trace},null,2))"
      - name: Archive staged paid-payload attack bridge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-secretbox-horrorhouse-chain
          path: newmoon-secretbox-horrorhouse-chain.json
          if-no-files-found: warn
      - name: Run source identity and printing hash regression
        run: node --test tests/new-moon-print-map.test.cjs
      - name: Check original Japanese source printing identifiers and dated ban collision
        run: node --test tests/new-moon-japanese-source-print-gate.test.cjs
      - name: Validate candidate 60 printed-engine variants
        run: node simulation/twinleaf/new-moon-pinned-print-validate.cjs > newmoon-pinned-60.json
      - name: Preserve pinned English mechanics-equivalent 60
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-pinned-60
          path: newmoon-pinned-60.json
          if-no-files-found: error
      - name: Check frozen New Moon counter-package source and exact access
        run: node --test tests/new-moon-lockbreak.test.cjs
      - name: Validate source-locked alternative with pinned engine
        run: node simulation/twinleaf/new-moon-lockbreak-validate.cjs > newmoon-lockbreak-pinned-60.json
      - name: Record conditional direct anti-lock Item access
        run: node scripts/new-moon-lockbreak-access.cjs > newmoon-lockbreak-direct-access.json
      - name: Preserve inspectable challenger print and access packets
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-lockbreak-candidate-v1
          path: |
            newmoon-lockbreak-pinned-60.json
            newmoon-lockbreak-direct-access.json
          if-no-files-found: error
      - name: Check exact Iron Thorns opponent mulligan-driven Item access
        run: node --test tests/new-moon-lockbreak-mulligan.test.cjs
      - name: Preserve Iron Thorns opponent bonus-draw access prediction
        run: node scripts/new-moon-lockbreak-mulligan.cjs > newmoon-lockbreak-thorns-mulligan.json
      - name: Upload source-deck-matched bonus access ledger
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-lockbreak-thorns-mulligan
          path: newmoon-lockbreak-thorns-mulligan.json
          if-no-files-found: error
      - name: Test starter-coupled New Moon Iron Thorns direct resource probabilities
        run: node --test tests/new-moon-thorns-starter-joint.test.cjs
      - name: Record starter-coupled anti-lock resource access
        run: node scripts/new-moon-thorns-starter-joint.cjs > newmoon-thorns-starter-joint.json
      - name: Preserve independently tested starter-coupled access output
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-thorns-starter-joint-v1
          path: newmoon-thorns-starter-joint.json
          if-no-files-found: error
      - name: Exercise New Moon printed Perfection across Garbotoxin and active lock
        run: node simulation/twinleaf/new-moon-lockbreak-ability-gates.cjs > newmoon-lockbreak-ability-gates.json
      - name: Probe rank15 two-print Vileplume versus Basic and Stage1 source attacks
        run: node simulation/twinleaf/new-moon-rank15-dual-lock-actions.cjs > newmoon-rank15-dual-vileplume.json
      - name: Preserve source-printed rank15 conditioned attack gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-rank15-dual-vileplume
          path: newmoon-rank15-dual-vileplume.json
          if-no-files-found: warn
      - name: Preserve live Store lockbreak answer matrix
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-lockbreak-ability-gates
          path: newmoon-lockbreak-ability-gates.json
          if-no-files-found: error
      - name: Build source 60-card English-name coverage report
        run: node simulation/twinleaf/newmoon-source-coverage.cjs > newmoon-source-coverage.json
      - name: Display available/missing source names
        run: node -e "const v=require('./newmoon-source-coverage.json'); console.log(JSON.stringify({mappedPhysicalCards:v.mappedPhysicalCards,total:v.cardCount,unmatched:v.unmatched,perCard:v.entries.map(x=>[x.english,x.availableEngineFullNames])},null,2))"
      - name: Run official-order New Moon Stadium action probe
        run: node simulation/twinleaf/new-moon-stadium-order-audit.cjs > newmoon-stadium-order-audit.json
      - name: Display Stadium ordering evidence
        run: node -e "const v=require('./newmoon-stadium-order-audit.json'); console.log(JSON.stringify(v,null,2))"
      - name: Test New Moon Path counterline under active Iron Thorns Initialization
        run: node simulation/twinleaf/new-moon-thorns-path-audit.cjs > newmoon-thorns-path-audit.json
      - name: Preserve staged Stadium versus Iron Thorns answer
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-thorns-path-audit
          path: newmoon-thorns-path-audit.json
          if-no-files-found: error
      - name: Probe Klefki and Latias own-team Ability lock
        run: node simulation/twinleaf/new-moon-klefki-latias-audit.cjs > newmoon-klefki-latias-audit.json
      - name: Display Klefki-Latias engine evidence
        run: node -e "console.log(JSON.stringify(require('./newmoon-klefki-latias-audit.json'),null,2))"
      - name: Preserve Klefki-Latias action proof
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-klefki-latias-audit
          path: newmoon-klefki-latias-audit.json
          if-no-files-found: error
      - name: Test numeric shuffle prompt validation and reversible hook
        run: node --test tests/numeric-shuffle-validation-hook.test.cjs
      - name: Run Klefki Telepath first-turn bridge through pinned Store
        run: node simulation/twinleaf/new-moon-klefki-telepath-action.cjs > newmoon-klefki-telepath-action.json
      - name: Preserve Klefki Telepath action and retreat witness
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-klefki-telepath-action
          path: newmoon-klefki-telepath-action.json
          if-no-files-found: error
      - name: Probe deck-origin Sol Burst GX versus Telepath from-hand trigger
        run: node simulation/twinleaf/telepath-nonhand-solburst-source.cjs > telepath-nonhand-solburst-source.json
      - name: Check read-only physical card ownership diagnostics
        run: node --test tests/physical-card-ledger.test.cjs tests/telepath-root-attach-observer.test.cjs tests/physical-tool-storage.test.cjs tests/telepath-headless-root-audit.test.cjs tests/prompt-custody.test.cjs
      - name: Verify reversible Telepath origin and physical-zone correction in both seats
        run: node simulation/twinleaf/telepath-source-origin-paired.cjs > telepath-source-origin-paired.json
      - name: Preserve patched/unpatched/hand attachment witness
        uses: actions/upload-artifact@v4
        with:
          name: telepath-source-origin-paired
          path: telepath-source-origin-paired.json
          if-no-files-found: error
      - name: Preserve deck-origin Telepath negative engine witness
        uses: actions/upload-artifact@v4
        with:
          name: telepath-nonhand-solburst-source
          path: telepath-nonhand-solburst-source.json
          if-no-files-found: error
      - name: Audit early source-dealt rank 9 30 31 physical zone integrity
        run: node simulation/twinleaf/aichi-telepath-physical-source.cjs > aichi-telepath-physical-source.json
      - name: Preserve bounded authentic-deal Telepath ownership diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-telepath-physical-source
          path: aichi-telepath-physical-source.json
          if-no-files-found: warn
      - name: Check next-turn Horror House hand lock against prepowered Thorns attack
        run: node simulation/twinleaf/new-moon-native-horror-house-opponent-action.cjs > newmoon-horrorhouse-next-turn.json
      - name: Archive bounded opponent hand-lock versus attack counterexample
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-horrorhouse-next-turn
          path: newmoon-horrorhouse-next-turn.json
          if-no-files-found: error
      - name: Preserve Stadium ordering audit
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-stadium-order-audit
          path: newmoon-stadium-order-audit.json
          if-no-files-found: error
      - name: Test root-only source dual-lock observation and cleanup
        if: ${{ inputs.rank15_source_census }}
        run: node --test tests/newmoon-rank15-source-duallock-census.test.cjs
      - name: Run bounded source-dealt rank15 dual-lock opportunity census
        if: ${{ inputs.rank15_source_census }}
        run: node simulation/twinleaf/newmoon-rank15-source-duallock-census.cjs > newmoon-rank15-source-duallock-census.json
      - name: Show source-dealt rank15 lock exposure summary
        if: ${{ inputs.rank15_source_census }}
        run: >-
          node -e "const x=require('./newmoon-rank15-source-duallock-census.json'); console.log(JSON.stringify({schema:x.schema,trials:x.trialCount,actualFirst:x.candidateActuallyFirstCount,dual:x.jointSourceDualLockExposures,dusclopsAgainstDual:x.candidateDusclopsAgainstJointExposures,rows:x.rows.map(r=>({repeat:r.repeat,seat:r.candidateSeat,first:r.actualFirstSlot,actions:r.actions,finished:r.finished,turns:r.turns,aor:r.first.aor?.turn??null,bus:r.first.bus?.turn??null,busActive:r.first.busActive?.turn??null,dual:r.first.dual?.turn??null,dusclops:r.first.dusclops?.turn??null,dusclopsAgainstDual:r.first.dusclopsAgainstDual?.turn??null}))},null,2))"
      - name: Archive rank15 source-duallock unqualified root exposure census
        if: ${{ always() && inputs.rank15_source_census }}
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-rank15-root-census-unqualified
          path: newmoon-rank15-source-duallock-census.json
          if-no-files-found: warn
      - name: Test source root observer and exact opponent-policy root counters
        if: ${{ inputs.rank15_policy_pair }}
        run: node --test tests/newmoon-rank15-source-duallock-census.test.cjs tests/newmoon-rank15-bunnelby-policy-pair.test.cjs
      - name: Run matching rank15 Bunnelby original-source policy arms
        if: ${{ inputs.rank15_policy_pair }}
        run: node simulation/twinleaf/newmoon-rank15-bunnelby-policy-pair.cjs > newmoon-rank15-bunnelby-policy-pair.json
      - name: Show genuine rank15 Bunnelby dual-lock differential
        if: ${{ inputs.rank15_policy_pair }}
        run: >-
          node -e "const x=require('./newmoon-rank15-bunnelby-policy-pair.json'); console.log(JSON.stringify({schema:x.schema,pairs:x.opportunityPairs,first:x.actualFirstCandidateCount,generic:x.generic,bunnelbyEvolution:x.bunnelbyEvolution,rows:x.rows.map(r=>({repeat:r.repeat,seat:r.candidateSeat,trueFirst:r.actualFirstSlot,generic:{actions:r.generic.rootActions,aor:r.generic.first.aor?.turn??null,bus:r.generic.first.bus?.turn??null,dual:r.generic.first.dual?.turn??null,evo:r.generic.policyActions.evolutionRootDecisions.length,cards:r.generic.policyActions.cardsPlayed},bunnelby:{actions:r.bunnelbyEvolution.rootActions,aor:r.bunnelbyEvolution.first.aor?.turn??null,bus:r.bunnelbyEvolution.first.bus?.turn??null,dual:r.bunnelbyEvolution.first.dual?.turn??null,evo:r.bunnelbyEvolution.policyActions.evolutionRootDecisions.length,cards:r.bunnelbyEvolution.policyActions.cardsPlayed}}))},null,2))"
      - name: Preserve matched-source rank15 Bunnelby policy diagnostics
        if: ${{ always() && inputs.rank15_policy_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-rank15-bunnelby-policy-pair-unqualified
          path: newmoon-rank15-bunnelby-policy-pair.json
          if-no-files-found: warn
      - name: Preserve exact pinned catalog coverage
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-source-coverage
          path: newmoon-source-coverage.json
          if-no-files-found: error
