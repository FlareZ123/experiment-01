name: Aichi New Moon printing coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newmoon:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run source identity and printing hash regression
        run: node --test tests/new-moon-print-map.test.cjs
      - name: Validate candidate 60 printed-engine variants
        run: node simulation/twinleaf/new-moon-pinned-print-validate.cjs > newmoon-pinned-60.json
      - name: Preserve pinned English mechanics-equivalent 60
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-pinned-60
          path: newmoon-pinned-60.json
          if-no-files-found: error
      - name: Check frozen New Moon counter-package source and exact access
        run: node --test tests/new-moon-lockbreak.test.cjs
      - name: Validate source-locked alternative with pinned engine
        run: node simulation/twinleaf/new-moon-lockbreak-validate.cjs > newmoon-lockbreak-pinned-60.json
      - name: Record conditional direct anti-lock Item access
        run: node scripts/new-moon-lockbreak-access.cjs > newmoon-lockbreak-direct-access.json
      - name: Preserve inspectable challenger print and access packets
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-lockbreak-candidate-v1
          path: |
            newmoon-lockbreak-pinned-60.json
            newmoon-lockbreak-direct-access.json
          if-no-files-found: error
      - name: Check exact Iron Thorns opponent mulligan-driven Item access
        run: node --test tests/new-moon-lockbreak-mulligan.test.cjs
      - name: Preserve Iron Thorns opponent bonus-draw access prediction
        run: node scripts/new-moon-lockbreak-mulligan.cjs > newmoon-lockbreak-thorns-mulligan.json
      - name: Upload source-deck-matched bonus access ledger
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-lockbreak-thorns-mulligan
          path: newmoon-lockbreak-thorns-mulligan.json
          if-no-files-found: error
      - name: Test starter-coupled New Moon Iron Thorns direct resource probabilities
        run: node --test tests/new-moon-thorns-starter-joint.test.cjs
      - name: Record starter-coupled anti-lock resource access
        run: node scripts/new-moon-thorns-starter-joint.cjs > newmoon-thorns-starter-joint.json
      - name: Preserve independently tested starter-coupled access output
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-thorns-starter-joint-v1
          path: newmoon-thorns-starter-joint.json
          if-no-files-found: error
      - name: Exercise New Moon printed Perfection across Garbotoxin and active lock
        run: node simulation/twinleaf/new-moon-lockbreak-ability-gates.cjs > newmoon-lockbreak-ability-gates.json
      - name: Preserve live Store lockbreak answer matrix
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-lockbreak-ability-gates
          path: newmoon-lockbreak-ability-gates.json
          if-no-files-found: error
      - name: Build source 60-card English-name coverage report
        run: node simulation/twinleaf/newmoon-source-coverage.cjs > newmoon-source-coverage.json
      - name: Display available/missing source names
        run: node -e "const v=require('./newmoon-source-coverage.json'); console.log(JSON.stringify({mappedPhysicalCards:v.mappedPhysicalCards,total:v.cardCount,unmatched:v.unmatched,perCard:v.entries.map(x=>[x.english,x.availableEngineFullNames])},null,2))"
      - name: Run official-order New Moon Stadium action probe
        run: node simulation/twinleaf/new-moon-stadium-order-audit.cjs > newmoon-stadium-order-audit.json
      - name: Display Stadium ordering evidence
        run: node -e "const v=require('./newmoon-stadium-order-audit.json'); console.log(JSON.stringify(v,null,2))"
      - name: Test New Moon Path counterline under active Iron Thorns Initialization
        run: node simulation/twinleaf/new-moon-thorns-path-audit.cjs > newmoon-thorns-path-audit.json
      - name: Preserve staged Stadium versus Iron Thorns answer
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-thorns-path-audit
          path: newmoon-thorns-path-audit.json
          if-no-files-found: error
      - name: Probe Klefki and Latias own-team Ability lock
        run: node simulation/twinleaf/new-moon-klefki-latias-audit.cjs > newmoon-klefki-latias-audit.json
      - name: Display Klefki-Latias engine evidence
        run: node -e "console.log(JSON.stringify(require('./newmoon-klefki-latias-audit.json'),null,2))"
      - name: Preserve Klefki-Latias action proof
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-klefki-latias-audit
          path: newmoon-klefki-latias-audit.json
          if-no-files-found: error
      - name: Preserve Stadium ordering audit
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-stadium-order-audit
          path: newmoon-stadium-order-audit.json
          if-no-files-found: error
      - name: Preserve exact pinned catalog coverage
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-source-coverage
          path: newmoon-source-coverage.json
          if-no-files-found: error
