name: Aichi Redeemable Ticket Prize-redeal regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Independently check exact Prize probabilities
        run: node --test tests/aichi-meloetta-prize-ticket.test.cjs
      - name: Enumerate immediate Ticket plus Compressor shuffle routes
        run: node --test tests/aichi-meloetta-ticket-compressor.test.cjs
      - name: Dispatch Prize-redeal Item in actual Store
        run: node simulation/twinleaf/redeemable-ticket-prize-board.cjs
      - name: Play Ticket and Compressor with and without Item lock
        run: node simulation/twinleaf/redeemable-ticket-play-action.cjs
