name: Aichi Redeemable Ticket Prize-redeal regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Independently check exact Prize probabilities
        run: node --test tests/aichi-meloetta-prize-ticket.test.cjs
      - name: Enumerate immediate Ticket plus Compressor shuffle routes
        run: node --test tests/aichi-meloetta-ticket-compressor.test.cjs
      - name: Dispatch Prize-redeal Item in actual Store
        run: node simulation/twinleaf/redeemable-ticket-prize-board.cjs
      - name: Validate reversible paper-order Ticket correction
        run: node --test tests/redeemable-ticket-paper-hook.test.cjs
      - name: Preserve corrected Ticket Store evidence
        run: node simulation/twinleaf/redeemable-ticket-paper-regression.cjs
      - name: Check opt-in headless Ticket flag and restoration
        run: node --test tests/redeemable-ticket-headless-options.test.cjs
      - name: Verify staged Ticket and Compressor rescue witness
        run: node --test tests/ticket-compressor-shuffle-proof.test.cjs
      - name: Verify source-complete rank26 Ticket Compressor Item actions
        run: node --test tests/ticket-rank26-source-compressor.test.cjs
