name: Pinned Powerglass end-turn energy filter

on:
  workflow_dispatch:
    inputs:
      probe_ko_prize_order:
        description: 'Execute preregistered staged KO / Powerglass Prize timing comparison'
        type: boolean
        required: false
        default: false
      probe_agent7_root93_unown_powerglass:
        description: 'Run frozen four-arm staged original root93 Unown Powerglass print payoff contract'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  powerglass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Existing prompt integrity regression (independent from opt-in KO timing)
        if: ${{ !inputs.probe_ko_prize_order }}
        run: node --test tests/powerglass-energy-filter-store.test.cjs tests/prompt-integrity-energy-filter.test.cjs tests/prompt-integrity.test.cjs tests/prompt-integrity-pinned-selection.test.cjs tests/prompt-integrity-pinned-shuffle.test.cjs
      - name: Run registered Powerglass KO Prize sequence probe
        if: ${{ inputs.probe_ko_prize_order }}
        run: node simulation/twinleaf/powerglass-ko-prize-order.cjs > powerglass-ko-prize-order.json
      - name: Show stage-by-stage basic attachment and pending Prize ordering
        if: ${{ inputs.probe_ko_prize_order }}
        run: node -e "const p=require('./powerglass-ko-prize-order.json');console.log(JSON.stringify(p,null,2))"
      - name: Four-arm native Unown Powerglass endturn + passive source + Hidden Power KO control
        if: inputs.probe_agent7_root93_unown_powerglass
        run: node simulation/twinleaf/agent7-root93-unown-powerglass-stage-native.cjs > agent7-root93-unown-powerglass-native.json
      - name: Show frozen native Unown Powerglass physical payment and KO evidence
        if: inputs.probe_agent7_root93_unown_powerglass
        run: node -e "const r=require('./agent7-root93-unown-powerglass-native.json');console.log(JSON.stringify(r,null,2))"
      - uses: actions/upload-artifact@v4
        if: inputs.probe_agent7_root93_unown_powerglass && always()
        with:
          name: agent7-root93-unown-powerglass-fourarm-stage
          path: agent7-root93-unown-powerglass-native.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.probe_ko_prize_order && always() }}
        with:
          name: powerglass-ko-prize-staged-unqualified
          path: powerglass-ko-prize-order.json
          if-no-files-found: warn
          retention-days: 14
