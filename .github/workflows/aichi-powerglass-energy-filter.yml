name: Pinned Powerglass end-turn energy filter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powerglass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - run: node --test tests/powerglass-energy-filter-store.test.cjs tests/prompt-integrity-energy-filter.test.cjs tests/prompt-integrity.test.cjs tests/prompt-integrity-pinned-selection.test.cjs tests/prompt-integrity-pinned-shuffle.test.cjs
