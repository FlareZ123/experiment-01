name: Aichi exact balanced field confidence gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-128-stratum-paper-evidence-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate field-mean, simultaneous matchup, and heterogeneous-win confidence bounds
        run: node --test tests/agent12-balanced-perfect-field-bound.test.cjs tests/agent12-balanced-kl-field-bound.test.cjs tests/agent12-simultaneous-matchup-kl-bound.test.cjs tests/agent12-expanded-mulligan-pairing.test.cjs tests/agent12-aichi-basic-opening-census.test.cjs tests/agent41-owner-capture-energy-search.test.cjs
