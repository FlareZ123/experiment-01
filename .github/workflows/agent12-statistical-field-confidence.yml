name: Aichi exact balanced field confidence gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  128-stratum-paper-evidence-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 128-stratum all-win and heterogeneous-win Chernoff-KL CI
        run: node --test tests/agent12-balanced-perfect-field-bound.test.cjs tests/agent12-balanced-kl-field-bound.test.cjs
