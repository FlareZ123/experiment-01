name: Aichi exact balanced field confidence gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-128-stratum-paper-evidence-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate field-mean, simultaneous matchup, and heterogeneous-win confidence bounds
        run: node --test tests/agent12-balanced-perfect-field-bound.test.cjs tests/agent12-balanced-kl-field-bound.test.cjs tests/agent12-simultaneous-matchup-kl-bound.test.cjs tests/agent12-expanded-mulligan-pairing.test.cjs tests/agent12-aichi-basic-opening-census.test.cjs
      - name: Validate exact one-nonwin aggregate field-mean design
        run: node --test tests/agent48-exact-one-loss-field-mean-bound.test.cjs
      - name: Validate 32-rank opponent policy bundle and per-game rank mapping
        run: node --test tests/2026-11/agent49-opponent-policy-field-bundle-validator.test.cjs
