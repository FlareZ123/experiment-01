name: Aichi trace noninterference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: vendor/twinleaf/ptcg-server
      - run: npm run compile
        working-directory: vendor/twinleaf/ptcg-server
      - run: node simulation/twinleaf/trace-noninterference.cjs
