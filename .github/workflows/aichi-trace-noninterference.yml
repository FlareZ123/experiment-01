name: Aichi trace noninterference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: vendor/twinleaf/ptcg-server
      - run: npm run compile
        working-directory: vendor/twinleaf/ptcg-server
      - run: node simulation/twinleaf/trace-noninterference.cjs
      - name: Verify published rank9 root ledger and read-only source replay
        run: node simulation/twinleaf/rank9-root-ledger-noninterference.cjs
      - name: Verify published rank11 delegated Perfection and opponent reply parity
        run: node simulation/twinleaf/rank11-perfection-root-ledger-noninterference.cjs
      - name: Reconcile real source-first Garbotoxin Power checks with untouched game roots
        run: node simulation/evaluation/agent41-sourcefirst-ability-window-replay.cjs > agent41-sourcefirst-garbotoxin-root-parity.json
      - name: Archive candidate Active and Benched Power windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-rank11-garbotoxin-live-window-parity
          path: agent41-sourcefirst-garbotoxin-root-parity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate live Benched Ability suppression with composed rank11 owner response
        run: node --test tests/agent2-bilateral-composed-garbotoxin-store.test.cjs
