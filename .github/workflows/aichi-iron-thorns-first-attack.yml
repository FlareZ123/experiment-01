name: Aichi Iron Thorns first attack fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Exact K0 Prize and Trainers Mail conditionals
        run: node --test tests/aichi-prize-conditionals.test.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Source conditional Volt Cyclone attack with no Bench
        run: node simulation/twinleaf/iron-thorns-turn2-attack.cjs
      - name: Source hand to Guzma and Hala to Special Energy to Volt Cyclone
        run: node simulation/twinleaf/iron-thorns-guzma-hala-line.cjs
      - name: Inspect first source-dealt rank6 Prize zone with noninterference gate
        run: node simulation/twinleaf/rank6-seed-opening-probe.cjs
      - name: Test source-dealt rank6 alternative Guzma and Hala attack decision
        run: node simulation/twinleaf/rank6-seed-guzma-hala-fork.cjs
      - name: Verify G&H DCE-only restricted category search in source Store
        run: node simulation/twinleaf/rank6-guzma-hala-dce-only-source.cjs
      - name: Attempt source-dealt Trainers Mail and VS Seeker before attack
        run: node simulation/twinleaf/rank6-source-mail-recovery.cjs
      - name: Test public-only opponent response projection
        run: node tests/rank6-response-projection.test.cjs
      - name: Test read-only public Acerola board observer
        run: node tests/rank6-acerola-public-observer.test.cjs
      - name: Source-dealt rank6 payment and next opponent turn audit
        run: node simulation/twinleaf/rank6-immediate-opponent-response.cjs
      - name: Test source Acerola versus Pass fork
        run: node tests/rank6-acerola-pass-fork.test.cjs
      - name: Compare source-dealt Acerola and Pass response actions
        run: node simulation/twinleaf/rank6-acerola-pass-counterfactual.cjs
      - name: Reproduce source-dealt solo Guzma turn-four gust and Volt Cyclone
        run: node simulation/twinleaf/rank6-solo-guzma-source-turn4.cjs
      - name: Verify solo Guzma staged Store regression independently
        if: always()
        run: node --test tests/snorlax-switch-vs-guzma.test.cjs
      - name: Check autonomous opening selection without engine
        run: node --test tests/rank6-autonomous-thorns-line.test.cjs
      - name: Reproduce genuine source-hand autonomous rank6 attack and response
        run: node simulation/twinleaf/rank6-autonomous-thorns-source.cjs > rank6-autonomous-attack.json
      - name: Preserve autonomy and unexposed seed denominator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-autonomous-thorns-source
          path: rank6-autonomous-attack.json
          if-no-files-found: warn
      - name: Verify broad K0/visible-hand DCE and Thunder search plans
        run: node --test tests/rank6-broad-thorns-policy.test.cjs
      - name: Verify exact source-card broad access combinatorics
        run: node --test tests/rank6-broad-thorns-opportunity.test.cjs
      - name: Preserve all 24 preregistered broad source-opponent trials
        run: node simulation/twinleaf/rank6-broad-thorns-source.cjs > rank6-broad-thorns-source.json
      - name: Archive exact broad-policy exposure and unsuccessful trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-broad-thorns-source
          path: rank6-broad-thorns-source.json
          if-no-files-found: warn
      - name: Compare legal rank6 source discard payments on the same physical seed
        run: node simulation/twinleaf/rank6-discard-payment-source-fork.cjs > rank6-discard-payment-source-fork.json
      - name: Archive paired Store payment fork and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-discard-payment-source-fork
          path: rank6-discard-payment-source-fork.json
          if-no-files-found: warn
      - name: Audit source rank6 held backup Bench before real Volt Cyclone
        run: node simulation/twinleaf/rank6-backup-bench-source-fork.cjs > rank6-backup-bench-source-fork.json
      - name: Archive physical backup Bench counterfactual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-backup-bench-source-fork
          path: rank6-backup-bench-source-fork.json
          if-no-files-found: warn
