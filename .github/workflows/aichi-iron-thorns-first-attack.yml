name: Aichi Iron Thorns first attack fixture
on:
  workflow_dispatch:
    inputs:
      policy_smoke_only:
        description: Run fast pure opening-policy checks without compiling Twinleaf
        required: false
        type: boolean
        default: false
      native_energy_probe:
        description: Compile pinned Twinleaf and verify manual DCE attachment in a single prepared Store
        required: false
        type: boolean
        default: false
      astral_native_source_probe:
        description: Run preregistered original rank1 versus rank6 two-seat native Astral paper contrast
        required: false
        type: boolean
        default: false
      canonical_paper_v10_smoke:
        description: Run original shared paper-payment v10 in the existing four-arm canonical native runner
        required: false
        type: boolean
        default: false
      rank31_roxie_owner_supporter_diagnostic:
        description: Retrospective same-seed native owner-held Roxie and accepted Pass audit, zero win-rate claims
        required: false
        type: boolean
        default: false
      rank31_roxie_koffing_owner_cohold:
        description: Retrospective physical Koffing/Roxie cohold on native accepted Pass, no win-rate claims
        required: false
        type: boolean
        default: false
      rank6_plumeria_sourcechain_pair:
        description: Retrospective same-input four-arm native Plumeria payment guard parity, eight attempts
        required: false
        type: boolean
        default: false
      rank6_plumeria_prospective:
        description: Preregistered original rank6 Plumeria physical chain, eight candidate pairs and sixteen native attempts
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  policy-smoke:
    if: ${{ inputs.policy_smoke_only && !inputs.native_energy_probe && !inputs.astral_native_source_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared source policy syntax
        run: node --check simulation/twinleaf/rank6-broad-thorns-policy.cjs
      - name: Check exact original 60 contested Supporter coholding probability
        run: node --test tests/agent4-contested-supporter-firstdraw.test.cjs
      - name: Check common paper-payment v11 Secret Box physical source contracts
        run: node --test tests/agent4-shared-secretbox-v11-paper.test.cjs
      - name: Validate first native-positive source witness and per-arm sampling completeness
        run: |
          node --check simulation/twinleaf/agent4-plumeria-opportunity.cjs
          node --check scripts/agent4-original32-plumeria-flare-census.cjs
          node --test tests/agent4-plumeria-opportunity.test.cjs tests/agent4-original32-contest-evidence.test.cjs
      - name: Run source K0 opening and rejected-action safety regressions
        run: node --test tests/rank6-broad-thorns-policy.test.cjs tests/new-moon-compressor-payload-policy.test.cjs
  native-attachment-probe:
    if: ${{ inputs.native_energy_probe && !inputs.astral_native_source_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify pinned Store fixture syntax
        run: node --check simulation/twinleaf/rank6-manual-attachment-native-fixture.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Reproduce paper Astral Barrage Active-target defect and reversible correction
        run: node --test tests/agent4-astral-barrage-native.test.cjs
      - name: Audit rank31 Radiant Alakazam native MoveDamage single-source constraint
        run: node --test tests/agent4-rank31-alakazam-movesource-native.test.cjs
      - name: Reproduce original rank31 Roxie Koffing Radiant native line and paper veto
        run: node --test tests/agent4-rank31-roxie-koffing-spoons-native.test.cjs
      - name: Test original rank14 Ultra Ball mandatory discard zero-reply in both physical seats
        run: node --test tests/agent4-rank14-ultraball-zero-payment-native.test.cjs
      - name: Test original rank31 Painful Spoons zero-to-three same-source counter paper budget on both seats
        run: node --test tests/agent4-rank31-spoons-overbudget-native.test.cjs
      - name: Test shared v9 original rank31 paper guards in genuine native Store both seats
        run: node --test tests/agent4-rank31-unified-source-negative-native.test.cjs
      - name: Test shared v10 rank14 Ultra Ball mandatory two-card root and payment in both seats
        run: node --test tests/agent4-rank14-ultraball-shared-paper-native.test.cjs
      - name: Test original rank5 Quick Ball mandatory physical discard both seats
        run: node --test tests/agent4-quickball-paper-payment-native.test.cjs
      - name: Probe original Secret Box TWM mandatory three-card payment both seats
        run: node --test tests/agent4-secret-box-payment-native.test.cjs
      - name: Check common v11 Secret Box physical-root paper guard both seats
        run: node --test tests/agent4-shared-secretbox-v11-paper.test.cjs
      - name: Reproduce common v11 original source-stamped Secret Box payment and root in pinned Store both seats
        run: node --test tests/agent4-shared-secretbox-v11-native.test.cjs
      - name: Diagnose original rank26 Dowsing Machine two-card mandatory cost in both native seats
        run: node --test tests/agent30-dowsing-machine-payment-native.test.cjs
      - name: Prospectively test rank6 Guzma and Hala option one-card underpayment native effect in both seats
        run: node --test tests/agent30-guzma-hala-optional-payment-native.test.cjs
      - name: Test original rank6 Plumeria physical one-card payment and Energy custody
        run: node --test tests/agent42-plumeria-shortpayment-native.test.cjs
      - name: Validate default-off Plumeria paper cost veto against real Store
        run: node --test tests/agent42-plumeria-paper-payment-guard.native.test.cjs
      - name: Test pinned native two-seat same-root Bench versus solo Volt Cyclone decision
        run: node --test tests/agent14-solo-thorns-choice-native.test.cjs
      - name: Compare native legal and second-attachment rejects
        run: node simulation/twinleaf/rank6-manual-attachment-native-fixture.cjs
      - name: Characterize rejected locked Energy action's state mutation
        run: |
          node simulation/twinleaf/rank6-rejected-energy-state-audit.cjs > rank6-rejected-energy-state.json
          cat rank6-rejected-energy-state.json
      - name: Characterize rejected locked Stadium action's state mutation
        run: |
          node simulation/twinleaf/rank6-rejected-stadium-state-audit.cjs > rank6-rejected-stadium-state.json
          cat rank6-rejected-stadium-state.json
      - name: Verify proactive Battle Compressor owner-visible prompt
        run: node simulation/twinleaf/newmoon-compressor-owner-prompt-native.cjs
      - name: Archive pinned rejected-action evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-rejected-trainer-energy-native
          path: |
            rank6-rejected-energy-state.json
            rank6-rejected-stadium-state.json
          if-no-files-found: warn
  test:
    if: ${{ !inputs.policy_smoke_only && !inputs.native_energy_probe && !inputs.astral_native_source_probe && !inputs.canonical_paper_v10_smoke && !inputs.rank31_roxie_owner_supporter_diagnostic && !inputs.rank31_roxie_koffing_owner_cohold && !inputs.rank6_plumeria_sourcechain_pair && !inputs.rank6_plumeria_prospective }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Fail fast on rank6 research JavaScript syntax
        run: |
          node --check simulation/twinleaf/rank6-broad-thorns-policy.cjs
          node --check simulation/twinleaf/rank6-discard-payment-source-fork.cjs
          node --check simulation/twinleaf/rank6-backup-bench-source-fork.cjs
      - name: Exact K0 Prize and Trainers Mail conditionals
        run: node --test tests/aichi-prize-conditionals.test.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Source conditional Volt Cyclone attack with no Bench
        run: node simulation/twinleaf/iron-thorns-turn2-attack.cjs
      - name: Source hand to Guzma and Hala to Special Energy to Volt Cyclone
        run: node simulation/twinleaf/iron-thorns-guzma-hala-line.cjs
      - name: Inspect first source-dealt rank6 Prize zone with noninterference gate
        run: node simulation/twinleaf/rank6-seed-opening-probe.cjs
      - name: Test source-dealt rank6 alternative Guzma and Hala attack decision
        run: node simulation/twinleaf/rank6-seed-guzma-hala-fork.cjs
      - name: Verify G&H DCE-only restricted category search in source Store
        run: node simulation/twinleaf/rank6-guzma-hala-dce-only-source.cjs
      - name: Attempt source-dealt Trainers Mail and VS Seeker before attack
        run: node simulation/twinleaf/rank6-source-mail-recovery.cjs
      - name: Test public-only opponent response projection
        run: node tests/rank6-response-projection.test.cjs
      - name: Test read-only public Acerola board observer
        run: node tests/rank6-acerola-public-observer.test.cjs
      - name: Source-dealt rank6 payment and next opponent turn audit
        run: node simulation/twinleaf/rank6-immediate-opponent-response.cjs
      - name: Test source Acerola versus Pass fork
        run: node tests/rank6-acerola-pass-fork.test.cjs
      - name: Compare source-dealt Acerola and Pass response actions
        run: node simulation/twinleaf/rank6-acerola-pass-counterfactual.cjs
      - name: Reproduce source-dealt solo Guzma turn-four gust and Volt Cyclone
        run: node simulation/twinleaf/rank6-solo-guzma-source-turn4.cjs
      - name: Verify solo Guzma staged Store regression independently
        if: always()
        run: node --test tests/snorlax-switch-vs-guzma.test.cjs
      - name: Check autonomous opening selection without engine
        run: node --test tests/rank6-autonomous-thorns-line.test.cjs
      - name: Reproduce genuine source-hand autonomous rank6 attack and response
        run: node simulation/twinleaf/rank6-autonomous-thorns-source.cjs > rank6-autonomous-attack.json
      - name: Preserve autonomy and unexposed seed denominator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-autonomous-thorns-source
          path: rank6-autonomous-attack.json
          if-no-files-found: warn
      - name: Verify broad K0/visible-hand DCE and Thunder search plans
        run: node --test tests/rank6-broad-thorns-policy.test.cjs
      - name: Verify exact source-card broad access combinatorics
        run: node --test tests/rank6-broad-thorns-opportunity.test.cjs
      - name: Preserve all 24 preregistered broad source-opponent trials
        run: node simulation/twinleaf/rank6-broad-thorns-source.cjs > rank6-broad-thorns-source.json
      - name: Archive exact broad-policy exposure and unsuccessful trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-broad-thorns-source
          path: rank6-broad-thorns-source.json
          if-no-files-found: warn
      - name: Compare legal rank6 source discard payments on the same physical seed
        run: node simulation/twinleaf/rank6-discard-payment-source-fork.cjs > rank6-discard-payment-source-fork.json
      - name: Archive paired Store payment fork and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-discard-payment-source-fork
          path: rank6-discard-payment-source-fork.json
          if-no-files-found: warn
      - name: Audit source rank6 held backup Bench before real Volt Cyclone
        run: node simulation/twinleaf/rank6-backup-bench-source-fork.cjs > rank6-backup-bench-source-fork.json
      - name: Archive physical backup Bench counterfactual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank6-backup-bench-source-fork
          path: rank6-backup-bench-source-fork.json
          if-no-files-found: warn
  astral-original-source-contrast:
    if: ${{ inputs.astral_native_source_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Check frozen source-contrast runner syntax
        run: node --check simulation/evaluation/agent4-astral-rank1-rank6-natural-contrast.cjs
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Preflight original-sixty frozen source, policy and preregistration
        run: node -e "require('./simulation/evaluation/agent4-astral-rank1-rank6-natural-contrast.cjs').preflight()"
      - name: Reproduce frozen rank1 CRE74 authentic two-seat target correction
        run: node --test tests/agent4-astral-barrage-native.test.cjs
      - name: Evaluate 16 precommitted original-source native arms, preserving all outcomes
        run: node simulation/evaluation/agent4-astral-rank1-rank6-natural-contrast.cjs > agent4-astral-original-source-native.json
      - name: Archive exact sixteen-arm native paper contrast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent4-original-rank1-rank6-astral-native-16arm
          path: agent4-astral-original-source-native.json
          if-no-files-found: warn

  canonical-paper-v10-smoke:
    if: ${{ inputs.canonical_paper_v10_smoke && !inputs.policy_smoke_only && !inputs.native_energy_probe && !inputs.astral_native_source_probe && !inputs.rank31_roxie_owner_supporter_diagnostic && !inputs.rank31_roxie_koffing_owner_cohold }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Syntax check default-off canonical v10 adapter
        run: node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify original source-printed native v10 payment controls
        run: node --test tests/agent4-rank31-unified-source-negative-native.test.cjs tests/agent4-rank14-ultraball-shared-paper-native.test.cjs
      - name: Run four actual both-seat development arms with unified payment v10 opt-in
        env:
          AGENT15_SHARED_SOURCE_PAYMENT_PORTFOLIO_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent15-canonical-v10-smoke.json
      - name: Require actual selected source-payment v10 wrapper and full attempt retention
        run: |
          node -e "const assert=require('node:assert/strict');const r=require('./agent15-canonical-v10-smoke.json');assert.equal(r.sharedPaperPaymentPortfolioOptIn,true);assert.equal(r.competitiveQualifiedGames,0);assert.equal(r.rows.length,4);for(const row of r.rows){assert.equal(row.sharedPaperPaymentPortfolioOptIn,true);assert.equal(row.sharedPaperPaymentPortfolioAudit?.liveStoreRequired,true);assert.ok(row.sharedPaperPaymentPortfolioAudit?.liveSourceTrialCount>=1);assert.equal(row.sharedPaperPaymentPortfolioAudit?.competitiveQualifiedGames,0);}console.log('AGENT15_SHARED_V10_CANONICAL_NATIVE',JSON.stringify(r.rows.map(x=>({id:x.trial.id,status:x.status,version:x.sharedPaperPaymentPortfolioAudit.version,storeCount:x.sharedPaperPaymentPortfolioAudit.storeCount,rootRoxie:x.sharedPaperPaymentPortfolioAudit.inspectedRoxiePlayCardRoots,rootUltraBall:x.sharedPaperPaymentPortfolioAudit.inspectedUltraBallPlayCardRoots}))))"
      - name: Preflight preregistered exact original rank31 source and two random unscreened seed groups
        run: |
          node --check simulation/evaluation/agent15-rank31-v10-natural-paired-development.cjs
          node -e "const r=require('./simulation/evaluation/agent15-rank31-v10-natural-paired-development.cjs').preflight();console.log('RANK31_REGISTERED_NATIVE_V10',JSON.stringify({schema:r.registration.schema,rosterGitBlob:r.rosterGitBlob,sourceRank:r.registration.sourceRank,attempts:r.registration.plannedNativeAttempts,gitHead:r.head}))"
      - name: Compare original rank31 source v10 off and on under the same preregistered physical seeds and both seats
        run: node simulation/evaluation/agent15-rank31-v10-natural-paired-development.cjs > agent15-rank31-v10-native-pairs.json
      - name: Require all original rank31 attempts and explicit unqualified status
        run: |
          node -e "const assert=require('node:assert/strict');const x=require('./agent15-rank31-v10-native-pairs.json');assert.equal(x.allAttemptedGames,8);assert.equal(x.allPairs,4);assert.equal(x.pairs.length,4);assert.equal(x.control.rows.length,4);assert.equal(x.treatment.rows.length,4);assert.equal(x.competitiveQualifiedGames,0);assert.equal(x.treatment.sharedPaperPaymentPortfolioOptIn,true);assert.equal(x.control.sharedPaperPaymentPortfolioOptIn,false);console.log('ORIGINAL_RANK31_V10_PAIRED_STATUS',JSON.stringify({sameSourceDeals:x.pairedSamePhysicalSourceDeals,pairs:x.pairs.map(p=>({id:p.id,same:p.samePhysicalSourceDeal,off:p.control.status,on:p.treatment.status,roxieOn:p.treatment.roxieRoots}))}))"
      - name: Archive all native receipts including original rank31 errors and caps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent15-canonical-paper-v10-and-rank31-paired
          path: |
            agent15-canonical-v10-smoke.json
            agent15-rank31-v10-native-pairs.json
          if-no-files-found: warn

  rank31-retrospective-owner-roxie-audit:
    if: ${{ inputs.rank31_roxie_owner_supporter_diagnostic && !inputs.canonical_paper_v10_smoke && !inputs.policy_smoke_only && !inputs.native_energy_probe && !inputs.astral_native_source_probe && !inputs.rank31_roxie_koffing_owner_cohold }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify syntax and original frozen retrospective preflight
        run: |
          node --check simulation/evaluation/agent15-rank31-roxie-owner-supporter-retro.cjs
          node -e "const x=require('./simulation/evaluation/agent15-rank31-roxie-owner-supporter-retro.cjs').registeredDiagnostic();console.log('OWNER_RANK31_ROXIE_POSTGAME_DIAGNOSTIC',JSON.stringify({originalSourceRank:x.d.sourceRank,registeredNativeAttempts:x.d.nativeAttempts,priorZeroRoxie:x.d.priorObservedSourceRoxieRoots,diagnosticGitBlob:'4c8c59e574a5603375e9a6cc908f0fadc9d3f237'}))"
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify read-only owner-hand native Store observer against fake native Store
        run: node --test tests/agent2-native-owner-supporter-opportunity.test.cjs
      - name: Reproduce both physical seats same-checkout native original rank31 owner-held Roxie census
        run: node simulation/evaluation/agent15-rank31-roxie-owner-supporter-retro.cjs > agent15-rank31-roxie-owner-retro.json
      - name: Print paired native ledger status and observed original source Roxie Pass opportunities
        run: |
          node -e "const assert=require('node:assert/strict');const x=require('./agent15-rank31-roxie-owner-retro.json');assert.equal(x.attempted,8);assert.equal(x.observedPairedGames,4);assert.equal(x.competitiveQualifiedGames,0);console.log('RETROSPECTIVE_OWNER_ROXIE_DIAGNOSTIC',JSON.stringify({allParity:x.observerNoninterferingAllArms,pairs:x.pairs.map(p=>({id:p.id,noninterfering:p.observerNoninterfering,rootDigestMatch:p.rootLedgerMatch,source:p.sourceOwnerSupporter}))}))"
      - name: Preserve all read-only audit evidence and censored original native attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent15-rank31-retrospective-owner-roxie-audit
          path: agent15-rank31-roxie-owner-retro.json
          if-no-files-found: warn

  rank31-original-owner-physical-koffing-cohold:
    if: ${{ inputs.rank31_roxie_koffing_owner_cohold && !inputs.rank31_roxie_owner_supporter_diagnostic && !inputs.canonical_paper_v10_smoke && !inputs.policy_smoke_only && !inputs.native_energy_probe && !inputs.astral_native_source_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Original rank31 registration and source owner-cohold preflight
        run: |
          node --check simulation/evaluation/agent15-rank31-coheld-roxie-koffing-pass-retro.cjs
          node -e "const x=require('./simulation/evaluation/agent15-rank31-coheld-roxie-koffing-pass-retro.cjs').preflightRetro();console.log('AGENT15_ORIGINAL_RANK31_COHOLD',JSON.stringify({rank:x.registration.sourceRank,attempts:x.registration.attempts,parent:x.registration.originalRegistrationGitBlob,observer:x.registration.oneBooleanObserver}))"
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify actor-only Supporter observer in pure State fixtures
        run: node --test tests/agent7-owner-supporter-opportunity.test.cjs
      - name: Capture physical Koffing and Roxie at rank31 source owner Pass roots
        run: node simulation/evaluation/agent15-rank31-coheld-roxie-koffing-pass-retro.cjs > agent15-rank31-roxie-koffing-cohold.json
      - name: Verify paired original native games and preserve all cohold/noncohold evidence
        run: |
          node -e "const assert=require('node:assert/strict');const x=require('./agent15-rank31-roxie-koffing-cohold.json');assert.equal(x.allAttempted,8);assert.equal(x.pairs,4);assert.equal(x.qualifiedCompetitiveGames,0);console.log('ORIGINAL_RANK31_KOFFING_ROXIE_COHOLD',JSON.stringify({allSameDeals:x.allObserverNoninterfering,byArm:x.pairReceipts.map(r=>({id:r.id,same:r.observerNoninterfering,roots:r.sourceCohold.sourceFirstOwnerTurns,heldRoxiePass:r.sourceCohold.sourceAcceptedPassesHoldingRoxie,coheldKoffingPass:r.sourceCohold.sourceAcceptedPassesCoholdingKoffingAndRoxie}))}))"
      - name: Archive all original native outcomes and owner-only observed physical coholds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent15-rank31-roxie-koffing-owner-cohold
          path: agent15-rank31-roxie-koffing-cohold.json
          if-no-files-found: warn

  rank6-plumeria-sourcechain-pair:
    if: ${{ (inputs.rank6_plumeria_sourcechain_pair || inputs.rank6_plumeria_prospective) && !inputs.native_energy_probe && !inputs.policy_smoke_only && !inputs.canonical_paper_v10_smoke && !inputs.astral_native_source_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf for original rank6 payment receipt
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Check original source parity and physical-payment script
        run: |
          node --check simulation/evaluation/agent42-plumeria-sourcechain-paired.cjs
          node --check simulation/evaluation/agent42-plumeria-prospective-sourcechain.cjs
          node --check simulation/twinleaf/agent42-plumeria-paper-payment-guard.cjs
      - name: Validate original Plumeria local paper-chain certificate and negative controls
        run: node --test tests/agent42-plumeria-native-chain-certificate.test.cjs
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Compare complete historical source and candidate roots with paper Plumeria guard off and on
        if: ${{ inputs.rank6_plumeria_sourcechain_pair }}
        run: node simulation/evaluation/agent42-plumeria-sourcechain-paired.cjs
      - name: Measure freshly preregistered original source Plumeria paid and resolved chain across both seats
        if: ${{ inputs.rank6_plumeria_prospective }}
        run: node simulation/evaluation/agent42-plumeria-prospective-sourcechain.cjs
      - name: Preserve all original rank6 guarded and unguarded native attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent42-original-rank6-plumeria-physical-sourcechain-8attempts
          path: |
            agent42-plumeria-sourcechain-native.json
            agent42-plumeria-prospective-sourcechain-native.json
          if-no-files-found: warn
