name: Agent44 retrospective root93 Lillie alternative

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root93-lillie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check native script syntax
        run: node --check simulation/evaluation/agent44-root93-secretbox-paid-store-retro.cjs
      - name: Check out pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Configure pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Pay owner-held Lillie at exact root93 and resolve draw eight
        env:
          AGENT44_ROOT93_LILLIE_NATIVE: 'true'
        run: node simulation/evaluation/agent44-root93-secretbox-paid-store-retro.cjs
      - name: Preserve real Store outcome and negative evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent44-root93-lillie-native
          path: artifacts/agent44-root93-lillie-draw-retro.json
          if-no-files-found: warn
          retention-days: 30
