name: Twinleaf Aichi mulligan calibration

on:
  workflow_dispatch:
    inputs:
      agent6_go_first:
        description: 'Optional native starting-player choice polarity control'
        type: boolean
        default: false
      agent6_tagcall:
        description: 'Optional rank6 source first-turn Tag Call owner-search native control'
        type: boolean
        default: false
      agent6_prized_thunder:
        description: 'Optional retrospective rank6 DCE-K1 Speed alternative native factorial'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  opening-hand-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf commit
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Identify pinned Twinleaf commit
        id: engine
        run: echo "sha=$(git -C vendor/twinleaf rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned compiled Twinleaf output
        id: compiled
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/twinleaf/ptcg-server/output
            vendor/twinleaf/ptcg-server/dist
          key: aichi-setup-output-${{ runner.os }}-node20-${{ steps.engine.outputs.sha }}-${{ hashFiles('vendor/twinleaf/ptcg-server/package-lock.json') }}
      - name: Compile Twinleaf server
        if: steps.compiled.outputs.cache-hit != 'true'
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Save pinned compiled Twinleaf output
        if: steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/twinleaf/ptcg-server/output
            vendor/twinleaf/ptcg-server/dist
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Check opt-in first-turn compensation telemetry and full-game noninterference
        run: node --test tests/setup-compensation-observer.test.cjs tests/headless-initial-setup-compensation-smoke.test.cjs
      - name: Test explicit first-player opening choice policy
        run: node --test tests/agent6-go-first-choice.test.cjs
      - name: Test rank6 K0 DCE and genuine K1 fallback pure prerequisites
        if: inputs.agent6_prized_thunder
        run: node --test tests/agent6-prized-thunder-speed-bypass.test.cjs
      - name: Positive-control actual first-player choice in pinned Store
        if: inputs.agent6_go_first
        run: node simulation/evaluation/agent6-go-first-native-setup.cjs > agent6-go-first-native.json
      - name: Archive source-side first-player choice control
        if: always() && inputs.agent6_go_first
        uses: actions/upload-artifact@v4
        with:
          name: agent6-go-first-native-setup
          path: agent6-go-first-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Positive-control GO_FIRST with canonical actor policy nesting
        if: inputs.agent6_go_first
        run: node simulation/evaluation/agent6-go-first-canonical-native.cjs > agent6-go-first-canonical-native.json
      - name: Archive canonical actor first-player choice control
        if: always() && inputs.agent6_go_first
        uses: actions/upload-artifact@v4
        with:
          name: agent6-go-first-canonical-native
          path: agent6-go-first-canonical-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preregistered rank6 source-first Speed staging native paired control
        if: inputs.agent6_go_first
        run: node simulation/evaluation/agent6-rank6-firstturn-speed-native.cjs > agent6-rank6-firstturn-speed-native.json
      - name: Preserve all source-first Speed staging control attempts
        if: always() && inputs.agent6_go_first
        uses: actions/upload-artifact@v4
        with:
          name: agent6-rank6-firstturn-speed-native
          path: agent6-rank6-firstturn-speed-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retrospective source-first Tag Call native six-deal branch
        if: inputs.agent6_tagcall
        run: node simulation/evaluation/agent6-source-first-tagcall-native.cjs > agent6-source-first-tagcall-native.json
      - name: Archive source-first Tag Call original Store attempts
        if: always() && inputs.agent6_tagcall
        uses: actions/upload-artifact@v4
        with:
          name: agent6-source-first-tagcall-native
          path: agent6-source-first-tagcall-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retrospective 2x2 rank6 source K0-DCE to K1-Speed bypass
        if: inputs.agent6_prized_thunder
        run: |
          node simulation/evaluation/agent6-prized-thunder-speed-bypass-native.cjs > agent6-prized-thunder-speed-bypass-native.json
          node -e "const j=require('./agent6-prized-thunder-speed-bypass-native.json');console.log(JSON.stringify({schema:j.schema,attempted:j.attemptedNativeArms,errors:j.nativeErrors,matched:j.exactSourceDealPairs,staged:j.nativeDceStageConfirmations,k1:j.authenticatedK1SpeedFallbackSelections,rows:j.rows.map(r=>({seed:r.seed,seat:r.sourceSeat,matched:r.exactSourcePhysicalOpeningMatched,arms:r.arms.map(a=>({dce:a.stageDceFirstTurn,k1:a.k1PrizedThunderSpeedFallback,status:a.status,error:a.error,stage:a.nativeDceStageConfirmed,pivot:a.k1SpeedFallbackSelected,abort:a.sourceT3AbortReason,settled:a.sourceT3SettledVoltCyclone?.length,events:a.sourcePolicyEvents?.map(e=>e.action||e.abort).filter(Boolean)}))}))},null,2))"
      - name: Archive K0-DCE to K1-Speed original Store attempts
        if: always() && inputs.agent6_prized_thunder
        uses: actions/upload-artifact@v4
        with:
          name: agent6-prized-thunder-speed-bypass-native
          path: agent6-prized-thunder-speed-bypass-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check setup mulligan statistics against exact probabilities
        run: node simulation/twinleaf/setup-audit.cjs

      - name: Validate destination-aware mandatory deck-discard selections
        run: node --test tests/setup-discard-prompt-planner.test.cjs
      - name: Exercise rank26 and New Moon source-60 actual Store prompt lifecycle
        run: node simulation/twinleaf/setup-discard-native.cjs > setup-discard-native.json
      - name: Preserve all source-60 constructed native prompt results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent17-setup-discard-source-60
          path: setup-discard-native.json
          if-no-files-found: warn
