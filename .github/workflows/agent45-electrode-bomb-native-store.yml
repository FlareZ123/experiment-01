name: Agent45 CES48 native Extra Energy Bomb target resolution gate
on:
  workflow_dispatch:
    inputs:
      rank9_source_compressor:
        description: 'Run four historical original rank9 paired source Compressor owner bridge groups after native regression'
        required: false
        type: boolean
        default: false
      rank9_source_compressor_anyturn:
        description: 'Run separately labeled v2 owner-only late-turn Compressor A/B real Store comparison'
        required: false
        type: boolean
        default: false
      rank9_source_shuffle_custody:
        description: 'Run separately registered v3 read-only real source shuffle permutation witness'
        required: false
        type: boolean
        default: false
      rank9_source_bomb_after_compressor:
        description: 'Run registered v4 original source paid Compressor into actual Extra Energy Bomb and natural continuation'
        required: false
        type: boolean
        default: false
      rank9_source_prospective_v5:
        description: 'Run pre-registered fresh eight rank9 physical group source Bomb real Store comparison, isolated policy and shuffle RNG'
        required: false
        type: boolean
        default: false
      rank9_source_owner_zones_v7:
        description: 'Read-only v7 physical role identity zones at actual source Pass on preregistered unchanged v5 original seed groups'
        required: false
        type: boolean
        default: false
      rank9_source_early_vip_v8:
        description: 'Run development v8 original rank9 early VIP-after-Pass both-seat policy on identical registered v5 physical deals'
        required: false
        type: boolean
        default: false
      rank9_source_dead_vip_ultra_v9:
        description: 'Run v9 real source paid Ultra Ball from 2 expired VIP, owner-authorized Electrode search, original VIP setup from v8'
        required: false
        type: boolean
        default: false
      generic_trainer_parity:
        description: 'Run immutable original 5-vs-11 two-seat read-only generic Trainer frontier A/B/A parity'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: agent45-ces48-bomb-store
  cancel-in-progress: false
jobs:
  native-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact rank9 original Prize and five-Energy physical census
        run: node --test tests/agent29-rank9-electrode-mega-prize-window.test.cjs tests/agent2-rank9-bomb-capacity.test.cjs tests/agent2-rank9-three-energy-bomb-prize-window.test.cjs tests/agent29-rank9-compressor-owner-bridge.test.cjs tests/agent29-authoritative-shuffle-order-witness.test.cjs tests/agent29-rank9-post-compressor-bomb.test.cjs tests/agent29-rank9-prospective-v5-registration.test.cjs tests/agent29-rank9-owner-card-location-witness.test.cjs tests/agent9-battle-vip-owner-after-pass.test.cjs tests/agent29-rank9-ultra-ball-dead-vip.test.cjs
      - name: Checkout pinned native engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Real native CE S48 Extra Energy Bomb target validation
        run: node --test tests/agent45-electrode-energy-bomb-prompt-contract.native.test.cjs tests/agent45-electrode-bomb-native-store-forbidden-gx.test.cjs tests/agent29-rank9-electrode-modern-ex-native.test.cjs tests/agent2-rank9-partial-bomb-native.test.cjs tests/agent29-electrode-empty-attachment-fidelity.native.test.cjs
      - name: Retrospective original rank9 real source owner Compressor roots
        if: ${{ inputs.rank9_source_compressor }}
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-compressor-retro.json
      - name: Preserve every original rank9 source Store attempt
        if: ${{ always() && inputs.rank9_source_compressor }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-real-owner-compressor-retrospective
          path: agent29-rank9-compressor-retro.json
      - name: Any-turn v2 original rank9 owner Compressor source comparison
        if: ${{ inputs.rank9_source_compressor_anyturn }}
        env:
          AGENT29_RANK9_COMPR_ANYTURN_V2: 'true'
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-compressor-anyturn-v2.json
      - name: Preserve all v2 registered attempts, including aborts
        if: ${{ always() && inputs.rank9_source_compressor_anyturn }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-compressor-anyturn-v2
          path: agent29-rank9-compressor-anyturn-v2.json
          if-no-files-found: warn
          retention-days: 30
      - name: Original rank9 source printed Compressor shuffle custody v3
        if: ${{ inputs.rank9_source_shuffle_custody }}
        env:
          AGENT29_RANK9_SHUFFLE_AUDIT_V3: 'true'
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-shuffle-custody-v3.json
      - name: Preserve eight v3 source shuffle attempts and independent numeric audits
        if: ${{ always() && inputs.rank9_source_shuffle_custody }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-shuffle-custody-v3
          path: agent29-rank9-shuffle-custody-v3.json
          if-no-files-found: warn
          retention-days: 30
      - name: Original rank9 post-Compressor actual native Electrode Ability v4
        if: ${{ inputs.rank9_source_bomb_after_compressor }}
        env:
          AGENT29_RANK9_BOMB_AFTER_COMPR_V4: 'true'
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-post-compressor-bomb-v4.json
      - name: Preserve all eight v4 originals, source Bomb prompts, physical Energy and Prize audits
        if: ${{ always() && inputs.rank9_source_bomb_after_compressor }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-post-compressor-bomb-v4
          path: agent29-rank9-post-compressor-bomb-v4.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fresh preregistered original rank9 Bomb prospective v5, 32 native attempts
        if: ${{ inputs.rank9_source_prospective_v5 }}
        env:
          AGENT29_RANK9_PROSPECTIVE_V5: 'true'
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-bomb-prospective-v5.json
      - name: Preserve every prospective v5 original, negative, cap and native error
        if: ${{ always() && inputs.rank9_source_prospective_v5 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-bomb-prospective-v5
          path: agent29-rank9-bomb-prospective-v5.json
          if-no-files-found: warn
          retention-days: 30
      - name: Source original rank9 real owner role-location oracle v7 on unchanged v5 deals
        if: ${{ inputs.rank9_source_owner_zones_v7 }}
        env:
          AGENT29_RANK9_OWNER_ZONE_V7: 'true'
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-original-owner-role-zones-v7.json
      - name: Preserve complete v7 source card zone custody and independent v5 replay
        if: ${{ always() && inputs.rank9_source_owner_zones_v7 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-original-owner-zones-v7
          path: agent29-rank9-original-owner-role-zones-v7.json
          if-no-files-found: warn
          retention-days: 30
      - name: Original rank9 early VIP-after-Pass source development v8 on identical eight v5 seeds
        if: ${{ inputs.rank9_source_early_vip_v8 }}
        env:
          AGENT29_RANK9_EARLY_VIP_V8: 'true'
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-early-vip-setup-v8.json
      - name: Preserve all v8 original source VIP search, physical Bench, Bomb and no-op attempts
        if: ${{ always() && inputs.rank9_source_early_vip_v8 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-early-vip-setup-v8
          path: agent29-rank9-early-vip-setup-v8.json
          if-no-files-found: warn
          retention-days: 30
      - name: Original rank9 two-expired-VIP paid native Ultra Ball fetch Electrode v9
        if: ${{ inputs.rank9_source_dead_vip_ultra_v9 }}
        env:
          AGENT29_RANK9_ULTRA_DEAD_VIP_V9: 'true'
        run: node simulation/evaluation/agent29-rank9-compressor-owner-bridge-retro.cjs > agent29-rank9-source-paid-dead-vip-ultra-v9.json
      - name: Preserve all v9 owner Ultra costs, printed search, evolution and nonpositive attempts
        if: ${{ always() && inputs.rank9_source_dead_vip_ultra_v9 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-rank9-source-paid-dead-vip-ultra-v9
          path: agent29-rank9-source-paid-dead-vip-ultra-v9.json
          if-no-files-found: warn
          retention-days: 30
      - name: Native original-rank5/rank11 canonical policy read-only Trainer census A/B/A
        if: ${{ inputs.generic_trainer_parity }}
        run: node simulation/twinleaf/agent29-bilateral-trainer-frontier-parity-native.cjs
      - name: Preserve same-deal native Trainer frontier noninterference evidence
        if: ${{ always() && inputs.generic_trainer_parity }}
        uses: actions/upload-artifact@v4
        with:
          name: agent29-native-two-seat-generic-trainer-parity
          path: agent29-generic-trainer-native-parity.json
          if-no-files-found: warn
          retention-days: 30
