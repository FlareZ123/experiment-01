name: Twinleaf Palace promos Store fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned upstream dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Exercise Palace Book and Palace Belt with real Store
        run: node --test tests/palace_promos_store.test.cjs
