name: Twinleaf Regidrago spread copy policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research and pinned Twinleaf
        uses: actions/checkout@v4
      - name: Check out pinned submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Check source-derived generic and opt-in prompt decisions
        run: node --test tests/apex-spread-copy-resolver.test.cjs
      - name: Check automatic multi-Prize Bench-counter allocation
        run: node --test tests/apex-spread-damage-resolver.test.cjs
      - name: Verify genuine Store own-versus-opponent Stadium replacement enumeration
        run: node --test tests/agent37-own-stadium-enumerator.native.test.cjs
      - name: Reobserve exact archived original rank5 Sky Field missing offers with owner Stadium context
        env:
          AGENT7_STADIUM_PUBLIC_SNAPSHOT: 'true'
        run: |
          node simulation/twinleaf/agent5-generic-owner-trainer-frontier-native.cjs
          node scripts/agent37-source5-skyfield-stadium-audit.cjs agent5-generic-owner-trainer-frontier-original-5-v-11.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent37-original-source5-stadium-owner-context
          path: agent5-generic-owner-trainer-frontier-original-5-v-11.json
          retention-days: 30
          if-no-files-found: warn
