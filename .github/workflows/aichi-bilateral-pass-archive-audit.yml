name: Audit archived bilateral candidate Pass evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing source-locked bilateral development run containing the immutable JSON artifact
        required: true
        type: string
      audit_type:
        description: 'Choose original bilateral Pass or previously saved charged-promotion pair evidence'
        required: true
        type: choice
        options:
          - bilateral-pass
          - charged-promotion-pair
          - floatstone-pair
          - volt-donor-debt
          - steward-v4v5
        default: bilateral-pass

permissions:
  actions: read
  contents: read

jobs:
  pass-probe-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native Store before-after continuity and bilateral v2 intake
        run: node --test tests/bilateral-v2-root-ledger-attestation.test.cjs tests/bilateral-v2-evidence-gate.test.cjs
      - name: Download immutable historical development archive without recompiling Twinleaf
        if: ${{ inputs.audit_type == 'bilateral-pass' }}
        uses: actions/download-artifact@v4
        with:
          name: agent41-bilateral-v2-historical-development
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Retrieve same-checkout charged-promotion pair without rebuilding native simulator
        if: ${{ inputs.audit_type == 'charged-promotion-pair' }}
        uses: actions/download-artifact@v4
        with:
          name: agent1-charged-promotion-historical-native-pair
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Report native prompt and post-Pass owner-card evidence from saved pair
        if: ${{ inputs.audit_type == 'charged-promotion-pair' }}
        run: |
          node --test tests/agent1-charged-promotion-archive-audit.test.cjs
          node scripts/agent1-charged-promotion-archive-audit.cjs agent1-charged-promotion-native-pair.json
      - name: Download frozen original-Store Float Stone source-paired archive
        if: ${{ inputs.audit_type == 'floatstone-pair' }}
        uses: actions/download-artifact@v4
        with:
          name: agent1-source-floatstone-original-store-pair
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source-only Float Stone adapter was installed and archive is unqualified
        if: ${{ inputs.audit_type == 'floatstone-pair' }}
        run: |
          node --test tests/agent1-owner-float-stone-mobility.test.cjs
          node -e "const assert=require('node:assert/strict');const p=require('./agent1-floatstone-native-pair.json');assert.equal(p.pairs.length,4);assert.equal(p.competitiveQualifiedGames,0);for(let i=0;i<4;i++){const a=p.baseline.rows[i],b=p.treatment.rows[i],c=a.actorOnlyDecisionCoverage?.detailedComponentAudits?.root,t=b.actorOnlyDecisionCoverage?.detailedComponentAudits?.root;assert.equal(c?.floatStoneMobilityOptIn,false);assert.equal(t?.floatStoneMobilityOptIn,true);assert.equal(t.floatStoneMobilityOwnerSeat,b.sourceSeat);assert.match(t.version,/floatstone-mobility/);console.log('SOURCE_FLOAT_AUDIT',JSON.stringify({id:b.trial.id,sourceSeat:b.sourceSeat,installed:t.floatStoneMobilityOptIn,sourceScoped:t.floatStoneMobilityOwnerSeat===b.sourceSeat,baseRoot:c.version,variantRoot:t.version,selectedEquip:t.typedIntentCounts['attach-emergency-floatstone']??0,selectedRetreat:t.typedIntentCounts['retreat-emergency-floatstone']??0,identicalRoot:p.pairs[i].identicalRootLedger,heldFloatPasses:(a.sourceOwnerPostPassMobility?.observations??[]).filter(x=>x.mobilityHeld?.['Float Stone']>0).length,heldEscapePasses:(a.sourceOwnerPostPassMobility?.observations??[]).filter(x=>x.mobilityHeld?.['Escape Rope']>0).length,heldGuzmaPasses:(a.sourceOwnerPostPassMobility?.observations??[]).filter(x=>x.mobilityHeld?.['Guzma']>0).length,unpoweredHeldEscape:(a.sourceOwnerPostPassMobility?.observations??[]).filter(x=>x.mobilityHeld?.['Escape Rope']>0&&x.activeEnergyCards?.length===0).length,unpoweredHeldGuzma:(a.sourceOwnerPostPassMobility?.observations??[]).filter(x=>x.mobilityHeld?.['Guzma']>0&&x.activeEnergyCards?.length===0).length,unpoweredPassNames:(a.sourceOwnerPostPassMobility?.observations??[]).filter(x=>x.activeEnergyCards?.length===0).map(x=>x.activeName).slice(0,12)}));}console.log('ARCHIVE_ONLY_ZERO_COMPETITIVE',p.competitiveQualifiedGames)"
      - name: Verify printed-cost Volt Cyclone owner-donor debt model
        if: ${{ inputs.audit_type == 'volt-donor-debt' }}
        run: node --test tests/agent45-volt-cyclone-donor-debt.test.cjs
      - name: Retrieve unchanged original rank6 source archive from the prior native run
        if: ${{ inputs.audit_type == 'volt-donor-debt' }}
        uses: actions/download-artifact@v4
        with:
          name: agent41-rank6-grouped-denial-48-native-arm-census
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Produce original-source observed donor-debt report
        if: ${{ inputs.audit_type == 'volt-donor-debt' }}
        run: |
          node -e "const fs=require('node:fs');const audit=require('./simulation/evaluation/agent45-volt-cyclone-donor-debt.cjs');const original=require('./agent41-frozen-bilateral-development-v2-native.json');const r=audit.auditRank6VoltDonorDebt(original);fs.writeFileSync('agent45-volt-donor-debt-result.json',JSON.stringify(r,null,2)+'\\n');console.log(JSON.stringify(r,null,2));if(r.unknown!==0||r.settledVoltAttacks!==50||r.benched!==27||r.solo!==23)process.exitCode=1"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.audit_type == 'volt-donor-debt' }}
        with:
          name: agent45-frozen-v2-donor-debt-audit
          path: agent45-volt-donor-debt-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test and report bounded candidate Pass evidence
        if: ${{ inputs.audit_type == 'bilateral-pass' }}
        run: |
          node --test tests/aichi-bilateral-pass-evidence-summary.test.cjs
          node scripts/aichi-bilateral-pass-evidence-summary.cjs agent41-bilateral-v2-development.json
      - name: Validate independent steward v4/v5 receipt audit invariants
        if: ${{ inputs.audit_type == 'steward-v4v5' }}
        run: node --test tests/agent46-issue25-steward-archive-audit.test.cjs
      - name: Download frozen native steward v4/v5 source archives without recompiling
        if: ${{ inputs.audit_type == 'steward-v4v5' }}
        uses: actions/download-artifact@v4
        with:
          name: agent36-issue25-steward-innermost-prize-v5-native
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: archived-steward
      - name: Independently audit selected steward v4/v5 original eight root custody
        if: ${{ inputs.audit_type == 'steward-v4v5' }}
        run: |
          node -e "const fs=require('node:fs');const a=require('./simulation/evaluation/agent46-issue25-steward-archive-audit.cjs');for(const v of ['v4','v5']){const prefix='archived-steward/issue25-steward-'+v;const r=a.inspect(fs.readFileSync(prefix+'.json'),fs.readFileSync(prefix+'.sha256','utf8'),v);console.log('AGENT46_SELECTED_ARCHIVE_AUDIT',JSON.stringify(r));if(r.integrity!=='PASS-bounded-file-and-root-custody')process.exitCode=1;}"
      - name: Independently compare frozen steward v4/v5 physical deals and native root prefixes
        if: ${{ inputs.audit_type == 'steward-v4v5' }}
        run: |
          node -e "const fs=require('node:fs');const a=require('./simulation/evaluation/agent46-issue25-steward-archive-audit.cjs');const get=v=>{const p='archived-steward/issue25-steward-'+v;return [fs.readFileSync(p+'.json'),fs.readFileSync(p+'.sha256','utf8')]};const b=get('v4'),c=get('v5');const r=a.compareStewardV4V5(...b,...c);console.log('AGENT46_V4V5_INDEPENDENT_SAME_DEAL_PREFIX',JSON.stringify(r));if(r.status!=='PASS-bounded-controlled-prefix')process.exitCode=1;"
