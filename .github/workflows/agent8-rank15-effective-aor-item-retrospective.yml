name: Agent8 rank15 effective AOR Item-lock native comparisons

on:
  workflow_dispatch:
    inputs:
      fresh_registered:
        description: Use the new independently precommitted CSPRNG seed tranche
        type: boolean
        default: false
        required: false
      native_tests_only:
        description: Compile and verify bounded Store tests without running 32 game attempts
        type: boolean
        default: false
        required: false
      source13_native:
        description: Run the preregistered eight original-rank13 paired source games
        type: boolean
        default: false
        required: false
      source13_evolution_factorial:
        description: Run retrospective four-arm rank13 donor by common evolution native diagnostic
        type: boolean
        default: false
        required: false
      source13_paper_evolution_factorial:
        description: Run retrospective rank13 donor evolution panel with reversible paper Celestial Roar correction
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  aor-original-source-retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Verify immutable original Aichi rank15 registration
        if: ${{ !inputs.fresh_registered }}
        run: node simulation/evaluation/agent8-rank15-effective-aor-item-replay.cjs --inspect-only
      - name: Verify independently registered fresh rank15 seeds
        if: ${{ inputs.fresh_registered }}
        run: node simulation/evaluation/agent8-rank15-effective-aor-fresh-registered.cjs --inspect-only
      - name: Install pinned native Store dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify actual two-seat Item lock including Wobbuffet suppression
        run: node --test tests/agent8-aor-vileplume-item-preflight-native.test.cjs
      - name: Verify native Regidrago donor Quick Ball root and paper lock guards
        run: node --test tests/agent8-regidrago-quickball-donor-frontier.test.cjs
      - name: Verify paid native Quick Ball Dragon donor search and Bench
        run: node --test tests/agent8-rank13-quickball-dragon-donor-native.test.cjs
      - name: Execute preregistered original-rank13 paired donor-root games
        if: ${{ inputs.source13_native }}
        env:
          AGENT8_RANK13_RESULT_JSON: agent8-original13-donor-paired-native.json
        run: node simulation/twinleaf/agent8-rank13-donor-paired-original-native.cjs
      - name: Verify owner-visible source Regidrago VSTAR opportunity witness
        if: ${{ inputs.source13_evolution_factorial }}
        run: node --test tests/agent8-rank13-vstar-owner-opportunity.test.cjs
      - name: Verify exact Regidrago donor and held VSTAR opening DP
        if: ${{ inputs.source13_paper_evolution_factorial }}
        run: node --test tests/agent8-rank13-vstar-opening-dp.test.cjs
      - name: Verify bounded physical multi-Energy mandatory assignment policy
        if: ${{ inputs.source13_paper_evolution_factorial }}
        run: node --test tests/agent47-minimum-attach-energy-hook.test.cjs
      - name: Validate passive native copied-attack prompt ledger
        if: ${{ inputs.source13_paper_evolution_factorial }}
        run: node --test tests/agent8-native-copied-attack-choice-ledger.test.cjs
      - name: Retrospective original-rank13 four-arm donor by corrected paper Celestial Roar
        if: ${{ inputs.source13_paper_evolution_factorial }}
        env:
          AGENT8_RANK13_PAPER_CORRECTION: 'true'
          AGENT8_RANK13_FACTORIAL_JSON: agent8-original13-donor-evolution-paper-correct-native.json
        run: node simulation/evaluation/agent8-rank13-donor-evolution-factorial-native.cjs
      - name: Retrospective original-rank13 four-arm donor by two-seat evolution diagnostic
        if: ${{ inputs.source13_evolution_factorial }}
        env:
          AGENT8_RANK13_FACTORIAL_JSON: agent8-original13-donor-evolution-factorial-native.json
        run: node simulation/evaluation/agent8-rank13-donor-evolution-factorial-native.cjs
      - name: Compare 32 original-source retrospective native policy attempts
        if: ${{ !inputs.fresh_registered && !inputs.native_tests_only }}
        run: node simulation/evaluation/agent8-rank15-effective-aor-item-replay.cjs
      - name: Compare 32 newly registered, unscreened native policy attempts
        if: ${{ inputs.fresh_registered && !inputs.native_tests_only }}
        run: node simulation/evaluation/agent8-rank15-effective-aor-fresh-registered.cjs
      - name: Preserve full raw Store evidence and explicit unqualified comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent8-rank15-aor-effective-item-veto-native
          path: |
            agent8-rank15-effective-aor-item-retrospective-raw.json
            agent8-rank15-effective-aor-item-retrospective-summary.json
            agent8-rank15-effective-aor-item-fresh-native-raw.json
            agent8-rank15-effective-aor-item-fresh-native-summary.json
            agent8-original13-donor-paired-native.json
            agent8-original13-donor-evolution-factorial-native.json
            agent8-original13-donor-evolution-paper-correct-native.json
          if-no-files-found: warn
          retention-days: 30
