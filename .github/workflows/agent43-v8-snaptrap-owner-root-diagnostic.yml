name: Agent43 pinned Snap Trap owner-root and exact prompt blocker
on:
  workflow_dispatch:
    inputs:
      owner_mail_after_pass:
        description: 'Run frozen two-seat v8 early Mail versus Pass treatment'
        required: false
        default: false
        type: boolean
      follow_mail_nest_ball:
        description: 'Run frozen original Mail-to-Nest-to-Bench follow-through'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: agent43-snaptrap-owner-root-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-owner-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned native submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Validate diagnostic entry point syntax
        run: node --check simulation/evaluation/agent43-v8-snaptrap-owner-root-diagnostic.cjs
      - name: Capture true unmatched owner roots in original two-seat frame
        run: node simulation/evaluation/agent43-v8-snaptrap-owner-root-diagnostic.cjs
      - name: Validate exact blocked prompt trace syntax
        run: node --check simulation/evaluation/agent43-v8-snaptrap-exact-prompt-blocker.cjs
      - name: Execute unchanged original four-trial frame and trace blocked prompt metadata
        run: node simulation/evaluation/agent43-v8-snaptrap-exact-prompt-blocker.cjs
      - name: Validate owner-confirm treatment syntax
        run: node --check simulation/evaluation/agent43-v8-snaptrap-ability-confirm-rescue.cjs
      - name: Resolve real owner ability confirmations in same four native trial seeds
        run: node simulation/evaluation/agent43-v8-snaptrap-ability-confirm-rescue.cjs
      - name: Validate actor-energy-recipient treatment syntax
        run: node --check simulation/evaluation/agent43-v8-snaptrap-energy-recipient-treatment.cjs
      - name: Run prospective two-seat energy recipient policy against frozen four-arm Stall frame
        run: node simulation/evaluation/agent43-v8-snaptrap-energy-recipient-treatment.cjs
      - name: Validate frozen four-arm owner Mail treatment syntax
        if: ${{ inputs.owner_mail_after_pass }}
        run: |
          node --check simulation/twinleaf/agent38-v8-four-arm-owner-mail-native.cjs
          node --check simulation/evaluation/agent38-v8-owner-mail-pass-four-arm.cjs
      - name: Pure-test exact four-trial adapter scope and hook restoration
        if: ${{ inputs.owner_mail_after_pass }}
        run: |
          node --test tests/2026-11/agent38-v8-four-arm-owner-mail-native.test.cjs
          node --test tests/2026-11/agent38-v8-owner-mail-pass-four-arm.test.cjs
      - name: Compare native early owner Mail after Pass with same-seed control
        if: ${{ inputs.owner_mail_after_pass }}
        run: node simulation/evaluation/agent38-v8-owner-mail-pass-four-arm.cjs
      - name: Compare actual owner Mail-selected Nest Ball to Bench continuation
        if: ${{ inputs.follow_mail_nest_ball }}
        run: |
          node --check simulation/evaluation/agent38-v8-mail-to-nest-bench-four-arm.cjs
          node simulation/evaluation/agent38-v8-mail-to-nest-bench-four-arm.cjs
      - name: Preserve complete actor-visible diagnostic regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent43-snaptrap-owner-root-${{ github.run_id }}
          path: artifacts/agent43-v8-snaptrap-owner-root/
          if-no-files-found: warn
          retention-days: 14
