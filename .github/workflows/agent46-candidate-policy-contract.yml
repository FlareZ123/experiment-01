name: Agent46 candidate policy contract

on:
  push:
    paths:
      - 'simulation/evaluation/2026-11/agent46-candidate-policy.cjs'
      - 'tests/2026-11/agent46-candidate-policy.test.cjs'
      - '.github/workflows/agent46-candidate-policy-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate policy syntax
        run: node --check simulation/evaluation/2026-11/agent46-candidate-policy.cjs
      - name: Run focused candidate policy regression suite
        run: node --test tests/2026-11/agent46-candidate-policy.test.cjs
