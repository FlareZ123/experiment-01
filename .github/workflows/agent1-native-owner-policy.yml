name: Agent1 original-source native owner policy experiments

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Run one bounded source-original K0 policy experiment, with no competitive-win qualification'
        type: choice
        required: true
        options:
          - owner-starvip
          - original-source-opponent-blower
          - owner-starvip-opponent-blower
          - source-return-retool
          - blower-timing-three
          - postblower-radiant
          - rank17-prospective-evolution
          - raichu-effect-differential
          - raichu-paper-damage-native

permissions:
  contents: read

jobs:
  actor-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned upstream submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Pure owner-plan selectors, lifecycle and fail-closed original-six pairing
        run: node --test tests/agent1-owner-oranguru-starvip-native.test.cjs tests/agent1-rank11-six-source-policy-pair.test.cjs
      - name: Alolan Raichu native damage-versus-counter typing fixture
        if: inputs.experiment == 'raichu-effect-differential'
        run: node --test tests/agent1-alolan-raichu-damage-type-native.test.cjs tests/agent1-electro-rain-hook-identity.test.cjs
      - name: Original rank17 paper damage hook replay
        if: inputs.experiment == 'raichu-paper-damage-native'
        run: node simulation/evaluation/agent1-rank17-electro-rain-native-hook-observation.cjs > agent1-rank17-hook-native.json
      - name: Archive eight original rank17 damage-hook replay attempts
        if: always() && inputs.experiment == 'raichu-paper-damage-native'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-original-rank17-native-paper-damage-hook
          path: agent1-rank17-hook-native.json
          if-no-files-found: warn
      - name: Rank17 prospective source-identity and actor-only source ledger tests
        if: inputs.experiment == 'rank17-prospective-evolution'
        run: node --test tests/agent1-rank17-original-evolution-prospective.test.cjs
      - name: Original six K0 owner-visible Star-VIP native plan
        if: inputs.experiment == 'owner-starvip'
        run: node simulation/evaluation/agent1-rank11-owner-starvip-autonomy-original-six.cjs > agent1-owner-starvip-native.json
      - name: Require all six real owner K0 starts and log complete setup progress
        if: inputs.experiment == 'owner-starvip'
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-owner-starvip-native.json');a.equal(r.originalK0Matched,6);a.equal(r.equippedGarbodorSourceReturn,6,'Six source owner card-conditioned routes must finish with native equipped Garbodor after opponent');a.equal(r.competitiveQualifiedGames,0);console.log('AGENT1_OWNER_STARVIP_NATIVE',JSON.stringify({chosen:r.chosen,accepted:r.nativeAccepted,promptAccept:r.ownerPromptAccepted,survived:r.equippedGarbodorSourceReturn,rows:r.rows.map(x=>({index:x.index,seed:x.seed,plans:x.sourcePlanAudit?.plansChosen??null,accepted:x.sourcePlanAudit?.nativeAccepted??null,completed:x.sourcePlanAudit?.completedEquippedGarbodor??null,aborts:x.sourcePlanAudit?.abortReasons??null}))}))"
      - name: Same-source six real opponent owner-visible Field Blower counterfactual
        if: inputs.experiment == 'original-source-opponent-blower'
        run: node simulation/evaluation/agent1-rank11-source-opponent-original-blower-pair.cjs > agent1-source-opponent-blower-native.json
      - name: Strict six original K0 physical pairs and counterplay witness
        if: inputs.experiment == 'original-source-opponent-blower'
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-source-opponent-blower-native.json');a.equal(r.samePhysicalPairs,6);a.equal(r.sourceReturnPairs,6);a.equal(r.competitiveQualifiedGames,0);console.log('AGENT1_SOURCE_BLOWER_NATIVE',JSON.stringify({selected:r.nativeBlowerProposals,removed:r.nativeBlowerPublicToolRemovalChecks,rows:r.rows.map(x=>({index:x.index,seed:x.seed,generic:x.untouchedOpponentSourceGarbodorAtReturn,responding:x.empoweredOpponentSourceGarbodorAtReturn,baseline:x.untreatedStatus,treated:x.treatedStatus}))}))"
      - name: Same-source K0 twelve-arm actor-selected Star-VIP and owner Field Blower
        if: inputs.experiment == 'owner-starvip-opponent-blower'
        run: node simulation/evaluation/agent1-rank11-six-original-two-seat-blower-response.cjs > agent1-two-seat-owner-starvip-blower-native.json
      - name: Attest both actor-visible opportunities and physical original deal parity
        if: inputs.experiment == 'owner-starvip-opponent-blower'
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-two-seat-owner-starvip-blower-native.json');a.equal(r.originalPairs,6);a.equal(r.armsAttempted,12);a.equal(r.originallyVerifiedArms,12);a.equal(r.chosenSourcePlans,12);a.equal(r.acceptedSourcePlanSteps,132);a.equal(r.genuineOwnerReturnWitnesses,12);a.equal(r.equippedGarbodorAtOwnerReturn,11);a.equal(r.unequippedGarbodorAtOwnerReturn,1);const matched=r.rows.find(x=>x.index===299);a.equal(matched.arms[0].sourceFirstReturnAfterOpponent.anyToolEquippedGarbodorCount,1);a.equal(matched.arms[1].sourceFirstReturnAfterOpponent.anyToolEquippedGarbodorCount,0);a.equal(r.heldBlowerResponseRootCount,1);a.equal(r.confirmedEarlyToolRemovalEvents,1);a.equal(r.competitiveQualifiedGames,0);console.log('AGENT1_OWNER_BOTH_SEATS_NATIVE',JSON.stringify({verified:r.originallyVerifiedArms,sourcePlans:r.chosenSourcePlans,sourceSteps:r.acceptedSourcePlanSteps,opponentBlowerRoots:r.heldBlowerResponseRootCount,removals:r.confirmedEarlyToolRemovalEvents,rows:r.rows.map(x=>({index:x.index,seed:x.seed,arms:x.arms.map(y=>({response:y.opponentBlowerPolicy,status:y.status,sourceEquippedAtPlanEnd:y.sourceCompletedEquippedAtSourcePlanEnd,sourceEquippedOnReturn:y.sourceFirstReturnAfterOpponent?.anyToolEquippedGarbodorCount??null,blower:y.nativeTurn2FieldBlowerRootCount}))}))}))"
      - name: Original source owner turn3 Tool-restoration two-arm native counterfactual
        if: inputs.experiment == 'source-return-retool'
        run: node simulation/evaluation/agent1-rank11-turn3-return-retool-pair.cjs > agent1-source-return-retool-native.json
      - name: Require same original K0 / real opponent Blower in both native arms
        if: inputs.experiment == 'source-return-retool'
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-source-return-retool-native.json');a.equal(r.attempted,2);a.equal(r.blocked,0);a.equal(r.competitiveQualifiedGames,0);a.equal(r.rows[0].sourceReturnRepair,false);a.equal(r.rows[1].sourceReturnRepair,true);a.equal(r.rows[0].recipientConfirmedRemoval,1);a.equal(r.rows[1].recipientConfirmedRemoval,1);a.deepEqual(r.rows[0].sourceGarbodorToolPrintingsAtOpponentTurn4,['Float Stone BKT']);a.deepEqual(r.rows[1].sourceGarbodorToolPrintingsAtOpponentTurn4,['Float Stone BKT']);a.equal(r.sourceReturnRepairChosen,1);a.equal(r.sourceReturnRepairAccepted,3);a.equal(r.sourceReturnRepairCompleted,1);console.log('AGENT1_RETURN_RETOOL_NATIVE',JSON.stringify({chosen:r.sourceReturnRepairChosen,accepted:r.sourceReturnRepairAccepted,complete:r.sourceReturnRepairCompleted,rows:r.rows.map(x=>({repair:x.sourceReturnRepair,status:x.status,actions:x.sourceTurn3Plays,steps:x.sourceRepair?.events??[]}))}))"
      - name: Archive complete source turn3 Tool restoration outcomes and errors
        if: always() && inputs.experiment == 'source-return-retool'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-lean-source-return-retool-native
          path: agent1-source-return-retool-native.json
          if-no-files-found: warn
      - name: Original source K0 three-arm native Field Blower timing comparison
        if: inputs.experiment == 'blower-timing-three'
        run: node simulation/evaluation/agent1-rank11-blower-timing-three-native.cjs > agent1-blower-timing-three-native.json
      - name: Require all three preregistered original physical arms and retain outcomes
        if: inputs.experiment == 'blower-timing-three'
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-blower-timing-three-native.json');a.equal(r.attempted,3);a.equal(r.settled,3);a.equal(r.blocked,0);a.deepEqual(r.rows.map(x=>x.arm),['immediate','deferred','generic']);a.equal(r.competitiveQualifiedGames,0);console.log('AGENT1_BLOWER_TIMING_NATIVE',JSON.stringify(r.rows.map(x=>({arm:x.arm,heldT4:x.recipientHeldBlowerAtT4,t2:x.recipientTurn2BlowerRoots,t4:x.recipientTurn4BlowerRoots,removal2:x.confirmedToolRemovalTurn2,removal4:x.confirmedToolRemovalTurn4,abilitiesT4:x.recipientT4AbilityNames}))))"
      - name: Archive complete original-deal Field Blower timing arms
        if: always() && inputs.experiment == 'blower-timing-three'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-original-fieldblower-timing-native
          path: agent1-blower-timing-three-native.json
          if-no-files-found: warn
      - name: Original recipient own-Quick-Ball K1 Radiant two-arm native counterfactual
        if: inputs.experiment == 'postblower-radiant'
        run: node simulation/evaluation/agent1-rank11-postblower-radiant-owner-k1-pair.cjs > agent1-postblower-radiant-native.json
      - name: Require two original K0 and recipient genuine Quick Ball K1 arms
        if: inputs.experiment == 'postblower-radiant'
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-postblower-radiant-native.json');a.equal(r.attempted,3);a.equal(r.nativeVerified,3);a.equal(r.competitiveQualifiedGames,0);a.deepEqual(r.rows.map(x=>x.preferRadiantAfterBlowerSearch),[false,true,true]);a.deepEqual(r.rows.map(x=>x.activateRadiantClimacticGate),[false,false,true]);a.equal(r.rows[0].nativeQuickBallRoots,1);a.equal(r.rows[1].nativeQuickBallRoots,1);a.equal(r.rows[2].nativeQuickBallRoots,1);console.log('AGENT1_RADIANT_NATIVE',JSON.stringify(r.rows.map(x=>({prefer:x.preferRadiantAfterBlowerSearch,choice:x.nativeRecipientOwnDeckChoices,radiantSelected:x.recipientRadiantSelectionCommitted,play:x.nativeRadiantBenchPlayRoots,climactic:x.nativeClimacticGateAbilityRoots,publicRadiant:x.publicOpponentRadiantAtSourceT3,publicVMAX:x.publicOpponentVMaxAtSourceT3}))))"
      - name: Archive all original recipient owner-K1 Radiant trial outcomes
        if: always() && inputs.experiment == 'postblower-radiant'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-postblower-owner-radiant-native
          path: agent1-postblower-radiant-native.json
          if-no-files-found: warn
      - name: Rank17 original 60 symmetric natural evolution randomized 16-arm native trial
        if: inputs.experiment == 'rank17-prospective-evolution'
        run: node simulation/evaluation/agent1-rank17-original-evolution-prospective.cjs > agent1-rank17-native.json
      - name: Require all 16 original registered native attempts and explicit zero qualified games
        if: inputs.experiment == 'rank17-prospective-evolution'
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-rank17-native.json');a.equal(r.attempted,16);a.equal(r.competitiveQualifiedGames,0);a.equal(r.paired.length,8);a.equal(r.modes.frozenV2Control.rows.length,8);a.equal(r.modes.naturalEvolutionOnly.rows.length,8);console.log('AGENT1_RANK17_ATTEMPT_STATUS',JSON.stringify(r.paired.map(x=>({id:x.trial.id,physical:x.sourceDealMatch,baseline:x.control.status,treatment:x.naturalEvolution.status,baselineEvolutions:x.control.sourceStage1PlayRoots.length,treatmentEvolutions:x.naturalEvolution.sourceStage1PlayRoots.length}))))"
      - name: Preserve every rank17 registered original native trial and diagnostic abort
        if: always() && inputs.experiment == 'rank17-prospective-evolution'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-original-rank17-evolution-native
          path: agent1-rank17-native.json
          if-no-files-found: warn
      - name: Archive ALL owner Star-VIP results and errors
        if: always() && inputs.experiment == 'owner-starvip'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-lean-owner-starvip-native
          path: agent1-owner-starvip-native.json
          if-no-files-found: warn
      - name: Archive ALL source Field Blower control outcomes and errors
        if: always() && inputs.experiment == 'original-source-opponent-blower'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-lean-source-opponent-blower-native
          path: agent1-source-opponent-blower-native.json
          if-no-files-found: warn
      - name: Archive ALL bilateral actor-plan counterplay outcomes and errors
        if: always() && inputs.experiment == 'owner-starvip-opponent-blower'
        uses: actions/upload-artifact@v4
        with:
          name: agent1-lean-two-seat-owner-native
          path: agent1-two-seat-owner-starvip-blower-native.json
          if-no-files-found: warn
