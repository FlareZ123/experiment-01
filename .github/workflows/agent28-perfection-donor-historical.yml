name: Agent 28 historical Perfection donor diagnostic
on:
  workflow_dispatch:
    inputs:
      agent50_zero_hand_poltergeist:
        description: Replay a frozen rank11 copied attack with public zero-hand alternative, development only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  historical-public-donors:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned simulator
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install simulator dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned simulator
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify hidden-zone-safe public donor observer
        run: node --test tests/agent28-perfection-donor-context.test.cjs
      - name: Replay four historical games with post-choice public donor snapshots
        run: node simulation/evaluation/agent28-perfection-public-source-replay.cjs > agent28-public-copy-source.json
      - name: Print only observed Pass preconditions, never match strength
        run: node -e "const d=require('./agent28-public-copy-source.json'); for(const r of d.rows) console.log('HISTORICAL',JSON.stringify({id:r.id,unchanged:r.rootActionLedgerSha256,samples:r.samples}));console.log('QUALIFIED',d.competitiveQualifiedGames)"
      - uses: actions/upload-artifact@v4
        with:
          name: agent28-public-perfection-historical-observation
          path: agent28-public-copy-source.json
          retention-days: 10
      - name: Verify opted-in public-zero-hand copied attack chooser
        if: inputs.agent50_zero_hand_poltergeist == true
        run: node --test tests/agent13-actor-only-choose-attack.test.cjs tests/agent50-zero-hand-poltergeist-choice.test.cjs
      - name: Original source-locked Poltergeist-preferring attack policy
        if: inputs.agent50_zero_hand_poltergeist == true
        env:
          AGENT13_COPY_POLTERGEIST_PRIORITY: 'true'
        run: node simulation/twinleaf/agent13-copied-attack-source-smoke.cjs > agent50-copy-baseline.json
      - name: Identical source deal with only zero-hand copied attack choice changed
        if: inputs.agent50_zero_hand_poltergeist == true
        env:
          AGENT13_COPY_POLTERGEIST_PRIORITY: 'true'
          AGENT50_PUBLIC_ZERO_HAND_POLTERGEIST_DEV: 'true'
        run: node simulation/twinleaf/agent13-copied-attack-source-smoke.cjs > agent50-copy-optin.json
      - name: Compare retrospective source-dealt decisions without competitive inference
        if: inputs.agent50_zero_hand_poltergeist == true
        run: node simulation/evaluation/agent50-zero-hand-native-pair.cjs agent50-copy-baseline.json agent50-copy-optin.json > agent50-zero-hand-native-pair.json
      - name: Archive all source-locked baseline, treatment and complete negative evidence
        if: ${{ always() && inputs.agent50_zero_hand_poltergeist }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-zero-hand-native-decision-development
          path: |
            agent50-copy-baseline.json
            agent50-copy-optin.json
            agent50-zero-hand-native-pair.json
          if-no-files-found: warn
          retention-days: 10
