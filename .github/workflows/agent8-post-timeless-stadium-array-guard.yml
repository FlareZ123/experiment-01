name: Agent8 Max Geist Stadium guard contract

on:
  push:
    paths:
      - 'simulation/twinleaf/2026-11/agent8-post-timeless-maxgeist-root-intent.cjs'
      - 'tests/agent34-actor-only-root-policy.test.cjs'
      - '.github/workflows/agent8-post-timeless-stadium-array-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actor-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check the fail-closed Max Geist root selector
        run: node --check simulation/twinleaf/2026-11/agent8-post-timeless-maxgeist-root-intent.cjs
      - name: Run actor-observation Max Geist and root-policy regression
        run: node --test tests/agent34-actor-only-root-policy.test.cjs
