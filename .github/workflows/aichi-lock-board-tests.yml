name: Aichi Temple and Wobbuffet board interactions

on:
  workflow_dispatch:
    inputs:
      rank11_lastturn_hand_window:
        description: 'Read-only exact rank11 last-turn own-hand window before copied Poltergeist positive control'
        required: false
        type: boolean
        default: false
      rank19_adp_source_opening:
        description: 'Prospectively fixed source-rank19 direct ADP+DDE opening versus source rank1, bounded Store trials'
        required: false
        type: boolean
        default: false
      rank11_copy_observer_parity:
        description: 'Read-only source copied-attack parity check'
        required: false
        type: boolean
        default: false
      rank11_delegated_attack_selection_source:
        description: 'Pinned authentic rank11 New Moon delegated attack selection and Store declaration audit'
        required: false
        type: boolean
        default: false
      rank8_attack_log_full_source:
        description: 'Complete source-dealt rank8 test of central Store attack declarations'
        required: false
        type: boolean
        default: false
      herdier_evolution_lock_probe:
        description: 'Pinned Herdier SUM 104 actual evolution under Wobbuffet and Garbotoxin'
        type: boolean
        default: false
      rank8_attach_prompt_probe:
        description: 'One source-ranked Temple-A invalid AttachEnergyPrompt diagnostic'
        required: false
        type: boolean
        default: false
      rank8_distinct_targets_contrast:
        description: 'Paired physical rank-8 Tapu Koko distinct-target resolver contrast'
        required: false
        type: boolean
        default: false
      rank8_two_mega_absol_fork:
        description: 'One legal rank-8 Dance of the Ancients opponent-action counterfork'
        required: false
        type: boolean
        default: false
      rank31_chimecho_source_pair:
        description: 'Two predeclared source-rank31 Chimecho policy exposures versus rank1'
        required: false
        type: boolean
        default: false
      rank31_fog_energy_source_pair:
        description: 'Opt-in two source-dealt rank31 Fog Energy-choice alternative branches'
        required: false
        type: boolean
        default: false
      rank31_fog_breadth_source_pair:
        description: 'Prospectively fixed two-deal rank31 generic/strict/broader Fog search comparison'
        required: false
        type: boolean
        default: false
      rank8_preregistered_start_panel:
        description: 'Eight source rank-8 decorrelated v3 starts (repeats 1-4, both seats)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  effects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test rank19 ADP readiness separately from printed attack declaration
        if: inputs.rank19_adp_source_opening
        run: node --test tests/rank19-adp-source-opening-policy.test.cjs
      - name: Prospectively screen actual rank19 ADP direct opening and autonomous actions
        if: inputs.rank19_adp_source_opening
        run: node simulation/twinleaf/rank19-adp-source-opening-policy.cjs > rank19-source-adp-opening.json
      - name: Summarize unqualified rank19 ADP source opportunity and policy gate
        if: inputs.rank19_adp_source_opening
        run: >-
          node -e "const r=require('./rank19-source-adp-opening.json');
          console.log(JSON.stringify({schema:r.schema,
          count:r.counts,engineRevision:r.sourceEngineRevision,
          complete:r.allAttemptsRetained,qualified:false}));"
      - name: Retain complete 160-attempt rank19 source ADP policy records
        if: inputs.rank19_adp_source_opening && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank19-source-adp-opening
          path: rank19-source-adp-opening.json
          if-no-files-found: warn
      - name: Observe source rank11 turn35 own-hand before terminal copied attack
        if: inputs.rank11_lastturn_hand_window
        run: node simulation/twinleaf/rank11-lastturn-hand-window.cjs > rank11-lastturn-hand.json
      - name: Preserve rank11 source own-hand before terminal Poltergeist
        if: inputs.rank11_lastturn_hand_window && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-lastturn-ownhand-positive-control
          path: rank11-lastturn-hand.json
          if-no-files-found: warn
      - name: Source copied attack observation parity
        if: inputs.rank11_copy_observer_parity
        run: node simulation/twinleaf/source-copied-attack-observer-isolation.cjs
      - name: Verify source-dealt rank11 printed copied-attack source and Store declaration
        if: inputs.rank11_delegated_attack_selection_source
        run: node simulation/twinleaf/newmoon-rank11-perfection-delegated-source.cjs > rank11-copied-attack-selection.json
      - name: Surface actual rank11 terminal copied attack identity
        if: inputs.rank11_delegated_attack_selection_source
        run: >-
          node -e "const r=require('./rank11-copied-attack-selection.json');
          console.log(JSON.stringify({seed:r.seed,sourceRank:r.sourceRank,
          copied:r.terminalAttack,source:r.terminalSelectedPrinting,
          root:r.terminalAttackRootAction,attacks:r.attacks,effect:r.terminalPublicEffect,
          usedPrizes:r.finalPrizes,turn:r.finalTurns,qualified:false}));"
      - name: Preserve rank11 selected printing and copied-attack provenance
        if: inputs.rank11_delegated_attack_selection_source && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-copied-attack-selection
          path: rank11-copied-attack-selection.json
          if-no-files-found: warn
      - name: Verify central Store attack ledger on one full source-dealt rank8 game
        if: inputs.rank8_attack_log_full_source
        run: node simulation/twinleaf/source-attack-log-full-match.cjs > rank8-central-attack-ledger.json
      - name: Surface rank8 completed source Store logging summary
        if: inputs.rank8_attack_log_full_source
        run: >-
          node -e "const r=require('./rank8-central-attack-ledger.json');
          console.log(JSON.stringify({seed:r.seed,rank:r.rank,
          printedActionAttacks:r.originalAttackActionTrace.length,
          storeDeclarations:r.centralStoreAttackDeclarations.length,
          turns:r.turns,actions:r.actions,finished:r.finished,
          qualified:false}));"
      - name: Preserve complete source rank8 attack ledger evidence
        if: inputs.rank8_attack_log_full_source && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-central-attack-ledger
          path: rank8-central-attack-ledger.json
          if-no-files-found: warn
      - name: Verify pure attack-log declaration observer gates
        run: node --test tests/twinleaf-attack-log-declarations.test.cjs
      - name: Verify Poltergeist physical Trainer-count observer invariants
        run: node --test tests/poltergeist-effect-observer.test.cjs
      - name: Verify pinned Perfection delegated copied-GX Store action
        run: node simulation/twinleaf/perfection-delegated-action.cjs
      - name: Verify Gengar Horror House special-Psychic source fidelity diagnostic
        run: node simulation/twinleaf/gengar-horror-house-rainbow-fidelity.cjs
      - name: Verify opt-in paper-Psychic Horror House Store correction and rollback
        run: node simulation/twinleaf/gengar-horror-house-extra-psychic-hook-contract.cjs
      - run: node simulation/twinleaf/temple-wobbuffet-board.cjs
      - run: node simulation/twinleaf/temple-energy-board.cjs
      - run: node simulation/twinleaf/wobbuffet-pivot.cjs
      - run: node simulation/twinleaf/vileplume-double-tm-board.cjs
      - run: node simulation/twinleaf/vileplume-itemlock-action.cjs
      - run: node simulation/twinleaf/chimecho-hand-entry-path-action.cjs
      - run: node simulation/twinleaf/chimecho-bell-attack-action.cjs
      - name: Verify exact rank31 Fog bridge and scoped owner-prompt policy
        run: node --test tests/rank31-fog-energy-direct.test.cjs tests/rank31-fog-energy-prompt-policy.test.cjs tests/rank31-fog-energy-broad.test.cjs tests/rank31-fog-breadth-exact.test.cjs
      - run: node simulation/twinleaf/ranger-lele-itemlock-action.cjs
      - run: node simulation/twinleaf/ranger-stone-itemlock-action.cjs
      - name: Verify Eldegoss RCL Happy Match Bench-entry lock fidelity
        run: node simulation/twinleaf/eldegoss-entry-lock-action.cjs
      - name: Verify Articuno CES Legendary Ascent Bench-entry lock fidelity
        run: node simulation/twinleaf/articuno-entry-lock-action.cjs
      - name: Verify opt-in Eldegoss hook provenance and restoration
        run: node simulation/twinleaf/eldegoss-entry-runner-smoke.cjs
      - name: Verify Articuno and distinct Energy target opt-in hook lifecycle
        run: node simulation/twinleaf/entry-attach-runner-lifecycle.cjs
      - name: Source Herdier on-evolution recovery under Ability locks
        if: inputs.herdier_evolution_lock_probe
        run: node simulation/twinleaf/herdier-treasure-hunt-lock-action.cjs > herdier-evolution-lock.json
      - name: Preserve all six positive and negative Herdier lock scenarios
        if: inputs.herdier_evolution_lock_probe && always()
        uses: actions/upload-artifact@v4
        with:
          name: herdier-evolution-lock-matrix
          path: herdier-evolution-lock.json
          if-no-files-found: warn
      - name: Verify source-vs-corrected Herdier evolution lock and single-Item contract
        if: inputs.herdier_evolution_lock_probe
        run: node simulation/twinleaf/herdier-treasure-hunt-hook-contract.cjs > herdier-corrected-contract.json
      - name: Retain Herdier correction counterfactual and hook restoration
        if: inputs.herdier_evolution_lock_probe && always()
        uses: actions/upload-artifact@v4
        with:
          name: herdier-corrected-contract
          path: herdier-corrected-contract.json
          if-no-files-found: warn
      - name: Verify opt-in Herdier headless provenance and prototype restoration
        if: inputs.herdier_evolution_lock_probe
        run: node simulation/twinleaf/herdier-headless-hook-lifecycle.cjs
      - name: Recheck archived rank-8 Temple-A invalid Energy prompt after the bot choice
        if: inputs.rank8_attach_prompt_probe
        run: node simulation/twinleaf/rank8-attach-energy-prompt-source.cjs > rank8-attach-prompt.json
      - name: Preserve rank-8 post-choice prompt evidence
        if: inputs.rank8_attach_prompt_probe && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-temple-A-attach-prompt
          path: rank8-attach-prompt.json
          if-no-files-found: warn
      - name: Paired rank-8 Tapu Koko distinct-target source replays
        if: inputs.rank8_distinct_targets_contrast
        run: node simulation/twinleaf/rank8-distinct-targets-contrast.cjs > rank8-distinct-targets.json
      - name: Preserve paired rank-8 target policy contrast
        if: inputs.rank8_distinct_targets_contrast && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-distinct-target-contrast
          path: rank8-distinct-targets.json
          if-no-files-found: warn
      - name: Exercise opt-in runner flag on authentic rank-8 source deal
        if: inputs.rank8_distinct_targets_contrast
        run: node simulation/twinleaf/rank8-source-distinct-attach-runner.cjs > rank8-attach-runner.json
      - name: Preserve source-dealt runner provenance
        if: inputs.rank8_distinct_targets_contrast && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-source-attach-runner-flag
          path: rank8-attach-runner.json
          if-no-files-found: warn
      - name: Counterfork rank-8 Tapu Koko Energy to both Mega Absol ex
        if: inputs.rank8_two_mega_absol_fork
        run: node simulation/twinleaf/rank8-tapukoko-two-mega-absol-counterfork.cjs > rank8-absol-counterfork.json
      - name: Preserve rank-8 legal opponent Energy decision
        if: inputs.rank8_two_mega_absol_fork && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-mega-absol-energy-counterfork
          path: rank8-absol-counterfork.json
          if-no-files-found: warn
      - name: Audit predeclared rank-8 actual start order under guarded policy
        if: inputs.rank8_preregistered_start_panel
        run: node simulation/twinleaf/rank8-predeclared-start-panel.cjs > rank8-start-panel.json
      - name: Preserve all eight source start-order outcomes
        if: inputs.rank8_preregistered_start_panel && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-preregistered-start-panel
          path: rank8-start-panel.json
          if-no-files-found: warn
      - name: Observe actual rank31 Chimecho policy in both physical slots
        if: inputs.rank31_chimecho_source_pair
        run: node simulation/twinleaf/rank31-chimecho-source-visibility.cjs > rank31-chimecho-source.json
      - name: Preserve predeclared rank31 source visibility
        if: inputs.rank31_chimecho_source_pair && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank31-chimecho-source-pair
          path: rank31-chimecho-source.json
          if-no-files-found: warn
      - name: Run precommitted rank31 Fog Energy source-deal policy contrast
        if: inputs.rank31_fog_energy_source_pair
        run: node simulation/twinleaf/rank31-fog-energy-source-pair.cjs > rank31-fog-energy-source.json
      - name: Retain both rank31 original deals and paired counterfactuals
        if: inputs.rank31_fog_energy_source_pair && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank31-fog-energy-source-pair
          path: rank31-fog-energy-source.json
          if-no-files-found: warn
      - name: Compare strict and broadened Fog search on two fixed source deals
        if: inputs.rank31_fog_breadth_source_pair
        run: node simulation/twinleaf/rank31-fog-breadth-source-contrast.cjs > rank31-fog-breadth-source.json
      - name: Retain all source deal exposures and nonexposures
        if: inputs.rank31_fog_breadth_source_pair && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank31-fog-breadth-source-pair
          path: rank31-fog-breadth-source.json
          if-no-files-found: warn
      - run: node --test tests/battle-compressor-minimum.test.cjs
      - run: node --test tests/twinleaf-attached-tool-power-tactic.test.cjs
      - name: Bounded published 60-card Tool-Power policy diagnostic
        run: node simulation/twinleaf/attached-tool-power-source-pilot.cjs > tool-power-source-pilot.json
      - name: Surface Tool Power source-deal action exposures
        run: >-
          node -e "const r=require('./tool-power-source-pilot.json');
          for(const t of r.trials)console.log(JSON.stringify({
          seed:t.seed,kind:t.kind,status:t.status,actions:t.actions,
          stones:t.stonesAttachedBySeat,star:t.starAlchemyActions,
          effective:t.attachedToolPowerPolicy,error:t.error||null}));"
      - name: Preserve Tool-Power policy diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-tool-power-policy-diagnostic
          path: tool-power-source-pilot.json
          if-no-files-found: ignore
