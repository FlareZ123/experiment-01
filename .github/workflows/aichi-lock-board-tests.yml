name: Aichi Temple and Wobbuffet board interactions

on:
  workflow_dispatch:
    inputs:
      agent35_perfection_pass_bridge_development:
        description: 'Historical rank6/rank11 owner-only Perfection Pass bridge dev contrast, not v2'
        required: false
        type: boolean
        default: false
      agent35_newmoon_payload_12seed:
        description: 'Existing Agent9 owner-visible Compressor source-payload prospective 12-deal mechanical pilot, unqualified'
        required: false
        type: boolean
        default: false
      rank11_turn24_copied_reply:
        description: 'One authentic source-dealt candidate Poltergeist response instead of self-Path at turn24'
        required: false
        type: boolean
        default: false
      agent37_rank11_tool_maintenance:
        description: 'Predeclared 4-seed both-seat source-owned Float Stone to Garbodor retarget, unqualified'
        required: false
        type: boolean
        default: false
      agent34_rank11_autonomous_carmine:
        description: 'Bounded own-information Carmine response policy versus frozen New Moon, archived and registered seeds'
        required: false
        type: boolean
        default: false
      rank11_terminal_carmine_counterfactual:
        description: 'One retrospective actual owner-hand Carmine action instead of source rank11 turn35 Pass'
        required: false
        type: boolean
        default: false
      rank11_lastturn_hand_window:
        description: 'Read-only exact rank11 last-turn own-hand window before copied Poltergeist positive control'
        required: false
        type: boolean
        default: false
      rank19_adp_source_opening:
        description: 'Prospectively fixed source-rank19 direct ADP+DDE opening versus source rank1, bounded Store trials'
        required: false
        type: boolean
        default: false
      rank11_copy_observer_parity:
        description: 'Read-only source copied-attack parity check'
        required: false
        type: boolean
        default: false
      rank11_delegated_attack_selection_source:
        description: 'Pinned authentic rank11 New Moon delegated attack selection and Store declaration audit'
        required: false
        type: boolean
        default: false
      rank11_crobat_stone_frontier:
        description: 'Read-only authentic turn23 Forest Seal Stone and Dark Patch zone qualification'
        required: false
        type: boolean
        default: false
      rank11_crobat_owner_positive_control:
        description: 'Portable owner-visible source Crobat late lethal policy, fixed retrospective mechanical regression'
        required: false
        type: boolean
        default: false
      rank11_crobat_stone_store_fork:
        description: 'Execute Store Shopping Center to Crobat Stone Dark Patch source counterattack'
        required: false
        type: boolean
        default: false
      rank8_attack_log_full_source:
        description: 'Complete source-dealt rank8 test of central Store attack declarations'
        required: false
        type: boolean
        default: false
      herdier_evolution_lock_probe:
        description: 'Pinned Herdier SUM 104 actual evolution under Wobbuffet and Garbotoxin'
        type: boolean
        default: false
      rank8_attach_prompt_probe:
        description: 'One source-ranked Temple-A invalid AttachEnergyPrompt diagnostic'
        required: false
        type: boolean
        default: false
      rank8_distinct_targets_contrast:
        description: 'Paired physical rank-8 Tapu Koko distinct-target resolver contrast'
        required: false
        type: boolean
        default: false
      rank8_two_mega_absol_fork:
        description: 'One legal rank-8 Dance of the Ancients opponent-action counterfork'
        required: false
        type: boolean
        default: false
      rank31_chimecho_source_pair:
        description: 'Two predeclared source-rank31 Chimecho policy exposures versus rank1'
        required: false
        type: boolean
        default: false
      rank31_fog_energy_source_pair:
        description: 'Opt-in two source-dealt rank31 Fog Energy-choice alternative branches'
        required: false
        type: boolean
        default: false
      rank31_fog_breadth_source_pair:
        description: 'Prospectively fixed two-deal rank31 generic/strict/broader Fog search comparison'
        required: false
        type: boolean
        default: false
      agent48_carmine_policy_census:
        description: '24 fixed source owner-root Carmine default versus optional activation audits, no qualified wins'
        required: false
        type: boolean
        default: false
      agent33_tropical_beach_native:
        description: 'Staged both-seat native Tropical Beach action draw and end-turn only, unqualified'
        required: false
        type: boolean
        default: false
      agent33_tropical_beach_paired:
        description: 'Twelve preregistered original-rank3/6/29 same-deal Beach control vs optional owner-policy development games'
        required: false
        type: boolean
        default: false
      agent33_players_ceremony_native:
        description: 'Pinned both-seat SP127 held Stadium PlayCard then UseStadiumAction effect settlement'
        required: false
        type: boolean
        default: false
      agent34_gholdengo_native:
        description: 'Two-seat compiled original Store Gholdengo 30C direct Prize card and hand reset, synthetic staged'
        required: false
        type: boolean
        default: false
      agent48_carmine_first_native:
        description: '24 fixed first-player source-deal Store Carmine rule controls, no competitive games'
        required: false
        type: boolean
        default: false
      rank8_preregistered_start_panel:
        description: 'Eight source rank-8 decorrelated v3 starts (repeats 1-4, both seats)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  effects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Regress Player Ceremony owner-only default-off end-turn Stadium choice
        run: node --test tests/agent33-players-ceremony-lastchance.test.cjs
      - name: Stage original SP127 Player Ceremony full Store play and use on both physical seats
        if: inputs.agent33_players_ceremony_native
        run: node --test tests/agent33-players-ceremony-full-action-pinned.test.cjs
      - name: Stage actual both-seat Tropical Beach end-turn native Store action
        if: inputs.agent33_tropical_beach_native
        run: node --test tests/agent33-tropical-beach-pinned-native.test.cjs
      - name: Test native Beach effect observer's public-card-count-only settlement predicates
        run: node --test tests/agent33-beach-store-effect-witness.test.cjs
      - name: Fail closed on fabricated paired Beach starts and failed native attempts
        run: node --test tests/agent33-tropical-beach-original-paired.test.cjs
      - name: Preserve entire paired original rank3/6/29 Beach native-development panel
        if: inputs.agent33_tropical_beach_paired
        run: node simulation/evaluation/agent33-tropical-beach-original-paired.cjs > agent33-beach-original-paired.json
      - name: Archive both physical seats and failed attempts in fixed Beach development panel
        if: inputs.agent33_tropical_beach_paired && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent33-original-three-rank-beach-paired
          path: agent33-beach-original-paired.json
          if-no-files-found: warn
      - name: Verify original Store Gholdengo exact thirty-card hand and Prize effects on both seats
        if: inputs.agent34_gholdengo_native
        run: node simulation/twinleaf/agent34-gholdengo-native-prize-mechanic.cjs > agent34-gholdengo-native-prize-effect.json
      - name: Summarize Gholdengo printed direct Prize and hand-reset native validation
        if: inputs.agent34_gholdengo_native
        run: >-
          node -e "const r=require('./agent34-gholdengo-native-prize-effect.json');console.log(JSON.stringify({schema:r.schema,seats:r.seats,cases:r.cases,eligible:r.eligibleCases,prizes:r.directPrizeTransfers,qualified:r.qualifiedCompetitiveGames}));"
      - name: Archive all staged Gholdengo native effect receipts
        if: inputs.agent34_gholdengo_native && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent34-gholdengo-native-30c-prizes
          path: agent34-gholdengo-native-prize-effect.json
          if-no-files-found: warn
      - name: Measure optional actual actor Carmine decisions in 24 matched original source deals
        if: inputs.agent48_carmine_policy_census
        run: node simulation/twinleaf/agent48-carmine-owner-policy-census.cjs > agent48-carmine-actor-census.json
      - name: Surface actual actor Carmine proposal and invalid-root frequency
        if: inputs.agent48_carmine_policy_census
        run: >-
          node -e "const r=require('./agent48-carmine-actor-census.json');console.log(JSON.stringify({schema:r.schema,pairs:r.pairs,selected:r.actualOptionalCarmineRoots,rejected:r.optInRejectedActorRoots,errors:r.errors,qualified:r.competitiveGameQualified}));"
      - name: Archive every original source owner-root Carmine trial
        if: inputs.agent48_carmine_policy_census && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent48-carmine-actor-source-census
          path: agent48-carmine-actor-census.json
          if-no-files-found: warn
      - name: Audit original owner-hand Carmine discard affordability after baseline root actions
        if: inputs.agent48_carmine_policy_census
        run: node simulation/twinleaf/agent48-carmine-firstturn-amr-ledger.cjs > agent48-carmine-amr.json
      - name: Surface first-turn actor-held Carmine residual resource blockers
        if: inputs.agent48_carmine_policy_census
        run: >-
          node -e "const r=require('./agent48-carmine-amr.json');console.log(JSON.stringify({schema:r.schema,runs:r.originalRuns,heldAtActorRoot:r.originalFirstTurnHeldAtObservedActorRoot,chosen:r.actualChosenCarmineRoots,otherHandDistribution:r.residualOtherHandSizeDistribution,commonResidual:r.residualCardFrequencyAtMinimum.slice(0,10),errors:r.errors,qualified:r.qualifiedCompetitiveGames}));"
      - name: Archive every source owner-hand Carmine discard affordability observation
        if: inputs.agent48_carmine_policy_census && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent48-carmine-original-source-amr-ledger
          path: agent48-carmine-amr.json
          if-no-files-found: warn
      - name: Probe original source first-player Carmine with native settled effect
        if: inputs.agent48_carmine_first_native
        run: node simulation/twinleaf/agent48-firstturn-carmine-native-probe.cjs > agent48-carmine-first-native.json
      - name: Summarize physical first-turn Carmine opportunity and effect count
        if: inputs.agent48_carmine_first_native
        run: >-
          node -e "const r=require('./agent48-carmine-first-native.json');console.log(JSON.stringify({schema:r.schema,total:r.totalAttempts,held:r.naturalFirstTurnHeld,nativePlayable:r.nativeCanPlay,accepted:r.nativeAccepted,failedRuns:r.failedRuns,qualified:r.policyWinEvidenceQualified}));"
      - name: Archive every fixed first-turn native Carmine positive and negative
        if: inputs.agent48_carmine_first_native && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent48-native-firstturn-carmine-source
          path: agent48-carmine-first-native.json
          if-no-files-found: warn
      - name: Verify printed Carmine native exception and first-player ordinary-veto boundary
        if: inputs.agent48_carmine_first_native
        run: node simulation/twinleaf/agent34-native-firstturn-supporter-guard.cjs > agent34-native-firstturn-supporter-guard.json
      - name: Report original-source first-turn guard positive and blocked branches
        if: inputs.agent48_carmine_first_native
        run: >-
          node -e "const r=require('./agent34-native-firstturn-supporter-guard.json');console.log(JSON.stringify({schema:r.schema,sourceDeals:r.sourceSeedCount,eligible:r.eligibleNaturallyHeldCarmine,allowed:r.allowedNativeStoreCarmine,denied:r.preventedBeforeNativeDispatch,qualified:r.qualifiedCompetitiveGames}));"
      - name: Archive all first-turn native guard controls
        if: inputs.agent48_carmine_first_native && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent34-native-firstturn-supporter-allowdeny
          path: agent34-native-firstturn-supporter-guard.json
          if-no-files-found: warn
      - name: Measure native and paper-guard ordinary first-turn Supporter behavior on original source hands
        if: inputs.agent48_carmine_first_native
        run: node simulation/twinleaf/agent34-firstturn-ordinary-source-native.cjs > agent34-firstturn-ordinary-source-native.json
      - name: Report first-owner ordinary Supporter decision and dispatch envelope
        if: inputs.agent48_carmine_first_native
        run: >-
          node -e "const r=require('./agent34-firstturn-ordinary-source-native.json');console.log(JSON.stringify({schema:r.schema,sourceDeals:r.trials,ownerHeld:r.ownerHeldOrdinarySupporterFirstRoot,nativeReturn:r.nativeDirectPlayCardReturns,nativeReject:r.nativeDirectPlayCardRejects,paperVeto:r.researchGuardPreDispatchVetoes,qualified:r.qualifiedCompetitiveGames}));"
      - name: Archive source-dealt ordinary first-turn Supporter negative and positive control
        if: inputs.agent48_carmine_first_native && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent34-firstturn-ordinary-native-source
          path: agent34-firstturn-ordinary-source-native.json
          if-no-files-found: warn
      - name: Prove owner-hand public-board-only Garbotoxin Tool retarget
        if: inputs.agent37_rank11_tool_maintenance
        run: node --test tests/rank11-garbodor-tool-maintenance-policy.test.cjs
      - name: Run every preregistered rank11 Tool-maintenance physical seat
        if: inputs.agent37_rank11_tool_maintenance
        run: node simulation/twinleaf/rank11-garbodor-tool-maintenance-panel.cjs > rank11-garbodor-maintenance.json
      - name: Summarize Tool-maintenance exposure without counting competitive wins
        if: inputs.agent37_rank11_tool_maintenance
        run: >-
          node -e "const r=require('./rank11-garbodor-maintenance.json');
          console.log(JSON.stringify({schema:r.schema,
          scheduled:r.totalScheduledPairs,completed:r.bothArmsCompleted,
          failed:r.failedArmsPreserved,opportunities:r.retargetOpportunities,
          qualified:r.qualifiedCompetitiveGames}));"
      - name: Preserve all preregistered source Tool-maintenance cases
        if: inputs.agent37_rank11_tool_maintenance && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-garbodor-maintenance-prospective
          path: rank11-garbodor-maintenance.json
          if-no-files-found: warn
      - name: Test rank19 ADP readiness separately from printed attack declaration
        if: inputs.rank19_adp_source_opening
        run: node --test tests/rank19-adp-source-opening-policy.test.cjs
      - name: Prospectively screen actual rank19 ADP direct opening and autonomous actions
        if: inputs.rank19_adp_source_opening
        run: node simulation/twinleaf/rank19-adp-source-opening-policy.cjs > rank19-source-adp-opening.json
      - name: Summarize unqualified rank19 ADP source opportunity and policy gate
        if: inputs.rank19_adp_source_opening
        run: >-
          node -e "const r=require('./rank19-source-adp-opening.json');
          console.log(JSON.stringify({schema:r.schema,
          count:r.counts,engineRevision:r.sourceEngineRevision,
          complete:r.allAttemptsRetained,qualified:false}));"
      - name: Retain complete 160-attempt rank19 source ADP policy records
        if: inputs.rank19_adp_source_opening && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank19-source-adp-opening
          path: rank19-source-adp-opening.json
          if-no-files-found: warn
      - name: Source rank11 autonomous Carmine counterpolicy, fixed-deal pair
        if: inputs.agent34_rank11_autonomous_carmine
        run: node simulation/twinleaf/rank11-autonomous-carmine-source-pair.cjs > rank11-autonomous-carmine-source-pair.json
      - name: Surface prospective and retrospective source policy exposure separately
        if: inputs.agent34_rank11_autonomous_carmine
        run: >-
          node -e "const r=require('./rank11-autonomous-carmine-source-pair.json');
          for(const row of r.rows)console.log(JSON.stringify({seed:row.seed,
          kind:row.kind,firstTurnSlot:row.firstTurnSlot,
          decisions:row.policyDecisions,
          control:row.control,contrast:row.contrast,
          qualified:false}));"
      - name: Archive exact rank11 autonomous Carmine source decision pair
        if: inputs.agent34_rank11_autonomous_carmine && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent34-rank11-autonomous-carmine-source
          path: rank11-autonomous-carmine-source-pair.json
          if-no-files-found: warn
      - name: Test source rank11 turn35 own-hand Carmine action counterfactual
        if: inputs.rank11_terminal_carmine_counterfactual
        run: node simulation/twinleaf/rank11-turn35-carmine-counterfactual.cjs > rank11-terminal-carmine.json
      - name: Retain source rank11 one-action Carmine contrast
        if: inputs.rank11_terminal_carmine_counterfactual && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-terminal-carmine-single-action
          path: rank11-terminal-carmine.json
          if-no-files-found: warn
      - name: Observe source rank11 turn35 own-hand before terminal copied attack
        if: inputs.rank11_lastturn_hand_window
        run: node simulation/twinleaf/rank11-lastturn-hand-window.cjs > rank11-lastturn-hand.json
      - name: Preserve rank11 source own-hand before terminal Poltergeist
        if: inputs.rank11_lastturn_hand_window && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-lastturn-ownhand-positive-control
          path: rank11-lastturn-hand.json
          if-no-files-found: warn
      - name: Source copied attack observation parity
        if: inputs.rank11_copy_observer_parity
        run: node simulation/twinleaf/source-copied-attack-observer-isolation.cjs
      - name: Verify source-dealt rank11 printed copied-attack source and Store declaration
        if: inputs.rank11_delegated_attack_selection_source
        run: node simulation/twinleaf/newmoon-rank11-perfection-delegated-source.cjs > rank11-copied-attack-selection.json
      - name: Surface actual rank11 terminal copied attack identity
        if: inputs.rank11_delegated_attack_selection_source
        run: >-
          node -e "const r=require('./rank11-copied-attack-selection.json');
          console.log(JSON.stringify({seed:r.seed,sourceRank:r.sourceRank,
          copied:r.terminalAttack,source:r.terminalSelectedPrinting,
          root:r.terminalAttackRootAction,attacks:r.attacks,effect:r.terminalPublicEffect,
          usedPrizes:r.finalPrizes,turn:r.finalTurns,qualified:false}));"
      - name: Preserve rank11 selected printing and copied-attack provenance
        if: inputs.rank11_delegated_attack_selection_source && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-copied-attack-selection
          path: rank11-copied-attack-selection.json
          if-no-files-found: warn
      - name: Census authentic rank11 turn23 Crobat Forest Seal Stone counterattack prerequisites
        if: inputs.rank11_crobat_stone_frontier
        run: node simulation/twinleaf/rank11-turn23-crobat-stone-frontier.cjs > rank11-crobat-stone-frontier.json
      - name: Report source-dealt turn23 counterattack prerequisites and blockers
        if: inputs.rank11_crobat_stone_frontier
        run: >-
          node -e "const r=require('./rank11-crobat-stone-frontier.json');
          console.log(JSON.stringify({seed:r.seed,vstarUsed:r.sourceVSTARUsed,
          darkPatchZones:r.ownerDarkPatchZoneCount,discardDarkness:r.ownerDarknessDiscardCount,
          sourcePrizes:r.ownerRemainingPrizes,prerequisites:r.prerequisites,
          possible:r.allPrintedResourcePrerequisitesSeen,qualified:false}));"
      - name: Preserve authentic turn23 physical resource census including negative outcomes
        if: inputs.rank11_crobat_stone_frontier && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-crobat-stone-counterfrontier
          path: rank11-crobat-stone-frontier.json
          if-no-files-found: warn
      - name: Check portable owner-visible Crobat trigger without hidden deck information
        if: inputs.rank11_crobat_owner_positive_control
        run: node --test tests/rank11-crobat-terminal-policy.test.cjs tests/rank11-crobat-terminal-wrapper.test.cjs
      - name: Run historical positive control under actual source Store actions
        if: inputs.rank11_crobat_owner_positive_control
        run: node simulation/twinleaf/rank11-crobat-owner-source-positive-control.cjs > rank11-crobat-portable-policy-positive.json
      - name: Archive portable source-Crobat policy outcome and aborted decisions
        if: inputs.rank11_crobat_owner_positive_control && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-crobat-owner-policy-positive-control
          path: rank11-crobat-portable-policy-positive.json
          if-no-files-found: warn
      - name: Execute retrospective source-owned turn23 Crobat full-action fork
        if: inputs.rank11_crobat_stone_store_fork
        run: node simulation/twinleaf/rank11-turn23-crobat-stone-store-fork.cjs > rank11-crobat-store-fork.json
      - name: Surface real source Crobat counterattack outcomes
        if: inputs.rank11_crobat_stone_store_fork
        run: >-
          node -e "const r=require('./rank11-crobat-store-fork.json');
          console.log(JSON.stringify({seed:r.seed,actions:r.actionSteps.map(x=>x.rootAction),
          attack:r.sourceAttackDeclaration.attackName,
          baseline:r.baseline,counterfactual:r.counterfactual,qualified:false}));"
      - name: Preserve original-source Crobat Store counterfactual and failed attempts
        if: inputs.rank11_crobat_stone_store_fork && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank11-crobat-source-store-attack
          path: rank11-crobat-store-fork.json
          if-no-files-found: warn
      - name: Verify central Store attack ledger on one full source-dealt rank8 game
        if: inputs.rank8_attack_log_full_source
        run: node simulation/twinleaf/source-attack-log-full-match.cjs > rank8-central-attack-ledger.json
      - name: Surface rank8 completed source Store logging summary
        if: inputs.rank8_attack_log_full_source
        run: >-
          node -e "const r=require('./rank8-central-attack-ledger.json');
          console.log(JSON.stringify({seed:r.seed,rank:r.rank,
          printedActionAttacks:r.originalAttackActionTrace.length,
          storeDeclarations:r.centralStoreAttackDeclarations.length,
          turns:r.turns,actions:r.actions,finished:r.finished,
          qualified:false}));"
      - name: Preserve complete source rank8 attack ledger evidence
        if: inputs.rank8_attack_log_full_source && always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-central-attack-ledger
          path: rank8-central-attack-ledger.json
          if-no-files-found: warn
      - name: Verify pure attack-log declaration observer gates
        run: node --test tests/twinleaf-attack-log-declarations.test.cjs
      - name: Verify Poltergeist physical Trainer-count observer invariants
        run: node --test tests/poltergeist-effect-observer.test.cjs
      - name: Verify pinned Perfection delegated copied-GX Store action
        run: node simulation/twinleaf/perfection-delegated-action.cjs
      - name: Verify Gengar Horror House special-Psychic source fidelity diagnostic
        run: node simulation/twinleaf/gengar-horror-house-rainbow-fidelity.cjs
      - name: Verify opt-in paper-Psychic Horror House Store correction and rollback
        run: node simulation/twinleaf/gengar-horror-house-extra-psychic-hook-contract.cjs
      - run: node simulation/twinleaf/temple-wobbuffet-board.cjs
      - run: node simulation/twinleaf/temple-energy-board.cjs
      - run: node simulation/twinleaf/wobbuffet-pivot.cjs
      - run: node simulation/twinleaf/vileplume-double-tm-board.cjs
      - run: node simulation/twinleaf/vileplume-itemlock-action.cjs
      - run: node simulation/twinleaf/chimecho-hand-entry-path-action.cjs
      - run: node simulation/twinleaf/chimecho-bell-attack-action.cjs
      - name: Verify exact rank31 Fog bridge and scoped owner-prompt policy
        run: node --test tests/rank31-fog-energy-direct.test.cjs tests/rank31-fog-energy-prompt-policy.test.cjs tests/rank31-fog-energy-broad.test.cjs tests/rank31-fog-breadth-exact.test.cjs
      - run: node simulation/twinleaf/ranger-lele-itemlock-action.cjs
      - run: node simulation/twinleaf/ranger-stone-itemlock-action.cjs
      - name: Verify Eldegoss RCL Happy Match Bench-entry lock fidelity
        run: node simulation/twinleaf/eldegoss-entry-lock-action.cjs
      - name: Verify Articuno CES Legendary Ascent Bench-entry lock fidelity
        run: node simulation/twinleaf/articuno-entry-lock-action.cjs
      - name: Verify opt-in Eldegoss hook provenance and restoration
        run: node simulation/twinleaf/eldegoss-entry-runner-smoke.cjs
      - name: Verify Articuno and distinct Energy target opt-in hook lifecycle
        run: node simulation/twinleaf/entry-attach-runner-lifecycle.cjs
      - name: Source Herdier on-evolution recovery under Ability locks
        if: inputs.herdier_evolution_lock_probe
        run: node simulation/twinleaf/herdier-treasure-hunt-lock-action.cjs > herdier-evolution-lock.json
      - name: Preserve all six positive and negative Herdier lock scenarios
        if: inputs.herdier_evolution_lock_probe && always()
