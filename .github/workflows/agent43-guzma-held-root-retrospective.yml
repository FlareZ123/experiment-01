name: Agent 43 rank11 held Guzma diagnostic exact frozen replay

on:
  workflow_dispatch:
    inputs:
      rank9_special_guzma_exposure:
        description: 'Read-only source rank9 owner-public Guzma conjunction census on unchanged frozen source deals'
        type: boolean
        required: false
        default: false
      rank9_special_guzma_native:
        description: 'Retrospective exact rank9 original 60 two-seat Guzma full native Store comparison'
        type: boolean
        required: false
        default: false
      rank9_special_guzma_pure:
        description: 'Pure owner-public Special Energy funded Weakness Guzma proposal; skip retrospective replay'
        type: boolean
        required: false
        default: false
      basic_energy_recipient_comparison:
        description: 'Run additional fixed-rank11 both-seat Basic Energy recipient paired development'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  existing-seeds-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine packages
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify owner-only public geometry and frozen replay classifications
        run: node --test tests/agent2-native-owner-supporter-opportunity.test.cjs tests/agent2-guzma-public-geometry.test.cjs tests/agent2-rank11-basic-recipient-matched-development.test.cjs tests/agent2-registered-basic-energy-recipient.test.cjs
      - name: Verify original immutable preregistration before read-only replay
        run: node simulation/evaluation/agent43-guzma-held-root-retrospective.cjs --inspect-only
      - name: Replay 16 PREVIOUSLY USED rank11 source seeds and assert unchanged accepted-root digest
        if: ${{ !inputs.basic_energy_recipient_comparison && !inputs.rank9_special_guzma_pure && !inputs.rank9_special_guzma_native && !inputs.rank9_special_guzma_exposure && !inputs.rank9_special_guzma_native && !inputs.rank9_special_guzma_exposure }}
        env:
          AGENT43_GUZMA_HELD_AUDIT_OUTPUT: ${{ runner.temp }}/agent43-held-root-rank11-retrospective-16.json
        run: node simulation/evaluation/agent43-guzma-held-root-retrospective.cjs
      - name: Preserve complete retrospective observer data, including failures
        if: ${{ always() && !inputs.basic_energy_recipient_comparison && !inputs.rank9_special_guzma_pure && !inputs.rank9_special_guzma_native && !inputs.rank9_special_guzma_exposure && !inputs.rank9_special_guzma_native && !inputs.rank9_special_guzma_exposure }}
        uses: actions/upload-artifact@v4
        with:
          name: agent43-rank11-held-guzma-retrospective-16
          path: ${{ runner.temp }}/agent43-held-root-rank11-retrospective-16.json
          if-no-files-found: warn
      - name: Preflight additional unchanged-source rank11 Basic Energy comparator
        if: ${{ inputs.basic_energy_recipient_comparison && !inputs.rank9_special_guzma_pure && !inputs.rank9_special_guzma_native && !inputs.rank9_special_guzma_exposure && !inputs.rank9_special_guzma_native && !inputs.rank9_special_guzma_exposure }}
        run: node simulation/evaluation/agent2-rank11-basic-recipient-matched-development.cjs --inspect-only
      - name: Compare symmetric Basic Energy recipient frontier on frozen 16 rank11 source-dealt arms
        if: ${{ inputs.basic_energy_recipient_comparison }}
        env:
          AGENT2_RANK11_BASIC_RECIPIENT_OUTPUT: ${{ runner.temp }}/agent2-rank11-basic-recipient-existing16-development.json
        run: node simulation/evaluation/agent2-rank11-basic-recipient-matched-development.cjs
      - name: Preserve exact paired native action, prompt and outcome raw receipts
        if: ${{ always() && inputs.basic_energy_recipient_comparison }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-rank11-basic-energy-recipient-original16-matched
          path: ${{ runner.temp }}/agent2-rank11-basic-recipient-existing16-development.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify default-off rank9 publicly funded Weakness Guzma proposal
        if: ${{ inputs.rank9_special_guzma_pure }}
        run: node --test tests/agent2-rank9-special-guzma-frontier.test.cjs
      - name: Preflight exact original rank9 special-funded Guzma retrospective profile
        if: ${{ inputs.rank9_special_guzma_native }}
        run: node simulation/evaluation/agent2-rank9-special-guzma-retro-native.cjs --inspect-only > agent2-rank9-guzma-profile-inspect.json
      - name: Verify owner-only Special Energy Guzma and explicit root opt-in tests
        if: ${{ inputs.rank9_special_guzma_native }}
        run: node --test tests/agent2-rank9-special-guzma-frontier.test.cjs
      - name: Replay all four original rank9 physical groups under both symmetric policies
        if: ${{ inputs.rank9_special_guzma_native }}
        env:
          AICHI_RANK9_SPECIAL_GUZMA_OUTPUT: ${{ runner.temp }}/agent2-rank9-guzma-retro-native.json
        run: node simulation/evaluation/agent2-rank9-special-guzma-retro-native.cjs
      - name: Preserve complete native rank9 original-source actions, rejections and physical deals
        if: ${{ always() && inputs.rank9_special_guzma_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-rank9-special-funded-guzma-native-retrospective
          path: |
            agent2-rank9-guzma-profile-inspect.json
            ${{ runner.temp }}/agent2-rank9-guzma-retro-native.json
          if-no-files-found: warn
          retention-days: 21
      - name: Validate Special Energy Guzma exposure classifier against detached owner-only states
        if: ${{ inputs.rank9_special_guzma_exposure }}
        run: node --test tests/agent2-rank9-special-guzma-frontier.test.cjs
      - name: Run read-only exact source rank9 Guzma opportunity census across original native roots
        if: ${{ inputs.rank9_special_guzma_exposure }}
        env:
          AICHI_RANK9_GUZMA_EXPOSURE_OUTPUT: ${{ runner.temp }}/agent2-rank9-guzma-owner-public-exposure.json
        run: node simulation/evaluation/agent2-rank9-guzma-exposure-native.cjs
      - name: Preserve all accepted original-source owner-public exposure receipts
        if: ${{ always() && inputs.rank9_special_guzma_exposure }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-rank9-guzma-owner-public-exposure
          path: ${{ runner.temp }}/agent2-rank9-guzma-owner-public-exposure.json
          if-no-files-found: warn
          retention-days: 21
