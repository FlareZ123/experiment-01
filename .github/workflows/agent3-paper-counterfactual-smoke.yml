name: Agent 3 paper counterfactual smoke

on:
  workflow_dispatch:
    inputs:
      rank26_paper_one_lightning_native:
        description: 'Preregistered 24 new original source deals, old two-Lightning versus paper one-Lightning two-Egg'
        required: false
        type: boolean
        default: false
      source_marginal_setup_native:
        description: 'Registered 48 source physical setup groups, A/B/A, no games'
        required: false
        type: boolean
        default: false
      rank26_full_v3_native:
        description: 'Full 24-deal retrospective source rank26 broad-versus-live Store observer contrast'
        required: false
        type: boolean
        default: false
      rank26_root_v3_native:
        description: 'Recheck 6 archived original-source rank26 native root receipts, manual only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !inputs.rank26_root_v3_native && !inputs.rank26_full_v3_native && !inputs.rank26_paper_one_lightning_native && !inputs.source_marginal_setup_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regress paper-source setups and exact combinatorial denominators
        run: |
          node --test \
            tests/agent3-jellicent-silent-lab-openers.test.cjs \
            tests/agent3-jellicent-thorns-mulligan-access.test.cjs \
            tests/agent3-thorns-silent-lab-stadium-reply.test.cjs \
            tests/agent3-jellicent-double-shield-access.test.cjs \
            tests/agent3-jellicent-secret-box-shield-access.test.cjs \
            tests/agent3-secretbox-cost-pareto.test.cjs \
            tests/agent3-absol-source-prelock-dark-energy.test.cjs \
            tests/agent3-meloetta-lone-basic-mulligan-risk.test.cjs \
            tests/agent3-jellicent-guzma-setup-counter.test.cjs \
            tests/agent3-rank26-duallock-print-census.test.cjs \
            tests/agent3-rank26-cologne-pre-donk-access.test.cjs \
            tests/agent3-rank26-paper-donk-witness.test.cjs \
            tests/agent3-rank26-singleton-prize-gates.test.cjs \
            tests/agent3-rank26-donk-prize-witness-upper.test.cjs \
            tests/agent3-rank26-dowsing-pump-branches.test.cjs \
            tests/agent3-rank26-alternative-basic-starter.test.cjs \
            tests/agent3-compressor-root-provenance-v3.test.cjs \
            tests/agent3-observed-policy-closure.test.cjs \
            tests/aichi-open-adjudication.test.cjs \
            tests/agent3-rank26-one-lightning-two-egg-chooser.test.cjs \
            tests/agent3-marginal-coupled-field-delta.test.cjs \
            tests/agent3-attested-marginal-field-delta.test.cjs \
            tests/agent3-coupled-opening-input-order.test.cjs \
            tests/agent3-native-first-mulligan-reconstruction.test.cjs \
            tests/agent3-source-bonus-coupled-mulligan-model.test.cjs \
            tests/agent38-candidate-printing-audit.test.cjs \
            tests/agent38-original-field-tool-visibility.test.cjs \
            tests/agent3-original-source-basic-mulligan-census.test.cjs \
            tests/agent3-source-bonus-field-32-bound.test.cjs \
            tests/agent3-original29-print-gap-census.test.cjs \
            tests/agent3-registered-attempt-reconciliation.test.cjs

  rank26-root-v3-native:
    if: ${{ inputs.rank26_root_v3_native || inputs.rank26_full_v3_native || inputs.rank26_paper_one_lightning_native || inputs.source_marginal_setup_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf packages
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf game
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test real-root-only receipts and one-Lightning source choice
        run: node --test tests/agent3-compressor-root-provenance-v3.test.cjs tests/agent3-rank26-one-lightning-two-egg-chooser.test.cjs
      - name: Reproduce 48 precommitted new source setup A/B/A physical contexts
        if: ${{ inputs.source_marginal_setup_native }}
        run: |
          node --check simulation/evaluation/agent3-source-setup-audit.cjs
          node simulation/evaluation/agent3-source-setup-audit.cjs
      - name: Archive all 144 setup-only native attempts including errors and repeated controls
        if: ${{ always() && inputs.source_marginal_setup_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent3-48-source-marginal-setup-aba-native
          path: agent3-source-setup-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Replay three previously observed source-first deals with both historical policy arms
        if: ${{ inputs.rank26_root_v3_native }}
        run: node simulation/twinleaf/agent3-rank26-root-provenance-v3-selected.cjs
      - name: Deliberately abort one real source prompt after physical settlement and audit retained custody
        if: ${{ inputs.rank26_root_v3_native }}
        run: |
          node --check simulation/twinleaf/agent3-rank26-native-abort-custody-witness.cjs
          node simulation/twinleaf/agent3-rank26-native-abort-custody-witness.cjs
      - name: Archive original-source deliberate native failure receipts
        if: ${{ always() && inputs.rank26_root_v3_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-native-deliberate-abort-custody
          path: agent3-rank26-native-deliberate-abort-custody.json
          if-no-files-found: warn
          retention-days: 14
      - name: Print bounded original native root, payment and speculative clone lineage summary
        if: ${{ inputs.rank26_root_v3_native }}
        run: |
          node -e "const a=require('node:assert/strict');const r=require('./agent3-rank26-root-provenance-v3.json');a.equal(r.summary.total,6);a.equal(r.summary.identicalRoots,6);for(const c of r.cases)console.log('SOURCE_ROOT_V3',JSON.stringify({repeat:c.repeat,slot:c.slot,seat:c.seat,arm:c.arm,rootMatch:c.expected===c.actual,error:c.error,sourceFirst:c.sourceFirst,acceptedFirstTurnCardPlays:c.sourceActions.filter(x=>x.action==='PlayCardAction').map(x=>x.card),realCompressorPlays:c.actualFirstTurnCompressorPlays,selectedRootCompressor:c.receiptAudit?.selectedSourcePlays,acceptedRootCompressor:c.receiptAudit?.acceptedSourcePlays,linkedPrompts:c.receiptAudit?.linkedPromptsIssued,positiveSettlements:c.receiptAudit?.positiveLinkedSettlements,speculativeDispatches:c.receiptAudit?.ignoredSpeculativeDispatches,receipts:c.receiptAudit?.receipts.map(y=>({turn:y.globalTurn,minimumMet:y.paperMinimumMet,card:y.sourceCard?.id,moved:y.physicallyMoved.map(z=>({id:z.id,name:z.name}))}))}));"
      - name: Archive all six root receipts, including negative and errored attempts
        if: ${{ always() && inputs.rank26_root_v3_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-original-source-root-receipts-v3
          path: agent3-rank26-root-provenance-v3.json
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm syntax of full retrospective root-bound source replay
        if: ${{ inputs.rank26_full_v3_native }}
        run: node --check simulation/twinleaf/agent3-rank26-compressor-v3-full-retrospective.cjs
      - name: Reproduce all 24 original physical source deals with both historical policies and both independent observers
        if: ${{ inputs.rank26_full_v3_native }}
        run: node simulation/twinleaf/agent3-rank26-compressor-v3-full-retrospective.cjs
      - name: Report old clone-inclusive receipts versus live-root settlements on identical source deals
        if: ${{ inputs.rank26_full_v3_native }}
        run: |
          node -e "const a=require('node:assert/strict');const r=require('./agent3-rank26-compressor-v3-full-retrospective.json');a.equal(r.summary.sourceDeals,24);a.equal(r.summary.nativeAttempts,48);console.log('RANK26_NATIVE_FULL_REPLAY_SUMMARY',JSON.stringify(r.summary));for(const c of r.deals.filter(x=>x.arms.every(y=>y.sourceFirst)))console.log('RANK26_FIRST_SOURCE_DEAL',JSON.stringify({repeat:c.repeat,seat:c.seat,slot:c.slot,paired:c.physicalPair,arms:c.arms.map(y=>({policy:y.arm,firstTurnRealPlays:y.originalSourceFirstTurnBattleCompressorPlays,oldObserverPositives:y.oldSpeculativeObserver.positiveResolutions,liveRootPositives:y.actualStoreV3.positiveSettlements,simulatedDispatchesIgnored:y.actualStoreV3.simulatedDispatchesIgnored,actualRealMoves:y.actualStoreV3.receipts.map(q=>q.moved.map(z=>z.name))}))}));"
      - name: Archive every original rank26 source-deal attempt and both observers
        if: ${{ always() && inputs.rank26_full_v3_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-full-original-source-root-v3
          path: agent3-rank26-compressor-v3-full-retrospective.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reproduce preregistered new rank26 source one-Lightning two-Egg paired native trials
        if: ${{ inputs.rank26_paper_one_lightning_native }}
        run: |
          node --check simulation/twinleaf/agent3-rank26-paper-koko-one-lightning-native.cjs
          node simulation/twinleaf/agent3-rank26-paper-koko-one-lightning-native.cjs
      - name: Report complete preregistered source-one-Lightning audit including negative results
        if: ${{ inputs.rank26_paper_one_lightning_native }}
        run: |
          node -e "const a=require('node:assert/strict');const r=require('./agent3-rank26-paper-koko-one-lightning-native.json');a.equal(r.summary.originalSourcePhysicalDeals,24);a.equal(r.summary.nativeAttempts,48);console.log('PAPER_KOKO_NATIVE',JSON.stringify(r.summary));for(const d of r.deals.filter(x=>x.arms.every(y=>y.sourceFirst)))console.log('PAPER_KOKO_DEAL',JSON.stringify({repeat:d.repeat,slot:d.slot,seat:d.seat,pair:d.physicalPair,arms:d.arms.map(x=>({variant:x.variant,firstTurnCompressor:x.firstTurnCompressorPlayCards,firstTurnLiveEggs:x.distinctMovedExeggcuteIds.length,firstTurnLiveLightning:x.distinctMovedLightningIds.length,fullPackage:x.paperOneLightningTwoEggsDiscarded,koko:x.firstTurnKokoAbilities,crisis:x.firstTurnCrisisPunch,error:x.error}))}));"
      - name: Archive all new original source attempt receipts, including negative and errors
        if: ${{ always() && inputs.rank26_paper_one_lightning_native }}
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-paper-one-lightning-two-egg-original24
          path: agent3-rank26-paper-koko-one-lightning-native.json
          if-no-files-found: warn
          retention-days: 14
