name: Agent7 preregistered rank30 Psychic recipient native cohort

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-rank30:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
      AGENT41_PAPER_SUPPORTER_DEV: 'true'
      AGENT41_MANDATORY_OPTION_DEV: 'true'
      AGENT41_NATIVE_PRESSURE_DEV: 'true'
      AGENT12_NATIVE_TARGET_SIDECAR_DEV: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manual-only workflow and exact frozen registration
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python scripts/workflow_dispatch_preflight.py
          node --test tests/agent7-rank30-psychic-prospective.test.cjs tests/agent7-rondo-psychic-bench-stage.test.cjs
      - name: Check out actual pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run every fresh registered rank30 original source seat and candidate both-mode game
        run: node simulation/evaluation/agent7-rank30-psychic-prospective.cjs > agent7-rank30-psychic-prospective.json
      - name: Preserve all 16 exact pairs, source decisions, targets and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent7-rank30-psychic-prospective-original-store
          path: agent7-rank30-psychic-prospective.json
          if-no-files-found: warn
          retention-days: 10
