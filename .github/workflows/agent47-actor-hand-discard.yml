name: Actor-only mandatory hand-discard regression
on:
  workflow_dispatch:
    inputs:
      native_apex_store:
        description: Opt in bounded original rank20 staged native Store physical Ultra Ball discard fork
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-hand-discard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure and original-Store adapter injection tests
        run: node --test tests/agent47-actor-hand-discard.test.cjs tests/agent47-actor-hand-discard-negative.test.cjs tests/agent47-canonical-hand-discard-integration.test.cjs tests/agent47-hand-subset-ultraball.test.cjs tests/agent7-native-fallback-paircheck.test.cjs tests/agent47-apex-discard-frontier.test.cjs tests/agent47-apex-discard-adapter.test.cjs
      - name: Fetch exact pinned Twinleaf for opt-in source native verification
        if: ${{ inputs.native_apex_store }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install and compile pinned native Store
        if: ${{ inputs.native_apex_store }}
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Native original rank20 physical Ultra Ball baseline, alternative, and hold for both seats
        if: ${{ inputs.native_apex_store }}
        run: node simulation/twinleaf/agent47-apex-ultraball-original-store.cjs > agent47-apex-source20-native.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.native_apex_store }}
        with:
          name: agent47-apex-source20-staged-native
          path: agent47-apex-source20-native.json
          if-no-files-found: warn
          retention-days: 14
