name: Actor-only mandatory hand-discard regression
on:
  workflow_dispatch:
    inputs:
      native_apex_store:
        description: Opt in bounded original rank20 staged native Store physical Ultra Ball discard fork
        required: false
        type: boolean
        default: false
      physical_zone_natural:
        description: Diagnostic original rank20 24 source-deal settled physical-zone audit, no competitive inference
        required: false
        type: boolean
        default: false
      celestial_special_native:
        description: Staged original source20 Celestial Roar Double Dragon Special Energy paper mismatch both seats
        required: false
        type: boolean
        default: false
      minimum_attach_replay:
        description: Post-hoc same-registered-source 24-pair replay of mandatory two/three Energy prompt repair
        required: false
        type: boolean
        default: false
      natural_source20_audit:
        description: Small fixed-seed both-seat rank20 native owner discard opportunity audit against original rank1 and rank11
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-hand-discard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate natural source physical audit module syntax
        run: node --check simulation/twinleaf/agent47-source20-physical-ledger-24-native.cjs
      - name: Pure and original-Store adapter injection tests
        run: node --test tests/agent47-actor-hand-discard.test.cjs tests/agent47-actor-hand-discard-negative.test.cjs tests/agent47-canonical-hand-discard-integration.test.cjs tests/agent47-hand-subset-ultraball.test.cjs tests/agent7-native-fallback-paircheck.test.cjs tests/agent47-apex-discard-frontier.test.cjs tests/agent47-apex-discard-adapter.test.cjs tests/agent47-rank20-first-eight-co-visibility.test.cjs tests/agent47-rank20-apex-natural-audit.test.cjs tests/agent47-minimum-attach-energy-hook.test.cjs tests/physical-card-ledger.test.cjs
      - name: Fetch exact pinned Twinleaf for opt-in source native verification
        if: ${{ inputs.native_apex_store || inputs.natural_source20_audit || inputs.minimum_attach_replay || inputs.celestial_special_native || inputs.physical_zone_natural }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install and compile pinned native Store
        if: ${{ inputs.native_apex_store || inputs.natural_source20_audit || inputs.minimum_attach_replay || inputs.celestial_special_native || inputs.physical_zone_natural }}
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Native original rank20 physical Ultra Ball baseline, alternative, and hold for both seats
        if: ${{ inputs.native_apex_store }}
        run: node simulation/twinleaf/agent47-apex-ultraball-original-store.cjs > agent47-apex-source20-native.json
      - name: Native source rank20 Ultra Ball search to Apex copied-attack settlement, both seats
        if: ${{ inputs.native_apex_store }}
        run: node simulation/twinleaf/agent47-apex-ultraball-followthrough-original-store.cjs > agent47-apex-source20-followthrough-native.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.native_apex_store }}
        with:
          name: agent47-apex-source20-staged-native
          path: |
            agent47-apex-source20-native.json
            agent47-apex-source20-followthrough-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Native natural 24-game original-source physical-zone settled-root audit
        if: ${{ inputs.physical_zone_natural }}
        run: node simulation/twinleaf/agent47-source20-physical-ledger-24-native.cjs > agent47-source20-physical-ledger.json
      - name: Print physical-zone fail-closed execution and settled-root census
        if: ${{ inputs.physical_zone_natural }}
        run: node -e "const r=require('./agent47-source20-physical-ledger.json');console.log('AGENT47_PHYSICAL_60_SETTLED_ROOTS',JSON.stringify({counts:r.counts,anomalous:r.rows.filter(x=>x.result.physicalZoneIntegrity?.settledRootsWithAnomaly>0).map(x=>({trial:x.trial.id,first:x.result.physicalZoneIntegrity.firstSettledRootAnomaly}))}));"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.physical_zone_natural }}
        with:
          name: agent47-source20-natural-physical-60
          path: agent47-source20-physical-ledger.json
          if-no-files-found: warn
          retention-days: 14
      - name: Source-print Regidrago V Special Energy Celestial Roar discrepancy, both seats
        if: ${{ inputs.celestial_special_native }}
        run: node simulation/twinleaf/agent47-celestial-roar-double-dragon-pinned-native.cjs > agent47-celestial-roar-native.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.celestial_special_native }}
        with:
          name: agent47-celestial-roar-special-native
          path: agent47-celestial-roar-native.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retrospective native 24-pair two-seat minimum Energy assignment replay
        if: ${{ inputs.minimum_attach_replay }}
        run: node simulation/twinleaf/agent47-rank20-minrepair-replay.cjs > agent47-rank20-minrepair.json
      - name: Print minimum-repair replay abort and physical opportunity counts
        if: ${{ inputs.minimum_attach_replay }}
        run: node -e "const r=require('./agent47-rank20-minrepair.json');console.log('AGENT47_MANDATORY_ATTACH_REPLAY',JSON.stringify({counts:r.counts,remedy:r.remedy,aborts:r.rows.filter(x=>x.control.status==='native-aborted'||x.treatment.status==='native-aborted').map(x=>x.trial.id)}));"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.minimum_attach_replay }}
        with:
          name: agent47-rank20-mandatory-attach-replay
          path: agent47-rank20-minrepair.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preregistered 24 original-source both-seat rank20 paired Store roots, no competitive inference
        if: ${{ inputs.natural_source20_audit }}
        run: node simulation/twinleaf/agent47-rank20-apex-natural-audit.cjs > agent47-rank20-natural-census.json
      - name: Print bounded actual Store opportunity and abort census
        if: ${{ inputs.natural_source20_audit }}
        run: |
          node -e "const r=require('./agent47-rank20-natural-census.json');const counts=r.counts;const representativeAborts=r.rows.filter(x=>x.control.status==='native-aborted'||x.treatment.status==='native-aborted').slice(0,4).map(x=>({trial:x.trial.id,control:x.control.error?.slice(0,160),treatment:x.treatment.error?.slice(0,160)}));const offers=r.rows.filter(x=>x.treatment.policy?.apexAlternativeProposals>0).map(x=>({trial:x.trial.id,selected:x.treatment.policy.apexSelected,sourceDealMatched:x.pairedSourceDeal}));console.log('AGENT47_ORIGINAL_SOURCE20_OPPORTUNITY_CENSUS',JSON.stringify({counts,offers,representativeAborts}));"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.natural_source20_audit }}
        with:
          name: agent47-source20-original-native-natural-census
          path: agent47-rank20-natural-census.json
          if-no-files-found: warn
          retention-days: 14
