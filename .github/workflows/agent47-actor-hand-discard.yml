name: Actor-only mandatory hand-discard regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-hand-discard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure and original-Store adapter injection tests
        run: node --test tests/agent47-actor-hand-discard.test.cjs tests/agent47-actor-hand-discard-negative.test.cjs
