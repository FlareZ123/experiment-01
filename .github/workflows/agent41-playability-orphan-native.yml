name: Agent41 exact-rank7 native protected Trainer target repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out fixed research repository
        uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify actor-only Store protected-target settlement both seats
        run: node --test tests/agent8-actor-only-choose-pokemon.test.cjs
      - name: Install exact native Store dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay exact rank7 original physical deals with corrected protected-target settlement
        run: node simulation/evaluation/2026-11/agent41-rank7-guzma-native-target-filter-repair.cjs
