name: Agent10 Stunfisk Snap Trap prompt marker pure tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap-trap-prompt-marker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Run read-only Snap Trap marker contract tests
        run: node --test tests/2026-11/agent10-stunfisk-snap-trap-prompt-marker.test.cjs
      - name: Syntax check Agent30 same-object marker
        run: node --check simulation/twinleaf/agent30/stunfisk-snap-trap-prompt-marker-v2.cjs
      - name: Run Agent30 same-object marker tests
        run: node --test tests/2026-11/agent30-stunfisk-snap-trap-prompt-marker-v2.test.cjs
      - name: Syntax check Agent30 v7 public prompt observer
        run: node --check simulation/twinleaf/agent30/issue25-public-prompt-zone-audit-v7.cjs
      - name: Run Agent30 v7 public prompt observer tests
        run: node --test tests/2026-11/agent30-issue25-public-prompt-zone-audit-v7.test.cjs
      - name: Run Agent30 v2 Snap Trap energy-choice public fixtures
        run: node --test tests/2026-11/agent30-snap-trap-energy-choice-v2.test.cjs
