name: Twinleaf Regidrago real decision audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Audit real rank-10 Regidrago bot turns in four games
        run: node simulation/twinleaf/regidrago-fullgame-diagnostic.cjs
      - name: Test owner-visible Dragon cost policy and registered seed schedule
        run: node --test tests/regidrago-ball-dragon-cost-policy.test.cjs tests/regidrago-ball-dragon-cost-registered-panel.test.cjs
      - name: Replay full registered source-policy diagnostic
        run: node simulation/twinleaf/regidrago-ball-dragon-cost-registered-panel.cjs > agent20-dragon-cost-panel.json
      - name: Archive complete failure-inclusive source-discard panel
        uses: actions/upload-artifact@v4
        with:
          name: agent20-regidrago-ball-dragon-source-panel
          path: agent20-dragon-cost-panel.json
          retention-days: 90
