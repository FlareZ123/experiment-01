name: Agent17 payable rank3 Articuno native Store continuation

on:
  push:
    branches:
      - agent17/rank3-articuno-payable-root-20261128
    paths:
      - '.github/workflows/agent17-rank3-articuno-v3-native.yml'
      - 'simulation/evaluation/2026-11/agent36-prompt-projection.cjs'
      - 'simulation/evaluation/2026-11/agent49-policy-protocol.cjs'
      - 'simulation/evaluation/2026-11/agent17-rank3-snorlax-stall-opponent-policy.cjs'
      - 'tests/2026-11/agent17-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent17-articuno-payable-root-native
  cancel-in-progress: false

jobs:
  one-pinned-articuno-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exactly pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile exact pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Check source-level strict V3 transfer and existing rank3 tactical regressions
        run: |
          node --test \
            tests/2026-11/agent17-rank3-articuno-payable-root.test.cjs \
            tests/2026-11/agent17-rank3-articuno-move-energy-v3.test.cjs \
            tests/2026-11/agent17-rank3-lockbridge-trap-development.test.cjs \
            tests/2026-11/agent17-rank3-eri-arven-tool-contract.test.cjs \
            tests/2026-11/agent32-rank3-penny-continuation-policy.test.cjs \
            tests/2026-11/agent17-rank3-dialga-trap-v3-decision-chain.test.cjs
      - name: Verify pinned physical Store confirm-to-transfer-to-Cold-Crush both seats
        run: node --test tests/2026-11/agent17-articuno-v3-actual-store.native.test.cjs
