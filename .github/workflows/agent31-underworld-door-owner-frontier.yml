name: Agent31 pure owner-only Underworld Door root and marker contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'simulation/twinleaf/hood-ability-lock-state.cjs'
      - 'simulation/twinleaf/hood-garbotoxin-recovery-autonomy.cjs'
      - 'simulation/twinleaf/hood-aware-arven-resolver.cjs'
      - 'simulation/twinleaf/hood-aware-attach-tool-tactic.cjs'
      - 'simulation/twinleaf/hood-candidate-bot-options.cjs'
      - 'tests/2026-11/agent41-hood-ability-lock-state.test.cjs'
      - 'tests/2026-11/agent41-hood-garbotoxin-recovery-autonomy.test.cjs'
      - 'tests/2026-11/agent3-hooded-bench-garbotoxin-tooljammer.native.test.cjs'
      - 'simulation/twinleaf/underworld-door-action.cjs'
      - 'tests/2026-11/agent41-hood-candidate-bot-options.test.cjs'
      - '.github/workflows/agent31-underworld-door-owner-frontier.yml'

permissions:
  contents: read

jobs:
  pure-owner-source-ability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original Agent31 Underworld Door tests on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: node --test tests/agent31-underworld-door-owner-frontier.test.cjs tests/agent31-underworld-door-native-preconditions.test.cjs tests/agent31-rank1-underworld-preconditions-replay.test.cjs
      - name: Run Hood/Garbotoxin recovery pure contracts on pull requests
        if: github.event_name == 'pull_request'
        run: |
          node --check simulation/twinleaf/hood-ability-lock-state.cjs
          node --check simulation/twinleaf/hood-garbotoxin-recovery-autonomy.cjs
          node --check simulation/twinleaf/hood-aware-arven-resolver.cjs
          node --check simulation/twinleaf/hood-aware-attach-tool-tactic.cjs
          node --check simulation/twinleaf/hood-candidate-bot-options.cjs
          node --test tests/2026-11/agent41-hood-ability-lock-state.test.cjs tests/2026-11/agent41-hood-garbotoxin-recovery-autonomy.test.cjs tests/2026-11/agent41-hood-candidate-bot-options.test.cjs


  native-bench-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize the pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile the pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Verify Benched Hood under live Garbotoxin plus opponent Active Tool Jammer
        run: node --test tests/2026-11/agent3-hooded-bench-garbotoxin-tooljammer.native.test.cjs
