name: Aichi Damage Pump source fidelity

on:
  workflow_dispatch:
    inputs:
      rank26_autonomous_cologne:
        description: 'Run ranked Meloetta bot-selected Cologne source deal, unqualified'
        type: boolean
        required: false
        default: false
      source_rank26_opening:
        description: 'Probe one source-dealt first-turn Meloetta response window'
        type: boolean
        required: false
        default: false
      rank26_mail_probe:
        description: 'Compare authentic source firstturn Item scout with frozen v3 bot'
        type: boolean
        required: false
        default: false
      rank26_dce_probe:
        description: 'Compare firstturn Meloetta Lightning and DCE reservation policies'
        type: boolean
        required: false
        default: false
      rank26_ticket_prize_probe:
        description: 'Verify rank26 source DCE Prize transfer with actual Redeemable Ticket'
        type: boolean
        required: false
        default: false
      rank26_prospective_cohort:
        description: 'Audit 24 unbiased matched rank26 firstturn engine deals, unqualified'
        type: boolean
        required: false
        default: false
      rank26_propagation_pair:
        description: 'Compare two autonomous rank26 profiles on fixed authentic first-turn deal'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  damage-pump-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Audit exact rank26 Dedenne source printing and resolver ID
        run: node scripts/aichi-rank26-source-id-audit.cjs > rank26-dedenne-source-id.json
      - name: Verify pinned Damage Pump counterexample and reversible fix
        run: node --test tests/damage_pump_source_contract.test.cjs tests/damage_pump_store_dispatch.test.cjs tests/damage_pump_corrected_match.test.cjs tests/meloetta_damage_pump_two_prizes.test.cjs tests/meloetta_source_60_headless.test.cjs tests/meloetta_first_turn_ability_lock.test.cjs tests/meloetta_forest_seal_cologne_bridge.test.cjs
      - name: Rank26 autonomous Item eligibility and hidden-information guard
        run: node --test tests/rank26-autonomous-cologne.test.cjs
      - name: Verify pinned source-rank26 bot chooses its held Cologne
        if: ${{ inputs.rank26_autonomous_cologne }}
        run: node simulation/twinleaf/rank26-cologne-autonomous-source-regression.cjs > rank26-autonomous-cologne.json
      - name: Compare identical printed rank26 source seed under both bot profiles
        if: ${{ inputs.rank26_autonomous_cologne }}
        run: node simulation/twinleaf/rank26-cologne-autonomous-counterfactual.cjs > rank26-cologne-decision-counterfactual.json
      - name: Print concise paired source first-turn choices
        if: ${{ inputs.rank26_autonomous_cologne }}
        run: node -e "const x=require('./rank26-cologne-decision-counterfactual.json');console.log(JSON.stringify({seed:x.seed,baseline:x.baseline.firstTurnDecisions.slice(0,8),automatic:x.automatic.firstTurnDecisions.slice(0,8),firstTurnCologneBaseline:x.baseline.firstTurnCologneUse,firstTurnCologneAutomatic:x.automatic.firstTurnCologneUse,different:x.strictlyDifferentDecision},null,2))"
      - name: Archive paired first-turn source decision counterfactual
        if: ${{ inputs.rank26_autonomous_cologne }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-cologne-autonomous-paired-unqualified
          path: rank26-cologne-decision-counterfactual.json
          if-no-files-found: error
      - name: Archive rank26 automatic source decision
        if: ${{ inputs.rank26_autonomous_cologne }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-autonomous-cologne-unqualified
          path: rank26-autonomous-cologne.json
          if-no-files-found: error
      - name: Verify rank26 two-Egg Damage Pump source-bound decision planner
        run: node --test tests/rank26-exeggcute-pump-policy.test.cjs
      - name: Validate source-conserved two-Egg and fifth-KO Pump actions in both seats
        run: node simulation/twinleaf/rank26-pump-source-conserved-fixture.cjs > rank26-pump-autonomous-source-conditioned.json
      - name: Archive source-card-conserved Pump and Prize cap diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rank26-pump-autonomous-source-conditioned
          path: rank26-pump-autonomous-source-conditioned.json
          if-no-files-found: error
      - name: Test printed Exeggcute Propagation recovery choices
        run: node --test tests/rank26-propagation-loop.test.cjs tests/rank26-mail-recovery.test.cjs tests/rank26-dce-reservation.test.cjs tests/rank26-farewell-source-draw.test.cjs
      - name: Attempt source-card-conserved autonomous 2+2+1 Propagation and Pump sequence
        run: node simulation/twinleaf/rank26-propagation-source-fixture.cjs > rank26-autonomous-propagation-2plus2plus1.json
      - name: Archive staged Propagation and Pump decisions and effects
        uses: actions/upload-artifact@v4
        with:
          name: rank26-propagation-2plus2plus1-staged-unqualified
          path: rank26-autonomous-propagation-2plus2plus1.json
          if-no-files-found: error
      - name: Compare authentic source-dealt rank26 v2 versus v3 first decisions
        if: ${{ inputs.rank26_propagation_pair }}
        run: node simulation/twinleaf/rank26-propagation-source-root-pair.cjs > rank26-propagation-source-root-pair.json
      - name: Print bounded authentic rank26 action and policy summary
        if: ${{ inputs.rank26_propagation_pair }}
        run: node -e "const x=require('./rank26-propagation-source-root-pair.json');console.log(JSON.stringify({seed:x.seed,sourceFirst:x.startingOrderDrawLogVerified,v2:{pump:x.v2.rank26PumpPolicy?.actions.length,cologne:x.v2.rank26ColognePolicy?.actions,sourceMoves:x.v2.sourceFirstActions.slice(0,12)},v3:{pump:x.v3.rank26PumpPolicy?.actions.length,propagation:x.v3.rank26PropagationPolicy?.actions,cologne:x.v3.rank26ColognePolicy?.actions,sourceMoves:x.v3.sourceFirstActions.slice(0,12)},sameFirstTurn:x.firstTurnDecisionsEqual,qualified:x.competitiveGameQualified},null,2))"
      - name: Archive authentic rank26 first-turn action comparison
        if: ${{ inputs.rank26_propagation_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-source-v2-v3-authentic-deal-unqualified
          path: rank26-propagation-source-root-pair.json
          if-no-files-found: error
      - name: Compare authentic first-turn Mail selection to unchanged source v3
        if: ${{ inputs.rank26_mail_probe }}
        run: node simulation/twinleaf/rank26-mail-source-probe.cjs > rank26-mail-source-probe.json
      - name: Print source root Mail decision and actual Store Item count
        if: ${{ inputs.rank26_mail_probe }}
        run: node -e "const x=require('./rank26-mail-source-probe.json');console.log(JSON.stringify({seed:x.seed,selected:x.mailAudit.selections.length,baselineMail:x.baseline.mail,candidateMail:x.candidate.mail,baselineFirstTurn:x.baseline.first.map(a=>a.card||a.action),candidateFirstTurn:x.candidate.first.map(a=>a.card||a.action),qualified:x.qualifiedForCompetitiveInference},null,2))"
      - name: Archive authenticated Mail root decision diagnostic
        if: ${{ inputs.rank26_mail_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-mail-scout-source-unqualified
          path: rank26-mail-source-probe.json
          if-no-files-found: error
      - name: Execute authentic rank26 DCE policy comparison
        if: ${{ inputs.rank26_dce_probe }}
        run: node simulation/twinleaf/rank26-dce-authentic-source-probe.cjs > rank26-dce-source-probe.json
      - name: Archive source firstturn DCE decisions and observed limitations
        if: ${{ inputs.rank26_dce_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-dce-source-probe-unqualified
          path: rank26-dce-source-probe.json
          if-no-files-found: error
      - name: Audit preregistered 24 paired source deals and source-first opportunities
        if: ${{ inputs.rank26_prospective_cohort }}
        run: node simulation/twinleaf/rank26-prospective-firstturn-cohort.cjs > rank26-prospective-firstturn-cohort.json
      - name: Archive all 24 preregistered source deals and 48 bot traces
        if: ${{ inputs.rank26_prospective_cohort }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-prospective-firstturn-policy-cohort-unqualified
          path: rank26-prospective-firstturn-cohort.json
          if-no-files-found: error
      - name: Verify pure root-state labels
        run: node --test tests/meloetta-rank26-firstturn-source-window.test.cjs
      - name: Search authenticated rank-26 first-turn source window (unqualified)
        if: ${{ inputs.source_rank26_opening }}
        run: node simulation/twinleaf/meloetta-rank26-firstturn-source-window.cjs > rank26-firstturn-source-window.json
      - name: Summarize authenticated root deal without promoting performance
        if: ${{ inputs.source_rank26_opening }}
        run: node -e "const x=require('./rank26-firstturn-source-window.json'); console.log(JSON.stringify({examined:x.examined,attackerFirst:x.attackerFirst,activeMeloetta:x.activeMeloetta,selected:x.selected,firstEligible:x.firstEligible?.seed,firstPad:x.firstPad?.seed,firstDirect:x.firstDirect?.seed,competitiveGameQualified:x.competitiveGameQualified},null,2))"
      - name: Replay legal held Cologne from the authenticated first-turn root
        if: ${{ inputs.source_rank26_opening }}
        run: node simulation/twinleaf/meloetta-rank26-source-cologne-action.cjs > rank26-firstturn-cologne-action.json
      - name: Print source Item action and actual Ability visibility transition
        if: ${{ inputs.source_rank26_opening }}
        run: node -e "const x=require('./rank26-firstturn-cologne-action.json'); console.log(JSON.stringify({seed:x.seedIdentity.seed,firstTurnSlot:x.played.firstTurnSlot,sourceRootMatches:x.originalSourceRootMatches,actualHand:x.played.sourceHandBefore,action:x.played.firstNormalTurnAction,before:x.played.meloettaAbilitiesBefore,after:x.played.meloettaAbilitiesAfter,discarded:x.played.cologneInDiscard,gameQualified:x.competitiveGameQualified},null,2))"
      - name: Archive source held-Cologne action evidence
        if: ${{ inputs.source_rank26_opening }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-held-cologne-action-unqualified
          path: rank26-firstturn-cologne-action.json
          if-no-files-found: error
      - name: Preserve first-turn source state and explicit missing-gate metadata
        if: ${{ inputs.source_rank26_opening }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-firstturn-source-window-unqualified
          path: rank26-firstturn-source-window.json
          if-no-files-found: error
      - name: Prove exact source-conditional rank26 Ticket Prize cut
        if: ${{ inputs.rank26_ticket_prize_probe }}
        run: python -m unittest discover -s tests -p test_rank26_prize_ticket_gate.py
      - name: Play rank26 Redeemable Ticket in real pinned Store, both source seats
        if: ${{ inputs.rank26_ticket_prize_probe }}
        run: node simulation/twinleaf/rank26-redeemable-ticket-source-fixture.cjs > rank26-ticket-source-prize-transfer.json
      - name: Archive rank26 actual Store Ticket effect and physical conservation
        if: ${{ inputs.rank26_ticket_prize_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-ticket-source-prize-transfer-unqualified
          path: rank26-ticket-source-prize-transfer.json
          if-no-files-found: error
