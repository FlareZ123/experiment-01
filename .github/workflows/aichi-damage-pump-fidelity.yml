name: Aichi Damage Pump source fidelity

on:
  workflow_dispatch:
    inputs:
      rank26_autonomous_cologne:
        description: 'Run ranked Meloetta bot-selected Cologne source deal, unqualified'
        type: boolean
        required: false
        default: false
      source_rank26_opening:
        description: 'Probe one source-dealt first-turn Meloetta response window'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  damage-pump-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install and compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Verify pinned Damage Pump counterexample and reversible fix
        run: node --test tests/damage_pump_source_contract.test.cjs tests/damage_pump_store_dispatch.test.cjs tests/damage_pump_corrected_match.test.cjs tests/meloetta_damage_pump_two_prizes.test.cjs tests/meloetta_source_60_headless.test.cjs tests/meloetta_first_turn_ability_lock.test.cjs tests/meloetta_forest_seal_cologne_bridge.test.cjs
      - name: Rank26 autonomous Item eligibility and hidden-information guard
        run: node --test tests/rank26-autonomous-cologne.test.cjs
      - name: Verify pinned source-rank26 bot chooses its held Cologne
        if: ${{ inputs.rank26_autonomous_cologne }}
        run: node simulation/twinleaf/rank26-cologne-autonomous-source-regression.cjs > rank26-autonomous-cologne.json
      - name: Compare identical printed rank26 source seed under both bot profiles
        if: ${{ inputs.rank26_autonomous_cologne }}
        run: node simulation/twinleaf/rank26-cologne-autonomous-counterfactual.cjs > rank26-cologne-decision-counterfactual.json
      - name: Print concise paired source first-turn choices
        if: ${{ inputs.rank26_autonomous_cologne }}
        run: node -e "const x=require('./rank26-cologne-decision-counterfactual.json');console.log(JSON.stringify({seed:x.seed,baseline:x.baseline.firstTurnDecisions.slice(0,8),automatic:x.automatic.firstTurnDecisions.slice(0,8),firstTurnCologneBaseline:x.baseline.firstTurnCologneUse,firstTurnCologneAutomatic:x.automatic.firstTurnCologneUse,different:x.strictlyDifferentDecision},null,2))"
      - name: Archive paired first-turn source decision counterfactual
        if: ${{ inputs.rank26_autonomous_cologne }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-cologne-autonomous-paired-unqualified
          path: rank26-cologne-decision-counterfactual.json
          if-no-files-found: error
      - name: Archive rank26 automatic source decision
        if: ${{ inputs.rank26_autonomous_cologne }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-autonomous-cologne-unqualified
          path: rank26-autonomous-cologne.json
          if-no-files-found: error
      - name: Verify pure root-state labels
        run: node --test tests/meloetta-rank26-firstturn-source-window.test.cjs
      - name: Search authenticated rank-26 first-turn source window (unqualified)
        if: ${{ inputs.source_rank26_opening }}
        run: node simulation/twinleaf/meloetta-rank26-firstturn-source-window.cjs > rank26-firstturn-source-window.json
      - name: Summarize authenticated root deal without promoting performance
        if: ${{ inputs.source_rank26_opening }}
        run: node -e "const x=require('./rank26-firstturn-source-window.json'); console.log(JSON.stringify({examined:x.examined,attackerFirst:x.attackerFirst,activeMeloetta:x.activeMeloetta,selected:x.selected,firstEligible:x.firstEligible?.seed,firstPad:x.firstPad?.seed,firstDirect:x.firstDirect?.seed,competitiveGameQualified:x.competitiveGameQualified},null,2))"
      - name: Replay legal held Cologne from the authenticated first-turn root
        if: ${{ inputs.source_rank26_opening }}
        run: node simulation/twinleaf/meloetta-rank26-source-cologne-action.cjs > rank26-firstturn-cologne-action.json
      - name: Print source Item action and actual Ability visibility transition
        if: ${{ inputs.source_rank26_opening }}
        run: node -e "const x=require('./rank26-firstturn-cologne-action.json'); console.log(JSON.stringify({seed:x.seedIdentity.seed,firstTurnSlot:x.played.firstTurnSlot,sourceRootMatches:x.originalSourceRootMatches,actualHand:x.played.sourceHandBefore,action:x.played.firstNormalTurnAction,before:x.played.meloettaAbilitiesBefore,after:x.played.meloettaAbilitiesAfter,discarded:x.played.cologneInDiscard,gameQualified:x.competitiveGameQualified},null,2))"
      - name: Archive source held-Cologne action evidence
        if: ${{ inputs.source_rank26_opening }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-held-cologne-action-unqualified
          path: rank26-firstturn-cologne-action.json
          if-no-files-found: error
      - name: Preserve first-turn source state and explicit missing-gate metadata
        if: ${{ inputs.source_rank26_opening }}
        uses: actions/upload-artifact@v4
        with:
          name: rank26-firstturn-source-window-unqualified
          path: rank26-firstturn-source-window.json
          if-no-files-found: error
