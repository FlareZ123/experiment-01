name: Agent50 rank26 original Koko dual-recipient staged native probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  koko-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Inspect authentic original source Koko Ability prompts in each physical seat
        run: node --test tests/agent50-rank26-koko-dual-recipient.native.test.cjs
      - name: Inspect first-global-turn original Meloetta Tool attack and native terminal
        run: node --test tests/agent50-rank26-firstturn-crisis-punch.native.test.cjs
      - name: Issue25 existing bilateral common-policy native fallback quarantine diagnostic
        run: node --test tests/agent50-issue25-common-runner-quarantine.native.test.cjs

      - name: Issue25 owner-safe setup coin choice native test
        run: node --test tests/agent50-issue25-owner-go-second-quarantine.native.test.cjs
      - name: Issue25 pure owner-only starting Basic setup contract
        run: node --test tests/agent50-owner-starting-basic-choice.test.cjs
      - name: Issue25 native owner-hand starting Basic next fallback boundary
        run: node --test tests/agent50-issue25-owned-basic-setup-quarantine.native.test.cjs
      - name: Issue25 pure owner public prompt acknowledgements contract
        run: node --test tests/agent50-owner-public-acknowledgements.test.cjs
      - name: Issue25 native owner mulligan and wait prompt next fallback boundary
        run: node --test tests/agent50-issue25-owner-public-ack-quarantine.native.test.cjs
      - name: Issue25 pure owner mandatory ShowCards private-zone boundary
        run: node --test tests/agent50-owner-mandatory-showcards.test.cjs
      - name: Issue25 native owner ShowCards next gate with direct source deal receipts
        run: node --test tests/agent50-issue25-owner-showcards-quarantine.native.test.cjs
      - name: Issue25 frozen owner-only policy 48-action native horizon
        run: node --test tests/agent50-issue25-owner-48root-quarantine.native.test.cjs
      - name: Issue25 pure public attack prompt envelope no-hidden-read contract
        run: node --test tests/agent50-first-blocked-prompt-envelope.test.cjs
      - name: Issue25 native 48-root first attack prompt envelope and root mix
        run: node --test tests/agent50-issue25-attack-prompt-envelope.native.test.cjs

      - name: Issue25 selected v0 executing closure pure order and fail-closed tests
        run: node --test tests/agent36-issue25-selected-v0.test.cjs
      - name: Issue25 selected v0 actual four-arm pinned native policy and hash closure
        run: node --test tests/agent36-issue25-selected-v0.native.test.cjs
