name: Agent50 rank26 original Koko dual-recipient staged native probe

on:
  workflow_dispatch:
    inputs:
      issue25_only:
        description: Run only the joined Issue25 native development job
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  koko-native:
    if: ${{ inputs.issue25_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Inspect authentic original source Koko Ability prompts in each physical seat
        run: node --test tests/agent50-rank26-koko-dual-recipient.native.test.cjs
      - name: Inspect first-global-turn original Meloetta Tool attack and native terminal
        run: node --test tests/agent50-rank26-firstturn-crisis-punch.native.test.cjs
      - name: Issue25 existing bilateral common-policy native fallback quarantine diagnostic
        run: node --test tests/agent50-issue25-common-runner-quarantine.native.test.cjs

      - name: Issue25 owner-safe setup coin choice native test
        run: node --test tests/agent50-issue25-owner-go-second-quarantine.native.test.cjs
      - name: Issue25 pure owner-only starting Basic setup contract
        run: node --test tests/agent50-owner-starting-basic-choice.test.cjs
      - name: Original 29 source opening on-Bench Ability exact physical exposure
        run: node --test tests/agent50-opening-bench-trigger-exposure.test.cjs tests/agent50-structural-candidate-opening-exposure.test.cjs
      - name: Agent50 opening hand combinatorics
        run: node --test tests/agent50-setup-bench-occupancy-tradeoff.test.cjs
      - name: Issue25 opt-in owner-only preserved-Bench-entry opening comparison with pinned validator
        run: node --test tests/agent50-owner-preserve-turn-entry-setup.test.cjs tests/agent50-owner-preserve-turn-entry-setup.native.test.cjs
      - name: Six exact pinned printed in-turn entry Ability setup owner prompt validation
        run: node --test tests/agent50-owner-entry-six-pinned-classes.native.test.cjs
      - name: Issue25 opt-in owner-entry-priority real Store pair and pure noninterference
        env:
          AGENT50_ENTRY_RECEIPT_DIR: artifacts/agent50-entry-priority
        run: node --test tests/agent50-owner-entry-priority-single-basic.test.cjs tests/agent50-owner-entry-priority-original5.native.test.cjs
      - name: Three original4 source-hand native entry-preserving multi-Basic Store placements
        run: node --test tests/agent50-owner-protected-multibasic-store.native.test.cjs
      - name: Preregistered original4 32 hands owner priority actual Store acceptance
        env:
          AGENT50_ENTRY_RANK4_RECEIPT_DIR: artifacts/agent50-rank4-priority
        run: node --test tests/agent50-owner-entry-priority-original4-natural32.native.test.cjs
      - name: Preregistered rank4 32 equal-source-hand matched native Store setup A and B
        env:
          AGENT50_RANK4_PAIRED_RECEIPT_DIR: artifacts/agent50-rank4-samehand-paired
        run: node --test tests/agent50-rank4-same-hand-greedy-vs-priority32.native.test.cjs
      - name: Issue25 native owner-hand starting Basic next fallback boundary
        run: node --test tests/agent50-issue25-owned-basic-setup-quarantine.native.test.cjs
      - name: Issue25 pure owner public prompt acknowledgements contract
        run: node --test tests/agent50-owner-public-acknowledgements.test.cjs
      - name: Issue25 native owner mulligan and wait prompt next fallback boundary
        run: node --test tests/agent50-issue25-owner-public-ack-quarantine.native.test.cjs
      - name: Issue25 pure owner mandatory ShowCards private-zone boundary
        run: node --test tests/agent50-owner-mandatory-showcards.test.cjs
      - name: Issue25 native owner ShowCards next gate with direct source deal receipts
        run: node --test tests/agent50-issue25-owner-showcards-quarantine.native.test.cjs
      - name: Issue25 frozen owner-only policy 48-action native horizon
        run: node --test tests/agent50-issue25-owner-48root-quarantine.native.test.cjs
      - name: Issue25 pure public attack prompt envelope no-hidden-read contract
        run: node --test tests/agent50-first-blocked-prompt-envelope.test.cjs
      - name: Issue25 native 48-root first attack prompt envelope and root mix
        run: node --test tests/agent50-issue25-attack-prompt-envelope.native.test.cjs

      - name: Issue25 selected v0 executing closure pure order and fail-closed tests
        run: node --test tests/agent36-issue25-selected-v0.test.cjs
      - name: Issue25 selected v0 actual four-arm pinned native policy and hash closure
        run: node --test tests/agent36-issue25-selected-v0.native.test.cjs
      - name: Issue25 opt-in source-independent both-seat resource policy pure contract
        run: node --test tests/agent36-bilateral-two-seat-common-policy.test.cjs
      - name: Issue25 opt-in symmetric v1 actual source-independent pinned native four-arm gate
        run: node --test tests/agent36-issue25-symmetric-v1.native.test.cjs
      - name: Issue25 source-stamped Future Sight v2 pure wrapper composition
        run: node --test tests/agent36-issue25-printed-futuresight-v2.test.cjs
      - name: Issue25 original historical v2 source-stamped native ATTACK continuation
        run: node --test tests/agent36-issue25-printed-futuresight-v2.native.test.cjs

      - name: Issue25 source-printed Night Watch owner physical random native Store negative/positive SFT
        run: node --test tests/agent36-source-stamped-nightwatch-owner.test.cjs
      - name: Issue25 selected v3 two source-stamped ATTACK owner native 48-root original closure
        env:
          ISSUE25_RECEIPT_DIR: artifacts/issue25-v3
        run: node --test tests/agent7-issue25-v3-executed-receipt.test.cjs tests/agent36-issue25-nightwatch-futuresight-v3.test.cjs tests/agent36-issue25-nightwatch-futuresight-v3.native.test.cjs
      - name: Preserve selected Issue25 v3 actual native evidence, including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue25-v3-executed-${{ github.run_id }}
          path: artifacts/issue25-v3/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve original rank5 two-seat owner-entry-priority native Store receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-owner-entry-priority-${{ github.run_id }}
          path: artifacts/agent50-entry-priority/
          if-no-files-found: warn
          retention-days: 30
      - name: Save original4 32-hand source setup receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-rank4-owner-priority-${{ github.run_id }}
          path: artifacts/agent50-rank4-priority/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve 32 matched source-hand setup comparison receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-rank4-matched-opening-${{ github.run_id }}
          path: artifacts/agent50-rank4-samehand-paired/
          if-no-files-found: warn
          retention-days: 30

  issue25-joined-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original pinned Twinleaf gitlink
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Assert joined v4 really selects symmetric two-seat resources and source-printed handlers
        run: node --test tests/agent1-issue25-joined-two-seat-attacks-v4.test.cjs tests/agent1-issue25-v4-public-receipt.test.cjs tests/agent36-source-stamped-nightwatch-owner.test.cjs tests/agent36-source-stamped-getlost-owner.test.cjs tests/agent1-issue25-joined-three-attacks-v5.test.cjs
      - name: Execute selected joined v4 four original arms and archive every native outcome
        env:
          ISSUE25_V4_RECEIPT_DIR: artifacts/issue25-joined-v4
        run: node --test tests/agent1-issue25-joined-two-seat-attacks-v4.native.test.cjs
      - name: Preserve joint v4 exact native receipt including censored, error and failed arms
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue25-joined-v4-executed-${{ github.run_id }}
          path: artifacts/issue25-joined-v4/
          if-no-files-found: warn
          retention-days: 30
      - name: Execute joined v5 additional source-locked public Get Lost in four native Store arms
        env:
          ISSUE25_V5_RECEIPT_DIR: artifacts/issue25-joined-v5
        run: node --test tests/agent1-issue25-joined-three-attacks-v5.native.test.cjs
      - name: Preserve joined v5 native public Store ledger, including aborts and caps
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue25-joined-v5-executed-${{ github.run_id }}
          path: artifacts/issue25-joined-v5/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify precommitted mirrored rank6/rank11 seat-factor registration and raw receipt
        run: node --test tests/agent1-issue25-mirrored-r6-r11-v6.test.cjs
      - name: Execute same symmetric three-attack policy on preregistered eight-arm mirrored native panel
        env:
          ISSUE25_V6_RECEIPT_DIR: artifacts/issue25-mirrored-v6
        run: node --test tests/agent1-issue25-mirrored-r6-r11-v6.native.test.cjs
      - name: Retain full eight-arm mirrored-native failures and physical fingerprint custody
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue25-mirrored-v6-executed-${{ github.run_id }}
          path: artifacts/issue25-mirrored-v6/
          if-no-files-found: warn
          retention-days: 30
      - name: Check preregistered opening contrast and exact physical receipt reconciliation
        run: node --test tests/agent1-issue25-protected-opening-v7.test.cjs tests/agent1-issue25-mirrored-opening-contrast.test.cjs
      - name: Execute matched eight native arms with protected turn-entry Basic opening
        env:
          ISSUE25_V7_RECEIPT_DIR: artifacts/issue25-protected-opening-v7
        run: node --test tests/agent1-issue25-protected-opening-v7.native.test.cjs
      - name: Preserve physical opening placements, aborts and caps from eight v7 arms
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue25-protected-opening-v7-executed-${{ github.run_id }}
          path: artifacts/issue25-protected-opening-v7/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify actual same source and full initial physical deal on all eight v6 versus v7 arms
        run: node --test tests/agent1-issue25-mirrored-opening-contrast.native.test.cjs
      - name: Preserve native v6 versus v7 public matched-deal causal contrast
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue25-mirrored-opening-contrast-${{ github.run_id }}
          path: artifacts/issue25-mirrored-opening-contrast/
          if-no-files-found: warn
          retention-days: 30
