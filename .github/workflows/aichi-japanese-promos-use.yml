name: Aichi original source resolution and promo source-use

on:
  workflow_dispatch:
    inputs:
      run_source_use:
        description: 'Also run the bounded rank-6 versus rank-1 generic-bot source-use diagnostic (unqualified)'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/aichi-japanese-promos-use.yml'
      - 'results/aichi-2026/full-decklists.json'
      - 'results/aichi-2026/field.csv'
      - 'simulation/evaluation/aichi-pilot.cjs'
      - 'simulation/evaluation/agent13-source-identity-gate.cjs'
      - 'simulation/evaluation/aichi-campaign-runner.cjs'
      - 'simulation/twinleaf/resolve-field.cjs'
      - 'simulation/twinleaf/card-patches.cjs'
      - 'simulation/twinleaf/headless.cjs'
      - 'simulation/twinleaf/japanese-promos-source-probe.cjs'
      - 'vendor/twinleafgg'

permissions:
  contents: read

jobs:
  source-use:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Validate diagnostic syntax
        run: node --check simulation/twinleaf/japanese-promos-source-probe.cjs
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install upstream dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile upstream Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Admit all original Aichi lists through the production plan builder
        run: |
          node <<'NODE'
          const { planAichi, summarisePlan } = require('./simulation/evaluation/aichi-pilot.cjs');
          const plan = planAichi(1, {
            allowEquivalentBasicEnergies: true,
            allowBasicEnergyMirrorPrintings: true,
            allowJapanesePromoHooks: true,
            requireFrozenSourceBaseline: true
          });
          const summary = summarisePlan(plan);
          const ready = plan.opponents.filter(deck => deck.status === 'ready');
          const missing = plan.opponents
            .filter(deck => deck.status === 'missing-published-list')
            .map(deck => deck.rank);
          const blocked = plan.opponents
            .filter(deck => deck.status === 'unresolved-printings')
            .map(deck => ({ rank: deck.rank, unresolved: deck.unresolved }));
          const promoHookCopies = ready.reduce((total, deck) =>
            total + (deck.substitutions || [])
              .filter(change => change.reason === 'research-only-japanese-promo-implementation')
              .reduce((sum, change) => sum + change.count, 0), 0);
          const result = {
            engineRevision: plan.engineRevision,
            sourceDeckCount: plan.sourceDeckCount,
            rosterSize: plan.opponents.length,
            frozenSourceBaselineMatched: plan.originalSourceFiles.matchedFrozenReference,
            candidateRankPlaceholder: plan.candidateRank,
            candidateResolved: summary.candidateResolved,
            readyRanks: ready.map(deck => deck.rank),
            missingRanks: missing,
            blockedRanks: blocked,
            researchPromoCopies: promoHookCopies,
            substitutionRanks: ready
              .filter(deck => deck.substitutions && deck.substitutions.length)
              .map(deck => ({ rank: deck.rank, substitutions: deck.substitutions }))
          };
          console.log(JSON.stringify(result, null, 2));
          const expectedMissing = [23, 25, 28];
          if (
            plan.sourceDeckCount !== 29 ||
            plan.opponents.length !== 32 ||
            plan.originalSourceFiles.matchedFrozenReference !== true ||
            summary.candidateResolved !== true ||
            ready.length !== 29 ||
            JSON.stringify(missing) !== JSON.stringify(expectedMissing) ||
            blocked.length !== 0
          ) {
            process.exitCode = 1;
          }
          NODE
      - name: Run bounded two-slot source diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_source_use == true }}
        run: node simulation/twinleaf/japanese-promos-source-probe.cjs
