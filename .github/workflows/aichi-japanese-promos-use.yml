name: Aichi Japanese promo source-use diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-use:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Validate diagnostic syntax
        run: node --check simulation/twinleaf/japanese-promos-source-probe.cjs
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install upstream dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile upstream Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run bounded two-slot source diagnostic
        run: node simulation/twinleaf/japanese-promos-source-probe.cjs
