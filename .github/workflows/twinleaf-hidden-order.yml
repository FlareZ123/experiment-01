name: Twinleaf hidden-deck information-set audit

on:
  workflow_dispatch:
    inputs:
      source_k0_survey:
        description: Run bounded original Aichi 60-card K0 survey on six fixed ranks
        required: false
        type: boolean
        default: false
      remaining_source_k0_survey:
        description: Audit K0 owner roots for other 23 published original Aichi 60s
        required: false
        type: boolean
        default: false
      agent32_rank11_original_bench_eight:
        description: 'Retrospective 8 registered rank11 source K0 original Bench observations, no game continuation'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hidden-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check native RNG parity and owner-known-top information boundaries
        run: node --test tests/native-policy-random-tape.test.cjs tests/native-same-world-tape-parity.test.cjs tests/native-tape-hidden-order-contrast.test.cjs
      - name: Initialize pinned upstream submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Unit-test detached owner-only Tool candidate frontier
        run: node --test tests/agent18-actor-tool-candidate-frontier.test.cjs
      - name: Pure test precommitted eight-source K0 native Bench classifier
        run: node tests/agent32-rank11-eight-k0-bench-native.test.cjs
      - name: Optional frozen rank11 original-source first-K0 Bench witness
        if: inputs.agent32_rank11_original_bench_eight
        run: node simulation/twinleaf/agent32-rank11-eight-k0-bench-native.cjs > agent32-rank11-original-eight-firstbench.json
      - name: Preserve complete original eight-K0 Bench witness and blockers
        if: inputs.agent32_rank11_original_bench_eight && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent32-original-rank11-eight-firstbench
          path: agent32-rank11-original-eight-firstbench.json
          if-no-files-found: warn
      - name: Native K0 actor action invariance across concealed worlds in both seats
        run: node simulation/twinleaf/agent18-k0-root-invariance-native.cjs
      - name: Original Aichi full-60 native K0 owner-root permutation noninterference
        run: node simulation/twinleaf/agent18-aichi-source-k0-native-root.cjs
      - name: Optional six-rank original Aichi source K0 observer survey
        if: ${{ inputs.source_k0_survey }}
        run: node simulation/twinleaf/agent18-aichi-k0-stratified-native.cjs > agent18-source-k0-survey.json
      - name: Preserve K0 survey evidence including blocked registered ranks
        if: ${{ always() && inputs.source_k0_survey }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-original-aichi-k0-six-rank-survey
          path: agent18-source-k0-survey.json
          retention-days: 30
      - name: Optional remaining 23 published Aichi source K0 observer survey
        if: ${{ inputs.remaining_source_k0_survey }}
        run: node simulation/twinleaf/agent18-aichi-k0-remaining23-native.cjs > agent18-source-k0-remaining23.json
      - name: Preserve remaining 23 K0 source receipts including blocked ranks
        if: ${{ always() && inputs.remaining_source_k0_survey }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-original-aichi-k0-remaining23-survey
          path: agent18-source-k0-remaining23.json
          retention-days: 30
      - name: Compare information-identical deck states
        run: node simulation/twinleaf/hidden-deck-order-audit.cjs
      - name: Compare field-used Trainers Mail hidden-order decisions
        run: node simulation/twinleaf/hidden-trainers-mail-audit.cjs
      - name: Verify whole unrestricted simple-bot choices
        run: node simulation/twinleaf/hidden-order-full-policy-audit.cjs
      - name: Test sampled order policy wrapper
        run: node simulation/twinleaf/hypothetical-deck-sampler-test.cjs
      - name: Test full policy under authentic rank-6 60-card inventory
        run: node simulation/twinleaf/hidden-source-trainers-mail.cjs
      - name: Test K0 Prize membership leak
        run: node simulation/twinleaf/prize-membership-foreknowledge.cjs
