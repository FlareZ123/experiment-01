name: Twinleaf hidden-deck information-set audit

on:
  workflow_dispatch:
    inputs:
      source_k0_survey:
        description: Run bounded original Aichi 60-card K0 survey on six fixed ranks
        required: false
        type: boolean
        default: false
      remaining_source_k0_survey:
        description: Audit K0 owner roots for other 23 published original Aichi 60s
        required: false
        type: boolean
        default: false
      agent32_rank11_original_bench_eight:
        description: 'Retrospective 8 registered rank11 source K0 original Bench observations, no game continuation'
        required: false
        type: boolean
        default: false
      agent32_six_star_vip_k1:
        description: 'Registered six native original-source first-turn Star-fetched VIP mechanics only, no wins'
        required: false
        type: boolean
        default: false
      agent1_six_native_opponent_return:
        description: 'Original six rank11 scripted source openings followed by native opposing bot turn, no wins'
        required: false
        type: boolean
        default: false
      agent1_six_native_source_policy_pair:
        description: 'Six preregistered rank11 physical source K0 deals, scripted route versus unmodified native bots'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hidden-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check native RNG parity and owner-known-top information boundaries
        run: node --test tests/native-policy-random-tape.test.cjs tests/native-same-world-tape-parity.test.cjs tests/native-tape-hidden-order-contrast.test.cjs
      - name: Initialize pinned upstream submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Unit-test detached owner-only Tool candidate frontier
        run: node --test tests/agent18-actor-tool-candidate-frontier.test.cjs
      - name: Pure test precommitted eight-source K0 native Bench classifier
        run: node tests/agent32-rank11-eight-k0-bench-native.test.cjs
      - name: Optional frozen rank11 original-source first-K0 Bench witness
        if: inputs.agent32_rank11_original_bench_eight
        run: node simulation/twinleaf/agent32-rank11-eight-k0-bench-native.cjs > agent32-rank11-original-eight-firstbench.json
      - name: Preserve complete original eight-K0 Bench witness and blockers
        if: inputs.agent32_rank11_original_bench_eight && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent32-original-rank11-eight-firstbench
          path: agent32-rank11-original-eight-firstbench.json
          if-no-files-found: warn
      - name: Pure test original source owner K1 search boundaries
        run: node tests/agent32-rank11-six-star-vip-k1-native.test.cjs
      - name: Optional registered six-source Star-fetched VIP K1 native action line
        if: inputs.agent32_six_star_vip_k1
        run: node simulation/twinleaf/agent32-rank11-six-star-vip-k1-native.cjs > agent32-six-source-starvip-k1.json
      - name: Preserve all six native K1 line outcomes and owner-visible blockers
        if: inputs.agent32_six_star_vip_k1 && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent32-source-rank11-six-starvip-k1
          path: agent32-six-source-starvip-k1.json
          if-no-files-found: warn
      - name: Execute same original six Star-fetched VIP setups through genuine opponent turn
        if: inputs.agent1_six_native_opponent_return
        run: node simulation/twinleaf/agent32-rank11-six-star-vip-k1-native.cjs --opponent-return > agent1-six-rank11-opponent-return.json
      - name: Require complete original-six actor boundary census
        if: inputs.agent1_six_native_opponent_return
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-six-rank11-opponent-return.json');a.equal(r.scheduled,6);a.equal(r.attempted,6);a.equal(r.handAndBenchParity,6);a.equal(r.opponentFirstRoots,6);a.equal(r.sourceReturnRoots+r.nonreturningTerminals+r.nonreturningCensors+r.blocked,6);a.equal(r.competitiveQualifiedGames,0);console.log('RANK11_OPPONENT_RETURN',JSON.stringify({opponentFirstRoots:r.opponentFirstRoots,sourceReturnRoots:r.sourceReturnRoots,nonreturningTerminals:r.nonreturningTerminals,nonreturningCensors:r.nonreturningCensors,blocked:r.blocked}))"
      - name: Summarize original six public-source boards after the opposing native turn
        if: inputs.agent1_six_native_opponent_return
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-six-rank11-opponent-return.json');const rows=r.rows.map(x=>({index:x.index,seed:x.seed,status:x.status,opponentRootCount:x.opponentRootProposals?.length??0,equippedGarbodorAfter:x.afterOpponentPublic?.sourceEquippedGarbodorCount??null,sourcePrizesAfter:x.afterOpponentPublic?.sourceRemainingPrizes??null}));a.equal(rows.length,6);for(const x of rows){a.equal(x.status,'native-opponent-turn-returned-to-source-root');a.ok(x.opponentRootCount>0);a.ok(Number.isInteger(x.equippedGarbodorAfter));}console.log('RANK11_SOURCE_PUBLIC_RETURN_ROWS',JSON.stringify(rows))"
      - name: Pure fail-closed original K0 native source policy comparator tests
        if: inputs.agent1_six_native_source_policy_pair
        run: node --test tests/agent1-rank11-six-source-policy-pair.test.cjs
      - name: Six paired original source K0 native Store replies with unmodified-bot control
        if: inputs.agent1_six_native_source_policy_pair
        run: node simulation/twinleaf/agent1-rank11-six-source-policy-pair.cjs > agent1-six-original-source-policy-pair.json
      - name: Validate exact original six native physical K0 pairs and report owner public boards
        if: inputs.agent1_six_native_source_policy_pair
        run: node -e "const a=require('node:assert/strict');const d=require('./agent1-six-original-source-policy-pair.json');const r=d.report;a.equal(r.sameOriginalSeedAndK0Pairs,6);a.equal(d.control.originalK0Replayed,6);a.equal(d.treatment.handAndBenchParity,6);a.equal(r.competitiveQualifiedGames,0);console.log('AGENT1_SIX_SOURCE_PAIR',JSON.stringify({treatmentReturn:r.treatmentSourceReturns,controlReturn:r.controlSourceReturns,treatmentEquippedAfter:r.treatmentEquippedAfter,controlEquippedAfter:r.controlEquippedAfter,rows:r.rows.map(x=>({index:x.index,seed:x.seed,treatment:x.treatmentStatus,control:x.controlStatus,firstGarbodorControl:x.controlEquippedAtOpponentFirst,afterGarbodorControl:x.controlEquippedAfterReply,afterGarbodorTreatment:x.treatmentEquippedAfterReply}))}))"
      - name: Preserve all six original K0 policy pairs and native errors
        if: inputs.agent1_six_native_source_policy_pair && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-original-rank11-six-source-policy-pairs
          path: agent1-six-original-source-policy-pair.json
          if-no-files-found: warn
      - name: Audit opposing original rank1 owner-held Field Blower at first locked native root
        if: inputs.agent1_six_native_opponent_return
        run: node -e "const a=require('node:assert/strict');const r=require('./agent1-six-rank11-opponent-return.json');const rows=r.rows.map(x=>({index:x.index,seed:x.seed,heldFieldBlower:x.opponentFirstOwnerResources?.fieldBlower??null,heldGuzma:x.opponentFirstOwnerResources?.guzma??null,heldVSSeeker:x.opponentFirstOwnerResources?.vsSeeker??null,heldQuickBall:x.opponentFirstOwnerResources?.quickBall??null,proposedFieldBlower:x.opponentRootProposals?.filter(z=>z.fieldBlowerProposed).length??null}));a.equal(rows.length,6);for(const x of rows){a.ok(Number.isInteger(x.heldFieldBlower));a.ok(Number.isInteger(x.proposedFieldBlower));}console.log('AGENT1_OPP_OWNER_FIELD_BLOWER',JSON.stringify(rows))"
      - name: Preserve six native opponent turns including returns, censors and errors
        if: inputs.agent1_six_native_opponent_return && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-original-rank11-six-opponent-return
          path: agent1-six-rank11-opponent-return.json
          if-no-files-found: warn
      - name: Native K0 actor action invariance across concealed worlds in both seats
        run: node simulation/twinleaf/agent18-k0-root-invariance-native.cjs
      - name: Original Aichi full-60 native K0 owner-root permutation noninterference
        run: node simulation/twinleaf/agent18-aichi-source-k0-native-root.cjs
      - name: Optional six-rank original Aichi source K0 observer survey
        if: ${{ inputs.source_k0_survey }}
        run: node simulation/twinleaf/agent18-aichi-k0-stratified-native.cjs > agent18-source-k0-survey.json
      - name: Preserve K0 survey evidence including blocked registered ranks
        if: ${{ always() && inputs.source_k0_survey }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-original-aichi-k0-six-rank-survey
          path: agent18-source-k0-survey.json
          retention-days: 30
      - name: Optional remaining 23 published Aichi source K0 observer survey
        if: ${{ inputs.remaining_source_k0_survey }}
        run: node simulation/twinleaf/agent18-aichi-k0-remaining23-native.cjs > agent18-source-k0-remaining23.json
      - name: Preserve remaining 23 K0 source receipts including blocked ranks
        if: ${{ always() && inputs.remaining_source_k0_survey }}
        uses: actions/upload-artifact@v4
        with:
          name: agent18-original-aichi-k0-remaining23-survey
          path: agent18-source-k0-remaining23.json
          retention-days: 30
      - name: Compare information-identical deck states
        run: node simulation/twinleaf/hidden-deck-order-audit.cjs
      - name: Compare field-used Trainers Mail hidden-order decisions
        run: node simulation/twinleaf/hidden-trainers-mail-audit.cjs
      - name: Verify whole unrestricted simple-bot choices
        run: node simulation/twinleaf/hidden-order-full-policy-audit.cjs
      - name: Test sampled order policy wrapper
        run: node simulation/twinleaf/hypothetical-deck-sampler-test.cjs
      - name: Test full policy under authentic rank-6 60-card inventory
        run: node simulation/twinleaf/hidden-source-trainers-mail.cjs
      - name: Test K0 Prize membership leak
        run: node simulation/twinleaf/prize-membership-foreknowledge.cjs
