name: Aichi full dispatch transcript diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aichi-dispatch-transcript
  cancel-in-progress: false

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify reversible noninterfering recording wrapper
        run: node --test tests/store-dispatch-transcript.test.cjs tests/action-trace-canonical.test.cjs tests/choose-cards-reference.test.cjs tests/rank10-source-branch-transcript.test.cjs
      - name: Install compiled engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Observe real pinned Store dispatches
        run: node simulation/twinleaf/dispatch-transcript-smoke.cjs

      - name: Run source-ranked rank-10 live-only branch trace
        run: node simulation/twinleaf/rank10-source-branch-transcript.cjs > rank10-source-branch-live-dispatch.json
      - name: Summarize the bounded authentic-deal comparison
        run: node -e "const x=require('./rank10-source-branch-live-dispatch.json'); console.log(JSON.stringify({trial:x.trial.id,firstCandidateSeat:x.trial.candidatePhysicalSeat,sourceTurn:x.sharedAuthenticTurn27Start.turn,firstDecisionDifference:x.firstMeaningfulDifference?.index ?? null,firstLiveDifference:x.firstLiveDispatchDifference?.index ?? null,controlActions:x.control.recording.liveDispatches,alternateActions:x.alternate.recording.liveDispatches,controlCaptureFailures:x.control.recording.captureFailures.length,alternateCaptureFailures:x.alternate.recording.captureFailures.length,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Archive complete live-only Store transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-source-branch-live-dispatch
          path: rank10-source-branch-live-dispatch.json
          if-no-files-found: warn
