name: Aichi full dispatch transcript diagnostic

on:
  workflow_dispatch:
    inputs:
      only_source_replay:
        description: Skip unrelated source diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aichi-dispatch-transcript
  cancel-in-progress: false

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify reversible noninterfering recording wrapper
        run: node --test tests/store-dispatch-transcript.test.cjs tests/source-action-value-codec.test.cjs tests/source-prompt-action-codec.test.cjs tests/source-replay-action-decoder.test.cjs tests/action-trace-canonical.test.cjs tests/source-input-canonical.test.cjs tests/choose-cards-reference.test.cjs tests/rank10-source-branch-transcript.test.cjs tests/rank10-source-input-coverage.test.cjs tests/choose-attack-reference.test.cjs tests/source-zone-checkpoint.test.cjs tests/source-mechanics-blindspots.test.cjs tests/store-data-graph-fingerprint.test.cjs tests/store-data-graph-scope-negative.test.cjs tests/source-effect-clock-normalization.test.cjs tests/choice-slot-reference.test.cjs tests/choose-energy-reference.test.cjs tests/attach-energy-reference.test.cjs tests/state-continuity-observer.test.cjs tests/root-policy-store-graph-audit.test.cjs tests/rank10-hook-boundary-attribution.test.cjs tests/rank10-replay-acceptance.test.cjs tests/aichi-rank10-heavy-ball-exposure.test.cjs tests/pale-moon-source-exposure.test.cjs tests/pale-moon-queue-audit.test.cjs tests/pale-moon-bench-identity.test.cjs tests/rank10-dde-archive-version.test.cjs
      - name: Install compiled engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Observe real pinned Store dispatches
        run: node simulation/twinleaf/dispatch-transcript-smoke.cjs
      - name: Compare authentic rank-10 DDE-disabled and current policy source trajectories
        if: "!inputs.only_source_replay"
        run: node simulation/twinleaf/rank10-dde-policy-drift.cjs > rank10-dde-policy-drift.json
      - name: Print first DDE source-policy divergence
        if: "!inputs.only_source_replay"
        run: node -e "const x=require('./rank10-dde-policy-drift.json');console.log(JSON.stringify({control:x.noDdeControl,v4:x.currentV4,firstChangedSourceRoot:x.firstChangedSourceRoot,turn2PrintedAction:x.turn2PrintedAction},null,2))"
      - name: Archive DDE source policy differential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-dde-policy-drift
          path: rank10-dde-policy-drift.json
          if-no-files-found: warn

      - name: Check v4 turn2 single-action fork predicates
        if: "!inputs.only_source_replay"
        run: node --test tests/rank10-v4-turn2-prime-catcher-fork.test.cjs
      - name: Run same-policy source turn2 Prime Catcher instead of DDE
        if: "!inputs.only_source_replay"
        run: node simulation/twinleaf/rank10-v4-turn2-prime-catcher-fork.cjs > rank10-v4-turn2-prime-catcher.json
      - name: Summarize current-v4 one-choice fork
        if: "!inputs.only_source_replay"
        run: node -e "const x=require('./rank10-v4-turn2-prime-catcher.json');console.log(JSON.stringify({override:x.override,firstStep:x.firstSourceDivergence.rootStep,control:x.control,branch:x.forcedPrimeCatcher,qualified:x.qualifiedForCompetitiveInference},null,2))"
      - name: Archive current-v4 one-choice source fork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-v4-turn2-prime-catcher
          path: rank10-v4-turn2-prime-catcher.json
          if-no-files-found: warn

      - name: Run current-v4 same-seed Prime choice without prior generic bot decision
        if: "!inputs.only_source_replay"
        run: node simulation/twinleaf/rank10-v4-prime-no-preview.cjs > rank10-v4-prime-no-preview.json
      - name: Print no-preview source decision outcome
        if: "!inputs.only_source_replay"
        run: node -e "const x=require('./rank10-v4-prime-no-preview.json'); console.log(JSON.stringify({override:x.override,firstStep:x.firstSourceDifference.rootStep,control:x.control,noPreview:x.noPreviewPrime,qualified:x.qualifiedForCompetitiveInference},null,2))"
      - name: Archive no-preview current-v4 source counterfactual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-v4-prime-no-preview
          path: rank10-v4-prime-no-preview.json
          if-no-files-found: warn

      - name: Check source-locked Field Blower policy predicates
        if: "!inputs.only_source_replay"
        run: node --test tests/rank10-field-blower-policy.test.cjs
      - name: Try actual source rank10 Field Blower turn55 decision
        if: "!inputs.only_source_replay"
        run: node simulation/twinleaf/rank10-field-blower-fork.cjs > rank10-field-blower-fork.json
      - name: Summarize Field Blower policy fork
        if: "!inputs.only_source_replay"
        run: node -e "const x=require('./rank10-field-blower-fork.json'); console.log(JSON.stringify({trial:x.trial,divergence:x.divergence,actionsTaken:x.actionsTaken,attemptedPlayAccepted:x.attemptedPlayAccepted,attemptedFollowOnBench:x.attemptedFollowOnBench,control:x.control,branch:x.branch,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Archive source rank10 Field Blower fork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-field-blower-fork
          path: rank10-field-blower-fork.json
          if-no-files-found: warn

      - name: Audit root Store own-data across authentic rank-10 policy decisions
        if: "!inputs.only_source_replay"
        run: node simulation/twinleaf/rank10-policy-store-graph.cjs > rank10-root-policy-graph.json
      - name: Summarize live policy mutation audit
        if: "!inputs.only_source_replay"
        run: node -e "const x=require('./rank10-root-policy-graph.json'); console.log(JSON.stringify({rootPolicyCalls:x.rootPolicyCalls,observedMutations:x.mutationCount,graphContract:x.graphContract,firstMutations:x.mutations.slice(0,5),qualified:x.qualifiedForCompetitiveInference}));"
      - name: Archive policy-time root Store graph diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-root-policy-graph
          path: rank10-root-policy-graph.json
          if-no-files-found: warn

      - name: Run source-ranked rank-10 live-only branch trace
        run: node simulation/twinleaf/rank10-source-branch-transcript.cjs > rank10-source-branch-live-dispatch.json
      - name: Summarize the bounded authentic-deal comparison
        run: node -e "const x=require('./rank10-source-branch-live-dispatch.json'); console.log(JSON.stringify({trial:x.trial.id,firstCandidateSeat:x.trial.candidatePhysicalSeat,sourceTurn:x.sharedAuthenticTurn27Start.turn,firstDecisionDifference:x.firstMeaningfulDifference?.index ?? null,firstLiveDifference:x.firstLiveDispatchDifference?.index ?? null,controlActions:x.control.recording.liveDispatches,alternateActions:x.alternate.recording.liveDispatches,controlCaptureFailures:x.control.recording.captureFailures.length,alternateCaptureFailures:x.alternate.recording.captureFailures.length,controlTypedCaptured:x.control.recording.typedActionValueEvents,alternateTypedCaptured:x.alternate.recording.typedActionValueEvents,controlTypedFailures:x.control.recording.typedActionValueFailures,alternateTypedFailures:x.alternate.recording.typedActionValueFailures,controlActionEnvelopeCoverage:x.control.recording.actionInputEnvelopeCoverage,alternateActionEnvelopeCoverage:x.alternate.recording.actionInputEnvelopeCoverage,controlPromptFailures:x.control.recording.promptReplayActionFailures,alternatePromptFailures:x.alternate.recording.promptReplayActionFailures,controlInputGaps:x.actionInputCoverage.control.unrepresented,alternateInputGaps:x.actionInputCoverage.alternate.unrepresented,controlGapKinds:x.actionInputCoverage.control.byAction.slice(0,8),alternateGapKinds:x.actionInputCoverage.alternate.byAction.slice(0,8),replayInputAssessment:x.replayInputAssessment,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Audit source-ranked Hisuian Heavy Ball exposure in each arm
        run: node scripts/aichi-rank10-heavy-ball-exposure.cjs rank10-source-branch-live-dispatch.json
      - name: Archive complete live-only Store transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-source-branch-live-dispatch
          path: rank10-source-branch-live-dispatch.json
          if-no-files-found: warn

      - name: Reconstruct the archived control and alternate inputs in a fresh process
        run: node simulation/twinleaf/rank10-replay-from-archive.cjs rank10-source-branch-live-dispatch.json > rank10-fresh-process-input-replay.json
      - name: Show archived-action replay acceptance blockers
        run: node -e "const x=require('./rank10-fresh-process-input-replay.json'); console.log(JSON.stringify(x.findings,null,2))"
      - name: Fail closed unless both reconstructed source arms complete
        run: node simulation/twinleaf/rank10-replay-acceptance.cjs rank10-fresh-process-input-replay.json
      - name: Audit authentic rank-10 Pale Moon queue exposure in both replay arms
        run: |
          node -e "const fs=require('node:fs'); const {auditRank10PaleMoonExposure}=require('./simulation/twinleaf/rank10-pale-moon-exposure-replay.cjs'); const input=JSON.parse(fs.readFileSync('rank10-source-branch-live-dispatch.json','utf8')); const result=auditRank10PaleMoonExposure(input); fs.writeFileSync('rank10-pale-moon-exposure.json',JSON.stringify(result,null,2)); console.log(JSON.stringify(result.findings.map(x=>({arm:x.arm,dispatches:x.dispatches,activeQueueSteps:x.activeQueueSteps,status:x.status,events:x.events})),null,2));"

      - name: Archive authentic rank-10 Pale Moon exposure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-pale-moon-source-exposure
          path: rank10-pale-moon-exposure.json
          if-no-files-found: warn

      - name: Archive fresh-process input replay result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-fresh-process-input-replay
          path: rank10-fresh-process-input-replay.json
          if-no-files-found: warn

      - name: Observe source-state continuity under each clone profile
        run: node simulation/twinleaf/agent1-rank10-continuity.cjs > source-state-continuity-rank10.json
      - name: Report state changes between real actions
        run: node -e "const x=require('./source-state-continuity-rank10.json'); for (const y of x.findings) console.log(JSON.stringify({mode:y.mode,actions:y.actions,boundaryGaps:y.stateChangesBetweenActions,cardGaps:y.firstChanges.filter(z=>z.cardHistoryMismatch).length,policyMutations:y.policyMutations.length,policyCardChanges:y.policyMutations.filter(z=>z.cardHistoryMismatch).length,policySamples:y.policyMutations.slice(0,5)}));"
      - name: Cross-check copied-attack and pass-history hook boundaries against archived root actions
        run: node simulation/twinleaf/rank10-hook-boundary-attribution.cjs rank10-source-branch-live-dispatch.json source-state-continuity-rank10.json
      - name: Archive source-state continuity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-state-continuity-rank10
          path: source-state-continuity-rank10.json
          if-no-files-found: warn
