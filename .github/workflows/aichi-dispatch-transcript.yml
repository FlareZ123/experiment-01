name: Aichi full dispatch transcript diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aichi-dispatch-transcript
  cancel-in-progress: false

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify reversible noninterfering recording wrapper
        run: node --test tests/store-dispatch-transcript.test.cjs tests/source-action-value-codec.test.cjs tests/source-prompt-action-codec.test.cjs tests/source-replay-action-decoder.test.cjs tests/action-trace-canonical.test.cjs tests/choose-cards-reference.test.cjs tests/rank10-source-branch-transcript.test.cjs tests/rank10-source-input-coverage.test.cjs tests/choose-attack-reference.test.cjs tests/source-zone-checkpoint.test.cjs tests/choice-slot-reference.test.cjs tests/choose-energy-reference.test.cjs tests/attach-energy-reference.test.cjs tests/state-continuity-observer.test.cjs
      - name: Install compiled engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Observe real pinned Store dispatches
        run: node simulation/twinleaf/dispatch-transcript-smoke.cjs

      - name: Run source-ranked rank-10 live-only branch trace
        run: node simulation/twinleaf/rank10-source-branch-transcript.cjs > rank10-source-branch-live-dispatch.json
      - name: Summarize the bounded authentic-deal comparison
        run: node -e "const x=require('./rank10-source-branch-live-dispatch.json'); console.log(JSON.stringify({trial:x.trial.id,firstCandidateSeat:x.trial.candidatePhysicalSeat,sourceTurn:x.sharedAuthenticTurn27Start.turn,firstDecisionDifference:x.firstMeaningfulDifference?.index ?? null,firstLiveDifference:x.firstLiveDispatchDifference?.index ?? null,controlActions:x.control.recording.liveDispatches,alternateActions:x.alternate.recording.liveDispatches,controlCaptureFailures:x.control.recording.captureFailures.length,alternateCaptureFailures:x.alternate.recording.captureFailures.length,controlTypedCaptured:x.control.recording.typedActionValueEvents,alternateTypedCaptured:x.alternate.recording.typedActionValueEvents,controlTypedFailures:x.control.recording.typedActionValueFailures,alternateTypedFailures:x.alternate.recording.typedActionValueFailures,controlActionEnvelopeCoverage:x.control.recording.actionInputEnvelopeCoverage,alternateActionEnvelopeCoverage:x.alternate.recording.actionInputEnvelopeCoverage,controlPromptFailures:x.control.recording.promptReplayActionFailures,alternatePromptFailures:x.alternate.recording.promptReplayActionFailures,controlInputGaps:x.actionInputCoverage.control.unrepresented,alternateInputGaps:x.actionInputCoverage.alternate.unrepresented,controlGapKinds:x.actionInputCoverage.control.byAction.slice(0,8),alternateGapKinds:x.actionInputCoverage.alternate.byAction.slice(0,8),replayInputAssessment:x.replayInputAssessment,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Archive complete live-only Store transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-source-branch-live-dispatch
          path: rank10-source-branch-live-dispatch.json
          if-no-files-found: warn

      - name: Observe source-state continuity under each clone profile
        run: node simulation/twinleaf/agent1-rank10-continuity.cjs > source-state-continuity-rank10.json
      - name: Report state changes between real actions
        run: node -e "const x=require('./source-state-continuity-rank10.json'); for (const y of x.findings) console.log(JSON.stringify({mode:y.mode,actions:y.actions,boundaryGaps:y.stateChangesBetweenActions,cardGaps:y.firstChanges.filter(z=>z.cardHistoryMismatch).length,policyMutations:y.policyMutations.length,policyCardChanges:y.policyMutations.filter(z=>z.cardHistoryMismatch).length,policySamples:y.policyMutations.slice(0,5)}));"
      - name: Archive source-state continuity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-state-continuity-rank10
          path: source-state-continuity-rank10.json
          if-no-files-found: warn
