name: Japanese Expanded historical legality checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify printing-specific legality matching
        run: python -m unittest tests/test_japanese_expanded_audit.py -v
      - name: Print Aichi ban identity findings
        run: python scripts/japanese_expanded_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Apex Alchemy Japanese 60-card print mapping and negative cases
        run: node --test tests/agent2-apex-jp-print-audit.test.cjs
      - name: Verify dated SM12a Basic Energy alternatives for all 60 physical slots
        run: node --test tests/agent2-apex-sm12a-release.test.cjs
