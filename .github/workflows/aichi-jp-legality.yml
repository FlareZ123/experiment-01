name: Japanese Expanded historical legality checks

on:
  push:
    branches: [main]
    paths:
      - 'simulation/twinleaf/agent9-jp-expanded-structure.cjs'
      - 'scripts/agent9-jp-expanded-source-audit.cjs'
      - 'tests/agent9-jp-expanded-structure.test.cjs'
      - '.github/workflows/aichi-jp-legality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify printing-specific legality matching
        run: python -m unittest tests/test_japanese_expanded_audit.py -v
      - name: Print Aichi ban identity findings
        run: python scripts/japanese_expanded_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Apex Alchemy Japanese 60-card print mapping and negative cases
        run: node --test tests/agent2-apex-jp-print-audit.test.cjs
      - name: Verify dated SM12a Basic Energy alternatives for all 60 physical slots
        run: node --test tests/agent2-apex-sm12a-release.test.cjs
      - name: Verify Japanese Expanded exact-print structural vetoes
        run: node --test tests/agent9-jp-expanded-structure.test.cjs
      - name: Audit all 29 original printed sixties against dated Japanese structural conditions
        run: node scripts/agent9-jp-expanded-source-audit.cjs > agent9-jp-expanded-source-audit.json
      - name: Print source-29 negative-screen summary
        run: >-
          node -e "const a=require('./agent9-jp-expanded-source-audit.json');
          console.log(JSON.stringify({authenticated:a.authenticatedDeckRows,
          missing:a.missingOriginalDecks,definiteViolations:a.observedDefiniteViolationDecks,
          unresolvedEnglishMetadataDecks:a.observedUnresolvedMetadataDecks,
          noPaperLegalityCertificates:a.paperLegalityCertifiedDecks===0,
          perRank:a.perRank}));"
      - name: Preserve original-29 exact-print unresolved and negative audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent9-aichi-japanese-structural-source29
          path: agent9-jp-expanded-source-audit.json
          if-no-files-found: warn
          retention-days: 30
