name: Agent36 one-game bilateral competence probe

on:
  workflow_dispatch:
    inputs:
      agent24_v8_perfection_260root:
        description: 'Same registered eight original v8 arms with bilateral copied Perfection and actual 260-root historical continuation'
        required: false
        type: boolean
        default: false
      agent24_perfection_energy_frontier:
        description: 'Same frozen eight v8 deals, Perfection plus source-independent actor-public Energy recipient frontier, 260-root development'
        required: false
        type: boolean
        default: false
      agent24_v8_bilateral_perfection:
        description: 'Historical original v8 eight-arm two-seat paid Perfection actor-root opt-in with owner prompt resolution'
        required: false
        type: boolean
        default: false
      agent7_known_dead_off_control:
        description: 'Development-only A-prime: disable shared bilateral known-dead attack preference'
        required: false
        type: boolean
        default: false
      agent7_bilateral_lillie_after_pass:
        description: 'Retrospective original-deal both-seat held Lillie on otherwise Pass'
        required: false
        type: boolean
        default: false
      agent43_box_fog_oneprize_after_pass:
        description: 'Historical one-deal both-seat generic held Box to one-Energy immediate KO'
        required: false
        type: boolean
        default: false
      agent36_v9_vip_aba:
        description: 'Fresh-seed bilateral common-policy A/B/A for inner owner VIP after Pass (240-root development only)'
        required: false
        type: boolean
        default: false
      agent36_v10b_paired_fresh_aba:
        description: 'Fresh-seed eight-context paired Champion/New Moon A/B/A across four ranks with reciprocal screens and fail-closed execution checks (260-root development only)'
        required: false
        type: boolean
        default: false
      agent3_owner_information_fallback_diagnostic:
        description: 'Phase-A-only diagnostic to capture the native owner-information fallback prompt; no treatment attribution'
        required: false
        type: boolean
        default: false
      agent36_v8_snap_trap_vertical_slice:
        description: 'Selected-v8 common-policy rank-3 Snap Trap owner-prompt integration vertical slice (two registered seeds, both seats, 260-root development only)'
        required: false
        type: boolean
        default: false
      agent36_v8_snap_trap_vertical_slice_v2:
        description: 'Strict selected-v8 Snap Trap owner-prompt audit; requires exact prompt settlement receipts, both source-seat settlements, and fails closed on unjoined prompt actions'
        required: false
        type: boolean
        default: false
      agent43_v8_snaptrap_owner_root_diagnostic:
        description: 'Capture actor-visible first unsupported root in both Snap Trap source-seat-one cases; development only'
        required: false
        type: boolean
        default: false
      agent2_rank11_quickball_attack_priority:
        description: 'Retrospective original rank11 source attack priority over Quick Ball, both physical seats'
        required: false
        type: boolean
        default: false
      agent2_crispin_vs_seeker_treasure_native:
        description: 'Staged native Crispin -> Mysterious Treasure -> VS Seeker -> Battle Compressor donor-selection sequence, both physical seats'
        required: false
        type: boolean
        default: false
      agent36_v10_fresh_aba:
        description: 'Single fixed New Moon candidate across four source ranks and both physical seats, with native settlement capture and fail-closed execution checks (260-root development only)'
        required: false
        type: boolean
        default: false
      agent20_box_fog_ace_trainer_aba:
        description: 'Same-deal A/B/A: Box/Fog baseline versus owner-only Ace Trainer before lethal Hidden Power'
        required: false
        type: boolean
        default: false
      agent2_retreat_funding_native:
        description: 'Run only Agent2 two-seat native attach to paid retreat to funded attack contract, no unrelated source games'
        required: false
        type: boolean
        default: false
      agent2_retreat_funding_original_source:
        description: 'Matched A/B original rank11/13 source replay, four original physical deals, two identical fixed sixties'
        required: false
        type: boolean
        default: false
      agent36_fresh_rank5_native:
        description: 'Four preregistered fresh rank5 original source native games, complete owner physical receipt tape; development only'
        required: false
        type: boolean
        default: false
      agent36_paper_root_native:
        description: 'Capture actual Store-root payment, owner prompts and complete physical 120-card custody for historical v8 panel; development only'
        required: false
        type: boolean
        default: false
      agent36_v3_predeal_preflight:
        description: 'Verify a frozen V3 pre-deal artifact against the current Actions run and committed blob; does not generate a deal or play a game'
        required: false
        type: boolean
        default: false
      agent36_v3_predeal_artifact_ref:
        description: 'Repository-relative committed V3 pre-deal artifact path (required when pre-deal preflight is enabled)'
        required: false
        type: string
        default: ''
      agent36_v3_fixture_game:
        description: "Run the same fixed candidate/opponent decks in both physical seat assignments; fixture-only, not competitive evidence."
        type: boolean
        required: false
        default: false
      physical_seed_disclosure_decision:
        description: 'Owner decision for public disclosure of the fixed physical game seed; private-host-only execution is not yet implemented.'
        required: false
        type: choice
        options:
          - not-authorized
          - public-reproducible
          - private-host-only
        default: not-authorized
      agent42_flittle_mcts_native_smoke:
        description: "Run bounded one-root Flittle MCTS Store-dispatch checks for both physical seats plus an out-of-envelope fallback; fixture-only, not competitive evidence."
        type: boolean
        required: false
        default: false
      contract_only:
        description: 'Run Agent34/Agent41, Agent49 policy protocol, and Agent36 Docker policy-worker contracts without compiling Twinleaf or executing a game'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: agent36-bilateral-competence-v9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-game-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Check out the pinned Twinleaf submodule
        if: ${{ !inputs.contract_only && !inputs.agent36_v3_predeal_preflight }}
        run: git submodule update --init --depth=1 vendor/twinleaf

      - name: Record exact pinned Twinleaf revision for V3 runner
        if: ${{ !inputs.contract_only && !inputs.agent36_v3_predeal_preflight }}
        run: echo "AGENT36_TWINLEAF_COMMIT_SHA=$(git -C vendor/twinleaf rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node runtime for contract-only tests
        if: ${{ inputs.agent36_v3_predeal_preflight || (inputs.contract_only && !inputs.agent36_v8_snap_trap_vertical_slice && !inputs.agent36_v8_snap_trap_vertical_slice_v2 && !inputs.agent2_crispin_vs_seeker_treasure_native) }}
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'

      - name: Enforce isolated V3 pre-deal preflight mode
        if: ${{ inputs.agent36_v3_predeal_preflight }}
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          node - <<'NODE'
          const inputs = JSON.parse(process.env.INPUTS_JSON);
          const allowed = new Set(['agent36_v3_predeal_preflight', 'agent36_v3_predeal_artifact_ref']);
          const conflicts = Object.entries(inputs)
            .filter(([key, value]) => !allowed.has(key) && value === true)
            .map(([key]) => key);
          if (conflicts.length) throw new Error('V3 pre-deal preflight is exclusive; conflicting mode inputs: ' + conflicts.join(', '));
          if (!inputs.agent36_v3_predeal_artifact_ref) throw new Error('agent36_v3_predeal_artifact_ref is required for V3 pre-deal preflight');
          NODE

      - name: Enforce isolated V3 fixture-game mode
        if: ${{ inputs.agent36_v3_fixture_game && (inputs.agent24_v8_perfection_260root || inputs.agent24_perfection_energy_frontier || inputs.agent24_v8_bilateral_perfection || inputs.agent7_known_dead_off_control || inputs.agent7_bilateral_lillie_after_pass || inputs.agent43_box_fog_oneprize_after_pass || inputs.agent36_v9_vip_aba || inputs.agent36_v10b_paired_fresh_aba || inputs.agent3_owner_information_fallback_diagnostic || inputs.agent36_v8_snap_trap_vertical_slice || inputs.agent36_v8_snap_trap_vertical_slice_v2 || inputs.agent43_v8_snaptrap_owner_root_diagnostic || inputs.agent2_rank11_quickball_attack_priority || inputs.agent2_crispin_vs_seeker_treasure_native || inputs.agent36_v10_fresh_aba || inputs.agent20_box_fog_ace_trainer_aba || inputs.agent2_retreat_funding_native || inputs.agent2_retreat_funding_original_source || inputs.agent36_fresh_rank5_native || inputs.agent36_paper_root_native || inputs.agent36_v3_predeal_preflight || inputs.contract_only || inputs.agent36_v3_predeal_artifact_ref != '' || inputs.agent42_flittle_mcts_native_smoke) }}
        run: |
          echo "agent36_v3_fixture_game must be the only selected workflow mode." >&2
          exit 1
      - name: Require explicit owner authorization for public physical-seed disclosure
        if: ${{ inputs.agent36_v3_fixture_game }}
        env:
          SEED_DISCLOSURE_DECISION: ${{ inputs.physical_seed_disclosure_decision }}
        run: |
          node - <<'NODE'
          const decision=process.env.SEED_DISCLOSURE_DECISION;
          if(decision!=='public-reproducible') {
            throw new Error('Fixture execution is blocked. Select public-reproducible only if public disclosure of the physical seed is explicitly acceptable; private-host-only is not implemented.');
          }
          NODE

      - name: Set up pinned Node runtime with native dependency cache
        if: ${{ !inputs.contract_only && !inputs.agent36_v3_predeal_preflight }}
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json

      - name: Enforce isolated Flittle MCTS native Store smoke mode
        if: ${{ inputs.agent42_flittle_mcts_native_smoke }}
        env:
          WORKFLOW_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          node - <<'NODE'
          const inputs = JSON.parse(process.env.WORKFLOW_INPUTS_JSON || '{}');
          const allowed = new Set(['agent42_flittle_mcts_native_smoke']);
          const conflicts = Object.entries(inputs)
            .filter(([name, value]) => !allowed.has(name) &&
              value !== false && value !== '' && value !== null && value !== undefined)
            .map(([name]) => name);
          if (conflicts.length) {
            throw new Error('agent42_flittle_mcts_native_smoke must be the only selected workflow mode: ' +
              conflicts.join(', '));
          }
          NODE

      - name: Validate owner-controlled V3 diagnostic recipient key before native fixture
        if: ${{ inputs.agent36_v3_fixture_game }}
        env:
          AGENT36_DIAGNOSTIC_PUBLIC_KEY_PEM: ${{ vars.AGENT36_DIAGNOSTIC_PUBLIC_KEY_PEM }}
        run: |
          node - <<'NODE'
          const crypto = require('node:crypto');
          const pem = process.env.AGENT36_DIAGNOSTIC_PUBLIC_KEY_PEM;
          if (typeof pem !== 'string' || pem.trim().length === 0) {
            throw new Error('Set repository variable AGENT36_DIAGNOSTIC_PUBLIC_KEY_PEM before running the private-state fixture.');
          }
          const key = crypto.createPublicKey(pem);
          const bits = key.asymmetricKeyDetails?.modulusLength;
          if (key.asymmetricKeyType !== 'rsa' || !Number.isInteger(bits) || bits < 2048) {
            throw new Error('V3 diagnostic recipient must be an RSA public key of at least 2048 bits.');
          }
          const fingerprint = crypto.createHash('sha256')
            .update(key.export({ type: 'spki', format: 'der' }))
            .digest('hex');
          console.log('V3 diagnostic recipient key validated; SHA-256 fingerprint: ' + fingerprint);
          NODE

      - name: Install and compile the pinned native server
        id: compile
        if: ${{ !inputs.contract_only && !inputs.agent36_v3_predeal_preflight }}
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      - name: Check research adapter and runner syntax
        run: |
          node --check simulation/twinleaf/agent24-funded-perfection-postpass-stratum.cjs
          node --check simulation/twinleaf/perfection-post-pass-probe.cjs
          node --check simulation/twinleaf/agent36-funded-perfection-pass-observer.cjs
          node --check simulation/evaluation/agent24-v8-bilateral-perfection-root-native.cjs
          node --check simulation/evaluation/agent24-v8-perfection-paired-native.cjs
          node --check simulation/evaluation/agent24-v8-perfection-260root-native.cjs
          node --check simulation/evaluation/agent24-v8-perfection-260root-pair-native.cjs
          node --check simulation/evaluation/agent24-v8-perfection-energy-frontier-260native.cjs
          node --check simulation/evaluation/agent24-v8-perfection-bench-funding-260native.cjs
          node --check simulation/twinleaf/agent24-early-perfection-recipient.cjs
          node --check simulation/evaluation/2026-11/agent36-perfection-prize-receipts.cjs
          node --check simulation/evaluation/2026-11/agent20-rank5-gengar-tempo-aba.cjs
          node --check simulation/twinleaf/agent47-shared-trubbish-family-owner-prompt.cjs
          node --check simulation/twinleaf/agent47-shared-motivate-owner-prompt.cjs
          node --check simulation/twinleaf/agent10-trubbish-fst-full-bench-paper-hook.cjs
          node --check simulation/twinleaf/agent1-actor-dead-first-attack-frontier.cjs
          node --check simulation/evaluation/agent36-issue25-common-v9-bilateral-competence.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/twinleaf/agent41-live-garbotoxin-ability-window.cjs
          node --check simulation/evaluation/agent36-issue25-common-v9-vip-aba.cjs
          node --check simulation/evaluation/agent36-issue25-common-v10-fresh-aba.cjs
          node --check simulation/evaluation/agent36-issue25-common-v10b-paired-fresh-aba.cjs
          node --check simulation/evaluation/agent3-owner-information-fallback-diagnostic.cjs
          node --check simulation/evaluation/agent10-owner-information-fallback-diagnostic-v2.cjs
          node --check simulation/evaluation/agent10-owner-information-fallback-diagnostic-v3.cjs
          node --check simulation/twinleaf/agent10-owner-prompt-zone-audit-v1.cjs
          node --check simulation/twinleaf/agent10-owner-prompt-metadata-observer-v1.cjs
          node --check simulation/evaluation/agent7-v9-bilateral-known-dead-retro.cjs
          node --check simulation/evaluation/agent7-v9-bilateral-lillie-pass-retro.cjs
          node --check simulation/twinleaf/agent43-owner-secretbox-fog-ko.cjs
          node --check simulation/twinleaf/agent36-secret-box-four-category-selector.cjs
          node --check simulation/twinleaf/agent36-secret-box-four-category-native.cjs
          node --check simulation/twinleaf/agent49-owner-direct-fog-one-energy-reply.cjs
          node --check simulation/twinleaf/agent49-owner-direct-fog-one-energy-native.cjs
          node --check simulation/twinleaf/agent15/owner-cursed-blast-prize-policy.cjs
          node --check simulation/twinleaf/agent15/owner-cursed-blast-native-probe.cjs
          node --check simulation/twinleaf/agent15/owner-cursed-blast-after-pass.cjs
          node --check simulation/evaluation/agent15/fresh-original-cursed-blast-native-pair.cjs
          node --check simulation/twinleaf/agent49-rank31-dusknoir-cursed-blast-native.cjs
          node --check simulation/evaluation/agent43-v9-box-fog-oneprize-native.cjs
          node --check simulation/evaluation/agent43-native-box-ko-postsettlement-audit.cjs
          node --check simulation/twinleaf/agent20-owner-pre-attack-ace-trainer.cjs
          node --check simulation/twinleaf/agent20-owner-pre-attack-ace-trainer-hook.cjs
          node --check simulation/evaluation/agent20-v9-box-fog-ace-trainer-aba.cjs
          node --check simulation/twinleaf/agent36/snap-trap-owner-prompt-evidence-v1.cjs
          node --check simulation/twinleaf/agent36/snap-trap-native-match-integration-v3.cjs
          node --check simulation/twinleaf/agent36/snap-trap-owner-prompt-policy-v2.cjs
          node --check simulation/twinleaf/agent30/stunfisk-snap-trap-prompt-marker-v3.cjs
          node --check simulation/evaluation/agent36-v8-snap-trap-vertical-slice-v1.cjs
          node --check simulation/evaluation/agent36-v8-snap-trap-vertical-slice-v2.cjs
          node --check simulation/evaluation/agent43-v8-snaptrap-owner-root-diagnostic.cjs
          node --check simulation/twinleaf/agent46-treasure-cleanup-native-observer.cjs
          node --check simulation/twinleaf/agent2-mysterious-treasure-crispin-vs-seeker-native.cjs
          node --check simulation/evaluation/agent2-v8-treasure-owner-root-optin.cjs
          node --check simulation/evaluation/agent49/treasure-payment-pair.cjs
          node --check simulation/twinleaf/agent49/treasure-payment-zone-observer.cjs
          node --check simulation/twinleaf/agent49/first-turn-regidrago-bench-funding.cjs
          node --check simulation/evaluation/agent49/regidrago-grass-placement-comparison.cjs
          node --check simulation/twinleaf/agent49/first-turn-crispin-seeker-recovery.cjs
          node --check simulation/evaluation/agent49/crispin-seeker-first-turn-registered.cjs
          node --check simulation/twinleaf/agent49/early-regidrago-compressor.cjs
          node --check simulation/evaluation/agent49/regidrago-first-turn-compressor-registered.cjs
          node --check simulation/twinleaf/agent2/treasure-owner-prompt-native.cjs
          node --check simulation/twinleaf/2026-11/agent2-retreat-funding-bridge.cjs
          node --check tests/2026-11/agent2-retreat-funding-two-action.native.test.cjs
          node --check simulation/evaluation/2026-11/agent2-retreat-funding-original-source.cjs
          node --check simulation/evaluation/agent36-fresh-rank5-native-paper-packet.cjs
          node --check tests/2026-11/agent2-retreat-funding-original-source.test.cjs
          node --check simulation/evaluation/2026-11/agent44-first-release-independent-bundle.cjs
          node --check tests/2026-11/agent45-agent44-v2-bundle-builder.test.cjs
          node --check simulation/evaluation/2026-11/agent36-v3-runner.cjs
          node --check simulation/evaluation/2026-11/agent49-native-fixture-game.cjs
          node --check simulation/twinleaf/2026-11/agent5-twinleaf-mcts-adapter.cjs
          node --check simulation/twinleaf/2026-11/agent36-flittle-mcts-root-provider.cjs
          node --check simulation/evaluation/2026-11/agent36-flittle-store-decklist-binding.cjs
          node --check tests/2026-11/agent36-flittle-mcts-root-provider.test.cjs
          node --check tests/2026-11/agent36-flittle-store-decklist-binding.test.cjs
          node --check tests/2026-11/agent42-flittle-mcts-native-store-smoke.test.cjs

      - name: Verify frozen registration, observer, owner evidence and bilateral gate controls
        if: ${{ !inputs.contract_only && !inputs.agent42_flittle_mcts_native_smoke && !inputs.agent2_retreat_funding_native && !inputs.agent2_retreat_funding_original_source && !inputs.agent36_v3_predeal_preflight && !inputs.agent36_v3_fixture_game && github.event_name != 'push' }}
        run: |
          node --test \
            tests/agent36-funded-perfection-pass-observer.test.cjs \
            tests/agent24-v8-bilateral-perfection-root-native.test.cjs \
            tests/agent24-v8-perfection-paired-native.test.cjs \
            tests/agent24-early-perfection-recipient.test.cjs \
            tests/agent30-known-perfection-options.test.cjs \
            tests/agent36-issue25-common-v9-bilateral-competence.test.cjs \
            tests/agent36-issue25-selected-v0.test.cjs \
            tests/agent41-bilateral-v2-development.test.cjs \
            tests/agent34-actor-only-root-policy.test.cjs \
            tests/agent41-natural-evolution-root-options.test.cjs \
            tests/agent41-live-garbotoxin-ability-window.test.cjs \
            tests/agent41-newmoon-blower-opportunity.test.cjs \
            tests/agent47-shared-trubbish-family-owner-prompt.test.cjs \
            tests/agent47-shared-motivate-owner-prompt.test.cjs \
            tests/agent10-trubbish-fst-full-bench-paper-hook.test.cjs \
            tests/agent10-pinned-trubbish-fst-full-bench-paper-hook.test.cjs \
            tests/agent10-owner-prompt-metadata-observer.test.cjs \
            tests/agent10-owner-prompt-zone-audit.test.cjs \
            tests/agent1-actor-dead-first-attack-frontier.test.cjs \
            tests/agent7-v9-bilateral-known-dead-retro.test.cjs \
            tests/agent12-actor-only-lillie-after-pass.test.cjs \
            tests/agent7-v9-bilateral-lillie-pass-retro.test.cjs \
            tests/agent43-owner-secretbox-fog-ko.test.cjs \
            tests/agent36-secret-box-four-category-selector.test.cjs \
            tests/agent36-secret-box-four-category-native.test.cjs \
            tests/agent49-owner-direct-fog-one-energy-reply.test.cjs \
            tests/agent49-owner-direct-fog-one-energy-native.test.cjs \
            tests/2026-11/agent15-owner-cursed-blast-prize-policy.test.cjs \
            tests/2026-11/agent15-owner-cursed-blast-native-probe.test.cjs \
            tests/2026-11/agent15-owner-cursed-blast-after-pass.test.cjs \
            tests/agent4-secret-box-paper-search-native.test.cjs \
            tests/agent43-native-box-ko-postsettlement-audit.test.cjs \
            tests/agent20-owner-pre-attack-ace-trainer.test.cjs \
            tests/agent16-issue25-canonical-vip-v11.native.test.cjs \
            tests/agent8-owner-telepathic-bench-search.native.test.cjs \
            tests/agent36-v8-owner-ability-policy.native.test.cjs \
            tests/agent36-issue25-common-v9-vip-aba.test.cjs \
            tests/agent36-issue25-common-v10-fresh-aba.test.cjs \
            tests/agent36-issue25-common-v10b-paired-fresh-aba.test.cjs \
            tests/2026-11/agent36-snap-trap-owner-prompt-evidence-v1.test.cjs \
            tests/2026-11/agent36-v8-snap-trap-vertical-slice-v1.test.cjs \
            tests/2026-11/agent2-treasure-owner-prompt.test.cjs \
            tests/agent49-mysterious-treasure-frontier.test.cjs \
            tests/2026-11/agent49-treasure-physical-zone-receipt.test.cjs \
            tests/2026-11/agent49-first-regidrago-grass-bench.test.cjs \
            tests/2026-11/agent49-first-crispin-seeker-recovery.test.cjs \
            tests/2026-11/agent49-early-regidrago-compressor.test.cjs \
            tests/2026-11/agent49-first-turn-item-native-witness.test.cjs \
            tests/2026-11/agent2-retreat-funding-two-action.native.test.cjs \
            tests/2026-11/agent36-v8-snap-trap-vertical-slice-v2.test.cjs tests/2026-11/agent36-snap-trap-owner-prompt-evidence-v1.test.cjs tests/2026-11/agent36-snap-trap-owner-prompt-evidence-v1.test.cjs

      - name: Verify Agent2 native two-action retreat funding in both physical seats
        if: ${{ !inputs.contract_only && inputs.agent2_retreat_funding_native }}
        run: node --test tests/2026-11/agent2-retreat-funding-bridge.test.cjs tests/2026-11/agent2-retreat-funding-actor-integration.test.cjs tests/2026-11/agent2-retreat-funding-two-action.native.test.cjs

      - name: Run matched original rank11/13 bilateral retreat-funding A/B
        if: ${{ !inputs.contract_only && inputs.agent2_retreat_funding_original_source && steps.compile.outcome == 'success' }}
        run: |
          node --test tests/2026-11/agent2-retreat-funding-original-source.test.cjs
          node simulation/evaluation/2026-11/agent2-retreat-funding-original-source.cjs

      - name: Check V3 fixture runner and policy closure syntax
        if: ${{ inputs.agent36_v3_fixture_game && steps.compile.outcome == 'success' }}
        run: |
          node --check simulation/evaluation/2026-11/agent36-v3-runner.cjs
          node --check simulation/evaluation/2026-11/agent49-native-fixture-game.cjs
          node --check simulation/evaluation/2026-11/agent49-fixture-scoped-runtime-pin.cjs
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/twinleaf/underworld-door-psychic-recipient-hook.cjs
          node --check simulation/evaluation/2026-11/agent1-private-diagnostic-envelope.cjs
      - name: Verify V3 fixture game, role composition, and source contracts
        if: ${{ inputs.agent36_v3_fixture_game && steps.compile.outcome == 'success' }}
        run: |
          node --test \
            tests/agent34-actor-only-root-policy.test.cjs \
            tests/agent36-v3-runner.test.cjs \
            tests/agent42-role-policy-identity.test.cjs \
