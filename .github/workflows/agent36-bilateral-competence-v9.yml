        env:
          AGENT36_V3_NO_GAME_WITNESS_RECEIPT: artifacts/prior-v3-acceptance/native-no-game-witness.json
          PRIOR_V3_ACCEPTANCE_DIR: artifacts/prior-v3-acceptance
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const directory = process.env.PRIOR_V3_ACCEPTANCE_DIR;
          const contract = JSON.parse(fs.readFileSync(directory + '/contract-only-acceptance.json', 'utf8'));
          const witness = JSON.parse(fs.readFileSync(process.env.AGENT36_V3_NO_GAME_WITNESS_RECEIPT, 'utf8'));
          const workerRuntimeContract = require('./simulation/evaluation/2026-11/agent36-docker-policy-worker.cjs');
          function verifyRuntimeReceipt(filename) {
            const runtime = JSON.parse(fs.readFileSync(filename, 'utf8'));
            assert.equal(runtime.schema, 'agent36-docker-policy-runtime-v2');
            assert.equal(runtime.imageRef, workerRuntimeContract.IMAGE_REF);
            assert.equal(runtime.imageDigest, workerRuntimeContract.IMAGE_DIGEST);
            assert.equal(runtime.platform, workerRuntimeContract.PLATFORM);
            assert.equal(runtime.nodeVersion, workerRuntimeContract.NODE_VERSION);
            assert.equal(runtime.dockerContext, 'default');
            assert.ok(String(runtime.dockerEndpoint).startsWith('unix://'));
