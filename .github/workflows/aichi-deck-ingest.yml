name: Validate Aichi published decks

on:
  workflow_dispatch:
    inputs:
      unassigned_itoko_code:
        description: 'Capture the publicly posted, official saved-deck 60 for rank-unassigned Itoko'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  ingest:
    if: ${{ !inputs.unassigned_itoko_code }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'filelock>=3.13,<4' 'scipy>=1.14,<2'
      - name: Probe official Japanese New Moon deck code and retain provenance
        run: python scripts/aichi_official_newmoon_deck.py
      - uses: actions/upload-artifact@v4
        with:
          name: new-moon-japanese-viewer-source
          path: results/als/deck-code-retrieval/new-moon-official-viewer.*
          if-no-files-found: error
          retention-days: 30
      - name: Validate official champion print parser without network
        run: python -m unittest discover -s tests -p 'test_aichi_champion_official_deck.py' -v
      - name: Capture official Aichi Open champion Japanese print identities
        run: python scripts/aichi_official_champion_deck.py
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-champion-official-japanese-print-source
          path: results/aichi-2026/official-champion-retrieval/champion-*
          if-no-files-found: error
          retention-days: 30
      - name: Test parser on deterministic fixtures
        run: python -m unittest discover -s tests -p 'test_ingest_aichi.py' -v
      - name: Validate simultaneous 32-placement evidence statistics
        run: python -m unittest discover -s tests -p 'test_aichi_evidence.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify official champion 33-print bilingual parity and dated ban screen
        run: node --test tests/aichi-champion-jp-audit.test.cjs
      - name: Check published registration identity including rank 22
        run: node --test tests/aichi-registration-fidelity.test.cjs
      - name: Verify missing-rank primary social-source fail-closed handling
        run: node --test tests/aichi-missing-rank-social-media.test.cjs
      - name: Assert New Moon Stadium source-field census
        run: node --test tests/aichi-new-moon-stadium-census.test.cjs
      - name: Verify exact New Moon twin-singleton rescue combinatorics
        run: node --test tests/new-moon-prize-access.test.cjs
      - name: Verify New Moon source English effect-equivalent print mapping
        run: node --test tests/new-moon-english-equivalents.test.cjs
      - name: Fetch and validate all 29 published full lists
        run: python scripts/ingest_aichi.py
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-published-name-level
          path: results/aichi-2026/published-name-level.json
          if-no-files-found: error
          retention-days: 30

  capture-unassigned-itoko:
    if: ${{ inputs.unassigned_itoko_code }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded public-source parser dependencies
        run: python -m pip install 'requests>=2.31,<3' 'filelock>=3.13,<4'
      - name: Verify rank-unassigned viewer parser on synthetic offline fixtures
        run: python -m unittest discover -s tests -p 'test_aichi_public_top32_deck_code.py' -v
      - name: Validate independent Japanese-photo and official-code 60-name comparisons
        run: node --test tests/aichi-natsumegu-photo-name-parity.test.cjs tests/aichi-itoko-official-rank27-name-parity.test.cjs
      - name: Capture one public primary Itoko saved-deck code without assigning rank
        run: python scripts/aichi_public_top32_deck_code.py
      - name: Preserve official viewer source HTML and unassigned print-60 inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-itoko-public-top32-japanese-printed60-unassigned
          path: |
            results/aichi-2026/public-top32-saved-deck-capture/itoko-official-viewer.html
            results/aichi-2026/public-top32-saved-deck-capture/itoko-japanese-printed60.json
          if-no-files-found: warn
          retention-days: 30
