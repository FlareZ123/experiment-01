name: Aichi Budew direct-opening audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/aichi_budew_opening.test.cjs
      - run: node scripts/aichi_budew_opening.cjs
      - name: Verify Floette first-three-turn hand-only access
        run: node --test tests/mega-floette-direct-window.test.cjs
      - name: Print exact Floette direct Energy-attachment window
        run: node scripts/mega-floette-direct-window.cjs
