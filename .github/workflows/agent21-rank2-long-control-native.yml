name: Agent21 rank2 full-original 60s long control replay

on:
  workflow_dispatch:
    inputs:
      root_cap:
        description: 'Read-only retrospective genuine Store cap (260 or 640)'
        type: choice
        options: ['260', '640']
        default: '640'
      anti_deckout_shuffles:
        description: 'Enable Agent17 owner-only late Iono/Marnie/Lillie deck-preservation treatment (historical seeds, action-changing)'
        type: boolean
        default: false
      pre_attack_deckout_shuffles:
        description: 'Enable Agent17 deck-preservation before native AttackAction also; implies late Pass rescue'
        type: boolean
        default: false
      early_forest_seal:
        description: 'Enable candidate-owned early physical Forest Seal Stone and Star Alchemy pilot'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  original-rank2-both-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Get exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Regress owner-only early Stone and deckout policy hooks
        run: node --test tests/2026-11/agent17-deckout-rescue-selector.test.cjs tests/2026-11/agent17-before-attack-deckout-native.test.cjs tests/2026-11/agent17-early-forest-seal-root.test.cjs tests/2026-11/agent17-forest-seal-vstar-native-witness.test.cjs
      - name: Replay original Vileplume rank2 seed and physical source pairs
        env:
          AGENT21_RANK2_ROOT_CAP: ${{ inputs.root_cap }}
          AGENT17_RANK2_DECKOUT_RESCUE: ${{ inputs.anti_deckout_shuffles }}
          AGENT17_RANK2_PRE_ATTACK_RESCUE: ${{ inputs.pre_attack_deckout_shuffles }}
          AGENT17_RANK2_EARLY_FSS: ${{ inputs.early_forest_seal }}
        run: node simulation/evaluation/2026-11/agent21-rank2-long-control-native.cjs
      - name: Archive all four real native roots and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent21-rank2-original-60-horizon-replays
          path: |
            agent21-rank2-original-long-native.json
            agent17-rank2-anti-deckout-native.json
            agent17-rank2-pre-attack-rescue-native.json
            agent17-rank2-early-fss-native.json
          if-no-files-found: warn
          retention-days: 21
