name: Aichi 2026 English card coverage audit

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit validated audit results
        type: boolean
        default: false
      native_print_release_census:
        description: 'Pinned CardManager all-32 exact-native-printing census, no gameplay'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  card-coverage:
    if: ${{ !inputs.native_print_release_census }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install file lock library
        run: python -m pip install filelock
      - name: Audit card identifiers
        run: python scripts/aichi_card_audit.py
      - name: Verify attack-granting Tool source resolver
        run: python tests/test_aichi_tool_attack_inventory.py
      - name: Print source-resolved attack-granting Tool field inventory
        run: python scripts/aichi_tool_attack_inventory.py
      - name: Test rule-box Ability eligibility under Iron Thorns Initialization
        run: |
          node --test tests/aichi-initialization-potential-census.test.cjs
          node -e "const x=require('./scripts/aichi-initialization-potential-census.cjs').run();console.log(JSON.stringify({published:x.published,noTarget:x.noTarget,evolutionOnly:x.evolutionOnly,basicPossible:x.basicPossible.length}))"
      - name: Screen exact Aichi donor attack-name collisions
        run: node scripts/aichi-copy-donor-name-collision-screen.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-card-coverage
          path: results/aichi-2026/card-coverage.json
          retention-days: 30
      - name: Preserve verified audit
        if: inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/aichi-2026/card-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 1: Preserve Aichi card-data coverage findings"
            for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          fi

  actual-native-print-census:
    if: ${{ inputs.native_print_release_census }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned card-manager implementation
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run original source exact-native-printing census
        run: node simulation/evaluation/agent49-pinned-source-print-census.cjs
      - name: Verify real pinned Store Player's Ceremony hook on both physical seats
        run: node --test tests/agent49-native-players-ceremony-store.test.cjs
      - name: Verify original rank7 PRC60 variant selects Omega Barrier native printed power
        run: node --test tests/agent49-native-prc60-omega-barrier-identity.test.cjs
      - name: Stage public Wondrous attack-cost contrast on both actual native seats
        run: node simulation/twinleaf/agent49-wondrous-native-root-parity.cjs > agent49-wondrous-native-root-parity.json
      - name: Archive staged native Wondrous versus baseline action receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-wondrous-native-root-parity
          path: agent49-wondrous-native-root-parity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Archive all 32 original native print and resolution statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-original-native-print-coverage
          path: agent49-pinned-source-native-print-coverage.json
          if-no-files-found: warn
          retention-days: 30
