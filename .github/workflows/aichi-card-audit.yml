name: Aichi 2026 English card coverage audit

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit validated audit results
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  card-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install file lock library
        run: python -m pip install filelock
      - name: Audit card identifiers
        run: python scripts/aichi_card_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-card-coverage
          path: results/aichi-2026/card-coverage.json
          retention-days: 30
      - name: Preserve verified audit
        if: inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/aichi-2026/card-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 1: Preserve Aichi card-data coverage findings"
            git push origin HEAD:main
          fi
