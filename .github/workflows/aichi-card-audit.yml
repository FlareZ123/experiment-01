name: Aichi 2026 English card coverage audit

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit validated audit results
        type: boolean
        default: false
      native_print_release_census:
        description: 'Pinned CardManager all-32 exact-native-printing census, no gameplay'
        type: boolean
        default: false
      native_treasure_pair:
        description: 'Add four bounded original-rank10 versus rank1 Treasure policy feasibility matches'
        type: boolean
        default: false
      agent12_adp_strict_screen:
        description: 'Opt-in immutable ADP strict two-turn and original-29 HP threshold verification, no gameplay'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  adp-strict-physical:
    if: ${{ inputs.agent12_adp_strict_screen }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original-manifest locked double-Thorton and Pokégear T2 resource gates
        run: |
          python scripts/agent12_adp_double_thorton_strict_chain.py
          python scripts/agent12_adp_pokegear_exact_supporter.py
          python scripts/agent12_adp_t1_gear_t2_exact.py
      - name: Independently validate fixed ADP T1 Gear route with three million physical shuffled sixties
        run: python scripts/agent12_adp_t1_gear_t2_montecarlo.py
      - name: Verify R-starter donor conservation and exact first-and-second Pokégear extensions
        run: |
          python scripts/agent12_adp_regv_starter_compressor_donor_exact.py
          python scripts/agent12_adp_regv_starter_t1_t2_gear_exact.py
      - name: Crosscheck R-starter donor route on three million independently shuffled decks
        run: python scripts/agent12_adp_regv_starter_donor_physical.py
      - name: Independently check R-starter two-turn Gear routes and physical Ultra payments
        run: python scripts/agent12_adp_regv_starter_t1_t2_gear_physical.py
      - name: Verify disjoint ADP-held Quick Ball to Tapu Lele to Thorton exact probabilities
        run: python scripts/agent12_adp_regv_held_adp_quickball_lele_exact.py
      - name: Independently sample two million ADP-held Quick Ball to Tapu Lele physical deals
        run: python scripts/agent12_adp_regv_held_adp_quickball_lele_physical.py
      - name: Verify original-29 printed HP thresholds and Goodra Rolling Iron defensive exception
        run: |
          node tests/agent12-adp-wildblaze-ryunoglide-original29-hp-gap.sft.cjs
          node tests/agent12-adp-goodra-rollingiron-ryuno-damage-threshold.sft.cjs

  card-coverage:
    if: ${{ !inputs.native_print_release_census && !inputs.agent12_adp_strict_screen }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install file lock library
        run: python -m pip install filelock
      - name: Audit card identifiers
        run: python scripts/aichi_card_audit.py
      - name: Verify attack-granting Tool source resolver
        run: python tests/test_aichi_tool_attack_inventory.py
      - name: Print source-resolved attack-granting Tool field inventory
        run: python scripts/aichi_tool_attack_inventory.py
      - name: Test rule-box Ability eligibility under Iron Thorns Initialization
        run: |
          node --test tests/aichi-initialization-potential-census.test.cjs
          node -e "const x=require('./scripts/aichi-initialization-potential-census.cjs').run();console.log(JSON.stringify({published:x.published,noTarget:x.noTarget,evolutionOnly:x.evolutionOnly,basicPossible:x.basicPossible.length}))"
      - name: Verify exact owner-hand Trainer discard contention without native games
        run: node --test tests/agent27-owner-trainer-discard-contention.test.cjs tests/agent27-original-field-trainer-payment-coverage.test.cjs tests/agent27-owner-trainer-payment-observer.test.cjs tests/agent27-source-trainer-cardtext-cost-audit.test.cjs
      - name: Verify owner-public Tool and Stadium removal targets against printed paper costs
        if: ${{ always() && !cancelled() }}
        run: node --test tests/agent6-public-removal-target-certificate.test.cjs tests/agent6-actor-observation-removal-contract.test.cjs
      - name: Verify all 29 original Basic-conditioned first-turn Item and Trainer holdings
        run: |
          node --test tests/2026-11/agent17-field-firstturn-trainer-access.test.cjs
          node scripts/agent17-field-firstturn-trainer-access.cjs > agent17-field-firstturn-trainer-access.json
          node -e "const r=require('./agent17-field-firstturn-trainer-access.json'); console.log(JSON.stringify({version:r.version,sourceManifestSha256:r.sourceManifestSha256,copiesByType:r.copiesByType,rows:r.rows.map(x=>({rank:x.rank,basics:x.basicCopies,item:x.Item,supporter:x.Supporter,first7ItemPercent:Number((100*x.firstSeven.anyItem.probability).toFixed(5)),first8ItemPercent:Number((100*x.firstEight.anyItem.probability).toFixed(5)),first7TrainerPercent:Number((100*x.firstSeven.anyTrainer.probability).toFixed(5))}))},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: agent17-original29-opening-trainer-holdings
          path: agent17-field-firstturn-trainer-access.json
          retention-days: 30
      - name: Verify source rank13 dual search connector opening arithmetic
        run: |
          node --test tests/agent49-rank13-dual-connector-openers.test.cjs
          node scripts/agent49-rank13-dual-connector-openers.cjs
      - name: Screen exact Aichi donor attack-name collisions
        run: node scripts/aichi-copy-donor-name-collision-screen.cjs
      - name: Verify exact G&H and Artazon Prize-aware source access
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent32-gh-prize-search-window.test.cjs tests/agent32-gh-artazon-prize-window.test.cjs tests/agent32-gh-artazon-slot-sensitivity.test.cjs tests/agent32-gh-artazon-bonus-cards.test.cjs
          node simulation/evaluation/agent32-gh-artazon-prize-window.cjs
          node simulation/evaluation/agent32-gh-artazon-slot-sensitivity.cjs
          node simulation/evaluation/agent32-gh-artazon-bonus-cards.cjs
      - name: Verify fixed ADP v2 first-GX opening and Prize access
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent32-adp-first-gx-physical-window.test.cjs tests/agent32-adp-switch-first-gx-physical-window.test.cjs
          node simulation/evaluation/agent32-adp-first-gx-physical-window.cjs
          node simulation/evaluation/agent32-adp-switch-first-gx-physical-window.cjs
      - name: Verify original-29 printed Basic subtypes and simultaneous mulligan offer arithmetic
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent32-adp-field-mulligan-offers.test.cjs
          node simulation/evaluation/agent32-adp-field-mulligan-offers.cjs
      - name: Verify ADP versus rank1 equal-field bilateral mulligan exposure
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent32-adp-vs-champion-mulligan-delta.test.cjs
          node simulation/evaluation/agent32-adp-vs-champion-mulligan-delta.cjs
      - name: Verify ADP fixed-v2 hypothetical one-slot access and source-29 mulligan gradient
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent32-adp-one-slot-first-gx-sensitivity.test.cjs
          node simulation/evaluation/agent32-adp-one-slot-first-gx-sensitivity.cjs
      - name: Verify actual original mulligan bonus cards in exact ADP first-GX screen
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent32-adp-mulligan-bonus-firstgx.test.cjs
          node simulation/evaluation/agent32-adp-mulligan-bonus-firstgx.cjs 32 > agent32-adp-mulligan-bonus-firstgx.json
          node -e "const r=require('./agent32-adp-mulligan-bonus-firstgx.json'); console.log(JSON.stringify({version:r.version,source:r.fixedSourceSha,base:r.baseAccess.percent,mean:r.equalOriginalMean,rank6:r.rows.find(x=>x.rank===6),rank1:r.rows.find(x=>x.rank===1)}))"
      - name: Verify fixed ADP and champion forced solo opening against original29
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent32-adp-forced-solo-opening-originals.test.cjs
          node simulation/evaluation/agent32-adp-forced-solo-opening-originals.cjs 32 > agent32-forced-solo.json
          node -e "const x=require('./agent32-forced-solo.json'); console.log(JSON.stringify({version:x.version,mean:x.equalOriginalMeanLower,rank26:x.rows.find(r=>r.rank===26),rank6:x.rows.find(r=>r.rank===6)}))"
      - name: Verify rank2 physical TM source access under simultaneous original opponent mulligans
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent40-rank2-mulligan-bonus-tm-screen.test.cjs
          node simulation/evaluation/agent40-rank2-mulligan-bonus-tm-screen.cjs 200000 16
      - name: Verify genuine rank2 versus opposing original Guzma and Bench resource conjunction
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent40-rank2-vs-guzma-physical-counterwindow.test.cjs
          node simulation/evaluation/agent40-rank2-vs-guzma-physical-counterwindow.cjs 200000 16
      - name: Verify exact original rank6 Thorns Speed DCE and Guzma direct opener
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent40-rank6-turn3-guzma-volt-physical.test.cjs
          node simulation/evaluation/agent40-rank6-turn3-guzma-volt-physical.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-card-coverage
          path: results/aichi-2026/card-coverage.json
          retention-days: 30
      - name: Preserve verified audit
        if: inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/aichi-2026/card-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 1: Preserve Aichi card-data coverage findings"
            for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          fi

  actual-native-print-census:
    if: ${{ inputs.native_print_release_census }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned card-manager implementation
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run original source exact-native-printing census
        run: node simulation/evaluation/agent49-pinned-source-print-census.cjs
      - name: Calculate original Regidrago seven-card Treasure donor opportunity exactly
        run: node simulation/evaluation/agent49-regidrago-treasure-openers.cjs
      - name: Bounded four original Regidrago versus Calyrex source feasibility matches
        if: ${{ inputs.native_treasure_pair }}
        timeout-minutes: 3
        run: node simulation/evaluation/agent49-treasure-original-regidrago-match.cjs
      - name: Verify real pinned Store Player's Ceremony hook on both physical seats
        run: node --test tests/agent49-native-players-ceremony-store.test.cjs
      - name: Verify original rank7 PRC60 variant selects Omega Barrier native printed power
        run: node --test tests/agent49-native-prc60-omega-barrier-identity.test.cjs
      - name: Probe real owner-first Mysterious Treasure Item prompt both seats
        run: node simulation/twinleaf/agent49-mysterious-treasure-native-probe.cjs
      - name: Verify native Jet Bench switch and printed attack under both physical seats
        run: node --test tests/agent40-native-jet-bench-switch.test.cjs
      - name: Genuine rank2 Bunnelby Jet promotion, TM equip, Omega Barrage double evolution both native seats
        run: node --test tests/agent40-native-bunnelby-tm-jet-chain.test.cjs
      - name: Verify Regidrago Dragon donor discard and owner-deck VSTAR retrieval both native seats
        run: node --test tests/agent49-native-regidrago-treasure-line.test.cjs
      - name: Prove both-seat owner-private Mysterious Treasure typed native cost/search prompt bridge
        run: node --test tests/agent49-owner-treasure-native-prompt-bridge.test.cjs
      - name: Verify original rank13 pre-board Treasure native paid V search both seats
        run: node --test tests/agent49-native-registered-treasure-preboard.test.cjs
      - name: Compare two physical rank13 Item payments and different search reach both seats
        run: node --test tests/agent49-rank13-dual-connector-native.test.cjs
      - name: Stage shared actor BUS paid Energy retreat and native opposing Basic attack veto
        if: ${{ always() && !cancelled() }}
        run: node --test tests/agent40-native-bus-lock-position-root.test.cjs
      - name: Stage original rank2-derived Bunnelby double-TM then next-turn Exeggutor Blockade continuation
        if: ${{ always() && !cancelled() }}
        run: node --test tests/agent40-native-bunnelby-exeggutor-blockade-continuation.test.cjs
      - name: Verify exact direct-only two-turn Exeggutor Jet access combinatorics
        if: ${{ always() && !cancelled() }}
        run: |
          node --test tests/agent40-exeggutor-direct-two-turn-access.test.cjs
          node simulation/evaluation/agent40-exeggutor-direct-two-turn-access.cjs
      - name: Verify actor-visible Blockade continuation beats generic payable Burrow
        if: ${{ always() && !cancelled() }}
        run: node --test tests/agent40-owner-blockade-continuation.test.cjs
      - name: Stage public Wondrous attack-cost contrast on both actual native seats
        run: node simulation/twinleaf/agent49-wondrous-native-root-parity.cjs > agent49-wondrous-native-root-parity.json
      - name: Archive staged native Wondrous versus baseline action receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-wondrous-native-root-parity
          path: agent49-wondrous-native-root-parity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Archive all 32 original native print and resolution statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-original-native-print-coverage
          path: agent49-pinned-source-native-print-coverage.json
          if-no-files-found: warn
          retention-days: 30
