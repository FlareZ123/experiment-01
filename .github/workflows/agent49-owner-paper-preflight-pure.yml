name: Agent49 owner registered-60, native-whiff and proxy legality pure contracts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent49-owner-paper-preflight-pure
  cancel-in-progress: false

jobs:
  pure-research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner K0/K1 rules, registered source and printed identity
        run: |
          node --version
          node --test tests/agent49-owner-bulk-hand-transitions.test.cjs tests/agent49-original-field-box-fog-hard-coverage.test.cjs tests/agent49-original-field-box-fog-hook-unfillable-plan.test.cjs tests/agent49-owner-original-60-plan-gate.test.cjs tests/agent49-visible-owner-deck-exhaustion-gate.test.cjs tests/agent49-supporter-usage-count-k1-preflight.test.cjs tests/agent49-newmoon-expanded-ban-print-audit.test.cjs tests/agent49-native-owner-search-whiff-fallback.test.cjs tests/agent49-original-field-box-recovery-unown-structural.test.cjs tests/agent49-owner-direct-fog-one-energy-reply.test.cjs

      - name: Prevent immediate-Prize-only optimization from hiding two-hit carryover
        run: node --test tests/2026-11/agent43-native-attack-damage-carryover.test.cjs
      - name: Generate reproducible all-root native paper-audit worklists
        run: node --test tests/2026-11/agent43-original-source-allroot-paper-worklist.test.cjs
      - name: Regress independently reviewed paper outcome versus adversarial competence
        run: node --test tests/2026-11/agent43-independent-outcome-competence-v2.test.cjs
      - name: Regress preregistered untimed and Aichi event admission modes
        run: node --test tests/2026-11/agent43-independent-outcome-competence-v3.test.cjs
      - name: Regress Agent27 to Agent45 Aichi clock bridge and natural-tie stage rules
        run: node --test tests/2026-11/agent27-agent45-aichi-clock-bridge.test.cjs
      - name: Regress prospective V3 policy registration and complete-game bundle assembly
        run: node --test tests/2026-11/agent44-v3-game-bundle-builder.test.cjs tests/2026-11/agent44-actions-metadata-receipts.test.cjs
      - name: Regress seat-scoped role policy composition
        run: node --test tests/agent34-actor-only-root-policy.test.cjs
      - name: Regress Agent36 V3 role runner and Actions metadata receipts
        run: node --test tests/agent36-v3-runner.test.cjs
      - name: Regress V3 role identity, module closure and application receipt bindings
        run: node --test tests/agent42-role-policy-identity.test.cjs
      - name: Regress explicitly non-admitting fixture-scoped role pin
        run: node --test tests/2026-11/agent49-fixture-scoped-runtime-pin.test.cjs
      - name: Regress deterministic native Store fixture game loop with injected Twinleaf interfaces
        run: node --test tests/2026-11/agent49-native-fixture-game.test.cjs
      - name: Regress sanitized-only V3 diagnostic boundary projection and setup privacy
        run: node --test tests/2026-11/agent2-v3-sanitized-diagnostic.test.cjs
