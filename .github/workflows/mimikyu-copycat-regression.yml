name: Mimikyu Apex Dragon copycat regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aichi-copycat-regression
  cancel-in-progress: false

jobs:
  copycat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate copycat metadata bug and research-side hook
        run: node --test tests/mimikyu_apex_copycat.test.cjs
      - name: Validate nested Copycat to Apex Dragon to Timeless-GX effects
        run: node simulation/twinleaf/mimikyu-apex-integration.cjs

      - name: Observe real Apex Dragon AttackAction last-attack identity
        run: node simulation/twinleaf/apex-declared-history-test.cjs

      - name: Prove two declared Regidrago and Mimikyu attacks across turn
        run: node simulation/twinleaf/regidrago-to-mimikyu-two-attack.cjs

      - name: Verify actual Timeless-GX bonus-turn transition
        run: node simulation/twinleaf/regidrago-to-mimikyu-two-attack.cjs --verify-bonus

      - name: Exercise declared Copycat AttackAction and nested GX prompt
        run: node simulation/twinleaf/mimikyu-apex-action-test.cjs

      - name: Characterize printed-280HP Fairy Zone Copycat KO and Prize handling
        run: node simulation/twinleaf/mimikyu-apex-action-test.cjs --printed-ko

      - name: Verify champion co-builder staged Timeless and bonus Power Beam chain
        run: node simulation/twinleaf/champion-copycat-power-beam-contract.cjs

      - name: Verify reversible headless Copycat flags and cleanup
        run: node --test tests/mimikyu-headless-hook-options.test.cjs

      - name: Verify research Mimikyu counterpolicy uses only public source-state actions
        run: node --test tests/mimikyu-counter-policy.test.cjs

      - name: Inspect spent GX allowance on nested copied Timeless-GX
        run: node simulation/twinleaf/mimikyu-gx-reuse-probe.cjs

      - name: Characterize stale Copycat attack after intervening pass
        run: node simulation/twinleaf/mimikyu-stale-attack.cjs
