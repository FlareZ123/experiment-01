name: Agent45 pinned CES48 Extra Energy Bomb prompt validator audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent45-ces48-bomb-prompt-native
  cancel-in-progress: false
jobs:
  native-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify opt-in offline full-state trace and headless integration contract
        run: |
          node --check simulation/twinleaf/2026-11/agent45/full-state-trace.cjs
          node --check simulation/twinleaf/headless.cjs
          node --test tests/2026-11/agent45/full-state-trace.test.cjs
      - name: Native CES48 Extra Energy Bomb prompt validator characterization
        run: node --test tests/agent45-electrode-energy-bomb-prompt-contract.native.test.cjs
