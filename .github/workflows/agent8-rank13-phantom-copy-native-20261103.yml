name: Agent8 source Regidrago Phantom Dive native choice

on:
  workflow_dispatch:
    inputs:
      study:
        description: Registered native policy comparison
        required: true
        type: choice
        default: retrospective
        options:
          - retrospective
          - prospective
          - pure-only
          - retrospective-established
          - prospective-established
          - retrospective-compressor

permissions:
  contents: read

jobs:
  original-source-phantom-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate prospective registration before engine checkout
        if: ${{ inputs.study == 'prospective' || inputs.study == 'pure-only' }}
        run: node simulation/evaluation/agent8-rank13-public-copy-preflight.cjs
      - name: Validate retrospectively selected funded-VSTAR seed plan
        if: ${{ inputs.study == 'retrospective-established' }}
        run: node simulation/evaluation/agent8-established-quickball-preflight.cjs
      - name: Validate new source-owner 24-pair registered seed plan
        if: ${{ inputs.study == 'prospective-established' }}
        run: node simulation/evaluation/agent8-established-quickball-prospective-preflight.cjs
      - name: Preflight original source Regidrago Compressor retrospective registration
        if: ${{ inputs.study == 'retrospective-compressor' }}
        run: node simulation/evaluation/agent8-funded-apex-compressor-preflight.cjs
      - name: Precompile public native seam and archive auditor regression
        run: node --test tests/agent8-public-flat-copy-turns.test.cjs tests/agent8-public-flat-copy-native-seam.test.cjs tests/agent8-rank13-public-copy-native-audit.test.cjs tests/agent8-established-regidrago-quickball.test.cjs tests/agent8-rank13-opening-conjunction-dp.test.cjs tests/agent8-funded-apex-compressor-owner-bridge.test.cjs tests/agent8-funded-apex-compressor-store-identity.test.cjs tests/planning/owner-hand-discard-pareto.test.cjs tests/agent13-actor-only-choose-attack.test.cjs
      - name: Restore pinned Twinleaf
        if: ${{ inputs.study != 'pure-only' }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native engine dependencies
        if: ${{ inputs.study != 'pure-only' }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        if: ${{ inputs.study != 'pure-only' }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify public source Apex attack root
        if: ${{ inputs.study != 'pure-only' }}
        run: node --test tests/agent8-rank13-source-apex-attack-frontier.test.cjs
      - name: Verify source-only offered native Phantom choice
        if: ${{ inputs.study != 'pure-only' }}
        run: node --test tests/agent8-rank13-native-copy-choice.test.cjs
      - name: Verify public flat copied-attack heuristic
        if: ${{ inputs.study != 'pure-only' }}
        run: node --test tests/agent8-public-flat-copy-turns.test.cjs tests/agent13-actor-only-choose-attack.test.cjs
      - name: Compare physical source Noivern versus Dragapult copied attack
        if: ${{ inputs.study == 'retrospective' }}
        env:
          AGENT8_PHANTOM_CHOICE_JSON: agent8-original13-phantom-copy-native.json
        run: node simulation/evaluation/agent8-rank13-phantom-dive-choice-native.cjs
      - name: Run prospectively registered public copied-attack policy
        if: ${{ inputs.study == 'prospective' }}
        env:
          AGENT8_PUBLIC_COPY_RESULT_JSON: agent8-rank13-public-copy-native.json
        run: node simulation/evaluation/agent8-rank13-public-copy-prospective-native.cjs
      - name: Run retrospectively registered established Quick Ball owner root
        if: ${{ inputs.study == 'retrospective-established' }}
        env:
          AGENT8_ESTABLISHED_QUICKBALL_RESULT_JSON: agent8-established-quickball-native.json
        run: node simulation/evaluation/agent8-established-quickball-retrospective-native.cjs
      - name: Run 24 independent source owner late donor Quick Ball pairs
        if: ${{ inputs.study == 'prospective-established' }}
        env:
          AGENT8_ESTABLISHED_PROSPECTIVE_JSON: agent8-established-quickball-prospective-native.json
        run: node simulation/evaluation/agent8-established-quickball-prospective-native.cjs
      - name: Run original source funded Apex Compressor native A/B/A
        if: ${{ inputs.study == 'retrospective-compressor' }}
        env:
          AGENT8_FUNDED_COMPRESSOR_JSON: agent8-funded-apex-compressor-retrospective-native.json
        run: node simulation/evaluation/agent8-funded-apex-compressor-retrospective-native.cjs
      - name: Upload full native source attack settlements
        if: ${{ always() && inputs.study != 'pure-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent8-rank13-phantom-dive-native-comparison
          path: |
            agent8-original13-phantom-copy-native.json
            agent8-rank13-public-copy-native.json
            agent8-established-quickball-native.json
            agent8-established-quickball-prospective-native.json
            agent8-funded-apex-compressor-retrospective-native.json
          if-no-files-found: warn
          retention-days: 30
