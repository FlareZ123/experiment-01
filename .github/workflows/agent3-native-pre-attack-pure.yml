name: Agent 3 native pre-attack public board pure regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent3-native-pre-attack-pure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout research modules without Twinleaf
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public board join and original-source printed nominal screen
        run: node --test tests/agent3-native-pre-attack-public-board-join.test.cjs tests/agent3-v28-public-attack-damage-screen.test.cjs tests/agent3-mimikyu-copycat-eon-blade-eligibility.test.cjs
