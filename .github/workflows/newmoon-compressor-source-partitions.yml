name: New Moon Compressor fixed source partitions

on:
  workflow_dispatch:
    inputs:
      partition:
        description: 'Predeclared rank-11 repeat subset; four runs cover repeats 0 through 11'
        required: true
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      common_bilateral_compressor_development:
        description: 'Run original canonical historical rank6/rank11 four arms with common owner-Compressor opt-in; unqualified'
        required: false
        type: boolean
        default: false
      benched_payload_retrospective:
        description: 'Separately replay historical rank11 repeat1 with opt-in benched-Mewtwo donor preparation'
        required: false
        type: boolean
        default: false
      agent47_owner_fogcrystal_audit:
        description: 'Read-only legal owner-deck search targets and actual Fog Crystal choices on historical rank11 repeat1'
        required: false
        type: boolean
        default: false
      owner_compressor_opportunity_audit:
        description: 'Read-only actor-hand/Mewtwo positioning opportunity audit in same canonical rank6/rank11 historical four arms'
        required: false
        type: boolean
        default: false

      agent9_sourcefirst_lock_transfer:
        description: Retrospective actual source-first held-Shake pressure through canonical bilateral policies
        required: false
        type: boolean
        default: false
      agent41_sourcefirst_ability_window:
        description: 'Read-only actual source-first Garbotoxin suppression versus Field Blower, same historical seed'
        required: false
        type: boolean
        default: false
      agent6_source_pass_hand:
        description: 'Retrospective source owner hand at genuine rank11 turn22 Pass, no strategy inference'
        required: false
        type: boolean
        default: false
      common_bilateral_late_compressor_development:
        description: 'Historical later owner donor setup development only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Fast research syntax and regression gate before engine compilation
        run: |
          node --test tests/check-cjs-syntax.test.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/evaluation/agent9-rank11-sourcefirst-lock-transfer.cjs
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test canonical shared policy and owner-Compressor opt-in contract
        if: inputs.common_bilateral_compressor_development
        run: node --test tests/agent41-bilateral-common-policy.test.cjs tests/agent41-bilateral-v2-development.test.cjs tests/new-moon-compressor-payload-policy.test.cjs
      - name: Replay unchanged historical four-arm baseline under same revision
        if: inputs.common_bilateral_compressor_development
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-bilateral-baseline.json
      - name: Replay same four source physical deals with common owner-Compressor policy
        if: inputs.common_bilateral_compressor_development
        env:
          AGENT5_COMMON_COMPRESSOR_DEV: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-bilateral-compressor.json
      - name: Validate all eight attempts, original source physical deals and per-arm results
        if: inputs.common_bilateral_compressor_development
        run: >-
          node -e "const assert=require('node:assert/strict');
          const a=require('./agent5-bilateral-baseline.json');
          const b=require('./agent5-bilateral-compressor.json');
          assert.equal(a.rows.length,4);assert.equal(b.rows.length,4);
          assert.equal(a.ownerCompressorPayloadOptIn,false);
          assert.equal(b.ownerCompressorPayloadOptIn,true);
          for(let i=0;i<4;i++){
            const x=a.rows[i],y=b.rows[i];
            assert.equal(x.trial.id,y.trial.id);
            assert.equal(x.trial.seed,y.trial.seed);
            assert.equal(x.sourceDealFingerprint,y.sourceDealFingerprint);
            assert.equal(x.actualStarterSeat,y.actualStarterSeat);
            console.log('MECHANICAL_DEVELOPMENT_ONLY',JSON.stringify({
              id:y.trial.id,unchangedPhysicalSource:x.sourceDealFingerprint===y.sourceDealFingerprint,
              sameRootLedger:x.rootActionLedgerSha256===y.rootActionLedgerSha256,
              baseline:{attacks:x.attackDeclarations,actions:x.actionCount,end:x.endReason,error:x.error||null},
              ownerCompressor:{attacks:y.attackDeclarations,actions:y.actionCount,end:y.endReason,error:y.error||null}}));
          }
          console.log('NO_COMPETITIVE_QUALIFIED_GAMES',b.competitiveQualifiedGames);"
      - name: Archive paired historical canonical four-arm variants including caps and errors
        if: inputs.common_bilateral_compressor_development && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-common-compressor-historical-develop
          path: |
            agent5-bilateral-baseline.json
            agent5-bilateral-compressor.json
          if-no-files-found: warn
          retention-days: 10
      - name: Verify owner-only resource telemetry and historical four-arm identity
        if: inputs.owner_compressor_opportunity_audit
        run: node --test tests/owner-compressor-opportunity-audit.test.cjs tests/agent41-bilateral-v2-development.test.cjs
      - name: Observe all candidate owner-root opportunities on exactly four original bilateral arms
        if: inputs.owner_compressor_opportunity_audit
        env:
          AGENT5_COMPR_OPPORTUNITY_AUDIT: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-fourarm-own-compressor-opportunity.json
      - name: Verify read-only telemetry retains the exact previous root-action SHA256 fingerprints
        if: inputs.owner_compressor_opportunity_audit
        run: >-
          node -e "const assert=require('node:assert/strict');
          const r=require('./agent5-fourarm-own-compressor-opportunity.json');
          const refs={
          '6:0:A:champion-reference':'df894ca4304355b937b515cc559dbacbf6c803a2c0b0fc23f47260889f900dbe',
          '6:0:A:new-moon-lockbreaker-v1':'87ef423a77ec6aafd6063fd3ad054ce3f9d29806a52ab04f21c1c6bb0e1495e4',
          '11:2:B:champion-reference':'dd2bfba15a260541405501c6f09b03e17d9140c908a8243132e5122e294c97b8',
          '11:2:B:new-moon-lockbreaker-v1':'646c06f1d8a52f426689b877c1cc84f530ef22c36f0fd55ac34573ef6d8d4979'};
          assert.equal(r.rows.length,4);
          for(const x of r.rows){
          assert.equal(x.error,undefined);
          assert.equal(x.rootActionLedgerSha256,refs[x.trial.id]);
          const a=x.ownerCompressorOpportunityAudit;
          assert.equal(a.ownerOnlyVisibleData,true);
          console.log('OWNER_ROOT_OPPORTUNITY_ONLY',JSON.stringify({
          id:x.trial.id,sourceActuallyFirst:x.sourceActuallyFirst,
          ownerDecisionRoots:a.observedOwnerRootDecisions,ownerTurns:a.observedOwnTurns,
          compressorHeldTurns:a.heldCompressorTurns,
          activeMewtwoTurns:a.mewtwoActiveTurns,
          benchedMewtwoTurns:a.mewtwoBenchedTurns,
          originalOpportunityTurns:a.activeOnlyEligibleTurns,
          proposedBenchOpportunityTurns:a.activeOrBenchEligibleTurns,
          benchOnlyTurns:a.benchExtensionOnlyTurns,
          candidateAttacks:x.attackDeclarations?.candidate,
          ended:x.endReason}));}
          console.log('HISTORICAL_UNQUALIFIED',r.competitiveQualifiedGames);"
      - name: Archive actual owner-root-only Compressor prerequisites and negative cases
        if: inputs.owner_compressor_opportunity_audit && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-canonical-owner-compressor-opportunities
          path: agent5-fourarm-own-compressor-opportunity.json
          if-no-files-found: warn
          retention-days: 10
      - name: Check disjoint registered partition coverage and owner-hand payload policy
        if: ${{ !inputs.common_bilateral_compressor_development && !inputs.owner_compressor_opportunity_audit && !inputs.common_bilateral_late_compressor_development && !inputs.agent47_owner_fogcrystal_audit && !inputs.agent9_sourcefirst_lock_transfer && !inputs.agent41_sourcefirst_ability_window && !inputs.agent6_source_pass_hand }}
        run: node --test tests/newmoon-payload-partition-plan.test.cjs tests/new-moon-compressor-payload-policy.test.cjs
      - name: Execute same-deal control and Compressor intervention in one fixed partition
        if: ${{ !inputs.common_bilateral_compressor_development && !inputs.benched_payload_retrospective && !inputs.owner_compressor_opportunity_audit && !inputs.common_bilateral_late_compressor_development && !inputs.agent47_owner_fogcrystal_audit && !inputs.agent9_sourcefirst_lock_transfer && !inputs.agent41_sourcefirst_ability_window && !inputs.agent6_source_pass_hand }}
        env:
          NEWMOON_PAYLOAD_PARTITION: ${{ inputs.partition }}
        run: node simulation/twinleaf/newmoon-payload-partition-write.cjs
      - name: Compare early Bench-Mewtwo owner-donor preparation on historical repeat1
        if: ${{ !inputs.common_bilateral_compressor_development && inputs.benched_payload_retrospective && !inputs.owner_compressor_opportunity_audit && !inputs.common_bilateral_late_compressor_development && !inputs.agent47_owner_fogcrystal_audit && !inputs.agent9_sourcefirst_lock_transfer && !inputs.agent41_sourcefirst_ability_window && !inputs.agent6_source_pass_hand }}
        run: node simulation/twinleaf/newmoon-rank11-benched-payload-retrospective.cjs > newmoon-bench-retrospective-repeat1.json
      - name: Archive historical repeat1 bench-donor policy contrast
        if: ${{ !inputs.common_bilateral_compressor_development && inputs.benched_payload_retrospective && !inputs.owner_compressor_opportunity_audit && !inputs.common_bilateral_late_compressor_development && !inputs.agent47_owner_fogcrystal_audit && !inputs.agent9_sourcefirst_lock_transfer && !inputs.agent41_sourcefirst_ability_window && !inputs.agent6_source_pass_hand && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-bench-retrospective-repeat1
          path: newmoon-bench-retrospective-repeat1.json
          if-no-files-found: warn
          retention-days: 10
      - name: Preserve all source-deal attempts, including errors and action caps
        if: ${{ !inputs.common_bilateral_compressor_development && !inputs.benched_payload_retrospective && !inputs.owner_compressor_opportunity_audit && !inputs.common_bilateral_late_compressor_development && !inputs.agent47_owner_fogcrystal_audit && !inputs.agent9_sourcefirst_lock_transfer && !inputs.agent41_sourcefirst_ability_window && !inputs.agent6_source_pass_hand && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: newmoon-compressor-source-partition-${{ inputs.partition }}
          path: newmoon-payload-partition-${{ inputs.partition }}.json
          if-no-files-found: warn

      - name: Verify late14 held Compressor choice against original owner-turn guard
        if: inputs.common_bilateral_late_compressor_development
        run: node --test tests/new-moon-compressor-payload-policy.test.cjs tests/agent41-bilateral-v2-development.test.cjs tests/owner-compressor-opportunity-audit.test.cjs tests/agent37-candidate-attack-settlement.test.cjs
      - name: Replay same four historical hard-rank source deals with late14 owner donor policy
        if: inputs.common_bilateral_late_compressor_development
        env:
          AGENT5_COMPR_LATE14_DEV: 'true'
          AGENT5_COMPR_OPPORTUNITY_AUDIT: 'true'
        run: node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent5-bilateral-late14-compressor.json
      - name: Read-only candidate copied-attack effect and opponent-return audit on same four canonical historical arms
        if: inputs.common_bilateral_late_compressor_development
        run: node simulation/evaluation/agent37-late14-public-replay.cjs > agent37-late14-public-settlement.json
      - name: Gate all canonical candidate effects against independent observer and frozen root history
        if: inputs.common_bilateral_late_compressor_development
        run: |
          node --test tests/agent41-canonical-candidate-settlement-gate.test.cjs tests/agent37-candidate-attack-settlement.test.cjs
          node scripts/agent41-canonical-candidate-settlement-gate.cjs agent5-bilateral-late14-compressor.json agent37-late14-public-settlement.json > agent41-integrated-candidate-settlement-gate.json
          node -e "const x=require('./agent41-integrated-candidate-settlement-gate.json');console.log('INTEGRATED_CANDIDATE_ATTACK_GATE',JSON.stringify(x))"
      - name: Report actual candidate Compressor root and source response without qualifying games
        if: inputs.common_bilateral_late_compressor_development
        run: >-
          node -e "const x=require('./agent5-bilateral-late14-compressor.json');
          for(const r of x.rows){
          console.log('LATE14_HISTORICAL_ONLY',JSON.stringify({
          id:r.trial.id,seed:r.trial.seed,first:r.actualStarterSeat,
          actualCompressorItemRoots:r.candidateBattleCompressorRoots??[],
          currentEligibleTurns:r.ownerCompressorOpportunityAudit?.activeOnlyEligibleTurns,
          attacks:r.attackDeclarations,actions:r.actionCount,
          finished:r.finished,end:r.endReason,error:r.error?.slice(0,600)||null,
          rootHash:r.rootActionLedgerSha256}));}
          console.log('COMPETITIVE_QUALIFIED',x.competitiveQualifiedGames);"
      - name: Archive all original-deal later-donor owner decisions and failures
        if: inputs.common_bilateral_late_compressor_development && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-late14-canonical-compressor-dev
          path: |
            agent5-bilateral-late14-compressor.json
            agent37-late14-public-settlement.json
            agent41-integrated-candidate-settlement-gate.json
          if-no-files-found: warn
          retention-days: 10

      - name: Compile-check native, observer-only source-first window fixture
        if: inputs.agent41_sourcefirst_ability_window
        run: |
          node --check simulation/twinleaf/agent41-live-garbotoxin-ability-window.cjs
          node --check simulation/evaluation/agent41-sourcefirst-ability-window-replay.cjs
          node --test tests/agent41-bilateral-v2-development.test.cjs
      - name: Compare one authentic source-first Garbodor and Field Blower game to unobserved root ledger
        if: inputs.agent41_sourcefirst_ability_window
        run: node simulation/evaluation/agent41-sourcefirst-ability-window-replay.cjs > agent41-garbotoxin-ability-window.json
      - name: Print native before-after blocker result, keeping negative observations
        if: inputs.agent41_sourcefirst_ability_window
        run: >-
          node -e "const x=require('./agent41-garbotoxin-ability-window.json');console.log('GARBOTOXIN_NATIVE_WINDOW',JSON.stringify({firstResponse:x.firstCandidateResponse,powerBefore:x.powerWindow.before?.candidateGenericAbilityBlocked,powerAfter:x.powerWindow.after?.candidateGenericAbilityBlocked,sourceTooledBefore:x.powerWindow.before?.sourceGarbodorHasTool,sourceTooledAfter:x.powerWindow.after?.sourceGarbodorHasTool,sameGame:x.sameActualPlayAndPublicEffects,qualified:x.qualification.competitiveGameQualified}))"
      - name: Archive source-first ability-suppression observation, including missing witness
        if: ${{ always() && inputs.agent41_sourcefirst_ability_window }}
        uses: actions/upload-artifact@v4
        with:
          name: agent41-sourcefirst-native-ability-window-development
          path: agent41-garbotoxin-ability-window.json
          if-no-files-found: warn
          retention-days: 10

      - name: Pure-test historical owner source reply without compiling policy changes
        if: inputs.agent6_source_pass_hand
        run: |
          node --check simulation/evaluation/agent6-rank11-source-reply-hand.cjs
          node --test tests/agent6-rank11-source-reply-hand.test.cjs
      - name: Replay original four unchanged late14 Store roots and observe real source turn22 owner hand
        if: inputs.agent6_source_pass_hand
        run: node simulation/evaluation/agent6-rank11-source-reply-hand.cjs > agent6-rank11-owner-pass.json
      - name: Preserve diagnostic owner hand, source pass and all frozen root digests
        if: ${{ always() && inputs.agent6_source_pass_hand }}
        uses: actions/upload-artifact@v4
        with:
          name: agent6-rank11-source-reply-owner-hand
          path: agent6-rank11-owner-pass.json
          if-no-files-found: warn
          retention-days: 10

      - name: Execute source-first held-Shake transfer against both unchanged candidate 60s
        if: inputs.agent9_sourcefirst_lock_transfer && !inputs.agent41_sourcefirst_ability_window && !inputs.agent6_source_pass_hand
        run: node simulation/evaluation/agent9-rank11-sourcefirst-lock-transfer.cjs > agent9-rank11-sourcefirst-lock-transfer.json
      - name: Archive all eight actual source-first pressure transfer arms, including no-lock and errors
        if: ${{ always() && inputs.agent9_sourcefirst_lock_transfer && !inputs.agent41_sourcefirst_ability_window && !inputs.agent6_source_pass_hand }}
        uses: actions/upload-artifact@v4
        with:
          name: agent9-rank11-sourcefirst-lock-transfer-development
          path: agent9-rank11-sourcefirst-lock-transfer.json
          if-no-files-found: warn
          retention-days: 10
      - name: Audit true owner-deck search visibility boundary without native decisions
        if: inputs.agent47_owner_fogcrystal_audit
        run: node --test tests/owner-deck-search-witness.test.cjs
      - name: Observe genuine first-turn Fog Crystal options and chosen cards on original rank11 repeat1
        if: inputs.agent47_owner_fogcrystal_audit
        run: node simulation/twinleaf/agent47-rank11-owner-fogcrystal-source.cjs > agent47-rank11-own-search-repeat1.json
      - name: Archive source-locked actor-visible choices without game-strength claims
        if: inputs.agent47_owner_fogcrystal_audit && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent47-rank11-true-owner-search
          path: agent47-rank11-own-search-repeat1.json
          if-no-files-found: warn
          retention-days: 10
