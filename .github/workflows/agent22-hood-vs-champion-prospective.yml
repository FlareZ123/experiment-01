name: Agent22 prospectively compare Hood Shield with champion in native Aichi

on:
  workflow_dispatch:
    inputs:
      agent45_source_funding_rank5:
        description: 'Run frozen rank5 original Mew-funded Hood versus champion 24 native attempts'
        required: false
        type: boolean
        default: false
      agent45_quickball_owner_retro:
        description: 'Replay original rank5 native Quick Ball owner payment failure'
        required: false
        type: boolean
        default: false
      agent35_architecture_48:
        description: 'Run frozen 48-game champion/Hood/Safeguard eight-rank screen'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hood-champion-paperprofile:
    if: ${{ !inputs.agent45_source_funding_rank5 && !inputs.agent45_quickball_owner_retro && !inputs.agent35_architecture_48 }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Audit fixed registration, candidate identity and censored comparison
        run: |
          node --check simulation/evaluation/2026-11/agent22-hood-vs-champion-native.cjs
          node --test tests/2026-11/agent22-hood-vs-champion-native.test.cjs
          node simulation/evaluation/2026-11/agent22-hood-vs-champion-native.cjs --inspect-only
      - name: Execute frozen four-rank genuine original 60 against each unchanged contender
        run: node simulation/evaluation/2026-11/agent22-hood-vs-champion-native.cjs
      - name: Preserve full raw actual native roots, including caps and errors
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent22-hood-vs-champion-fresh32-native
          path: agent22-hood-vs-champion-32-native.json
          if-no-files-found: warn
          retention-days: 21

  rank5-source-funded-two-contenders:
    if: ${{ inputs.agent45_source_funding_rank5 && !inputs.agent45_quickball_owner_retro && !inputs.agent35_architecture_48 }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify fresh six-deal registration and source-funded paired analysis
        run: |
          node --check simulation/evaluation/2026-11/agent45-source-funded-hood-vs-champion-rank5.cjs
          node --test tests/2026-11/agent45-source-funded-hood-vs-champion-rank5.test.cjs
          node simulation/evaluation/2026-11/agent45-source-funded-hood-vs-champion-rank5.cjs --inspect-only
      - name: Install pinned game engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all 24 pre-registered original rank5 native games
        env:
          AGENT4_NATIVE_PAYMENT_RECEIPT_DEV: 'true'
        run: node simulation/evaluation/2026-11/agent45-source-funded-hood-vs-champion-rank5.cjs
      - name: Archive every complete raw native Store attempt including invalid and capped cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent45-source-funded-hood-champion-rank5-24-native
          path: artifacts/agent45-rank5-funded-hood-champion-24native.json
          retention-days: 21
          if-no-files-found: warn

  quickball-owner-retrospective:
    if: ${{ inputs.agent45_quickball_owner_retro && !inputs.agent35_architecture_48 }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify source-printed Quick Ball physical owner resolver
        run: |
          node --check simulation/evaluation/2026-11/agent45-rank5-quickball-owner-4500a-retro.cjs
          node --test tests/2026-11/agent45-quickball-owner-payment-prompt.test.cjs
          node simulation/evaluation/2026-11/agent45-rank5-quickball-owner-4500a-retro.cjs --inspect-only
      - name: Install pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay two source-physically matched prior 4500A errors
        env:
          AGENT4_NATIVE_PAYMENT_RECEIPT_DEV: 'true'
        run: node simulation/evaluation/2026-11/agent45-rank5-quickball-owner-4500a-retro.cjs
      - name: Preserve complete repaired-or-broken native roots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent45-rank5-4500a-quickball-owner-retro
          path: artifacts/agent45-rank5-4500a-quickball-owner-retro.json
          retention-days: 21
          if-no-files-found: warn

  agent35-architecture-eight-rank-48:
    if: ${{ inputs.agent35_architecture_48 }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify preregistered three-architecture immutable printings and censor bounds
        run: |
          node --check simulation/evaluation/2026-11/agent35-three-architecture-eight-rank-native.cjs
          node --test tests/2026-11/agent35-three-architecture-eight-rank-native.test.cjs
          node simulation/evaluation/2026-11/agent35-three-architecture-eight-rank-native.cjs --inspect-only
      - name: Install pinned Twinleaf dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute exact fresh 48 native games with unchanged 60s and symmetric actor policy
        run: node simulation/evaluation/2026-11/agent35-three-architecture-eight-rank-native.cjs
      - name: Archive all actual Store attempts, including caps and native aborts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent35-three-architecture-eight-rank-48-native
          path: artifacts/agent35-three-architecture-eight-rank-48-native.json
          retention-days: 21
          if-no-files-found: warn
