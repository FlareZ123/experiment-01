name: Twinleaf source-ranked speculative Card mutation audit

on:
  workflow_dispatch:
    inputs:
      rank6_guzma_probe:
        description: 'Source-rank6 turn33 defensive Guzma and free-retreat fork, unqualified'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-mutation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Observe original and post-super v2 live Card histories
        if: ${{ !inputs.rank6_guzma_probe }}
        run: node simulation/twinleaf/agent16-natural-source-mutation-contrast.cjs
      - name: Execute authentic rank6 held-Guzma defensive gust fork
        if: ${{ inputs.rank6_guzma_probe }}
        run: node simulation/twinleaf/rank6-turn33-guzma-response.cjs > rank6-turn33-guzma-response.json
      - name: Print bounded source and first-response witness
        if: ${{ inputs.rank6_guzma_probe }}
        run: node -e "const x=require('./rank6-turn33-guzma-response.json');console.log(JSON.stringify({source:x.source,firstRoot:x.firstAuthenticSourceDivergenceRootOrdinal,stage:x.sourceDecision.stage,events:x.sourceDecision.events,original:x.control,forced:x.forcedGuzmaAndFreeRetreat,qualified:x.qualifiedForCompetitiveInference}));"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.rank6_guzma_probe && always() }}
        with:
          name: agent16-rank6-turn33-guzma-source-fork
          path: rank6-turn33-guzma-response.json
          retention-days: 14
