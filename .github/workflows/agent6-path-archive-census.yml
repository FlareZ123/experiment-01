name: Agent6 read-only Path original-native archive diagnostics

on:
  workflow_dispatch:
    inputs:
      study:
        description: Choose fixed archived original native evidence
        required: true
        type: choice
        default: original-census
        options:
          - original-census
          - pressure-error
          - pressure-causal

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Download first original14 exact archived physical deals
        if: inputs.study == 'original-census'
        uses: actions/download-artifact@v4
        with:
          name: agent6-path-underworld-original14-development
          run-id: 42560225495
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: analysis-input
      - name: Download fresh adversarial original14 archived physical deals
        if: inputs.study == 'pressure-error'
        uses: actions/download-artifact@v4
        with:
          name: agent6-path-pressure-original14-development
          run-id: 42561187689
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: analysis-input
      - name: Download repaired adversarial original14 matched archive
        if: inputs.study == 'pressure-causal'
        uses: actions/download-artifact@v4
        with:
          name: agent6-path-pressure-original14-development
          run-id: 42562112272
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: analysis-input
      - name: Read Path play and owner-visible lock opportunity census
        if: inputs.study == 'original-census'
        run: node scripts/agent6-path-counter-archive-census.cjs
      - name: Inspect exact native failed action cause without replay
        if: inputs.study == 'pressure-error'
        run: node scripts/agent6-path-pressure-error-cause.cjs
      - name: Diagnose physical first-root change on rank21 from preserved archive
        if: inputs.study == 'pressure-causal'
        run: node scripts/agent6-path-recovery-causal-archive.cjs
