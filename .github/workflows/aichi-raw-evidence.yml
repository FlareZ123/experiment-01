name: Aichi raw evidence contract

on:
  workflow_dispatch:
    inputs:
      emit_frozen_source_schedule:
        description: 'Emit exact source-verified champion field schedule for precommit'
        type: boolean
        required: false
        default: false
      retain_expiring_native_archives:
        description: 'Verify exact historical Actions ZIP bytes against locked SHA manifest'
        type: boolean
        required: false
        default: false
      publish_archived_native_release:
        description: 'Opt-in publish SHA-verified ZIPs as durable GitHub prerelease assets'
        type: boolean
        required: false
        default: false
      verify_native_release_only:
        description: 'Re-download release assets and verify SHA without expiring source artifacts'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: aichi-raw-evidence-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact statistics library
        run: python -m pip install scipy
      - name: Test binomial evidence and game-record contract
        run: python -m unittest discover -s tests -p 'test_*evidence.py' -v
      - name: Test the exact Ranger opening-access submodel
        run: python -m unittest discover -s tests -p 'test_ranger_opening_access.py' -v
      - name: Test raw-game integrity and failure gates
        run: python -m unittest discover -s tests -p 'test_match_record_contract.py' -v
      - name: Test trusted ranked opponent inventory contract
        run: python -m unittest discover -s tests -p 'test_source_hash_gate.py' -v
      - name: Test preregistered trial schedule completeness
        run: python -m unittest discover -s tests -p 'test_trial_schedule_gate.py' -v
      - name: Test canonical action-trace integrity
        run: python -m unittest discover -s tests -p 'test_action_trace_integrity.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test frozen complete Aichi campaign schedule registration
        run: node --test tests/aichi-frozen-trial-schedule.test.cjs
      - name: Print candidate field registration for independently committed plan
        if: inputs.emit_frozen_source_schedule
        run: >-
          node -e "const p=require('./scripts/aichi-frozen-trial-schedule.cjs').freezeDefaultAichiSchedule({phase:'published-field',candidateId:'champion-reference'});console.log('REGISTERED_FIELD_JSON='+JSON.stringify(p));"
      - name: Test Node/Python trace hash interoperability
        run: node --test tests/action-trace-canonical.test.cjs

  native-evidence-retention:
    if: ${{ inputs.retain_expiring_native_archives || inputs.verify_native_release_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed native archival allowance, hashes and source provenance
        run: node --test tests/agent6-native-evidence-retention.test.cjs
      - name: Verify byte-exact historical ZIPs or recheck the durable mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AICHI_ARCHIVE_PUBLISH: ${{ inputs.publish_archived_native_release }}
          AICHI_ARCHIVE_VERIFY_RELEASE_ONLY: ${{ inputs.verify_native_release_only }}
        run: node scripts/agent6-retain-native-research-artifacts.cjs > native-evidence-retention-receipt.json
      - name: Preserve hashed source and published download verification receipt
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent6-native-evidence-retention-receipt
          path: native-evidence-retention-receipt.json
          if-no-files-found: warn
          retention-days: 30
