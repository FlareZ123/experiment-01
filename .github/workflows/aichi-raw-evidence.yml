name: Aichi raw evidence contract

on:
  workflow_dispatch:
    inputs:
      emit_frozen_source_schedule:
        description: 'Emit exact source-verified champion field schedule for precommit'
        type: boolean
        required: false
        default: false
      retain_expiring_native_archives:
        description: 'Verify exact historical Actions ZIP bytes against locked SHA manifest'
        type: boolean
        required: false
        default: false
      publish_archived_native_release:
        description: 'Opt-in publish SHA-verified ZIPs as durable GitHub prerelease assets'
        type: boolean
        required: false
        default: false
      verify_native_release_only:
        description: 'Re-download release assets and verify SHA without expiring source artifacts'
        type: boolean
        required: false
        default: false
      audit_selected_v3_blower_roots:
        description: 'Opt-in byte-checked original selected-v3 Field Blower native owner-root audit'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: aichi-raw-evidence-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact statistics library
        run: python -m pip install scipy
      - name: Test binomial evidence and game-record contract
        run: python -m unittest discover -s tests -p 'test_*evidence.py' -v
      - name: Test the exact Ranger opening-access submodel
        run: python -m unittest discover -s tests -p 'test_ranger_opening_access.py' -v
      - name: Test raw-game integrity and failure gates
        run: python -m unittest discover -s tests -p 'test_match_record_contract.py' -v
      - name: Test trusted ranked opponent inventory contract
        run: python -m unittest discover -s tests -p 'test_source_hash_gate.py' -v
      - name: Test preregistered trial schedule completeness
        run: python -m unittest discover -s tests -p 'test_trial_schedule_gate.py' -v
      - name: Test canonical action-trace integrity
        run: python -m unittest discover -s tests -p 'test_action_trace_integrity.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test frozen complete Aichi campaign schedule registration
        run: node --test tests/aichi-frozen-trial-schedule.test.cjs
      - name: Print candidate field registration for independently committed plan
        if: inputs.emit_frozen_source_schedule
        run: >-
          node -e "const p=require('./scripts/aichi-frozen-trial-schedule.cjs').freezeDefaultAichiSchedule({phase:'published-field',candidateId:'champion-reference'});console.log('REGISTERED_FIELD_JSON='+JSON.stringify(p));"
      - name: Test Node/Python trace hash interoperability
        run: node --test tests/action-trace-canonical.test.cjs
      - name: Test rank11 source owner Letter-frontier source-custody invariants
        run: node --test tests/agent10-selected-v3-rank11-letter-frontier.test.cjs
      - name: Test archived rank11 Letter Store source-deal and six-Prize postgame evidence invariants
        run: node --test tests/agent10-audit-rank11-letter-aba-native.test.cjs
      - name: Test source-native Field Blower held-root audit denominator and action binding
        run: node --test tests/agent6-selected-v3-fieldblower-root-audit.test.cjs
      - name: Recheck original selected-v3 ZIP and audit each held Field Blower owner root
        if: inputs.audit_selected_v3_blower_roots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download aichi-native-evidence-2026-11-03 --pattern 'selected-v3-paper-funded-48-13260514792.zip' --dir .
          node -e "const assert=require('node:assert/strict');const fs=require('node:fs');const crypto=require('node:crypto');const p='selected-v3-paper-funded-48-13260514792.zip';assert.equal(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'),'303d11947c39c7572b4302fef8666ab744491e9db745dd8ffadc55b1631c0850');"
          python -c "import zipfile; z=zipfile.ZipFile('selected-v3-paper-funded-48-13260514792.zip'); assert z.namelist()==['agent4-selected-v3-paper-funded-native-48.json']; z.extractall('.')"
          node scripts/agent6-selected-v3-fieldblower-root-audit.cjs agent4-selected-v3-paper-funded-native-48.json > agent6-selected-v3-fieldblower-root-audit.json
          node -e "const assert=require('node:assert/strict');const r=require('./agent6-selected-v3-fieldblower-root-audit.json');assert.deepEqual(r.totals,{originalAttemptRows:16,rowsWithLiveRootLedger:14,rowsWithoutLiveRootLedger:2,nativeOwnerRootsChecked:688,heldPhysicalCopyRootObservations:259,missingPublicTargetCopyRoots:215,positivePublicTargetCopyRoots:44,positiveDistinctNativeRoots:23,positiveDistinctOwnerTurns:18,positiveDistinctTrials:1,positiveActorSelectedFieldBlower:0,nativeFieldBlowerPlaysAllIntactTrials:0});assert.equal(r.positivePublicTargetIdentities.length,1);assert.equal(r.positivePublicTargetIdentities[0].printing,'Muscle Band XY');console.log('SOURCE_ZIP_HASH_AND_688_NATIVE_OWNER_ROOTS_VERIFIED');"
      - name: Archive selected-v3 source-native removal frontier evidence
        if: ${{ always() && inputs.audit_selected_v3_blower_roots }}
        uses: actions/upload-artifact@v4
        with:
          name: agent6-selected-v3-source-blower-native-root-audit
          path: agent6-selected-v3-fieldblower-root-audit.json
          if-no-files-found: warn
          retention-days: 30

  native-evidence-retention:
    if: ${{ inputs.retain_expiring_native_archives || inputs.verify_native_release_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed native archival allowance, hashes and source provenance
        run: node --test tests/agent6-native-evidence-retention.test.cjs
      - name: Verify byte-exact historical ZIPs or recheck the durable mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AICHI_ARCHIVE_PUBLISH: ${{ inputs.publish_archived_native_release }}
          AICHI_ARCHIVE_VERIFY_RELEASE_ONLY: ${{ inputs.verify_native_release_only }}
        run: node scripts/agent6-retain-native-research-artifacts.cjs > native-evidence-retention-receipt.json
      - name: Preserve hashed source and published download verification receipt
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent6-native-evidence-retention-receipt
          path: native-evidence-retention-receipt.json
          if-no-files-found: warn
          retention-days: 30
