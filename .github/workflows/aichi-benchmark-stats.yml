name: Aichi benchmark statistical tests

on:
  workflow_dispatch:
    inputs:
      strict_historical_policy_pins:
        description: 'Fail historical policy pin drift only on an explicitly selected immutable validation ref'
        required: false
        type: boolean
        default: false
      agent12_rank5_printed_native_replay:
        description: 'Read-only SHA-pinned archived rank5 Mew/Genesect eight original Store copied attacks against printed HP and Prize rules'
        required: false
        type: boolean
        default: false
      agent48_seeker_native_census:
        description: '12 preregistered native original-source owner-only VS Seeker and Lillie 120-root audits, no competitive games'
        required: false
        type: boolean
        default: false
      rank11_source_census:
        description: 'Run original rank11 frozen-source tests; requires the pinned research revision'
        required: false
        type: boolean
        default: false
      rank6_native_pressure:
        description: 'Bounded source-first rank6 genuine Store passive Initialization replay'
        required: false
        type: boolean
        default: false
      rank6_k1_alternative_energy:
        description: 'Paired original-Store K1 source fallback, development only'
        required: false
        type: boolean
        default: false
      rank6_k1_special_energy_followup:
        description: 'Also test existing bilateral Special Energy root after K1 backup'
        required: false
        type: boolean
        default: false
      rank6_k1_source_scoped_special:
        description: 'Source-only Special Energy followup against unchanged candidate'
        required: false
        type: boolean
        default: false
      rank6_k1_candidate_scoped_special:
        description: 'Candidate-only typed Psychic attachment against unchanged rank6 source'
        required: false
        type: boolean
        default: false
      agent26_public_board_conditioned:
        description: 'Synthetic public history incremental information after a neutral visible Active, no games'
        required: false
        type: boolean
        default: false
      agent26_public_history_information:
        description: 'Synthetic uniform-prior source identification from full publicly revealed mulligan hands, no games'
        required: false
        type: boolean
        default: false
      agent24_original_physical_native:
        description: 'Three frozen original pinned-Store Regidrago physical custody negative/positive cases'
        required: false
        type: boolean
        default: false
      agent24_owner_tiebreak_fixture:
        description: 'Opt-in staged native both-zero-Prize tiebreak 120-original-reference identity check'
        required: false
        type: boolean
        default: false
      agent24_original_owner_swap_native:
        description: 'Opt-in deliberate reciprocal reference exchange at original Store root, both seats'
        required: false
        type: boolean
        default: false
      agent24_paper_replay_prize_lead:
        description: 'Staged native six-Prize tiebreak first Prize lead, read-only paper winner witness both seats'
        required: false
        type: boolean
        default: false
      agent24_natural_replay_prize_panel:
        description: 'Four bounded natural-attack first Prize search replays after staged original-source tie'
        required: false
        type: boolean
        default: false
      agent31_public_mulligan_native:
        description: 'Read-only paired native opponent-visible mulligan card-history parity against rank6; setup only'
        required: false
        type: boolean
        default: false
      agent39_rank16_power_reply:
        description: 'Read-only native opponent Power witness; same frozen source seeds, retrospective replay'
        required: false
        type: boolean
        default: false
      agent39_rank16_quickbridge_partition:
        description: 'Fresh 64-group original rank16 Quick Ball bridge prospective study; 0-3 or none'
        required: false
        type: choice
        options:
          - none
          - '0'
          - '1'
          - '2'
          - '3'
        default: none
      agent39_rank16_direct_shake_partition:
        description: 'Original rank16 direct Boost Shake selected-source panel, groups 0-3; none disables'
        required: false
        type: choice
        options:
          - none
          - '0'
          - '1'
          - '2'
          - '3'
        default: none
      agent16_rank16_natural_source:
        description: 'Eight prospective exact rank16 source physical deals, both unchanged candidate 60s, owner first-turn lock-fork observation only'
        required: false
        type: boolean
        default: false
      agent50_fresh_rank11_bilateral:
        description: 'Precommitted fresh 8 rank11 source-deal groups, symmetric known-dead 32 original Store attempts, development only'
        required: false
        type: boolean
        default: false
      agent4_owner_paper_native_aba:
        description: 'Historical read-only 6-arm real Store owner-paper necessary-condition census; no qualified games'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  test-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Preflight manual workflow YAML, trigger, and input declarations
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python -m unittest discover -s tests -p test_workflow_dispatch_preflight.py
          python scripts/workflow_dispatch_preflight.py
      - name: Verify exact accepted-Basic opening Temple and Raichu Prize windows
        run: |
          python -m unittest discover -s tests -p test_agent17_raichu_temple_prize_windows.py -v
          python scripts/agent17_raichu_temple_prize_windows.py > agent17-raichu-temple-prize-windows.json
      - name: Regress Agent17 frozen original Store prompt-family and exact-print category screens
        run: |
          python -m unittest discover -s tests -p test_agent17_frozen_native_prompt_portfolio.py
          python -m unittest discover -s tests -p test_agent17_frozen_prompt_printed_target_screen.py
      - name: Regress archived original rank11 Terminal Period printed-payability receipt audit
        run: python -m unittest discover -s tests -p test_agent32_original_terminal_payability.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rank17 owner-public Electrode opportunity and no-action-change observer
        run: node --test tests/agent1-rank17-electrode-owner-necessity.test.cjs tests/agent1-rank17-electrode-census.test.cjs tests/agent1-rank17-electrode-actor-integration.test.cjs
      - name: Verify fifth fixed 60 structural candidate manifest and source transformation
        run: node --test tests/agent28-sentinel-lopunny-fixed60.test.cjs
      - name: Check original rank6/24/29 Plumeria printing-safe versus copy-access combinatorics
        run: node --test tests/agent38-rank6-lastprinting-earlyhand.test.cjs tests/agent38-k0-payment-replacement.test.cjs
      - name: Verify four original hard-cluster source identity and no false admission
        run: node --test tests/agent38-hardcluster-source-lineage-supplement.test.cjs
      - name: Audit five source-printing-specific Temple Lightning attack gates
        run: |
          node --test tests/agent17-temple-five-lightning-originals.test.cjs tests/agent17-temple-raichu-counterline.test.cjs
          node scripts/agent17-temple-raichu-counterline.cjs > agent17-temple-raichu-counterline.json
          node scripts/agent17-temple-five-lightning-originals.cjs > agent17-temple-five-originals.json
          node -e "const r=require('./agent17-temple-five-originals.json');if(JSON.stringify(r.focalLightningRanks)!=='[4,6,17,24,29]'||r.competitivelyQualifiedGames!==0)throw Error('Original Temple gate mismatch');console.log(JSON.stringify({allSpecial:r.sevenAllSpecial,focal:r.focalLightningRanks,qualified:r.competitivelyQualifiedGames}))"
          node -e "const r=require('./agent17-temple-raichu-counterline.json');if(JSON.stringify(r.sourceOriginals.map(x=>x.rank))!=='[4,17]'||r.competitivelyQualifiedGames!==0)throw Error('Raichu counterline paper screen mismatch');console.log(JSON.stringify({counterRankIds:r.sourceOriginals.map(x=>x.rank),nativeWitness:r.isNaturalGameWitness}))"
      - name: Check original rank6 same-turn printed Item Energy answer plus Volt Cyclone physical access
        run: python scripts/agent17_rank6_item_disrupt_attack.py
      - name: Verify Agent17 strict post-Compressor T2 Regidrago physical hand and Prize event
        run: python scripts/agent17_adp_turn2_physical.py
      - name: Verify Agent17 fixed ADP v2 exact T1 GX Prize and source-rank6 mutual-mulligan gate
        run: node --test tests/agent17-adp-t1-gx-prize-gate.sft.cjs tests/agent17-adp-rank6-mulligan-coupling.sft.cjs tests/agent17-adp-tagcall-switch-bridge.sft.cjs
      - name: Verify Agent18 MISSING hard ceiling and complete Exeggutor source-original printed 60 risks
        run: |
          node --test tests/agent18-missing-field-ceiling.test.cjs tests/agent18-exeggutor-opener-risk.test.cjs tests/agent18-exeggutor-prize-supply.test.cjs tests/agent18-wally-blockade-window.test.cjs tests/agent18-grand-tree-turn2-window.test.cjs tests/agent18-wally-target-paper-guard.test.cjs tests/agent18-source29-supporter-wally-oldex-census.test.cjs
          node scripts/agent18-missing-field-ceiling.cjs > agent18-missing-field.json
          node scripts/agent18-exeggutor-opener-risk.cjs > agent18-exeggutor-opening.json
          node scripts/agent18-exeggutor-prize-supply.cjs > agent18-exeggutor-prizes.json
          node scripts/agent18-wally-blockade-window.cjs > agent18-wally-window.json
          node scripts/agent18-grand-tree-turn2-window.cjs > agent18-grand-tree-window.json
          node scripts/agent18-source29-supporter-wally-oldex-census.cjs > agent18-source29-supporter-ex.json
          node -e "const m=require('./agent18-missing-field.json'),p=require('./agent18-exeggutor-prizes.json');if(m.impossibleByPhysicalInventory!==23||p.newJoint.available!=='126205/131747')throw Error('source-locked exact inventory mismatch');console.log(JSON.stringify({sourceOriginals:m.authenticatedOriginalSixties,missingFieldImpossible:m.impossibleByPhysicalInventory,rank2NewUnprized:p.newJoint.available},null,2))"
      - name: Regress original control mill source engines, exact Prize frontier and owner-safe decision
        run: node --test tests/agent39-rank6-lusamine-handiwork-cycle.test.cjs tests/agent39-rank6-control-owner-selector.test.cjs tests/agent39-original-control-mill-census.test.cjs tests/agent39-peonia-owner-visited-slots.test.cjs
      - name: Verify original 29-deck exact English archive printing census and approved aliases
        run: node --test tests/agent42-original-card-archive-census.test.cjs
      - name: Regress Agent11 source-locked two-player openings and forced low-HP Basic envelopes
        run: node --test tests/agent11-rank10-last-bench-mulligan-bound.test.cjs tests/agent11-field-simultaneous-mulligan-compensation.test.cjs tests/agent11-thorns-solo-basic-envelope.test.cjs tests/agent11-newmoon-forced-lowhp-opening.test.cjs tests/agent11-newmoon-vip-dual-shield-opening.test.cjs
      - name: Regress rank26 exact 280-HP forced-lone and original-source card printings
        run: node --test tests/agent3-rank26-printed-280hp-starter-screen.test.cjs tests/agent3-rank26-coupled-lone-basic-root.test.cjs
      - name: Regress independent same-root offers without synthetic-hold denominator inflation
        run: node --test tests/agent7-same-root-independent-opportunity.test.cjs
      - name: Verify independent source-deal and real native-opportunity receipt integrity
        run: |
          node --test tests/agent48-decision-opportunity-receipt.test.cjs
          node --test tests/agent41-native-attempt-disposition.test.cjs
          node --test tests/agent48-aborted-source-pair-posthoc.test.cjs
      - name: Regress rank22 Wally first-turn direct prize-aware physical access
        run: node --test tests/agent48-rank22-wally-direct.test.cjs
      - name: Check exact rank22 Wally or Wonder Tag disjoint access and Prize accounting
        run: node --test tests/agent48-rank22-wally-lele-access.test.cjs
      - name: Regress exact printed native card/Ability registry without false effect claims
        run: node --test tests/agent24-ace-nullifier-native-coverage.test.cjs
      - name: Verify 29-source Basic-printed mulligan bonus lift for pre-turn Spiritomb denial
        run: node --test tests/agent24-spiritomb-mulligan-setup-opportunity.test.cjs tests/agent26-openworld-mulligan-source-envelope.test.cjs tests/agent26-openworld-active-thorns-source-envelope.test.cjs tests/agent26-public-active-robust-source-intervals.test.cjs tests/agent26-prism-joint-mulligan-envelope.test.cjs tests/agent26-prism-joint-rank6-public-six.test.cjs tests/agent26-public-active-robust-source-intervals-v2.test.cjs
      - name: Exact prize-aware first-eight Spiritomb versus Tool-dependent Genesect availability
        run: node --test tests/agent24-ace-nullifier-opening-frontier.test.cjs
      - name: Audit Spiritomb ACE SPEC lock potential across exact 29 printed original source sixties
        run: node --test tests/agent24-spiritomb-ace-source-census.test.cjs
      - name: Fail closed on missing settled physical-card custody in release results
        run: node --test tests/physical-zone-qualification.test.cjs
      - name: Verify original physical card owners beyond the 60-card count invariant
        run: node --test tests/agent24-original-owner-custody.test.cjs
      - name: Fail closed on unverified native replay and expose paper first-Prize winner
        run: node --test tests/agent24-native-replay-first-lead-witness.test.cjs
      - name: Project pending simultaneous KO Prizes without fabricating paper winners
        run: node --test tests/agent24-pending-replay-prize-disposition.test.cjs
      - name: Audit native KO roots and supplied ordinary simultaneous-win table
        run: node --test tests/agent24-native-ko-batch-observer.test.cjs tests/agent24-ordinary-simultaneous-win-matrix.test.cjs
      - name: Regress actual Aichi May 2026 Swiss and knockout paper time-call predicates
        run: node --test tests/agent26-aichi-may2026-paper-clock-adjudicator.test.cjs
      - name: Regress owner-visible DCE target for stranded original rank5 Mew
        run: node --test tests/agent26-owner-visible-mew-dce-recipient.test.cjs
      - name: Certify original rank5 all-DCE printed attack-cost feasibility
        run: node --test tests/agent26-rank5-original-energy-cost-feasibility.test.cjs
      - name: Regress rank5 Wally four-piece opening after Prize placement
        run: node --test tests/agent26-rank5-first-turn-wally-literal-line.test.cjs
      - name: Index unique non-KO Prize attacks and Gholdengo resource reset
        run: node --test tests/agent34-direct-prize-attack-frontier.test.cjs
      - name: Fail closed on first-player ordinary Supporter while allowing printed exceptions
        run: node --test tests/paper-supporter-quota-guard.test.cjs
      - name: Preserve potential final two-Prize attack in optional owner arbitration
        run: node --test tests/agent35-potential-two-prize-attack-veto.test.cjs
      - name: Preserve source-deal and public root evidence on native Store abort
        run: node --test tests/native-dispatch-abort-evidence.test.cjs
      - name: Regress rank19 direct ADP Altered Creation resources
        run: node --test tests/rank19-adp-direct-gx-opening.test.cjs
      - name: Regress original native generic fallback prompt stage and owner accounting
        run: node --test tests/agent50-empty-discard-getlost-causal-census.test.cjs tests/agent50-generic-prompt-fallback-census.test.cjs tests/agent50-native-prompt-before-attack-diff.test.cjs tests/agent50-source-group-sign-sensitivity.test.cjs
      - name: Regress original-source Crobat-to-Mew native settlement attribution
        run: node --test tests/agent9-rank5-crobat-native-settlement.test.cjs
      - name: Verify actual Crobat retreat fee physical card identity
        run: node --test tests/agent9-retreat-fee-custody.test.cjs
      - name: Audit deck-name incidence and VIP hand-entry provenance
        run: node --test tests/aichi-source-incidence.test.cjs tests/agent9-vip-bench-entry-provenance.test.cjs tests/agent9-vip-source-archive-trigger-crosscheck.test.cjs tests/agent9-rank5-vip-owner-search-vs-genesect.test.cjs tests/agent9-rank5-vip-crobat-genesect-exact-partition.test.cjs tests/agent9-vip-owner-alternatives-readonly.test.cjs tests/agent9-rank5-vip-prize-bench-window.test.cjs tests/agent9-v31-genesect-ability-archive-census.test.cjs
      - name: Attest all 32 original rank and archetype identities with exact published printing inventories
        run: node --test tests/agent13-source-identity-gate.test.cjs
      - name: Fail closed on skipped native printed-card fixtures before competitive release
        run: node --test tests/agent49-native-print-release-gate.test.cjs
      - name: Verify independent paper Trainer necessary-condition and authenticated owner-turn screens
        run: node --test tests/agent4-owner-paper-trainer-necessary-screen.test.cjs tests/agent4-owner-paper-composite-necessary.test.cjs tests/agent4-bilateral-paper-frontier-closure.test.cjs tests/agent4-selected-v3-paper-funded-release.test.cjs tests/agent4-selected-v3-offline-audit.test.cjs tests/agent50-native-owner-trainer-pass-bridge.test.cjs tests/agent4-owner-paper-native-transport.test.cjs tests/agent4-owner-paper-native-census.test.cjs
      - name: Audit original published 60s for exact first-owner-turn-only Trainer incidence
        run: node --test tests/agent4-first-owner-turn-field-incidence.test.cjs
      - name: Require both original physical seats and one frozen candidate 60 in native-release intake
        run: node --test tests/agent33-native-print-release-gate.test.cjs
      - name: Check default-off owner-visible Tropical Beach last-chance decision and deck conservation
        run: node --test tests/agent33-tropical-beach-lastchance.test.cjs
      - name: Regress original rank11 fully occupied Bench dead attack response (default-off)
        run: node --test tests/agent1-actor-dead-first-attack-frontier.test.cjs tests/agent32-trubbish-full-bench-choice.test.cjs
      - name: Verify all 29 original Stadium source counts and competing action opportunities
        run: node --test tests/agent33-original-stadium-coverage.test.cjs
      - name: Require public Stadium-adjusted attack costs before selecting owner attack roots
        run: node --test tests/agent49-wondrous-root-payability.test.cjs tests/agent34-actor-only-root-policy.test.cjs tests/agent8-wondrous-energy-cost-regression.test.cjs
      - name: Screen original ranked Pokémon printings for mandatory own-Bench Energy movement
        run: node --test tests/agent14-own-bench-energy-move-census.test.cjs
      - name: Regress owner-public Iron Thorns solo-Bench Energy-retention tradeoff
        run: node --test tests/agent14-thorns-solo-energy-retention.test.cjs
      - name: Verify Regidrago Mysterious Treasure owner-only discard-cost proposal
        run: node --test tests/agent49-mysterious-treasure-frontier.test.cjs
      - name: Verify exact hypergeometric Regidrago Treasure opening coexistence
        run: node --test tests/agent49-regidrago-treasure-openers.test.cjs
      - name: Verify externally pinned effective development profile identity
        run: node --test tests/agent36-profile-provenance-gate.test.cjs
      - name: Verify pre-execution dynamic CommonJS module integrity pinning
        run: node --test tests/agent36-runtime-module-pin.test.cjs
      - name: Verify native settled turn closure joins without invented owner roots
        run: node --test tests/agent12-native-settled-recovery-lineage-bridge.test.cjs
      - name: Verify printed rank5 Techno Blast baseline damage and Prize thresholds
        run: node --test tests/agent12-rank5-printed-techno-blast-calibration.test.cjs
      - name: Regress raw native rank5 release status without replaying frozen outcomes
        run: node --test --test-name-pattern="actual engine dispositions" tests/agent13-v3-rank5-release.test.cjs
      - name: Regress native rank5 zero-attack frontier without source-hidden inference
        run: node --test tests/agent37-rank5-native-zero-attack-frontier.test.cjs
      - name: Retrieve unchanged archived native rank5 v3.1 original 16 arms
        if: ${{ inputs.agent12_rank5_printed_native_replay }}
        uses: actions/download-artifact@v4
        with:
          name: agent13-rank5-v31-native-16arm
          run-id: 41387484608
          github-token: ${{ github.token }}
          path: agent12-rank5-archive
      - name: Audit original rank5 Techno Blast against printed HP, Weakness and Prize awards
        if: ${{ inputs.agent12_rank5_printed_native_replay }}
        run: |
          node simulation/evaluation/agent12-rank5-printed-techno-blast-calibration.cjs agent12-rank5-archive/agent13-rank5-v31-native-16arm.json > agent12-rank5-native-printed-calibration.json
          node -e "const a=require('node:assert/strict');const r=require('./agent12-rank5-native-printed-calibration.json');console.log(JSON.stringify({version:r.version,sourceOriginalRank:r.sourceOriginalRank,sourcePrintedAttackEvents:r.sourcePrintedAttackEvents,consistent:r.baselinePaperOutcomesConsistent,knockouts:r.printedTargetKnockouts,damages:r.printedTargetDamageWithoutKnockout,prizes:r.printedPrizesTaken,unverifiedWins:r.competitivelyQualifiedGames},null,2));a.equal(r.sourcePrintedAttackEvents,8);a.equal(r.baselinePaperOutcomesConsistent,8);a.equal(r.printedTargetKnockouts,7);a.equal(r.printedTargetDamageWithoutKnockout,1);a.equal(r.printedPrizesTaken,13);a.equal(r.competitivelyQualifiedGames,0);"
      - name: Validate exact source Genesect Ability-use census against pinned original 16-arm Store archive
        if: ${{ inputs.agent12_rank5_printed_native_replay }}
        run: |
          node --test tests/agent9-v31-genesect-ability-archive-census.test.cjs
          node -e "const a=require('node:assert/strict');const m=require('./scripts/agent9-v31-genesect-ability-archive-census.cjs');const d=require('./agent12-rank5-archive/agent13-rank5-v31-native-16arm.json');const x=m.censusArchivedGenesectAbility(d);const c=x.modes.frozenV2Control,v=x.modes.integratedV3;for(const z of [c,v]){a.equal(z.attempts,8);a.equal(z.sourceAcceptedGenesectHandBenchPlays,10);a.equal(z.sourceAcceptedUseAbilityAction,0);a.equal(z.bothSeatsAcceptedUseAbilityAction,0)}a.equal(c.sourceAcceptedAttackAction,0);a.equal(v.sourceAcceptedAttackAction,8);a.equal(x.competitiveQualifiedGames,0);console.log(JSON.stringify({control:{roots:c.rootsInspected,genesect:c.sourceAcceptedGenesectHandBenchPlays,ability:c.sourceAcceptedUseAbilityAction,attacks:c.sourceAcceptedAttackAction},integrated:{roots:v.rootsInspected,genesect:v.sourceAcceptedGenesectHandBenchPlays,ability:v.sourceAcceptedUseAbilityAction,attacks:v.sourceAcceptedAttackAction}},null,2))"
      - name: Summarize archived native rank5 zero-attack root frontier
        if: ${{ inputs.agent12_rank5_printed_native_replay }}
        run: |
          node scripts/agent37-rank5-native-zero-attack-frontier.cjs agent12-rank5-archive/agent13-rank5-v31-native-16arm.json > agent37-rank5-zero-attack-frontier.json
          node -e "const r=require('./agent37-rank5-zero-attack-frontier.json');console.log(JSON.stringify({schema:r.schema,attempts:r.nativeArchivedAttemptCount,integratedNoAttacks:r.integratedZeroDeclaredAttackCount,integratedPositive:r.integratedPositiveAttackCount,unknown:r.integratedUnknownAttackCount,zeroAttackSourceRootTypes:r.noAttackRows.map(x=>({trialId:x.trialId,types:x.sourceRootTypes,tail:x.sourceRootTail})),qualification:r.competitiveQualifiedGames},null,2))"
      - name: Retain rank5 original zero-attack root frontier
        if: ${{ inputs.agent12_rank5_printed_native_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-zero-attack-frontier
          path: agent37-rank5-zero-attack-frontier.json
          retention-days: 30
      - name: Regress bounded owner-only root action contention without changing decisions
        id: agent16_policy_inventory
        continue-on-error: true
        run: node --test tests/agent16-owner-priority-contention.test.cjs tests/agent16-root-recovery-trace.test.cjs tests/agent16-native-canplay-graph-guard.test.cjs tests/agent16-balanced-coin-source-registration.test.cjs tests/agent16-setup-coin-choice-receipt.test.cjs tests/agent16-transitive-policy-source-inventory.test.cjs tests/agent16-policy-audit-lanes.test.cjs
      - name: Audit printed opponent-hand random effect source incidence across 29 final originals
        run: |
          node --test tests/agent12-original-field-random-hand-text-census.test.cjs
          node scripts/agent12-original-field-random-hand-text-census.cjs > agent12-original-field-random-hand.json
          node -e "const r=require('./agent12-original-field-random-hand.json');console.log(JSON.stringify({sourceDeckCount:r.sourceDeckCount,matches:r.exactPrintedEffectMatches.map(x=>({rank:x.rank,cardName:x.cardName,printing:x.printing,effect:x.name})),unresolvedManifestRows:r.unresolvedManifestRows,unresolved:r.unresolved.slice(0,10)},null,2))"
      - name: Verify exact source nonattack terminal triggers and native turn-end lineage
        run: node --test tests/agent12-owner-sequence-compatibility.test.cjs tests/agent12-aichi-nonattack-turn-end-census.test.cjs tests/agent12-native-turn-closure-lineage.test.cjs tests/agent12-original32-native-closure-census.test.cjs tests/agent12-frozen-native-prompt-family-census.test.cjs tests/agent12-native-prompt-choice-digest.test.cjs
      - name: Verify field-wide five dormant Trainer channels at Basic-valid openings
        run: node --test tests/agent48-five-channel-opening-presence.test.cjs
      - name: Audit per-rank source Trainer action vocabulary against actual actor choices
