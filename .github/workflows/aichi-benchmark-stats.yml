name: Aichi benchmark statistical tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test field-completeness and exact confidence calculations
        run: node --test tests/test-aichi-field-benchmark.cjs tests/test-aichi-raw-records.cjs tests/test-aichi-real-first-turn.cjs tests/candidate-mirror-gate.test.cjs tests/aichi-comparison-campaign.test.cjs tests/aichi-benched-basic-pass-triage.test.cjs tests/aichi-campaign-execute.test.cjs tests/aichi-campaign-quality-screen.test.cjs tests/aichi-campaign-seed-v2.test.cjs tests/aichi-campaign-seed-v3.test.cjs tests/aichi-workflow-seed-defaults.test.cjs tests/aichi-guzma-trap.test.cjs tests/aichi-evidence-envelope.test.cjs tests/aichi-vileplume-tm-opening.test.cjs tests/aichi-vileplume-itemlock-opening.test.cjs tests/aichi-snorlax-solo-block.test.cjs tests/aichi-v2-seed-coupling-audit.test.cjs tests/aichi-v3-seed-distribution-audit.test.cjs tests/aichi-frozen-policy-compare.test.cjs tests/agent38-hood-basic-source-guard.test.cjs tests/agent38-natural-gate-union.test.cjs tests/agent38-joint-bonus.test.cjs tests/agent38-hood-protected-bonus.test.cjs tests/aichi-raichu-energy-capacity.test.cjs tests/aichi-raichu-target-aggregation.test.cjs tests/aichi-raichu-manual-attachment.test.cjs tests/aichi-raichu-six-prize-gate.test.cjs
      - name: Verify Regidrago source-name panel scheduling
        run: node --test tests/aichi-regidrago-coverage-panel.test.cjs
      - name: Audit locale-dependent source deck fingerprint order
        run: node --test tests/aichi-printing-order-audit.test.cjs
