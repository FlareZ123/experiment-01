name: Aichi benchmark statistical tests

on:
  workflow_dispatch:
    inputs:
      agent48_seeker_native_census:
        description: '12 preregistered native original-source owner-only VS Seeker and Lillie 120-root audits, no competitive games'
        required: false
        type: boolean
        default: false
      rank11_source_census:
        description: 'Run original rank11 frozen-source tests; requires the pinned research revision'
        required: false
        type: boolean
        default: false
      rank6_native_pressure:
        description: 'Bounded source-first rank6 genuine Store passive Initialization replay'
        required: false
        type: boolean
        default: false
      rank6_k1_alternative_energy:
        description: 'Paired original-Store K1 source fallback, development only'
        required: false
        type: boolean
        default: false
      rank6_k1_special_energy_followup:
        description: 'Also test existing bilateral Special Energy root after K1 backup'
        required: false
        type: boolean
        default: false
      rank6_k1_source_scoped_special:
        description: 'Source-only Special Energy followup against unchanged candidate'
        required: false
        type: boolean
        default: false
      rank6_k1_candidate_scoped_special:
        description: 'Candidate-only typed Psychic attachment against unchanged rank6 source'
        required: false
        type: boolean
        default: false
      agent26_public_board_conditioned:
        description: 'Synthetic public history incremental information after a neutral visible Active, no games'
        required: false
        type: boolean
        default: false
      agent26_public_history_information:
        description: 'Synthetic uniform-prior source identification from full publicly revealed mulligan hands, no games'
        required: false
        type: boolean
        default: false
      agent31_public_mulligan_native:
        description: 'Read-only paired native opponent-visible mulligan card-history parity against rank6; setup only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Index unique non-KO Prize attacks and Gholdengo resource reset
        run: node --test tests/agent34-direct-prize-attack-frontier.test.cjs
      - name: Fail closed on first-player ordinary Supporter while allowing printed exceptions
        run: node --test tests/paper-supporter-quota-guard.test.cjs
      - name: Preserve potential final two-Prize attack in optional owner arbitration
        run: node --test tests/agent35-potential-two-prize-attack-veto.test.cjs
      - name: Preserve source-deal and public root evidence on native Store abort
        run: node --test tests/native-dispatch-abort-evidence.test.cjs
      - name: Regress rank19 direct ADP Altered Creation resources
        run: node --test tests/rank19-adp-direct-gx-opening.test.cjs
      - name: Regress original native generic fallback prompt stage and owner accounting
        run: node --test tests/agent50-empty-discard-getlost-causal-census.test.cjs tests/agent50-generic-prompt-fallback-census.test.cjs
      - name: Audit deck-name incidence without merging printing mechanics
        run: node --test tests/aichi-source-incidence.test.cjs
      - name: Attest all 32 original rank and archetype identities with exact published printing inventories
        run: node --test tests/agent13-source-identity-gate.test.cjs
      - name: Fail closed on skipped native printed-card fixtures before competitive release
        run: node --test tests/agent49-native-print-release-gate.test.cjs
      - name: Require public Stadium-adjusted attack costs before selecting owner attack roots
        run: node --test tests/agent49-wondrous-root-payability.test.cjs tests/agent34-actor-only-root-policy.test.cjs tests/agent8-wondrous-energy-cost-regression.test.cjs
      - name: Verify Regidrago Mysterious Treasure owner-only discard-cost proposal
        run: node --test tests/agent49-mysterious-treasure-frontier.test.cjs
      - name: Verify exact hypergeometric Regidrago Treasure opening coexistence
        run: node --test tests/agent49-regidrago-treasure-openers.test.cjs
      - name: Regress bounded owner-only root action contention without changing decisions
        run: node --test tests/agent16-owner-priority-contention.test.cjs
      - name: Verify exact source nonattack terminal triggers and native turn-end lineage
        run: node --test tests/agent12-owner-sequence-compatibility.test.cjs tests/agent12-aichi-nonattack-turn-end-census.test.cjs tests/agent12-native-turn-closure-lineage.test.cjs tests/agent12-original32-native-closure-census.test.cjs
      - name: Verify field-wide five dormant Trainer channels at Basic-valid openings
        run: node --test tests/agent48-five-channel-opening-presence.test.cjs
      - name: Audit per-rank source Trainer action vocabulary against actual actor choices
        run: node --test tests/agent48-fieldwide-action-family-matrix.test.cjs
      - name: Verify exact rank6 denial overlap and fail-closed archived Plumeria cost joins
        run: node --test tests/agent25-denial-overlap.test.cjs tests/agent25-plumeria-native-hand-cost.test.cjs
      - name: Regress protected first-turn Carmine owner action in real actor-root chooser
        run: node --test tests/agent48-conservative-first-carmine.test.cjs
      - name: Regress owner-only VS Seeker to Lillie chain, actual prompt and physical Store witnesses
        run: node --test tests/agent48-owner-vs-seeker-lillie.test.cjs
      - name: Regress full VS Seeker to Lillie typed root prompt and native-shaped Store adapter
        run: node --test tests/agent48-owner-vs-seeker-adapter.test.cjs
      - name: Check exact Basic-valid natural Special Energy opening exposure
        run: node --test tests/agent17-special-only-opening-exposure.test.cjs
      - name: Check implemented Special Energy numeric vocabulary across 29 originals
        run: node --test tests/agent17-special-energy-vocabulary.test.cjs
      - name: Test reusable conditional Energy model coverage over all source sixties
        run: node --test tests/agent17-energy-model-bridge-coverage.test.cjs
      - name: Test reversible owner-public conditional Energy actor root
        run: node --test tests/agent17-public-context-special-energy.test.cjs
      - name: Check default-off owner Jet Bench switch proposal and shared symbolic Energy matcher
        run: node --test tests/agent40-public-jet-bench-frontier.test.cjs
      - name: Audit printed source 60 mobility inventory and recovery channels
        run: node --test tests/agent7-source-mobility-roster.test.cjs
      - name: Compare exact source card Abilities across mixed printings
        run: node --test tests/aichi-printing-mechanics.test.cjs
      - name: Check New Moon printed Stage 1 response under rank15 double Vileplume
        run: node --test tests/new-moon-rank15-dual-vileplume.test.cjs
      - name: Regress owner Supporter-count versus Energy global turn clock
        run: node --test tests/rank15-bus-native-retreat-policy.test.cjs
      - name: Verify rank4 and rank17 dual-evolution Prize and legal-seven capacity
        run: |
          node --test tests/agent45-raichu-dual-chain-prize-capacity.test.cjs
          node scripts/agent45-raichu-dual-chain-prize-capacity.cjs
      - name: Check exact rank15 pre-Prize two-Vileplume availability ceiling
        run: node --test tests/aichi-rank15-dual-lock-prize-ceiling.test.cjs
      - name: Check direct rank15 Omega Barrage TM double-evolution opening
        run: node --test tests/aichi-rank15-direct-tm-opening.test.cjs
      - name: Compare rank2 Vileplume Stoutland independent-chain Prize gate
        run: node --test tests/aichi-rank2-vileplume-stoutland-prize-ceiling.test.cjs
      - name: Compare hypothetical one-slot rank2 lock-chain redundancies
        run: node --test tests/aichi-rank2-one-slot-lock-sensitivity.test.cjs
      - name: Verify restricted Psychic/Fog early-resource contrast of both frozen candidates
        run: node --test tests/aichi-fog-energy-opening-resource-census.test.cjs
      - name: Verify exact New Moon first-eight Fog or Compressor donor access
        run: |
          node --test tests/agent6-newmoon-fog-compressor-first8.test.cjs
          node scripts/agent6-newmoon-fog-compressor-first8.cjs
      - name: Check New Moon early Field Blower and later Escape Rope direct joint timing
        run: |
          node --test tests/aichi-newmoon-two-item-timing.test.cjs
          node scripts/aichi-newmoon-two-item-timing.cjs
      - name: Exact New Moon copied GX anti-Thorns source-and-attack resource conjunction
        run: |
          node --test tests/newmoon-thorns-gx-lockline-window.test.cjs tests/newmoon-direct-horror-house-physical-window.test.cjs
          node scripts/newmoon-thorns-gx-lockline-window.cjs
          node scripts/newmoon-direct-horror-house-physical-window.cjs
      - name: Check Ditto first-eight target-in-deck and prize-aware direct path
        run: node --test tests/ditto-direct-path-frontier.test.cjs
      - name: Check exact Ditto Guzma-Hala and three-resource prize access
        run: node --test tests/ditto-full-resource-frontier.test.cjs
      - name: Test field-completeness and exact confidence calculations
        run: node --test tests/test-aichi-field-benchmark.cjs tests/test-aichi-raw-records.cjs tests/test-aichi-real-first-turn.cjs tests/candidate-mirror-gate.test.cjs tests/aichi-comparison-campaign.test.cjs tests/aichi-benched-basic-pass-triage.test.cjs tests/aichi-campaign-execute.test.cjs tests/aichi-campaign-quality-screen.test.cjs tests/agent41-campaign-paper-supporter-quality.test.cjs tests/aichi-root-action-ledger.test.cjs tests/aichi-full-field-claim-gate.test.cjs tests/aichi-campaign-seed-v2.test.cjs tests/aichi-campaign-seed-v3.test.cjs tests/aichi-workflow-seed-defaults.test.cjs tests/aichi-guzma-trap.test.cjs tests/aichi-evidence-envelope.test.cjs tests/aichi-source-crosscandidate-setup-audit.test.cjs tests/aichi-vileplume-tm-opening.test.cjs tests/aichi-vileplume-itemlock-opening.test.cjs tests/aichi-snorlax-solo-block.test.cjs tests/aichi-v2-seed-coupling-audit.test.cjs tests/aichi-v3-seed-distribution-audit.test.cjs tests/aichi-frozen-policy-compare.test.cjs tests/agent38-hood-basic-source-guard.test.cjs tests/agent38-natural-gate-union.test.cjs tests/agent38-joint-bonus.test.cjs tests/agent38-hood-protected-bonus.test.cjs tests/aichi-raichu-energy-capacity.test.cjs tests/aichi-raichu-target-aggregation.test.cjs tests/aichi-raichu-manual-attachment.test.cjs tests/aichi-raichu-six-prize-gate.test.cjs tests/electrode-opportunity-observer.test.cjs tests/aichi-electrode-observer-contrast.test.cjs
      - name: Fail closed on incomplete New Moon fixed-partition source evidence
        run: node --test tests/newmoon-payload-partition-plan.test.cjs tests/newmoon-compressor-cohort-audit.test.cjs
      - name: Verify original-Store four-cell setup receipts and draw-log proof
        run: node --test tests/aichi-setup-zone-capture.test.cjs tests/agent42-registered-setup-native-bridge.test.cjs
      - name: Test owner-visible Perfection Pass rescue without private-zone reads
        run: node --test tests/owner-visible-perfection-pass-bridge.test.cjs
      - name: Verify native read-only prompt choices retain pre-choice zone counts
        run: node --test tests/twinleaf-selected-cards-evidence.test.cjs tests/native-prompt-choice-evidence.test.cjs
      - name: Reject fabricated bilateral v2 actual-first-turn evidence
        run: node --test tests/bilateral-v2-evidence-gate.test.cjs tests/bilateral-v2-root-ledger-attestation.test.cjs tests/agent3-source-first-pressure-kind.test.cjs tests/agent41-live-garbotoxin-ability-window.test.cjs tests/agent42-four-cell-coverage.test.cjs tests/aichi-paired-four-cell-accrual.test.cjs tests/aichi-four-cell-sampling-budget.test.cjs
      - name: Reject nonadjacent roots in bilateral Store reply packets
        run: node --test tests/aichi-bilateral-reply-packet.test.cjs
      - name: Test verified first-root source-deal pairing
        run: node --test tests/agent25-source-deal-pairing.test.cjs tests/agent25-source-deal-campaign.test.cjs
      - name: Verify fail-closed source campaign policy echoes
        run: node --test tests/aichi-campaign-runner.test.cjs tests/aichi-setup-zone-capture.test.cjs
      - name: Test archived rank8 Star Alchemy search use and hand disruption
        run: node --test tests/rank8-stone-archive-inspector.test.cjs
      - name: Detect source prompt-card divergence before root action-type divergence
        run: node --test tests/action-ledger-first-observable-difference.test.cjs
      - name: Audit spent-Supporter unrestricted search choice and reversible policy
        run: node --test tests/spent-supporter-search-policy.test.cjs
      - name: Regress conditional Regidrago Apex mandatory hand-discard action conflict
        run: node --test tests/agent47-apex-discard-frontier.test.cjs
      - name: Verify Regidrago source-name panel scheduling
        run: node --test tests/aichi-regidrago-coverage-panel.test.cjs
      - name: Verify printed Dragon attack-panel scheduling
        run: node --test tests/aichi-regidrago-attack-payload-panel.test.cjs
      - name: Exact source rank31 Roxie plus Koffing direct access
        run: node --test tests/rank31-roxie-pair.test.cjs
      - name: Audit locale-dependent source deck fingerprint order
        run: node --test tests/aichi-printing-order-audit.test.cjs
      - name: Verify exact actor-K0 expected discard utility against exhaustive Prize deals
        run: node --test tests/k0-discard-value-frontier.test.cjs tests/k0-discard-source-printings.test.cjs tests/owner-k0-observable-inventory.test.cjs tests/owner-k0-search-access.test.cjs tests/unseen-hand-category-posterior.test.cjs tests/opponent-observable-category-pool.test.cjs
      - name: Verify exact owner K0-to-K1 mutually exclusive line information value
        run: node --test tests/k0-line-information-frontier.test.cjs tests/k0-line-information-source-printings.test.cjs
      - name: Check familywise hard-matchup veto and adversarial provenance cases
        run: node --test tests/aichi-hard-matchup-veto.test.cjs
      - name: Verify source-deal sealed actual-start accrual and fixed-seat veto
        run: node --test tests/aichi-outcome-blind-start-accrual.test.cjs tests/aichi-sealed-start-veto.test.cjs
      - name: Verify source and candidate combined hidden opening deal digest
        run: node --test tests/source-physical-deal-fingerprint.test.cjs tests/full-physical-deal-fingerprint.test.cjs
      - name: Check archetype group loss floors against registered Aichi field
        run: node --test tests/aichi-archetype-loss-budget.test.cjs
      - name: Verify source-only and two-player absolute mulligan setup allowances
        run: |
          node --test tests/aichi-setup-mulligan-race.test.cjs tests/aichi-field-mulligan-census.test.cjs tests/aichi-mulligan-public-reveal.test.cjs tests/public-mulligan-reveal-observer.test.cjs tests/aichi-public-mulligan-posterior.test.cjs tests/agent26-public-mulligan-evolution.test.cjs tests/agent26-public-mulligan-fullhistory.test.cjs tests/agent26-public-mulligan-printing-name-bridge.test.cjs tests/agent26-public-mulligan-information-power.test.cjs tests/agent26-public-mulligan-active-conditioned.test.cjs tests/agent26-thorns-public-hammer-tech-risk.test.cjs tests/agent26-public-mulligan-actor-view.test.cjs tests/agent26-public-thorns-tech-risk.test.cjs tests/agent26-public-mulligan-native-printed-posterior.test.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/twinleaf/headless.cjs
      - name: Synthetic public history information conditioned on visible Active
        if: ${{ inputs.agent26_public_board_conditioned }}
        run: node scripts/agent26-public-mulligan-active-conditioned.cjs
      - name: Synthetic source-balanced full public mulligan history information census
        if: ${{ inputs.agent26_public_history_information }}
        run: node scripts/agent26-public-mulligan-information-power.cjs
      - name: Verify candidate mulligan treatment and source bonus opportunity coupling
        run: node --test tests/aichi-mulligan-treatment-coupling.test.cjs
      - name: Audit all three source Iron Thorns opening and discard tiers
        run: node --test tests/aichi-thorns-crossrank-opening.test.cjs
      - name: Pure owner Item search root tests
        run: node --test tests/agent8-actor-quick-ball-root.test.cjs
      - name: Check actor-only native Pokémon target perspective, privacy and ownership
        run: node --test tests/agent8-actor-only-choose-pokemon.test.cjs
      - name: Verify setup face-down board privacy in detached actor view
        run: node --test tests/actor-observation-contract.test.cjs
      - name: Verify optional ChoosePokemon composability without changing default canonical policy
        run: node --test tests/agent7-canonical-actor-composition.test.cjs
      - name: Verify Iron Thorns Prize-only multi-turn Energy floors
        run: node --test tests/aichi-rank6-energy-prize-frontier.test.cjs tests/aichi-thorns-attachment-floor.test.cjs
      - name: Verify rank6 first-turn DCE Thunder Gladion Prize triplet obstruction
        run: node --test tests/aichi-rank6-firstturn-energy-triplet.test.cjs
      - name: Verify Basic-valid rank6 Speed DCE Guzma second-own-turn direct packet
        run: |
          node --test tests/aichi-rank6-guzma-energy-direct.test.cjs
          node scripts/aichi-rank6-guzma-energy-direct.cjs
      - name: Verify published Iron Thorns Special Energy printed payability
        run: node --test tests/actor-energy-payability.test.cjs
      - name: Check correlated-field sequential evidence and intact qualification gates
        run: node --test tests/aichi-correlated-round-evidence.test.cjs
      - name: Verify constructed Japanese New Moon 60 and reject altered printings
        run: node --test tests/new-moon-lockbreak-japanese-provenance.test.cjs
      - name: Check proposed Japanese New Moon 60 against historical banned-print snapshot
        run: node --test tests/new-moon-lockbreak-japanese-ban-screen.test.cjs
      - name: Verify structural two-Gengar Japanese 60 matches frozen source and English proxy
        run: node --test tests/new-moon-two-gengar-japanese-provenance.test.cjs
      - name: Verify GX/EX case distinction in New Moon donor printings
        run: node --test tests/aichi-perfection-copy-donor-screen.test.cjs
      - name: Cross-check rank28 provisional source ledgers without admitting missing official sixty
        run: node --test tests/aichi-rank28-photo-ledger-parity.test.cjs

  rank11-source-census:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent exact hand Prize and first-draw derivations
        run: node --test tests/rank11-boostshake-opening-census.test.cjs
      - name: Print source-locked numerator and conditional access rates
        run: node scripts/rank11-boostshake-opening-census.cjs
      - name: Verify prospective rank11 actual-turn stratification and no-filter guarantees
        run: node --test tests/rank11-prospective-exposure.test.cjs
      - name: Verify frozen-source rank11 execution and failed-attempt retention
        if: inputs.rank11_source_census
        run: node --test tests/rank11-prospective-exposure-run.test.cjs
      - name: Freeze source-ranked policy and candidate exposure registration
        if: inputs.rank11_source_census
        run: node scripts/rank11-prospective-exposure.cjs > rank11-prospective-exposure.json
      - name: Print exact machine-readable registration for independent Git commit
        if: inputs.rank11_source_census
        run: node -p "'FRAME_JSON=' + JSON.stringify(require('./rank11-prospective-exposure.json'))"
      - uses: actions/upload-artifact@v4
        if: inputs.rank11_source_census
        with:
          name: rank11-prospective-exposure-v1
          path: rank11-prospective-exposure.json
          retention-days: 14

  rank6-native-pressure:
    if: inputs.rank6_native_pressure
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned upstream simulator
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Check source-first passive classification and native Latias retreat control
        run: |
          node --check simulation/evaluation/agent41-rank6-sourcefirst-passive-replay.cjs
          node --test tests/agent41-passive-rank6-pressure.test.cjs tests/agent39-live-initialization-window.test.cjs tests/agent16-rank6-skyliner-retreat-native.test.cjs
      - name: Replay both fixed candidates with and without read-only native observer
        run: node simulation/evaluation/agent41-rank6-sourcefirst-passive-replay.cjs > rank6-native-sourcefirst.json
      - name: Print bounded native rank6 summary
        if: always()
        run: node -e "const fs=require('node:fs');if(fs.existsSync('rank6-native-sourcefirst.json')){const x=require('./rank6-native-sourcefirst.json');console.log(JSON.stringify({valid:x.validation,aligned:x.candidateSourcePhysicalDealsIdentical,rows:x.rows?.map(y=>({candidate:y.candidateId,status:y.pressure?.status,blocked:y.pressure?.nativeCapabilitySuppressed,unchanged:y.baseline?.rootSha256===y.observed?.rootSha256}))}));}"
      - name: Archive all attempts, including pressure-absence and action caps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank6-sourcefirst-native-development
          path: rank6-native-sourcefirst.json
          if-no-files-found: warn
          retention-days: 10

  rank6-k1-energy-contrast:
    if: inputs.rank6_k1_alternative_energy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure owner-K1 and source-policy regressions
        run: node --test tests/rank6-broad-thorns-policy.test.cjs tests/agent49-rank6-k1-alternate.test.cjs tests/agent49-source-scoped-special-energy.test.cjs tests/agent41-bilateral-v2-development.test.cjs tests/agent30-telepathic-known-energy.test.cjs
      - name: Fetch pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install exact upstream dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test native detached Pass-attachment proof without changing actual Store
        run: node --test tests/pass-attack-announcement-probe.test.cjs
      - name: Frozen same-head retrospective source-first OFF/ON
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
        run: |
          AGENT49_RANK6_K1_ALT_ENERGY_DEV=false node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent49-k1-off.json
          AGENT49_RANK6_K1_ALT_ENERGY_DEV=true node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent49-k1-on.json
          node scripts/agent49-rank6-k1-native-pair.cjs agent49-k1-off.json agent49-k1-on.json > agent49-k1-pair.json
          node -e "const r=require('./agent49-k1-pair.json');console.log('K1_NATIVE_PAIRS',JSON.stringify(r.pairs.map(x=>({id:x.id,fullDeal:x.sameFullDeal,off:x.baseline.sourceAudit,on:x.treatment.sourceAudit,divergence:x.rootDiff?.firstDifferentRoot??null}))))"
      - name: Existing common Special Energy root after K1 backup
        if: inputs.rank6_k1_special_energy_followup
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
        run: |
          AGENT49_RANK6_K1_ALT_ENERGY_DEV=true AGENT3_SPECIAL_ENERGY_ROOT_DEV=true node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent49-k1-special-on.json
          node scripts/agent49-rank6-k1-native-pair.cjs agent49-k1-on.json agent49-k1-special-on.json special-energy-followup > agent49-k1-special-pair.json
          node -e "const r=require('./agent49-k1-special-pair.json');console.log('K1_SPECIAL_FOLLOWUP',JSON.stringify(r.pairs.map(x=>({id:x.id,matched:x.sameFullDeal,firstDifference:x.rootDiff?.firstDifferentRoot??null,control:x.baseline.sourceAudit,followup:x.treatment.sourceAudit,roots:[x.baseline.roots,x.treatment.roots]}))))"
      - name: Source-only actor Special Energy follow-up, candidate unchanged
        if: inputs.rank6_k1_source_scoped_special
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
        run: |
          AGENT49_RANK6_K1_ALT_ENERGY_DEV=true AGENT49_SOURCE_SCOPED_SPECIAL_DEV=true node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent49-k1-scoped-special-on.json
          node scripts/agent49-rank6-k1-native-pair.cjs agent49-k1-on.json agent49-k1-scoped-special-on.json special-energy-followup > agent49-k1-scoped-pair.json
          node -e "const r=require('./agent49-k1-scoped-pair.json');console.log('K1_SOURCE_SCOPED',JSON.stringify(r.pairs.map(x=>({id:x.id,matched:x.sameFullDeal,firstDifference:x.rootDiff?.firstDifferentRoot??null,roots:[x.baseline.roots,x.treatment.roots]}))))"
      - name: Candidate-only Special Energy recipient against unchanged source
        if: inputs.rank6_k1_candidate_scoped_special
        env:
          AGENT7_CANONICAL_ACTOR_POLICY_DEV: 'true'
          AGENT41_SOURCEFIRST_RETRO_DEV: 'true'
          AGENT41_MANDATORY_OPTION_DEV: 'true'
          AGENT41_PAPER_SUPPORTER_DEV: 'true'
          AGENT41_NATIVE_PRESSURE_DEV: 'true'
        run: |
          AGENT49_RANK6_K1_ALT_ENERGY_DEV=true AGENT4_CANDIDATE_SPECIAL_ROOT_DEV=true node simulation/evaluation/agent41-bilateral-v2-development.cjs > agent4-k1-candidate-special-on.json
          node scripts/agent49-rank6-k1-native-pair.cjs agent49-k1-on.json agent4-k1-candidate-special-on.json special-energy-followup > agent4-k1-candidate-special-pair.json
          node -e "const r=require('./agent4-k1-candidate-special-pair.json');console.log('AGENT4_CANDIDATE_ONLY',JSON.stringify(r.pairs.map(x=>({id:x.id,matched:x.sameFullDeal,firstDifference:x.rootDiff?.firstDifferentRoot??null,control:x.baseline.sourceAudit,treated:x.treatment.sourceAudit}))))"
      - name: Preserve all trial rows, rejected and capped
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-rank6-k1-source-first-pair
          path: |
            agent49-k1-off.json
            agent49-k1-on.json
            agent49-k1-pair.json
            agent49-k1-special-on.json
            agent49-k1-special-pair.json
            agent49-k1-scoped-special-on.json
            agent49-k1-scoped-pair.json
            agent4-k1-candidate-special-on.json
            agent4-k1-candidate-special-pair.json
          if-no-files-found: warn
          retention-days: 10

  agent48-seeker-native-census:
    if: inputs.agent48_seeker_native_census
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute 12 fixed original-source VS Seeker owner policy contrasts
        run: node simulation/twinleaf/agent48-vs-seeker-native-owner-census.cjs > agent48-seeker-lillie-native.json
      - name: Summarize actual owner-native VS Seeker roots without performance claims
        if: always()
        run: >-
          node -e "const r=require('./agent48-seeker-lillie-native.json');
          console.log(JSON.stringify({pairs:r.pairs,
          seekerProposed:r.seekerProposed,nativeItems:r.seekerNativeConfirmed,
          ownerPrompts:r.seekerPromptsAccepted,
          supporterReplies:r.recoveredLillieNativeConfirmed,
          rejected:r.rejectedActorRoots,failed:r.failedArms,
          firstFailures:r.trials.filter(t=>t.baseline.error||t.optIn.error).slice(0,4).map(t=>({seed:t.seed,baseline:t.baseline.error,optIn:t.optIn.error})),
          qualified:r.competitiveGameQualified}));"
      - name: Archive all 12 original-source VS Seeker root and no-root trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent48-seeker-original-source-native-census
          path: agent48-seeker-lillie-native.json
          if-no-files-found: warn

  agent31-public-mulligan-native:
    if: inputs.agent31_public_mulligan_native
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Retain precommitted three-seed both-seat real-Store reveal observer noninterference
        run: node --test tests/public-mulligan-reveal-observer.pinned.test.cjs tests/agent26-public-mulligan-native-bridge.pinned.test.cjs tests/agent26-all29-native-public-name-parity.pinned.test.cjs
