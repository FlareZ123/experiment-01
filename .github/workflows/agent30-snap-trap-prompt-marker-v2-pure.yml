name: Agent30 Snap Trap prompt marker v2 pure tests

on:
  push:
    paths:
      - simulation/twinleaf/agent30-stunfisk-snap-trap-prompt-marker-v2.cjs
      - tests/2026-11/agent30-stunfisk-snap-trap-prompt-marker-v2.test.cjs
      - .github/workflows/agent30-snap-trap-prompt-marker-v2-pure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check marker
        run: node --check simulation/twinleaf/agent30-stunfisk-snap-trap-prompt-marker-v2.cjs
      - name: Run prompt marker tests
        run: node --test tests/2026-11/agent30-stunfisk-snap-trap-prompt-marker-v2.test.cjs
