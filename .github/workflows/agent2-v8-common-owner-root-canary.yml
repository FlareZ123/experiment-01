name: Agent 2 selected-v8 common-policy first owner-root canary

on:
  workflow_dispatch:
    inputs:
      agent7_early_beach:
        description: 'Run exact rank-3 first-cycle Beach treatment against the frozen v8 control'
        required: false
        type: boolean
        default: false
      agent7_mail_beach_combo:
        description: 'Compare native first-eligible Mail with owner Mail followed by first-cycle Beach'
        required: false
        type: boolean
        default: false
      agent7_mail_cross_archetype:
        description: 'Run frozen A/B rank9 and rank26 owner Mail native generalization'
        required: false
        type: boolean
        default: false
      agent7_quick_ball_vip:
        description: 'Run original rank5 and rank9 late-dead-VIP owner Quick Ball paper-guarded treatment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent2-v8-common-owner-root-canary
  cancel-in-progress: false

jobs:
  native-owner-root:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify selected-v8 canary release-gate contract
        run: node --test tests/2026-11/agent2-v8-common-first-owner-root-canary-contract.test.cjs
      - name: Run selected-v8 common-policy first-owner-root canary
        if: ${{ !inputs.agent7_early_beach && !inputs.agent7_mail_beach_combo && !inputs.agent7_mail_cross_archetype && !inputs.agent7_quick_ball_vip }}
        run: node simulation/evaluation/agent2-v8-common-first-owner-root-canary.cjs > agent2-v8-common-first-owner-root.json
      - name: Check first-cycle Beach pure tests and native treatment syntax
        if: ${{ inputs.agent7_early_beach || inputs.agent7_mail_beach_combo }}
        run: |
          node --test tests/2026-11/agent7-early-beach-after-pass.test.cjs
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/evaluation/agent7-v8-rank3-early-beach-native.cjs
      - name: Compare exact control and first-cycle Beach on native Store
        if: ${{ inputs.agent7_early_beach && !inputs.agent7_mail_beach_combo }}
        run: node simulation/evaluation/agent7-v8-rank3-early-beach-native.cjs
      - name: Confirm true owner Mail search followed by Beach placement and use
        if: ${{ inputs.agent7_mail_beach_combo }}
        run: |
          node --check simulation/evaluation/agent7-v8-rank3-mail-beach-composition.cjs
          node simulation/evaluation/agent7-v8-rank3-mail-beach-composition.cjs
      - name: Test native cross-archetype Mail frame and capture original owner actions
        if: ${{ inputs.agent7_mail_cross_archetype }}
        run: |
          node --test tests/2026-11/agent7-mail-two-source-registration.test.cjs
          node --check simulation/evaluation/agent7-v8-mail-two-source-coverage.cjs
          node simulation/evaluation/agent7-v8-mail-two-source-coverage.cjs
      - name: Test prospective owner Quick Ball with real native mandatory payment and own-deck search
        if: ${{ inputs.agent7_quick_ball_vip }}
        run: |
          node --test tests/2026-11/agent7-quick-ball-after-pass.test.cjs tests/2026-11/agent7-quick-ball-two-source-registration.test.cjs
          node --check simulation/twinleaf/agent7-quick-ball-native-after-pass.cjs
          node --check simulation/evaluation/agent7-v8-quick-ball-native-two-source.cjs
          node simulation/evaluation/agent7-v8-quick-ball-native-two-source.cjs
      - name: Print compact selected-v8 canary receipt
        if: always()
        run: >-
          node -e "const fs=require('node:fs'); const p='agent2-v8-common-first-owner-root.json'; if(!fs.existsSync(p)){console.log('No canary JSON was produced.'); process.exit(0);} const d=JSON.parse(fs.readFileSync(p,'utf8')); const rows=(d.rows??[]).map(r=>({trialId:r.trialId,status:r.status,candidateSeat:r.candidateSeat,sourceSeat:r.sourceSeat,activeRunDevelopmentRegistration:r.activeRunDevelopmentRegistration,activeRunDevelopmentRegistrationValid:r.activeRunDevelopmentRegistrationValid,firstUnsupportedOwnerRoot:r.firstUnsupportedOwnerRoot,firstRootProvenance:r.firstRootProvenance,blockedPromptContract:r.blockedPromptContract,nativeAbortEvidence:r.nativeAbortEvidence,actorAbortCounters:r.actorAbortCounters,selectedV0:r.selectedV0})); console.log(JSON.stringify({schema:d.schema,runnerMode:d.runnerMode,sourceAdmissionReceipt:d.sourceAdmissionReceipt,canaryGate:d.canaryGate,rows},null,2));"
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-v8-common-first-owner-root
          path: |
            agent2-v8-common-first-owner-root.json
            artifacts/agent7-v8-rank3-early-beach/paired-native.json
            artifacts/agent7-v8-rank3-mail-beach/paired-native.json
            artifacts/agent7-mail-broad-coverage/rank9-rank26-paired.json
            artifacts/agent7-v8-quick-ball/rank5-rank9-paired-native.json
          if-no-files-found: error
