name: Agent 2 selected-v8 common-policy first owner-root canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent2-v8-common-owner-root-canary
  cancel-in-progress: false

jobs:
  native-owner-root:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected-v8 canary release-gate contract
        run: node --test tests/2026-11/agent2-v8-common-first-owner-root-canary-contract.test.cjs
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run selected-v8 common-policy first-owner-root canary
        run: node simulation/evaluation/agent2-v8-common-first-owner-root-canary.cjs > agent2-v8-common-first-owner-root.json
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-v8-common-first-owner-root
          path: agent2-v8-common-first-owner-root.json
          if-no-files-found: error
