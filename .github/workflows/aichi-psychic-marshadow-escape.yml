name: Aichi Psychic Marshadow Temple escape

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-escape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute Resetting Hole board interaction
        run: node simulation/twinleaf/marshadow-temple-escape.cjs
      - name: Probe default bot versus playable response
        run: node simulation/twinleaf/marshadow-response-policy.cjs
      - name: Test generic bot Double Dragon attachment gating
        run: node simulation/twinleaf/dde-attachment-policy.cjs
