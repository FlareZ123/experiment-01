name: Agent1 Get Lost six-Prize paper destination native fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  getlost-paper-destination:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify original printed Girafarig Get Lost lost-zone physical destination with six-prize board
        run: node --test tests/agent9-source-stamped-getlost-exact-destination.native.test.cjs
