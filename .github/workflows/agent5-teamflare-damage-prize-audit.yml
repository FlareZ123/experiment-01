name: Agent5 v7 Team Flare damage and Prize forensic A/B/A

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Check out pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json

      - name: Install and compile pinned Twinleaf server
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      - name: Validate native attack observer, generic Team Flare prompt and physical witness
        run: |
          node --check simulation/twinleaf/agent5-native-attack-damage-observer.cjs
          node --check simulation/evaluation/agent5-v7-teamflare-damage-prize-aba-v4.cjs
          node --test tests/agent5-native-attack-damage-observer.test.cjs tests/agent5-v7-teamflare-damage-prize-aba-v4.test.cjs tests/agent5-owner-teamflare-prompt-generic-v1.test.cjs tests/agent5-v7-teamflare-physical-witness.test.cjs

      - name: Execute registered retrospective native A/B/A forensic replay
        env:
          AGENT5_V7_TEAMFLARE_DAMAGE_PRIZE_DIR: issue25-agent5-teamflare-damage-prize-v4
        run: node simulation/evaluation/agent5-v7-teamflare-damage-prize-aba-v4.cjs

      - name: Publish immutable forensic result to repository
        if: success()
        env:
          RESULT_DIR: issue25-agent5-teamflare-damage-prize-v4
        run: |
          result="results/aichi-2026/forensics/agent5-v7-teamflare-damage-prize-aba-v4-run-${GITHUB_RUN_NUMBER}.json"
          mkdir -p "$(dirname "$result")"
          jq --arg runId "$GITHUB_RUN_ID" --arg runNumber "$GITHUB_RUN_NUMBER" --arg headSha "$GITHUB_SHA" '. + {workflowRunId: $runId, workflowRunNumber: ($runNumber | tonumber), workflowHeadSha: $headSha}' "$RESULT_DIR/agent5-v7-teamflare-damage-prize-aba-v4.json" > "$result"
          sha256sum "$result" > "$result.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add "$result" "$result.sha256"
          git commit -m "Agent 5: preserve native Team Flare damage and Prize audit"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1

      - name: Archive native attack, KO, Prize and promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-v7-teamflare-native-damage-prize-aba-v4
          path: issue25-agent5-teamflare-damage-prize-v4/
          retention-days: 30
          if-no-files-found: warn
