name: Agent14 floatstone mobility response validation
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Select the preserved rank11 replay or isolated new generic staged test"
        type: choice
        required: true
        default: rank11-replay
        options:
          - rank11-replay
          - generic-funded-floatstone
          - generic-field-matched
          - generic-field-census
          - agent31-allowner-pass-native
          - agent31-allowner-pass-fresh-native
          - agent31-postgust-seeker-native
          - agent31-portable-joint-native
          - agent3-portable-champion-all29
          - agent8-source-challenger-2x2
          - agent8-source-challenger-2x2-v2
          - agent8-source-challenger-2x2-v3
          - agent8-source-evolution-v4
permissions:
  contents: read
jobs:
  native-two:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate registration
        if: inputs.experiment == 'rank11-replay'
        run: node -e "require('./simulation/evaluation/agent14-native-floatstone-reply-falsification.cjs').preflight()"
      - name: Regression
        if: inputs.experiment == 'rank11-replay'
        run: node --test tests/agent14-native-floatstone-reply-falsification.test.cjs
      - name: Pure generic owner-policy regression
        if: inputs.experiment == 'generic-funded-floatstone' || inputs.experiment == 'generic-field-matched'
        run: node --test tests/agent14-generic-funded-floatstone-frontier.test.cjs
      - name: Preflight sealed prospective trial IDs
        if: inputs.experiment == 'generic-field-matched' || inputs.experiment == 'generic-field-census'
        run: node -e "const trials=require('./simulation/evaluation/agent14-prospective-generic-funded-floatstone.cjs').registeredTrials(); console.log('REGISTERED_IDS',JSON.stringify(trials.map(t=>t.id)))"
      - name: Independent held Float Stone gate regression
        if: inputs.experiment == 'generic-field-census'
        run: node --test tests/agent14-floatstone-held-owner-gates.test.cjs
      - name: Pinned submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test Agent8 source-only adversarial native factor isolation
        if: inputs.experiment == 'agent8-source-challenger-2x2'
        run: |
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/evaluation/2026-11/agent8-source-challenger-2x2.cjs
          node --test tests/2026-11/agent8-source-challenger-2x2.test.cjs
      - name: Execute eight frozen four-way native source-counterfactual deals
        if: inputs.experiment == 'agent8-source-challenger-2x2'
        env:
          AGENT8_SOURCE_CHALLENGER_OUTPUT: artifacts/agent8-source-challenger-2x2.json
        run: node simulation/evaluation/2026-11/agent8-source-challenger-2x2.cjs
      - name: Preserve all 32 native attempts including caps, errors, and Store roots
        if: always() && inputs.experiment == 'agent8-source-challenger-2x2'
        uses: actions/upload-artifact@v4
        with:
          name: agent8-source-challenger-fourway-native
          path: artifacts/agent8-source-challenger-2x2.json
          if-no-files-found: warn
          retention-days: 21
      - name: Test Agent8 owner Quick Ball and Mail source-only challenge
        if: inputs.experiment == 'agent8-source-challenger-2x2-v2'
        run: |
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/evaluation/2026-11/agent8-source-challenger-2x2-v2.cjs
          node --test tests/2026-11/agent8-source-challenger-2x2.test.cjs tests/2026-11/agent8-source-challenger-v2.test.cjs
      - name: Execute eight new frozen original-source Quick Ball Mail counterfactuals
        if: inputs.experiment == 'agent8-source-challenger-2x2-v2'
        env:
          AGENT8_SOURCE_CHALLENGER_V2_OUTPUT: artifacts/agent8-source-challenger-v2.json
        run: node simulation/evaluation/2026-11/agent8-source-challenger-2x2-v2.cjs
      - name: Archive all V2 native game actions and source-only changed root decisions
        if: always() && inputs.experiment == 'agent8-source-challenger-2x2-v2'
        uses: actions/upload-artifact@v4
        with:
          name: agent8-source-search-challenger-v2-native
          path: artifacts/agent8-source-challenger-v2.json
          if-no-files-found: warn
          retention-days: 21
      - name: Test Agent8 source-only Mew Genesect draw and Regidrago evolution
        if: inputs.experiment == 'agent8-source-challenger-2x2-v3'
        run: |
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/evaluation/2026-11/agent8-source-challenger-2x2-v3.cjs
          node --test tests/2026-11/agent8-source-challenger-v2.test.cjs tests/2026-11/agent8-source-challenger-v3.test.cjs
      - name: Execute new source-owned Ability and evolution four-way real Store games
        if: inputs.experiment == 'agent8-source-challenger-2x2-v3'
        env:
          AGENT8_SOURCE_CHALLENGER_V3_OUTPUT: artifacts/agent8-source-challenger-v3.json
        run: node simulation/evaluation/2026-11/agent8-source-challenger-2x2-v3.cjs
      - name: Preserve genuine v3 original-source opponent Ability and evolution native ledgers
        if: always() && inputs.experiment == 'agent8-source-challenger-2x2-v3'
        uses: actions/upload-artifact@v4
        with:
          name: agent8-source-ability-evolution-v3-native
          path: artifacts/agent8-source-challenger-v3.json
          if-no-files-found: warn
          retention-days: 21
      - name: Test Agent8 corrected actor-seat-only natural evolution policy
        if: inputs.experiment == 'agent8-source-evolution-v4'
        run: |
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --check simulation/evaluation/2026-11/agent8-source-evolution-2x2-v4.cjs
          node --test tests/agent1-actor-evolution-frontier.test.cjs tests/2026-11/agent8-source-evolution-v4.test.cjs
      - name: Run preregistered original-source-only evolution with real native Store
        if: inputs.experiment == 'agent8-source-evolution-v4'
        env:
          AGENT8_EVOLUTION_V4_OUTPUT: artifacts/agent8-source-evolution-v4.json
        run: node simulation/evaluation/2026-11/agent8-source-evolution-2x2-v4.cjs
      - name: Preserve 32 new physical source-only evolution counterfactuals
        if: always() && inputs.experiment == 'agent8-source-evolution-v4'
        uses: actions/upload-artifact@v4
        with:
          name: agent8-source-evolution-v4-corrected-native
          path: artifacts/agent8-source-evolution-v4.json
          if-no-files-found: warn
          retention-days: 21
      - name: Reinspect all owner Passes in two existing original-source matched controls
        if: inputs.experiment == 'agent31-allowner-pass-native'
        env:
          AGENT31_PASS_CENSUS_OUTPUT: agent31-allowner-pass.json
        run: node --test tests/agent31-allowner-pass-retrospective-native.test.cjs
      - name: Preserve complete read-only two-seat Pass native archive
        if: always() && inputs.experiment == 'agent31-allowner-pass-native'
        uses: actions/upload-artifact@v4
        with:
          name: agent31-allowner-pass-native
          path: agent31-allowner-pass.json
          if-no-files-found: warn
          retention-days: 21
      - name: Audit prospectively registered rank5/rank11 all owner Passes
        if: inputs.experiment == 'agent31-allowner-pass-fresh-native'
        env:
          AGENT31_FRESH_ALLPASS_OUTPUT: agent31-prospective-allpass-r5-r11.json
        run: node simulation/evaluation/agent31-prospective-allpass-r5-r11.cjs
      - name: Archive fresh all-owner Pass audit
        if: always() && inputs.experiment == 'agent31-allowner-pass-fresh-native'
        uses: actions/upload-artifact@v4
        with:
          name: agent31-prospective-allpass-r5-r11-native
          path: agent31-prospective-allpass-r5-r11.json
          if-no-files-found: warn
          retention-days: 21
      - name: Execute paired native falsification
        if: inputs.experiment == 'rank11-replay'
        run: node simulation/evaluation/agent14-native-floatstone-reply-falsification.cjs
      - name: Real two-seat multi-family generic funded mobility
        if: inputs.experiment == 'generic-funded-floatstone'
        run: node --test tests/agent14-generic-funded-floatstone-frontier.native.test.cjs
      - name: Prospective real original-source matched baseline and generic mobility
        if: inputs.experiment == 'generic-field-matched'
        run: node simulation/evaluation/agent14-prospective-generic-funded-floatstone.cjs
      - name: Observer-only original-source root opportunity census
        if: inputs.experiment == 'generic-field-census'
        run: node simulation/evaluation/agent14-generic-funded-floatstone-census.cjs
      - name: Archive observer-only control replay audit
        if: always() && inputs.experiment == 'generic-field-census'
        uses: actions/upload-artifact@v4
        with:
          name: agent14-generic-funded-floatstone-census
          path: agent14-generic-funded-floatstone-census.json
          if-no-files-found: warn
          retention-days: 21
      - name: Check bounded VS Seeker Guzma scaling decision
        if: inputs.experiment == 'agent31-postgust-seeker-native'
        run: node --test tests/2026-11/agent31-late-seeker-guzma-prize.test.cjs tests/2026-11/agent31-postgust-native-ledger-evidence.test.cjs
      - name: Reproduce selected original rank11 turn36 recovery with exact native A/B/A
        if: inputs.experiment == 'agent31-postgust-seeker-native'
        env:
          AGENT31_POSTGUST_SEEKER_NATIVE_OUTPUT: agent31-rank11-postgust-seeker-aba.json
        run: node simulation/evaluation/agent31/late-seeker-guzma-postgust-aba.cjs
      - name: Preserve all real Store arms including failures
        if: always() && inputs.experiment == 'agent31-postgust-seeker-native'
        uses: actions/upload-artifact@v4
        with:
          name: agent31-rank11-postgust-seeker-aba
          path: agent31-rank11-postgust-seeker-aba.json
          if-no-files-found: warn
          retention-days: 21
      - name: Actual same original game without any scripted owner seat or turn
        if: inputs.experiment == 'agent31-portable-joint-native'
        env:
          AGENT31_PORTABLE_JOINT_OUTPUT: agent31-portable-joint-aba.json
        run: node simulation/evaluation/agent31/portable-floatstone-seeker-guzma-aba.cjs
      - name: Preflight preregistered prospective 29-rank fixed-champion field
        if: inputs.experiment == 'agent3-portable-champion-all29'
        run: |
          node --check simulation/evaluation/agent3/portable-champion-all29-20261109.cjs
          node -e "const r=require('./simulation/evaluation/agent3/portable-champion-all29-20261109.cjs'); const g=r.registered(); console.log('REGISTERED_ORIGINAL_RANKS_AND_SEATS',g.length,new Set(g.map(x=>x.rank)).size)"
      - name: Execute fresh 116 real native unchanged champion against all 29 originals
        if: inputs.experiment == 'agent3-portable-champion-all29'
        env:
          AGENT3_PORTABLE_ALL29_OUTPUT: artifacts/agent3-portable-champion-all29-20261109.json
        run: node simulation/evaluation/agent3/portable-champion-all29-20261109.cjs
      - name: Preserve all 116 native attempts, including bot errors and root caps
        if: always() && inputs.experiment == 'agent3-portable-champion-all29'
        uses: actions/upload-artifact@v4
        with:
          name: agent3-portable-champion-all29-prospective
          path: artifacts/agent3-portable-champion-all29-20261109.json
          if-no-files-found: warn
          retention-days: 21
      - name: Save all portable-policy native games, including censors
        if: always() && inputs.experiment == 'agent31-portable-joint-native'
        uses: actions/upload-artifact@v4
        with:
          name: agent31-portable-joint-aba
          path: agent31-portable-joint-aba.json
          if-no-files-found: warn
          retention-days: 21
      - name: Archive all real original-source attempts, including aborts
        if: always() && inputs.experiment == 'generic-field-matched'
        uses: actions/upload-artifact@v4
        with:
          name: agent14-prospective-generic-funded-floatstone
          path: |
            agent14-prospective-generic-funded-floatstone.json
            agent14-prospective-generic-funded-floatstone.json.sha256
          if-no-files-found: error
          retention-days: 21
      - if: always() && inputs.experiment == 'rank11-replay'
        uses: actions/upload-artifact@v4
        with:
          name: agent14-rank11-native-catcher-floatstone-two
          path: agent14-rank11-native-floatstone-return-two.json
          if-no-files-found: warn
          retention-days: 21
