name: Aichi rank-10 Mimikyu Copycat paired diagnostic

on:
  workflow_dispatch:
    inputs:
      run_extra_shred_policy:
        description: 'Run experimental Agent 28 full-game Shred bot policy fork'
        type: boolean
        required: false
        default: false
      run_ordinal_audit:
        description: 'Compare authentic Shred source fork with no prior generic bot choice'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  source-ranked-copycat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test source-turn-28 Shred opponent-response fork
        run: node --test tests/mimikyu-turn28-shred-fork.test.cjs tests/rank10-copycat-response-ledger.test.cjs tests/rank10-turn28-bot-fingerprint.test.cjs
      - name: Compare archived extra-turn retreat with physical source Shred attack
        run: node simulation/twinleaf/rank10-mimikyu-shred-source-fork.cjs > rank10-mimikyu-shred-source-fork.json
      - name: Fingerprint original source-root turn-28 retreat proposal
        if: ${{ inputs.run_ordinal_audit }}
        run: node simulation/twinleaf/rank10-turn28-bot-fingerprint.cjs > rank10-turn28-original-bot-graph.json
      - name: Print source-root bot graph-change verdict
        if: ${{ inputs.run_ordinal_audit }}
        run: node -e "const x=require('./rank10-turn28-original-bot-graph.json'); console.log(JSON.stringify(x.observed));"
      - name: Preserve root original bot graph diagnostic
        if: ${{ always() && inputs.run_ordinal_audit }}
        uses: actions/upload-artifact@v4
        with:
          name: rank10-turn28-original-bot-graph
          path: rank10-turn28-original-bot-graph.json
          if-no-files-found: warn
      - name: Audit source-root Shred policy without default bot pre-decision
        if: ${{ inputs.run_ordinal_audit }}
        env:
          COPYCAT_ORDINAL_AUDIT: '1'
        run: node simulation/twinleaf/rank10-mimikyu-shred-source-fork.cjs > rank10-mimikyu-ordinal-source-audit.json
      - name: Print ordinal-source decision evidence
        if: ${{ inputs.run_ordinal_audit }}
        run: node -e "const x=require('./rank10-mimikyu-ordinal-source-audit.json'); console.log(JSON.stringify(x.ordinalSourceAudit));"
      - name: Preserve source-ordinal audit
        if: ${{ always() && inputs.run_ordinal_audit }}
        uses: actions/upload-artifact@v4
        with:
          name: rank10-mimikyu-ordinal-source-audit
          path: rank10-mimikyu-ordinal-source-audit.json
          if-no-files-found: warn
      - name: Show source-aligned knockout counterfactual
        run: node -e "const x=require('./rank10-mimikyu-shred-source-fork.json'); console.log(JSON.stringify({firstDivergence:x.firstSourceDivergence,printedOpportunity:x.sourceOpportunity,chosen:x.chosenAttack,original:x.original,counterfactual:x.counterfactual,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Preserve turn-28 source-game Shred counterfactual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-mimikyu-shred-source-fork
          path: rank10-mimikyu-shred-source-fork.json
          if-no-files-found: warn
      - name: Verify spent-GX Copycat Apex Shred knockout and non-KO controls
        run: node simulation/twinleaf/mimikyu-extra-turn-shred-action.cjs > rank10-shred-store-action.json
      - name: Report Shred action-only result
        run: node -e "const x=require('./rank10-shred-store-action.json'); console.log(JSON.stringify(x));"
      - name: Archive Shred Store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-shred-store-action
          path: rank10-shred-store-action.json
          if-no-files-found: warn
      - name: Verify exact source-turn28 Shred predicate and archive controls
        run: node --test tests/mimikyu-extra-turn-shred-policy.test.cjs tests/aichi-rank10-shred-window.test.cjs
      - name: Validate standalone source diagnostics
        run: node --test tests/mimikyu-rank10-policy-pair.test.cjs tests/copycat-turn-start-evidence.test.cjs tests/mimikyu-source-turn27-setup.test.cjs
      - name: Verify source-graph fingerprint observer stays read-only
        run: node --test tests/rank10-live-decision-noninterference.test.cjs
      - name: Capture authentic rank-10 turn-27 root decision source noninterference
        run: node simulation/twinleaf/rank10-live-decision-noninterference.cjs > rank10-turn27-mutation.json
      - name: Print bounded turn-27 graph mutation verdict
        run: node -e "const x=require('./rank10-turn27-mutation.json'); console.log(JSON.stringify({trial:x.trial.id,target:x.target,identicalUninstrumentedControl:x.matchedEngineControlSummary,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Run source-locked rank-10 fixed-seed Copycat A/B
        run: node simulation/twinleaf/mimikyu-rank10-policy-pair.cjs > rank10-copycat-paired.json
      - name: Print bounded findings
        run: node -e "const x=require('./rank10-copycat-paired.json'); for(const p of x.pairs) console.log(JSON.stringify({trial:p.trialId,first:p.candidateActuallyFirst,control:p.control.prizesRemaining,experiment:p.experimental.prizesRemaining,firstDivergence:p.firstMeaningfulDifference?.index ?? null,prepPrizes:p.sourceSetup.prizesRemaining,prepAttack:p.sourceSetup.attackTrace.map(a=>a.attack),prepDivergence:p.firstSourceSetupDifference?.index ?? null}));"
      - name: Preserve exact diagnostic events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-copycat-paired
          path: rank10-copycat-paired.json
          if-no-files-found: warn
      - name: Run source-locked rank-10 turn28 Shred counterfactual
        if: ${{ inputs.run_extra_shred_policy }}
        run: node simulation/twinleaf/rank10-extra-turn-shred-fork.cjs > rank10-turn28-shred-fork.json
      - name: Print bounded Shred source-game verdict
        if: ${{ inputs.run_extra_shred_policy }}
        run: node -e "const x=require('./rank10-turn28-shred-fork.json'); console.log(JSON.stringify({trial:x.trial.id,unchangedPrefix:x.unchangedSourceSetupThroughTurn28,copycat:x.observedSourceCopycatTurn28,twoPrize:x.observedTwoPrizePickupAfterTurn28,control:x.control.prizesRemaining,alternative:x.experimental.prizesRemaining,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Preserve conditional Shred full-game observations
        if: ${{ always() && inputs.run_extra_shred_policy }}
        uses: actions/upload-artifact@v4
        with:
          name: rank10-turn28-shred-fork
          path: rank10-turn28-shred-fork.json
          if-no-files-found: warn
