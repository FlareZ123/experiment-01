name: Aichi rank-10 Mimikyu Copycat paired diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-ranked-copycat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify spent-GX Copycat Apex Shred knockout and non-KO controls
        run: node simulation/twinleaf/mimikyu-extra-turn-shred-action.cjs > rank10-shred-store-action.json
      - name: Report Shred action-only result
        run: node -e "const x=require('./rank10-shred-store-action.json'); console.log(JSON.stringify(x));"
      - name: Archive Shred Store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-shred-store-action
          path: rank10-shred-store-action.json
          if-no-files-found: warn
      - name: Validate standalone source diagnostics
        run: node --test tests/mimikyu-rank10-policy-pair.test.cjs tests/copycat-turn-start-evidence.test.cjs tests/mimikyu-source-turn27-setup.test.cjs
      - name: Verify source-graph fingerprint observer stays read-only
        run: node --test tests/rank10-live-decision-noninterference.test.cjs
      - name: Capture authentic rank-10 turn-27 root decision source noninterference
        run: node simulation/twinleaf/rank10-live-decision-noninterference.cjs > rank10-turn27-mutation.json
      - name: Print bounded turn-27 graph mutation verdict
        run: node -e "const x=require('./rank10-turn27-mutation.json'); console.log(JSON.stringify({trial:x.trial.id,target:x.target,identicalUninstrumentedControl:x.matchedEngineControlSummary,qualified:x.qualifiedForCompetitiveInference}));"
      - name: Run source-locked rank-10 fixed-seed Copycat A/B
        run: node simulation/twinleaf/mimikyu-rank10-policy-pair.cjs > rank10-copycat-paired.json
      - name: Print bounded findings
        run: node -e "const x=require('./rank10-copycat-paired.json'); for(const p of x.pairs) console.log(JSON.stringify({trial:p.trialId,first:p.candidateActuallyFirst,control:p.control.prizesRemaining,experiment:p.experimental.prizesRemaining,firstDivergence:p.firstMeaningfulDifference?.index ?? null,prepPrizes:p.sourceSetup.prizesRemaining,prepAttack:p.sourceSetup.attackTrace.map(a=>a.attack),prepDivergence:p.firstSourceSetupDifference?.index ?? null}));"
      - name: Preserve exact diagnostic events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank10-copycat-paired
          path: rank10-copycat-paired.json
          if-no-files-found: warn
