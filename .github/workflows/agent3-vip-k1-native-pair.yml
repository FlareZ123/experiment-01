name: Agent3 original rank11 VIP owner-K1 native comparison

on:
  workflow_dispatch:
    inputs:
      rank26_natural_pre_koko:
        description: 'Optional 24 original-deal owner-only pre-Koko Cologne matched cohort'
        required: false
        type: boolean
        default: false
      rank26_prerequisite_census:
        description: 'Optional retrospective owner-only first-turn prerequisite census'
        required: false
        type: boolean
        default: false
      rank26_source_energy_setup:
        description: 'Optional fresh source original-60 owner-energy setup paired cohort'
        required: false
        type: boolean
        default: false
      rank26_compressor_settlement_v2:
        description: 'Fresh 24-pair rank26 real physical deck-to-discard settlement audit'
        required: false
        type: boolean
        default: false
      rank26_post_compressor_gates_v21:
        description: 'Same-deal retrospective first-turn physical settlement and source prerequisite gates'
        required: false
        type: boolean
        default: false
      rank26_one_lightning_koko_native:
        description: 'Staged printed 60 both-seat Koko one Lightning ability and Crisis Punch witness'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-owner-vip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Check standalone owner-only and exact-card-location regressions
        run: node --test tests/agent3-owner-evolution-vip-search.test.cjs tests/agent3-source-rank11-vip-role-selector.test.cjs tests/agent3-rank11-vip-k1-combinatorics.test.cjs tests/agent3-rank11-vip-role-location-census.test.cjs tests/aichi-first-player-supporter-exceptions.test.cjs tests/agent3-rank26-pre-koko-cologne-opportunity.test.cjs tests/agent3-rank26-readonly-prerequisite-census.test.cjs tests/agent3-rank26-energy-setup.test.cjs tests/agent3-compressor-discard-settlement.test.cjs tests/agent3-rank26-post-compressor-gate-v21.test.cjs
      - name: Install pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned game engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run registered three-arm original rank11 VIP policy comparison
        run: node simulation/evaluation/agent3-source-vip-k1-native-pair.cjs > agent3-vip-k1-native-actual.json
      - name: Archive exact native action receipts, including failed and censored arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-vip-k1-native-actual
          path: agent3-vip-k1-native-actual.json
          if-no-files-found: warn
          retention-days: 15

      - name: Complete original rank26 2+2+1 native self-KOs through printed first-turn Crisis Punch
        run: |
          node simulation/twinleaf/rank26-unown-full-crisis-native.cjs > agent3-rank26-full-crisis-native.json
          node -e "const r=require('./agent3-rank26-full-crisis-native.json');if(r.cases.length!==2||r.cases.some(x=>!x.continuation?.realStoreAttack||!x.continuation?.original60BothSeatsConserved||x.continuation.competitiveGameQualified!==false))throw Error('Original source both-seat staged end-to-end Crisis Punch evidence missing');console.log('Two original-60 staged source seat completions confirmed; zero qualified games')"
      - name: Preserve staged original rank26 full Crisis Punch physical action receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-full-crisis-native
          path: agent3-rank26-full-crisis-native.json
          if-no-files-found: warn
          retention-days: 15

      - name: Compare frozen and opt-in owner-only rank26 Cologne on 24 natural deals
        if: inputs.rank26_natural_pre_koko
        run: node simulation/twinleaf/rank26-natural-pre-koko-cologne-cohort.cjs > agent3-rank26-natural-pre-koko-cohort.json
      - name: Preserve all natural first-turn attempts, native errors and exact original source fingerprints
        if: always() && inputs.rank26_natural_pre_koko
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-natural-pre-koko-original-source
          path: agent3-rank26-natural-pre-koko-cohort.json
          if-no-files-found: warn
          retention-days: 15

      - name: Read-only retrospective source-visible opportunity census
        if: inputs.rank26_prerequisite_census
        run: node simulation/twinleaf/rank26-prerequisite-census-v12.cjs > agent3-rank26-source-gates-v12.json
      - name: Archive all retrospective source-visible gate reads and failed attempts
        if: always() && inputs.rank26_prerequisite_census
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-source-gates-v12
          path: agent3-rank26-source-gates-v12.json
          if-no-files-found: warn
          retention-days: 15

      - name: Test prospective source-owned Energy preparation on all preregistered original deals
        if: inputs.rank26_source_energy_setup
        run: node simulation/twinleaf/agent3-rank26-energy-source-prospective-v1.cjs > agent3-rank26-energy-source-cohort-v1.json
      - name: Archive all 24 fresh physical deals and accepted source prompt receipts
        if: always() && inputs.rank26_source_energy_setup
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-energy-source-prospective-v1
          path: agent3-rank26-energy-source-cohort-v1.json
          if-no-files-found: warn
          retention-days: 15

      - name: Trace true source-owned Battle Compressor physical discard transitions on 24 fresh pairs
        if: inputs.rank26_compressor_settlement_v2
        run: node simulation/twinleaf/agent3-rank26-compressor-settlement-prospective-v2.cjs
      - name: Preserve every original rank26 physical-settlement pair, including failed arms
        if: always() && inputs.rank26_compressor_settlement_v2
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-compressor-physical-settlement-v2
          path: agent3-rank26-physical-compressor-v2.json
          if-no-files-found: warn
          retention-days: 15

      - name: Read-only same-seed v2.1 first-turn post-Compressor source gate replay
        if: inputs.rank26_post_compressor_gates_v21
        run: node simulation/twinleaf/agent3-rank26-post-compressor-gate-v21.cjs
      - name: Preserve all original source firstturn root gates and actual card-settlement receipts
        if: always() && inputs.rank26_post_compressor_gates_v21
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-post-compressor-readonly-v21
          path: agent3-rank26-post-compressor-gates-v21.json
          if-no-files-found: warn
          retention-days: 15

      - name: Validate one-Lightning Tapu Koko native prompt through original-source Crisis Punch both seats
        if: inputs.rank26_one_lightning_koko_native
        run: |
          node simulation/twinleaf/agent3-rank26-koko-one-lightning-native.cjs > agent3-rank26-one-lightning-native.json
          node -e "const r=require('./agent3-rank26-one-lightning-native.json');if(r.cases.length!==2||r.cases.some(x=>!x.continuation?.pinnedNativePromptAcceptedOneLightning||!x.continuation?.firstturnCrisisPunchNativeAttack||!x.continuation?.originalPhysical60ConservedBothSeats||x.continuation.competitiveGameQualified!==false))throw Error('Staged one-Lightning native both-seat witness failed');console.log('AGENT3_ONE_LIGHTNING_NATIVE_TWO_SEATS',JSON.stringify(r.cases.map(c=>({sourceSeat:c.sourceSeat,paperOneLightning:c.continuation.pinnedNativePromptAcceptedOneLightning,sourceWin:c.continuation.firstturnCrisisPunchNativeAttack,qualified:c.continuation.competitiveGameQualified}))))"
      - name: Preserve exact original 60 one-Lightning native source both-seat receipts
        if: always() && inputs.rank26_one_lightning_koko_native
        uses: actions/upload-artifact@v4
        with:
          name: agent3-rank26-one-lightning-koko-native
          path: agent3-rank26-one-lightning-native.json
          if-no-files-found: warn
          retention-days: 15
