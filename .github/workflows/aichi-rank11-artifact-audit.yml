name: Inspect archived Aichi rank11 source policy artifact

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: Which archived evidence protocol to audit
        required: true
        default: source-policy-legacy
        type: choice
        options:
          - source-policy-legacy
          - prospective-exposure-v1
          - prospective-exposure-complete-v1
          - first-vip-source-v1
          - crossrank-partition0-disposition
          - crossrank-rejected-one-root
          - newmoon-first-vip-archive-16
          - canonical-20261029-source-pairs
          - heldout-active-headway-20261103
      archived_run:
        description: GitHub Actions run containing rank11 source regression and campaign reports
        required: true
        default: '39090207009'
        type: string
      artifact_name:
        description: Exact name of the source-locked archived report bundle
        required: true
        default: aichi-rank6-rank11-autonomous-boostshake-v1-decisions
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reproducible prior-run artifact
        if: ${{ inputs.audit_mode != 'prospective-exposure-complete-v1' && inputs.audit_mode != 'canonical-20261029-source-pairs' && inputs.audit_mode != 'heldout-active-headway-20261103' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.archived_run }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir .
      - name: Print compact source and four-arm policy evidence
        if: ${{ inputs.audit_mode == 'source-policy-legacy' }}
        run: node scripts/rank11-archived-artifact-summary.cjs
      - name: Verify prospectively registered rank11 trial denominator and starting order
        if: ${{ inputs.audit_mode == 'prospective-exposure-v1' }}
        run: node scripts/rank11-prospective-artifact-summary.cjs
      - name: Download all four immutable rank11 prospective source partitions
        if: ${{ inputs.audit_mode == 'prospective-exposure-complete-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: aichi-rank6-expanded-action-fidelity-probe-v1-decisions
        run: |
          gh run download 39095223455 --repo "$GITHUB_REPOSITORY" --name "$ARCHIVE_NAME" --dir rank11-evidence/partition-0
          gh run download 39188853881 --repo "$GITHUB_REPOSITORY" --name "$ARCHIVE_NAME" --dir rank11-evidence/partition-1
          gh run download 39189483558 --repo "$GITHUB_REPOSITORY" --name "$ARCHIVE_NAME" --dir rank11-evidence/partition-2
          gh run download 39189495377 --repo "$GITHUB_REPOSITORY" --name "$ARCHIVE_NAME" --dir rank11-evidence/partition-3
      - name: Test whole-cohort tamper and missing-trial rejection
        if: ${{ inputs.audit_mode == 'prospective-exposure-complete-v1' }}
        run: node --test tests/rank11-prospective-complete-census.test.cjs
      - name: Validate every archived byte and all 64 prospectively registered source attempts
        if: ${{ inputs.audit_mode == 'prospective-exposure-complete-v1' }}
        run: node scripts/rank11-prospective-complete-census.cjs
      - name: Audit every frozen cross-rank partition-0 arm and source-trigger attempt
        if: ${{ inputs.audit_mode == 'crossrank-partition0-disposition' }}
        run: node scripts/agent6-crossrank-disposition.cjs agent41-crossrank-observed.json
      - name: Recover only the previously rejected cross-rank owner/public decision
        if: ${{ inputs.audit_mode == 'crossrank-rejected-one-root' }}
        run: node -e "const x=require('./agent6-crossrank-rejected-root.json');console.log(JSON.stringify(x,null,2))"
      - name: Independently audit all 16 registered New Moon native VIP source deals
        if: ${{ inputs.audit_mode == 'newmoon-first-vip-archive-16' }}
        run: |
          node --test tests/agent7-newmoon-vip-archive-audit.test.cjs
          node scripts/agent7-newmoon-vip-archive-audit.cjs newmoon-first-own-vip-prospective.json
      - name: Download immutable original 32-arm prospective Store archive
        if: ${{ inputs.audit_mode == 'canonical-20261029-source-pairs' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40918541683 --repo "$GITHUB_REPOSITORY" --name "rank11-exclusive-prospective-v1-sametarget-corrected-unqualified" --dir .
      - name: Test and authenticate 16 registered source deals and first-turn targets
        if: ${{ inputs.audit_mode == 'canonical-20261029-source-pairs' }}
        run: |
          node --test tests/aichi-rank11-direct-opening-probability.test.cjs tests/agent8-prospective-source-deal-audit.test.cjs tests/agent8-source-firstturn-physical-recipients.test.cjs tests/agent8-original-source-control-play-coverage.test.cjs tests/agent8-rank11-vip-als-target-characterization.test.cjs
          node scripts/agent8-audit-registered-source-pairs.cjs agent41-prospective-canonical-32.json > /tmp/agent8-original-prospective-source-audit.json
          node -e "const assert=require('node:assert/strict');const a=require('/tmp/agent8-original-prospective-source-audit.json');const x=a.sourceDealAudit,y=a.sourceFirstTurnAudit;assert.equal(x.registeredSeedCells,16);assert.equal(x.alignedSourceDealCells,15);assert.equal(x.mismatchedSourceDealCells,1);assert.equal(y.sourceDealPairsAligned,15);assert.equal(y.sameObservedFirstTurnActions,15);assert.equal(y.differentObservedFirstTurnActions,0);assert.equal(y.observedFirstTurnTargetActions,11);const q=a.sourcePlayCoverage;assert.equal(q.attemptedArms,32);const s6=q.perRank.find(z=>z.rank===6),s11=q.perRank.find(z=>z.rank===11);assert.equal(s6.firstOwnTurnsWithOnlyPass,16);assert.equal(s6.sourcePriorityPlanCardPlays,0);assert.equal(s6.sourceSupporterPlays,5);assert.equal(s6.nativeRootCounts.PassTurnAction,324);assert.equal(s11.sourceSupporterPlays,0);assert.equal(s11.sourcePriorityPlanCardPlays,0);assert.equal(s11.nativeRootCounts.AttackAction,199);console.log('AGENT8_ORIGINAL_SOURCE_PAIR_AUDIT_PASS',JSON.stringify({registered:x.registeredSeedCells,matched:x.alignedSourceDealCells,unmatched:x.mismatchedSourceDealCells,sameNativeFirstTurn:y.sameObservedFirstTurnActions,observedTargetActions:y.observedFirstTurnTargetActions,rank6FirstPass:s6.firstOwnTurnsWithOnlyPass,rank6ControlPlays:s6.sourcePriorityPlanCardPlays,rank11SupporterPlays:s11.sourceSupporterPlays,competitiveQualified:a.competitiveQualifiedGames}))"
      - name: Print authentic first-turn VIP selection evidence
        if: ${{ inputs.audit_mode == 'first-vip-source-v1' }}
        run: node -e "const x=require('./rank11-newmoon-first-vip-counterfactual.json');console.log(JSON.stringify({seed:x.seed,originalOpening:x.baseline.audit.opening,control:x.baseline.audit.events,counterfactual:x.alternative.audit.events,firstActions:x.alternative.firstActions.map(a=>({turn:a.turnBefore,action:a.action,card:a.card}))},null,2))"

      - name: Download immutable Agent10 heldout original rank11 source native archive
        if: ${{ inputs.audit_mode == 'heldout-active-headway-20261103' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41597727878 --repo "$GITHUB_REPOSITORY" --name "agent10-rank11-heldout-headway-4seed-native" --dir heldout-native
      - name: Independently audit 24 original source receipts, full physical pairing and Claw onset
        if: ${{ inputs.audit_mode == 'heldout-active-headway-20261103' }}
        run: |
          node --test tests/agent10-rank11-heldout-native-custody-audit.test.cjs
          node scripts/agent10-rank11-heldout-native-custody-audit.cjs heldout-native/agent10-rank11-heldout-headway-4seed.json > agent10-heldout-native-independent-audit.json
          node -e "const r=require('./agent10-heldout-native-independent-audit.json');console.log(JSON.stringify({schema:r.schema,attempts:r.actualNativeAttempts,withinContextPhysicalPairs:r.verifiedWithinCandidatePhysicalComparisons,crossCandidateSourcePairs:r.verifiedCrossCandidateSourceComparisons,summary:r.dispositions,sameRootDifferentPhysicalTargets:r.sameRootDifferentNativeTargetContexts.map(x=>({id:x.id,factor:x.factor,physicalBoardRecipientConfirmed:x.confirmedDifferentPublicBoardRecipients,printing:x.targetDifference.control?.printing,control:x.targetDifference.control?.acceptedTarget,alternative:x.targetDifference.alternative?.acceptedTarget,turn:x.targetDifference.alternative?.turn})),sourceSeed:r.keyFreshSource.sourceSeed,firstRootDiff:r.keyFreshSource.rootDifferenceFromControl,firstClaw:Object.fromEntries(Object.entries(r.keyFreshSource.factors).map(([k,v])=>[k,v.firstClaw])),receipts:Object.fromEntries(Object.entries(r.keyFreshSource.factors).map(([k,v])=>[k,{firstSourceDarkness:v.acceptedOriginalSourceDarknessEnergy.slice(0,4),claws:v.settledClawEvidence}]))},null,2))"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.audit_mode == 'heldout-active-headway-20261103' }}
        with:
          name: agent10-rank11-heldout-independent-native-custody-audit
          path: agent10-heldout-native-independent-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Census native original rank11 selected Trainer roots across all 24 frozen attempts
        if: ${{ inputs.audit_mode == 'heldout-active-headway-20261103' }}
        run: |
          node --check scripts/agent10-rank11-heldout-source-als-coverage.cjs
          node --test tests/agent10-rank11-heldout-source-als-coverage.test.cjs
          node --test tests/agent10-rank11-original-opening-trainer-access-exact.test.cjs
          node --test tests/agent10-rank11-letter-k0-source-target.test.cjs
          node simulation/evaluation/agent10-rank11-original-opening-trainer-access-exact.cjs
          node scripts/agent10-rank11-heldout-source-als-coverage.cjs heldout-native/agent10-rank11-heldout-headway-4seed.json > agent10-heldout-source-trainer-coverage.json
          node -e "const r=require('./agent10-heldout-source-trainer-coverage.json');console.log(JSON.stringify({schema:r.schema,originalSeedGroups:r.originalTrialGroups,coverage:r.aggregate,qualified:r.qualifiedCompetitiveGames},null,2))"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.audit_mode == 'heldout-active-headway-20261103' }}
        with:
          name: agent10-rank11-heldout-source-trainer-root-census
          path: agent10-heldout-source-trainer-coverage.json
          if-no-files-found: warn
          retention-days: 14
