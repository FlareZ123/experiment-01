name: Inspect archived Aichi rank11 source policy artifact

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: Which archived evidence protocol to audit
        required: true
        default: source-policy-legacy
        type: choice
        options:
          - source-policy-legacy
          - prospective-exposure-v1
          - first-vip-source-v1
      archived_run:
        description: GitHub Actions run containing rank11 source regression and campaign reports
        required: true
        default: '39090207009'
        type: string
      artifact_name:
        description: Exact name of the source-locked archived report bundle
        required: true
        default: aichi-rank6-rank11-autonomous-boostshake-v1-decisions
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reproducible prior-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.archived_run }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir .
      - name: Print compact source and four-arm policy evidence
        if: ${{ inputs.audit_mode == 'source-policy-legacy' }}
        run: node scripts/rank11-archived-artifact-summary.cjs
      - name: Verify prospectively registered rank11 trial denominator and starting order
        if: ${{ inputs.audit_mode == 'prospective-exposure-v1' }}
        run: node scripts/rank11-prospective-artifact-summary.cjs
      - name: Print authentic first-turn VIP selection evidence
        if: ${{ inputs.audit_mode == 'first-vip-source-v1' }}
        run: node -e "const x=require('./rank11-newmoon-first-vip-counterfactual.json');console.log(JSON.stringify({seed:x.seed,originalOpening:x.baseline.audit.opening,control:x.baseline.audit.events,counterfactual:x.alternative.audit.events,firstActions:x.alternative.firstActions.map(a=>({turn:a.turnBefore,action:a.action,card:a.card}))},null,2))"
