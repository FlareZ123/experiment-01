name: Agent37 rank5 original-source Fusion mobility paired native development

on:
  workflow_dispatch:
    inputs:
      agent13_selfcopy_pair:
        description: Run preregistered original rank5 owner Max Miracle A/B instead of historical eight arms
        required: false
        type: boolean
        default: false
      agent19_dualfixed_profile:
        description: Compare two fixed contender 60s versus four authentic original source ranks under joint paper engine profile
        required: false
        type: boolean
        default: false
      agent37_source_quickball_discard:
        description: Run retrospective original rank5 Quick Ball plus owner discard source development
        required: false
        type: boolean
        default: false
      agent37_quickball_preserve_attack:
        description: In source Quick Ball development preserve payable attack before Quick Ball
        required: false
        type: boolean
        default: false
      agent37_quickball_mew_search:
        description: In source Quick Ball development prioritize native Mew/Genesect owner deck search
        required: false
        type: boolean
        default: false
      agent37_quickball_generic_search:
        description: Isolate native generic owner search as the Mew-target control
        required: false
        type: boolean
        default: false

      agent37_fresh_quickball_search:
        description: Run 16 independently preregistered rank5 owner Quick Ball Mew-target versus generic-search native arms
        required: false
        type: boolean
        default: false
      agent37_mew_funding_factorial:
        description: Run new 32-arm owner Quick Ball search by source Mew DCE recipient factorial
        required: false
        type: boolean
        default: false
      agent37_mew_ultra_evolution:
        description: Run 16 fresh source-only owner Mew VMAX Ultra Ball evolution rescue native attempts
        required: false
        type: boolean
        default: false
      agent37_mew_ultra_payment_retro:
        description: Compare default versus DCI-protected source Ultra Ball payment on exposed evolution deals
        required: false
        type: boolean
        default: false
      agent37_mew_ultra_payment_independent:
        description: Run frozen independent four-seed native Ultra Ball payment two-arm source stress
        required: false
        type: boolean
        default: false
      agent37_mew_ultra_dci_v2:
        description: Run fresh original source Mew VMAX Ultra Ball dynamic DCI payment native arms
        required: false
        type: boolean
        default: false
      agent37_mew_quickball_payment:
        description: Run fresh matched original Mew Quick Ball DCE-preserving prompt payment native arms
        required: false
        type: boolean
        default: false
      agent37_mew_source_mail_afterpass:
        description: Run prospective original Mew source Mail after Pass owner native 16-game comparison
        required: false
        type: boolean
        default: false
      agent38_mail_hood_transfer:
        description: Run fresh fixed Hood versus champion Mew source Mail competence transfer test
        required: false
        type: boolean
        default: false
      agent37_native_power_smoke:
        description: Run minimal native Genesect ability-lock and Mail-abort tests only
        required: false
        type: boolean
        default: false
      agent37_klefki_replay:
        description: Replay one historical native Klefki Genesect invalid-power diagnostic seed
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  original-source-fusion-mobility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner-only Fusion draw and paid retreat pure and source evidence
        run: node --test tests/agent37-rank5-native-zero-attack-frontier.test.cjs tests/agent37-dce-mew-paid-retreat.test.cjs tests/agent37-genesect-public-fusion-draw.test.cjs tests/agent37-mew-genesect-quickball-search.test.cjs
      - name: Check out exact pinned original Twinleaf Store
        run: |
          git submodule update --init --depth=1 vendor/twinleaf
          git -C vendor/twinleaf rev-parse HEAD
      - name: Install genuine pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile genuine pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Native Both-seat Mew DCE retreat and Genesect draw prompt behavior
        if: ${{ !inputs.agent19_dualfixed_profile }}
        run: node --test tests/agent37-dce-mew-paid-retreat.native.test.cjs
      - name: Run preregistered eight original rank5 native arms without exclusions
        if: ${{ !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile && !inputs.agent37_source_quickball_discard && !inputs.agent37_fresh_quickball_search && !inputs.agent37_mew_funding_factorial && !inputs.agent37_mew_ultra_evolution && !inputs.agent37_mew_ultra_payment_retro && !inputs.agent37_mew_ultra_payment_independent && !inputs.agent37_mew_ultra_dci_v2 && !inputs.agent37_mew_quickball_payment && !inputs.agent37_mew_source_mail_afterpass && !inputs.agent38_mail_hood_transfer && !inputs.agent37_native_power_smoke && !inputs.agent37_klefki_replay }}
        run: |
          node simulation/evaluation/agent37-rank5-fusion-mobility-prospective.cjs > agent37-rank5-fusion-mobility-8arm.json
          node -e "const a=require('node:assert/strict'),r=require('./agent37-rank5-fusion-mobility-8arm.json');a.equal(r.requestedNativeAttempts,8);a.equal(r.competitiveQualifiedGames,0);a.equal(r.comparison.length,4);for(const mode of Object.values(r.modes))a.equal(mode.attempts.length,4);console.log('AGENT37_SOURCE_NATIVE_PAIR',JSON.stringify({schema:r.schema,preregistration:r.preregistrationSha256,sourceSha:r.originalSourcePrinted60Sha256,qualified:r.competitiveQualifiedGames,pairs:r.comparison.map(x=>({trial:x.trial.id,paired:x.sourceDealPairing,control:x.control,treatment:x.treatment,attackDelta:x.sameDealNativeAttackDelta}))},null,2));"
      - name: Retrospective rank5 source Quick Ball and native owner discard paired development
        if: ${{ !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile && inputs.agent37_source_quickball_discard && !inputs.agent37_fresh_quickball_search && !inputs.agent37_mew_funding_factorial && !inputs.agent37_mew_ultra_evolution && !inputs.agent37_mew_ultra_payment_retro && !inputs.agent37_mew_ultra_payment_independent && !inputs.agent37_mew_ultra_dci_v2 }}
        env:
          AGENT37_QUICKBALL_PRESERVE_ATTACK_DEV: ${{ inputs.agent37_quickball_preserve_attack }}
          AGENT37_QUICKBALL_MEW_SEARCH_DEV: ${{ inputs.agent37_quickball_mew_search }}
          AGENT37_QUICKBALL_GENERIC_SEARCH_DEV: ${{ inputs.agent37_quickball_generic_search }}
        run: |
          node --check simulation/evaluation/agent37-rank5-source-quickball-discard-retrospective.cjs
          node simulation/evaluation/agent37-rank5-source-quickball-discard-retrospective.cjs
      - name: Archive all retrospective source Quick Ball/discard development arms
        if: ${{ always() && inputs.agent37_source_quickball_discard }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-source-quickball-discard-8arm
          path: agent37-rank5-source-quickball-discard-8arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain every preregistered native original-source arm, even if census fails
        if: ${{ always() && !inputs.agent13_selfcopy_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-original-rank5-fusion-mobility-8arm
          path: agent37-rank5-fusion-mobility-8arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preflight independent rank5 owner Quick Ball search registration
        if: ${{ inputs.agent37_fresh_quickball_search && !inputs.agent37_mew_funding_factorial && !inputs.agent37_mew_ultra_evolution && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: |
          node --check simulation/evaluation/2026-11/agent37-rank5-fresh-quickball-owner-search-native.cjs
          node simulation/evaluation/2026-11/agent37-rank5-fresh-quickball-owner-search-native.cjs --inspect-only
      - name: Execute all 16 independently registered owner search native arms
        if: ${{ inputs.agent37_fresh_quickball_search && !inputs.agent37_mew_funding_factorial && !inputs.agent37_mew_ultra_evolution && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent37-rank5-fresh-quickball-owner-search-native.cjs
      - name: Archive all fresh rank5 source Quick Ball owner-search outcomes
        if: ${{ always() && inputs.agent37_fresh_quickball_search }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-fresh-quickball-owner-search-16arm
          path: agent37-rank5-fresh-quickball-owner-search-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preflight independent four-arm Mew-target and DCE funding factorial
        if: ${{ inputs.agent37_mew_funding_factorial && !inputs.agent37_mew_ultra_evolution && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: |
          node --check simulation/evaluation/2026-11/agent37-rank5-mew-search-funding-factorial-native.cjs
          node simulation/evaluation/2026-11/agent37-rank5-mew-search-funding-factorial-native.cjs --inspect-only
      - name: Execute all 32 preregistered Mew-target and DCE source funding factorial arms
        if: ${{ inputs.agent37_mew_funding_factorial && !inputs.agent37_mew_ultra_evolution && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-search-funding-factorial-native.cjs
      - name: Archive all 32 owner Mew search and DCE funding native outcomes
        if: ${{ always() && inputs.agent37_mew_funding_factorial }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-mew-search-dce-funding-factorial-32arm
          path: agent37-rank5-mew-search-dce-funding-factorial-32arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Pure owner Mew Ultra Ball evolutionary search and root acceptance tests
        if: ${{ inputs.agent37_mew_ultra_evolution && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: |
          node --check simulation/twinleaf/agent37/mew-ultraball-evolution.cjs
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/agent37-mew-ultraball-evolution.test.cjs
      - name: Preflight fresh rank5 Mew VMAX Ultra Ball evolution native registration
        if: ${{ inputs.agent37_mew_ultra_evolution && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: |
          node --check simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-evolution-native.cjs
          node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-evolution-native.cjs --inspect-only
      - name: Run 16 actual original-source Mew Ultra Ball evolution arms
        if: ${{ inputs.agent37_mew_ultra_evolution && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-evolution-native.cjs
      - name: Archive all original-source Mew Ultra Ball evolution arms
        if: ${{ always() && inputs.agent37_mew_ultra_evolution }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-mew-ultraball-evolution-16arm
          path: agent37-rank5-mew-ultraball-evolution-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Pure exact-owner Ultra Ball mandatory two-card payment tests
        if: ${{ inputs.agent37_mew_ultra_payment_retro && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: |
          node --check simulation/twinleaf/agent37/mew-ultraball-evolution.cjs
          node --check simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-retrospective.cjs
          node --test tests/agent37-mew-ultraball-evolution.test.cjs
      - name: Inspect previously exposed original Mew Ultra Ball payment counterfactual
        if: ${{ inputs.agent37_mew_ultra_payment_retro && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-retrospective.cjs --inspect-only
      - name: Run 16 actual native original-source Ultra Ball payment safety attempts
        if: ${{ inputs.agent37_mew_ultra_payment_retro && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-retrospective.cjs
      - name: Archive all retrospective source Mew Ultra Ball payment safety attempts
        if: ${{ always() && inputs.agent37_mew_ultra_payment_retro }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-mew-ultraball-payment-retro-16arm
          path: agent37-rank5-mew-ultraball-payment-retro-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate frozen independent owner Ultra Ball protected-payment native registration
        if: ${{ inputs.agent37_mew_ultra_payment_independent && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: |
          node --check simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-independent.cjs
          node --test tests/agent37-mew-ultraball-evolution.test.cjs
          node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-independent.cjs --inspect-only
      - name: Run all 16 independently registered native owner Ultra Ball payment games
        if: ${{ inputs.agent37_mew_ultra_payment_independent && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-independent.cjs
      - name: Archive every independent owner Ultra Ball payment outcome
        if: ${{ always() && inputs.agent37_mew_ultra_payment_independent }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-mew-ultraball-payment-independent-16arm
          path: agent37-rank5-mew-ultraball-payment-independent-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify dynamic dead VIP and spent VSTAR Ultra Ball payment pure tests
        if: ${{ inputs.agent37_mew_ultra_dci_v2 && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: |
          node --check simulation/twinleaf/agent37/mew-ultraball-evolution.cjs
          node --check simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-dci-v2.cjs
          node --test tests/agent37-mew-ultraball-evolution.test.cjs
          node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-dci-v2.cjs --inspect-only
      - name: Run fresh dynamic DCI v2 source Ultra Ball native game comparisons
        if: ${{ inputs.agent37_mew_ultra_dci_v2 && !inputs.agent13_selfcopy_pair && !inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-ultraball-payment-dci-v2.cjs
      - name: Archive 16 fresh original source Ultra Ball dynamic DCI outcomes
        if: ${{ always() && inputs.agent37_mew_ultra_dci_v2 }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-mew-ultraball-payment-dci-v2-16arm
          path: agent37-rank5-mew-ultraball-payment-dci-v2-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate fresh Mew Quick Ball native discard payment A/B registration
        if: ${{ inputs.agent37_mew_quickball_payment }}
        run: |
          node --check simulation/twinleaf/agent37/mew-ultraball-evolution.cjs
          node --check simulation/evaluation/2026-11/agent37-rank5-mew-quickball-resource-payment-native.cjs
          node --test tests/agent37-mew-ultraball-evolution.test.cjs
          node simulation/evaluation/2026-11/agent37-rank5-mew-quickball-resource-payment-native.cjs --inspect-only
      - name: Execute all 16 original Mew Quick Ball guarded payment native A/B arms
        if: ${{ inputs.agent37_mew_quickball_payment }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-quickball-resource-payment-native.cjs
      - name: Archive all original Mew Quick Ball payment native A/B outcomes
        if: ${{ always() && inputs.agent37_mew_quickball_payment }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-mew-quickball-resource-payment-16arm
          path: agent37-rank5-mew-quickball-resource-payment-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check frozen Mew source Mail after Pass native registration
        if: ${{ inputs.agent37_mew_source_mail_afterpass }}
        run: |
          node --check simulation/evaluation/2026-11/agent37-rank5-mew-source-mail-afterpass-native.cjs
          node --test tests/agent9-owner-mail-after-pass-planner.test.cjs tests/agent37-mew-ultraball-evolution.test.cjs
          node simulation/evaluation/2026-11/agent37-rank5-mew-source-mail-afterpass-native.cjs --inspect-only
      - name: Run 16 paired native original Mew owner Mail source policy arms
        if: ${{ inputs.agent37_mew_source_mail_afterpass }}
        run: node simulation/evaluation/2026-11/agent37-rank5-mew-source-mail-afterpass-native.cjs
      - name: Archive source Mew Mail after Pass complete 16-game audit
        if: ${{ always() && inputs.agent37_mew_source_mail_afterpass }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-mew-source-mail-afterpass-16arm
          path: agent37-rank5-mew-source-mail-afterpass-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate fresh original Mew Mail transfer to Hood Shield and champion
        if: ${{ inputs.agent38_mail_hood_transfer }}
        run: |
          node --check simulation/evaluation/2026-11/agent38-rank5-mail-hood-fresh-transfer.cjs
          node --test tests/2026-11/agent38-rank5-mail-hood-fresh-transfer.test.cjs
          node simulation/evaluation/2026-11/agent38-rank5-mail-hood-fresh-transfer.cjs --inspect-only
      - name: Run all 16 frozen original Mew source-to-Hood/Champion policy games
        if: ${{ inputs.agent38_mail_hood_transfer }}
        run: node simulation/evaluation/2026-11/agent38-rank5-mail-hood-fresh-transfer.cjs
      - name: Archive fresh original Mew source competence transfer complete records
        if: ${{ always() && inputs.agent38_mail_hood_transfer }}
        uses: actions/upload-artifact@v4
        with:
          name: agent38-rank5-mail-hood-transfer-16arm
          path: agent38-rank5-mail-hood-fresh-transfer-16arm.json
          if-no-files-found: warn
          retention-days: 30
      - name: Native source Genesect ability-lock and Mail exception safety tests
        if: ${{ inputs.agent37_native_power_smoke }}
        run: |
          node --check simulation/twinleaf/agent37/native-genesect-power-availability.cjs
          node --check simulation/twinleaf/agent34-actor-only-root-policy.cjs
          node --check simulation/evaluation/agent41-bilateral-v2-development.cjs
          node --test tests/agent37-genesect-public-fusion-draw.test.cjs tests/agent37-native-genesect-power-availability.native.test.cjs tests/agent37-owner-mail-abort-audit.native.test.cjs
      - name: Validate native Klefki power-availability replay diagnostic
        if: ${{ inputs.agent37_klefki_replay }}
        run: |
          node --check simulation/evaluation/2026-11/agent37-rank5-klefki-genesect-retrospective-native.cjs
          node --test tests/agent37-native-genesect-power-availability.native.test.cjs
          node simulation/evaluation/2026-11/agent37-rank5-klefki-genesect-retrospective-native.cjs --inspect-only
      - name: Replay one previously fatal original-source native Klefki Ability root
        if: ${{ inputs.agent37_klefki_replay }}
        run: node simulation/evaluation/2026-11/agent37-rank5-klefki-genesect-retrospective-native.cjs
      - name: Archive full single original source native blocked-power replay
        if: ${{ always() && inputs.agent37_klefki_replay }}
        uses: actions/upload-artifact@v4
        with:
          name: agent37-rank5-klefki-genesect-ability-legality-retro
          path: agent37-rank5-klefki-genesect-retrospective.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate default-off Mew donor choice and bilateral policy forwarding
        if: ${{ inputs.agent13_selfcopy_pair }}
        run: |
          node --test tests/agent13-actor-only-choose-attack.test.cjs tests/agent13-mew-selfcopy-maxmiracle.test.cjs
          node --check simulation/evaluation/agent13-rank5-selfcopy-maxmiracle-native.cjs
      - name: Validate frozen original 32-arm rank5 protocol against pinned source
        if: ${{ inputs.agent13_selfcopy_pair }}
        run: node simulation/evaluation/agent13-rank5-selfcopy-maxmiracle-native.cjs --inspect-only
      - name: Execute all 32 rank5 source Mew owner-decision native arms
        if: ${{ inputs.agent13_selfcopy_pair }}
        run: node simulation/evaluation/agent13-rank5-selfcopy-maxmiracle-native.cjs
      - name: Preflight fresh 32-game dual-fixed-sixty paper-core registration
        if: ${{ inputs.agent19_dualfixed_profile }}
        run: |
          node --test tests/2026-11/agent19-paper-semantics-profile-v1.test.cjs tests/2026-11/agent19-dual-fixed60-cohort-admission.test.cjs
          node --check simulation/evaluation/2026-11/agent19-dual-fixed60-fourrank-paperprofile-native.cjs
          node simulation/evaluation/2026-11/agent19-dual-fixed60-fourrank-paperprofile-native.cjs --inspect-only
      - name: Run both original-source seats for two fixed contenders under paper-core profile
        if: ${{ inputs.agent19_dualfixed_profile }}
        run: node simulation/evaluation/2026-11/agent19-dual-fixed60-fourrank-paperprofile-native.cjs
      - name: Archive all 32 fresh native contender attempts including censored cases
        if: ${{ always() && inputs.agent19_dualfixed_profile }}
        uses: actions/upload-artifact@v4
        with:
          name: agent19-dual-fixed60-fourrank-paperprofile-native
          path: agent19-fourrank-fixed60-fresh-native.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive every registered source arm, including caps and errors
        if: ${{ always() && inputs.agent13_selfcopy_pair }}
        uses: actions/upload-artifact@v4
        with:
          name: agent13-rank5-selfcopy-maxmiracle-32arm
          path: agent13-rank5-selfcopy-maxmiracle-32arm.json
          if-no-files-found: warn
          retention-days: 30
