name: Aichi Electro Rain versus Benched V
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raichu-tool-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify Electro Rain versus Benched Pokemon V with Telescopic Sight
        run: node simulation/twinleaf/raichu-electro-rain-tool-regression.cjs
      - name: Verify Electro Rain damage prevention and effects-only immunity
        run: node simulation/twinleaf/raichu-electro-rain-protection-regression.cjs
      - name: Verify repeated target allocations receive flat damage bonus once
        run: node simulation/twinleaf/raichu-electro-rain-duplicate-target.cjs
      - name: Verify exact rank 4 and 17 three Special Energy source count
        run: node simulation/twinleaf/raichu-multi-energy-regression.cjs
      - name: Verify Electro Rain ignores Active target Lightning Weakness
        run: node simulation/twinleaf/raichu-electro-rain-weakness-regression.cjs
      - name: Verify six-Energy setup action sequence
        run: node simulation/twinleaf/raichu-manual-plus-bomb-setup.cjs
      - name: Verify 14 versus 16 Lightning-unit mixed-Bench five-Prize frontier
        run: node simulation/twinleaf/raichu-six-energy-prize-regression.cjs
      - name: Verify continuous Raichu Energy attachment and attack sequence
        run: node simulation/twinleaf/raichu-manual-bomb-attack-sequence.cjs
      - name: Verify source Raichu Telescopic Sight reserve-and-equip policy
        run: node simulation/twinleaf/raichu-sight-tool-policy-regression.cjs
      - name: Smoke test source Raichu Sight policy headless provenance
        run: node simulation/twinleaf/raichu-sight-tool-headless-smoke.cjs
      - name: Smoke test headless opt-in with exact rank 4 and 17 source inventories
        run: node simulation/twinleaf/raichu-electro-rain-headless-smoke.cjs
