name: Agent 43 pinned Guzma physical recipient regression

on:
  workflow_dispatch:
    inputs:
      sourcefirst_development:
        description: 'Run retrospective 8-arm original source-first Guzma comparison'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-owner-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact pinned dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile exact pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Independently exercise pinned Night Watch two-seat random-selection fidelity
        run: node --test tests/agent43-nightwatch-randomness-native.test.cjs
      - name: Regress default-off forced-target Guzma owner-root and hidden-information boundary
        run: node --test tests/agent31-forced-guzma-ko-frontier.test.cjs
      - name: Test final-Prize multi-Bench Guzma owner-visible choices
        run: node --test tests/agent31-final-prize-guzma-frontier.test.cjs
      - name: Prove final-Prize native opponent target and actual terminal Prize on both seats
        run: node --test tests/agent31-final-prize-guzma.native.test.cjs
      - name: Prove Agent31 forced-target Guzma physical KO and Prize on both seats
        run: node --test tests/agent31-forced-guzma-ko.native.test.cjs
      - name: Prove both-seat native Store Guzma recipient continuation
        run: node --test tests/agent43-canonical-guzma-prompt-composition.test.cjs tests/agent43-guzma-prompt-native.test.cjs tests/agent43-guzma-prompt-continuation.test.cjs tests/agent43-guzma-nominal-gust-frontier.test.cjs tests/agent2-held-guzma-mobility-frontier.test.cjs tests/agent43-registered-basic-supply-guzma.test.cjs tests/agent43-field-basic-only-cost-census.test.cjs
      - name: Original source-first Guzma paired development
        if: ${{ inputs.sourcefirst_development }}
        env:
          AGENT43_NATIVE_OUTPUT: ${{ runner.temp }}/agent43-sourcefirst-guzma.json
        run: node simulation/evaluation/agent43-guzma-original-source-pair.cjs
      - name: Preserve complete source-first native evidence
        if: ${{ inputs.sourcefirst_development && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent43-sourcefirst-guzma-archive
          path: ${{ runner.temp }}/agent43-sourcefirst-guzma.json
          if-no-files-found: warn
