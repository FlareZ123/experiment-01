name: Aichi exact joint bonus resource field

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-resource-field:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independently exhaustive mini-deck regression
        run: node --test tests/agent38-joint-bonus.test.cjs
      - name: Calculate all conditional K and source-field weighted results
        run: node scripts/agent38-joint-bonus.cjs > joint-bonus-field.json
      - name: Verify original-field valid-seven Supporter census
        run: node --test tests/agent35-original-supporter-opening-census.test.cjs
      - name: Emit original-field Supporter opening census
        run: node scripts/agent35-original-supporter-opening-census.cjs > original-supporter-opening.json
      - name: Verify exact rank26 all-Pad and Mail counter access
        run: node --test tests/agent2-rank26-mail-pad-joint.test.cjs
      - name: Audit authentic rank26 Basic Ability susceptibility to Muk
        run: node --test tests/agent2-rank26-basic-ability-exposure.test.cjs
      - name: Audit rank26 versus both frozen Apex printed Muk susceptibility
        run: node --test tests/agent2-muk-bilateral-basic-ability-matrix.test.cjs
      - name: Upload machine-readable source-weighted result
        uses: actions/upload-artifact@v4
        with:
          name: aichi-exact-joint-bonus
          path: |
            joint-bonus-field.json
            original-supporter-opening.json
          retention-days: 30
