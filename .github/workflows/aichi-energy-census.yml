name: Aichi published-field Energy census
on:
  workflow_dispatch:
    inputs:
      agent49_original_trainer_native:
        description: 'Bounded preregistered rank5/11 symmetric original Trainer fallback native policy diagnostic'
        type: boolean
        required: false
        default: false

jobs:
  energy-census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify census against published lists
        run: node --test scripts/test-aichi-energy-audit.cjs
      - name: Gate original source Special Energy print/config coverage without claiming native games
        run: node --test tests/agent49-original-source-energy-admission.test.cjs
      - name: Regress complete v5 original source Pass chronology under printed Shadow Mist restrictions
        run: node --test tests/agent49-issue25-shadow-mist-pass.test.cjs
      - name: Check original rank11 earliest Letter resource-gate regression
        run: node --test tests/agent49-rank11-first-letter-pass11.test.cjs
      - name: Check four exact original-source Trainer hand-cost modes and shared quotas
        run: node --test tests/agent27-owner-trainer-discard-contention.test.cjs tests/agent49-original-trainer-payment-modes.test.cjs
      - name: Veto generically impossible native Trainer payments without certifying playable actions
        run: node --test tests/agent49-trainer-hand-payment-veto.test.cjs tests/agent50-native-owner-trainer-pass-bridge.test.cjs
      - name: Verify optional owner-only Marshadow Stadium-channel counter decision contracts
        run: node --test tests/agent5-owner-visible-marshadow-chain-policy.test.cjs
      - name: Verify canonical original-field printing-distance and k-center coverage
        run: node --test tests/aichi-field-list-coverage.test.cjs
      - name: Regress original-source same-name split-printings with set-code disambiguation
        run: node --test tests/agent21-mixed-original-printing-census.test.cjs
      - name: Verify exact original rank9 Compressor to Bomb direct early resource window
        run: node --test tests/agent29-rank9-direct-compressor-bomb-opportunity.test.cjs tests/agent29-rank9-compressor-owner-bridge.test.cjs
      - name: Verify read-only generic two-seat Trainer opportunity transport
        run: node --test tests/agent29-bilateral-owner-trainer-frontier.test.cjs tests/agent29-canonical-generic-trainer-transport.test.cjs
      - name: Verify attached-Energy Trainer threat inventory
        run: node --test tests/aichi-attached-energy-threat-inventory.test.cjs
      - name: Verify exact Shadow Rider Hood natural access
        run: node --test scripts/test-hood-natural-access.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Prize-aware Stadium paths
        run: python -m unittest discover -s tests -p test_aichi_stadium_response.py
      - name: Emit Stadium response probabilities
        run: python scripts/aichi_stadium_response.py > aichi-stadium-response.json
      - name: Print audit summary
        run: node scripts/aichi_energy_audit.cjs > energy-census.json
      - name: Print Trainer threat inventory
        run: node scripts/aichi-attached-energy-threat-inventory.cjs > attached-energy-threat-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-energy-census
          path: |
            energy-census.json
            aichi-stadium-response.json
            attached-energy-threat-inventory.json

  generic-owner-trainer-native:
    if: ${{ inputs.agent49_original_trainer_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact original Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify prospective paired-deal denominator and generic payment veto contracts
        run: node --test tests/agent49-general-trainer-native-pilot.test.cjs tests/agent49-trainer-hand-payment-veto.test.cjs tests/agent50-native-owner-trainer-pass-bridge.test.cjs
      - name: Run eight preregistered original rank5/11 two-seat matched native arms
        run: node simulation/evaluation/agent49-general-trainer-fallback-native-pilot.cjs > agent49-generic-trainer-native-summary.txt
      - name: Summarize every native attempt including caps and failures
        run: >-
          node -e "const a=require('node:assert/strict');
          const r=require('./agent49-generic-trainer-fallback-native.json');
          a.equal(r.attemptedArms,8);a.equal(r.registeredPhysicalPairs,4);
          a.equal(r.competitivelyQualifiedGames,0);
          console.log('AGENT49_ORIGINAL_TRAINER_NATIVE',JSON.stringify({
          matched:r.physicallyMatchedPairs,complete:r.completePairs,
          controlPlays:r.controlNativeRootPlayCards,
          treatedPlays:r.treatmentNativeRootPlayCards,
          proposed:r.treatmentNativeTrainerFallbackRoots,
          accepted:r.treatmentNativeTrainerAcceptedRoots,
          knownPaidVetoes:r.treatmentKnownPaymentVetoes,
          nativeAborts:r.aborts.length,qualified:0}));"
      - name: Preserve full raw paired native original-root dispositions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-original-generic-trainer-paired-native
          path: |
            agent49-generic-trainer-fallback-native.json
            agent49-generic-trainer-native-summary.txt
          retention-days: 30
          if-no-files-found: warn
