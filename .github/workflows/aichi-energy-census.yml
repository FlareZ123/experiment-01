name: Aichi published-field Energy census
on:
  workflow_dispatch:
    inputs:
      agent49_original_trainer_native:
        description: 'Bounded preregistered rank5/11 symmetric original Trainer fallback native policy diagnostic'
        type: boolean
        required: false
        default: false
      agent49_first_letter_native:
        description: 'Bounded original rank11 source-turn2 first Letter native action and paper target custody'
        type: boolean
        required: false
        default: false

jobs:
  energy-census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify census against published lists
        run: node --test scripts/test-aichi-energy-audit.cjs
      - name: Gate original source Special Energy print/config coverage without claiming native games
        run: node --test tests/agent49-original-source-energy-admission.test.cjs
      - name: Regress complete v5 original source Pass chronology under printed Shadow Mist restrictions
        run: node --test tests/agent49-issue25-shadow-mist-pass.test.cjs
      - name: Check original rank11 earliest Letter resource-gate regression
        run: node --test tests/agent49-rank11-first-letter-pass11.test.cjs
      - name: Check four exact original-source Trainer hand-cost modes and shared quotas
        run: node --test tests/agent27-owner-trainer-discard-contention.test.cjs tests/agent49-original-trainer-payment-modes.test.cjs
      - name: Veto generically impossible native Trainer payments without certifying playable actions
        run: node --test tests/agent49-trainer-hand-payment-veto.test.cjs tests/agent50-native-owner-trainer-pass-bridge.test.cjs
      - name: Verify optional owner-only Marshadow Stadium-channel counter decision contracts
        run: node --test tests/agent5-owner-visible-marshadow-chain-policy.test.cjs
      - name: Verify canonical original-field printing-distance and k-center coverage
        run: node --test tests/aichi-field-list-coverage.test.cjs
      - name: Regress original-source same-name split-printings with set-code disambiguation
        run: node --test tests/agent21-mixed-original-printing-census.test.cjs
      - name: Verify exact original rank9 Compressor to Bomb direct early resource window
        run: node --test tests/agent29-rank9-direct-compressor-bomb-opportunity.test.cjs tests/agent29-rank9-compressor-owner-bridge.test.cjs
      - name: Verify read-only generic two-seat Trainer opportunity transport
        run: node --test tests/agent29-bilateral-owner-trainer-frontier.test.cjs tests/agent29-canonical-generic-trainer-transport.test.cjs
      - name: Verify attached-Energy Trainer threat inventory
        run: node --test tests/aichi-attached-energy-threat-inventory.test.cjs
      - name: Verify exact Shadow Rider Hood natural access
        run: node --test scripts/test-hood-natural-access.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Prize-aware Stadium paths
        run: python -m unittest discover -s tests -p test_aichi_stadium_response.py
      - name: Emit Stadium response probabilities
        run: python scripts/aichi_stadium_response.py > aichi-stadium-response.json
      - name: Print audit summary
        run: node scripts/aichi_energy_audit.cjs > energy-census.json
      - name: Print Trainer threat inventory
        run: node scripts/aichi-attached-energy-threat-inventory.cjs > attached-energy-threat-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: aichi-energy-census
          path: |
            energy-census.json
            aichi-stadium-response.json
            attached-energy-threat-inventory.json

  generic-owner-trainer-native:
    if: ${{ inputs.agent49_original_trainer_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize exact original Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify prospective paired-deal denominator and generic payment veto contracts
        run: node --test tests/agent49-general-trainer-native-pilot.test.cjs tests/agent49-trainer-hand-payment-veto.test.cjs tests/agent50-native-owner-trainer-pass-bridge.test.cjs
      - name: Run eight preregistered original rank5/11 two-seat matched native arms
        run: node simulation/evaluation/agent49-general-trainer-fallback-native-pilot.cjs > agent49-generic-trainer-native-summary.txt
      - name: Summarize every native attempt including caps and failures
        run: >-
          node -e "const a=require('node:assert/strict');
          const r=require('./agent49-generic-trainer-fallback-native.json');
          a.equal(r.attemptedArms,8);a.equal(r.registeredPhysicalPairs,4);
          a.equal(r.competitivelyQualifiedGames,0);
          console.log('AGENT49_ORIGINAL_TRAINER_NATIVE',JSON.stringify({
          matched:r.physicallyMatchedPairs,complete:r.completePairs,
          controlPlays:r.controlNativeRootPlayCards,
          treatedPlays:r.treatmentNativeRootPlayCards,
          proposed:r.treatmentNativeTrainerFallbackRoots,
          accepted:r.treatmentNativeTrainerAcceptedRoots,
          knownPaidVetoes:r.treatmentKnownPaymentVetoes,
          nativeAborts:r.aborts.length,qualified:0}));"
      - name: Preserve full raw paired native original-root dispositions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-original-generic-trainer-paired-native
          path: |
            agent49-generic-trainer-fallback-native.json
            agent49-generic-trainer-native-summary.txt
          retention-days: 30
          if-no-files-found: warn

  original-first-letter-native:
    if: ${{ inputs.agent49_first_letter_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned original game-engine submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install exact pinned game dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native Store
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Check early original source Letter and existing Item-fork controls
        run: node --test tests/agent49-rank11-first-letter-pass11.test.cjs tests/agent35-rank11-source-letter-pass37-fork.test.cjs
      - name: Execute preregistered rank11 original-first-Letter native fork
        env:
          AGENT49_EARLY_LETTER_RECEIPT: agent49-rank11-first-letter-pass11-native.json
        run: node simulation/evaluation/agent49-rank11-first-letter-pass11.cjs
      - name: Preserve original first-Letter complete native failure/success receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-rank11-first-letter-native
          path: agent49-rank11-first-letter-pass11-native.json
          retention-days: 21
          if-no-files-found: warn
      - name: Verify first-turn source Letter live owner-deck typed search gates
        run: node --test tests/agent49-rank11-first-letter-owner-search-native.test.cjs tests/agent35-owner-letter-search.test.cjs
      - name: Execute first-turn source Letter with post-native owner prompt resolution
        env:
          AGENT49_EARLY_LETTER_TYPED_RECEIPT: agent49-rank11-first-letter-owner-search-native.json
        run: node simulation/evaluation/agent49-rank11-first-letter-owner-search-native.cjs
      - name: Preserve actual source prompt acceptance, settlement, and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-rank11-first-letter-owner-search
          path: agent49-rank11-first-letter-owner-search-native.json
          retention-days: 21
          if-no-files-found: warn
      - name: Regress first-turn source attack original native root action custody
        run: node --test tests/agent49-rank11-first-letter-attack-root-observer.test.cjs
      - name: Observe exact accepted source attack after source-owned Letter search
        env:
          AGENT49_FIRST_FAMILY_ATTACK_AUDIT: agent49-rank11-first-letter-attack-root-native.json
        run: node simulation/evaluation/agent49-rank11-first-letter-attack-root-observer.cjs
      - name: Save original physical source turn attack root and pending prompt stages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-rank11-first-letter-attack-roots
          path: agent49-rank11-first-letter-attack-root-native.json
          retention-days: 21
      - name: Regress combined physical source Letter and Family search gates
        run: node --test tests/agent35-rank11-firstturn-family-native-v4.test.cjs tests/agent49-rank11-firstturn-call-family-owner-prompt.test.cjs
      - name: Execute preregistered original owner Call for Family prompt continuation
        env:
          AGENT35_FIRSTTURN_FAMILY_NATIVE_RECEIPT: agent35-rank11-firstturn-family-native-v4.json
        run: node simulation/evaluation/agent35-rank11-firstturn-family-native-v4.cjs
      - name: Preserve exact source search, original eight dispositions, and native aborts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent35-rank11-firstturn-family-native-v4
          path: agent35-rank11-firstturn-family-native-v4.json
          retention-days: 21
      - name: Verify independent original post-Family source and opponent action attribution
        run: node --test tests/agent35-rank11-firstturn-family-postattack-v5.test.cjs
      - name: Observe original source and opponent voluntary root chronology without changing decisions
        env:
          AGENT35_FIRSTTURN_FAMILY_POSTATTACK_OUTPUT: agent35-rank11-firstturn-family-postattack-v5.json
        run: node simulation/evaluation/agent35-rank11-firstturn-family-postattack-v5.cjs
      - name: Preserve after-source-attack accepted root denominator and native abort
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent35-rank11-firstturn-family-postattack-v5
          path: agent35-rank11-firstturn-family-postattack-v5.json
          retention-days: 21
      - name: Regress default-off source T4 Family owner search and frozen pre-root lineage
        run: node --test tests/agent35-rank11-second-family-native-v6.test.cjs tests/agent49-rank11-firstturn-call-family-owner-prompt.test.cjs tests/agent35-rank11-firstturn-family-native-v4.test.cjs
      - name: Execute registered original second source Call for Family native owner prompt
        env:
          AGENT35_RANK11_SECOND_FAMILY_NATIVE: agent35-rank11-second-family-native-v6.json
        run: node simulation/evaluation/agent35-rank11-second-family-native-v6.cjs
      - name: Preserve second source Family owner Basic transfer and full eight-arm denominator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent35-rank11-second-family-native-v6
          path: agent35-rank11-second-family-native-v6.json
          retention-days: 21
          if-no-files-found: warn
