name: Aichi fixed-deck mirror turn fairness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Report first-turn mirror symmetry and action outcomes
        run: node simulation/evaluation/mirror-seat-diagnostic.cjs
