name: Agent35 isolated native Powerglass KO ordering

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent35-powerglass-ko-order
  cancel-in-progress: false

jobs:
  isolated-store-rule-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Compile pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Agent35 native Snap Trap ChooseCards response contract
        run: node simulation/twinleaf/agent35/snap-trap-choice-response-contract-native.cjs
      - name: Agent12 native Snap Trap Prism Star Lost Zone destination
        run: node --test tests/2026-11/agent12-snap-trap-prism-star-destination-native.test.cjs
      - name: Upload Agent12 Prism Star native result
        uses: actions/upload-artifact@v4
        with:
          name: agent12-snap-trap-prism-star-destination-v1
          path: artifacts/agent12-snap-trap-prism-star-destination-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Agent12 joined Snap Trap source-to-settlement witness
        run: node --test tests/2026-11/agent12-snap-trap-source-to-settlement-native.test.cjs
      - name: Syntax check Agent30 native v3 Store-identity runner
        run: node --check simulation/twinleaf/agent30/snap-trap-source-root-store-identity-v3-native-v1.cjs && node --check tests/2026-11/agent30-snap-trap-source-root-store-identity-v3-native.test.cjs
      - name: Agent30 native v3 source prompt to root Store identity both seats
        run: node --test tests/2026-11/agent30-snap-trap-source-root-store-identity-v3-native.test.cjs
      - name: Agent36 native Snap Trap owner-policy v2 with Agent4 quarantine
        run: node --test tests/2026-11/agent36-snap-trap-owner-prompt-policy-v2.test.cjs
      - name: Upload Agent12 joined source-to-settlement result
        uses: actions/upload-artifact@v4
        with:
          name: agent12-snap-trap-source-to-settlement-native-v1
          path: artifacts/agent12-snap-trap-source-to-settlement-native-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Isolated actual Tool, KO, end-turn and Prize prompt order
        run: node simulation/twinleaf/agent35-powerglass-ko-prize-order-native.cjs
      - name: Agent37 independent winning-KO terminal Powerglass order
        run: node simulation/twinleaf/agent37-powerglass-winning-ko-native.cjs
      - name: Agent37 reversible paper KO-before-endturn hook prompt comparison
        run: node simulation/twinleaf/agent37-paper-ko-powerglass-first-prompt-native.cjs
      - name: Agent37 full physical Prize, promotion and Powerglass A-B settlement
        run: node simulation/twinleaf/agent37-paper-ko-powerglass-full-settlement-native.cjs
      - name: Agent37 Eon Blade next-turn lock and retreat reset
        run: node simulation/twinleaf/agent37-eonblade-next-turn-hook-regression.cjs
      - name: Agent37 isolated per-Store paper KO hook A-B full settlement
        run: node simulation/twinleaf/agent37-paper-ko-scoped-store-audit.cjs
      - name: Agent37 Technical Machine endturn custody and Prize order
        run: node simulation/twinleaf/agent37-technical-machine-e21-scoped-ko-native.cjs
      - name: Agent37 simultaneous KO and promoted Powerglass E-21 diagnostic
        run: node simulation/twinleaf/agent37-simultaneous-ko-e21-promotion-native.cjs
      - name: Agent37 simultaneous KO promotion-order v2 adapter regression
        run: node simulation/twinleaf/agent37-simultaneous-ko-promotion-v2-native.cjs
      - name: Agent37 simultaneous last-Prize tie adapter regression
        run: node simulation/twinleaf/agent37-simultaneous-last-prize-tie-native.cjs
      - name: Agent37 v4 both-seat mixed-terminal and duplicate Prize safety regression
        run: |
          node --check simulation/twinleaf/agent37/agent37-simultaneous-terminal-v4-adapter.cjs
          node --check simulation/twinleaf/agent37/agent37-simultaneous-terminal-v4-duplicate-guard-native.cjs
          node simulation/twinleaf/agent37/agent37-simultaneous-terminal-v4-native.cjs
          node simulation/twinleaf/agent37/agent37-simultaneous-terminal-v4-duplicate-guard-native.cjs
      - name: Agent37 public attack settlement snapshot and root identity tests
        run: node --test tests/agent37-candidate-attack-settlement.test.cjs
