name: Agent35 isolated native Powerglass KO ordering

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent35-powerglass-ko-order
  cancel-in-progress: false

jobs:
  isolated-store-rule-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Compile pinned Store
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile
      - name: Isolated actual Tool, KO, end-turn and Prize prompt order
        run: node simulation/twinleaf/agent35-powerglass-ko-prize-order-native.cjs
      - name: Agent37 independent winning-KO terminal Powerglass order
        run: node simulation/twinleaf/agent37-powerglass-winning-ko-native.cjs
      - name: Agent37 reversible paper KO-before-endturn hook prompt comparison
        run: node simulation/twinleaf/agent37-paper-ko-powerglass-first-prompt-native.cjs
