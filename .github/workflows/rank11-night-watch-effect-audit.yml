name: Rank11 terminal Night Watch effect audit

on:
  workflow_dispatch:
    inputs:
      run_prospective:
        description: 'Execute preregistered 16-seed Night Watch comparison'
        type: boolean
        required: false
        default: false
      reanalyze_prospective:
        description: 'Audit immutable prior 16-seed artifact without recompiling'
        type: boolean
        required: false
        default: false
      probe_planning_chance:
        description: 'Two-arm registered planning-only Night Watch stress probe'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  effect-audit:
    if: ${{ !inputs.reanalyze_prospective }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf simulator
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Pure Night Watch read-only observer tests
        run: node --test tests/rank11-night-watch-effect-journal.test.cjs tests/night-watch-opaque-card-sampler.test.cjs
      - name: Install pinned simulator dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned simulator
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay frozen source rank11 lock and audit three Night Watch effects
        run: node simulation/twinleaf/rank11-night-watch-effect-audit.cjs > rank11-night-watch-effect-audit.json
      - name: Display only aggregate independent effect evidence
        run: node -e "const p=require('./rank11-night-watch-effect-audit.json'); console.log(JSON.stringify({seed:p.seed,sourceRank:p.sourceRank,candidateRank:p.candidateRank,firstTurnSlot:p.firstTurnSlot,sourceToolGarbodorCompleted:p.sourceToolGarbodorCompleted,gameFinished:p.gameFinished,engineWinner:p.engineWinner,attackDeclarations:p.attackDeclarations,resolvedAttackRecords:p.resolvedAttackRecords,qualifiedForCompetitiveInference:p.qualifiedForCompetitiveInference},null,2))"
      - name: Trace every real prompt selection and relative source hand/deck movement
        run: node -e "const p=require('./rank11-night-watch-effect-audit.json'); for(const r of p.resolvedAttackRecords){console.log(JSON.stringify({turn:r.turn,stages:r.detailStages},null,2))}"
      - name: Compare authentic source Night Watch with opaque uniform hand sampling
        run: node simulation/twinleaf/rank11-night-watch-random-paired.cjs > rank11-night-watch-random-paired.json
      - name: Show chance-policy contrast without private hand identities
        run: node -e "const p=require('./rank11-night-watch-random-paired.json'); console.log(JSON.stringify({seed:p.baseline.seed,firstTurnSlot:p.baseline.firstTurnSlot,baseline:{finished:p.baseline.finished,winner:p.baseline.winner,declarations:p.baseline.declarations.length},corrected:{finished:p.corrected.finished,winner:p.corrected.winner,declarations:p.corrected.declarations.length,randomResolutions:p.corrected.hook.resolved,planningPrecommits:p.corrected.hook.precommitsInBotDecision,realEffectPrecommits:p.corrected.hook.precommitsOutsideBotDecision,planningResolutions:p.corrected.hook.resolutionsInBotDecision,actualResolutions:p.corrected.hook.resolutionsOutsideBotDecision,invalid:p.corrected.hook.invalid},originalHandPositions:p.baseline.sourceHandTransitions.map(x=>({turn:x.turn,selections:x.promptSelections})),correctedHandPositions:p.corrected.sourceHandTransitions.map(x=>({turn:x.turn,selections:x.promptSelections})),qualifiedForCompetitiveInference:p.qualifiedForCompetitiveInference},null,2))"
      - name: Run registered planning-only chance sensitivity stress
        if: \${{ inputs.probe_planning_chance }}
        run: node simulation/twinleaf/night-watch-planning-sensitivity.cjs > night-watch-planning-sensitivity.json
      - name: Show mechanical decision sensitivity without raw action logs
        if: \${{ inputs.probe_planning_chance }}
        run: node -e "const p=require('./night-watch-planning-sensitivity.json');console.log(JSON.stringify({schema:p.schema,firstPlanningSampleDivergenceIndex:p.firstPlanningSampleDivergenceIndex,firstPlanningSampleDivergence:p.firstPlanningSampleDivergence,firstRootActionDivergenceIndex:p.firstRootActionDivergenceIndex,firstSelectiveDecisionDivergenceIndex:p.firstSelectiveDecisionDivergenceIndex,rootLedgerExactlyEqual:p.rootLedgerExactlyEqual,low:{finished:p.low.finished,winner:p.low.winner,planningPrecommits:p.low.chanceAudit.precommitsInBotDecision,rootAttacks:p.low.nightWatchDeclarations},high:{finished:p.high.finished,winner:p.high.winner,planningPrecommits:p.high.chanceAudit.precommitsInBotDecision,rootAttacks:p.high.nightWatchDeclarations},qualifiedForCompetitiveInference:p.qualifiedForCompetitiveInference},null,2))"
      - name: Execute registered 16-seed two-policy source batch
        if: ${{ inputs.run_prospective }}
        run: node simulation/twinleaf/rank11-night-watch-prospective-batch.cjs > rank11-night-watch-prospective-batch.json
      - name: Report all registered seeds including failed rows
        if: ${{ inputs.run_prospective }}
        run: node -e "const p=require('./rank11-night-watch-prospective-batch.json');console.log(JSON.stringify({preregistration:p.preregistration,prospectiveSeeds:p.prospectiveSeeds,completeRows:p.completeRowCount,failedRows:p.failedRowCount,firstSeatCounts:p.actualFirstSlotCounts,originalAttackExposures:p.originalAttackExposures,uniformAttackExposures:p.uniformAttackExposures,finishedOriginal:p.finishedOriginal,finishedUniform:p.finishedUniform,correctedInvalid:p.correctedInvalidSamples,qualifiedForCompetitiveInference:p.qualifiedForCompetitiveInference},null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank11-night-watch-effects-unqualified
          path: |
            rank11-night-watch-effect-audit.json
            rank11-night-watch-random-paired.json
            rank11-night-watch-prospective-batch.json
            night-watch-planning-sensitivity.json
          if-no-files-found: warn
          retention-days: 14

  retrospective-evidence-audit:
    if: ${{ inputs.reanalyze_prospective }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rank11-night-watch-effects-unqualified
          run-id: 39140517254
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Verify all registered rows and detect paired nonexposure divergences
        run: node scripts/night-watch-evidence-summary.cjs
