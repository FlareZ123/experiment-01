name: Aichi anytime aggregate statistical test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test anytime full-field e-process
        run: node --test tests/aichi-anytime-field-evidence.test.cjs
