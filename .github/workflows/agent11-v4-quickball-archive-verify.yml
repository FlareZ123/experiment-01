name: Agent11 v4 immutable paired Quick Ball native archive audit

on:
  workflow_dispatch:
    inputs:
      mail_access_only:
        description: Run exact original Iron Thorns Trainers Mail combinatorics only
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  verify-frozen-native-archives:
    if: ${{ !inputs.mail_access_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archived baseline profile (run 41901549528)
        uses: actions/download-artifact@v4
        with:
          name: agent11-owner-tutor-original5-vs11-native
          repository: FlareZ123/experiment-01
          run-id: 41901549528
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - name: Fetch archived enabled profile (run 41901576963)
        uses: actions/download-artifact@v4
        with:
          name: agent11-owner-tutor-original5-vs11-native
          repository: FlareZ123/experiment-01
          run-id: 41901576963
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: enabled
      - name: Assert original bytes, 64 exact deals and failure-inclusive native counts
        run: node scripts/agent11-v4-quickball-exact-paired-archive-audit.cjs baseline/agent11-owner-tutor-native-v4.json enabled/agent11-owner-tutor-native-v4.json
      - name: Download C11 full Bench guard baseline retrospective
        uses: actions/download-artifact@v4
        with:
          name: agent11-owner-tutor-original5-vs11-native
          repository: FlareZ123/experiment-01
          run-id: 41903387542
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: guarded-baseline
      - name: Download C11 full Bench guard enabled retrospective
        uses: actions/download-artifact@v4
        with:
          name: agent11-owner-tutor-original5-vs11-native
          repository: FlareZ123/experiment-01
          run-id: 41903405698
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: guarded-enabled
      - name: Assert 105 original unchanged traces and 23 exact native abort Pass replacements
        run: node scripts/agent11-c11-fullbench-retro-archive-audit.cjs baseline/agent11-owner-tutor-native-v4.json enabled/agent11-owner-tutor-native-v4.json guarded-baseline/agent11-owner-tutor-native-v4.json guarded-enabled/agent11-owner-tutor-native-v4.json

  verify-mail-access:
    if: ${{ inputs.mail_access_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently enumerate toy Mail shuffles and authenticate source 60 counts
        run: node --test tests/agent11-thorns-mail-access.test.cjs
      - name: Independently reproduce full simultaneous-mulligan conditional probabilities
        run: node --test tests/agent11-newmoon-thorns-joint-mulligan-screen.test.cjs
      - name: Verify player-selectable all-or-none mulligan bonus sensitivity
        run: node --test tests/agent11-joint-mulligan-bonus-policy-sensitivity.test.cjs
      - name: Compile independent physical Monte Carlo and exercise both-source setup
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -pedantic scripts/agent11-joint-mulligan-physical-mc.cpp -o agent11-joint-physical-mc
          ./agent11-joint-physical-mc 100000 1 3 177142170570765
          ./agent11-joint-physical-mc 100000 3 4 6719349128451
          ./agent11-joint-physical-mc 100000 1 2 81766323901
      - name: Retrieve immutable original selected-v5 native archive for public-root census
        uses: actions/download-artifact@v4
        with:
          name: agent36-issue25-steward-innermost-prize-v5-native
          repository: FlareZ123/experiment-01
          run-id: 42059191496
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archived-v5
      - name: Verify frozen source-owned prompt and action denominator
        run: node scripts/agent11-v5-root-budget-archive-audit.cjs archived-v5/issue25-steward-v5.json
