name: Agent 3 exact source-opening zone gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-opening-zones:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regress exact rank26 source-card zone DP and coupled setup
        run: |
          node --test tests/agent3-rank26-direct-root-lightning-dce.test.cjs tests/agent3-rank26-coupled-mulligan-zone.test.cjs
