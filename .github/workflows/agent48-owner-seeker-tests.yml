name: Agent48 owner VS Seeker tests

on:
  workflow_dispatch:
    inputs:
      native_rank7_guzma_orphan_replay:
        description: 'Retrospective one-original-deal Store prompt orphan control/treatment (two native games)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run owner VS Seeker and orphan prompt regressions
        run: |
          node --test tests/agent48-owner-vs-seeker-supporter.test.cjs tests/agent2-vs-seeker-guzma-recovery-frontier.test.cjs tests/agent48-owner-vs-seeker-guzma-root.test.cjs tests/agent48-owner-vs-seeker-guzma-layer.test.cjs tests/2026-11/agent31-late-seeker-guzma-prize.test.cjs
          node --test tests/2026-11/agent48-playability-orphan-prompt-hook.test.cjs

  native-rank7-replay:
    if: ${{ inputs.native_rank7_guzma_orphan_replay }}
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay exact original rank7 Guzma source deal, control and treatment
        run: node simulation/evaluation/agent48-one-deal-guzma-prompt-native.cjs > agent48-original-rank7-guzma-orphan-replay.json
      - name: Show bounded result
        run: node -e "const r=require('./agent48-original-rank7-guzma-orphan-replay.json');console.log(JSON.stringify({matchedSource:r.sameSourcePhysicalDeal,matchedFull:r.sameFullPhysicalDeal,arms:r.arms.map(a=>({arm:a.arm,status:a.status,roots:a.rootActionCount,finished:a.nativeFinished,error:a.error,pruned:a.orphanAudit?.orphanedPromptsPruned,unlinked:a.orphanAudit?.unlinkedPromptResolveAttempts}))},null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent48-rank7-prompt-orphan-replay
          path: agent48-original-rank7-guzma-orphan-replay.json
          retention-days: 14
          if-no-files-found: warn
