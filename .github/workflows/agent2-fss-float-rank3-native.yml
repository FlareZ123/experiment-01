name: Agent 2 FSS first Tool native two-rank and score-blindness audit

on:
  workflow_dispatch:
    inputs:
      burrow_only:
        description: 'Run one frozen original rank3 Burrow settlement trace instead of the full cohort'
        type: boolean
        required: false
        default: false
      omega_aba:
        description: 'Run matched original rank3 second-Burrow owner-choice counterfactual'
        type: boolean
        required: false
        default: false
      anti_filch_aba:
        description: 'Run original rank1 conservative own-deck Filch refusal A/B/A'
        type: boolean
        required: false
        default: false
      second_terminal:
        description: 'Inspect independent historical second native rank3 source win with full original 60'
        type: boolean
        required: false
        default: false
      owner_guzma_audit:
        description: 'Audit rank1 own-hand Guzma counterplay while Bunnelby Active'
        type: boolean
        required: false
        default: false
      guzma_counter_aba:
        description: 'Run exact original rank1 held Guzma anti-Bunnelby true-prompt A B A'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: agent2-fss-held-float-native-rank3
  cancel-in-progress: false

jobs:
  staged-both-seat-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run every exact source-print and first-Tool pure invariant
        if: ${{ !inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba && !inputs.second_terminal && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        run: node --test tests/agent2-original29-fss-first-tool-collision.test.cjs tests/agent2-first-tool-structural-counterexample.test.cjs tests/agent2-fss-held-try-float-owner.test.cjs tests/agent2-bunnelby-deckout-float-frontier.test.cjs
      - name: Native Store attached Float, actual retreat, both seats
        if: ${{ !inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba && !inputs.second_terminal && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        shell: bash
        run: node --test tests/agent2-fss-float-actual-store.native.test.cjs tests/agent2-fss-rank11-funded-attacker.native.test.cjs tests/agent2-tool-score-card-identity-blind.native.test.cjs | tee agent2-fss-native-rank3-stdout.txt
      - name: Passively audit exact rank3 vs rank1 original sixty source roots, both seats
        if: ${{ !inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba && !inputs.second_terminal && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank3-original-fss-float-census.cjs | tee agent2-rank3-original-natural-fss-census.json
      - name: Prospective disjoint original rank3 full-60 source exposure, 32 seeds-seats
        if: ${{ !inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba && !inputs.second_terminal && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank3-original-fss-float-fresh.cjs | tee agent2-rank3-original-fresh-32.json
      - name: Trace one frozen native original-source Burrow continuation
        if: ${{ inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba && !inputs.second_terminal && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank3-natural-burrow-settlement.cjs | tee agent2-rank3-natural-burrow-settlement.json
      - name: Match original source Omega second Burrow A B A under same deal
        if: ${{ inputs.omega_aba && !inputs.burrow_only && !inputs.anti_filch_aba && !inputs.second_terminal && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank3-original-omega-burrow-aba.cjs | tee agent2-rank3-original-omega-aba.json
      - name: Stress test original rank1 conservative Filch refusal A B A
        if: ${{ inputs.anti_filch_aba && !inputs.burrow_only && !inputs.omega_aba && !inputs.second_terminal && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank3-original-anti-filch-aba.cjs | tee agent2-rank3-original-anti-filch-aba.json
      - name: Inspect second independent native original rank3 source winning mechanism
        if: ${{ inputs.second_terminal && !inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba && !inputs.owner_guzma_audit && !inputs.guzma_counter_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank3-second-native-terminal-source-trace.cjs | tee agent2-rank3-second-source-native-terminal.json
      - name: Audit rank1 own-hand Guzma potential without changing actual Store roots
        if: ${{ inputs.owner_guzma_audit && !inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba && !inputs.second_terminal && !inputs.guzma_counter_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank1-original-guzma-owner-hand-audit.cjs | tee agent2-rank1-original-guzma-hand-windows.json
      - name: Test exact rank1 owner held Guzma native Snorlax gust A B A
        if: ${{ inputs.guzma_counter_aba && !inputs.owner_guzma_audit && !inputs.second_terminal && !inputs.burrow_only && !inputs.omega_aba && !inputs.anti_filch_aba }}
        shell: bash
        run: node simulation/evaluation/agent2-rank1-original-guzma-counterplay-aba.cjs | tee agent2-rank1-original-guzma-counterplay-aba.json
      - name: Preserve failed or completed source native transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-fss-first-tool-rank3-staged-store
          path: |
            agent2-fss-native-rank3-stdout.txt
            agent2-rank3-original-natural-fss-census.json
            agent2-rank3-original-fresh-32.json
            agent2-rank3-natural-burrow-settlement.json
            agent2-rank3-original-omega-aba.json
            agent2-rank3-original-anti-filch-aba.json
            agent2-rank3-second-source-native-terminal.json
            agent2-rank1-original-guzma-hand-windows.json
            agent2-rank1-original-guzma-counterplay-aba.json
          if-no-files-found: warn
          retention-days: 14
