name: Agent 2 FSS first Tool native two-rank and score-blindness audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent2-fss-held-float-native-rank3
  cancel-in-progress: false

jobs:
  staged-both-seat-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run every exact source-print and first-Tool pure invariant
        run: node --test tests/agent2-original29-fss-first-tool-collision.test.cjs tests/agent2-first-tool-structural-counterexample.test.cjs tests/agent2-fss-held-try-float-owner.test.cjs tests/agent2-bunnelby-deckout-float-frontier.test.cjs
      - name: Native Store attached Float, actual retreat, both seats
        shell: bash
        run: node --test tests/agent2-fss-float-actual-store.native.test.cjs tests/agent2-fss-rank11-funded-attacker.native.test.cjs tests/agent2-tool-score-card-identity-blind.native.test.cjs | tee agent2-fss-native-rank3-stdout.txt
      - name: Passively audit exact rank3 vs rank1 original sixty source roots, both seats
        shell: bash
        run: node simulation/evaluation/agent2-rank3-original-fss-float-census.cjs | tee agent2-rank3-original-natural-fss-census.json
      - name: Prospective disjoint original rank3 full-60 source exposure, 32 seeds-seats
        shell: bash
        run: node simulation/evaluation/agent2-rank3-original-fss-float-fresh.cjs | tee agent2-rank3-original-fresh-32.json
      - name: Preserve failed or completed source native transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-fss-first-tool-rank3-staged-store
          path: |
            agent2-fss-native-rank3-stdout.txt
            agent2-rank3-original-natural-fss-census.json
            agent2-rank3-original-fresh-32.json
          if-no-files-found: warn
          retention-days: 14
