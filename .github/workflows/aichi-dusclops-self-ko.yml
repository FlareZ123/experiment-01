name: Aichi Dusclops conditional self-KO

on:
  workflow_dispatch:
    inputs:
      rank19_mobility_compare:
        description: 'Compare four historical original-rank19 source deals under source Float Stone root'
        type: boolean
        required: false
        default: false
      rank19_source_replay:
        description: 'Revisit exactly four prior original rank19 source physical games, read-only Active/root census'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  cursed-blast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned simulator
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Characterize Cursed Blast when damage counters are prevented
        run: node --test tests/dusclops-self-ko-condition.test.cjs
      - name: Validate source-card Ditto direct Stage-2 transformation and reroll
        run: node --test tests/ditto-stage2-store.test.cjs
      - name: Verify original rank31 Duskull PRE discard-zone paper correction in native Store
        run: node --test tests/agent28-native-duskull-discard-paper-hook.test.cjs
      - name: Probe original rank19 Raging Bolt Basic-card Bellowing attack on both actual native seats
        run: node --test tests/agent28-rank19-bellowing-knockout-native.test.cjs
      - name: Stage owner-held original rank19 Float Stone physical promotion to DDE-funded Raging Bolt on both native seats
        run: node --test tests/agent28-rank19-original-floatstone-promote-native.test.cjs
      - name: Verify rank19 paired physical-deal classification before native execution
        run: node --test tests/agent50-rank19-float-stone-paired-development.test.cjs
      - name: Compare authentic four rank19 source deals under source-only Float Stone mobility
        if: inputs.rank19_mobility_compare
        run: node simulation/evaluation/agent50-rank19-float-stone-paired-development.cjs > agent50-rank19-source-float-mobility-paired.json
      - name: Archive original source mobility paired native receipts
        if: always() && inputs.rank19_mobility_compare
        uses: actions/upload-artifact@v4
        with:
          name: agent50-rank19-source-floatstone-paired-native
          path: agent50-rank19-source-float-mobility-paired.json
          if-no-files-found: warn
          retention-days: 14
      - name: Reobserve exactly four archived original rank19 source games without policy changes
        if: inputs.rank19_source_replay
        run: node simulation/evaluation/agent28-rank19-original-source-active-retrospective.cjs > agent28-rank19-source-active-native.json
      - name: Summarize original Raging Bolt Active and declared Bellowing root opportunities
        if: inputs.rank19_source_replay
        run: node -e "const r=require('./agent28-rank19-source-active-native.json');console.log('RANK19_SOURCE_ACTIVE_NATIVE',JSON.stringify({version:r.version,activeRoots:r.sourceActiveRagingRootTotal,bellowing:r.sourceBellowingAttackTotal,rows:r.rows.map(x=>({trial:x.trialId,seat:x.sourceSeat,status:x.status,roots:x.sourceOwners.sourceOwnerRootCount,active:x.sourceOwners.sourceRagingActiveRoots,bench:x.sourceOwners.sourceRagingBenchRoots,fundedBench:x.sourceOwners.sourceRagingBenchedWithEnergyRoots,activePrints:x.sourceOwners.sourceActivePrintingCounts,heldFloat:x.sourceOwners.fundedHoOhWithFloatStoneHeld,heldGuzma:x.sourceOwners.fundedHoOhWithGuzmaHeld,heldSeeker:x.sourceOwners.fundedHoOhWithVSSeekerHeld,heldArven:x.sourceOwners.fundedHoOhWithArvenHeld,floatAttached:x.sourceOwners.fundedHoOhWithFloatStoneAttached,handSamples:x.sourceOwners.fundedHoOhMobilitySamples.slice(0,4)}))}))"
      - name: Archive the four replayed original source read-only native root receipts
        if: always() && inputs.rank19_source_replay
        uses: actions/upload-artifact@v4
        with:
          name: agent28-rank19-original-source-active-native
          path: agent28-rank19-source-active-native.json
          if-no-files-found: warn
          retention-days: 14
