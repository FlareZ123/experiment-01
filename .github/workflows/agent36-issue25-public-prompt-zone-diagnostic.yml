name: Agent36 Issue25 public prompt zone diagnostic v7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent36-issue25-public-prompt-zone-diagnostic-v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase-a-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Check out the pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json

      - name: Install and compile the pinned native server
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      - name: Check diagnostic, marker and observer syntax
        run: |
          node --check simulation/twinleaf/agent30/stunfisk-snap-trap-prompt-marker-v2.cjs
          node --check simulation/twinleaf/agent12/issue25-public-prompt-zone-audit-v7.cjs
          node --check simulation/evaluation/agent36-issue25-public-prompt-zone-diagnostic-v7.cjs
          node --check simulation/evaluation/agent36-issue25-public-prompt-zone-selection.cjs

      - name: Test Snap Trap source marker, live prompt ID, zone privacy, deferred attack fingerprint and quarantine selection
        run: node --test tests/2026-11/agent30-stunfisk-snap-trap-prompt-marker-v2.test.cjs tests/2026-11/agent30-issue25-public-prompt-zone-audit-v7.test.cjs tests/2026-11/agent30-issue25-snap-trap-marker-observer-v7.integration.test.cjs tests/2026-11/agent12-issue25-public-prompt-zone-audit-v7.test.cjs tests/2026-11/agent12-issue25-public-prompt-zone-diagnostic-v7.test.cjs tests/agent36-issue25-public-prompt-zone-selection.test.cjs tests/agent36-issue25-selected-v0.test.cjs tests/agent34-actor-only-root-policy.test.cjs

      - name: Run frozen v10b phase-A diagnostic with composed Snap Trap source and zone proof
        run: node simulation/evaluation/agent36-issue25-public-prompt-zone-diagnostic-v7.cjs

      - name: Preserve public Snap Trap source and zone evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent36-issue25-public-prompt-zone-diagnostic-v7-${{ github.run_id }}
          path: |
            artifacts/agent36-issue25-public-prompt-zone-diagnostic-v7/
          retention-days: 21
          if-no-files-found: warn
