name: Agent37 simultaneous final-Prize resolver v3 native

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent37-last-prize-v3-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Checkout direct pinned Twinleaf submodule only
        run: git submodule update --init --depth=1 vendor/twinleaf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json

      - name: Verify pinned Twinleaf revision
        shell: bash
        run: |
          test "$(git -C vendor/twinleaf rev-parse HEAD)" = "a9905a76a6c4103ba4b6cb9a49e86bad795c5c05"
          git -C vendor/twinleaf rev-parse HEAD

      - name: Install and compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      - name: Check research adapter and native runner syntax
        run: |
          node --check simulation/twinleaf/agent37-paper-ko-simultaneous-last-prize-tie-v1.cjs
          node --check simulation/twinleaf/agent37-simultaneous-last-prize-tie-native.cjs

      - name: Run bounded native simultaneous final-Prize regression
        run: |
          node simulation/twinleaf/agent37-simultaneous-last-prize-tie-native.cjs > agent37-simultaneous-last-prize-v3-native.json

      - name: Assert v3 schema, pinned engine and native outcomes
        run: |
          node -e "const fs=require('node:fs');const assert=require('node:assert/strict');const r=JSON.parse(fs.readFileSync('agent37-simultaneous-last-prize-v3-native.json','utf8'));assert.equal(r.schema,'agent37-simultaneous-last-prize-resolution-native-v3');assert.equal(r.pinnedTwinleaf,'a9905a76a6c4103ba4b6cb9a49e86bad795c5c05');assert.equal(Array.isArray(r.rows),true);assert.equal(r.rows.length,2);assert.deepEqual(r.rows.map(x=>x.actorSeat),[0,1]);assert.equal(Array.isArray(r.controls.asymmetricPromotionAvailability),true);assert.equal(r.controls.asymmetricPromotionAvailability.length,2);assert.equal(r.controls.opponentOnlyPromotionAvailability.length,2);assert.equal(r.controls.neitherCanPromote.length,2);assert.equal(r.controls.asymmetricPrizeGroupCounts.length,16);assert.equal(r.controls.asymmetricPrizeGroupCounts.every(x=>x.expectedOutcome===x.actualOutcome&&x.prizesTakenThisTurn.owner===(x.prizeProfile==='overkill-3-to-1'?2:3)&&x.prizesTakenThisTurn.opponent===1&&x.knockoutPrizeCounts.some(k=>k.targetPrinting==='Shadow Rider Calyrex VMAX CRE'&&k.prizeCount===3)&&x.knockoutPrizeCounts.some(k=>k.targetPrinting==='Ferroseed NXD'&&k.prizeCount===1)&&x.prizeGroupCounts.every(g=>g.destinationIsHand)),true);assert.equal(r.controls.nonHandDestination.length,2);assert.equal(r.controls.singleLastPrize.finalState.finished,true);assert.equal(r.competitiveGamesQualified,0);for(const k of ['nativeDefectConfirmedBothSeats','simultaneousLastPrizeResolutionBothSeats','bothPrizeTransfersVerified','asymmetricPromotionAvailabilityWinnerCorrected','asymmetricPrizeGroupCountsBothSeatsVerified','opponentOnlyPromotionWinnerCorrected','neitherPromotableTieCorrected','singlePlayerLastPrizeControlPreserved','nonHandPrizeDestinationControlPreserved','drawLogAndWinnerVerified','neighborStoreIsolationVerified','restorationVerified'])assert.equal(r[k],true,k);console.log('Agent37 v3 native regression passed.');"

      - name: Preserve native result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent37-simultaneous-last-prize-v3-native-${{ github.run_id }}
          path: agent37-simultaneous-last-prize-v3-native.json
          if-no-files-found: ignore
          retention-days: 14
