name: First-source-deal digest smoke

on:
  workflow_dispatch:
    inputs:
      native_proposal_state:
        description: 'Run a paired native 105-root rank24 policy State-purity smoke (diagnostic only)'
        required: false
        type: boolean
        default: false
      registered_pair_setup:
        description: 'Four frozen original-Store champion/New Moon paired setups; setup only, no games'
        required: false
        type: boolean
        default: false
      full_source_setup:
        description: 'Run 120 frozen source setups with hidden-order source fingerprint; diagnostic only'
        required: false
        type: boolean
        default: false
      frozen_mismatch_setup:
        description: 'Original rank6 6:3:B source Bench discrepancy, two-60 same-seed setup and mulligan followup'
        required: false
        type: boolean
        default: false

      frozen32_setup_census:
        description: 'Reproduce all 32 original Agent41 native Store initial source deals with candidate mulligan and shuffle-offset evidence'
        required: false
        type: boolean
        default: false

      per_seat_shuffle_probe:
        description: 'Hypothetical per-seat setup shuffle streams for original rank6 same-seed source isolation'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  initial-deal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install upstream dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned upstream server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify all 29 exact original source first-turn card inventory classes
        run: node --test tests/aichi-source-root-coverage.test.cjs
      - name: Verify paper C-11 full-Bench Trubbish native reducer correction
        run: node --test tests/agent38-paper-fullbench-callforfamily-hook.test.cjs tests/agent38-trubbish-fst-fullbench-native.test.cjs
      - name: Verify private initial-deal fingerprint serializer and actual Store noninterference
        run: node --test tests/source-physical-deal-fingerprint.test.cjs tests/headless-initial-source-deal-smoke.test.cjs tests/aichi-setup-zone-capture.test.cjs
      - name: Verify paired-native State observer reporting invariants
        run: node --test tests/agent38-native-proposal-state-smoke.test.cjs tests/original-state-noninterference-gate.test.cjs tests/native-supporter-proposal-validation-observer.test.cjs tests/agent38-native-owner-alias-observer.test.cjs tests/native-policy-random-tape.test.cjs tests/native-same-world-tape-parity.test.cjs tests/native-tape-hidden-order-contrast.test.cjs
      - name: Paired native rank24 State-purity diagnostic
        if: ${{ inputs.native_proposal_state }}
        run: node simulation/twinleaf/agent38-native-proposal-state-smoke.cjs > agent38-rank24-native-state-purity.json
      - name: Archive paired native read-only State-purity diagnostic
        if: ${{ always() && inputs.native_proposal_state }}
        uses: actions/upload-artifact@v4
        with:
          name: agent38-rank24-native-state-purity
          path: agent38-rank24-native-state-purity.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify frozen two-candidate native pre-outcome Store setup contracts
        if: ${{ inputs.registered_pair_setup }}
        run: node --test tests/aichi-setup-zone-capture.test.cjs tests/agent42-registered-setup-native-bridge.test.cjs
      - name: Capture four frozen original-Store source setup pairs without game decisions
        if: ${{ inputs.registered_pair_setup }}
        run: node simulation/evaluation/agent42-native-fourcell-setup-smoke.cjs > agent42-native-fourcell-setup.json
      - name: Archive complete attempted setup receipts
        if: ${{ always() && inputs.registered_pair_setup }}
        uses: actions/upload-artifact@v4
        with:
          name: agent42-registered-fourcell-setup
          path: agent42-native-fourcell-setup.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compare full ordered source openings for five frozen candidate arrangements
        if: ${{ inputs.full_source_setup }}
        env:
          AICHI_SOURCE_FULL_DEAL_AUDIT: 'true'
        run: node simulation/evaluation/aichi-multiseed-setup-coupling.cjs > aichi-full-source-deal-audit.json
      - name: Archive complete diagnostic record and mismatches
        if: ${{ always() && inputs.full_source_setup }}
        uses: actions/upload-artifact@v4
        with:
          name: aichi-full-source-deal-setup-audit
          path: aichi-full-source-deal-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reproduce frozen rank6 6:3:B source setup under separate generic Store policy
        if: ${{ inputs.frozen_mismatch_setup }}
        run: node simulation/evaluation/agent26-frozen-mismatch-setup-replay.cjs > agent26-frozen-rank6-setup-followup.json
      - name: Archive both original frozen source setup replay attempts
        if: ${{ always() && inputs.frozen_mismatch_setup }}
        uses: actions/upload-artifact@v4
        with:
          name: agent26-frozen-rank6-setup-followup
          path: agent26-frozen-rank6-setup-followup.json
          if-no-files-found: error
          retention-days: 14

      - name: Reproduce all 32 registered frozen source setups and shuffle RNG offsets
        if: ${{ inputs.frozen32_setup_census }}
        run: node simulation/evaluation/agent26-frozen32-all-setup-replay.cjs > agent26-frozen32-native-source-setups.json
      - name: Archive every registered native source setup even if comparison fails
        if: ${{ always() && inputs.frozen32_setup_census }}
        uses: actions/upload-artifact@v4
        with:
          name: agent26-frozen32-source-setup-census
          path: agent26-frozen32-native-source-setups.json
          if-no-files-found: error
          retention-days: 14
      - name: Probe alternative per-seat deck-shuffle streams in frozen rank6 seed
        if: ${{ inputs.per_seat_shuffle_probe }}
        run: node simulation/evaluation/agent26-frozen-mismatch-seat-coupled-setup.cjs > agent26-per-seat-setup-streams.json
      - name: Archive both counterfactual paired setup-only results
        if: ${{ always() && inputs.per_seat_shuffle_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: agent26-per-seat-shuffle-counterfactual
          path: agent26-per-seat-setup-streams.json
          if-no-files-found: error
          retention-days: 14
