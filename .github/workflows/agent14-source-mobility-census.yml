name: Agent14 original Aichi source mobility census
on:
  workflow_dispatch:
    inputs:
      rank11_strand_native_aba:
        description: Run six bounded pinned-Store native A/B/A replays, development-only
        required: false
        type: boolean
        default: false
      fresh_crossrank_strand:
        description: Run 64 prospectively frozen original-source native A/B attempts across 4 ranks
        required: false
        type: boolean
        default: false
      ultra_ball_portfolio_native:
        description: Run five Trainer cost and automatic Quick Ball native payment tests, both seats
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mobility-census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate all original printed sixties, exact names and negative controls
        run: node --test tests/agent14-authenticated-mobility-roster-audit.test.cjs tests/agent14-mobility-prize-collapse.test.cjs tests/agent14-mobility-prize-mixed.test.cjs
      - name: Public owner Float Stone and Tool Jammer source-order regressions
        run: node --test tests/agent1-owner-float-stone-mobility.test.cjs tests/agent6-skyliner-or-floatstone-mobility.test.cjs tests/agent14-generic-funded-floatstone-frontier.test.cjs
      - name: Verify the actual generic Float Stone actor wrapper opt-in
        run: node --test tests/agent34-actor-only-root-policy.test.cjs
      - name: Verify scoped zero-Energy Mimikyu Tool and Retreat native wrapper
        run: node --test tests/agent14-zero-energy-strand-wiring.test.cjs
      - name: Verify shared Ultra Ball physical-cost portfolio and mock Store custody
        run: node --test tests/2026-11/agent14-ultra-ball-portfolio-paid-custody.test.cjs
      - name: Verify same-root A/B/A ledger and abort custody arithmetic
        run: node --test tests/agent14-rank11-zero-energy-strand-native-aba.test.cjs
      - name: Validate fresh 16-group four-rank registration and native event receipts
        run: node --test tests/agent14-prospective-zero-energy-strand-crossrank.test.cjs
      - name: Check out pinned Twinleaf for selected native replay only
        if: ${{ inputs.rank11_strand_native_aba || inputs.fresh_crossrank_strand || inputs.ultra_ball_portfolio_native }}
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        if: ${{ inputs.rank11_strand_native_aba || inputs.fresh_crossrank_strand || inputs.ultra_ball_portfolio_native }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned Twinleaf dependencies for selected native replay only
        if: ${{ inputs.rank11_strand_native_aba || inputs.fresh_crossrank_strand || inputs.ultra_ball_portfolio_native }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf for selected native replay only
        if: ${{ inputs.rank11_strand_native_aba || inputs.fresh_crossrank_strand || inputs.ultra_ball_portfolio_native }}
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Prove original pinned Ultra Ball paid cost and paper-invalid zero cost in both seats
        if: ${{ inputs.ultra_ball_portfolio_native }}
        run: node --test tests/2026-11/agent14-ultra-ball-portfolio-paid-custody.native.test.cjs
      - name: Verify all five source-stamped Trainer discard payments in native Store, both seats
        if: ${{ inputs.ultra_ball_portfolio_native }}
        run: node --test tests/2026-11/agent14-paid-discard-five-trainers.native.test.cjs
      - name: Prove original Quick Ball automatic single-other-card payment and explicit prompt alternative
        if: ${{ inputs.ultra_ball_portfolio_native }}
        run: node --test tests/2026-11/agent14-quickball-auto-payment.native.test.cjs
      - name: Run exact original rank11 physical A/B/A strand intervention
        if: ${{ inputs.rank11_strand_native_aba }}
        env:
          AGENT14_STRAND_ABA_OUTPUT: agent14-rank11-zero-energy-strand-aba.json
        run: node simulation/evaluation/agent14-rank11-zero-energy-strand-native-aba.cjs
      - name: Preserve full pinned native A/B/A archive, including failures
        if: ${{ always() && inputs.rank11_strand_native_aba }}
        uses: actions/upload-artifact@v4
        with:
          name: agent14-rank11-zero-energy-strand-aba
          path: agent14-rank11-zero-energy-strand-aba.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run 32 prospectively registered paired four-rank original source games
        if: ${{ inputs.fresh_crossrank_strand }}
        env:
          AGENT14_FRESH_STRAND_OUTPUT: agent14-crossrank-fresh-strand-64.json
        run: node simulation/evaluation/agent14-prospective-zero-energy-strand-crossrank.cjs
      - name: Preserve all original 64 native attempts and matched-seed derivations
        if: ${{ always() && inputs.fresh_crossrank_strand }}
        uses: actions/upload-artifact@v4
        with:
          name: agent14-crossrank-fresh-strand-64
          path: agent14-crossrank-fresh-strand-64.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report actual source mobility coverage
        run: node -e "const x=require('./simulation/evaluation/agent14-authenticated-mobility-roster-audit.cjs').auditPinnedRoster();console.log('MOBILITY_FIELD',JSON.stringify({total:x.originalCompleteSixties,coverage:x.anyCoreMobility,byFamily:x.byFamily.map(v=>[v.name,v.originalListsContaining,v.aggregatePrintedCopies]),paperQualified:x.paperGameQualified}))"
      - name: Report exact opening-conditioned six-Prize collapse
        run: node simulation/evaluation/agent14-mobility-prize-collapse.cjs
