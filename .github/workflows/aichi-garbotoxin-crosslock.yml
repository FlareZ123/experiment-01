name: Aichi Garbotoxin cross-lock action audit

on:
  workflow_dispatch:
    inputs:
      rank8_source_fork:
        description: 'Opt-in same-source rank8 Latias Field Blower and paid retreat counterfactuals'
        type: boolean
        default: false
      rank11_shop_source_observer:
        description: 'Opt-in exact source rank11 read-only Shopping Center opportunity audit'
        type: boolean
        default: false
      rank11_k1_source_audit:
        description: 'Opt-in actual first-turn rank11 own-deck K1 search choices'
        type: boolean
        default: false
      rank11_firstturn_boostshake_fork:
        description: 'Opt-in actual-source firstturn VIP Stone Shake forcing and opponent reply'
        type: boolean
        default: false
      rank11_adaptive_boostshake:
        description: 'Opt-in owner-only K0-conditional rank11 lock opening with authentic Store actions'
        type: boolean
        default: false
      rank11_underworld_exposure:
        description: 'Opt-in source-ranked Tool-Garbodor versus live Underworld Door availability'
        type: boolean
        default: false
      rank11_forced_shop_exposure:
        description: 'Opt-in natural Shop-Crobat window audit after printed rank11 forced turn-one lock'
        type: boolean
        default: false
      rank11_held_shake_source_screen:
        description: 'Opt-in precommitted 80 two-slot actual-source held-Boost-Shake exposure screen'
        type: boolean
        default: false
      rank11_held_shake_extended_cohort:
        description: 'Use prospectively registered second cohort indices 80-239 (160 trials)'
        type: boolean
        default: false
      rank11_held_shake_reply_forensic:
        description: 'Re-run four already observed source held-Shake opportunities and audit candidate replies'
        type: boolean
        default: false
      rank11_rank1_attack_response:
        description: 'Opt-in four opportunity-conditioned both-start authentic rank11 versus rank1 attack responses'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cross-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - run: node --test tests/rank8-latias-escape-policy.test.cjs tests/rank8-latias-effect-ledger.test.cjs
      - run: node simulation/twinleaf/garbotoxin-vileplume-action.cjs
      - run: node simulation/twinleaf/garbotoxin-removal-tempo.cjs
      - run: node simulation/twinleaf/garbotoxin-faba-tempo.cjs
      - run: node simulation/twinleaf/garbotoxin-retool-after-faba.cjs
      - run: node simulation/twinleaf/rank11-shopping-center-diagnostic.cjs
      - run: node simulation/twinleaf/rank11-shopping-center-store-cycle.cjs
      - run: node simulation/twinleaf/rank11-two-garbo-field-blower.cjs
      - run: node scripts/aichi-grand-tree-opening.cjs
      - name: Audit raw Grand Tree opening-turn restriction
        run: node simulation/twinleaf/grand-tree-first-turn-audit.cjs
      - name: Observe exact-source rank11 own-hand Shopping Center opportunities
        if: inputs.rank11_shop_source_observer
        run: node simulation/twinleaf/rank11-shopping-center-source-observer.cjs > rank11-shop-source-observer.json
      - name: Preserve source-rank11 witness, including negative exposure
        if: always() && inputs.rank11_shop_source_observer
        uses: actions/upload-artifact@v4
        with:
          name: rank11-shop-source-observer
          path: rank11-shop-source-observer.json
          if-no-files-found: warn
      - name: Audit rank11 source first-turn own-deck K1 search choices
        if: inputs.rank11_k1_source_audit
        run: node simulation/twinleaf/absol-rank11-k1-source-audit.cjs > rank11-k1-source-audit.json
      - name: Archive K1 action evidence and negative controls
        if: always() && inputs.rank11_k1_source_audit
        uses: actions/upload-artifact@v4
        with:
          name: rank11-firstturn-k1-source-audit
          path: rank11-k1-source-audit.json
          if-no-files-found: warn
      - name: Run source-dealt rank11 first-turn alternative and live reply
        if: inputs.rank11_firstturn_boostshake_fork
        run: node simulation/twinleaf/rank11-firstturn-boostshake-source-run.cjs > rank11-firstturn-boostshake-fork.json
      - name: Archive source first-turn alternative, including failed-run detail
        if: always() && inputs.rank11_firstturn_boostshake_fork
        uses: actions/upload-artifact@v4
        with:
          name: rank11-firstturn-boostshake-source-fork
          path: rank11-firstturn-boostshake-fork.json
          if-no-files-found: warn
      - name: Test rank11 K0-conditional policy eligibility and source opening
        if: inputs.rank11_adaptive_boostshake
        run: |
          node --test tests/rank11-boostshake-opening-eligibility.test.cjs
          node simulation/twinleaf/rank11-adaptive-boostshake-source-run.cjs > rank11-adaptive-boostshake.json
      - name: Count rank11 conditional opener from exact printed finite population
        if: inputs.rank11_adaptive_boostshake
        run: python3 scripts/rank11-adaptive-opening-envelope.py > rank11-adaptive-opening-envelope.json
      - name: Preserve exact source opening resource envelope
        if: always() && inputs.rank11_adaptive_boostshake
        uses: actions/upload-artifact@v4
        with:
          name: rank11-adaptive-opening-envelope
          path: rank11-adaptive-opening-envelope.json
          if-no-files-found: warn
      - name: Preserve conditional rank11 first-turn source-policy trace
        if: always() && inputs.rank11_adaptive_boostshake
        uses: actions/upload-artifact@v4
        with:
          name: rank11-adaptive-source-boostshake
          path: rank11-adaptive-boostshake.json
          if-no-files-found: warn
      - name: Evaluate rank11 source Garbotoxin against live Underworld Door
        if: inputs.rank11_underworld_exposure
        run: node simulation/twinleaf/rank11-source-underworld-lock-exposure.cjs > rank11-underworld-lock-exposure.json
      - name: Archive source-based actual ability-lock exposure witness
        if: always() && inputs.rank11_underworld_exposure
        uses: actions/upload-artifact@v4
        with:
          name: rank11-source-underworld-exposure
          path: rank11-underworld-lock-exposure.json
          if-no-files-found: warn
      - name: Audit source Shop-Crobat windows after the first-turn lock fork
        if: inputs.rank11_forced_shop_exposure
        run: node simulation/twinleaf/rank11-forced-shop-source-exposure.cjs > rank11-forced-shop-source-exposure.json
      - name: Archive source-forced Shop opportunity evidence
        if: always() && inputs.rank11_forced_shop_exposure
        uses: actions/upload-artifact@v4
        with:
          name: rank11-forced-shop-source-exposure
          path: rank11-forced-shop-source-exposure.json
          if-no-files-found: warn
      - name: Validate held-Shake K0 guards and frozen trial schedule
        run: node --test tests/rank11-held-shake-opener.test.cjs tests/rank11-held-shake-witness.test.cjs tests/rank11-held-shake-schedule.test.cjs tests/rank11-held-shake-resource-census.test.cjs
      - name: Print independent exact 7+6+1 held-Shake access bound
        run: node scripts/rank11-held-shake-resource-census.cjs
      - name: Screen genuine rank11 held-Shake automatic policy on precommitted source deals
        if: inputs.rank11_held_shake_source_screen
        env:
          AICHI_HELD_SHAKE_EXTENDED: ${{ inputs.rank11_held_shake_extended_cohort && 'true' || 'false' }}
        run: node simulation/twinleaf/rank11-held-shake-source-screen.cjs > rank11-held-shake-source-screen.json
      - name: Retain all held-Shake source trials including unsuccessful opportunities
        if: always() && inputs.rank11_held_shake_source_screen
        uses: actions/upload-artifact@v4
        with:
          name: rank11-held-shake-source-screen
          path: rank11-held-shake-source-screen.json
          if-no-files-found: warn
      - name: Capture real candidate first reply after all four original held-Shake triggers
        if: inputs.rank11_held_shake_reply_forensic
        run: node simulation/twinleaf/rank11-held-shake-forensic.cjs > rank11-held-shake-forensic.json
      - name: Archive candidate reply forensics, including source witness failures
        if: always() && inputs.rank11_held_shake_reply_forensic
        uses: actions/upload-artifact@v4
        with:
          name: rank11-held-shake-candidate-first-response
          path: rank11-held-shake-forensic.json
          if-no-files-found: warn
      - name: Reproduce authentic rank8 Latias escape decision alternatives
        if: inputs.rank8_source_fork
        run: node simulation/twinleaf/rank8-latias-escape-fork.cjs > rank8-latias-escape-fork.json
      - name: Record exact source-ranked counterfactual evidence
        if: always() && inputs.rank8_source_fork
        uses: actions/upload-artifact@v4
        with:
          name: rank8-latias-source-escape-fork
          path: rank8-latias-escape-fork.json
          if-no-files-found: warn
      - name: Source-dealt four both-start rank11 opening and rank1 reference attack responses
        if: inputs.rank11_rank1_attack_response
        run: node simulation/twinleaf/rank11-conditioned-lock-rank1-response.cjs > rank11-rank1-response.json
      - name: Summarize source rank11 lock and rank1 attack declarations
        if: inputs.rank11_rank1_attack_response
        run: >-
          node -e "const x=require('./rank11-rank1-response.json');
          for(const r of x.rows)console.log(JSON.stringify({
          seed:r.seed,first:r.actualFirstTurnSlot,expected:r.expectedRank11ActualFirst,
          completed:r.rank11Direct?.completed,lock:r.rank11Direct?.nextTurnLockWitness,
          actions:r.rootActions,finished:r.finished,candidateDeclarations:r.candidatePostLockAttackDeclarations,
          sourceDeclarations:r.opponentPostLockAttackDeclarations,
          candidatePasses:r.candidatePostLockPasses,candidateRootAttacks:r.candidatePostLockRootAttacks,
          error:r.error||null}));"
      - name: Preserve exact conditioned-source opponent actions and attack declarations
        if: always() && inputs.rank11_rank1_attack_response
        uses: actions/upload-artifact@v4
        with:
          name: rank11-both-start-rank1-conditioned-response
          path: rank11-rank1-response.json
          if-no-files-found: warn
