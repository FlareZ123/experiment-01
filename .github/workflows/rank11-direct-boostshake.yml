name: Rank11 direct Boost Shake source-policy probe

on:
  workflow_dispatch:
    inputs:
      trials:
        description: Prospective fixed seed count, maximum 128
        required: false
        default: '32'
      seed_protocol:
        description: Source seed frame, legacy consecutive or decorrelated
        required: false
        default: 'decorrelated-v2'
        type: choice
        options:
          - decorrelated-v2
          - legacy-consecutive-v1
      attack_window_probe:
        description: 'Retrospective source lock versus fixed candidate attack-window diagnostic'
        required: false
        type: boolean
        default: false
      vip_counterfactual:
        description: 'Real first-turn VIP play against the fixed candidate-first source seed'
        required: false
        type: boolean
        default: false
      farewell_reservation_probe:
        description: 'Third arm reservation-aware source continuation of Farewell and VIP'
        required: false
        type: boolean
        default: false
      farewell_vip_pair:
        description: 'Source-first Benched Unown Farewell before unchanged VIP pair, one archived deal'
        required: false
        type: boolean
        default: false
      vip_prospective_trials:
        description: Prospectively fixed VIP trial count, 0 disables
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '4'
          - '8'
          - '12'
          - '16'
      held_seal_probe:
        description: Source-dealt held Forest Seal Stone route, opt-in and unqualified
        required: false
        type: boolean
        default: false
      held_seal_trials:
        description: Held-Seal source-dealt frame count
        required: false
        default: '32'
        type: choice
        options:
          - '32'
          - '64'
          - '128'
      source_seat:
        description: Physical engine seat occupied by published rank11
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: read

jobs:
  direct-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned simulator
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Pure rank11 direct-opportunity and seed-frame regressions
        run: node --test tests/rank11-direct-opportunity.test.cjs tests/rank11-held-seal-opportunity.test.cjs tests/rank11-held-seal-extended-opportunity.test.cjs tests/rank11-source-seeds.test.cjs tests/rank11-direct-candidate-attack-window.test.cjs tests/rank11-candidate-first-pass-summary.test.cjs tests/rank11-candidate-first-printed-attack-audit.test.cjs tests/rank11-unown-pre-retreat-payment-audit.test.cjs tests/rank11-newmoon-firstturn-vip-availability-audit.test.cjs tests/newmoon-farewell-vip-bench-policy.test.cjs tests/newmoon-bench-reservation-policy.test.cjs
      - name: Install pinned simulator dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned simulator
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Observe prospective rank11 actual source dealt lines
        env:
          TRIALS: ${{ inputs.trials || '32' }}
          SEED_PROTOCOL: ${{ inputs.seed_protocol || 'decorrelated-v2' }}
          RANK11_SOURCE_SEAT: ${{ inputs.source_seat || '0' }}
        run: node simulation/twinleaf/rank11-direct-source-probe.cjs > rank11-direct-source-probe.json
      - name: Observe held-Seal first-own-turn source-dealt opportunities
        if: inputs.held_seal_probe
        env:
          TRIALS: ${{ inputs.held_seal_trials || '32' }}
          RANK11_SOURCE_SEAT: ${{ inputs.source_seat || '0' }}
        run: node simulation/twinleaf/rank11-held-seal-source-probe.cjs > rank11-held-seal-source-probe.json
      - name: Print held-Seal source opportunity denominator
        if: inputs.held_seal_probe
        run: node -e "const p=require('./rank11-held-seal-source-probe.json'); console.log(JSON.stringify({trials:p.trialCount,seat:p.sourcePhysicalSeat,sourceFirst:p.sourceFirst,sourceSecond:p.sourceSecond,opportunities:p.opportunities,completed:p.completed,aborted:p.aborted,opportunityRows:p.rows.filter(r=>r.opportunityDetected)},null,2))"
      - name: Compare archived genuine rank11 direct locks with fixed candidate attack windows
        if: inputs.attack_window_probe
        run: node simulation/twinleaf/rank11-direct-candidate-attack-window.cjs > rank11-direct-candidate-attack-window.json
      - name: Audit and print all fixed candidate attack-window arms
        if: inputs.attack_window_probe
        run: node scripts/rank11-direct-attack-window-summary.cjs
      - name: Print candidate-first response evidence
        if: inputs.attack_window_probe
        run: node scripts/rank11-candidate-first-pass-summary.cjs
      - name: Compare real first-turn candidate VIP play with untouched source Pass
        if: inputs.vip_counterfactual
        run: node simulation/twinleaf/rank11-newmoon-first-vip-counterfactual.cjs > rank11-newmoon-first-vip-counterfactual.json
      - name: Compare actual candidate first turn with Farewell Letter before VIP
        if: inputs.farewell_vip_pair
        run: node simulation/twinleaf/rank11-newmoon-farewell-vip-source-pair.cjs > rank11-newmoon-farewell-vip-source-pair.json
      - name: Report Farewell-before-VIP source action and fail on engine exception
        if: inputs.farewell_vip_pair
        run: node -e "const p=require('./rank11-newmoon-farewell-vip-source-pair.json');console.log(JSON.stringify({seed:p.retrospectiveSourceSeed,firstInformationEqual:p.initialOwnerInformationIdentical,errors:p.failures,baselineVIP:p.baseline.vipAudit?.events,alternatedFarewell:p.farewellFirst.farewellAudit?.events,alternateVIP:p.farewellFirst.vipAudit?.events},null,2));if(p.failures||!p.initialOwnerInformationIdentical)process.exitCode=1"
      - name: Verify source-first VSTAR and second-start direct policies compose
        run: node simulation/twinleaf/rank11-hybrid-source-replay.cjs > rank11-hybrid-source-replay.json
      - name: Retain one real K1 Garbodor search-negative source seed
        run: node simulation/twinleaf/rank11-direct-abort-replay.cjs > rank11-direct-abort-replay.json
      - name: Compare legacy K0 and owner-search K1 early-abort policies
        run: node simulation/twinleaf/rank11-k1-source-contrast.cjs > rank11-k1-source-contrast.json
      - name: Validate six authentic source-dealt combined rank11 policy cases
        run: node simulation/twinleaf/rank11-k1-hybrid-profile-source-regression.cjs > rank11-k1-hybrid-profile-source.json
      - name: Print bounded outcome and keep all failed opportunities
        run: node -e "const p=require('./rank11-direct-source-probe.json'); console.log(JSON.stringify({seedProtocol:p.seedProtocol,sourceSeat:p.sourcePhysicalSeat,trials:p.actualTrialCount,starts:p.startSlotCounts,sourceFirst:p.sourceActualFirstCount,opportunities:p.opportunities,completed:p.completed,aborts:p.aborts,interesting:p.trials.filter(t=>t.sourceOpportunity!==null)},null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank11-direct-boostshake-unqualified-seat-${{ inputs.source_seat || '0' }}
          path: |
            rank11-direct-source-probe.json
            rank11-held-seal-source-probe.json
            rank11-direct-candidate-attack-window.json
            rank11-newmoon-first-vip-counterfactual.json
            rank11-newmoon-farewell-vip-source-pair.json
            rank11-hybrid-source-replay.json
            rank11-direct-abort-replay.json
            rank11-k1-source-contrast.json
            rank11-k1-hybrid-profile-source.json
          if-no-files-found: warn
          retention-days: 14
