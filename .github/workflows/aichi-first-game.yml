name: Aichi bounded engine gameplay

on:
  workflow_dispatch:
    inputs:
      shadow_rider_energy_priority:
        description: 'Opt-in experimental Psychic attachment counterpolicy for Iron Thorns'
        required: false
        type: boolean
        default: false
      shadow_rider_energy_across_field:
        description: 'Experimental Psychic attachment priority regardless of opposing Active'
        required: false
        type: boolean
        default: false
      shadow_rider_opening_pivot:
        description: 'Opt-in selected Shadow Rider V setup Active counterfactual'
        required: false
        type: boolean
        default: false
      latias_attack_ready:
        description: 'Opt-in source-state Latias one-Psychic attack-cost completion policy'
        required: false
        type: boolean
        default: false
      attack_before_retreat:
        description: 'Opt-in generic Attack before Retreat action-order probe'
        required: false
        type: boolean
        default: false
      attack_before_retreat_candidate_only:
        description: 'Apply attack-before-retreat policy to candidate seat only'
        required: false
        type: boolean
        default: false
      pilot_ranks:
        description: 'One or two comma-separated Aichi diagnostic ranks: 1,2,3,4,5,6,8,10,26'
        required: false
        type: string
        default: '6'
      seat_seed_protocol:
        description: 'Explicitly versioned random-seat seed schedule; v3 default, v2 for archive replay'
        required: false
        type: choice
        options:
          - independent-slots-v2
          - decorrelated-slots-v3
        default: decorrelated-slots-v3
      expanded_action_policy:
        description: 'Experimental Tool attack, Bunnelby Evolution and Temple response profile; not competitive'
        required: false
        type: boolean
        default: false
      audit_passed_attacks:
        description: 'Probe first eight Pass decisions for detached pinned-engine attack announcements'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify terminal-transition and campaign regressions
        run: node --test tests/terminal-transition.test.cjs tests/public-board-telemetry.test.cjs tests/printed-basic-energy-audit.test.cjs tests/aichi-basic-covered-passes.test.cjs tests/aichi-benched-basic-pass-triage.test.cjs tests/shadow-rider-psychic-attach.test.cjs tests/aichi-pass-board-audit.test.cjs tests/aichi-campaign-execute.test.cjs tests/aichi-campaign-seed-v2.test.cjs tests/aichi-campaign-seed-v3.test.cjs tests/decision-hand-evidence.test.cjs tests/aichi-opening-decision-audit.test.cjs tests/aichi-campaign-quality-screen.test.cjs tests/tm-evolution-pass-evidence.test.cjs tests/bunnelby-k0-deck-target-leak.test.cjs tests/active-opening-pivot.test.cjs tests/attack-retreat-order.test.cjs tests/retreat-transition-evidence.test.cjs tests/pass-attack-announcement-probe.test.cjs tests/aichi-pass-attack-opportunities.test.cjs
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify cloned Store attack-pass regression after compile
        run: node --test tests/pass-attack-announcement-probe.test.cjs tests/aichi-pass-attack-opportunities.test.cjs tests/pass-probe-noninterference.test.cjs tests/latias-rank10-energy-completion.test.cjs tests/latias-attack-ready-attach.test.cjs
      - name: Verify rank2 source-game pass observer noninterference when opt-in
        if: inputs.audit_passed_attacks
        run: node simulation/twinleaf/pass-probe-noninterference.cjs > aichi-pass-probe-noninterference.json
      - name: Keep manually requested diagnostics within the CI budget
        env:
          AICHI_RANKS: ${{ inputs.pilot_ranks || '6' }}
        run: node -e "const a=process.env.AICHI_RANKS.split(',').map(s=>s.trim());const valid=new Set(['1','2','3','4','5','6','8','10','26']);if(!a.length||a.length>2||a.some(x=>!valid.has(x))||new Set(a).size!==a.length)throw Error('Choose one or two distinct published pilot ranks')"
      - name: Reproduce recorded Hood Shadow Mist alternative
        run: node simulation/twinleaf/shadow-mist-rank6-pivot.cjs
      - name: Verify Wondrous Labyrinth modifies Mimikyu Filch payment
        run: node simulation/twinleaf/wondrous-mimikyu-filch.cjs
      - name: Two Aichi seat trials
        run: node simulation/evaluation/aichi-first-game.cjs
      - name: Run fixed-plan three-candidate rank-6 diagnostic
        env:
          AICHI_DIAGNOSTIC_RANKS: ${{ inputs.pilot_ranks || '6' }}
          AICHI_DIAGNOSTIC_SEED_PROTOCOL: ${{ inputs.seat_seed_protocol || 'decorrelated-slots-v3' }}
          AICHI_POLICY_PROFILE: ${{ inputs.expanded_action_policy && 'expanded-action-fidelity-probe-v1' || 'fixed-core-v1' }}
          AICHI_SHADOW_ENERGY: ${{ inputs.shadow_rider_energy_priority && '1' || '0' }}
          AICHI_SHADOW_ENERGY_GLOBAL: ${{ inputs.shadow_rider_energy_across_field && '1' || '0' }}
          AICHI_OPENING_PIVOT: ${{ inputs.shadow_rider_opening_pivot && '1' || '0' }}
          AICHI_LATIAS_ATTACK_READY: ${{ inputs.latias_attack_ready && '1' || '0' }}
          AICHI_ATTACK_BEFORE_RETREAT: ${{ inputs.attack_before_retreat && '1' || '0' }}
          AICHI_ATTACK_CANDIDATE_ONLY: ${{ inputs.attack_before_retreat_candidate_only && '1' || '0' }}
          AICHI_ATTACK_PASS_PROBE: ${{ inputs.audit_passed_attacks && '1' || '0' }}
        run: node simulation/evaluation/aichi-campaign-execute.cjs > aichi-campaign-diagnostic.json
      - name: Screen engine diagnostics for attacker inactivity and trace integrity
        run: node scripts/aichi-campaign-quality-screen.cjs aichi-campaign-diagnostic.json > aichi-quality-screen.json
      - name: Print bounded rank-level quality and action blockers
        run: node -e "const x=require('./aichi-quality-screen.json');console.log('Full pilot matrix verified:',x.fullPilotMatrixVerified);for(const c of x.coverage)console.log('COVERAGE',JSON.stringify(c));for(const r of x.records)console.log('TRIAL',JSON.stringify({trialId:r.trialId,status:r.status,actualTurn:r.actualTurn,candidateAttacks:r.candidateAttacks,opponentAttacks:r.opponentAttacks,blockers:r.blockers,terminalDeckRemaining:r.terminalDeckRemaining,terminalPrizesRemaining:r.terminalPrizesRemaining}))"
      - name: Count pinned-engine accepted attacks missed at Pass decisions
        run: node scripts/aichi-pass-attack-opportunities.cjs aichi-campaign-diagnostic.json > aichi-pass-attack-opportunities.json
      - name: Print bounded missed-attack samples and probe coverage
        run: node -e "const r=require('./aichi-pass-attack-opportunities.json');console.log('PASS PROBE COVERAGE',JSON.stringify(r.coverage));for(const x of r.checkedPasses.filter(x=>x.engineAccepted.length).slice(0,12))console.log('ACCEPTED PASS ATTACK',JSON.stringify({trialId:x.trialId,side:x.side,turn:x.turnBefore,attacks:x.engineAccepted,publicBoard:x.publicBoardBeforePass}))"
      - name: Audit first Iron Thorns decisions without inferring wins
        run: node simulation/evaluation/aichi-opening-decision-audit.cjs aichi-campaign-diagnostic.json > aichi-opening-decision-audit.json
      - name: Audit public pass boards without inferring attack legality
        run: node scripts/aichi-pass-board-audit.cjs aichi-campaign-diagnostic.json > aichi-pass-board-audit.json
      - name: Audit printed Basic Energy coverage at passes
        run: node scripts/aichi-basic-covered-passes.cjs aichi-campaign-diagnostic.json > aichi-pass-energy-triage.json
      - name: Audit covered Benched printed attacks during candidate passes
        run: node scripts/aichi-benched-basic-pass-triage.cjs aichi-campaign-diagnostic.json > aichi-bench-energy-triage.json
      - name: Print early-turn hand evidence summary
        run: node -e "const r=require('./aichi-opening-decision-audit.json');for(const x of r.records)console.log(JSON.stringify({trialId:x.trialId,status:x.auditStatus,globalTurn:x.firstObservedTurn,firstHand:x.firstObservedHandPrintings,played:x.playedCards,end:x.firstTurnEndAction,firstAttack:x.firstRecordedAttackTurn}))"
      - name: Preserve bounded diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-campaign-diagnostic
          path: |
            aichi-campaign-diagnostic.json
            aichi-quality-screen.json
            aichi-opening-decision-audit.json
            aichi-pass-board-audit.json
            aichi-pass-energy-triage.json
            aichi-bench-energy-triage.json
            aichi-pass-attack-opportunities.json
            aichi-pass-probe-noninterference.json
          if-no-files-found: warn
