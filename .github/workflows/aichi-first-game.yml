name: Aichi bounded engine gameplay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Verify terminal-transition and campaign regressions
        run: node --test tests/terminal-transition.test.cjs tests/public-board-telemetry.test.cjs tests/aichi-campaign-execute.test.cjs
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Two Aichi seat trials
        run: node simulation/evaluation/aichi-first-game.cjs
      - name: Run fixed-plan three-candidate rank-6 diagnostic
        env:
          AICHI_DIAGNOSTIC_RANKS: '6'
        run: node simulation/evaluation/aichi-campaign-execute.cjs > aichi-campaign-diagnostic.json
      - name: Preserve bounded diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aichi-campaign-diagnostic
          path: aichi-campaign-diagnostic.json
          if-no-files-found: warn
