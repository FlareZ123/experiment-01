name: Aichi Bunnelby K0 real tactic action contrast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - run: node --test tests/full-deck-prompt-observer.test.cjs
      - run: node --test tests/expanded-policy-profile.test.cjs
      - run: node simulation/twinleaf/bunnelby-k0-action-contrast.cjs
