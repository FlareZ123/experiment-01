name: Twinleaf Electrode-GX Ability fidelity audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-electrode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute staged Electrode-GX Store and bot prompt contract
        run: node simulation/twinleaf/electrode-gx-ability-contract.cjs
      - name: Verify exact rank9 Bomb attachment to Mega ex
        run: node --test tests/rank9-electrode-mega-recipient.test.cjs
      - name: Audit authentic rank9 Terminal Period declaration conditions
        run: node --test tests/rank9-terminal-period-public-root-audit.test.cjs
      - name: Verify reversible Electrode-GX Energy correction
        run: node --test tests/electrode-gx-energy-hook.test.cjs
      - name: Expose default Electrode Ability scoring penalty
        run: node simulation/twinleaf/electrode-gx-ability-tactic.cjs
      - name: Verify fixed-source policy flag is carried and checked
        run: node --test tests/aichi-campaign-execute.test.cjs
