name: Aichi Raichu Temple attack-cost regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aichi-raichu-temple-check
  cancel-in-progress: false

jobs:
  temple-raichu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Test rank-4 and rank-17 Energy sources, Temple denial and Stadium replacement
        run: node simulation/twinleaf/temple-raichu-board.cjs
