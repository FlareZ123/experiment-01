name: Aichi Temple candidate engine feasibility

on:
  workflow_dispatch:
    inputs:
      temple_thorns_source_window:
        description: '24 precommitted Temple versus Iron Thorns owner-observation games, unqualified'
        required: false
        type: boolean
        default: false
      temple_thorns_source_trace:
        description: 'Additional archived rank-24 root-action trace, no new seeds'
        required: false
        type: boolean
        default: false

      agent43_muk_board:
        description: 'Opt-in pinned native staged Alolan Muk versus Thorns Ability matrix, not a match'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  paired-fixtures:
    if: ${{ !inputs.temple_thorns_source_window }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Resolve candidate and run two bounded generic-bot fixtures
        run: node simulation/evaluation/aichi-temple-candidate.cjs

      - name: Verify synthetic Wobbuffet and Iron Thorns board effects
        run: node simulation/twinleaf/temple-wobbuffet-board.cjs

      - name: Opt-in staged pinned Alolan Muk and Iron Thorns board predicates
        if: inputs.agent43_muk_board
        run: |
          node simulation/twinleaf/agent43-alolan-muk-thorns-native-matrix.cjs > agent43-muk-thorns-board.json
          node -e "const a=require('./agent43-muk-thorns-board.json');console.log(JSON.stringify({schema:a.schema,status:a.status,missing:a.missing||[],discrepancies:a.discrepancies||[],rows:a.rows?.length||0,qualified:a.competitiveGameQualified}));if(a.status==='NATIVE_BOARD_PAPER_EXPECTATION_MISMATCH')process.exitCode=1"
      - name: Archive bounded native Muk board matrix without competitive claims
        if: inputs.agent43_muk_board && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent43-muk-thorns-pinned-board-matrix
          path: agent43-muk-thorns-board.json
          if-no-files-found: warn


  source-window:
    if: ${{ inputs.temple_thorns_source_window }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rank: [6, 24, 29]
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Source-dealt Temple owner-window observations for registered rank
        env:
          TEMPLE_SOURCE_RANK: ${{ matrix.rank }}
          TEMPLE_SOURCE_TRACE: ${{ inputs.temple_thorns_source_trace }}
        run: |
          node --check simulation/twinleaf/temple-thorns-source-window.cjs
          node simulation/twinleaf/temple-thorns-source-window.cjs > temple-thorns-source-window.json
      - name: Print registered rank denominator, parity and unqualified windows
        run: node -e "const r=require('./temple-thorns-source-window.json'); console.log(JSON.stringify({rank:r.selectedRank,registered:r.registrationDigest,attempted:r.count,wobStarting:r.wobbuffetStartingActive,wobWindows:r.wobbuffetLiveWindows,readyWindows:r.fullyReadyLiveWindows,wobSetupHand:r.wobbuffetInSetupHand,wobOfferedNotChosen:r.wobbuffetOfferedButNotChosen,setupChoiceEvents:r.setupChoiceEvents,observerParity:r.parity?.identical,qualified:r.competitiveQualifiedGames}));"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: temple-thorns-source-window-rank-${{ matrix.rank }}
          path: temple-thorns-source-window.json
          retention-days: 14
          if-no-files-found: warn
