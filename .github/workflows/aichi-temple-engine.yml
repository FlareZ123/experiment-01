name: Aichi Temple candidate engine feasibility

on:
  workflow_dispatch:
    inputs:
      temple_thorns_source_window:
        description: '24 precommitted Temple versus Iron Thorns owner-observation games, unqualified'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  paired-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Resolve candidate and run two bounded generic-bot fixtures
        run: node simulation/evaluation/aichi-temple-candidate.cjs

      - name: Verify synthetic Wobbuffet and Iron Thorns board effects
        run: node simulation/twinleaf/temple-wobbuffet-board.cjs

      - name: Source-dealt Temple Iron Thorns read-only owner-window panel
        if: ${{ inputs.temple_thorns_source_window }}
        run: |
          node --check simulation/twinleaf/temple-thorns-source-window.cjs
          node simulation/twinleaf/temple-thorns-source-window.cjs > temple-thorns-source-window.json
      - name: Print registered denominator and observer parity, no win estimates
        if: ${{ inputs.temple_thorns_source_window }}
        run: node -e "const r=require('./temple-thorns-source-window.json'); console.log(JSON.stringify({schema:r.schema,registered:r.registrationDigest,attempted:r.count,wobStarting:r.wobbuffetStartingActive,wobWindows:r.wobbuffetLiveWindows,readyWindows:r.fullyReadyLiveWindows,observerParity:r.parity?.identical,qualified:r.competitiveQualifiedGames}));"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.temple_thorns_source_window && always() }}
        with:
          name: temple-thorns-source-window-24
          path: temple-thorns-source-window.json
          retention-days: 14
          if-no-files-found: warn
