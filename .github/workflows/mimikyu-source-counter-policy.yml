name: Mimikyu source-counterline policy diagnostic

on:
  workflow_dispatch:
    inputs:
      agent46_replay_run:
        description: Read and summarize a completed archived source-run ID without re-simulating
        type: string
        required: false
        default: ''
      agent46_replay_artifact:
        description: Exact artifact name in the completed source run
        type: string
        required: false
        default: ''
      agent46_mimikyu_manual_promote_ab:
        description: Preregistered rank1 Mimikyu manual Psychic and post-Apex promotion 24-arm source panel
        type: boolean
        required: false
        default: false
      agent46_underworld_paper_target_test:
        description: Test pinned native Underworld Door illegal non-Psychic Bench and reversible paper legality hook
        type: boolean
        required: false
        default: false
      agent46_underworld_mimikyu_ab:
        description: Prospective original-source Underworld Door Psychic-to-Mimikyu 24-arm A/B
        type: boolean
        required: false
        default: false
      agent46_mimikyu_treasure_ab:
        description: Prospective 32-arm owner-visible Mysterious Treasure dual-axis discard/search versus Fog-only
        type: boolean
        required: false
        default: false
      agent46_mimikyu_fog_ab:
        description: Prospective original rank1/rank10 48-arm owner-visible Fog Crystal search and Dragon preservation A/B
        type: boolean
        required: false
        default: false
      agent46_mimikyu_setup_ab:
        description: Prospective original rank1/rank10 48-arm owner-visible Mimikyu Bench priority A/B
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.agent46_replay_run != '' && 'aichi-source-mimikyu-artifact-audit' || 'aichi-source-mimikyu-counter-policy' }}
  cancel-in-progress: false

jobs:
  artifact-audit:
    if: inputs.agent46_replay_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen A/B JSON artifact by original run
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN: ${{ inputs.agent46_replay_run }}
          REPLAY_ARTIFACT: ${{ inputs.agent46_replay_artifact }}
        run: gh run download "$REPLAY_RUN" -n "$REPLAY_ARTIFACT" -D replay
      - name: Report stored game status, original-source pairs and policy effects
        run: node simulation/evaluation/2026-11/agent46-source-artifact-summary.cjs replay
  diagnostic:
    if: inputs.agent46_replay_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile exact pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify public Copycat counterpolicy contract
        run: node --test tests/mimikyu-counter-policy.test.cjs tests/mimikyu-headless-hook-options.test.cjs
      - name: Verify both-seat native owner-scoped Mimikyu Bench priority
        run: node --test tests/2026-11/agent46-mimikyu-priority-basic.native.test.cjs
      - name: Compare two policy variants using source rank 1 and 10 full lists in both physical seats
        run: node simulation/twinleaf/mimikyu-counter-policy-pilot.cjs > mimikyu-policy-diagnostic.json
      - name: Optional frozen rank1 Mimikyu Bench setup vs rank10 source A/B
        if: inputs.agent46_mimikyu_setup_ab == true
        run: node simulation/evaluation/2026-11/agent46-mimikyu-bench-priority-source-ab.cjs > agent46-mimikyu-bench-priority-source-ab.json
      - name: Archive prospective owner-visible Mimikyu setup A/B
        if: ${{ always() && inputs.agent46_mimikyu_setup_ab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: agent46-mimikyu-bench-priority-source-ab
          path: agent46-mimikyu-bench-priority-source-ab.json
          if-no-files-found: warn
      - name: Optional pinned native owner Fog Crystal search and physical Mimikyu transfer
        if: inputs.agent46_mimikyu_fog_ab == true
        run: node --test tests/2026-11/agent46-mimikyu-fog-search-setup.native.test.cjs
      - name: Optional frozen original rank1 Fog Crystal search and Dragon preservation A/B
        if: inputs.agent46_mimikyu_fog_ab == true
        run: node simulation/evaluation/2026-11/agent46-mimikyu-fog-owner-setup-source-ab.cjs > agent46-mimikyu-fog-source-ab.json
      - name: Summarize original-source Fog setup outcome
        if: inputs.agent46_mimikyu_fog_ab == true
        run: node -e "const x=require('./agent46-mimikyu-fog-source-ab.json');console.log(JSON.stringify({schema:x.schema,attempts:x.nativeAttempts,matched:x.matchedPhysicalPairs,events:x.setupProposalEvents,selections:x.selectedPhysicalFogMimikyu,diagnoses:x.pairs}))"
      - name: Archive original-source Fog setup A/B
        if: ${{ always() && inputs.agent46_mimikyu_fog_ab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: agent46-mimikyu-fog-source-ab
          path: agent46-mimikyu-fog-source-ab.json
          if-no-files-found: warn
      - name: Optional native dual-axis Treasure payment, search and owner custody both seats
        if: inputs.agent46_mimikyu_treasure_ab == true
        run: node --test tests/2026-11/agent46-mimikyu-treasure-search-setup.native.test.cjs
      - name: Optional frozen owner Treasure vs Fog natural full-sixty A/B
        if: inputs.agent46_mimikyu_treasure_ab == true
        run: node simulation/evaluation/2026-11/agent46-mimikyu-treasure-dual-axis-source-ab.cjs > agent46-mimikyu-treasure-ab.json
      - name: Summarize Treasure physical owner dual-axis source trials
        if: inputs.agent46_mimikyu_treasure_ab == true
        run: node -e "const x=require('./agent46-mimikyu-treasure-ab.json');console.log(JSON.stringify({schema:x.schema,attempts:x.attempts,matched:x.comparableOriginalSourceDeals,proposals:x.treasureProposals,discards:x.physicalDragonDiscards,mimikyuSelections:x.physicalMimikyuSelections,pairs:x.pairs}))"
      - name: Archive original-source Treasure vs Fog native A/B
        if: ${{ always() && inputs.agent46_mimikyu_treasure_ab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: agent46-mimikyu-treasure-dual-axis-source-ab
          path: agent46-mimikyu-treasure-ab.json
          if-no-files-found: warn
      - name: Optional native Underworld Door owned Psychic to real Mimikyu both seats
        if: inputs.agent46_underworld_mimikyu_ab == true
        run: node --test tests/2026-11/agent46-underworld-mimikyu-energy-focus.native.test.cjs
      - name: Optional frozen original rank1/rank10 Underworld Mimikyu Energy focus A/B
        if: inputs.agent46_underworld_mimikyu_ab == true
        run: node simulation/evaluation/2026-11/agent46-underworld-mimikyu-energy-source-ab.cjs > agent46-underworld-mimikyu-ab.json
      - name: Summarize Underworld owner Energy policy native results
        if: inputs.agent46_underworld_mimikyu_ab == true
        run: node -e "const x=require('./agent46-underworld-mimikyu-ab.json');console.log(JSON.stringify({schema:x.schema,attempts:x.nativeAttempts,matched:x.matchedPhysicalStartPairs,abilityProposals:x.underworldProposals,psychicAssignments:x.psychicAssignments,pairs:x.pairs}))"
      - name: Archive Underworld owner Psychic to Mimikyu native A/B
        if: ${{ always() && inputs.agent46_underworld_mimikyu_ab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: agent46-underworld-mimikyu-energy-source-ab
          path: agent46-underworld-mimikyu-ab.json
          if-no-files-found: warn
      - name: Validate native owner manual Psychic attachment and post-Apex promotion both seats
        if: inputs.agent46_mimikyu_manual_promote_ab == true
        run: node --test tests/2026-11/agent46-mimikyu-fund-and-promote.native.test.cjs
      - name: Execute all frozen original rank1/rank10 Mimikyu funded-promotion A/B attempts
        if: inputs.agent46_mimikyu_manual_promote_ab == true
        run: node simulation/evaluation/2026-11/agent46-mimikyu-manual-promote-source-ab.cjs > agent46-mimikyu-funded-promotion-source-ab.json
      - name: Summarize native source Mimikyu funding and promotion evidence
        if: inputs.agent46_mimikyu_manual_promote_ab == true
        run: node -e "const x=require('./agent46-mimikyu-funded-promotion-source-ab.json');console.log(JSON.stringify({schema:x.schema,attempts:x.nativeAttempts,matched:x.matchedPhysicalSourceDealPairs,manual:x.manualPsychicProposals,knockoutPromotions:x.nativeKoPromotionProposals,retreats:x.nativePaidRetreatProposals,pairs:x.pairs}))"
      - name: Archive full preregistered Mimikyu funded-promotion matched source A/B
        if: ${{ always() && inputs.agent46_mimikyu_manual_promote_ab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: agent46-mimikyu-funded-promotion-source-ab
          path: agent46-mimikyu-funded-promotion-source-ab.json
          if-no-files-found: warn
      - name: Optional native Underworld Door printed Psychic target paper-legal guard
        if: inputs.agent46_underworld_paper_target_test == true
        run: node --test tests/2026-11/agent46-underworld-paper-psychic-target-guard.native.test.cjs
      - name: Report bounded engine actions and public Copycat opportunities
        run: node -e "const x=require('./mimikyu-policy-diagnostic.json');console.log('Qualified win-rate evidence:',x.qualifiedWinRateEvidence);for(const r of x.rows)console.log(JSON.stringify({ranks:r.ranks,policy:r.policy,seed:r.seed,status:r.status,finished:r.finished,verifiedFirstTurn:r.verifiedFirstTurn,apex:r.actualApexDragonAttacks,copycat:r.actualCopycatAttacks,eligibleObservations:r.eligiblePublicChoiceObservations,error:r.error||null}))"
      - name: Preserve source-locked diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimikyu-source-copycat-counter-policy
          path: mimikyu-policy-diagnostic.json
          if-no-files-found: warn
