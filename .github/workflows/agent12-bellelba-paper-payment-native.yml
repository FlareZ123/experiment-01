name: Aichi original-source Supporter native paper fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bellelba-paper-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reversible payment guard and physical reference safety
        run: node --test tests/agent12-bellelba-paper-optional-payment-guard.test.cjs tests/agent12-opponent-hand-discard-paper-guard.test.cjs
      - name: Load pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Audit Lillie empty-deck pure policy predicate
        run: node --test tests/agent12-lillie-deckzero-opportunity.test.cjs tests/agent12-rank6-deckzero-pass-observer.test.cjs tests/agent12-rank6-deckzero-historical.native.test.cjs
      - name: Probe actual pinned both-seat Thorton Regidrago-to-ADP swap and evolved-target rejection
        run: node --test tests/agent12-thorton-regv-active-native.test.cjs tests/agent12-thorton-adp-regv-evolution-native.test.cjs
      - name: Diagnose inherited damage and immediate Regidrago HP collapse after paper Thorton
        run: node simulation/twinleaf/agent12-thorton-hp-collapse-native.cjs
      - name: Probe complete constructed two-own-turn Thorton enhanced-GX and copied Apex flow
        run: node --test tests/agent12-thorton-gx-apex-two-own-turns-native.test.cjs
      - name: Run Bellelba three-card cost and Sidney eligible-type native cases
        run: node --test tests/agent12-bellelba-optional-payment-native.test.cjs tests/agent12-bellelba-optional-guarded-native.test.cjs tests/agent12-sidney-opponent-hand-native.test.cjs tests/agent12-team-skull-grunt-native.test.cjs tests/agent12-opponent-hand-discard-guarded-native.test.cjs
