name: Aichi original-source Supporter native paper fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bellelba-paper-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reversible payment guard and physical reference safety
        run: node --test tests/agent12-bellelba-paper-optional-payment-guard.test.cjs
      - name: Load pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run Bellelba three-card cost and Sidney eligible-type native cases
        run: node --test tests/agent12-bellelba-optional-payment-native.test.cjs tests/agent12-bellelba-optional-guarded-native.test.cjs tests/agent12-sidney-opponent-hand-native.test.cjs tests/agent12-team-skull-grunt-native.test.cjs
