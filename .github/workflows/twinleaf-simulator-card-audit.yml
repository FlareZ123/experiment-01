name: Twinleaf simulator Card reference audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned server
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Characterize real simulated Tool attack and live Card references
        run: node simulation/twinleaf/simulator-card-isolation-audit.cjs
      - name: Check detached Simulator wrapper contract
        run: node --test tests/detached-simulator-hook.test.cjs
      - name: Compare detached Card references and attack behavior
        run: node simulation/twinleaf/detached-simulator-characterization.cjs
      - name: Compare source-locked fixed-seed game decisions with detached Simulator
        run: node simulation/twinleaf/detached-simulator-game-contrast.cjs
      - name: Detect speculative Card mutations during unmodified source-ranked bot decisions
        run: node simulation/twinleaf/natural-bot-card-leak-audit.cjs
      - name: Recheck three source-backed policy fixtures with detached Simulator
        run: node simulation/twinleaf/detached-simulator-existing-fixtures.cjs
      - name: Test source-prototype severing on cyclic object graphs
        run: node --test tests/prototype-safe-simulator-hook.test.cjs
      - name: Characterize a real Tool attack and one source-ranked game with prototype-safe clone
        run: node simulation/twinleaf/prototype-safe-simulator-characterization.cjs
      - name: Observe all live Card scalar and flat-array changes during source-ranked bot scoring
        run: node simulation/twinleaf/natural-bot-general-card-leak-audit.cjs
      - name: Compare detached Simulator across four predeclared exploratory seeds
        run: node simulation/twinleaf/detached-simulator-sensitivity-grid.cjs
      - name: Reproduce conditional Counter phantom-damage consequence
        run: node simulation/twinleaf/simulator-counter-phantom-damage.cjs
