name: Frozen bilateral source-policy release canary

on:
  workflow_dispatch:
    inputs:
      selected_joint_vip_v2:
        description: 'Run Agent22 selected joint VIP source-policy gate instead of frozen rank6'
        required: false
        type: boolean
        default: false
      rank11_turn32_lillie_v1:
        description: 'Run Agent22 rank11 candidate turn32 owner Lillie causal gate'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frozen-rank6-four-arm:
    if: ${{ inputs.selected_joint_vip_v2 != true && inputs.rank11_turn32_lillie_v1 != true && github.ref != 'refs/heads/agent41-joint-source-r5-r11-v1-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact run revision
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Select pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed profile and archive regression suite
        run: node --test tests/agent20-frozen-canary.test.cjs tests/agent20-frozen-physical-pair-audit.test.cjs tests/agent7-ghala-owner-zone-lineage.test.cjs tests/agent7-frozen-candidate-lillie-pass-clone.test.cjs
      - name: Check out pinned Twinleaf engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Audit real Store Guzma Hala payment zones in two seats and three cost counts
        run: node --test tests/agent7-ghala-owner-zone-native.test.cjs
      - name: Run one frozen configuration with two physical seats and both fixed 60s
        run: node simulation/evaluation/agent20-frozen-rank6-canary-v1.cjs
      - name: Replay immutable four-arm canary with detached candidate Lillie Pass probe
        run: node simulation/evaluation/agent7-frozen-rank6-lillie-pass-clone.cjs
      - name: Certify exact original source physical pair matching after native run
        run: node simulation/evaluation/agent20-frozen-physical-pair-audit.cjs
      - name: Preserve separate observer evidence without editing frozen source output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent7-frozen-rank6-lillie-pass-observer
          path: agent7-frozen-rank6-lillie-pass-clone-output.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve immutable selection and every attempt, including failed disposition
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-frozen-rank6-release-disposition
          path: agent20-frozen-rank6-canary-v1-output.json
          if-no-files-found: warn
          retention-days: 30

  agent41-joint-rank5-rank11:
    if: ${{ github.ref == 'refs/heads/agent41-joint-source-r5-r11-v1-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact selected release branch
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Load the independently pinned native Twinleaf engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify registration, exact code blobs, all options and native engine pin
        run: |
          node --check simulation/evaluation/agent41-joint-source-r5-r11-v1.cjs
          node --test tests/agent41-joint-source-r5-r11-v1.test.cjs tests/agent41-rank6-source-chain-native-audit.test.cjs
          node simulation/evaluation/agent41-joint-source-r5-r11-v1.cjs --inspect-only
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all eight original-source joint-policy native attempts
        run: node simulation/evaluation/agent41-joint-source-r5-r11-v1.cjs
      - name: Retain selected registration and all genuine native outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent41-rank5-rank11-joint-source-native-v1
          path: |
            agent41-joint-source-r5-r11-v1-output.json
            simulation/evaluation/agent41-joint-source-r5-r11-v1.json
          if-no-files-found: warn
          retention-days: 30

  agent22-selected-joint-vip-v2:
    if: ${{ inputs.selected_joint_vip_v2 == true && inputs.rank11_turn32_lillie_v1 != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact preregistered release revision
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Pin Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure source fingerprint and frozen-registration checks
        run: |
          node --check simulation/evaluation/agent22-joint-vip-selected-v2.cjs
          node --test tests/agent22-joint-vip-selected-v2.test.cjs tests/agent22-source-copy-choice-audit.test.cjs
          node simulation/evaluation/agent22-joint-vip-selected-v2.cjs --inspect-only
      - name: Fetch pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Preserve paper-cost and first-turn VIP component positive-negative tests
        run: node --test tests/agent4-secret-box-payment-native.test.cjs tests/agent9-battle-vip-owner-after-pass.test.cjs
      - name: Run selected joint rank5 rank11 rank6 and fresh source-panel policy
        run: node simulation/evaluation/agent22-joint-vip-selected-v2.cjs
      - name: Retain every selected cohort including failures and native caps
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent22-selected-joint-vip-v2-all-original-native-attempts
          path: agent22-joint-vip-v2-output.json
          if-no-files-found: warn
          retention-days: 30

  agent22-rank11-candidate-turn32-lillie:
    if: ${{ inputs.rank11_turn32_lillie_v1 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout preregistered native development revision
        uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate reply runner syntax
        run: node --check simulation/evaluation/agent22-rank11-candidate-turn32-lillie-v1.cjs
      - name: Initialize exact pinned Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Validate native-compiled owner-Lillie and prompt settlement
        run: node --test tests/agent12-actor-only-lillie-after-pass.test.cjs tests/agent7-prospective-candidate-lillie-after-pass.test.cjs tests/agent24-native-lillie-settlement-audit.test.cjs
      - name: Inspect exact pre-outcome original rank11 source and candidate registration
        run: node simulation/evaluation/agent22-rank11-candidate-turn32-lillie-v1.cjs --inspect-only
      - name: Execute exact same physical seed baseline and candidate-only turn32 Lillie
        run: node simulation/evaluation/agent22-rank11-candidate-turn32-lillie-v1.cjs
      - name: Preserve every original source trial and payment audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent22-rank11-candidate-turn32-lillie-both-original-sixties
          path: agent22-rank11-candidate-turn32-lillie-v1-output.json
          if-no-files-found: warn
          retention-days: 30
