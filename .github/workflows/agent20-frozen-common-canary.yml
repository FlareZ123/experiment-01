name: Frozen bilateral source-policy release canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-rank6-four-arm:
    if: ${{ github.ref != 'refs/heads/agent41-joint-source-r5-r11-v1-20261103' && github.ref != 'refs/heads/agent13-rank5-joint-transport-20261103' && github.ref != 'refs/heads/agent13-rank5-vip-after-pass-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact run revision
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Select pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed profile and archive regression suite
        run: node --test tests/agent20-frozen-canary.test.cjs tests/agent20-frozen-physical-pair-audit.test.cjs tests/agent7-ghala-owner-zone-lineage.test.cjs tests/agent7-frozen-candidate-lillie-pass-clone.test.cjs
      - name: Check out pinned Twinleaf engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Audit real Store Guzma Hala payment zones in two seats and three cost counts
        run: node --test tests/agent7-ghala-owner-zone-native.test.cjs
      - name: Run one frozen configuration with two physical seats and both fixed 60s
        run: node simulation/evaluation/agent20-frozen-rank6-canary-v1.cjs
      - name: Replay immutable four-arm canary with detached candidate Lillie Pass probe
        run: node simulation/evaluation/agent7-frozen-rank6-lillie-pass-clone.cjs
      - name: Certify exact original source physical pair matching after native run
        run: node simulation/evaluation/agent20-frozen-physical-pair-audit.cjs
      - name: Preserve separate observer evidence without editing frozen source output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent7-frozen-rank6-lillie-pass-observer
          path: agent7-frozen-rank6-lillie-pass-clone-output.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve immutable selection and every attempt, including failed disposition
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-frozen-rank6-release-disposition
          path: agent20-frozen-rank6-canary-v1-output.json
          if-no-files-found: warn
          retention-days: 30

  agent41-joint-rank5-rank11:
    if: ${{ github.ref == 'refs/heads/agent41-joint-source-r5-r11-v1-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact selected release branch
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Load the independently pinned native Twinleaf engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify registration, exact code blobs, all options and native engine pin
        run: |
          node --check simulation/evaluation/agent41-joint-source-r5-r11-v1.cjs
          node --test tests/agent41-joint-source-r5-r11-v1.test.cjs tests/agent41-rank6-source-chain-native-audit.test.cjs
          node simulation/evaluation/agent41-joint-source-r5-r11-v1.cjs --inspect-only
      - name: Install pinned native dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all eight original-source joint-policy native attempts
        run: node simulation/evaluation/agent41-joint-source-r5-r11-v1.cjs
      - name: Retain selected registration and all genuine native outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent41-rank5-rank11-joint-source-native-v1
          path: |
            agent41-joint-source-r5-r11-v1-output.json
            simulation/evaluation/agent41-joint-source-r5-r11-v1.json
          if-no-files-found: warn
          retention-days: 30

  rank5-joint-same-deal-transport:
    if: github.ref == 'refs/heads/agent13-rank5-joint-transport-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact preregistered experiment branch
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Select pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect immutable registration, test independent ablations, and check syntax
        run: |
          node --check simulation/evaluation/agent13-rank5-joint-transport-20261103.cjs
          node --test tests/agent13-rank5-joint-transport-20261103.test.cjs
          node simulation/evaluation/agent13-rank5-joint-transport-20261103.cjs --inspect-only > agent13-rank5-transport-preflight.json
      - name: Check out pinned upstream Twinleaf submodule
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install native engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all 16 registered native Store attempts without selection on outcomes
        run: node simulation/evaluation/agent13-rank5-joint-transport-20261103.cjs > agent13-rank5-transport-compact.json
      - name: Audit output denominator and original-source physical matching
        run: |
          node -e "const a=require('node:assert/strict');const x=require('./agent13-rank5-joint-transport-16arm.json');a.equal(x.attempts,16);a.equal(x.comparisons.length,4);a.equal(x.paperCompetitiveGamesQualified,0);console.log('RANK5_TRANSPORT',JSON.stringify({attempts:x.attempts,sameDeal:x.physicalVerifiedComparisons,rows:x.comparisons.map(r=>({id:r.trial.id,physical:r.physicalStatus,arms:r.evidence.map(e=>({mode:e.mode,attacks:e.sourceAttackDeclarations,copy:e.sourceOwnerTechnoBlastCopies.length,evolutions:e.sourceMewVmaxRoots.length,status:e.nativeStatus||e.endReason}))}))}));"
      - name: Retain all native rows, exact prior registration, errors and caps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-rank5-joint-transport-16arm
          path: |
            agent13-rank5-joint-transport-16arm.json
            agent13-rank5-transport-preflight.json
            agent13-rank5-transport-compact.json
            results/aichi-2026/registrations/agent13-rank5-joint-transport-20261103.json
          if-no-files-found: warn
          retention-days: 30
