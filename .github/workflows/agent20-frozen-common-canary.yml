name: Frozen bilateral source-policy release canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-rank6-four-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact run revision
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Select pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed profile and archive regression suite
        run: node --test tests/agent20-frozen-canary.test.cjs tests/agent20-frozen-physical-pair-audit.test.cjs tests/agent20-ghala-natural-custody-replay.test.cjs
      - name: Check out pinned Twinleaf engine
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Replay original four frozen arms with read-only owner-card custody observer
        run: node simulation/evaluation/agent20-ghala-natural-custody-replay.cjs
      - name: Certify exact original source physical pair matching after native run
        run: node simulation/evaluation/agent20-frozen-physical-pair-audit.cjs
      - name: Preserve immutable selection and every attempt, including failed disposition
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent20-ghala-owner-zone-live-replay
          path: |
            agent20-frozen-rank6-canary-v1-output.json
            agent20-ghala-natural-custody-replay-v1-output.json
          if-no-files-found: warn
          retention-days: 30
