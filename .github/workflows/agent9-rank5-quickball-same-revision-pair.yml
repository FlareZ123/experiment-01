name: Agent9 original rank5 same-revision Quick Ball OFF ON comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-rank5-same-revision-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner-only Quick Ball source and registered frozen attempts
        run: |
          node --check simulation/evaluation/agent9-rank5-quickball-same-revision-pair.cjs
          node --test tests/agent8-actor-quick-ball-root.test.cjs tests/agent9-rank5-original-trainer-source-plays.test.cjs
      - name: Resolve exact pinned Twinleaf Store
        run: |
          git submodule update --init --depth=1 vendor/twinleaf
          git -C vendor/twinleaf rev-parse HEAD
      - name: Install pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned native engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Execute all sixteen preregistered same-revision Quick Ball OFF and ON attempts
        run: |
          node simulation/evaluation/agent9-rank5-quickball-same-revision-pair.cjs > agent9-rank5-quickball-controlled-pair-16arm.json
          node -e "const a=require('node:assert/strict'),r=require('./agent9-rank5-quickball-controlled-pair-16arm.json');a.equal(r.nativeAttemptCount,16);a.equal(r.pairs.length,8);a.equal(r.competitiveQualifiedGames,0);console.log('SOURCE_QUICKBALL_CENSUS',JSON.stringify(r.pairs,null,2));"
      - name: Preserve every original source native result, including capped and errored
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent9-rank5-quickball-same-revision-pair-16arm
          path: agent9-rank5-quickball-controlled-pair-16arm.json
          if-no-files-found: warn
          retention-days: 30
