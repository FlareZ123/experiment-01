name: Agent31 preregistered rank1 Guzma Bench Basic Energy cost exposure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-rank1-basic-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Validate public text-bearing and variable printed Basic cost observer
        run: node --test tests/agent31-guzma-bench-cost-exposure.test.cjs tests/agent31-rank1-basic-cost-exposure-pair.test.cjs
      - name: Install exact pinned engine dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile exact pinned Twinleaf game
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Verify original roster, eight preregistered seeds, both seats and native pin
        run: node simulation/evaluation/agent31-rank1-basic-cost-exposure-pair.cjs --inspect-only
      - name: Run 32 control and read-only prospective native original rank1 replays
        env:
          AGENT31_RANK1_BASIC_COST_OUTPUT: ${{ runner.temp }}/agent31-rank1-basic-cost-native-32arm.json
        run: node simulation/evaluation/agent31-rank1-basic-cost-exposure-pair.cjs
      - name: Archive all source-deal, result, censor and cost-census receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent31-rank1-original-basic-cost-census-32arm
          path: ${{ runner.temp }}/agent31-rank1-basic-cost-native-32arm.json
          if-no-files-found: warn
          retention-days: 30
