name: Rank11 exclusive opening prospective mechanical census

on:
  workflow_dispatch:
    inputs:
      agent30_canonical_selected_seed:
        description: Postobserved rank11 two-candidate source-only native development fork
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  registered-source-frame:
    if: ${{ !inputs.agent30_canonical_selected_seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned Twinleaf source
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Validate seed, competition latch and outcome classifier
        run: node --test tests/rank11-exclusive-openers.test.cjs tests/rank11-exclusive-prospective-seeds.test.cjs tests/rank11-exclusive-trial-classification.test.cjs
      - name: Install Twinleaf pinned dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run all 128 registered authentic source openings
        run: node simulation/twinleaf/rank11-exclusive-prospective.cjs > rank11-exclusive-prospective-v1.json
      - name: Print denominator and both-actual-start qualification boundary
        run: node -e "const r=require('./rank11-exclusive-prospective-v1.json'); console.log(JSON.stringify({registration:r.registrationPath,total:r.actualAttempted,sourceFirst:r.sourceFirst,sourceSecond:r.sourceSecond,verified:r.sourceStartVerified,bySeat:r.byPhysicalSeat,classes:r.resultClassCounts,exceptions:r.exceptions,completed:r.ownerLineCompleted,competing:r.competingClaimAttempts,capped:r.cappedWithoutTerminal,competitiveQualifiedGames:0},null,2)); if(r.exceptions!==0||r.sourceStartVerified!==r.actualAttempted)process.exitCode=1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank11-exclusive-prospective-v1-unqualified
          path: rank11-exclusive-prospective-v1.json
          if-no-files-found: warn
          retention-days: 14

  canonical-selected-seed:
    if: ${{ inputs.agent30_canonical_selected_seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress authentic source deal, first player and selected trial identities
        run: node --test tests/agent30-rank11-source-setup-replay.test.cjs tests/agent30-rank11-eight-card-source-opportunity.test.cjs tests/agent30-pinned-starter-strata.test.cjs tests/agent30-rank11-canonical-exclusive-fork.test.cjs
      - name: Load pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - name: Install pinned server dependencies
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned Twinleaf
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Run both native source policies against both frozen candidates
        run: node simulation/evaluation/agent30-rank11-canonical-exclusive-fork.cjs > agent30-canonical-rank11-exclusive-fork.json
      - name: Summarize physical deal and policy evidence without competitive inference
        run: node -e "const r=require('./agent30-canonical-rank11-exclusive-fork.json');console.log(JSON.stringify({schema:r.schema,seed:r.seed,pairs:r.pairs,qualifiedCompetitiveGames:0},null,2))"
      - name: Archive full source-locked native control and treatment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent30-canonical-rank11-selected-seed-unqualified
          path: agent30-canonical-rank11-exclusive-fork.json
          if-no-files-found: warn
          retention-days: 14
