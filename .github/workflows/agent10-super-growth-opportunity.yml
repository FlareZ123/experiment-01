name: Agent10 Super Growth first-turn route screen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-sixty-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout fixed printed 60-card manifests
        uses: actions/checkout@v4
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seven source/route regression tests
        run: node --test tests/agent10-super-growth-first-turn.test.cjs tests/agent10-hybrid-supergrowth-first-turn.test.cjs
      - name: Reproduce one million shuffled deals per printed 60
        run: node scripts/agent10-super-growth-first-turn.cjs > agent10-supergrowth-million.json
      - name: Reproduce hybrid one-million 60-card screens
        run: node scripts/agent10-hybrid-supergrowth-first-turn.cjs > agent10-hybrid-million.json
      - name: Save reproducible summary
        uses: actions/upload-artifact@v4
        with:
          name: agent10-supergrowth-million
          path: |
            agent10-supergrowth-million.json
            agent10-hybrid-million.json
          retention-days: 30
