name: Validate balanced global field evidence gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact statistical dependency
        run: python -m pip install 'scipy>=1.14,<2'
      - name: Validate predeclared complete-field global null test
        run: python -m unittest discover -s tests -p 'test_aichi_balanced_global_gate.py' -v
