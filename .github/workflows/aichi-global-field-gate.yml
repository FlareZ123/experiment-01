name: Validate balanced global field evidence gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress fixed Tinkaton source-print screen and exact mulligan mathematics
        run: |
          python -m unittest discover -s tests -p 'test_agent7_tinkaton*.py' -v
          python -m unittest discover -s tests -p 'test_agent7_lillie*.py' -v
      - name: Install exact statistical and workflow parser dependencies
        run: python -m pip install 'scipy>=1.14,<2' 'PyYAML>=6,<7'
      - name: Validate canonical manual-dispatch syntax and input wiring
        run: python -m unittest discover -s tests -p 'test_workflow_dispatch_contract.py' -v
      - name: Validate predeclared complete-field global null test
        run: python -m unittest discover -s tests -p 'test_aichi_balanced_global_gate.py' -v
      - name: Validate conditional sharp all-win nulls for natural starts
        run: python -m unittest discover -s tests -p 'test_aichi_zero_loss_counts.py' -v
      - name: Validate balanced global inference from raw-game structure
        run: python -m unittest discover -s tests -p 'test_aichi_raw_global_gate.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit source deck fingerprints and missing-rank seal
        run: node --test tests/aichi_source_fingerprint_map.test.cjs
      - name: Preserve source-print rank10 versus rank6 last-Bench actor hold counterexample
        run: node --test tests/agent11-rank10-thorns-bench-hold.test.cjs
      - name: Validate native Store public clock binding to portable action trace
        run: node --test tests/native-clock-trace-adapter.test.cjs tests/native-clock-episodes.test.cjs tests/native-clock-python-bridge.test.cjs
      - name: Distinguish physical recipient witness from nonboard PlayCard target coordinates
        run: node --test tests/agent10-native-declared-target-census.test.cjs
      - name: Resolve rank4 and rank17 exact original Pokémon recipient flags
        run: node --test tests/agent10-original-printing-energy-flags.test.cjs
      - name: Check paper Raichu Electro Rain discard units
        run: node --test tests/agent10-raichu-electro-rain-energy-count.test.cjs
      - name: Check Electro Rain printed knockout Energy priority
        run: node --test tests/agent10-raichu-damage-breakpoint-before-attack.test.cjs
      - name: Verify conditional three-family Special Energy cost matching
        run: node --test tests/agent10-conditional-special-energy-cost.test.cjs
      - name: Check exact rank11 Crobat recipient frontier
        run: node --test tests/agent10-rank11-crobat-darkpatch-route.test.cjs
      - name: Reject seat-confounded zero-loss evidence under a four-cell estimand
        run: node --test tests/aichi-physical-seat-imbalance.test.cjs
      - name: Verify source-deck positioning census and corner cases
        run: node tests/aichi-positioning-census.test.cjs
      - name: Verify event-era Japanese origin of late English print proxies
        run: node --test tests/aichi-event-era-proxy-audit.test.cjs
      - name: Count all bilateral v2 attempts independently of observed pressure
        run: node --test tests/agent2-bilateral-unconditional-census.test.cjs tests/agent2-pressure-ledger-alignment.test.cjs
      - name: Verify registered 32-arm denominator, rank11 hand predicate and K0 Supporter rescue
        run: node --test tests/agent41-prospective-canonical-scout.test.cjs tests/agent41-rank11-direct-triple-probability.test.cjs tests/agent41-rank11-source-pass-supporter.test.cjs
      - name: Verify exact familywise allocation across future candidate attempts
        run: python -m unittest discover -s tests -p 'test_aichi_familywise_evidence.py' -v
