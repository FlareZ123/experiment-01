name: Agent50 original rank26 versus two fixed structural candidates

on:
  workflow_dispatch:
    inputs:
      flf69_native_only:
        description: 'Run native FLF69 direct/copy attack fidelity without 24-arm rank26 replay'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-first-fifth-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact pinned Twinleaf
        run: git submodule update --init --depth=1 vendor/twinleaf
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: vendor/twinleaf/ptcg-server/package-lock.json
      - name: Install pinned engine once
        working-directory: vendor/twinleaf/ptcg-server
        run: npm ci --no-audit --no-fund
      - name: Compile pinned engine
        working-directory: vendor/twinleaf/ptcg-server
        run: npm run compile
      - name: Fingerprint original FLF69 Mega Charizard exact-print native ambiguity
        run: node --test tests/agent50-agent5-flf69-identity-probe.native.test.cjs
      - name: Fail closed on FLF69 imported native attack semantics until paper hook installed
        run: node --test tests/agent5-flf69-resolver-paper-custody.native.test.cjs
      - name: Prove exact FLF69 Wild Blaze owner deck effect against duplicate native implementation
        run: node --test tests/agent5-flf69-wild-blaze-native.test.cjs
      - name: Screen all native text for wrong recipient of top-deck discard effects
        if: ${{ inputs.flf69_native_only }}
        run: node simulation/evaluation/agent5-native-top-deck-owner-screen.cjs > agent5-native-topdeck-owner-screen.json
      - name: Report source-code owner-destination discrepancies without treating them as game results
        if: ${{ inputs.flf69_native_only }}
        run: |
          node -e "const r=require('./agent5-native-topdeck-owner-screen.json');console.log('TOP_DECK_OWNER_STATIC_SCREEN',JSON.stringify({nativeInstances:r.nativeInstances,topdeckTextInstances:r.topdeckTextInstances,ownerTextWrongRecipient:r.flaggedOwnerTextOppositeReducer.map(x=>({fullName:x.fullName,set:x.set,number:x.number,print:x.printedOwnerTopDiscard})),opponentTextOwnRecipient:r.flaggedOpponentTextOwnerReducer.map(x=>({fullName:x.fullName,set:x.set,number:x.number,print:x.printedOpponentTopDiscard}))}))"
      - name: Archive source-code text-to-deck-custody risk screen
        if: ${{ inputs.flf69_native_only }}
        uses: actions/upload-artifact@v4
        with:
          name: agent5-native-top-deck-owner-screen
          path: agent5-native-topdeck-owner-screen.json
          if-no-files-found: error
          retention-days: 14
      - name: Census duplicate native implementations among 29 original sixty prints and fixed fifth candidate
        if: ${{ inputs.flf69_native_only }}
        run: node simulation/evaluation/agent5-original-native-identity-duplicate-census.cjs > agent5-original-native-exact-duplicate-census.json
      - name: Report affected original printings and candidate exact-name duplicate risks
        if: ${{ inputs.flf69_native_only }}
        run: |
          node -e "const a=require('node:assert/strict');const r=require('./agent5-original-native-exact-duplicate-census.json');a.equal(r.sourceOriginalDecks,29);a.equal(r.knownCandidateFlf69NativeDualCount,2);a.equal(r.competitiveQualifiedGames,0);console.log('EXACT_NATIVE_DUPLICATE_CENSUS',JSON.stringify({summary:r.counters,unmatched:r.originalUnmatchedPrintings,rows:r.duplicatePrintings.map(x=>({name:x.name,set:x.set,number:x.number,ranks:x.originalRanks,candidate:x.candidateV2,nativeCount:x.nativeCount,differentReducer:x.differingReducer,differentText:x.differingText}))}))"
      - name: Expose strict-name unmatched exact original and candidate printing keys for alias reconciliation
        if: ${{ inputs.flf69_native_only }}
        run: |
          node -e "const r=require('./agent5-original-native-exact-duplicate-census.json');console.log('UNMATCHED_NATIVE_ORIGINAL_PRINT_KEYS',JSON.stringify(r.unmatchedExactIdentity.map(x=>({name:x.name,set:x.set,number:x.number,sourceRanks:x.references.filter(y=>y.source==='aichi-original').map(y=>y.rank),candidate:x.references.some(y=>y.source==='agent5-adp-thorton-v2')}))))"
      - name: Archive all exact native duplicate fingerprints without competitive claims
        if: ${{ inputs.flf69_native_only }}
        uses: actions/upload-artifact@v4
        with:
          name: agent5-original-native-exact-identity-duplicate-census
          path: agent5-original-native-exact-duplicate-census.json
          if-no-files-found: error
          retention-days: 14
      - name: Check registered read-only v2.2 owner-root replay syntax
        run: node --check simulation/twinleaf/agent50-rank26-unlocked-fifth-candidate-owner-root-v22.cjs
      - name: Check actual original rank26 physical donor and Egg-to-Egg Damage Pump prompt on both seats
        run: node --test tests/agent50-rank26-egg-donor-damage-pump.native.test.cjs
      - name: Replay identical source seeds with read-only real owner hand and Bench counters
        if: ${{ ! inputs.flf69_native_only }}
        run: node simulation/twinleaf/agent50-rank26-unlocked-fifth-candidate-owner-root-v22.cjs > agent50-rank26-owner-root-access-v22.json
      - name: Report same-seed source owner held-Item access and action selection
        if: ${{ ! inputs.flf69_native_only }}
        run: |
          node -e "const r=require('./agent50-rank26-owner-root-access-v22.json');if(r.competitiveGames!==0||r.candidates.length!==2||r.authenticatedSourceDecks!==29)throw Error('Original rank26 data contract changed');for(const c of r.candidates){if(c.status==='NATIVE_EXACT_SIXTY_READY'&&c.attemptedArms!==24)throw Error('Incomplete source seat panel: '+c.id);console.log('CANDIDATE_NATIVE_RANK26',JSON.stringify(c))}console.log('TOTAL_DEVELOPMENT_ARMS',r.attempts.length)"
      - name: Archive every candidate resolver error and all original-source attempted arms
        if: ${{ always() && ! inputs.flf69_native_only }}
        uses: actions/upload-artifact@v4
        with:
          name: agent50-rank26-owner-root-access-original-v22
          path: agent50-rank26-owner-root-access-v22.json
          if-no-files-found: warn
          retention-days: 14
